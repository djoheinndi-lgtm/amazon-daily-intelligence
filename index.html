Amazon Business 客户停用。FBA 和 Retail offer eligibility 不受影响。\n- 我们怎么看：如果 US 站有 FBM、SFP、紧急自配送或 Amazon Business 客户订单，该项会影响 B2B 流量和 Buy Box/可售承接；纯 FBA ASIN 直接风险较低。相册、Portfolio Binder、补充页这类旺季订单若用 FBM 兜底，配送模板、承运商和 handling/transit time 设置会直接影响 BHDR。\n- 建议动作：US 运营今天进入 Seller Central > Account Health，查看 Business Hour Delivery Rate；再导出近 14 天 seller-fulfilled Amazon Business 订单，字段包含订单号、ASIN、承运商、配送模板、承诺送达日、实际送达日、是否在客户营业时间送达、BHDR 失败原因。负责人：US 运营；截止：2026-09-29 18:00。验证方式：BHDR >= 90% 或输出低于 90% 的订单清单；低于 90% 的 SKU 需要在 Shipping Settings Automation、Automated Handling Time、Amazon Buy Shipping、承运商切换中选择一项纠偏方案。\n\n## 已有事件的重要更新\n\n### Drewry WCI 9/24 更新：综合指数下降，但上海至洛杉矶继续上涨\n\n- 历史事件：drewry-wci-2026-09-03-4465-stable\n- 上次状态：2026-09-18 已推送 Drewry 2026-09-17 WCI 上涨 1% 至 USD 4,500/40ft，上海至洛杉矶 +5% 至 USD 7,712，上海至纽约 +7% 至 USD 10,394；要求使用 lane-level quote，不做全局涨价。\n- 本次新增变化：Drewry 2026-09-24 更新显示 WCI 综合指数下降 1% 至 USD 4,468/40ft；上海至洛杉矶上涨 2% 至 USD 7,838/40ft，上海至纽约维持 USD 10,373/40ft，亚洲至欧洲航线下跌，且 Drewry 提到下周已公告 15 个 blank sailings，高于本周 9 个。来源：Drewry World Container Index：https://www.drewry.co.uk/supply-chain-advisors/supply-chain-expertise/world-container-index-assessed-by-drewry\n- 相比上次变化：综合指数从上行转为小幅下降，但美西线继续上涨，说明 US 与 EU lane 方向分化更明显；不能用一个综合指数直接调整所有站点 landed cost。\n- 变化原因：亚洲至欧洲航线下跌拉低综合指数，同时航司通过 blank sailings 管理运力，Transpacific 仍有成本与舱位压力。\n- 行动是否需要调整：继续 P2 供应链复核，不做售价调整。供应链在 2026-10-02 前只复核未锁价、未开船、目标 ETA 在 2026-10-01 至 2026-10-20 的 US/EU 货件，字段包含出运港、目的港、承运商、quote validity、是否 blank sailing 影响、预计到港/入仓、ASIN 毛利率；若美西报价较模型高出 3% 以上，再反馈财务更新活动毛利测算。\n\n## 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n|---|---|---|---|---|---|---|\n| P1 | 查看 Account Health 的 Business Hour Delivery Rate，并导出近 14 天 seller-fulfilled Amazon Business 订单失败明细 | US | US 运营 | 2026-09-29 | BHDR >= 90%，或输出低于 90% 的订单、承运商、模板和纠偏动作清单 | 2026-09-30 |\n| P1 | 完成 Product Bundling 风险清单第一版，筛选 bundle/kit/set/multipack/refill-page 相关 ASIN | US | Listing/合规 | 2026-09-28 | 清单含 ASIN、品牌、包装方、LOA、FBA 库存、可清仓时间和处置路径 | 2026-10-15 |\n| P1 | 复查 PBDD 主推池，逐个核对 Deals、Coupons、Prime Exclusive Discounts、可售库存、reserved units、FC receiving 和广告日预算 | US/UK/DE/FR/IT/ES | 运营/PPC | 2026-09-28 | 每个主推 ASIN 有促销状态、库存覆盖天数、预算覆盖天数、异常处理方式和截图/后台链接 | 2026-10-02 |\n| P2 | 复核未锁价 Q4 海运货件的 lane-level quote，区分 US 美西/美东与 EU Rotterdam/Genoa | US/EU/UK | 供应链/财务 | 2026-10-02 | 未锁价货件清单含最新报价、quote validity、ETA、是否受 blank sailing 影响；超过模型 +3% 标红 | 2026-10-02 |\n| P2 | 继续准备 Amazon Ads AI 工具小范围人工批准测试表 | US | PPC | 2026-09-30 | 仅选择库存覆盖 30 天以上、毛利达标、ACOS 低于目标 +10% 的 3 个 campaign | 2026-10-03 |\n\n## 持续关注\n\n- 事项：Amazon Business BHDR。当前状态：US seller-fulfilled Amazon Business 订单要求 2026-09-30 进入首次通知节点。下次复查日期：2026-09-30。触发升级条件：BHDR \u003c 90%、失败订单集中在某承运商/配送模板、或 2026-10-30 前无法改善。\n- 事项：Product Bundling 新要求。当前状态：2027-01-11 生效口径已推送，风险清单第一版应在节后工作日 2026-09-28 闭环。下次复查日期：2026-10-15。触发升级条件：Account Health 出现 bundle listing violation、ASIN 被抑制、供应商无法提供 LOA、或补充页/套装类 ASIN 被判为非原厂包装。\n- 事项：PBDD 主推池。当前状态：节后进入活动前执行复查。下次复查日期：2026-10-02。触发升级条件：Deal/Coupon/PED 不可执行、可售库存低于预计活动销量 1.3 倍、reserved units 异常、或广告预算覆盖低于 2 天。\n- 事项：USPS 旺季包裹价格。当前状态：官方价格文件 Final，Amazon Buy Shipping 是否完全同步仍需账号试算。下次复查日期：2026-10-05。触发升级条件：Buy Shipping 显示的 10/4 后价格高于模型 +3%、FBM 应急订单毛利为负、或 USPS/PRC 再发布修订文件。\n- 事项：EIA US 柴油价。当前状态：2026-09-22 数据仍为最新，下一次官方发布时间为 2026-09-29。下次复查日期：2026-09-29。触发升级条件：柴油价继续周环比上涨、承运商燃油附加费超过模型 +3%、或 US 10 月入仓报价上调。\n- 事项：EU Customs Reform 小包 handling fee。当前状态：2026-11-01 前引入，金额待 delegated act。下次复查日期：2026-10-15。触发升级条件：欧盟公布 fee 金额、货代报价新增该费用、或 DE/FR/IT/ES 清关资料字段被退回。\n\n## 情报边界与可信度\n\n本次窗口覆盖 2026-09-24 09:04:46 至 2026-09-28 10:06:37（Asia/Shanghai），并覆盖 2026-09-25 至 2026-09-27 中秋假期空档，同时补查长期索引中 PBDD、Product Bundling、USPS、EIA、EU Customs Reform、Amazon Ads AI 工具、Drewry WCI 等持续关注事项。复查来源约 21 个，其中官方/监管/一手来源 15 个，包括中国政府网/国务院办公厅、Amazon Seller Forums、Amazon Seller Central Help、Amazon Ads、About Amazon、USPS、USPS Postal Explorer、EIA、European Commission、CPSC、GOV.UK OPSS、USTR、CBP、Drewry、NRF；非官方或行业辅助来源 6 个，仅用于发现线索和排重。纳入日报的新事件 1 条，纳入已有事件重要更新 1 条；仍待确认事项 6 条：BHDR 账号适用范围、PBDD 各账号实际可执行状态、Product Bundling 账号侧风险提醒、USPS 价格在 Buy Shipping 的账号侧同步、EU handling fee 金额、Amazon Ads 新工具入口。\n\n今天排除了 Amazon Accelerate / unBoxed 参会与内容预热、重复的 Prime Big Deal Days 零售宣传、无新增后台动作的 AI shopping/AI ads 评论、NRF 2026-09-09 进口峰值旧信号、与相册/纸品/礼品/收纳/拼图配件产品线无直接关系的 CPSC/OPSS 召回，以及没有 USTR/CBP/European Commission/Amazon 官方确认的新关税传闻。工作日门禁来源：中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（国办发明电〔2025〕7号，https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/2025/issue_12406/202511/content_7048922.html）。文件显示 2026 年中秋节为 2026-09-25 至 2026-09-27 放假，共 3 天；国庆节为 2026-10-01 至 2026-10-07 放假，2026-09-20 和 2026-10-10 上班。因此 2026-09-28 为中秋节后大陆法定工作日，但不是本周最后一个大陆法定工作日。\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-28\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-28\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报增量日报｜2026-09-28\u003c/h1>\n\u003ch2>今日判断\u003c/h2>\n\u003cp>今日没有发现 Amazon US/UK/DE/FR/IT/ES 发布新的全量强制 Listing、图片、A+、Search Terms、属性、变体或 FBA 费用规则。今天最需要处理的是两个近截止日事项：US Amazon Business seller-fulfilled 订单的 Business Hour Delivery Rate 要求将在 2026-09-30 进入首次通知节点；Product Bundling 风险清单原定 2026-09-25，但当天为中国大陆中秋假期，今天应完成节后闭环。供应链侧 Drewry 2026-09-24 WCI 更新显示综合指数小幅下降，但上海至洛杉矶仍上涨 2%，PBDD/Q4 美线补货不能只看综合指数判断成本放松。今天不是本周最后一个中国大陆法定工作日，本周周报应在 2026-09-30 生成。\u003c/p>\n\u003ch2>优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>影响站点\u003c/th>\n\u003cth>影响模块\u003c/th>\n\u003cth>截止/生效日期\u003c/th>\n\u003cth>今天是否需要动作\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>Amazon Business BHDR 90% 要求进入 9/30 首次通知节点\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>FBM/Amazon Business/Account Health/配送模板\u003c/td>\n\u003ctd>2026-09-30；未改善节点 2026-10-30\u003c/td>\n\u003ctd>是，筛选 US seller-fulfilled Amazon Business 订单并核对 BHDR\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>Product Bundling 风险清单节后闭环\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Listing/合规/套装/补充页/multipack\u003c/td>\n\u003ctd>原截止 2026-09-25；节后工作日 2026-09-28\u003c/td>\n\u003ctd>是，今天交付第一版风险清单\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>PBDD 主推池节后执行复查\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES\u003c/td>\n\u003ctd>Deals/Coupons/PED/库存/广告预算\u003c/td>\n\u003ctd>2026-09-28；PBDD 2026-10-06 至 2026-10-07\u003c/td>\n\u003ctd>是，复查主推池、兜底促销、库存和预算承接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Drewry WCI 9/24 更新：综合下降但美西仍涨\u003c/td>\n\u003ctd>US/EU/UK\u003c/td>\n\u003ctd>海运报价/ETA/landed cost\u003c/td>\n\u003ctd>发布日期 2026-09-24；下次复查 2026-10-02\u003c/td>\n\u003ctd>是，仅对未锁价货件复核实际报价\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>今日新情报\u003c/h2>\n\u003ch3>US Amazon Business seller-fulfilled 订单将纳入 BHDR 90% 要求\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P1\u003c/li>\n\u003cli>【站点】US\u003c/li>\n\u003cli>【发布日期】Amazon Seller Forums 页面未显示精确发布日期；本自动化首次发现并纳入索引日期为 2026-09-28\u003c/li>\n\u003cli>【生效日期】2026-09-30 首次通知；2026-10-30 未改善可能影响 Amazon Business 客户可见性\u003c/li>\n\u003cli>【信息状态】Amazon Seller Forums 正式公告 / 账号适用范围需后台确认\u003c/li>\n\u003cli>【来源】Amazon Seller Forums / News_Amazon：\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/57222b70-40df-4574-aa0f-9f815c197987\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/seller-forums/discussions/t/57222b70-40df-4574-aa0f-9f815c197987\u003c/a>\u003c/li>\n\u003cli>发生了什么：Amazon 将对 US seller-fulfilled 发往 Amazon Business 客户的订单引入 Business Hour Delivery Rate 要求，要求 14 天滚动 BHDR 达到 90% 或以上。2026-09-30 若低于 90%，Amazon 将通知卖家并给出改进建议；若到 2026-10-30 仍未改善，seller-fulfilled offer 可能对 Amazon Business 客户停用。FBA 和 Retail offer eligibility 不受影响。\u003c/li>\n\u003cli>我们怎么看：如果 US 站有 FBM、SFP、紧急自配送或 Amazon Business 客户订单，该项会影响 B2B 流量和 Buy Box/可售承接；纯 FBA ASIN 直接风险较低。相册、Portfolio Binder、补充页这类旺季订单若用 FBM 兜底，配送模板、承运商和 handling/transit time 设置会直接影响 BHDR。\u003c/li>\n\u003cli>建议动作：US 运营今天进入 Seller Central &gt; Account Health，查看 Business Hour Delivery Rate；再导出近 14 天 seller-fulfilled Amazon Business 订单，字段包含订单号、ASIN、承运商、配送模板、承诺送达日、实际送达日、是否在客户营业时间送达、BHDR 失败原因。负责人：US 运营；截止：2026-09-29 18:00。验证方式：BHDR &gt;= 90% 或输出低于 90% 的订单清单；低于 90% 的 SKU 需要在 Shipping Settings Automation、Automated Handling Time、Amazon Buy Shipping、承运商切换中选择一项纠偏方案。\u003c/li>\n\u003c/ul>\n\u003ch2>已有事件的重要更新\u003c/h2>\n\u003ch3>Drewry WCI 9/24 更新：综合指数下降，但上海至洛杉矶继续上涨\u003c/h3>\n\u003cul>\n\u003cli>历史事件：drewry-wci-2026-09-03-4465-stable\u003c/li>\n\u003cli>上次状态：2026-09-18 已推送 Drewry 2026-09-17 WCI 上涨 1% 至 USD 4,500/40ft，上海至洛杉矶 +5% 至 USD 7,712，上海至纽约 +7% 至 USD 10,394；要求使用 lane-level quote，不做全局涨价。\u003c/li>\n\u003cli>本次新增变化：Drewry 2026-09-24 更新显示 WCI 综合指数下降 1% 至 USD 4,468/40ft；上海至洛杉矶上涨 2% 至 USD 7,838/40ft，上海至纽约维持 USD 10,373/40ft，亚洲至欧洲航线下跌，且 Drewry 提到下周已公告 15 个 blank sailings，高于本周 9 个。来源：Drewry World Container Index：\u003ca href=\"https://www.drewry.co.uk/supply-chain-advisors/supply-chain-expertise/world-container-index-assessed-by-drewry\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.drewry.co.uk/supply-chain-advisors/supply-chain-expertise/world-container-index-assessed-by-drewry\u003c/a>\u003c/li>\n\u003cli>相比上次变化：综合指数从上行转为小幅下降，但美西线继续上涨，说明 US 与 EU lane 方向分化更明显；不能用一个综合指数直接调整所有站点 landed cost。\u003c/li>\n\u003cli>变化原因：亚洲至欧洲航线下跌拉低综合指数，同时航司通过 blank sailings 管理运力，Transpacific 仍有成本与舱位压力。\u003c/li>\n\u003cli>行动是否需要调整：继续 P2 供应链复核，不做售价调整。供应链在 2026-10-02 前只复核未锁价、未开船、目标 ETA 在 2026-10-01 至 2026-10-20 的 US/EU 货件，字段包含出运港、目的港、承运商、quote validity、是否 blank sailing 影响、预计到港/入仓、ASIN 毛利率；若美西报价较模型高出 3% 以上，再反馈财务更新活动毛利测算。\u003c/li>\n\u003c/ul>\n\u003ch2>今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>查看 Account Health 的 Business Hour Delivery Rate，并导出近 14 天 seller-fulfilled Amazon Business 订单失败明细\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>US 运营\u003c/td>\n\u003ctd>2026-09-29\u003c/td>\n\u003ctd>BHDR &gt;= 90%，或输出低于 90% 的订单、承运商、模板和纠偏动作清单\u003c/td>\n\u003ctd>2026-09-30\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>完成 Product Bundling 风险清单第一版，筛选 bundle/kit/set/multipack/refill-page 相关 ASIN\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Listing/合规\u003c/td>\n\u003ctd>2026-09-28\u003c/td>\n\u003ctd>清单含 ASIN、品牌、包装方、LOA、FBA 库存、可清仓时间和处置路径\u003c/td>\n\u003ctd>2026-10-15\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>复查 PBDD 主推池，逐个核对 Deals、Coupons、Prime Exclusive Discounts、可售库存、reserved units、FC receiving 和广告日预算\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES\u003c/td>\n\u003ctd>运营/PPC\u003c/td>\n\u003ctd>2026-09-28\u003c/td>\n\u003ctd>每个主推 ASIN 有促销状态、库存覆盖天数、预算覆盖天数、异常处理方式和截图/后台链接\u003c/td>\n\u003ctd>2026-10-02\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>复核未锁价 Q4 海运货件的 lane-level quote，区分 US 美西/美东与 EU Rotterdam/Genoa\u003c/td>\n\u003ctd>US/EU/UK\u003c/td>\n\u003ctd>供应链/财务\u003c/td>\n\u003ctd>2026-10-02\u003c/td>\n\u003ctd>未锁价货件清单含最新报价、quote validity、ETA、是否受 blank sailing 影响；超过模型 +3% 标红\u003c/td>\n\u003ctd>2026-10-02\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>继续准备 Amazon Ads AI 工具小范围人工批准测试表\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>PPC\u003c/td>\n\u003ctd>2026-09-30\u003c/td>\n\u003ctd>仅选择库存覆盖 30 天以上、毛利达标、ACOS 低于目标 +10% 的 3 个 campaign\u003c/td>\n\u003ctd>2026-10-03\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>持续关注\u003c/h2>\n\u003cul>\n\u003cli>事项：Amazon Business BHDR。当前状态：US seller-fulfilled Amazon Business 订单要求 2026-09-30 进入首次通知节点。下次复查日期：2026-09-30。触发升级条件：BHDR &lt; 90%、失败订单集中在某承运商/配送模板、或 2026-10-30 前无法改善。\u003c/li>\n\u003cli>事项：Product Bundling 新要求。当前状态：2027-01-11 生效口径已推送，风险清单第一版应在节后工作日 2026-09-28 闭环。下次复查日期：2026-10-15。触发升级条件：Account Health 出现 bundle listing violation、ASIN 被抑制、供应商无法提供 LOA、或补充页/套装类 ASIN 被判为非原厂包装。\u003c/li>\n\u003cli>事项：PBDD 主推池。当前状态：节后进入活动前执行复查。下次复查日期：2026-10-02。触发升级条件：Deal/Coupon/PED 不可执行、可售库存低于预计活动销量 1.3 倍、reserved units 异常、或广告预算覆盖低于 2 天。\u003c/li>\n\u003cli>事项：USPS 旺季包裹价格。当前状态：官方价格文件 Final，Amazon Buy Shipping 是否完全同步仍需账号试算。下次复查日期：2026-10-05。触发升级条件：Buy Shipping 显示的 10/4 后价格高于模型 +3%、FBM 应急订单毛利为负、或 USPS/PRC 再发布修订文件。\u003c/li>\n\u003cli>事项：EIA US 柴油价。当前状态：2026-09-22 数据仍为最新，下一次官方发布时间为 2026-09-29。下次复查日期：2026-09-29。触发升级条件：柴油价继续周环比上涨、承运商燃油附加费超过模型 +3%、或 US 10 月入仓报价上调。\u003c/li>\n\u003cli>事项：EU Customs Reform 小包 handling fee。当前状态：2026-11-01 前引入，金额待 delegated act。下次复查日期：2026-10-15。触发升级条件：欧盟公布 fee 金额、货代报价新增该费用、或 DE/FR/IT/ES 清关资料字段被退回。\u003c/li>\n\u003c/ul>\n\u003ch2>情报边界与可信度\u003c/h2>\n\u003cp>本次窗口覆盖 2026-09-24 09:04:46 至 2026-09-28 10:06:37（Asia/Shanghai），并覆盖 2026-09-25 至 2026-09-27 中秋假期空档，同时补查长期索引中 PBDD、Product Bundling、USPS、EIA、EU Customs Reform、Amazon Ads AI 工具、Drewry WCI 等持续关注事项。复查来源约 21 个，其中官方/监管/一手来源 15 个，包括中国政府网/国务院办公厅、Amazon Seller Forums、Amazon Seller Central Help、Amazon Ads、About Amazon、USPS、USPS Postal Explorer、EIA、European Commission、CPSC、GOV.UK OPSS、USTR、CBP、Drewry、NRF；非官方或行业辅助来源 6 个，仅用于发现线索和排重。纳入日报的新事件 1 条，纳入已有事件重要更新 1 条；仍待确认事项 6 条：BHDR 账号适用范围、PBDD 各账号实际可执行状态、Product Bundling 账号侧风险提醒、USPS 价格在 Buy Shipping 的账号侧同步、EU handling fee 金额、Amazon Ads 新工具入口。\u003c/p>\n\u003cp>今天排除了 Amazon Accelerate / unBoxed 参会与内容预热、重复的 Prime Big Deal Days 零售宣传、无新增后台动作的 AI shopping/AI ads 评论、NRF 2026-09-09 进口峰值旧信号、与相册/纸品/礼品/收纳/拼图配件产品线无直接关系的 CPSC/OPSS 召回，以及没有 USTR/CBP/European Commission/Amazon 官方确认的新关税传闻。工作日门禁来源：中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（国办发明电〔2025〕7号，\u003ca href=\"https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/2025/issue_12406/202511/content_7048922.html）。文件显示\" target=\"_blank\" rel=\"noopener noreferrer\">https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/2025/issue_12406/202511/content_7048922.html）。文件显示\u003c/a> 2026 年中秋节为 2026-09-25 至 2026-09-27 放假，共 3 天；国庆节为 2026-10-01 至 2026-10-07 放假，2026-09-20 和 2026-10-10 上班。因此 2026-09-28 为中秋节后大陆法定工作日，但不是本周最后一个大陆法定工作日。\u003c/p>\n\u003cp>生产链接：\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-28\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-09-28", "text": "### US Amazon Business seller-fulfilled 订单将纳入 BHDR 90% 要求\n\n- 【影响等级】P1\n- 【站点】US\n- 【发布日期】Amazon Seller Forums 页面未显示精确发布日期；本自动化首次发现并纳入索引日期为 2026-09-28\n- 【生效日期】2026-09-30 首次通知；2026-10-30 未改善可能影响 Amazon Business 客户可见性\n- 【信息状态】Amazon Seller Forums 正式公告 / 账号适用范围需后台确认\n- 【来源】Amazon Seller Forums / News_Amazon：https://sellercentral.amazon.com/seller-forums/discussions/t/57222b70-40df-4574-aa0f-9f815c197987\n- 发生了什么：Amazon 将对 US seller-fulfilled 发往 Amazon Business 客户的订单引入 Business Hour Delivery Rate 要求，要求 14 天滚动 BHDR 达到 90% 或以上。2026-09-30 若低于 90%，Amazon 将通知卖家并给出改进建议；若到 2026-10-30 仍未改善，seller-fulfilled offer 可能对 Amazon Business 客户停用。FBA 和 Retail offer eligibility 不受影响。\n- 我们怎么看：如果 US 站有 FBM、SFP、紧急自配送或 Amazon Business 客户订单，该项会影响 B2B 流量和 Buy Box/可售承接；纯 FBA ASIN 直接风险较低。相册、Portfolio Binder、补充页这类旺季订单若用 FBM 兜底，配送模板、承运商和 handling/transit time 设置会直接影响 BHDR。\n- 建议动作：US 运营今天进入 Seller Central > Account Health，查看 Business Hour Delivery Rate；再导出近 14 天 seller-fulfilled Amazon Business 订单，字段包含订单号、ASIN、承运商、配送模板、承诺送达日、实际送达日、是否在客户营业时间送达、BHDR 失败原因。负责人：US 运营；截止：2026-09-29 18:00。验证方式：BHDR >= 90% 或输出低于 90% 的订单清单；低于 90% 的 SKU 需要在 Shipping Settings Automation、Automated Handling Time、Amazon Buy Shipping、承运商切换中选择一项纠偏方案。\n\n", "title": "US Amazon Business seller-fulfilled 订单将纳入 BHDR 90% 要求", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-28\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-28\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>US Amazon Business seller-fulfilled 订单将纳入 BHDR 90% 要求\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P1\u003c/li>\n\u003cli>【站点】US\u003c/li>\n\u003cli>【发布日期】Amazon Seller Forums 页面未显示精确发布日期；本自动化首次发现并纳入索引日期为 2026-09-28\u003c/li>\n\u003cli>【生效日期】2026-09-30 首次通知；2026-10-30 未改善可能影响 Amazon Business 客户可见性\u003c/li>\n\u003cli>【信息状态】Amazon Seller Forums 正式公告 / 账号适用范围需后台确认\u003c/li>\n\u003cli>【来源】Amazon Seller Forums / News_Amazon：\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/57222b70-40df-4574-aa0f-9f815c197987\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/seller-forums/discussions/t/57222b70-40df-4574-aa0f-9f815c197987\u003c/a>\u003c/li>\n\u003cli>发生了什么：Amazon 将对 US seller-fulfilled 发往 Amazon Business 客户的订单引入 Business Hour Delivery Rate 要求，要求 14 天滚动 BHDR 达到 90% 或以上。2026-09-30 若低于 90%，Amazon 将通知卖家并给出改进建议；若到 2026-10-30 仍未改善，seller-fulfilled offer 可能对 Amazon Business 客户停用。FBA 和 Retail offer eligibility 不受影响。\u003c/li>\n\u003cli>我们怎么看：如果 US 站有 FBM、SFP、紧急自配送或 Amazon Business 客户订单，该项会影响 B2B 流量和 Buy Box/可售承接；纯 FBA ASIN 直接风险较低。相册、Portfolio Binder、补充页这类旺季订单若用 FBM 兜底，配送模板、承运商和 handling/transit time 设置会直接影响 BHDR。\u003c/li>\n\u003cli>建议动作：US 运营今天进入 Seller Central &gt; Account Health，查看 Business Hour Delivery Rate；再导出近 14 天 seller-fulfilled Amazon Business 订单，字段包含订单号、ASIN、承运商、配送模板、承诺送达日、实际送达日、是否在客户营业时间送达、BHDR 失败原因。负责人：US 运营；截止：2026-09-29 18:00。验证方式：BHDR &gt;= 90% 或输出低于 90% 的订单清单；低于 90% 的 SKU 需要在 Shipping Settings Automation、Automated Handling Time、Amazon Buy Shipping、承运商切换中选择一项纠偏方案。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-28\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-28", "text": "### Drewry WCI 9/24 更新：综合指数下降，但上海至洛杉矶继续上涨\n\n- 历史事件：drewry-wci-2026-09-03-4465-stable\n- 上次状态：2026-09-18 已推送 Drewry 2026-09-17 WCI 上涨 1% 至 USD 4,500/40ft，上海至洛杉矶 +5% 至 USD 7,712，上海至纽约 +7% 至 USD 10,394；要求使用 lane-level quote，不做全局涨价。\n- 本次新增变化：Drewry 2026-09-24 更新显示 WCI 综合指数下降 1% 至 USD 4,468/40ft；上海至洛杉矶上涨 2% 至 USD 7,838/40ft，上海至纽约维持 USD 10,373/40ft，亚洲至欧洲航线下跌，且 Drewry 提到下周已公告 15 个 blank sailings，高于本周 9 个。来源：Drewry World Container Index：https://www.drewry.co.uk/supply-chain-advisors/supply-chain-expertise/world-container-index-assessed-by-drewry\n- 相比上次变化：综合指数从上行转为小幅下降，但美西线继续上涨，说明 US 与 EU lane 方向分化更明显；不能用一个综合指数直接调整所有站点 landed cost。\n- 变化原因：亚洲至欧洲航线下跌拉低综合指数，同时航司通过 blank sailings 管理运力，Transpacific 仍有成本与舱位压力。\n- 行动是否需要调整：继续 P2 供应链复核，不做售价调整。供应链在 2026-10-02 前只复核未锁价、未开船、目标 ETA 在 2026-10-01 至 2026-10-20 的 US/EU 货件，字段包含出运港、目的港、承运商、quote validity、是否 blank sailing 影响、预计到港/入仓、ASIN 毛利率；若美西报价较模型高出 3% 以上，再反馈财务更新活动毛利测算。\n\n", "title": "Drewry WCI 9/24 更新：综合指数下降，但上海至洛杉矶继续上涨", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-28\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-28\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>Drewry WCI 9/24 更新：综合指数下降，但上海至洛杉矶继续上涨\u003c/h3>\n\u003cul>\n\u003cli>历史事件：drewry-wci-2026-09-03-4465-stable\u003c/li>\n\u003cli>上次状态：2026-09-18 已推送 Drewry 2026-09-17 WCI 上涨 1% 至 USD 4,500/40ft，上海至洛杉矶 +5% 至 USD 7,712，上海至纽约 +7% 至 USD 10,394；要求使用 lane-level quote，不做全局涨价。\u003c/li>\n\u003cli>本次新增变化：Drewry 2026-09-24 更新显示 WCI 综合指数下降 1% 至 USD 4,468/40ft；上海至洛杉矶上涨 2% 至 USD 7,838/40ft，上海至纽约维持 USD 10,373/40ft，亚洲至欧洲航线下跌，且 Drewry 提到下周已公告 15 个 blank sailings，高于本周 9 个。来源：Drewry World Container Index：\u003ca href=\"https://www.drewry.co.uk/supply-chain-advisors/supply-chain-expertise/world-container-index-assessed-by-drewry\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.drewry.co.uk/supply-chain-advisors/supply-chain-expertise/world-container-index-assessed-by-drewry\u003c/a>\u003c/li>\n\u003cli>相比上次变化：综合指数从上行转为小幅下降，但美西线继续上涨，说明 US 与 EU lane 方向分化更明显；不能用一个综合指数直接调整所有站点 landed cost。\u003c/li>\n\u003cli>变化原因：亚洲至欧洲航线下跌拉低综合指数，同时航司通过 blank sailings 管理运力，Transpacific 仍有成本与舱位压力。\u003c/li>\n\u003cli>行动是否需要调整：继续 P2 供应链复核，不做售价调整。供应链在 2026-10-02 前只复核未锁价、未开船、目标 ETA 在 2026-10-01 至 2026-10-20 的 US/EU 货件，字段包含出运港、目的港、承运商、quote validity、是否 blank sailing 影响、预计到港/入仓、ASIN 毛利率；若美西报价较模型高出 3% 以上，再反馈财务更新活动毛利测算。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-28\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}]}, {"date": "2026-09-24", "text": "# 亚马逊及海外市场情报增量日报｜2026-09-24\n\n## 今日判断\n\n今日没有发现 Amazon US/UK/DE/FR/IT/ES 发布新的全量强制 Seller Central Listing、图片、A+、Search Terms、属性、变体或 FBA 费用规则。今天的重大运营变化来自已收录事项：USPS 2026 旺季临时价格文件已转为 Final，EIA 9 月 22 日发布的柴油价继续上行，EU Customs Reform 对小包 handling fee 的 2026-11-01 前引入节点更明确。最高优先级仍是 PBDD 主推 ASIN 的促销、库存和预算异常关闭，重点站点为 US/UK/DE/FR/IT/ES；最紧急截止日是今天 2026-09-24 完成节前最后一轮复核。由于 2026-09-25 至 2026-09-27 为中国大陆中秋法定假期，今天也是本周最后一个大陆法定工作日，需要追加周度合并报告。\n\n## 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n|---|---|---|---|---|---|\n| P1 | PBDD 节前最后一轮异常关闭 | US/UK/DE/FR/IT/ES | Deals/Coupons/PED/库存/广告预算 | 2026-09-24；PBDD 2026-10-06 至 2026-10-07 | 是，今天完成主推 ASIN 促销可执行与库存承接复核 |\n| P2 | USPS 旺季临时包裹价格文件已 Final | US | FBM/Buy Shipping/利润测算 | 2026-10-04 至 2027-01-17 生效 | 是，更新 US FBM/应急自配送成本模型 |\n| P2 | EIA 柴油价继续上行 | US | 头程/卡车派送/3PL 报价/促销毛利 | 数据发布日期 2026-09-22；下次 2026-09-29 | 是，用实际报价复核 Q4 毛利缓冲 |\n| P2 | EU 小包 handling fee 节点明确 | DE/FR/IT/ES | EU 清关/landed cost/ERP 字段 | 2026-11-01 前引入；金额待 delegated act | 是，补充 EU 小包费用字段和货代确认项 |\n\n## 今日新情报\n\n今日无符合增量标准的首次发现新事件。检索到的 Amazon Accelerate、Prime Big Deal Days 零售预热、AI shopping 评论和行业转载均未形成新的 Seller Central 后台动作或新增运营事实。\n\n## 已有事件的重要更新\n\n### USPS 2026 旺季临时包裹价格文件从待确认转为 Final\n\n- 历史事件：usps-2026-holiday-temporary-package-price-adjustment\n- 上次状态：已知 USPS 发布 2026 旺季临时包裹价格调整，适用 2026-10-04 至 2027-01-17，但 prior push 仍按“待 PRC/Buy Shipping 确认”处理。\n- 本次新增变化：Postal Explorer 的 Time-Limited 2026 Price File、CSV Price Files 和 Notice 123 均显示 Final，修订日期为 2026-09-18；适用窗口仍为 2026-10-04 至 2027-01-17。来源：USPS Postal Explorer https://pe.usps.com/PriceChange/Index；USPS 新闻稿 https://about.usps.com/newsroom/national-releases/2026/0825-usps-announces-temporary-price-change-for-2026-holiday-shipping-season.htm\n- 相比上次变化：从“价格调整已公告但需等待最终价格文件/Buy Shipping 体现”升级为“USPS 官方价格文件已最终化，可进入 US FBM 与应急自配送测算”。\n- 变化原因：USPS 将 time-limited price file 和 Notice 123 状态更新为 Final，价格文件可用于成本模型和自配送兜底方案。\n- 行动是否需要调整：升级为 P2 成本模型动作。US 运营/财务在 2026-09-26 前更新 1 lb、2 lb、3 lb、5 lb 和相册/Portfolio Binder 常见箱规的 USPS Ground Advantage、Priority Mail、Parcel Select 费用；路径：Seller Central > Orders > Buy Shipping 试算，或 USPS price file 导入成本表。验收标准：输出“当前运费、10/4 后运费、差额、是否影响 Coupon/PED 毛利、是否需要改用 FBA/3PL”的清单。\n\n### EIA 9 月 22 日柴油价更新继续抬高 US Q4 物流成本压力\n\n- 历史事件：us-eia-diesel-logistics-cost-signal-2026-09-09\n- 上次状态：2026-09-16 已推送 EIA 9 月中旬柴油价格作为 US Q4 landed cost 和促销毛利敏感性输入，要求结合实际报价验证。\n- 本次新增变化：EIA 2026-09-22 数据显示，美国 on-highway diesel 价格在 2026-09-21 为 USD 6.529/gal，较 2026-09-14 的 USD 6.285/gal 上涨 USD 0.244/gal；West Coast 为 USD 7.456/gal，California 为 USD 8.246/gal。来源：EIA Gasoline and Diesel Fuel Update https://www.eia.gov/petroleum/gasdiesel/\n- 相比上次变化：柴油成本信号从“需要观察”变为“连续高位并继续上行”，对美西入仓、港口拖车、3PL 转运和 FBM 应急配送的成本压力更明确。\n- 变化原因：美国能源价格上行，柴油价格直接影响卡车派送、港口拖车、区域转运和旺季附加费报价。\n- 行动是否需要调整：继续原动作但把复核日期提前到 2026-09-26。供应链/财务导出所有 2026-10 入仓或补货中的 US 货件，字段包含目的 FC/3PL、预计到港/到仓、承运商、最后一英里方式、当前报价、燃油附加费和 ASIN 毛利率；只在实际报价或附加费超过模型 +3% 时调整促销毛利测算，不做全店涨价。\n\n### EU Customs Reform 小包 handling fee 引入节点更明确\n\n- 历史事件：eu-customs-reform-implementation-2026-09-21\n- 上次状态：2026-09-22 已推送 EU Customs Reform 进入实施阶段，重点关注 EU Customs Authority/Data Hub、低价值电商包裹责任和 pending handling fee。\n- 本次新增变化：European Commission 官方页面明确，小包 Union handling fee 将在 2026-11-01 前引入，金额由 delegated act 决定；Data Hub 对电商进口/出口记录的强制使用日期仍为 2028-07-01。来源：European Commission Taxation and Customs Union https://taxation-customs.ec.europa.eu/customs/eu-customs-reform_en\n- 相比上次变化：handling fee 从“待公布的方向性费用”推进为“已有最晚引入时间点，金额仍待公布”，可先进入 DE/FR/IT/ES landed cost 模板的预留字段。\n- 变化原因：欧盟改革进入实施期，电商小包、平台/卖家/承运人责任和海关成本补偿机制开始落地。\n- 行动是否需要调整：继续 P2 准备，不改售价。欧洲运营/财务/ERP 在 2026-10-08 前把 DE/FR/IT/ES 小包模型新增字段：customs duty、temporary EUR 3 duty、Union handling fee placeholder、IOSS/进口方、平台/卖家/承运人责任、货代确认日期。验收方式：货代邮件或报价单明确是否已包含 handling fee；金额未公布前不得把假设值写入正式售价表。\n\n## 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n|---|---|---|---|---|---|---|\n| P1 | 导出 PBDD 主推 ASIN 清单，逐个核对 Deals、Coupons、Prime Exclusive Discounts、可售库存、reserved units、FC receiving 和广告日预算 | US/UK/DE/FR/IT/ES | 运营/PPC | 2026-09-24 | 每个 ASIN 有促销状态、库存覆盖天数、预算覆盖天数、异常处理方式和截图/后台链接 | 2026-09-28 |\n| P2 | 更新 US FBM/应急自配送成本模型，导入 USPS 2026 time-limited final price file 并与 Buy Shipping 试算对齐 | US | 财务/运营 | 2026-09-26 | 输出常见重量/箱规的 10/4 前后差额、毛利影响和是否需要切换履约方式 | 2026-10-05 |\n| P2 | 用 EIA 柴油价和承运商报价复核 2026-10 US 货件 landed cost | US | 供应链/财务 | 2026-09-26 | 货件清单包含报价、燃油附加费、ETA、ASIN 毛利率；超过模型 +3% 的货件标红 | 2026-09-29 |\n| P2 | 在 EU landed cost 模板新增 handling fee placeholder 与责任字段，不填假设金额 | DE/FR/IT/ES | 欧洲运营/财务/ERP | 2026-10-08 | 模板新增字段并取得至少 1 家货代书面确认是否已含小包费用 | 2026-10-15 |\n| P2 | 完成 Product Bundling 风险清单第一版，筛选 bundle/kit/set/multipack/refill-page 相关 ASIN | US | Listing/合规 | 2026-09-25 | 清单含 ASIN、品牌、包装方、LOA、FBA 库存、可清仓时间和处置路径 | 2026-10-15 |\n\n## 持续关注\n\n- 事项：Product Bundling 新要求。当前状态：2027-01-11 生效口径已推送，内部风险清单仍按 2026-09-25 截止。下次复查日期：2026-09-25。触发升级条件：Account Health 出现 bundle listing violation、ASIN 被抑制、供应商无法提供 LOA、或补充页/套装类 ASIN 被判为非原厂包装。\n- 事项：PBDD 主推池。当前状态：促销提交已进入执行前异常关闭。下次复查日期：2026-09-28。触发升级条件：Deal/Coupon/PED 不可执行、可售库存低于预计活动销量 1.3 倍、reserved units 异常、或广告预算覆盖低于 2 天。\n- 事项：USPS 旺季包裹价格。当前状态：官方价格文件 Final，Amazon Buy Shipping 是否完全同步仍需账号试算。下次复查日期：2026-10-05。触发升级条件：Buy Shipping 显示的 10/4 后价格高于模型 +3%、FBM 应急订单毛利为负、或 USPS/PRC 再发布修订文件。\n- 事项：EU Customs Reform 小包 handling fee。当前状态：2026-11-01 前引入，金额待 delegated act。下次复查日期：2026-10-15。触发升级条件：欧盟公布 fee 金额、货代报价新增该费用、或 DE/FR/IT/ES 清关资料字段被退回。\n\n## 情报边界与可信度\n\n本次窗口覆盖 2026-09-23 09:03:08 至 2026-09-24 09:04:46（Asia/Shanghai），并补查长期索引中 PBDD、USPS、EIA、EU Customs Reform、Product Bundling、Amazon Ads AI 工具等持续关注事项。复查来源约 18 个，其中官方/监管/一手来源 13 个，包括中国政府网/国务院办公厅、Amazon Ads、Amazon Seller Central Forums、About Amazon、USPS、USPS Postal Explorer、EIA、European Commission、CPSC、GOV.UK OPSS、USTR、CBP、Drewry；非官方或行业辅助来源 5 个，仅用于发现线索和排重。纳入日报的新事件 0 条，纳入已有事件重要更新 3 条；仍待确认事项 4 条：PBDD 各账号实际可执行状态、USPS 价格在 Amazon Buy Shipping 的账号侧同步、EU handling fee 金额、Product Bundling 账号侧风险提醒。\n\n今天排除了 Amazon Accelerate 参会内容、重复的 Prime Big Deal Days 零售预热、无新增后台动作的 AI shopping/AI ads 评论、India 站点单独政策、与相册/纸品/礼品/收纳/拼图配件产品线无直接关系的 CPSC/OPSS 召回，以及没有 USTR/CBP/European Commission/USPS/Amazon 官方确认的新关税传闻。\n\n工作日门禁来源：中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（国办发明电〔2025〕7号，https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/2025/issue_12406/202511/content_7048922.html）。文件显示 2026 年中秋节为 2026-09-25 至 2026-09-27 放假，共 3 天；因此 2026-09-24 为节前最后一个大陆法定工作日，本次按规则生成日报并追加周报。\n\n# 亚马逊及海外市场情报周报｜2026-09-24\n\n## 本周管理层摘要\n\n本周覆盖 2026-09-21 至 2026-09-24，共确认 5 条需要继续执行的事件主线：Product Bundling 新要求、EU Customs Reform、Amazon Ads sponsored ads AI 工具、PBDD/Q4 主推池异常关闭、US 物流与包裹成本。最高风险不是立即封号型风险，而是 2027-01-11 Product Bundling 对 bundle/kit/set/multipack/refill-page ASIN 的合规风险，以及 2026-10-04 起 USPS 旺季价格对 FBM/应急自配送毛利的挤压。最近截止日为 2026-09-24 PBDD 节前异常关闭和 2026-09-25 Product Bundling 风险清单第一版。下周重点不是大范围改 Listing 或调价，而是把高风险 ASIN、成本模型、促销承接和广告 AI 权限放进可验收清单。\n\n## 本周优先级快览\n\n| 优先级 | 事件主线 | 站点 | 模块 | 下周动作 | 负责人 | 截止日 |\n|---|---|---|---|---|---|---|\n| P1 | PBDD/Q4 主推池异常关闭 | US/UK/DE/FR/IT/ES | 促销/库存/广告 | 复核 9/24 异常清单，确认主推池、兜底 Coupon/PED 和预算 | 运营/PPC | 2026-09-28 |\n| P1 | Product Bundling 新要求 | US | Listing/合规/FBA 库存 | 完成疑似 bundle/kit/set/multipack/refill-page ASIN 风险清单和处置路径 | Listing/合规 | 2026-09-25 |\n| P2 | USPS 旺季价格 Final | US | FBM/Buy Shipping/利润 | 导入最终价格文件并完成常见箱规成本差额表 | 财务/运营 | 2026-09-26 |\n| P2 | Amazon Ads sponsored ads AI 工具 | US 优先 | PPC/一方数据/预算 | 建 AI 建议复核表，只做小范围人工批准测试 | PPC | 2026-09-30 |\n| P2 | EU Customs Reform | DE/FR/IT/ES | 清关/landed cost/ERP | 增加 handling fee placeholder 和责任字段，等金额确认 | 欧洲运营/ERP/财务 | 2026-10-08 |\n\n## 本周政策与平台变化\n\n### 合规\n\nProduct Bundling 是本周最需要业务团队落地的合规主线。Amazon Seller Forums / News_Amazon 公告显示，自 2027-01-11 起，多数作为单一 ASIN 销售的 product bundles 必须由原制造商或品牌包装；允许例外包括授权重包装、gifting browse nodes、camera product types 和 Virtual Bundles。对我们的相册补充页、套装、multi-pack、bundle gift set 相关结构，风险在于 ASIN 是否被认定为“非原厂包装的 bundle”，而不是标题里是否写了 bundle 一个词。\n\n### Listing\n\n本周没有新的 Title、Bullet、A+、图片或 Search Terms 全量强制规则。Listing 团队下周应把精力集中在 Product Bundling ASIN 分类：疑似 bundle/kit/set/multipack/refill-page、品牌包装方、是否有 LOA、FBA 库存、是否可转 Virtual Bundle、是否需要清仓或拆分。\n\n### 广告\n\nAmazon Ads 2026-09-22 公告 sponsored ads 新 AI 工具：Ads data manager 扩展到 sponsored ads 并全球可用，US campaign intelligence 计划 2026-10 上线，US auto-optimization 计划 2027-01 上线。运营判断是“建立控制流程”，不是“全账号自动化”。PPC 下周只对库存覆盖 30 天以上、毛利率达标、ACOS 低于目标 +10% 的 campaign 做人工批准测试。\n\n### 费用\n\nUSPS 2026 旺季临时包裹价格从待观察转为可执行测算。Postal Explorer 显示 time-limited 2026 price file 和 Notice 123 已 Final，适用 2026-10-04 至 2027-01-17。该事项主要影响 US FBM、Buy Shipping、退货补寄和 FBA 断货时的应急自配送，不应扩展为全店调价理由。\n\n### 库存物流\n\nPBDD/Q4 进入执行前异常关闭阶段：本周动作从“提报是否完成”转为“促销是否可执行、库存是否能承接、FC receiving/reserved units 是否异常、广告预算是否够”。EIA 9 月 22 日柴油价更新显示 US on-highway diesel 升至 USD 6.529/gal，提示 US 旺季入仓和转运成本仍需用实际报价复核。\n\n### 促销\n\nPrime Big Deal Days 公开零售时间仍为 2026-10-06 至 2026-10-07。下周促销侧的关键不是增加更多活动，而是关闭异常：不可执行 Deal 的 ASIN 是否改 Coupon/PED，库存不足 ASIN 是否退出主推池，预算不足 campaign 是否降级或集中投放。\n\n## 本周海外市场与供应链变化\n\nEU Customs Reform 进入实施期后，对 DE/FR/IT/ES 的影响从长期政策观察转为字段和费用准备。European Commission 页面明确 Data Hub 对电商强制节点为 2028-07-01，小包 Union handling fee 将在 2026-11-01 前引入且金额待 delegated act。US 侧，本周 EIA 柴油和 USPS 旺季价格同时提示：10 月以后美国境内履约、补寄、FBM 应急方案和促销毛利需要按实际报价重算。\n\n## 对当前业务的量化影响\n\n| 影响项 | 初步量化判断 | 适用范围 | 证据/假设 |\n|---|---|---|---|\n| PBDD 销售承接 | 主推 ASIN 库存覆盖低于预计活动销量 1.3 倍时，应降级或退出主推池 | US/UK/DE/FR/IT/ES Deal/Coupon/PED ASIN | 运营假设，需以账号内可售库存、reserved units 和历史活动销量验证 |\n| USPS 旺季成本 | 2026-10-04 起对 US FBM/补寄/应急自配送产生直接运费差额 | US FBM、Buy Shipping、售后补寄 | USPS final price file；具体差额需按重量/zone/服务导入模型 |\n| US 物流成本 | EIA diesel USD 6.529/gal，较前周 +USD 0.244/gal | US 入仓、拖车、3PL 转运 | EIA 官方数据；是否传导到报价需承运商确认 |\n| Amazon Ads AI | beta 指标不可直接作为全账号目标；适合 3 个 campaign 小样本测试 | US SP/SB/SD | Amazon Ads 公告；本业务需以 ACOS/TACOS/CVR/库存验证 |\n| EU customs | handling fee 金额未公布，暂不进入售价，只建 placeholder | DE/FR/IT/ES 小包/清关模型 | European Commission 页面；金额待 delegated act |\n\n## 下周行动清单\n\n| 优先级 | 动作 | 站点 | 对象 | 负责人 | 截止日 | 验收指标 |\n|---|---|---|---|---|---|---|\n| P1 | 关闭 PBDD 异常清单，确认主推池、兜底 Coupon/PED 和广告预算 | US/UK/DE/FR/IT/ES | Deal/Coupon/PED ASIN | 运营/PPC | 2026-09-28 | 100% 主推 ASIN 有状态、库存覆盖、预算覆盖和异常处理 |\n| P1 | 完成 Product Bundling 风险清单第一版 | US | bundle/kit/set/multipack/refill-page ASIN | Listing/合规 | 2026-09-25 | 每个 ASIN 标注包装方、LOA、库存、建议动作 |\n| P2 | 导入 USPS final price file 并完成 US FBM/补寄成本差额表 | US | 常见重量/箱规 | 财务/运营 | 2026-09-26 | 覆盖 Top 10 常用箱规和所有 FBM 应急 SKU |\n| P2 | 选 3 个 campaign 做 Amazon Ads AI 建议人工批准测试 | US | SP/SB campaigns | PPC | 2026-09-30 | 测试 campaign 有 ACOS、TACOS、CVR、库存和 7 天复盘字段 |\n| P2 | 向货代确认 EU handling fee 是否已进报价口径 | DE/FR/IT/ES | 小包/清关报价 | 欧洲运营/供应链 | 2026-10-08 | 至少 1 家货代书面回复；模板新增 placeholder |\n\n## 已关闭与继续跟踪事项\n\n- 关闭：本周无新的 Amazon Listing/A+/图片/Search Terms 全量强制规则，重复零售预热和行业评论不再进入下周主线。\n- 继续跟踪：Product Bundling 风险清单，下一次检查 2026-09-25。\n- 继续跟踪：PBDD 主推池，下一次检查 2026-09-28。\n- 继续跟踪：USPS 旺季价格在 Amazon Buy Shipping 的账号侧同步，下一次检查 2026-10-05。\n- 继续跟踪：Amazon Ads campaign intelligence/auto-optimization 在 US 账号可见性，下一次检查 2026-10-03。\n- 继续跟踪：EU handling fee delegated act 金额，下一次检查 2026-10-15。\n\n## 来源与可信度统计\n\n本周合并使用官方/监管/一手来源 10 个：Amazon Ads、Amazon Seller Central Forums、About Amazon、European Commission Taxation and Customs Union、USPS、USPS Postal Explorer、EIA、中国政府网/国务院办公厅、CPSC、GOV.UK OPSS。非官方或行业辅助来源仅用于排重和线索发现，未作为执行动作依据。仍待确认事项为账号侧可见性和执行数据：PBDD 后台状态、Buy Shipping 实际价格、Product Bundling 账号提醒、Amazon Ads 新工具入口、EU handling fee 金额。\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-24\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-24\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报增量日报｜2026-09-24\u003c/h1>\n\u003ch2>今日判断\u003c/h2>\n\u003cp>今日没有发现 Amazon US/UK/DE/FR/IT/ES 发布新的全量强制 Seller Central Listing、图片、A+、Search Terms、属性、变体或 FBA 费用规则。今天的重大运营变化来自已收录事项：USPS 2026 旺季临时价格文件已转为 Final，EIA 9 月 22 日发布的柴油价继续上行，EU Customs Reform 对小包 handling fee 的 2026-11-01 前引入节点更明确。最高优先级仍是 PBDD 主推 ASIN 的促销、库存和预算异常关闭，重点站点为 US/UK/DE/FR/IT/ES；最紧急截止日是今天 2026-09-24 完成节前最后一轮复核。由于 2026-09-25 至 2026-09-27 为中国大陆中秋法定假期，今天也是本周最后一个大陆法定工作日，需要追加周度合并报告。\u003c/p>\n\u003ch2>优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>影响站点\u003c/th>\n\u003cth>影响模块\u003c/th>\n\u003cth>截止/生效日期\u003c/th>\n\u003cth>今天是否需要动作\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>PBDD 节前最后一轮异常关闭\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES\u003c/td>\n\u003ctd>Deals/Coupons/PED/库存/广告预算\u003c/td>\n\u003ctd>2026-09-24；PBDD 2026-10-06 至 2026-10-07\u003c/td>\n\u003ctd>是，今天完成主推 ASIN 促销可执行与库存承接复核\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>USPS 旺季临时包裹价格文件已 Final\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>FBM/Buy Shipping/利润测算\u003c/td>\n\u003ctd>2026-10-04 至 2027-01-17 生效\u003c/td>\n\u003ctd>是，更新 US FBM/应急自配送成本模型\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>EIA 柴油价继续上行\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>头程/卡车派送/3PL 报价/促销毛利\u003c/td>\n\u003ctd>数据发布日期 2026-09-22；下次 2026-09-29\u003c/td>\n\u003ctd>是，用实际报价复核 Q4 毛利缓冲\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>EU 小包 handling fee 节点明确\u003c/td>\n\u003ctd>DE/FR/IT/ES\u003c/td>\n\u003ctd>EU 清关/landed cost/ERP 字段\u003c/td>\n\u003ctd>2026-11-01 前引入；金额待 delegated act\u003c/td>\n\u003ctd>是，补充 EU 小包费用字段和货代确认项\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>今日新情报\u003c/h2>\n\u003cp>今日无符合增量标准的首次发现新事件。检索到的 Amazon Accelerate、Prime Big Deal Days 零售预热、AI shopping 评论和行业转载均未形成新的 Seller Central 后台动作或新增运营事实。\u003c/p>\n\u003ch2>已有事件的重要更新\u003c/h2>\n\u003ch3>USPS 2026 旺季临时包裹价格文件从待确认转为 Final\u003c/h3>\n\u003cul>\n\u003cli>历史事件：usps-2026-holiday-temporary-package-price-adjustment\u003c/li>\n\u003cli>上次状态：已知 USPS 发布 2026 旺季临时包裹价格调整，适用 2026-10-04 至 2027-01-17，但 prior push 仍按“待 PRC/Buy Shipping 确认”处理。\u003c/li>\n\u003cli>本次新增变化：Postal Explorer 的 Time-Limited 2026 Price File、CSV Price Files 和 Notice 123 均显示 Final，修订日期为 2026-09-18；适用窗口仍为 2026-10-04 至 2027-01-17。来源：USPS Postal Explorer \u003ca href=\"https://pe.usps.com/PriceChange/Index；USPS\" target=\"_blank\" rel=\"noopener noreferrer\">https://pe.usps.com/PriceChange/Index；USPS\u003c/a> 新闻稿 \u003ca href=\"https://about.usps.com/newsroom/national-releases/2026/0825-usps-announces-temporary-price-change-for-2026-holiday-shipping-season.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://about.usps.com/newsroom/national-releases/2026/0825-usps-announces-temporary-price-change-for-2026-holiday-shipping-season.htm\u003c/a>\u003c/li>\n\u003cli>相比上次变化：从“价格调整已公告但需等待最终价格文件/Buy Shipping 体现”升级为“USPS 官方价格文件已最终化，可进入 US FBM 与应急自配送测算”。\u003c/li>\n\u003cli>变化原因：USPS 将 time-limited price file 和 Notice 123 状态更新为 Final，价格文件可用于成本模型和自配送兜底方案。\u003c/li>\n\u003cli>行动是否需要调整：升级为 P2 成本模型动作。US 运营/财务在 2026-09-26 前更新 1 lb、2 lb、3 lb、5 lb 和相册/Portfolio Binder 常见箱规的 USPS Ground Advantage、Priority Mail、Parcel Select 费用；路径：Seller Central &gt; Orders &gt; Buy Shipping 试算，或 USPS price file 导入成本表。验收标准：输出“当前运费、10/4 后运费、差额、是否影响 Coupon/PED 毛利、是否需要改用 FBA/3PL”的清单。\u003c/li>\n\u003c/ul>\n\u003ch3>EIA 9 月 22 日柴油价更新继续抬高 US Q4 物流成本压力\u003c/h3>\n\u003cul>\n\u003cli>历史事件：us-eia-diesel-logistics-cost-signal-2026-09-09\u003c/li>\n\u003cli>上次状态：2026-09-16 已推送 EIA 9 月中旬柴油价格作为 US Q4 landed cost 和促销毛利敏感性输入，要求结合实际报价验证。\u003c/li>\n\u003cli>本次新增变化：EIA 2026-09-22 数据显示，美国 on-highway diesel 价格在 2026-09-21 为 USD 6.529/gal，较 2026-09-14 的 USD 6.285/gal 上涨 USD 0.244/gal；West Coast 为 USD 7.456/gal，California 为 USD 8.246/gal。来源：EIA Gasoline and Diesel Fuel Update \u003ca href=\"https://www.eia.gov/petroleum/gasdiesel/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.eia.gov/petroleum/gasdiesel/\u003c/a>\u003c/li>\n\u003cli>相比上次变化：柴油成本信号从“需要观察”变为“连续高位并继续上行”，对美西入仓、港口拖车、3PL 转运和 FBM 应急配送的成本压力更明确。\u003c/li>\n\u003cli>变化原因：美国能源价格上行，柴油价格直接影响卡车派送、港口拖车、区域转运和旺季附加费报价。\u003c/li>\n\u003cli>行动是否需要调整：继续原动作但把复核日期提前到 2026-09-26。供应链/财务导出所有 2026-10 入仓或补货中的 US 货件，字段包含目的 FC/3PL、预计到港/到仓、承运商、最后一英里方式、当前报价、燃油附加费和 ASIN 毛利率；只在实际报价或附加费超过模型 +3% 时调整促销毛利测算，不做全店涨价。\u003c/li>\n\u003c/ul>\n\u003ch3>EU Customs Reform 小包 handling fee 引入节点更明确\u003c/h3>\n\u003cul>\n\u003cli>历史事件：eu-customs-reform-implementation-2026-09-21\u003c/li>\n\u003cli>上次状态：2026-09-22 已推送 EU Customs Reform 进入实施阶段，重点关注 EU Customs Authority/Data Hub、低价值电商包裹责任和 pending handling fee。\u003c/li>\n\u003cli>本次新增变化：European Commission 官方页面明确，小包 Union handling fee 将在 2026-11-01 前引入，金额由 delegated act 决定；Data Hub 对电商进口/出口记录的强制使用日期仍为 2028-07-01。来源：European Commission Taxation and Customs Union \u003ca href=\"https://taxation-customs.ec.europa.eu/customs/eu-customs-reform_en\" target=\"_blank\" rel=\"noopener noreferrer\">https://taxation-customs.ec.europa.eu/customs/eu-customs-reform_en\u003c/a>\u003c/li>\n\u003cli>相比上次变化：handling fee 从“待公布的方向性费用”推进为“已有最晚引入时间点，金额仍待公布”，可先进入 DE/FR/IT/ES landed cost 模板的预留字段。\u003c/li>\n\u003cli>变化原因：欧盟改革进入实施期，电商小包、平台/卖家/承运人责任和海关成本补偿机制开始落地。\u003c/li>\n\u003cli>行动是否需要调整：继续 P2 准备，不改售价。欧洲运营/财务/ERP 在 2026-10-08 前把 DE/FR/IT/ES 小包模型新增字段：customs duty、temporary EUR 3 duty、Union handling fee placeholder、IOSS/进口方、平台/卖家/承运人责任、货代确认日期。验收方式：货代邮件或报价单明确是否已包含 handling fee；金额未公布前不得把假设值写入正式售价表。\u003c/li>\n\u003c/ul>\n\u003ch2>今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>导出 PBDD 主推 ASIN 清单，逐个核对 Deals、Coupons、Prime Exclusive Discounts、可售库存、reserved units、FC receiving 和广告日预算\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES\u003c/td>\n\u003ctd>运营/PPC\u003c/td>\n\u003ctd>2026-09-24\u003c/td>\n\u003ctd>每个 ASIN 有促销状态、库存覆盖天数、预算覆盖天数、异常处理方式和截图/后台链接\u003c/td>\n\u003ctd>2026-09-28\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>更新 US FBM/应急自配送成本模型，导入 USPS 2026 time-limited final price file 并与 Buy Shipping 试算对齐\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>财务/运营\u003c/td>\n\u003ctd>2026-09-26\u003c/td>\n\u003ctd>输出常见重量/箱规的 10/4 前后差额、毛利影响和是否需要切换履约方式\u003c/td>\n\u003ctd>2026-10-05\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>用 EIA 柴油价和承运商报价复核 2026-10 US 货件 landed cost\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>供应链/财务\u003c/td>\n\u003ctd>2026-09-26\u003c/td>\n\u003ctd>货件清单包含报价、燃油附加费、ETA、ASIN 毛利率；超过模型 +3% 的货件标红\u003c/td>\n\u003ctd>2026-09-29\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>在 EU landed cost 模板新增 handling fee placeholder 与责任字段，不填假设金额\u003c/td>\n\u003ctd>DE/FR/IT/ES\u003c/td>\n\u003ctd>欧洲运营/财务/ERP\u003c/td>\n\u003ctd>2026-10-08\u003c/td>\n\u003ctd>模板新增字段并取得至少 1 家货代书面确认是否已含小包费用\u003c/td>\n\u003ctd>2026-10-15\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>完成 Product Bundling 风险清单第一版，筛选 bundle/kit/set/multipack/refill-page 相关 ASIN\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Listing/合规\u003c/td>\n\u003ctd>2026-09-25\u003c/td>\n\u003ctd>清单含 ASIN、品牌、包装方、LOA、FBA 库存、可清仓时间和处置路径\u003c/td>\n\u003ctd>2026-10-15\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>持续关注\u003c/h2>\n\u003cul>\n\u003cli>事项：Product Bundling 新要求。当前状态：2027-01-11 生效口径已推送，内部风险清单仍按 2026-09-25 截止。下次复查日期：2026-09-25。触发升级条件：Account Health 出现 bundle listing violation、ASIN 被抑制、供应商无法提供 LOA、或补充页/套装类 ASIN 被判为非原厂包装。\u003c/li>\n\u003cli>事项：PBDD 主推池。当前状态：促销提交已进入执行前异常关闭。下次复查日期：2026-09-28。触发升级条件：Deal/Coupon/PED 不可执行、可售库存低于预计活动销量 1.3 倍、reserved units 异常、或广告预算覆盖低于 2 天。\u003c/li>\n\u003cli>事项：USPS 旺季包裹价格。当前状态：官方价格文件 Final，Amazon Buy Shipping 是否完全同步仍需账号试算。下次复查日期：2026-10-05。触发升级条件：Buy Shipping 显示的 10/4 后价格高于模型 +3%、FBM 应急订单毛利为负、或 USPS/PRC 再发布修订文件。\u003c/li>\n\u003cli>事项：EU Customs Reform 小包 handling fee。当前状态：2026-11-01 前引入，金额待 delegated act。下次复查日期：2026-10-15。触发升级条件：欧盟公布 fee 金额、货代报价新增该费用、或 DE/FR/IT/ES 清关资料字段被退回。\u003c/li>\n\u003c/ul>\n\u003ch2>情报边界与可信度\u003c/h2>\n\u003cp>本次窗口覆盖 2026-09-23 09:03:08 至 2026-09-24 09:04:46（Asia/Shanghai），并补查长期索引中 PBDD、USPS、EIA、EU Customs Reform、Product Bundling、Amazon Ads AI 工具等持续关注事项。复查来源约 18 个，其中官方/监管/一手来源 13 个，包括中国政府网/国务院办公厅、Amazon Ads、Amazon Seller Central Forums、About Amazon、USPS、USPS Postal Explorer、EIA、European Commission、CPSC、GOV.UK OPSS、USTR、CBP、Drewry；非官方或行业辅助来源 5 个，仅用于发现线索和排重。纳入日报的新事件 0 条，纳入已有事件重要更新 3 条；仍待确认事项 4 条：PBDD 各账号实际可执行状态、USPS 价格在 Amazon Buy Shipping 的账号侧同步、EU handling fee 金额、Product Bundling 账号侧风险提醒。\u003c/p>\n\u003cp>今天排除了 Amazon Accelerate 参会内容、重复的 Prime Big Deal Days 零售预热、无新增后台动作的 AI shopping/AI ads 评论、India 站点单独政策、与相册/纸品/礼品/收纳/拼图配件产品线无直接关系的 CPSC/OPSS 召回，以及没有 USTR/CBP/European Commission/USPS/Amazon 官方确认的新关税传闻。\u003c/p>\n\u003cp>工作日门禁来源：中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（国办发明电〔2025〕7号，\u003ca href=\"https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/2025/issue_12406/202511/content_7048922.html）。文件显示\" target=\"_blank\" rel=\"noopener noreferrer\">https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/2025/issue_12406/202511/content_7048922.html）。文件显示\u003c/a> 2026 年中秋节为 2026-09-25 至 2026-09-27 放假，共 3 天；因此 2026-09-24 为节前最后一个大陆法定工作日，本次按规则生成日报并追加周报。\u003c/p>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报周报｜2026-09-24\u003c/h1>\n\u003ch2>本周管理层摘要\u003c/h2>\n\u003cp>本周覆盖 2026-09-21 至 2026-09-24，共确认 5 条需要继续执行的事件主线：Product Bundling 新要求、EU Customs Reform、Amazon Ads sponsored ads AI 工具、PBDD/Q4 主推池异常关闭、US 物流与包裹成本。最高风险不是立即封号型风险，而是 2027-01-11 Product Bundling 对 bundle/kit/set/multipack/refill-page ASIN 的合规风险，以及 2026-10-04 起 USPS 旺季价格对 FBM/应急自配送毛利的挤压。最近截止日为 2026-09-24 PBDD 节前异常关闭和 2026-09-25 Product Bundling 风险清单第一版。下周重点不是大范围改 Listing 或调价，而是把高风险 ASIN、成本模型、促销承接和广告 AI 权限放进可验收清单。\u003c/p>\n\u003ch2>本周优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事件主线\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>模块\u003c/th>\n\u003cth>下周动作\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>PBDD/Q4 主推池异常关闭\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES\u003c/td>\n\u003ctd>促销/库存/广告\u003c/td>\n\u003ctd>复核 9/24 异常清单，确认主推池、兜底 Coupon/PED 和预算\u003c/td>\n\u003ctd>运营/PPC\u003c/td>\n\u003ctd>2026-09-28\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>Product Bundling 新要求\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Listing/合规/FBA 库存\u003c/td>\n\u003ctd>完成疑似 bundle/kit/set/multipack/refill-page ASIN 风险清单和处置路径\u003c/td>\n\u003ctd>Listing/合规\u003c/td>\n\u003ctd>2026-09-25\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>USPS 旺季价格 Final\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>FBM/Buy Shipping/利润\u003c/td>\n\u003ctd>导入最终价格文件并完成常见箱规成本差额表\u003c/td>\n\u003ctd>财务/运营\u003c/td>\n\u003ctd>2026-09-26\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Amazon Ads sponsored ads AI 工具\u003c/td>\n\u003ctd>US 优先\u003c/td>\n\u003ctd>PPC/一方数据/预算\u003c/td>\n\u003ctd>建 AI 建议复核表，只做小范围人工批准测试\u003c/td>\n\u003ctd>PPC\u003c/td>\n\u003ctd>2026-09-30\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>EU Customs Reform\u003c/td>\n\u003ctd>DE/FR/IT/ES\u003c/td>\n\u003ctd>清关/landed cost/ERP\u003c/td>\n\u003ctd>增加 handling fee placeholder 和责任字段，等金额确认\u003c/td>\n\u003ctd>欧洲运营/ERP/财务\u003c/td>\n\u003ctd>2026-10-08\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>本周政策与平台变化\u003c/h2>\n\u003ch3>合规\u003c/h3>\n\u003cp>Product Bundling 是本周最需要业务团队落地的合规主线。Amazon Seller Forums / News_Amazon 公告显示，自 2027-01-11 起，多数作为单一 ASIN 销售的 product bundles 必须由原制造商或品牌包装；允许例外包括授权重包装、gifting browse nodes、camera product types 和 Virtual Bundles。对我们的相册补充页、套装、multi-pack、bundle gift set 相关结构，风险在于 ASIN 是否被认定为“非原厂包装的 bundle”，而不是标题里是否写了 bundle 一个词。\u003c/p>\n\u003ch3>Listing\u003c/h3>\n\u003cp>本周没有新的 Title、Bullet、A+、图片或 Search Terms 全量强制规则。Listing 团队下周应把精力集中在 Product Bundling ASIN 分类：疑似 bundle/kit/set/multipack/refill-page、品牌包装方、是否有 LOA、FBA 库存、是否可转 Virtual Bundle、是否需要清仓或拆分。\u003c/p>\n\u003ch3>广告\u003c/h3>\n\u003cp>Amazon Ads 2026-09-22 公告 sponsored ads 新 AI 工具：Ads data manager 扩展到 sponsored ads 并全球可用，US campaign intelligence 计划 2026-10 上线，US auto-optimization 计划 2027-01 上线。运营判断是“建立控制流程”，不是“全账号自动化”。PPC 下周只对库存覆盖 30 天以上、毛利率达标、ACOS 低于目标 +10% 的 campaign 做人工批准测试。\u003c/p>\n\u003ch3>费用\u003c/h3>\n\u003cp>USPS 2026 旺季临时包裹价格从待观察转为可执行测算。Postal Explorer 显示 time-limited 2026 price file 和 Notice 123 已 Final，适用 2026-10-04 至 2027-01-17。该事项主要影响 US FBM、Buy Shipping、退货补寄和 FBA 断货时的应急自配送，不应扩展为全店调价理由。\u003c/p>\n\u003ch3>库存物流\u003c/h3>\n\u003cp>PBDD/Q4 进入执行前异常关闭阶段：本周动作从“提报是否完成”转为“促销是否可执行、库存是否能承接、FC receiving/reserved units 是否异常、广告预算是否够”。EIA 9 月 22 日柴油价更新显示 US on-highway diesel 升至 USD 6.529/gal，提示 US 旺季入仓和转运成本仍需用实际报价复核。\u003c/p>\n\u003ch3>促销\u003c/h3>\n\u003cp>Prime Big Deal Days 公开零售时间仍为 2026-10-06 至 2026-10-07。下周促销侧的关键不是增加更多活动，而是关闭异常：不可执行 Deal 的 ASIN 是否改 Coupon/PED，库存不足 ASIN 是否退出主推池，预算不足 campaign 是否降级或集中投放。\u003c/p>\n\u003ch2>本周海外市场与供应链变化\u003c/h2>\n\u003cp>EU Customs Reform 进入实施期后，对 DE/FR/IT/ES 的影响从长期政策观察转为字段和费用准备。European Commission 页面明确 Data Hub 对电商强制节点为 2028-07-01，小包 Union handling fee 将在 2026-11-01 前引入且金额待 delegated act。US 侧，本周 EIA 柴油和 USPS 旺季价格同时提示：10 月以后美国境内履约、补寄、FBM 应急方案和促销毛利需要按实际报价重算。\u003c/p>\n\u003ch2>对当前业务的量化影响\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>影响项\u003c/th>\n\u003cth>初步量化判断\u003c/th>\n\u003cth>适用范围\u003c/th>\n\u003cth>证据/假设\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>PBDD 销售承接\u003c/td>\n\u003ctd>主推 ASIN 库存覆盖低于预计活动销量 1.3 倍时，应降级或退出主推池\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES Deal/Coupon/PED ASIN\u003c/td>\n\u003ctd>运营假设，需以账号内可售库存、reserved units 和历史活动销量验证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>USPS 旺季成本\u003c/td>\n\u003ctd>2026-10-04 起对 US FBM/补寄/应急自配送产生直接运费差额\u003c/td>\n\u003ctd>US FBM、Buy Shipping、售后补寄\u003c/td>\n\u003ctd>USPS final price file；具体差额需按重量/zone/服务导入模型\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>US 物流成本\u003c/td>\n\u003ctd>EIA diesel USD 6.529/gal，较前周 +USD 0.244/gal\u003c/td>\n\u003ctd>US 入仓、拖车、3PL 转运\u003c/td>\n\u003ctd>EIA 官方数据；是否传导到报价需承运商确认\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Amazon Ads AI\u003c/td>\n\u003ctd>beta 指标不可直接作为全账号目标；适合 3 个 campaign 小样本测试\u003c/td>\n\u003ctd>US SP/SB/SD\u003c/td>\n\u003ctd>Amazon Ads 公告；本业务需以 ACOS/TACOS/CVR/库存验证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EU customs\u003c/td>\n\u003ctd>handling fee 金额未公布，暂不进入售价，只建 placeholder\u003c/td>\n\u003ctd>DE/FR/IT/ES 小包/清关模型\u003c/td>\n\u003ctd>European Commission 页面；金额待 delegated act\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>下周行动清单\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>动作\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>对象\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日\u003c/th>\n\u003cth>验收指标\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>关闭 PBDD 异常清单，确认主推池、兜底 Coupon/PED 和广告预算\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES\u003c/td>\n\u003ctd>Deal/Coupon/PED ASIN\u003c/td>\n\u003ctd>运营/PPC\u003c/td>\n\u003ctd>2026-09-28\u003c/td>\n\u003ctd>100% 主推 ASIN 有状态、库存覆盖、预算覆盖和异常处理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>完成 Product Bundling 风险清单第一版\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>bundle/kit/set/multipack/refill-page ASIN\u003c/td>\n\u003ctd>Listing/合规\u003c/td>\n\u003ctd>2026-09-25\u003c/td>\n\u003ctd>每个 ASIN 标注包装方、LOA、库存、建议动作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>导入 USPS final price file 并完成 US FBM/补寄成本差额表\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>常见重量/箱规\u003c/td>\n\u003ctd>财务/运营\u003c/td>\n\u003ctd>2026-09-26\u003c/td>\n\u003ctd>覆盖 Top 10 常用箱规和所有 FBM 应急 SKU\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>选 3 个 campaign 做 Amazon Ads AI 建议人工批准测试\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>SP/SB campaigns\u003c/td>\n\u003ctd>PPC\u003c/td>\n\u003ctd>2026-09-30\u003c/td>\n\u003ctd>测试 campaign 有 ACOS、TACOS、CVR、库存和 7 天复盘字段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>向货代确认 EU handling fee 是否已进报价口径\u003c/td>\n\u003ctd>DE/FR/IT/ES\u003c/td>\n\u003ctd>小包/清关报价\u003c/td>\n\u003ctd>欧洲运营/供应链\u003c/td>\n\u003ctd>2026-10-08\u003c/td>\n\u003ctd>至少 1 家货代书面回复；模板新增 placeholder\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>已关闭与继续跟踪事项\u003c/h2>\n\u003cul>\n\u003cli>关闭：本周无新的 Amazon Listing/A+/图片/Search Terms 全量强制规则，重复零售预热和行业评论不再进入下周主线。\u003c/li>\n\u003cli>继续跟踪：Product Bundling 风险清单，下一次检查 2026-09-25。\u003c/li>\n\u003cli>继续跟踪：PBDD 主推池，下一次检查 2026-09-28。\u003c/li>\n\u003cli>继续跟踪：USPS 旺季价格在 Amazon Buy Shipping 的账号侧同步，下一次检查 2026-10-05。\u003c/li>\n\u003cli>继续跟踪：Amazon Ads campaign intelligence/auto-optimization 在 US 账号可见性，下一次检查 2026-10-03。\u003c/li>\n\u003cli>继续跟踪：EU handling fee delegated act 金额，下一次检查 2026-10-15。\u003c/li>\n\u003c/ul>\n\u003ch2>来源与可信度统计\u003c/h2>\n\u003cp>本周合并使用官方/监管/一手来源 10 个：Amazon Ads、Amazon Seller Central Forums、About Amazon、European Commission Taxation and Customs Union、USPS、USPS Postal Explorer、EIA、中国政府网/国务院办公厅、CPSC、GOV.UK OPSS。非官方或行业辅助来源仅用于排重和线索发现，未作为执行动作依据。仍待确认事项为账号侧可见性和执行数据：PBDD 后台状态、Buy Shipping 实际价格、Product Bundling 账号提醒、Amazon Ads 新工具入口、EU handling fee 金额。\u003c/p>\n\u003cp>生产链接：\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-24\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-09-24", "text": "## 今日新情报\n\n今日无符合增量标准的首次发现新事件。检索到的 Amazon Accelerate、Prime Big Deal Days 零售预热、AI shopping 评论和行业转载均未形成新的 Seller Central 后台动作或新增运营事实。\n\n", "title": "今日新情报", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-24\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-24\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch2>今日新情报\u003c/h2>\n\u003cp>今日无符合增量标准的首次发现新事件。检索到的 Amazon Accelerate、Prime Big Deal Days 零售预热、AI shopping 评论和行业转载均未形成新的 Seller Central 后台动作或新增运营事实。\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-24\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-24", "text": "### USPS 2026 旺季临时包裹价格文件从待确认转为 Final\n\n- 历史事件：usps-2026-holiday-temporary-package-price-adjustment\n- 上次状态：已知 USPS 发布 2026 旺季临时包裹价格调整，适用 2026-10-04 至 2027-01-17，但 prior push 仍按“待 PRC/Buy Shipping 确认”处理。\n- 本次新增变化：Postal Explorer 的 Time-Limited 2026 Price File、CSV Price Files 和 Notice 123 均显示 Final，修订日期为 2026-09-18；适用窗口仍为 2026-10-04 至 2027-01-17。来源：USPS Postal Explorer https://pe.usps.com/PriceChange/Index；USPS 新闻稿 https://about.usps.com/newsroom/national-releases/2026/0825-usps-announces-temporary-price-change-for-2026-holiday-shipping-season.htm\n- 相比上次变化：从“价格调整已公告但需等待最终价格文件/Buy Shipping 体现”升级为“USPS 官方价格文件已最终化，可进入 US FBM 与应急自配送测算”。\n- 变化原因：USPS 将 time-limited price file 和 Notice 123 状态更新为 Final，价格文件可用于成本模型和自配送兜底方案。\n- 行动是否需要调整：升级为 P2 成本模型动作。US 运营/财务在 2026-09-26 前更新 1 lb、2 lb、3 lb、5 lb 和相册/Portfolio Binder 常见箱规的 USPS Ground Advantage、Priority Mail、Parcel Select 费用；路径：Seller Central > Orders > Buy Shipping 试算，或 USPS price file 导入成本表。验收标准：输出“当前运费、10/4 后运费、差额、是否影响 Coupon/PED 毛利、是否需要改用 FBA/3PL”的清单。\n\n", "title": "USPS 2026 旺季临时包裹价格文件从待确认转为 Final", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-24\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-24\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>USPS 2026 旺季临时包裹价格文件从待确认转为 Final\u003c/h3>\n\u003cul>\n\u003cli>历史事件：usps-2026-holiday-temporary-package-price-adjustment\u003c/li>\n\u003cli>上次状态：已知 USPS 发布 2026 旺季临时包裹价格调整，适用 2026-10-04 至 2027-01-17，但 prior push 仍按“待 PRC/Buy Shipping 确认”处理。\u003c/li>\n\u003cli>本次新增变化：Postal Explorer 的 Time-Limited 2026 Price File、CSV Price Files 和 Notice 123 均显示 Final，修订日期为 2026-09-18；适用窗口仍为 2026-10-04 至 2027-01-17。来源：USPS Postal Explorer \u003ca href=\"https://pe.usps.com/PriceChange/Index；USPS\" target=\"_blank\" rel=\"noopener noreferrer\">https://pe.usps.com/PriceChange/Index；USPS\u003c/a> 新闻稿 \u003ca href=\"https://about.usps.com/newsroom/national-releases/2026/0825-usps-announces-temporary-price-change-for-2026-holiday-shipping-season.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://about.usps.com/newsroom/national-releases/2026/0825-usps-announces-temporary-price-change-for-2026-holiday-shipping-season.htm\u003c/a>\u003c/li>\n\u003cli>相比上次变化：从“价格调整已公告但需等待最终价格文件/Buy Shipping 体现”升级为“USPS 官方价格文件已最终化，可进入 US FBM 与应急自配送测算”。\u003c/li>\n\u003cli>变化原因：USPS 将 time-limited price file 和 Notice 123 状态更新为 Final，价格文件可用于成本模型和自配送兜底方案。\u003c/li>\n\u003cli>行动是否需要调整：升级为 P2 成本模型动作。US 运营/财务在 2026-09-26 前更新 1 lb、2 lb、3 lb、5 lb 和相册/Portfolio Binder 常见箱规的 USPS Ground Advantage、Priority Mail、Parcel Select 费用；路径：Seller Central &gt; Orders &gt; Buy Shipping 试算，或 USPS price file 导入成本表。验收标准：输出“当前运费、10/4 后运费、差额、是否影响 Coupon/PED 毛利、是否需要改用 FBA/3PL”的清单。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-24\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-24", "text": "### EIA 9 月 22 日柴油价更新继续抬高 US Q4 物流成本压力\n\n- 历史事件：us-eia-diesel-logistics-cost-signal-2026-09-09\n- 上次状态：2026-09-16 已推送 EIA 9 月中旬柴油价格作为 US Q4 landed cost 和促销毛利敏感性输入，要求结合实际报价验证。\n- 本次新增变化：EIA 2026-09-22 数据显示，美国 on-highway diesel 价格在 2026-09-21 为 USD 6.529/gal，较 2026-09-14 的 USD 6.285/gal 上涨 USD 0.244/gal；West Coast 为 USD 7.456/gal，California 为 USD 8.246/gal。来源：EIA Gasoline and Diesel Fuel Update https://www.eia.gov/petroleum/gasdiesel/\n- 相比上次变化：柴油成本信号从“需要观察”变为“连续高位并继续上行”，对美西入仓、港口拖车、3PL 转运和 FBM 应急配送的成本压力更明确。\n- 变化原因：美国能源价格上行，柴油价格直接影响卡车派送、港口拖车、区域转运和旺季附加费报价。\n- 行动是否需要调整：继续原动作但把复核日期提前到 2026-09-26。供应链/财务导出所有 2026-10 入仓或补货中的 US 货件，字段包含目的 FC/3PL、预计到港/到仓、承运商、最后一英里方式、当前报价、燃油附加费和 ASIN 毛利率；只在实际报价或附加费超过模型 +3% 时调整促销毛利测算，不做全店涨价。\n\n", "title": "EIA 9 月 22 日柴油价更新继续抬高 US Q4 物流成本压力", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-24\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-24\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>EIA 9 月 22 日柴油价更新继续抬高 US Q4 物流成本压力\u003c/h3>\n\u003cul>\n\u003cli>历史事件：us-eia-diesel-logistics-cost-signal-2026-09-09\u003c/li>\n\u003cli>上次状态：2026-09-16 已推送 EIA 9 月中旬柴油价格作为 US Q4 landed cost 和促销毛利敏感性输入，要求结合实际报价验证。\u003c/li>\n\u003cli>本次新增变化：EIA 2026-09-22 数据显示，美国 on-highway diesel 价格在 2026-09-21 为 USD 6.529/gal，较 2026-09-14 的 USD 6.285/gal 上涨 USD 0.244/gal；West Coast 为 USD 7.456/gal，California 为 USD 8.246/gal。来源：EIA Gasoline and Diesel Fuel Update \u003ca href=\"https://www.eia.gov/petroleum/gasdiesel/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.eia.gov/petroleum/gasdiesel/\u003c/a>\u003c/li>\n\u003cli>相比上次变化：柴油成本信号从“需要观察”变为“连续高位并继续上行”，对美西入仓、港口拖车、3PL 转运和 FBM 应急配送的成本压力更明确。\u003c/li>\n\u003cli>变化原因：美国能源价格上行，柴油价格直接影响卡车派送、港口拖车、区域转运和旺季附加费报价。\u003c/li>\n\u003cli>行动是否需要调整：继续原动作但把复核日期提前到 2026-09-26。供应链/财务导出所有 2026-10 入仓或补货中的 US 货件，字段包含目的 FC/3PL、预计到港/到仓、承运商、最后一英里方式、当前报价、燃油附加费和 ASIN 毛利率；只在实际报价或附加费超过模型 +3% 时调整促销毛利测算，不做全店涨价。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-24\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-24", "text": "### EU Customs Reform 小包 handling fee 引入节点更明确\n\n- 历史事件：eu-customs-reform-implementation-2026-09-21\n- 上次状态：2026-09-22 已推送 EU Customs Reform 进入实施阶段，重点关注 EU Customs Authority/Data Hub、低价值电商包裹责任和 pending handling fee。\n- 本次新增变化：European Commission 官方页面明确，小包 Union handling fee 将在 2026-11-01 前引入，金额由 delegated act 决定；Data Hub 对电商进口/出口记录的强制使用日期仍为 2028-07-01。来源：European Commission Taxation and Customs Union https://taxation-customs.ec.europa.eu/customs/eu-customs-reform_en\n- 相比上次变化：handling fee 从“待公布的方向性费用”推进为“已有最晚引入时间点，金额仍待公布”，可先进入 DE/FR/IT/ES landed cost 模板的预留字段。\n- 变化原因：欧盟改革进入实施期，电商小包、平台/卖家/承运人责任和海关成本补偿机制开始落地。\n- 行动是否需要调整：继续 P2 准备，不改售价。欧洲运营/财务/ERP 在 2026-10-08 前把 DE/FR/IT/ES 小包模型新增字段：customs duty、temporary EUR 3 duty、Union handling fee placeholder、IOSS/进口方、平台/卖家/承运人责任、货代确认日期。验收方式：货代邮件或报价单明确是否已包含 handling fee；金额未公布前不得把假设值写入正式售价表。\n\n", "title": "EU Customs Reform 小包 handling fee 引入节点更明确", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-24\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-24\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>EU Customs Reform 小包 handling fee 引入节点更明确\u003c/h3>\n\u003cul>\n\u003cli>历史事件：eu-customs-reform-implementation-2026-09-21\u003c/li>\n\u003cli>上次状态：2026-09-22 已推送 EU Customs Reform 进入实施阶段，重点关注 EU Customs Authority/Data Hub、低价值电商包裹责任和 pending handling fee。\u003c/li>\n\u003cli>本次新增变化：European Commission 官方页面明确，小包 Union handling fee 将在 2026-11-01 前引入，金额由 delegated act 决定；Data Hub 对电商进口/出口记录的强制使用日期仍为 2028-07-01。来源：European Commission Taxation and Customs Union \u003ca href=\"https://taxation-customs.ec.europa.eu/customs/eu-customs-reform_en\" target=\"_blank\" rel=\"noopener noreferrer\">https://taxation-customs.ec.europa.eu/customs/eu-customs-reform_en\u003c/a>\u003c/li>\n\u003cli>相比上次变化：handling fee 从“待公布的方向性费用”推进为“已有最晚引入时间点，金额仍待公布”，可先进入 DE/FR/IT/ES landed cost 模板的预留字段。\u003c/li>\n\u003cli>变化原因：欧盟改革进入实施期，电商小包、平台/卖家/承运人责任和海关成本补偿机制开始落地。\u003c/li>\n\u003cli>行动是否需要调整：继续 P2 准备，不改售价。欧洲运营/财务/ERP 在 2026-10-08 前把 DE/FR/IT/ES 小包模型新增字段：customs duty、temporary EUR 3 duty、Union handling fee placeholder、IOSS/进口方、平台/卖家/承运人责任、货代确认日期。验收方式：货代邮件或报价单明确是否已包含 handling fee；金额未公布前不得把假设值写入正式售价表。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-24\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}]}, {"date": "2026-09-23", "text": "# 亚马逊及海外市场情报增量日报｜2026-09-23\n\n## 今日判断\n\n今日没有发现 Amazon US/UK/DE/FR/IT/ES 对 Listing、图片、A+、Search Terms、属性、变体、FBA 费用或 Seller Central 账户绩效发布新的全量强制规则。今天最值得管理层关注的是 Amazon Ads 在 2026-09-22 发布 sponsored ads 新 AI 工具：Ads data manager 已扩展到 sponsored ads 并全球可用，US campaign intelligence 将在 2026-10 上线，auto-optimization 将在 2027-01 于 US 上线。最高优先级仍是 Prime Big Deal Days 促销提交截止后的异常关闭，重点站点为 US/UK/DE/FR/IT/ES；最紧急日期是 2026-09-23 当天完成 PBDD 主推 ASIN 促销、库存和广告预算复核。Product Bundling 风险清单仍按 2026-09-25 内部截止推进，但今天没有新增官方事实。\n\n## 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n|---|---|---|---|---|---|\n| P1 | Prime Big Deal Days 促销截止后异常关闭 | US/UK/DE/FR/IT/ES | Deals/Coupons/PED/库存/广告预算 | 2026-09-23 当天复查；PBDD 2026-10-06 至 2026-10-07 | 是，逐个主推 ASIN 检查促销可执行、库存和广告预算 |\n| P2 | Amazon Ads sponsored ads 新 AI 工具进入排期 | US 优先/多站点观察 | SP/SB/SD/Ads data manager/一方数据/竞价预算 | Ads data manager 全球已可用；US intelligence 2026-10；US auto-optimization 2027-01 | 是，7 天内做小范围账号盘点，不自动放权 |\n| P2 | Product Bundling 风险清单继续推进 | US/多站点观察 | Listing/合规/库存清仓 | 2026-09-25 完成第一版；2027-01-11 新要求生效 | 是，按昨日口径继续导出和分层 |\n\n## 今日新情报\n\n### Amazon Ads 发布 sponsored ads 新 AI 工具与一方数据扩展\n\n- 【影响等级】P2\n- 【站点】US 优先/多站点观察\n- 【发布日期】2026-09-22\n- 【生效日期】Ads data manager 扩展至 sponsored ads 已全球可用；US intelligence dashboard 2026-10；US auto-optimization 2027-01\n- 【信息状态】正式公告\n- 【来源】Amazon Ads：https://advertising.amazon.com/library/expert-advice/sponsored-ads-small-business-tools\n\n发生了什么：Amazon Ads 公告称 sponsored ads 将新增 campaign intelligence、auto-optimization，并把 Ads data manager 的一方数据能力扩展到 sponsored ads。campaign intelligence 会在 campaign overview 页面给出 targeting、bidding、budget 相关解释和建议；auto-optimization 可在现有 campaign settings 内自动扩展商品投放、添加相关关键词并暂停低效关键词；Ads data manager 已可用于 sponsored ads，支持用网站活动、邮箱等一方数据结合 Amazon 信号。\n\n我们怎么看：这不是强制改广告结构的规则，但会改变 US PPC 日常优化方式，尤其影响手工关键词收割、否定词、商品投放扩展、预算重分配和一方数据再营销。对相册、补充页、School Memory Book、Portfolio Binder 等季节性 SKU，机会在于更快捕捉 wedding、back-to-school、holiday gifting 等词包；风险是自动优化如果未设 ACOS/TACOS、库存覆盖和利润底线，可能放大低毛利或缺货 ASIN 的花费。\n\n建议动作：PPC 负责人 2026-09-30 前在 US 账号建立“AI 建议复核”表，不直接开启全账号自动优化。路径按 Amazon Ads console：Campaign manager > Sponsored ads > Campaign overview，先抽取近 30 天 spend Top 20 的 SP/SB campaigns，记录建议类型、预估影响、是否可编辑/跳过、当前 ACOS、TACOS、CVR、库存覆盖天数和毛利率。验证方式：仅选择 3 个有库存覆盖 30 天以上、毛利率高于目标线、ACOS 低于目标 +10% 的 campaign 做人工批准测试；任何自动新增关键词必须在 7 天后核对花费、订单、ACOS 和搜索词相关性。\n\n## 已有事件的重要更新\n\n### Prime Big Deal Days 促销提交进入截止后异常关闭\n\n- 历史事件：amz-q4-peak-holiday-2026-deadlines / amz-eu-q4-peak-holiday-2026-deadlines\n- 上次状态：2026-09-22 已推送为当天复查 Deal/Coupons/Prime Exclusive Discount 提交状态、可售库存、FC receiving 和 reserved units。\n- 本次新增变化：2026-09-22 账号内复查日已过，今天的动作从“是否提交”转为“是否可执行、是否有库存不足、预算是否能承接流量、无 deal 资格 ASIN 是否有 Coupon/PED 兜底”。公开零售时间仍为 2026-10-06 至 2026-10-07，具体 deal 状态必须以各站点 Seller Central 后台为准。\n- 变化原因：PBDD 从提报窗口后段进入执行准备期，运营风险从错过提报扩展到促销上线失败、库存不足、广告预算不足和主推 ASIN 流量承接不足。\n- 行动是否需要调整：继续原动作但升级为当天异常关闭。US/UK/EU 运营今天在 Manage Deals、Coupons、Prime Exclusive Discounts、Manage Inventory、FBA Inventory 和广告 Campaign manager 交叉核对；不可执行或库存不足 ASIN 必须当天决定改 Coupon/PED、降级为常规广告承接、或退出主推池。\n\n## 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n|---|---|---|---|---|---|---|\n| P1 | 导出 PBDD 主推 ASIN 清单，逐个检查 Manage Deals、Coupons、Prime Exclusive Discounts 状态、可售库存、reserved units、FC receiving 和预计促销量 | US/UK/DE/FR/IT/ES | 运营/PPC | 2026-09-23 | 每个 ASIN 有状态、库存覆盖天数、活动链接或截图；异常 ASIN 标明兜底方式 | 2026-09-24 |\n| P2 | 建立 Amazon Ads AI 建议复核表，抽取近 30 天 spend Top 20 campaigns，记录 intelligence/auto-optimization 可见性和建议类型 | US | PPC | 2026-09-30 | 表内包含 campaign、ASIN、ACOS、TACOS、CVR、库存覆盖、建议动作、是否人工批准 | 2026-10-03 |\n| P2 | 继续导出疑似 bundle/kit/set/multipack/refill-page ASIN，并标记包装方、LOA、库存和处置路径 | US | Listing/合规 | 2026-09-25 | 输出 ASIN、品牌、包装方、是否有 LOA、库存数量、建议动作五列清单 | 2026-10-15 |\n\n## 持续关注\n\n- 事项：Product Bundling 新要求。当前状态：2027-01-11 生效口径已推送，内部清单截止 2026-09-25。下次复查日期：2026-09-25。触发升级条件：Account Health 出现 bundle listing violation、ASIN 被抑制、或供应商无法提供授权重包装文件。\n- 事项：Amazon Ads sponsored ads AI 工具。当前状态：Ads data manager 已扩展到 sponsored ads；US intelligence dashboard 和 auto-optimization 仍待排期上线。下次复查日期：2026-10-03。触发升级条件：US 账号出现 campaign intelligence 面板、auto-optimization 开关、或后台给出可一键应用的 bid/keyword/product targeting 建议。\n- 事项：EU Customs Reform 小包裹 handling fee。当前状态：欧盟已确认改革进入实施阶段，handling fee 金额仍待 delegated act。下次复查日期：2026-10-15。触发升级条件：欧盟公布 fee 金额、货代报价新增该费用、或 DE/FR/IT/ES 清关资料字段被退回。\n\n## 情报边界与可信度\n\n本次窗口覆盖 2026-09-22 09:03:39 至 2026-09-23 09:03:08（Asia/Shanghai）。复查来源约 15 个，其中官方/监管/一手来源 12 个，包括中国政府网/国务院办公厅、Amazon Ads、Amazon Seller Central/Forums、About Amazon、European Commission Taxation and Customs Union、CPSC、GOV.UK OPSS、USTR、CBP、EIA；非官方或行业辅助来源 3 个，仅用于发现线索与排重。纳入日报的新事件 1 条，纳入已有事件重要更新 1 条；仍待确认事项 3 条：PBDD 各账号实际可执行状态、Product Bundling 账号侧风险提醒、Amazon Ads 新工具在 US 账号的可见范围。\n\n今天排除了重复的 Prime Big Deal Days 零售预热、Amazon Accelerate 参会类内容、无新增后台动作的 AI shopping 评论、与相册/纸品/礼品/收纳/拼图配件产品线无直接关系的 CPSC/OPSS 召回，以及没有官方确认的新关税传闻。以上信息没有形成新的强制后台动作，避免团队误以为漏看。\n\n工作日门禁来源：中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（https://big5.www.gov.cn/gate/big5/www.gov.cn/zhengce/zhengceku/202511/content_7047091.htm）。2026-09-23 为周三，不在中秋节 2026-09-25 至 2026-09-27 假期内，因此按中国大陆法定工作日运行。本周最后一个大陆法定工作日为 2026-09-24，今天不生成周报。\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-23\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-23\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报增量日报｜2026-09-23\u003c/h1>\n\u003ch2>今日判断\u003c/h2>\n\u003cp>今日没有发现 Amazon US/UK/DE/FR/IT/ES 对 Listing、图片、A+、Search Terms、属性、变体、FBA 费用或 Seller Central 账户绩效发布新的全量强制规则。今天最值得管理层关注的是 Amazon Ads 在 2026-09-22 发布 sponsored ads 新 AI 工具：Ads data manager
