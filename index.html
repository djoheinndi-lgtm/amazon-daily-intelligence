\">亚马逊及海外市场情报增量日报｜2026-10-16\u003c/h1>\n\u003cp>完整日报已同步至生产页：&lt;\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site&gt;\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site&gt;\u003c/a>\u003c/p>\n\u003cp>今日判断：US FBA 2026 旺季履约费已于 2026-10-15 生效，BFCM Deal 候选 ASIN 必须按新履约费及 3.5% fuel and logistics-related surcharge 重算最低促销价、贡献毛利和可承受 ACoS。EIA 柴油均价小降至 USD 6.179/gal，仅用于更新未锁价物流成本假设，不足以抵消旺季 FBA 费用。最紧急动作是 2026-10-16 完成 US 候选 ASIN 费用切换核对，2026-10-20 前完成 Deal 提交。\u003c/p>\n\u003cp>来源：Amazon Seller Central FBA fulfillment fee；U.S. EIA Gasoline and Diesel Fuel Update；中国政府网 2026 年节假日安排。\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-10-16\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": []}, {"date": "2026-10-14", "text": "# 亚马逊及海外市场情报增量日报｜2026-10-14\n\n## 今日判断\n\n今天没有 P0 级别的 Amazon 后台强制变化，但有两个需要运营团队实际处理的增量信号：EU Customs Reform 的 Union handling fee 从“金额待确认”推进为 2026-11-01 起每个 distinct item 收取 EUR 2，UK OPSS 又发布多条 Amazon 渠道商品安全通报。最高优先级是 DE/FR/IT/ES 的 EU 小包 landed cost 模型更新，以及 US BFCM Deal 候选池今天完成内部预审。重点站点为 DE/FR/IT/ES、UK 和 US；最紧急截止日是 2026-10-14 的 BFCM 预审，其次是 2026-10-15 的 CSBA 问答窗口和 2026-10-16 的 UK 风险词筛查。今天不建议因为 CSBA 或 OPSS 单点信息做全账号策略切换，动作以成本模型、候选池筛选和定向合规排查为主。\n\n2026-10-14 是中国大陆法定工作日，且不是本周最后一个大陆法定工作日，因此本次只生成增量日报，不追加周报。检索窗口为 2026-10-13 09:04:52 至 2026-10-14 09:04:10（Asia/Shanghai），并补查长期索引中的待确认和持续关注事项。\n\n## 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n|---|---|---|---|---|---|\n| P1 | EU Customs Reform：Union handling fee 确认为每个 distinct item EUR 2 | DE/FR/IT/ES | landed cost、定价、物流、产品组合 | 2026-11-01 生效；内部模型 2026-10-20 前更新 | 是。更新 EU 成本模型，暂不直接改价 |\n| P1 | BFCM Deal 候选池内部预审 | US | 促销、库存、毛利、PPC | 2026-10-14 内部预审；2026-10-20 Amazon 提交 | 是。今天必须完成候选 ASIN 过滤 |\n| P2 | UK OPSS 新增 Amazon 渠道玩具/灯具安全通报 | UK | 合规、产品开发、Listing 风险词 | 2026-10-13 发布；2026-10-16 内部筛查 | 是。仅做定向排查 |\n| P2 | Amazon CSBA 官方问答窗口 | US/UK seller-fulfilled 相关 | 客服、退货、SAFE-T、FBM 体验 | 2026-10-13 至 2026-10-15 5pm PDT | 视账号情况。只提问和小样本评估 |\n| P2 | FBA Partial Refunds 退货原因白名单复查 | US/UK/DE/FR/IT/ES | 退货、客服、财务 | 2026-10-16 复查 | 是。验证默认开启范围和退款影响 |\n\n## 今日新情报\n\n### UK OPSS 新增多条 Amazon 渠道商品安全通报\n\n- 【影响等级】P2\n- 【站点】UK\n- 【发布日期】2026-10-13\n- 【生效日期】2026-10-13\n- 【信息状态】正式监管报告\n- 【来源】UK Office for Product Safety and Standards：\n  https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-toddler-ghost-costume-sold-via-amazon-2609-0106；\n  https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-intedesign-plush-caterpillar-toys-sold-via-amazon-2609-0224；\n  https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-oowolf-led-light-sold-via-amazon-2609-0221；\n  https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-frideko-home-led-floor-lamp-sold-via-amazon-2610-0006\n- 发生了什么：OPSS 在 2026-10-13 发布多条 Amazon 渠道商品安全报告，覆盖 Toddler Ghost Costume、InteDesign plush caterpillar toys、OOWOLF LED light 和 Frideko Home LED floor lamp。风险包括儿童玩具绳带/包装厚度/填充物导致的窒息、 choking、strangulation，以及灯具触电风险；措施包括 Amazon 下架和边境拒收。\n- 我们怎么看：直接产品线不是相册/补充页/记忆册，但对 UK 儿童、礼品、手工套装、带包装小配件和电器类开发项目有合规提示。对现有相册纸品 Listing 的直接销售影响低；对新品开发和供应商准入的影响高于对广告或库存的影响。\n- 建议动作：合规负责人在 2026-10-16 前完成 UK SKU 与开发项目筛查。路径建议：Seller Central > Inventory > Manage All Inventory 导出 UK active/inactive SKU；产品开发表同步筛选 title、bullet、category、supplier、country of origin、age grading、UKCA/CE、packaging thickness、small parts、cord/loop、LED/electric/lamp 字段。筛选对象为 toys、plush、costume、kids、school activity kit、craft kit、LED、light、lamp、electric、battery、plug、cord、loop、string、small parts、plastic bag。验收方式：输出“无匹配 / 需补资料 / 暂停开发 / 下架核查”四类清单；若无匹配 SKU 或开发项目，记录关闭依据，不调整 Listing 和广告。\n\n### Amazon CSBA 官方问答窗口开启，适合 FBM 客服风险小样本评估\n\n- 【影响等级】P2\n- 【站点】US/UK seller-fulfilled 相关\n- 【发布日期】2026-10-13\n- 【生效日期】问答窗口 2026-10-13 至 2026-10-15 5pm PDT；新 enroll seller 的 90-day trial 从第一笔 self-fulfilled shipped order 开始\n- 【信息状态】正式 Amazon Seller Forums 运营公告/问答\n- 【来源】Amazon Seller Forums：https://sellercentral.amazon.co.uk/seller-forums/discussions/t/42fdef8c-c107-4d49-b092-b747649686ec\n- 发生了什么：Amazon CSBA 团队在 Seller Forums 开启问答，说明 CSBA 可为 seller-fulfilled orders 处理售后咨询、退货、退款等，且新 Professional sellers 可在 CSBA settings page enroll。Amazon 同时引用历史数据称 CSBA 可能改善 ODR、negative feedback rate 和 customer satisfaction，但论坛回复也集中质疑退款控制、费用、return label 与 SAFE-T claims。\n- 我们怎么看：这不是强制政策变化，也不是 FBA 主业务的必选动作。对我们只有在 US/UK 存在 FBM、SFP、应急自发货或高峰期临时自发货订单时才有评估价值；主要风险是客服外包后退款倾向、SAFE-T 争议和毛利不可控。\n- 建议动作：运营/客服负责人在 2026-10-15 5pm PDT 前整理 3 个问题提交或记录：费用触发口径、退款授权边界、return label 和 SAFE-T claims 处理责任。若账号存在 FBM，应在 Seller Central > Settings > Customer Service by Amazon 页面只做可见性检查，不直接全量开启；用近 30 天 FBM 订单计算 ODR、negative feedback rate、退款金额/订单、SAFE-T claim 成功率和客服响应时效，只有当可控样本毛利和退款上限清楚时才进入 90-day trial。\n\n## 已有事件的重要更新\n\n### EU Customs Reform / eu-customs-reform-implementation-2026-09-21\n\n- 历史事件：EU Customs Reform implementation phase and ecommerce Data Hub / small parcel cost changes。\n- 上次状态：2026-09-24 已推送“small parcel Union handling fee 将在 2026-11-01 前引入，金额 subject to delegated act；ecommerce Data Hub mandatory date 仍为 2028-07-01”。\n- 本次新增变化：European Commission 2026-10-07 最新消息明确写出：From 1 November 2026, the EU will apply the EUR 2 Union handling fee；Revenue Ireland 同步说明 UHF 为每个 distinct item EUR 2，适用于从 EU 外发往 EU 消费者的电商包裹，无价值门槛，且 non-refundable。来源：\n  https://taxation-customs.ec.europa.eu/customs/eu-customs-reform_en；\n  https://www.revenue.ie/en/customs/individuals/union-handling-fee/index.aspx；\n  https://www.revenue.ie/en/corporate/press-office/press-releases/2026/pr-092926-handling-fee.aspx\n- 变化原因：EU Customs Reform 已进入分阶段实施，成员国税务/海关机构开始发布面向包裹申报和消费者的执行说明，原来待确认的 UHF 金额和适用日期有了官方口径。\n- 行动是否需要调整：升级为 P1 成本模型动作，但不直接改售价。供应链/财务在 2026-10-20 前把 DE/FR/IT/ES 低价值跨境包裹、非 EU 发货、bundle/multipack/refill-page 组合 SKU 的 landed cost 模板增加“EUR 2 per distinct item UHF”字段；同时保留“由平台、承运商、报关主体或卖家承担”的待确认字段，等 Amazon 或货代账单口径确认后再决定是否传导到售价、促销底价或 EU FBM/直发策略。\n\n## 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n|---|---|---|---|---|---|---|\n| P1 | 更新 EU landed cost 模板：新增 EUR 2 per distinct item UHF，并对相册套装、补充页、多件装做 20 个 ASIN 样本测算 | DE/FR/IT/ES | 供应链/财务 | 2026-10-20 | 模板出现 UHF 字段、distinct item 口径、承担方待确认字段和样本毛利影响 | 2026-10-21 |\n| P1 | 完成 US BFCM Deal 候选 ASIN 预审：导出候选、PBDD 销售/CVR/ACoS、Deal Health、可售库存和最低促销价 | US | US 运营/PPC/财务 | 2026-10-14 | 只保留毛利达标、库存覆盖活动销量 1.3 倍以上、Deal Health 正常、PPC 预算可承接的 ASIN | 2026-10-20 |\n| P2 | UK OPSS 风险词筛查：导出 UK SKU 和开发项目，筛 toys/plush/costume/kids/craft kit/LED/light/lamp/electric/cord/loop/small parts/plastic bag | UK | 合规/产品开发 | 2026-10-16 | 输出四类清单：无匹配、需补资料、暂停开发、Listing 核查；无匹配也要留存关闭依据 | 2026-10-21 |\n| P2 | CSBA 小样本评估：确认账号是否可见 CSBA settings page，整理费用、退款授权、return label、SAFE-T claims 四类问题 | US/UK | 运营/客服 | 2026-10-15 | 形成是否试用的 yes/no 记录；若试用，限定 FBM 样本、退款阈值和复盘指标 | 2026-10-22 |\n| P2 | FBA Partial Refunds 白名单复查：抽查已开启账号的 return reason 默认勾选范围和近 7 天退款/差评变化 | 多站点 | 运营/客服/财务 | 2026-10-16 | damaged/wrong item/safety concern/not as described 不被误开；节省金额高于新增差评和退款风险 | 2026-10-23 |\n\n## 持续关注\n\n- 事项：EU Customs Reform UHF 承担方与 Amazon/承运商账单口径。当前状态：EUR 2 金额和 2026-11-01 日期已确认，但 Amazon 站内结算、货代转嫁和报关主体口径仍需确认。下次复查日期：2026-10-21。触发升级条件：Amazon、货代或税务账单明确由卖家承担，或 bundle/multipack/refill-page 每件拆分口径导致毛利下降超过 1 个百分点。\n- 事项：US BFCM Deal 提交。当前状态：内部预审今天到期，Amazon 提交截止 2026-10-20。下次复查日期：2026-10-20。触发升级条件：Deal Health 异常、可售库存不足、最低促销价低于毛利底线、PPC 预算无法覆盖或 Account Health 出现警告。\n- 事项：商业责任险 Nov 2 账号适用性确认。当前状态：需按 Seller Central 后台确认 enhanced safety categories、中国大陆卖家 AIA 路径、保单实体和有效期。下次复查日期：2026-10-17。触发升级条件：后台出现 insurance warning、保额/实体不匹配、或新增 ASIN 被要求补商业责任险材料。\n- 事项：Return and Recovery Insights。当前状态：新版 Seller Central 已可用于退货原因和 recovery value 分析。下次复查日期：2026-10-23。触发升级条件：任一父 ASIN 近 90 天退货率高于类目目标 20% 以上，或主因集中在 not as described、damaged、missing parts、wrong item。\n\n## 情报边界与可信度\n\n本次门禁使用中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（国办发明电〔2025〕7号，https://www.gov.cn/zhengce/zhengceku/202511/content_7047091.htm）。官方安排显示 2026 年国庆节为 2026-10-01 至 2026-10-07 放假调休，2026-09-20 和 2026-10-10 上班；2026-10-14 不在法定假期内，为周三正常大陆工作日。2026-10-15 和 2026-10-16 仍为本周后续工作日，所以今天不是本周最后一个中国大陆法定工作日，不生成周报。\n\n本次复查来源和线索约 26 个，其中官方/监管/一手来源约 19 个，非官方或行业辅助来源约 7 个；纳入日报的新事件 2 条，已有事件实质更新 1 条，仍待确认事项 4 条。官方/一手来源覆盖中国政府网、Amazon Seller Forums、UK OPSS、European Commission Taxation and Customs Union、Revenue Ireland、Amazon Ads What's New、EIA、Drewry、CPSC 和长期索引内 Amazon/监管原始链接。\n\n今天排除了重复的 Prime Big Deal Days 零售宣传、Amazon Accelerate/unBoxed 内容回顾、AWS 企业服务条款更新、无 Seller Central 后台规则变化的 UI/论坛讨论、与相册/纸品/礼品/收纳/拼图配件无直接关系的 UK/US 召回项、发布日期早于本次窗口且已推送的 OPSS 10/09 pimple squishes 信息、Amazon Ads 展示型案例或品牌营销内容、以及没有 USTR/CBP/European Commission/Amazon 官方确认的新关税传闻。EIA 柴油页面在本次北京时间运行时未出现新的 2026-10-14 可用值；Drewry WCI 仍等待 2026-10-15 下一次周度更新，因此未把物流指数重复推送为新变化。\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-14\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-14\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报增量日报｜2026-10-14\u003c/h1>\n\u003ch2>今日判断\u003c/h2>\n\u003cp>今天没有 P0 级别的 Amazon 后台强制变化，但有两个需要运营团队实际处理的增量信号：EU Customs Reform 的 Union handling fee 从“金额待确认”推进为 2026-11-01 起每个 distinct item 收取 EUR 2，UK OPSS 又发布多条 Amazon 渠道商品安全通报。最高优先级是 DE/FR/IT/ES 的 EU 小包 landed cost 模型更新，以及 US BFCM Deal 候选池今天完成内部预审。重点站点为 DE/FR/IT/ES、UK 和 US；最紧急截止日是 2026-10-14 的 BFCM 预审，其次是 2026-10-15 的 CSBA 问答窗口和 2026-10-16 的 UK 风险词筛查。今天不建议因为 CSBA 或 OPSS 单点信息做全账号策略切换，动作以成本模型、候选池筛选和定向合规排查为主。\u003c/p>\n\u003cp>2026-10-14 是中国大陆法定工作日，且不是本周最后一个大陆法定工作日，因此本次只生成增量日报，不追加周报。检索窗口为 2026-10-13 09:04:52 至 2026-10-14 09:04:10（Asia/Shanghai），并补查长期索引中的待确认和持续关注事项。\u003c/p>\n\u003ch2>优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>影响站点\u003c/th>\n\u003cth>影响模块\u003c/th>\n\u003cth>截止/生效日期\u003c/th>\n\u003cth>今天是否需要动作\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>EU Customs Reform：Union handling fee 确认为每个 distinct item EUR 2\u003c/td>\n\u003ctd>DE/FR/IT/ES\u003c/td>\n\u003ctd>landed cost、定价、物流、产品组合\u003c/td>\n\u003ctd>2026-11-01 生效；内部模型 2026-10-20 前更新\u003c/td>\n\u003ctd>是。更新 EU 成本模型，暂不直接改价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>BFCM Deal 候选池内部预审\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>促销、库存、毛利、PPC\u003c/td>\n\u003ctd>2026-10-14 内部预审；2026-10-20 Amazon 提交\u003c/td>\n\u003ctd>是。今天必须完成候选 ASIN 过滤\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>UK OPSS 新增 Amazon 渠道玩具/灯具安全通报\u003c/td>\n\u003ctd>UK\u003c/td>\n\u003ctd>合规、产品开发、Listing 风险词\u003c/td>\n\u003ctd>2026-10-13 发布；2026-10-16 内部筛查\u003c/td>\n\u003ctd>是。仅做定向排查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Amazon CSBA 官方问答窗口\u003c/td>\n\u003ctd>US/UK seller-fulfilled 相关\u003c/td>\n\u003ctd>客服、退货、SAFE-T、FBM 体验\u003c/td>\n\u003ctd>2026-10-13 至 2026-10-15 5pm PDT\u003c/td>\n\u003ctd>视账号情况。只提问和小样本评估\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>FBA Partial Refunds 退货原因白名单复查\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES\u003c/td>\n\u003ctd>退货、客服、财务\u003c/td>\n\u003ctd>2026-10-16 复查\u003c/td>\n\u003ctd>是。验证默认开启范围和退款影响\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>今日新情报\u003c/h2>\n\u003ch3>UK OPSS 新增多条 Amazon 渠道商品安全通报\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】UK\u003c/li>\n\u003cli>【发布日期】2026-10-13\u003c/li>\n\u003cli>【生效日期】2026-10-13\u003c/li>\n\u003cli>【信息状态】正式监管报告\u003c/li>\n\u003cli>【来源】UK Office for Product Safety and Standards：\u003c/li>\n\u003cp>\u003ca href=\"https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-toddler-ghost-costume-sold-via-amazon-2609-0106；\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-toddler-ghost-costume-sold-via-amazon-2609-0106；\u003c/a> \u003ca href=\"https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-intedesign-plush-caterpillar-toys-sold-via-amazon-2609-0224；\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-intedesign-plush-caterpillar-toys-sold-via-amazon-2609-0224；\u003c/a> \u003ca href=\"https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-oowolf-led-light-sold-via-amazon-2609-0221；\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-oowolf-led-light-sold-via-amazon-2609-0221；\u003c/a> \u003ca href=\"https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-frideko-home-led-floor-lamp-sold-via-amazon-2610-0006\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-frideko-home-led-floor-lamp-sold-via-amazon-2610-0006\u003c/a>\u003c/p>\n\u003cli>发生了什么：OPSS 在 2026-10-13 发布多条 Amazon 渠道商品安全报告，覆盖 Toddler Ghost Costume、InteDesign plush caterpillar toys、OOWOLF LED light 和 Frideko Home LED floor lamp。风险包括儿童玩具绳带/包装厚度/填充物导致的窒息、 choking、strangulation，以及灯具触电风险；措施包括 Amazon 下架和边境拒收。\u003c/li>\n\u003cli>我们怎么看：直接产品线不是相册/补充页/记忆册，但对 UK 儿童、礼品、手工套装、带包装小配件和电器类开发项目有合规提示。对现有相册纸品 Listing 的直接销售影响低；对新品开发和供应商准入的影响高于对广告或库存的影响。\u003c/li>\n\u003cli>建议动作：合规负责人在 2026-10-16 前完成 UK SKU 与开发项目筛查。路径建议：Seller Central &gt; Inventory &gt; Manage All Inventory 导出 UK active/inactive SKU；产品开发表同步筛选 title、bullet、category、supplier、country of origin、age grading、UKCA/CE、packaging thickness、small parts、cord/loop、LED/electric/lamp 字段。筛选对象为 toys、plush、costume、kids、school activity kit、craft kit、LED、light、lamp、electric、battery、plug、cord、loop、string、small parts、plastic bag。验收方式：输出“无匹配 / 需补资料 / 暂停开发 / 下架核查”四类清单；若无匹配 SKU 或开发项目，记录关闭依据，不调整 Listing 和广告。\u003c/li>\n\u003c/ul>\n\u003ch3>Amazon CSBA 官方问答窗口开启，适合 FBM 客服风险小样本评估\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】US/UK seller-fulfilled 相关\u003c/li>\n\u003cli>【发布日期】2026-10-13\u003c/li>\n\u003cli>【生效日期】问答窗口 2026-10-13 至 2026-10-15 5pm PDT；新 enroll seller 的 90-day trial 从第一笔 self-fulfilled shipped order 开始\u003c/li>\n\u003cli>【信息状态】正式 Amazon Seller Forums 运营公告/问答\u003c/li>\n\u003cli>【来源】Amazon Seller Forums：\u003ca href=\"https://sellercentral.amazon.co.uk/seller-forums/discussions/t/42fdef8c-c107-4d49-b092-b747649686ec\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.co.uk/seller-forums/discussions/t/42fdef8c-c107-4d49-b092-b747649686ec\u003c/a>\u003c/li>\n\u003cli>发生了什么：Amazon CSBA 团队在 Seller Forums 开启问答，说明 CSBA 可为 seller-fulfilled orders 处理售后咨询、退货、退款等，且新 Professional sellers 可在 CSBA settings page enroll。Amazon 同时引用历史数据称 CSBA 可能改善 ODR、negative feedback rate 和 customer satisfaction，但论坛回复也集中质疑退款控制、费用、return label 与 SAFE-T claims。\u003c/li>\n\u003cli>我们怎么看：这不是强制政策变化，也不是 FBA 主业务的必选动作。对我们只有在 US/UK 存在 FBM、SFP、应急自发货或高峰期临时自发货订单时才有评估价值；主要风险是客服外包后退款倾向、SAFE-T 争议和毛利不可控。\u003c/li>\n\u003cli>建议动作：运营/客服负责人在 2026-10-15 5pm PDT 前整理 3 个问题提交或记录：费用触发口径、退款授权边界、return label 和 SAFE-T claims 处理责任。若账号存在 FBM，应在 Seller Central &gt; Settings &gt; Customer Service by Amazon 页面只做可见性检查，不直接全量开启；用近 30 天 FBM 订单计算 ODR、negative feedback rate、退款金额/订单、SAFE-T claim 成功率和客服响应时效，只有当可控样本毛利和退款上限清楚时才进入 90-day trial。\u003c/li>\n\u003c/ul>\n\u003ch2>已有事件的重要更新\u003c/h2>\n\u003ch3>EU Customs Reform / eu-customs-reform-implementation-2026-09-21\u003c/h3>\n\u003cul>\n\u003cli>历史事件：EU Customs Reform implementation phase and ecommerce Data Hub / small parcel cost changes。\u003c/li>\n\u003cli>上次状态：2026-09-24 已推送“small parcel Union handling fee 将在 2026-11-01 前引入，金额 subject to delegated act；ecommerce Data Hub mandatory date 仍为 2028-07-01”。\u003c/li>\n\u003cli>本次新增变化：European Commission 2026-10-07 最新消息明确写出：From 1 November 2026, the EU will apply the EUR 2 Union handling fee；Revenue Ireland 同步说明 UHF 为每个 distinct item EUR 2，适用于从 EU 外发往 EU 消费者的电商包裹，无价值门槛，且 non-refundable。来源：\u003c/li>\n\u003cp>\u003ca href=\"https://taxation-customs.ec.europa.eu/customs/eu-customs-reform_en；\" target=\"_blank\" rel=\"noopener noreferrer\">https://taxation-customs.ec.europa.eu/customs/eu-customs-reform_en；\u003c/a> \u003ca href=\"https://www.revenue.ie/en/customs/individuals/union-handling-fee/index.aspx；\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.revenue.ie/en/customs/individuals/union-handling-fee/index.aspx；\u003c/a> \u003ca href=\"https://www.revenue.ie/en/corporate/press-office/press-releases/2026/pr-092926-handling-fee.aspx\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.revenue.ie/en/corporate/press-office/press-releases/2026/pr-092926-handling-fee.aspx\u003c/a>\u003c/p>\n\u003cli>变化原因：EU Customs Reform 已进入分阶段实施，成员国税务/海关机构开始发布面向包裹申报和消费者的执行说明，原来待确认的 UHF 金额和适用日期有了官方口径。\u003c/li>\n\u003cli>行动是否需要调整：升级为 P1 成本模型动作，但不直接改售价。供应链/财务在 2026-10-20 前把 DE/FR/IT/ES 低价值跨境包裹、非 EU 发货、bundle/multipack/refill-page 组合 SKU 的 landed cost 模板增加“EUR 2 per distinct item UHF”字段；同时保留“由平台、承运商、报关主体或卖家承担”的待确认字段，等 Amazon 或货代账单口径确认后再决定是否传导到售价、促销底价或 EU FBM/直发策略。\u003c/li>\n\u003c/ul>\n\u003ch2>今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>更新 EU landed cost 模板：新增 EUR 2 per distinct item UHF，并对相册套装、补充页、多件装做 20 个 ASIN 样本测算\u003c/td>\n\u003ctd>DE/FR/IT/ES\u003c/td>\n\u003ctd>供应链/财务\u003c/td>\n\u003ctd>2026-10-20\u003c/td>\n\u003ctd>模板出现 UHF 字段、distinct item 口径、承担方待确认字段和样本毛利影响\u003c/td>\n\u003ctd>2026-10-21\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>完成 US BFCM Deal 候选 ASIN 预审：导出候选、PBDD 销售/CVR/ACoS、Deal Health、可售库存和最低促销价\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>US 运营/PPC/财务\u003c/td>\n\u003ctd>2026-10-14\u003c/td>\n\u003ctd>只保留毛利达标、库存覆盖活动销量 1.3 倍以上、Deal Health 正常、PPC 预算可承接的 ASIN\u003c/td>\n\u003ctd>2026-10-20\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>UK OPSS 风险词筛查：导出 UK SKU 和开发项目，筛 toys/plush/costume/kids/craft kit/LED/light/lamp/electric/cord/loop/small parts/plastic bag\u003c/td>\n\u003ctd>UK\u003c/td>\n\u003ctd>合规/产品开发\u003c/td>\n\u003ctd>2026-10-16\u003c/td>\n\u003ctd>输出四类清单：无匹配、需补资料、暂停开发、Listing 核查；无匹配也要留存关闭依据\u003c/td>\n\u003ctd>2026-10-21\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>CSBA 小样本评估：确认账号是否可见 CSBA settings page，整理费用、退款授权、return label、SAFE-T claims 四类问题\u003c/td>\n\u003ctd>US/UK\u003c/td>\n\u003ctd>运营/客服\u003c/td>\n\u003ctd>2026-10-15\u003c/td>\n\u003ctd>形成是否试用的 yes/no 记录；若试用，限定 FBM 样本、退款阈值和复盘指标\u003c/td>\n\u003ctd>2026-10-22\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>FBA Partial Refunds 白名单复查：抽查已开启账号的 return reason 默认勾选范围和近 7 天退款/差评变化\u003c/td>\n\u003ctd>多站点\u003c/td>\n\u003ctd>运营/客服/财务\u003c/td>\n\u003ctd>2026-10-16\u003c/td>\n\u003ctd>damaged/wrong item/safety concern/not as described 不被误开；节省金额高于新增差评和退款风险\u003c/td>\n\u003ctd>2026-10-23\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>持续关注\u003c/h2>\n\u003cul>\n\u003cli>事项：EU Customs Reform UHF 承担方与 Amazon/承运商账单口径。当前状态：EUR 2 金额和 2026-11-01 日期已确认，但 Amazon 站内结算、货代转嫁和报关主体口径仍需确认。下次复查日期：2026-10-21。触发升级条件：Amazon、货代或税务账单明确由卖家承担，或 bundle/multipack/refill-page 每件拆分口径导致毛利下降超过 1 个百分点。\u003c/li>\n\u003cli>事项：US BFCM Deal 提交。当前状态：内部预审今天到期，Amazon 提交截止 2026-10-20。下次复查日期：2026-10-20。触发升级条件：Deal Health 异常、可售库存不足、最低促销价低于毛利底线、PPC 预算无法覆盖或 Account Health 出现警告。\u003c/li>\n\u003cli>事项：商业责任险 Nov 2 账号适用性确认。当前状态：需按 Seller Central 后台确认 enhanced safety categories、中国大陆卖家 AIA 路径、保单实体和有效期。下次复查日期：2026-10-17。触发升级条件：后台出现 insurance warning、保额/实体不匹配、或新增 ASIN 被要求补商业责任险材料。\u003c/li>\n\u003cli>事项：Return and Recovery Insights。当前状态：新版 Seller Central 已可用于退货原因和 recovery value 分析。下次复查日期：2026-10-23。触发升级条件：任一父 ASIN 近 90 天退货率高于类目目标 20% 以上，或主因集中在 not as described、damaged、missing parts、wrong item。\u003c/li>\n\u003c/ul>\n\u003ch2>情报边界与可信度\u003c/h2>\n\u003cp>本次门禁使用中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（国办发明电〔2025〕7号，\u003ca href=\"https://www.gov.cn/zhengce/zhengceku/202511/content_7047091.htm）。官方安排显示\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.cn/zhengce/zhengceku/202511/content_7047091.htm）。官方安排显示\u003c/a> 2026 年国庆节为 2026-10-01 至 2026-10-07 放假调休，2026-09-20 和 2026-10-10 上班；2026-10-14 不在法定假期内，为周三正常大陆工作日。2026-10-15 和 2026-10-16 仍为本周后续工作日，所以今天不是本周最后一个中国大陆法定工作日，不生成周报。\u003c/p>\n\u003cp>本次复查来源和线索约 26 个，其中官方/监管/一手来源约 19 个，非官方或行业辅助来源约 7 个；纳入日报的新事件 2 条，已有事件实质更新 1 条，仍待确认事项 4 条。官方/一手来源覆盖中国政府网、Amazon Seller Forums、UK OPSS、European Commission Taxation and Customs Union、Revenue Ireland、Amazon Ads What&#x27;s New、EIA、Drewry、CPSC 和长期索引内 Amazon/监管原始链接。\u003c/p>\n\u003cp>今天排除了重复的 Prime Big Deal Days 零售宣传、Amazon Accelerate/unBoxed 内容回顾、AWS 企业服务条款更新、无 Seller Central 后台规则变化的 UI/论坛讨论、与相册/纸品/礼品/收纳/拼图配件无直接关系的 UK/US 召回项、发布日期早于本次窗口且已推送的 OPSS 10/09 pimple squishes 信息、Amazon Ads 展示型案例或品牌营销内容、以及没有 USTR/CBP/European Commission/Amazon 官方确认的新关税传闻。EIA 柴油页面在本次北京时间运行时未出现新的 2026-10-14 可用值；Drewry WCI 仍等待 2026-10-15 下一次周度更新，因此未把物流指数重复推送为新变化。\u003c/p>\n\u003cp>生产链接：\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-10-14\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-10-14", "text": "### UK OPSS 新增多条 Amazon 渠道商品安全通报\n\n- 【影响等级】P2\n- 【站点】UK\n- 【发布日期】2026-10-13\n- 【生效日期】2026-10-13\n- 【信息状态】正式监管报告\n- 【来源】UK Office for Product Safety and Standards：\n  https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-toddler-ghost-costume-sold-via-amazon-2609-0106；\n  https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-intedesign-plush-caterpillar-toys-sold-via-amazon-2609-0224；\n  https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-oowolf-led-light-sold-via-amazon-2609-0221；\n  https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-frideko-home-led-floor-lamp-sold-via-amazon-2610-0006\n- 发生了什么：OPSS 在 2026-10-13 发布多条 Amazon 渠道商品安全报告，覆盖 Toddler Ghost Costume、InteDesign plush caterpillar toys、OOWOLF LED light 和 Frideko Home LED floor lamp。风险包括儿童玩具绳带/包装厚度/填充物导致的窒息、 choking、strangulation，以及灯具触电风险；措施包括 Amazon 下架和边境拒收。\n- 我们怎么看：直接产品线不是相册/补充页/记忆册，但对 UK 儿童、礼品、手工套装、带包装小配件和电器类开发项目有合规提示。对现有相册纸品 Listing 的直接销售影响低；对新品开发和供应商准入的影响高于对广告或库存的影响。\n- 建议动作：合规负责人在 2026-10-16 前完成 UK SKU 与开发项目筛查。路径建议：Seller Central > Inventory > Manage All Inventory 导出 UK active/inactive SKU；产品开发表同步筛选 title、bullet、category、supplier、country of origin、age grading、UKCA/CE、packaging thickness、small parts、cord/loop、LED/electric/lamp 字段。筛选对象为 toys、plush、costume、kids、school activity kit、craft kit、LED、light、lamp、electric、battery、plug、cord、loop、string、small parts、plastic bag。验收方式：输出“无匹配 / 需补资料 / 暂停开发 / 下架核查”四类清单；若无匹配 SKU 或开发项目，记录关闭依据，不调整 Listing 和广告。\n\n", "title": "UK OPSS 新增多条 Amazon 渠道商品安全通报", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-14\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-14\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>UK OPSS 新增多条 Amazon 渠道商品安全通报\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】UK\u003c/li>\n\u003cli>【发布日期】2026-10-13\u003c/li>\n\u003cli>【生效日期】2026-10-13\u003c/li>\n\u003cli>【信息状态】正式监管报告\u003c/li>\n\u003cli>【来源】UK Office for Product Safety and Standards：\u003c/li>\n\u003cp>\u003ca href=\"https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-toddler-ghost-costume-sold-via-amazon-2609-0106；\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-toddler-ghost-costume-sold-via-amazon-2609-0106；\u003c/a> \u003ca href=\"https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-intedesign-plush-caterpillar-toys-sold-via-amazon-2609-0224；\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-intedesign-plush-caterpillar-toys-sold-via-amazon-2609-0224；\u003c/a> \u003ca href=\"https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-oowolf-led-light-sold-via-amazon-2609-0221；\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-oowolf-led-light-sold-via-amazon-2609-0221；\u003c/a> \u003ca href=\"https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-frideko-home-led-floor-lamp-sold-via-amazon-2610-0006\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-frideko-home-led-floor-lamp-sold-via-amazon-2610-0006\u003c/a>\u003c/p>\n\u003cli>发生了什么：OPSS 在 2026-10-13 发布多条 Amazon 渠道商品安全报告，覆盖 Toddler Ghost Costume、InteDesign plush caterpillar toys、OOWOLF LED light 和 Frideko Home LED floor lamp。风险包括儿童玩具绳带/包装厚度/填充物导致的窒息、 choking、strangulation，以及灯具触电风险；措施包括 Amazon 下架和边境拒收。\u003c/li>\n\u003cli>我们怎么看：直接产品线不是相册/补充页/记忆册，但对 UK 儿童、礼品、手工套装、带包装小配件和电器类开发项目有合规提示。对现有相册纸品 Listing 的直接销售影响低；对新品开发和供应商准入的影响高于对广告或库存的影响。\u003c/li>\n\u003cli>建议动作：合规负责人在 2026-10-16 前完成 UK SKU 与开发项目筛查。路径建议：Seller Central &gt; Inventory &gt; Manage All Inventory 导出 UK active/inactive SKU；产品开发表同步筛选 title、bullet、category、supplier、country of origin、age grading、UKCA/CE、packaging thickness、small parts、cord/loop、LED/electric/lamp 字段。筛选对象为 toys、plush、costume、kids、school activity kit、craft kit、LED、light、lamp、electric、battery、plug、cord、loop、string、small parts、plastic bag。验收方式：输出“无匹配 / 需补资料 / 暂停开发 / 下架核查”四类清单；若无匹配 SKU 或开发项目，记录关闭依据，不调整 Listing 和广告。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-10-14\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-10-14", "text": "### Amazon CSBA 官方问答窗口开启，适合 FBM 客服风险小样本评估\n\n- 【影响等级】P2\n- 【站点】US/UK seller-fulfilled 相关\n- 【发布日期】2026-10-13\n- 【生效日期】问答窗口 2026-10-13 至 2026-10-15 5pm PDT；新 enroll seller 的 90-day trial 从第一笔 self-fulfilled shipped order 开始\n- 【信息状态】正式 Amazon Seller Forums 运营公告/问答\n- 【来源】Amazon Seller Forums：https://sellercentral.amazon.co.uk/seller-forums/discussions/t/42fdef8c-c107-4d49-b092-b747649686ec\n- 发生了什么：Amazon CSBA 团队在 Seller Forums 开启问答，说明 CSBA 可为 seller-fulfilled orders 处理售后咨询、退货、退款等，且新 Professional sellers 可在 CSBA settings page enroll。Amazon 同时引用历史数据称 CSBA 可能改善 ODR、negative feedback rate 和 customer satisfaction，但论坛回复也集中质疑退款控制、费用、return label 与 SAFE-T claims。\n- 我们怎么看：这不是强制政策变化，也不是 FBA 主业务的必选动作。对我们只有在 US/UK 存在 FBM、SFP、应急自发货或高峰期临时自发货订单时才有评估价值；主要风险是客服外包后退款倾向、SAFE-T 争议和毛利不可控。\n- 建议动作：运营/客服负责人在 2026-10-15 5pm PDT 前整理 3 个问题提交或记录：费用触发口径、退款授权边界、return label 和 SAFE-T claims 处理责任。若账号存在 FBM，应在 Seller Central > Settings > Customer Service by Amazon 页面只做可见性检查，不直接全量开启；用近 30 天 FBM 订单计算 ODR、negative feedback rate、退款金额/订单、SAFE-T claim 成功率和客服响应时效，只有当可控样本毛利和退款上限清楚时才进入 90-day trial。\n\n", "title": "Amazon CSBA 官方问答窗口开启，适合 FBM 客服风险小样本评估", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-14\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-14\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>Amazon CSBA 官方问答窗口开启，适合 FBM 客服风险小样本评估\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】US/UK seller-fulfilled 相关\u003c/li>\n\u003cli>【发布日期】2026-10-13\u003c/li>\n\u003cli>【生效日期】问答窗口 2026-10-13 至 2026-10-15 5pm PDT；新 enroll seller 的 90-day trial 从第一笔 self-fulfilled shipped order 开始\u003c/li>\n\u003cli>【信息状态】正式 Amazon Seller Forums 运营公告/问答\u003c/li>\n\u003cli>【来源】Amazon Seller Forums：\u003ca href=\"https://sellercentral.amazon.co.uk/seller-forums/discussions/t/42fdef8c-c107-4d49-b092-b747649686ec\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.co.uk/seller-forums/discussions/t/42fdef8c-c107-4d49-b092-b747649686ec\u003c/a>\u003c/li>\n\u003cli>发生了什么：Amazon CSBA 团队在 Seller Forums 开启问答，说明 CSBA 可为 seller-fulfilled orders 处理售后咨询、退货、退款等，且新 Professional sellers 可在 CSBA settings page enroll。Amazon 同时引用历史数据称 CSBA 可能改善 ODR、negative feedback rate 和 customer satisfaction，但论坛回复也集中质疑退款控制、费用、return label 与 SAFE-T claims。\u003c/li>\n\u003cli>我们怎么看：这不是强制政策变化，也不是 FBA 主业务的必选动作。对我们只有在 US/UK 存在 FBM、SFP、应急自发货或高峰期临时自发货订单时才有评估价值；主要风险是客服外包后退款倾向、SAFE-T 争议和毛利不可控。\u003c/li>\n\u003cli>建议动作：运营/客服负责人在 2026-10-15 5pm PDT 前整理 3 个问题提交或记录：费用触发口径、退款授权边界、return label 和 SAFE-T claims 处理责任。若账号存在 FBM，应在 Seller Central &gt; Settings &gt; Customer Service by Amazon 页面只做可见性检查，不直接全量开启；用近 30 天 FBM 订单计算 ODR、negative feedback rate、退款金额/订单、SAFE-T claim 成功率和客服响应时效，只有当可控样本毛利和退款上限清楚时才进入 90-day trial。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-10-14\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-10-14", "text": "### EU Customs Reform / eu-customs-reform-implementation-2026-09-21\n\n- 历史事件：EU Customs Reform implementation phase and ecommerce Data Hub / small parcel cost changes。\n- 上次状态：2026-09-24 已推送“small parcel Union handling fee 将在 2026-11-01 前引入，金额 subject to delegated act；ecommerce Data Hub mandatory date 仍为 2028-07-01”。\n- 本次新增变化：European Commission 2026-10-07 最新消息明确写出：From 1 November 2026, the EU will apply the EUR 2 Union handling fee；Revenue Ireland 同步说明 UHF 为每个 distinct item EUR 2，适用于从 EU 外发往 EU 消费者的电商包裹，无价值门槛，且 non-refundable。来源：\n  https://taxation-customs.ec.europa.eu/customs/eu-customs-reform_en；\n  https://www.revenue.ie/en/customs/individuals/union-handling-fee/index.aspx；\n  https://www.revenue.ie/en/corporate/press-office/press-releases/2026/pr-092926-handling-fee.aspx\n- 变化原因：EU Customs Reform 已进入分阶段实施，成员国税务/海关机构开始发布面向包裹申报和消费者的执行说明，原来待确认的 UHF 金额和适用日期有了官方口径。\n- 行动是否需要调整：升级为 P1 成本模型动作，但不直接改售价。供应链/财务在 2026-10-20 前把 DE/FR/IT/ES 低价值跨境包裹、非 EU 发货、bundle/multipack/refill-page 组合 SKU 的 landed cost 模板增加“EUR 2 per distinct item UHF”字段；同时保留“由平台、承运商、报关主体或卖家承担”的待确认字段，等 Amazon 或货代账单口径确认后再决定是否传导到售价、促销底价或 EU FBM/直发策略。\n\n", "title": "EU Customs Reform / eu-customs-reform-implementation-2026-09-21", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-14\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-14\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>EU Customs Reform / eu-customs-reform-implementation-2026-09-21\u003c/h3>\n\u003cul>\n\u003cli>历史事件：EU Customs Reform implementation phase and ecommerce Data Hub / small parcel cost changes。\u003c/li>\n\u003cli>上次状态：2026-09-24 已推送“small parcel Union handling fee 将在 2026-11-01 前引入，金额 subject to delegated act；ecommerce Data Hub mandatory date 仍为 2028-07-01”。\u003c/li>\n\u003cli>本次新增变化：European Commission 2026-10-07 最新消息明确写出：From 1 November 2026, the EU will apply the EUR 2 Union handling fee；Revenue Ireland 同步说明 UHF 为每个 distinct item EUR 2，适用于从 EU 外发往 EU 消费者的电商包裹，无价值门槛，且 non-refundable。来源：\u003c/li>\n\u003cp>\u003ca href=\"https://taxation-customs.ec.europa.eu/customs/eu-customs-reform_en；\" target=\"_blank\" rel=\"noopener noreferrer\">https://taxation-customs.ec.europa.eu/customs/eu-customs-reform_en；\u003c/a> \u003ca href=\"https://www.revenue.ie/en/customs/individuals/union-handling-fee/index.aspx；\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.revenue.ie/en/customs/individuals/union-handling-fee/index.aspx；\u003c/a> \u003ca href=\"https://www.revenue.ie/en/corporate/press-office/press-releases/2026/pr-092926-handling-fee.aspx\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.revenue.ie/en/corporate/press-office/press-releases/2026/pr-092926-handling-fee.aspx\u003c/a>\u003c/p>\n\u003cli>变化原因：EU Customs Reform 已进入分阶段实施，成员国税务/海关机构开始发布面向包裹申报和消费者的执行说明，原来待确认的 UHF 金额和适用日期有了官方口径。\u003c/li>\n\u003cli>行动是否需要调整：升级为 P1 成本模型动作，但不直接改售价。供应链/财务在 2026-10-20 前把 DE/FR/IT/ES 低价值跨境包裹、非 EU 发货、bundle/multipack/refill-page 组合 SKU 的 landed cost 模板增加“EUR 2 per distinct item UHF”字段；同时保留“由平台、承运商、报关主体或卖家承担”的待确认字段，等 Amazon 或货代账单口径确认后再决定是否传导到售价、促销底价或 EU FBM/直发策略。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-10-14\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}]}, {"date": "2026-10-13", "text": "# 亚马逊及海外市场情报增量日报｜2026-10-13\n\n## 今日判断\n\n今日无重大运营变化。\n\n2026-10-13 是中国大陆法定工作日，且不是本周最后一个大陆法定工作日，因此本次只生成增量日报，不追加周报。检索窗口为 2026-10-12 09:06:40 至 2026-10-13 09:04:52（Asia/Shanghai），未发现 Amazon US/UK/DE/FR/IT/ES 在 Seller Central、Amazon Ads、Listing、FBA 费用、库存、广告竞价或合规规则上出现新的强制执行变化。今天不设置 P0；最高优先级仍是 2026-10-10 已推送的 FBA Partial Refunds 退货原因白名单，今天需要完成账号侧配置核查。BFCM 候选 Deal、US/EU 物流成本模型和商业责任险继续按既定截止日推进，不因今天的检索结果调整动作。\n\n## 仍需关注\n\n### FBA Partial Refunds 退货原因白名单\n\n- 事项：FBA Partial Refunds 已可按退货原因配置，已开启账号可能默认覆盖所有退货原因。\n- 当前状态：P1 今日到期；不建议全量开启。\n- 下次复查日期：2026-10-16。\n- 触发升级条件：高退货 ASIN 被默认纳入、damaged / wrong item / safety concern / not as described 被误开、或开启后差评率/退款金额超过节省成本。\n\n### BFCM Deal 候选池预审\n\n- 事项：US Black Friday / Cyber Monday Deals 的 Amazon 提交截止日为 2026-10-20，内部预审截止日为 2026-10-14。\n- 当前状态：P1 按原动作推进；用 PBDD 结果筛选候选 ASIN。\n- 下次复查日期：2026-10-14。\n- 触发升级条件：Deal Health 异常、Account Health 警告、可售库存低于活动销量 1.3 倍、最低促销价低于毛利底线、或 PPC 预算无法覆盖活动流量。\n\n### 商业责任险 Nov 2 账号适用性确认\n\n- 事项：商业责任险要求 2026-11-02 节点仍需按账号后台确认，尤其是 enhanced safety categories、中国大陆卖家 AIA 路径、保单到期日和被保险实体。\n- 当前状态：P1 待账号侧核实；公开信息不足以替代 Seller Central 后台判断。\n- 下次复查日期：2026-10-17。\n- 触发升级条件：Seller Central 出现 insurance warning、enhanced safety ASIN 被要求补资料、现有保单实体/保额不匹配、或中国大陆卖家新保单无法按原路径提交。\n\n## 情报边界与可信度\n\n本次门禁使用中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（国办发明电〔2025〕7号，https://www.gov.cn/zhengce/zhengceku/202511/content_7047091.htm）。文件显示 2026 年国庆节为 2026-10-01 至 2026-10-07 放假调休，2026-09-20 和 2026-10-10 上班；2026-10-13 不在假期范围内，且不是周末补班判断点，为正常大陆工作日。\n\n本次复查来源和线索约 20 个，其中官方/监管/一手来源约 15 个，非官方或行业辅助来源约 5 个；纳入日报的新事件 0 条，已有事件实质更新 0 条，仍待确认且需按既定日期复查的事项 3 条。官方/一手来源覆盖中国政府网、Amazon Seller Forums / News_Amazon 检索线索、Amazon Ads What's New、Amazon Ads API release notes、EIA Gasoline and Diesel Fuel Update、GOV.UK OPSS、CPSC Recalls 检索线索及长期索引内的 Amazon / 监管原始链接。\n\n今天排除了重复的 Prime Big Deal Days 零售宣传、Amazon Accelerate/unBoxed 内容回顾、无后台规则变化的 Seller Central UI 讨论、与相册/纸品/礼品/收纳/拼图配件产品线无直接关系或发布日期早于本次窗口的 CPSC/OPSS 召回线索、Amazon Ads 展示型案例或品牌营销内容、以及没有 USTR/CBP/European Commission/Amazon 官方确认的新关税传闻。EIA 页面显示下一次柴油燃油价格发布日期为 2026-10-14，因此今天未更新 US logistics fuel assumption；Drewry WCI 仍沿用 2026-10-08 已推送值，等待下一周更新。\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-13\">\n  \u003ctitle>亚马逊及 ed safety ASIN 被要求补资料、现有保单实体/保额不匹配、或中国大陆卖家新保单无法按原路径提交。\n\n## 情报边界与可信度\n\n本次门禁使用中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（国办发明电〔2025〕7号，https://www.gov.cn/zhengce/zhengceku/202511/content_7047091.htm）。文件显示 2026 年国庆节为 2026-10-01 至 2026-10-07 放假调休，2026-09-20 和 2026-10-10 上班；2026-10-12 不在假期范围内，为正常大陆工作日。\n\n本次复查来源和线索约 18 个，其中官方/监管/一手来源约 14 个，非官方或行业辅助来源约 4 个；纳入日报的新事件 0 条，已有事件实质更新 0 条，仍待确认且需按既定日期复查的事项 3 条。官方/一手来源覆盖中国政府网、Amazon Seller Forums / News_Amazon 检索线索、Amazon Ads What's New、Amazon Ads API release notes、EIA Gasoline and Diesel Fuel Update、GOV.UK OPSS、CPSC Recalls 检索线索及长期索引内的 Amazon / 监管原始链接。\n\n今天排除了重复的 Prime Big Deal Days 零售宣传、Amazon Accelerate/unBoxed 内容回顾、无后台规则变化的 Seller Central UI 讨论、与相册/纸品/礼品/收纳/拼图配件产品线无直接关系的 CPSC/OPSS 召回线索、Amazon Ads 展示型案例或品牌营销内容、以及没有 USTR/CBP/European Commission/Amazon 官方确认的新关税传闻。EIA 页面显示下一次柴油燃油价格发布日期为 2026-10-14，因此今天未更新 US logistics fuel assumption；Drewry WCI 仍沿用 2026-10-08 已推送值，等待下一周更新。\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-12\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-12\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:2
