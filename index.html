const reports=[{"date": "2026-10-23", "text": "# 亚马逊及海外市场情报增量日报｜2026-10-23\n\n## 1. 今日判断\n\n今天未发现需要全账号立即调整的 Amazon 平台新规；新增一条 US 国际邮政申报事件，相关正式申报要求延至 **2027-01-20**，Entry Type 13 测试同步调整 PGA 数据传输方式。对相册、补充页、手工及拼图配件业务，先确认是否存在从境外经国际邮政寄往 US 的 FBM/补发订单，再由报关方判断适用性，今天不据此改 FBA 头程或广告。新增事项为 P2，不设置新增 P0/P1；既有最高优先级仍是 US 与欧陆 BFCM 库存异常闭环。重点站点 US、UK；最近外部到仓节点为 **2026-10-28**（US optimized split、UK），今天应完成预约与 ETA 证据核验。\n\n检索窗口：2026-10-22 10:08:16 至 2026-10-23 09:05:08（Asia/Shanghai）；补查既有待确认事项。今日为周五，后附本期周度合并报告。\n\n## 2. 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n|---|---|---|---|---|---|\n| P2 | 国际邮政部分正式申报要求延期；ET13 测试调整 | US | FBM直邮、补发、报关 | 2026-10-22 公告；合规节点 2027-01-20 | 有国际邮政订单才核查；内部截止 2026-10-27 |\n\n## 3. 今日新情报\n\n### US 国际邮政：部分申报要求延期，Entry Type 13 测试调整\n\n- 【影响等级】P2\n- 【站点】US\n- 【发布日期】2026-10-22（Federal Register 正式刊登；预公开文件于 2026-10-21 提交）\n- 【生效日期】ET13 测试修改为 2026-10-22；19 CFR 145.12(a)(2)(v)、(vi) 合规日期改为 2027-01-20\n- 【信息状态】正式公告；ET13 为测试项目\n- 【来源】CBP / Federal Register：[延期最终规则 2026-21600](https://public-inspection.federalregister.gov/2026-21600.pdf)；[ET13 测试修改 2026-21570](https://public-inspection.federalregister.gov/2026-21570.pdf)；[2026-10-22 正式公报，第66639、66707页](https://www.govinfo.gov/content/pkg/FR-2026-10-22/pdf/FR-2026-10-22.pdf)。\n- 发生了什么：CBP 将部分国际邮政货物不再适用新邮政非正式申报流程的合规节点，从 2026-10-22 延至 2027-01-20，涵盖指定 PGA、HTS 第98/99章及特定免税申报情形。同日修改不超过 $2,500 国际邮政货物的 ET13 测试，允许传输申报时包含或不包含电子 PGA 数据；具体货物准入和数据义务须由报关方核定。\n- 我们怎么看：这给受影响直邮业务留下系统与报关准备时间，不代表恢复低值免税，也不代表撤销 PGA 义务。若当前全部采用商业货运 FBA 头程及境内配送，直接运营影响有限；无需调整 Listing、图片、A+、属性、竞价或预算。\n- 建议动作：供应链在 2026-10-27 前，从 OMS/ERP 导出近30天 US FBM 与补发订单，筛选 origin_country≠US 且 channel=international_post；字段保留订单号、SKU/ASIN、申报值、HTS、PGA机构、承运商、报关行、entry_type。向服务商取得“延期条款是否适用、ET13是否支持、PGA数据处理、2027-01-20切换方案”书面答复。验收为100%匹配订单有适用性结论；无匹配则记录不适用并关闭内部排查。复查 2026-10-28；若仍按旧日期要求停运或加收费用，先取得条款与报价证据再升级。\n\n## 4. 已有事件的重要更新\n\n本次未确认既有事件出现新的数值、范围、日期或权威确认变化，不重复推送昨日的 BFCM 日期校正、UHF 或柴油值。\n\n## 5. 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n|---|---|---|---|---|---|---|\n| P2 | OMS/ERP筛近30天境外发往US的国际邮政FBM/补发订单；取得ET13、PGA、延期适用性书面答复 | US | 供应链/合规 | 2026-10-27 | 100%匹配订单有结论及证据；无匹配留存筛选结果 | 2026-10-28 |\n\n## 6. 持续关注\n\n- **US optimized split、UK BFCM到仓：** 外部节点均为2026-10-28，未取得账号执行结果；下次复查2026-10-24。若预约或ETA晚于节点，或可售库存不足已批准活动预测，则升级供应链例外并重审预算，不默认货件已完成。\n- **EU UHF：** 官方日期2026-11-01、€2/distinct item；Amazon/服务商合同转嫁方式仍待书面确认。下次复查2026-10-28。仅境外直发EU消费者路线建模；若确认卖家承担，重算该路线毛利与底价。\n- **US邮政ET13：** 新事件，账号适用性未确认；下次复查2026-10-28。若匹配订单存在PGA要求或HTS第98/99章情形且服务商无切换方案，升级合规项目。\n\n## 7. 情报边界与可信度\n\n今日核心事实引用3个官方原始文件URL，涉及2份CBP文件，非官方来源0；新增事件主线1条、既有实质更新0条。待确认3类：本业务邮政路线适用性、UHF合同承担方、BFCM账号内货件执行结果；后两项没有新结论，不计作新增。\n\n补查Amazon US/UK及DE/FR/IT/ES本地语言新闻线索、Amazon Ads发布页、官方BFCM清单、EIA和Revenue。检索不等于完整覆盖登录后台；不能确认的账号通知不作已生效结论。欧盟10月消费者信心仅核实到发布日历，未取得新实值，未引用预测代替实际；排除英国土耳其FTA谈判、农产品通关、Amazon财报电话会、重复旺季提醒及论坛卖家个案。风格参考旧Sites链接本次无法读取，沿用本地已发布的中文报告结构。\n\n# 亚马逊及海外市场情报周报｜2026-10-23\n\n## 1. 本周管理层摘要\n\n本期为补齐式周报：本地可核实最近周报为2026-10-10，覆盖其后至2026-10-23 09:05:08已确认新增与实质更新，不能只合并最近五天。按事件主线去重为 **8条**，其中管理层重点4条：US旺季FBA费用、US BFCM入仓、欧洲BFCM入仓、EU UHF；另有柴油、UK定向安全通报、CSBA问答和US邮政申报。影响US/UK/DE/FR/IT/ES，最高风险为货到但不可售叠加费用上升后，仍按旧毛利底线放量。最近外部节点为2026-10-28 US optimized split与UK到仓；2026-11-01为EU UHF节点。没有账号数据，无法报告实际销量损失或团队任务完成率。\n\n## 2. 本周优先级快览\n\n| 优先级 | 事件主线 | 站点 | 模块 | 下周动作 | 负责人 | 截止日 |\n|---|---|---|---|---|---|---|\n| P1 | US/欧洲BFCM入仓（2条主线） | US/UK/DE/FR/IT/ES | 库存/促销 | 逐票核实预约、ETA、可售与Deal Health；不达标SKU重审活动预算 | 各站运营/供应链/PPC | 内部2026-10-26；外部US optimized/UK 2026-10-28 |\n| P1 | US旺季履约费生效 | US | 利润/定价 | 抽核实际订单费用，重算全部活动候选ASIN毛利和盈亏平衡ACoS | 财务/US运营 | 2026-10-26 |\n| P1 | UHF执行准备 | DE/FR/IT/ES | 直邮/清关/成本 | 分开EU本地履约与非EU直邮，取得合同承担方和distinct item口径 | 供应链/财务 | 2026-10-28 |\n| P2 | 柴油周度反弹 | US | 物流 | 只更新浮动燃油合同与未锁价报价 | 供应链/财务 | 2026-10-28 |\n| P2 | UK OPSS定向安全报告 | UK | 合规/产品开发 | 对风险结构匹配SKU留存排查结论；无匹配则关闭 | 合规/产品开发 | 2026-10-27 |\n| P2 | CSBA问答及试用 | US/UK账号可用范围 | FBM客服 | 有FBM才比较成本与退款表现，记录是否试用 | 客服/运营 | 2026-10-27 |\n| P2 | US邮政申报 | US | FBM/补发 | 识别国际邮政路线及ET13/PGA适用性 | 供应链/合规 | 2026-10-27 |\n\n## 3. 本周政策与平台变化\n\n### 合规\n\nUK OPSS于2026-10-13发布Amazon渠道玩具、服饰、灯具安全报告；2026-10-14首次纳入。其直接对象并非普通相册纸品，仅对儿童套装、绳带、小零件、薄塑料袋和电气结构做匹配排查。[OPSS毛毛虫玩具报告](https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-intedesign-plush-caterpillar-toys-sold-via-amazon-2609-0224)确认边境拒收及窒息风险；其余原始报告见文末来源。无本业务SKU匹配证据，不能宣称需全店下架。\n\n### Listing与广告\n\n本期未确认相册、补充页、School Memory Book、Portfolio Binder和Puzzle Accessories需要全量改标题、图片、A+、搜索词、属性或变体的新规；也未确认SP/SB/SD竞价、匹配、广告位计费或Rufus/COSMO规则的新增强制变化。PPC动作由可售库存和贡献毛利门槛触发，不能把论坛讨论当成算法发布。\n\n### 费用\n\nUS旺季FBA费于2026-10-15进入执行期，2026-10-16纳入；需与3.5%燃油物流附加费共同核对实际账单。按发货订单的适用费率核算，不把所有销售额统一加3.5%。原始帮助页本次仅返回JavaScript外壳，具体尺寸重量费率必须登录账号复核。[Amazon FBA费用帮助](https://sellercentral.amazon.com/help/hub/reference/external/GABBX6GZPA8MSZGW?locale=en_us)。\n\n### 库存物流与促销\n\nUS BFCM主线从提交准备转为入仓异常处理；2026-10-22官方清单核实日期，当前采用minimal split **2026-10-21**、optimized split **2026-10-28**，覆盖此前报告中的2026-10-20/2026-10-30口径。DE/FR/IT/ES到仓节点为2026-10-21，UK为2026-10-28。日期校正属于本期重要变化，不再沿用旧值。[US官方清单](https://sellercentral.amazon.com/seller-forums/discussions/t/6a6f3b4a-97a8-4f04-b671-4f7a1ae6046b)；[欧洲官方节点](https://sellercentral.amazon.com/seller-forums/discussions/t/d8c34b0b-86ed-4aec-9b0a-8be6eabb8fb0)。Deal实际资格、提交和状态仍以账号Deals Dashboard为准，不能用到仓日期替代促销资格。\n\n### 客服\n\n2026-10-13至2026-10-15 CSBA官方问答已结束；新加入者90天试用按首笔自发货订单发货启动。2026-10-14首次纳入，本期无充分证据支持全量开启或宣称本业务ODR必然改善。[Amazon CSBA问答](https://sellercentral.amazon.co.uk/seller-forums/discussions/t/42fdef8c-c107-4d49-b092-b747649686ec)。\n\n## 4. 本周海外市场与供应链变化\n\n- **EU UHF：** 2026-10-14将金额/日期推进为官方确认：2026-11-01起€2/distinct item。Revenue说明针对从EU外寄给EU消费者的电商货物，购物时已在EU境内的货物无此收费；同一包裹的相同商品与不同商品计数不能混为“每个销售件”。本地FBA库存与非EU直邮需分开，实际合同转嫁仍待确认。[Revenue 2026-09-29说明](https://www.revenue.ie/en/corporate/press-office/press-releases/2026/pr-092926-handling-fee.aspx)。\n- **US柴油：** 2026-10-19数据周全国均价$6.276/加仑，前周$6.179，增加$0.097、约1.57%；是未锁价物流成本信号，未证明承运商收费同比例上涨。[EIA周度数据](https://www.eia.gov/petroleum/gasdiesel/)。\n- **US国际邮政：** 2026-10-22两份CBP正式文件形成一条主线，合规延期至2027-01-20与ET13测试修改见日报。只有匹配国际邮政路线才执行排查，不能据此认定关税减免。[CBP延期](https://public-inspection.federalregister.gov/2026-21600.pdf)；[CBP测试修改](https://public-inspection.federalregister.gov/2026-21570.pdf)。\n- 消费、汇率、港口及竞品平台未取得足以支持本业务新增量化决策的一手事实；不以宏观预测决定补货或调价。\n\n## 5. 对当前业务的量化影响\n\n以下为计算方法和内部建议门槛，不是实测经营结果或Amazon政策。\n\n| 指标 | 评估方法 | 决策口径与限制 |\n|---|---|---|\n| 单件贡献毛利/利润率 | 不含税净收入－货值－头程－实际平台费－配送－促销费－广告－退货预期损失 | 用实际新费率；利润率=贡献毛利÷不含税净收入，缺费用明细不报影响百分点 |\n| 盈亏平衡ACoS | 广告前贡献毛利÷与广告归因销售额一致口径的收入 | 统一税、折扣和退款口径；目标ACoS低于盈亏平衡线并留利润空间 |\n| UHF情景 | 实际承担比例×€2×distinct item数/包裹销售件数 | 假设卖家全承担、1件1类、净收入€20，则毛利少€2、利润率少10个百分点；EU本地库存不套用 |\n| 浮动燃油成本 | 服务商合同燃油阶梯或报价差×实际运量 | 柴油+1.57%不等于整票运费+1.57%，等待新报价确认 |\n| 库存覆盖 | Available÷批准日销量预测；单列Reserved/Inbound及ETA | 建议活动可售量≥活动预测1.3倍作为缓冲；不是强制要求，也不把Inbound视为可售 |\n| 销售、CTR、CVR、TACoS | 同ASIN/站点比较近7天与可比基期，标记价格、促销及缺货日 | 缺业务导出不能归因政策效果；CTR/CVR无依据不预测提升百分比 |\n\n## 6. 下周行动清单\n\n| 优先级 | 动作 | 站点 | 对象 | 负责人 | 截止日 | 验收指标 |\n|---|---|---|---|---|---|---|\n| P1 | Seller Central库存>管理货件与FBA Inventory对账，再查Deals Dashboard | US/UK/DE/FR/IT/ES | 全部BFCM主推ASIN | 各站运营/供应链 | 2026-10-26 | 100%有Available/Reserved/Inbound、ETA、Deal Health；异常有Case和预算决定，2026-10-28复查 |\n| P1 | 费用预览/Payments交易明细抽核新履约费并更新促销底价 | US | 全部活动候选；抽至少20笔订单或全部不足20笔订单 | 财务/US运营/PPC | 2026-10-26 | 候选100%有新成本、毛利、盈亏平衡ACoS；亏损项不加预算 |\n| P1 | 路线成本表分离EU本地和境外直邮，确认申报人与合同转嫁 | DE/FR/IT/ES | 非EU发往消费者路线及套装 | 供应链/财务 | 2026-10-28 | 每条路线有承担方、计数法和书面证据；未确认项保留假设，不自动改价 |\n| P2 | OMS筛国际邮政US订单，与服务商核对延期及ET13/PGA数据 | US | FBM/补发 | 供应链/合规 | 2026-10-27 | 100%匹配订单有适用性结论或无匹配证明 |\n| P2 | Manage All Inventory及开发台账筛玩具/绳带/小零件/薄袋/电气结构 | UK | 在售及开发SKU | 合规/产品开发 | 2026-10-27 | 匹配项有测试资料/整改责任人；无匹配有关闭依据 |\n| P2 | Settings中检查CSBA可用性；导出30天FBM费用、退款、ODR与SAFE-T | US/UK | 有FBM订单账号 | 客服/运营/财务 | 2026-10-27 | 有试用yes/no结论；试用需明确样本和退款预算上限 |\n\n建议复用一张“ASIN×站点×活动”的Sheet合并库存、Deal Health、费用和PPC导出，以ASIN+站点为键校验缺失值，自动标记毛利不足和ETA晚于节点的行；运营人工确认后再改预算。\n\n## 7. 已关闭与继续跟踪事项\n\n- **关闭事件窗口：** CSBA 2026-10-15问答窗口已结束，关闭参会提醒；是否试用仍由账号评估，2026-10-27复查。\n- **关闭旧日期口径：** US minimal 2026-10-20、optimized 2026-10-30不再作为本报告执行日期；以2026-10-21/2026-10-28替代。货件任务未取得完成证据，不标记已关闭。\n- **继续跟踪：** BFCM到仓2026-10-24及2026-10-28复查；UHF承担方2026-10-28复查；柴油及合同报价2026-10-28复查；US邮政2026-10-28复查，2027-01-13检查切换准备。\n- **历史存量任务：** 商业责任险账号适用性、Partial Refunds白名单、Return and Recovery Insights均无本期新事实，不计入8条。账号负责人应于2026-10-27补充完成/不适用证据，不能用“无新公告”替代任务完成。\n\n## 8. 来源与可信度统计\n\n本期正文核心来源13个官方URL、非官方0：CBP预公开文件2、正式公报1、Amazon页面4（US清单、欧洲节点、FBA费率、CSBA）、Revenue1、EIA1、UK OPSS4，共13个URL；按独立文件去重，CBP正式公报不另算事件。统计统一为 **13个官方URL、非官方0**。UK OPSS除正文毛毛虫报告外，还包括：[Toddler Ghost Costume，2026-10-13](https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-toddler-ghost-costume-sold-via-amazon-2609-0106)、[OOWOLF LED，2026-10-13](https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-oowolf-led-light-sold-via-amazon-2609-0221)、[Frideko灯，2026-10-13](https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-frideko-home-led-floor-lamp-sold-via-amazon-2610-0006)。部分历史来源承接已发布日报；登录后台通知、FBA尺寸费率和团队执行结果仍需账号证据。8条为事件主线数，不能与URL数或每日条数相加。\n\n本期没有核实出新的强制Listing/广告规则；没有把旧保险、Partial Refunds等存量任务重复算成新增。来源事实、内部建议门槛和假设测算已分别说明。\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-23\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-23\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报增量日报｜2026-10-23\u003c/h1>\n\u003ch2>1. 今日判断\u003c/h2>\n\u003cp>今天未发现需要全账号立即调整的 Amazon 平台新规；新增一条 US 国际邮政申报事件，相关正式申报要求延至 \u003cstrong>2027-01-20\u003c/strong>，Entry Type 13 测试同步调整 PGA 数据传输方式。对相册、补充页、手工及拼图配件业务，先确认是否存在从境外经国际邮政寄往 US 的 FBM/补发订单，再由报关方判断适用性，今天不据此改 FBA 头程或广告。新增事项为 P2，不设置新增 P0/P1；既有最高优先级仍是 US 与欧陆 BFCM 库存异常闭环。重点站点 US、UK；最近外部到仓节点为 \u003cstrong>2026-10-28\u003c/strong>（US optimized split、UK），今天应完成预约与 ETA 证据核验。\u003c/p>\n\u003cp>检索窗口：2026-10-22 10:08:16 至 2026-10-23 09:05:08（Asia/Shanghai）；补查既有待确认事项。今日为周五，后附本期周度合并报告。\u003c/p>\n\u003ch2>2. 优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>影响站点\u003c/th>\n\u003cth>影响模块\u003c/th>\n\u003cth>截止/生效日期\u003c/th>\n\u003cth>今天是否需要动作\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>国际邮政部分正式申报要求延期；ET13 测试调整\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>FBM直邮、补发、报关\u003c/td>\n\u003ctd>2026-10-22 公告；合规节点 2027-01-20\u003c/td>\n\u003ctd>有国际邮政订单才核查；内部截止 2026-10-27\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>3. 今日新情报\u003c/h2>\n\u003ch3>US 国际邮政：部分申报要求延期，Entry Type 13 测试调整\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】US\u003c/li>\n\u003cli>【发布日期】2026-10-22（Federal Register 正式刊登；预公开文件于 2026-10-21 提交）\u003c/li>\n\u003cli>【生效日期】ET13 测试修改为 2026-10-22；19 CFR 145.12(a)(2)(v)、(vi) 合规日期改为 2027-01-20\u003c/li>\n\u003cli>【信息状态】正式公告；ET13 为测试项目\u003c/li>\n\u003cli>【来源】CBP / Federal Register：\u003ca href=\"https://public-inspection.federalregister.gov/2026-21600.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">延期最终规则 2026-21600\u003c/a>；\u003ca href=\"https://public-inspection.federalregister.gov/2026-21570.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">ET13 测试修改 2026-21570\u003c/a>；\u003ca href=\"https://www.govinfo.gov/content/pkg/FR-2026-10-22/pdf/FR-2026-10-22.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">2026-10-22 正式公报，第66639、66707页\u003c/a>。\u003c/li>\n\u003cli>发生了什么：CBP 将部分国际邮政货物不再适用新邮政非正式申报流程的合规节点，从 2026-10-22 延至 2027-01-20，涵盖指定 PGA、HTS 第98/99章及特定免税申报情形。同日修改不超过 $2,500 国际邮政货物的 ET13 测试，允许传输申报时包含或不包含电子 PGA 数据；具体货物准入和数据义务须由报关方核定。\u003c/li>\n\u003cli>我们怎么看：这给受影响直邮业务留下系统与报关准备时间，不代表恢复低值免税，也不代表撤销 PGA 义务。若当前全部采用商业货运 FBA 头程及境内配送，直接运营影响有限；无需调整 Listing、图片、A+、属性、竞价或预算。\u003c/li>\n\u003cli>建议动作：供应链在 2026-10-27 前，从 OMS/ERP 导出近30天 US FBM 与补发订单，筛选 origin_country≠US 且 channel=international_post；字段保留订单号、SKU/ASIN、申报值、HTS、PGA机构、承运商、报关行、entry_type。向服务商取得“延期条款是否适用、ET13是否支持、PGA数据处理、2027-01-20切换方案”书面答复。验收为100%匹配订单有适用性结论；无匹配则记录不适用并关闭内部排查。复查 2026-10-28；若仍按旧日期要求停运或加收费用，先取得条款与报价证据再升级。\u003c/li>\n\u003c/ul>\n\u003ch2>4. 已有事件的重要更新\u003c/h2>\n\u003cp>本次未确认既有事件出现新的数值、范围、日期或权威确认变化，不重复推送昨日的 BFCM 日期校正、UHF 或柴油值。\u003c/p>\n\u003ch2>5. 今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>OMS/ERP筛近30天境外发往US的国际邮政FBM/补发订单；取得ET13、PGA、延期适用性书面答复\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>供应链/合规\u003c/td>\n\u003ctd>2026-10-27\u003c/td>\n\u003ctd>100%匹配订单有结论及证据；无匹配留存筛选结果\u003c/td>\n\u003ctd>2026-10-28\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>6. 持续关注\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>US optimized split、UK BFCM到仓：\u003c/strong> 外部节点均为2026-10-28，未取得账号执行结果；下次复查2026-10-24。若预约或ETA晚于节点，或可售库存不足已批准活动预测，则升级供应链例外并重审预算，不默认货件已完成。\u003c/li>\n\u003cli>\u003cstrong>EU UHF：\u003c/strong> 官方日期2026-11-01、€2/distinct item；Amazon/服务商合同转嫁方式仍待书面确认。下次复查2026-10-28。仅境外直发EU消费者路线建模；若确认卖家承担，重算该路线毛利与底价。\u003c/li>\n\u003cli>\u003cstrong>US邮政ET13：\u003c/strong> 新事件，账号适用性未确认；下次复查2026-10-28。若匹配订单存在PGA要求或HTS第98/99章情形且服务商无切换方案，升级合规项目。\u003c/li>\n\u003c/ul>\n\u003ch2>7. 情报边界与可信度\u003c/h2>\n\u003cp>今日核心事实引用3个官方原始文件URL，涉及2份CBP文件，非官方来源0；新增事件主线1条、既有实质更新0条。待确认3类：本业务邮政路线适用性、UHF合同承担方、BFCM账号内货件执行结果；后两项没有新结论，不计作新增。\u003c/p>\n\u003cp>补查Amazon US/UK及DE/FR/IT/ES本地语言新闻线索、Amazon Ads发布页、官方BFCM清单、EIA和Revenue。检索不等于完整覆盖登录后台；不能确认的账号通知不作已生效结论。欧盟10月消费者信心仅核实到发布日历，未取得新实值，未引用预测代替实际；排除英国土耳其FTA谈判、农产品通关、Amazon财报电话会、重复旺季提醒及论坛卖家个案。风格参考旧Sites链接本次无法读取，沿用本地已发布的中文报告结构。\u003c/p>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报周报｜2026-10-23\u003c/h1>\n\u003ch2>1. 本周管理层摘要\u003c/h2>\n\u003cp>本期为补齐式周报：本地可核实最近周报为2026-10-10，覆盖其后至2026-10-23 09:05:08已确认新增与实质更新，不能只合并最近五天。按事件主线去重为 \u003cstrong>8条\u003c/strong>，其中管理层重点4条：US旺季FBA费用、US BFCM入仓、欧洲BFCM入仓、EU UHF；另有柴油、UK定向安全通报、CSBA问答和US邮政申报。影响US/UK/DE/FR/IT/ES，最高风险为货到但不可售叠加费用上升后，仍按旧毛利底线放量。最近外部节点为2026-10-28 US optimized split与UK到仓；2026-11-01为EU UHF节点。没有账号数据，无法报告实际销量损失或团队任务完成率。\u003c/p>\n\u003ch2>2. 本周优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事件主线\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>模块\u003c/th>\n\u003cth>下周动作\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>US/欧洲BFCM入仓（2条主线）\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES\u003c/td>\n\u003ctd>库存/促销\u003c/td>\n\u003ctd>逐票核实预约、ETA、可售与Deal Health；不达标SKU重审活动预算\u003c/td>\n\u003ctd>各站运营/供应链/PPC\u003c/td>\n\u003ctd>内部2026-10-26；外部US optimized/UK 2026-10-28\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>US旺季履约费生效\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>利润/定价\u003c/td>\n\u003ctd>抽核实际订单费用，重算全部活动候选ASIN毛利和盈亏平衡ACoS\u003c/td>\n\u003ctd>财务/US运营\u003c/td>\n\u003ctd>2026-10-26\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>UHF执行准备\u003c/td>\n\u003ctd>DE/FR/IT/ES\u003c/td>\n\u003ctd>直邮/清关/成本\u003c/td>\n\u003ctd>分开EU本地履约与非EU直邮，取得合同承担方和distinct item口径\u003c/td>\n\u003ctd>供应链/财务\u003c/td>\n\u003ctd>2026-10-28\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>柴油周度反弹\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>物流\u003c/td>\n\u003ctd>只更新浮动燃油合同与未锁价报价\u003c/td>\n\u003ctd>供应链/财务\u003c/td>\n\u003ctd>2026-10-28\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>UK OPSS定向安全报告\u003c/td>\n\u003ctd>UK\u003c/td>\n\u003ctd>合规/产品开发\u003c/td>\n\u003ctd>对风险结构匹配SKU留存排查结论；无匹配则关闭\u003c/td>\n\u003ctd>合规/产品开发\u003c/td>\n\u003ctd>2026-10-27\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>CSBA问答及试用\u003c/td>\n\u003ctd>US/UK账号可用范围\u003c/td>\n\u003ctd>FBM客服\u003c/td>\n\u003ctd>有FBM才比较成本与退款表现，记录是否试用\u003c/td>\n\u003ctd>客服/运营\u003c/td>\n\u003ctd>2026-10-27\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>US邮政申报\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>FBM/补发\u003c/td>\n\u003ctd>识别国际邮政路线及ET13/PGA适用性\u003c/td>\n\u003ctd>供应链/合规\u003c/td>\n\u003ctd>2026-10-27\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>3. 本周政策与平台变化\u003c/h2>\n\u003ch3>合规\u003c/h3>\n\u003cp>UK OPSS于2026-10-13发布Amazon渠道玩具、服饰、灯具安全报告；2026-10-14首次纳入。其直接对象并非普通相册纸品，仅对儿童套装、绳带、小零件、薄塑料袋和电气结构做匹配排查。\u003ca href=\"https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-intedesign-plush-caterpillar-toys-sold-via-amazon-2609-0224\" target=\"_blank\" rel=\"noopener noreferrer\">OPSS毛毛虫玩具报告\u003c/a>确认边境拒收及窒息风险；其余原始报告见文末来源。无本业务SKU匹配证据，不能宣称需全店下架。\u003c/p>\n\u003ch3>Listing与广告\u003c/h3>\n\u003cp>本期未确认相册、补充页、School Memory Book、Portfolio Binder和Puzzle Accessories需要全量改标题、图片、A+、搜索词、属性或变体的新规；也未确认SP/SB/SD竞价、匹配、广告位计费或Rufus/COSMO规则的新增强制变化。PPC动作由可售库存和贡献毛利门槛触发，不能把论坛讨论当成算法发布。\u003c/p>\n\u003ch3>费用\u003c/h3>\n\u003cp>US旺季FBA费于2026-10-15进入执行期，2026-10-16纳入；需与3.5%燃油物流附加费共同核对实际账单。按发货订单的适用费率核算，不把所有销售额统一加3.5%。原始帮助页本次仅返回JavaScript外壳，具体尺寸重量费率必须登录账号复核。\u003ca href=\"https://sellercentral.amazon.com/help/hub/reference/external/GABBX6GZPA8MSZGW?locale=en_us\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon FBA费用帮助\u003c/a>。\u003c/p>\n\u003ch3>库存物流与促销\u003c/h3>\n\u003cp>US BFCM主线从提交准备转为入仓异常处理；2026-10-22官方清单核实日期，当前采用minimal split \u003cstrong>2026-10-21\u003c/strong>、optimized split \u003cstrong>2026-10-28\u003c/strong>，覆盖此前报告中的2026-10-20/2026-10-30口径。DE/FR/IT/ES到仓节点为2026-10-21，UK为2026-10-28。日期校正属于本期重要变化，不再沿用旧值。\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/6a6f3b4a-97a8-4f04-b671-4f7a1ae6046b\" target=\"_blank\" rel=\"noopener noreferrer\">US官方清单\u003c/a>；\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/d8c34b0b-86ed-4aec-9b0a-8be6eabb8fb0\" target=\"_blank\" rel=\"noopener noreferrer\">欧洲官方节点\u003c/a>。Deal实际资格、提交和状态仍以账号Deals Dashboard为准，不能用到仓日期替代促销资格。\u003c/p>\n\u003ch3>客服\u003c/h3>\n\u003cp>2026-10-13至2026-10-15 CSBA官方问答已结束；新加入者90天试用按首笔自发货订单发货启动。2026-10-14首次纳入，本期无充分证据支持全量开启或宣称本业务ODR必然改善。\u003ca href=\"https://sellercentral.amazon.co.uk/seller-forums/discussions/t/42fdef8c-c107-4d49-b092-b747649686ec\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon CSBA问答\u003c/a>。\u003c/p>\n\u003ch2>4. 本周海外市场与供应链变化\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>EU UHF：\u003c/strong> 2026-10-14将金额/日期推进为官方确认：2026-11-01起€2/distinct item。Revenue说明针对从EU外寄给EU消费者的电商货物，购物时已在EU境内的货物无此收费；同一包裹的相同商品与不同商品计数不能混为“每个销售件”。本地FBA库存与非EU直邮需分开，实际合同转嫁仍待确认。\u003ca href=\"https://www.revenue.ie/en/corporate/press-office/press-releases/2026/pr-092926-handling-fee.aspx\" target=\"_blank\" rel=\"noopener noreferrer\">Revenue 2026-09-29说明\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>US柴油：\u003c/strong> 2026-10-19数据周全国均价$6.276/加仑，前周$6.179，增加$0.097、约1.57%；是未锁价物流成本信号，未证明承运商收费同比例上涨。\u003ca href=\"https://www.eia.gov/petroleum/gasdiesel/\" target=\"_blank\" rel=\"noopener noreferrer\">EIA周度数据\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>US国际邮政：\u003c/strong> 2026-10-22两份CBP正式文件形成一条主线，合规延期至2027-01-20与ET13测试修改见日报。只有匹配国际邮政路线才执行排查，不能据此认定关税减免。\u003ca href=\"https://public-inspection.federalregister.gov/2026-21600.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">CBP延期\u003c/a>；\u003ca href=\"https://public-inspection.federalregister.gov/2026-21570.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">CBP测试修改\u003c/a>。\u003c/li>\n\u003cli>消费、汇率、港口及竞品平台未取得足以支持本业务新增量化决策的一手事实；不以宏观预测决定补货或调价。\u003c/li>\n\u003c/ul>\n\u003ch2>5. 对当前业务的量化影响\u003c/h2>\n\u003cp>以下为计算方法和内部建议门槛，不是实测经营结果或Amazon政策。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>指标\u003c/th>\n\u003cth>评估方法\u003c/th>\n\u003cth>决策口径与限制\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>单件贡献毛利/利润率\u003c/td>\n\u003ctd>不含税净收入－货值－头程－实际平台费－配送－促销费－广告－退货预期损失\u003c/td>\n\u003ctd>用实际新费率；利润率=贡献毛利÷不含税净收入，缺费用明细不报影响百分点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>盈亏平衡ACoS\u003c/td>\n\u003ctd>广告前贡献毛利÷与广告归因销售额一致口径的收入\u003c/td>\n\u003ctd>统一税、折扣和退款口径；目标ACoS低于盈亏平衡线并留利润空间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>UHF情景\u003c/td>\n\u003ctd>实际承担比例×€2×distinct item数/包裹销售件数\u003c/td>\n\u003ctd>假设卖家全承担、1件1类、净收入€20，则毛利少€2、利润率少10个百分点；EU本地库存不套用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>浮动燃油成本\u003c/td>\n\u003ctd>服务商合同燃油阶梯或报价差×实际运量\u003c/td>\n\u003ctd>柴油+1.57%不等于整票运费+1.57%，等待新报价确认\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>库存覆盖\u003c/td>\n\u003ctd>Available÷批准日销量预测；单列Reserved/Inbound及ETA\u003c/td>\n\u003ctd>建议活动可售量≥活动预测1.3倍作为缓冲；不是强制要求，也不把Inbound视为可售\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>销售、CTR、CVR、TACoS\u003c/td>\n\u003ctd>同ASIN/站点比较近7天与可比基期，标记价格、促销及缺货日\u003c/td>\n\u003ctd>缺业务导出不能归因政策效果；CTR/CVR无依据不预测提升百分比\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>6. 下周行动清单\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>动作\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>对象\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日\u003c/th>\n\u003cth>验收指标\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>Seller Central库存&gt;管理货件与FBA Inventory对账，再查Deals Dashboard\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES\u003c/td>\n\u003ctd>全部BFCM主推ASIN\u003c/td>\n\u003ctd>各站运营/供应链\u003c/td>\n\u003ctd>2026-10-26\u003c/td>\n\u003ctd>100%有Available/Reserved/Inbound、ETA、Deal Health；异常有Case和预算决定，2026-10-28复查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>费用预览/Payments交易明细抽核新履约费并更新促销底价\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>全部活动候选；抽至少20笔订单或全部不足20笔订单\u003c/td>\n\u003ctd>财务/US运营/PPC\u003c/td>\n\u003ctd>2026-10-26\u003c/td>\n\u003ctd>候选100%有新成本、毛利、盈亏平衡ACoS；亏损项不加预算\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>路线成本表分离EU本地和境外直邮，确认申报人与合同转嫁\u003c/td>\n\u003ctd>DE/FR/IT/ES\u003c/td>\n\u003ctd>非EU发往消费者路线及套装\u003c/td>\n\u003ctd>供应链/财务\u003c/td>\n\u003ctd>2026-10-28\u003c/td>\n\u003ctd>每条路线有承担方、计数法和书面证据；未确认项保留假设，不自动改价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>OMS筛国际邮政US订单，与服务商核对延期及ET13/PGA数据\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>FBM/补发\u003c/td>\n\u003ctd>供应链/合规\u003c/td>\n\u003ctd>2026-10-27\u003c/td>\n\u003ctd>100%匹配订单有适用性结论或无匹配证明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Manage All Inventory及开发台账筛玩具/绳带/小零件/薄袋/电气结构\u003c/td>\n\u003ctd>UK\u003c/td>\n\u003ctd>在售及开发SKU\u003c/td>\n\u003ctd>合规/产品开发\u003c/td>\n\u003ctd>2026-10-27\u003c/td>\n\u003ctd>匹配项有测试资料/整改责任人；无匹配有关闭依据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Settings中检查CSBA可用性；导出30天FBM费用、退款、ODR与SAFE-T\u003c/td>\n\u003ctd>US/UK\u003c/td>\n\u003ctd>有FBM订单账号\u003c/td>\n\u003ctd>客服/运营/财务\u003c/td>\n\u003ctd>2026-10-27\u003c/td>\n\u003ctd>有试用yes/no结论；试用需明确样本和退款预算上限\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>建议复用一张“ASIN×站点×活动”的Sheet合并库存、Deal Health、费用和PPC导出，以ASIN+站点为键校验缺失值，自动标记毛利不足和ETA晚于节点的行；运营人工确认后再改预算。\u003c/p>\n\u003ch2>7. 已关闭与继续跟踪事项\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>关闭事件窗口：\u003c/strong> CSBA 2026-10-15问答窗口已结束，关闭参会提醒；是否试用仍由账号评估，2026-10-27复查。\u003c/li>\n\u003cli>\u003cstrong>关闭旧日期口径：\u003c/strong> US minimal 2026-10-20、optimized 2026-10-30不再作为本报告执行日期；以2026-10-21/2026-10-28替代。货件任务未取得完成证据，不标记已关闭。\u003c/li>\n\u003cli>\u003cstrong>继续跟踪：\u003c/strong> BFCM到仓2026-10-24及2026-10-28复查；UHF承担方2026-10-28复查；柴油及合同报价2026-10-28复查；US邮政2026-10-28复查，2027-01-13检查切换准备。\u003c/li>\n\u003cli>\u003cstrong>历史存量任务：\u003c/strong> 商业责任险账号适用性、Partial Refunds白名单、Return and Recovery Insights均无本期新事实，不计入8条。账号负责人应于2026-10-27补充完成/不适用证据，不能用“无新公告”替代任务完成。\u003c/li>\n\u003c/ul>\n\u003ch2>8. 来源与可信度统计\u003c/h2>\n\u003cp>本期正文核心来源13个官方URL、非官方0：CBP预公开文件2、正式公报1、Amazon页面4（US清单、欧洲节点、FBA费率、CSBA）、Revenue1、EIA1、UK OPSS4，共13个URL；按独立文件去重，CBP正式公报不另算事件。统计统一为 \u003cstrong>13个官方URL、非官方0\u003c/strong>。UK OPSS除正文毛毛虫报告外，还包括：\u003ca href=\"https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-toddler-ghost-costume-sold-via-amazon-2609-0106\" target=\"_blank\" rel=\"noopener noreferrer\">Toddler Ghost Costume，2026-10-13\u003c/a>、\u003ca href=\"https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-oowolf-led-light-sold-via-amazon-2609-0221\" target=\"_blank\" rel=\"noopener noreferrer\">OOWOLF LED，2026-10-13\u003c/a>、\u003ca href=\"https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-frideko-home-led-floor-lamp-sold-via-amazon-2610-0006\" target=\"_blank\" rel=\"noopener noreferrer\">Frideko灯，2026-10-13\u003c/a>。部分历史来源承接已发布日报；登录后台通知、FBA尺寸费率和团队执行结果仍需账号证据。8条为事件主线数，不能与URL数或每日条数相加。\u003c/p>\n\u003cp>本期没有核实出新的强制Listing/广告规则；没有把旧保险、Partial Refunds等存量任务重复算成新增。来源事实、内部建议门槛和假设测算已分别说明。\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-10-23\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-10-23", "text": "### US 国际邮政：部分申报要求延期，Entry Type 13 测试调整\n\n- 【影响等级】P2\n- 【站点】US\n- 【发布日期】2026-10-22（Federal Register 正式刊登；预公开文件于 2026-10-21 提交）\n- 【生效日期】ET13 测试修改为 2026-10-22；19 CFR 145.12(a)(2)(v)、(vi) 合规日期改为 2027-01-20\n- 【信息状态】正式公告；ET13 为测试项目\n- 【来源】CBP / Federal Register：[延期最终规则 2026-21600](https://public-inspection.federalregister.gov/2026-21600.pdf)；[ET13 测试修改 2026-21570](https://public-inspection.federalregister.gov/2026-21570.pdf)；[2026-10-22 正式公报，第66639、66707页](https://www.govinfo.gov/content/pkg/FR-2026-10-22/pdf/FR-2026-10-22.pdf)。\n- 发生了什么：CBP 将部分国际邮政货物不再适用新邮政非正式申报流程的合规节点，从 2026-10-22 延至 2027-01-20，涵盖指定 PGA、HTS 第98/99章及特定免税申报情形。同日修改不超过 $2,500 国际邮政货物的 ET13 测试，允许传输申报时包含或不包含电子 PGA 数据；具体货物准入和数据义务须由报关方核定。\n- 我们怎么看：这给受影响直邮业务留下系统与报关准备时间，不代表恢复低值免税，也不代表撤销 PGA 义务。若当前全部采用商业货运 FBA 头程及境内配送，直接运营影响有限；无需调整 Listing、图片、A+、属性、竞价或预算。\n- 建议动作：供应链在 2026-10-27 前，从 OMS/ERP 导出近30天 US FBM 与补发订单，筛选 origin_country≠US 且 channel=international_post；字段保留订单号、SKU/ASIN、申报值、HTS、PGA机构、承运商、报关行、entry_type。向服务商取得“延期条款是否适用、ET13是否支持、PGA数据处理、2027-01-20切换方案”书面答复。验收为100%匹配订单有适用性结论；无匹配则记录不适用并关闭内部排查。复查 2026-10-28；若仍按旧日期要求停运或加收费用，先取得条款与报价证据再升级。\n\n", "title": "US 国际邮政：部分申报要求延期，Entry Type 13 测试调整", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-23\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-23\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>US 国际邮政：部分申报要求延期，Entry Type 13 测试调整\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】US\u003c/li>\n\u003cli>【发布日期】2026-10-22（Federal Register 正式刊登；预公开文件于 2026-10-21 提交）\u003c/li>\n\u003cli>【生效日期】ET13 测试修改为 2026-10-22；19 CFR 145.12(a)(2)(v)、(vi) 合规日期改为 2027-01-20\u003c/li>\n\u003cli>【信息状态】正式公告；ET13 为测试项目\u003c/li>\n\u003cli>【来源】CBP / Federal Register：\u003ca href=\"https://public-inspection.federalregister.gov/2026-21600.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">延期最终规则 2026-21600\u003c/a>；\u003ca href=\"https://public-inspection.federalregister.gov/2026-21570.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">ET13 测试修改 2026-21570\u003c/a>；\u003ca href=\"https://www.govinfo.gov/content/pkg/FR-2026-10-22/pdf/FR-2026-10-22.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">2026-10-22 正式公报，第66639、66707页\u003c/a>。\u003c/li>\n\u003cli>发生了什么：CBP 将部分国际邮政货物不再适用新邮政非正式申报流程的合规节点，从 2026-10-22 延至 2027-01-20，涵盖指定 PGA、HTS 第98/99章及特定免税申报情形。同日修改不超过 $2,500 国际邮政货物的 ET13 测试，允许传输申报时包含或不包含电子 PGA 数据；具体货物准入和数据义务须由报关方核定。\u003c/li>\n\u003cli>我们怎么看：这给受影响直邮业务留下系统与报关准备时间，不代表恢复低值免税，也不代表撤销 PGA 义务。若当前全部采用商业货运 FBA 头程及境内配送，直接运营影响有限；无需调整 Listing、图片、A+、属性、竞价或预算。\u003c/li>\n\u003cli>建议动作：供应链在 2026-10-27 前，从 OMS/ERP 导出近30天 US FBM 与补发订单，筛选 origin_country≠US 且 channel=international_post；字段保留订单号、SKU/ASIN、申报值、HTS、PGA机构、承运商、报关行、entry_type。向服务商取得“延期条款是否适用、ET13是否支持、PGA数据处理、2027-01-20切换方案”书面答复。验收为100%匹配订单有适用性结论；无匹配则记录不适用并关闭内部排查。复查 2026-10-28；若仍按旧日期要求停运或加收费用，先取得条款与报价证据再升级。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-10-23\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}]}, {"date": "2026-10-22", "text": "# 亚马逊及海外市场情报增量日报｜2026-10-22\n\n## 1. 今日判断\n\n今日没有发现新的 Amazon 平台强制规则、广告计费规则或跨境监管规则；但 Q4 入仓节点出现两项必须落地的实质更新。美国 FBA minimal-shipment-splits 到仓截止日的官方口径校正为 **2026-10-21**，今天应按“节点已过”关闭主推 ASIN 的未接收、不可售和 Deal Health 异常。DE/FR/IT/ES 的 Black Friday Week FBA 到仓节点同样已于 **2026-10-21** 到期，英国仍有至 **2026-10-28** 的补救窗口。最高优先级是 US 与欧陆库存例外闭环；最紧急行动是今天从货件、可售库存和 Deal Health 三个口径逐 ASIN 确认 BFCM 可执行性。\n\n## 2. 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n|---|---|---|---|---|---|\n| P0 | US BFCM minimal-split 到仓节点已过，校正截止日期 | US | FBA、库存、促销、利润 | 2026-10-21 已到期；optimized split 2026-10-28 | 是 |\n| P0 | 欧陆 Black Friday Week FBA 到仓节点已过 | DE/FR/IT/ES | FBA、库存、促销 | 2026-10-21 已到期 | 是 |\n| P1 | UK Black Friday Week FBA 到仓窗口 | UK | FBA、库存、促销 | 2026-10-28 | 是，完成补货例外排查 |\n\n## 3. 今日新情报\n\n本次检索未发现符合“首次发现且具运营影响”标准的新事件。\n\n## 4. 已有事件的重要更新\n\n### US Q4 2026 Holiday Readiness｜amz-q4-peak-holiday-2026-deadlines\n\n- **历史事件：** US BFCM Deal 与 FBA 入仓准备节点。\n- **上次状态：** 2026-10-20 已按 minimal-shipment-splits 到仓节点和 Deal 提交节点，要求检查 Received/可售库存、Deal Health 与异常 Case；索引中 minimal-split 日期记为 2026-10-20。\n- **本次新增变化：** Amazon Seller Forums 的官方 BFCM checklist 明确 minimal-shipment-splits 的 FBA 到仓截止日为 **2026-10-21**，Amazon-optimized shipment splits 为 **2026-10-28**。因此将上次索引中的 2026-10-20 口径校正为 2026-10-21；该节点现已到期。\n- **变化原因：** Amazon 官方 Q4 checklist 对 FBA shipment-split 到仓日期作出明确说明；不是新费用或新的 Deal 规则。\n- **行动是否需要调整：** 继续 P0，但把“截止前准备”升级为“到期后异常闭环”。US 运营在 Seller Central > 库存 > 管理货件，筛选 BFCM 主推 ASIN 的 Shipped/Delivered/Receiving/Closed 状态；与 FBA Inventory 的 Available、Reserved、Inbound 对照。对预计送达已过、Received 后仍不可售或覆盖天数低于预测活动销量 1.3 倍的 ASIN，今天开/追踪 Case，并在 Deals Dashboard 验证 Deal Health。来源：[Amazon Seller Forums BFCM 2026 checklist](https://sellercentral.amazon.com/seller-forums/discussions/t/6a6f3b4a-97a8-4f04-b671-4f7a1ae6046b)。\n\n### Europe Q4 2026 peak-season inbound｜amz-eu-q4-peak-holiday-2026-deadlines\n\n- **历史事件：** 欧洲站 Prime Big Deal Days / Black Friday Week 入仓节点与旺季履约费用。\n- **上次状态：** 2026-09-28 仍按节后主推池、促销可执行性、库存和预算承接进行复查，长期索引未记录 Black Friday Week 的到仓节点已到期。\n- **本次新增变化：** Amazon 官方公告显示，DE/FR/IT/ES 的 Black Friday Week Prime-badge 相关 FBA 库存应在 **2026-10-21** 前到达欧洲设施；UK 的相应节点为 **2026-10-28**。欧陆节点今天已进入到期后执行阶段，UK 仍有 6 天补救窗口。\n- **变化原因：** Amazon 旺季履约中心将由接收入库逐步转向处理客户订单，可用入库预约窗口受限；公告未改变促销资格或费用标准。\n- **行动是否需要调整：** 欧陆升级为 P0：欧洲运营在 Seller Central > 库存 > 管理货件及 FBA Inventory 页面，按 DE/FR/IT/ES 主推 ASIN 导出货件状态、Available、Reserved、Inbound 和预计到仓日；对未接收或活动期间预测可售覆盖不足 1.3 倍的 ASIN，今天确定降预算、替代 ASIN 或非促销价格方案。UK 保持 P1：今天锁定 2026-10-28 前可到仓货件，无法达成的 SKU 不新增 Black Friday 预算。验收为每个主推 ASIN 有“可售/异常 Case/替代方案”之一。来源：[Amazon Europe peak season 2026 官方公告](https://sellercentral.amazon.com/seller-forums/discussions/t/d8c34b0b-86ed-4aec-9b0a-8be6eabb8fb0)。\n\n## 5. 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n|---|---|---|---|---|---|---|\n| P0 | 导出 BFCM 主推 ASIN 的 Manage Shipments 状态并与 FBA Inventory Available/Reserved/Inbound、Deals Dashboard Deal Health 对账；异常逐票建/追踪 Case | US | US运营/供应链 | 2026-10-22 | 100% 主推 ASIN 有货件状态、可售数、Case 编号或无异常结论；Deal Health 无未处理红项 | 2026-10-23 |\n| P0 | 导出 DE/FR/IT/ES 主推 ASIN 的货件与可售库存；对未接收或预测覆盖低于活动销量 1.3 倍的 SKU，确定降预算、替代 ASIN 或常规定价方案 | DE/FR/IT/ES | 欧洲运营/PPC/供应链 | 2026-10-22 | 每个主推 ASIN 有可售数、异常状态及一种明确承接方案；所有异常货件有 Case 或 ETA 证据 | 2026-10-23 |\n| P1 | 按 UK 主推 ASIN 倒排 2026-10-28 到仓可行性；仅保留有预约、预计到仓和覆盖天数证据的补货，其余 SKU 从 Black Friday 预算候选池移除 | UK | UK运营/供应链/PPC | 2026-10-23 | UK 补货清单 100% 含 shipment ID、预约/ETA、可售覆盖天数和保留/移除决定 | 2026-10-28 |\n\n## 6. 持续关注\n\n- **事项：** US BFCM Amazon-optimized shipment splits 到仓。**当前状态：** 2026-10-28 节点未到；minimal-split 已截止。**下次复查日期：** 2026-10-23。**触发升级条件：** 主推 ASIN 无已确认 ETA、可售覆盖低于预测活动销量 1.3 倍，或 Case 无预计解决日。\n- **事项：** UK Black Friday Week FBA 到仓。**当前状态：** 2026-10-28 前仍有补救窗口。**下次复查日期：** 2026-10-23。**触发升级条件：** 任一 UK 主推 ASIN 无预约/ETA 或预计无法在 2026-10-28 前到仓，则立即从活动预算与 Deal 候选池移除。\n- **事项：** EU Union Handling Fee。**当前状态：** 2026-11-01 起 €2/个独立商品已确认，Amazon/承运商实际计费主体未确认。**下次复查日期：** 2026-10-28。**触发升级条件：** Amazon、承运商或清关方书面确认卖家承担或新增账单，则立即重算 DE/FR/IT/ES 到岸成本与最低价。\n\n## 7. 情报边界与可信度\n\n- 本次纳入 **2 个 Amazon 官方来源页面**，无非官方来源；确认 2 项已有事件的截止日/执行阶段变化，新增事件 0 项，仍待确认事项 1 项（EU UHF 的实际计费主体）。\n- 排除了 Amazon 新闻中的企业投资、招聘、消费电子和 AWS 内容；排除了 Seller Forums 卖家个案、无新增费用/规则/日期/范围的 BFCM 重复提醒，以及与相册、手工、礼品、文具和拼图配件关联不足的监管信息。\n- BFCM 到仓节点用于判断 Prime badge 与活动库存准备，不保证单票货件必然接收、可售或获得促销资格；必须以账号内货件、库存和 Deal Health 数据为最终证据。\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-22\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-22\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报增量日报｜2026-10-22\u003c/h1>\n\u003ch2>1. 今日判断\u003c/h2>\n\u003cp>今日没有发现新的 Amazon 平台强制规则、广告计费规则或跨境监管规则；但 Q4 入仓节点出现两项必须落地的实质更新。美国 FBA minimal-shipment-splits 到仓截止日的官方口径校正为 \u003cstrong>2026-10-21\u003c/strong>，今天应按“节点已过”关闭主推 ASIN 的未接收、不可售和 Deal Health 异常。DE/FR/IT/ES 的 Black Friday Week FBA 到仓节点同样已于 \u003cstrong>2026-10-21\u003c/strong> 到期，英国仍有至 \u003cstrong>2026-10-28\u003c/strong> 的补救窗口。最高优先级是 US 与欧陆库存例外闭环；最紧急行动是今天从货件、可售库存和 Deal Health 三个口径逐 ASIN 确认 BFCM 可执行性。\u003c/p>\n\u003ch2>2. 优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>影响站点\u003c/th>\n\u003cth>影响模块\u003c/th>\n\u003cth>截止/生效日期\u003c/th>\n\u003cth>今天是否需要动作\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P0\u003c/td>\n\u003ctd>US BFCM minimal-split 到仓节点已过，校正截止日期\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>FBA、库存、促销、利润\u003c/td>\n\u003ctd>2026-10-21 已到期；optimized split 2026-10-28\u003c/td>\n\u003ctd>是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P0\u003c/td>\n\u003ctd>欧陆 Black Friday Week FBA 到仓节点已过\u003c/td>\n\u003ctd>DE/FR/IT/ES\u003c/td>\n\u003ctd>FBA、库存、促销\u003c/td>\n\u003ctd>2026-10-21 已到期\u003c/td>\n\u003ctd>是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>UK Black Friday Week FBA 到仓窗口\u003c/td>\n\u003ctd>UK\u003c/td>\n\u003ctd>FBA、库存、促销\u003c/td>\n\u003ctd>2026-10-28\u003c/td>\n\u003ctd>是，完成补货例外排查\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>3. 今日新情报\u003c/h2>\n\u003cp>本次检索未发现符合“首次发现且具运营影响”标准的新事件。\u003c/p>\n\u003ch2>4. 已有事件的重要更新\u003c/h2>\n\u003ch3>US Q4 2026 Holiday Readiness｜amz-q4-peak-holiday-2026-deadlines\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>历史事件：\u003c/strong> US BFCM Deal 与 FBA 入仓准备节点。\u003c/li>\n\u003cli>\u003cstrong>上次状态：\u003c/strong> 2026-10-20 已按 minimal-shipment-splits 到仓节点和 Deal 提交节点，要求检查 Received/可售库存、Deal Health 与异常 Case；索引中 minimal-split 日期记为 2026-10-20。\u003c/li>\n\u003cli>\u003cstrong>本次新增变化：\u003c/strong> Amazon Seller Forums 的官方 BFCM checklist 明确 minimal-shipment-splits 的 FBA 到仓截止日为 \u003cstrong>2026-10-21\u003c/strong>，Amazon-optimized shipment splits 为 \u003cstrong>2026-10-28\u003c/strong>。因此将上次索引中的 2026-10-20 口径校正为 2026-10-21；该节点现已到期。\u003c/li>\n\u003cli>\u003cstrong>变化原因：\u003c/strong> Amazon 官方 Q4 checklist 对 FBA shipment-split 到仓日期作出明确说明；不是新费用或新的 Deal 规则。\u003c/li>\n\u003cli>\u003cstrong>行动是否需要调整：\u003c/strong> 继续 P0，但把“截止前准备”升级为“到期后异常闭环”。US 运营在 Seller Central &gt; 库存 &gt; 管理货件，筛选 BFCM 主推 ASIN 的 Shipped/Delivered/Receiving/Closed 状态；与 FBA Inventory 的 Available、Reserved、Inbound 对照。对预计送达已过、Received 后仍不可售或覆盖天数低于预测活动销量 1.3 倍的 ASIN，今天开/追踪 Case，并在 Deals Dashboard 验证 Deal Health。来源：\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/6a6f3b4a-97a8-4f04-b671-4f7a1ae6046b\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Seller Forums BFCM 2026 checklist\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003ch3>Europe Q4 2026 peak-season inbound｜amz-eu-q4-peak-holiday-2026-deadlines\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>历史事件：\u003c/strong> 欧洲站 Prime Big Deal Days / Black Friday Week 入仓节点与旺季履约费用。\u003c/li>\n\u003cli>\u003cstrong>上次状态：\u003c/strong> 2026-09-28 仍按节后主推池、促销可执行性、库存和预算承接进行复查，长期索引未记录 Black Friday Week 的到仓节点已到期。\u003c/li>\n\u003cli>\u003cstrong>本次新增变化：\u003c/strong> Amazon 官方公告显示，DE/FR/IT/ES 的 Black Friday Week Prime-badge 相关 FBA 库存应在 \u003cstrong>2026-10-21\u003c/strong> 前到达欧洲设施；UK 的相应节点为 \u003cstrong>2026-10-28\u003c/strong>。欧陆节点今天已进入到期后执行阶段，UK 仍有 6 天补救窗口。\u003c/li>\n\u003cli>\u003cstrong>变化原因：\u003c/strong> Amazon 旺季履约中心将由接收入库逐步转向处理客户订单，可用入库预约窗口受限；公告未改变促销资格或费用标准。\u003c/li>\n\u003cli>\u003cstrong>行动是否需要调整：\u003c/strong> 欧陆升级为 P0：欧洲运营在 Seller Central &gt; 库存 &gt; 管理货件及 FBA Inventory 页面，按 DE/FR/IT/ES 主推 ASIN 导出货件状态、Available、Reserved、Inbound 和预计到仓日；对未接收或活动期间预测可售覆盖不足 1.3 倍的 ASIN，今天确定降预算、替代 ASIN 或非促销价格方案。UK 保持 P1：今天锁定 2026-10-28 前可到仓货件，无法达成的 SKU 不新增 Black Friday 预算。验收为每个主推 ASIN 有“可售/异常 Case/替代方案”之一。来源：\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/d8c34b0b-86ed-4aec-9b0a-8be6eabb8fb0\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Europe peak season 2026 官方公告\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003ch2>5. 今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr 前状态：\u003c/strong> 2026-11-01 起 €2/个独立商品已确认，Amazon/承运商实际计费主体未确认。\u003cstrong>下次复查日期：\u003c/strong> 2026-10-28。\u003cstrong>触发升级条件：\u003c/strong> Amazon、承运商或清关方书面确认卖家承担或新增账单，则立即重算 DE/FR/IT/ES 到岸成本与最低价。\u003c/li>\n\u003c/ul>\n\u003ch2>7. 情报边界与可信度\u003c/h2>\n\u003cul>\n\u003cli>本次纳入 \u003cstrong>2 个 Amazon 官方来源页面\u003c/strong>，无非官方来源；确认 2 项已有事件的截止日/执行阶段变化，新增事件 0 项，仍待确认事项 1 项（EU UHF 的实际计费主体）。\u003c/li>\n\u003cli>排除了 Amazon 新闻中的企业投资、招聘、消费电子和 AWS 内容；排除了 Seller Forums 卖家个案、无新增费用/规则/日期/范围的 BFCM 重复提醒，以及与相册、手工、礼品、文具和拼图配件关联不足的监管信息。\u003c/li>\n\u003cli>BFCM 到仓节点用于判断 Prime badge 与活动库存准备，不保证单票货件必然接收、可售或获得促销资格；必须以账号内货件、库存和 Deal Health 数据为最终证据。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-10-22\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-10-22", "text": "### US Q4 2026 Holiday Readiness｜amz-q4-peak-holiday-2026-deadlines\n\n- **历史事件：** US BFCM Deal 与 FBA 入仓准备节点。\n- **上次状态：** 2026-10-20 已按 minimal-shipment-splits 到仓节点和 Deal 提交节点，要求检查 Received/可售库存、Deal Health 与异常 Case；索引中 minimal-split 日期记为 2026-10-20。\n- **本次新增变化：** Amazon Seller Forums 的官方 BFCM checklist 明确 minimal-shipment-splits 的 FBA 到仓截止日为 **2026-10-21**，Amazon-optimized shipment splits 为 **2026-10-28**。因此将上次索引中的 2026-10-20 口径校正为 2026-10-21；该节点现已到期。\n- **变化原因：** Amazon 官方 Q4 checklist 对 FBA shipment-split 到仓日期作出明确说明；不是新费用或新的 Deal 规则。\n- **行动是否需要调整：** 继续 P0，但把“截止前准备”升级为“到期后异常闭环”。US 运营在 Seller Central > 库存 > 管理货件，筛选 BFCM 主推 ASIN 的 Shipped/Delivered/Receiving/Closed 状态；与 FBA Inventory 的 Available、Reserved、Inbound 对照。对预计送达已过、Received 后仍不可售或覆盖天数低于预测活动销量 1.3 倍的 ASIN，今天开/追踪 Case，并在 Deals Dashboard 验证 Deal Health。来源：[Amazon Seller Forums BFCM 2026 checklist](https://sellercentral.amazon.com/seller-forums/discussions/t/6a6f3b4a-97a8-4f04-b671-4f7a1ae6046b)。\n\n", "title": "US Q4 2026 Holiday Readiness｜amz-q4-peak-holiday-2026-deadlines", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-22\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-22\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>US Q4 2026 Holiday Readiness｜amz-q4-peak-holiday-2026-deadlines\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>历史事件：\u003c/strong> US BFCM Deal 与 FBA 入仓准备节点。\u003c/li>\n\u003cli>\u003cstrong>上次状态：\u003c/strong> 2026-10-20 已按 minimal-shipment-splits 到仓节点和 Deal 提交节点，要求检查 Received/可售库存、Deal Health 与异常 Case；索引中 minimal-split 日期记为 2026-10-20。\u003c/li>\n\u003cli>\u003cstrong>本次新增变化：\u003c/strong> Amazon Seller Forums 的官方 BFCM checklist 明确 minimal-shipment-splits 的 FBA 到仓截止日为 \u003cstrong>2026-10-21\u003c/strong>，Amazon-optimized shipment splits 为 \u003cstrong>2026-10-28\u003c/strong>。因此将上次索引中的 2026-10-20 口径校正为 2026-10-21；该节点现已到期。\u003c/li>\n\u003cli>\u003cstrong>变化原因：\u003c/strong> Amazon 官方 Q4 checklist 对 FBA shipment-split 到仓日期作出明确说明；不是新费用或新的 Deal 规则。\u003c/li>\n\u003cli>\u003cstrong>行动是否需要调整：\u003c/strong> 继续 P0，但把“截止前准备”升级为“到期后异常闭环”。US 运营在 Seller Central &gt; 库存 &gt; 管理货件，筛选 BFCM 主推 ASIN 的 Shipped/Delivered/Receiving/Closed 状态；与 FBA Inventory 的 Available、Reserved、Inbound 对照。对预计送达已过、Received 后仍不可售或覆盖天数低于预测活动销量 1.3 倍的 ASIN，今天开/追踪 Case，并在 Deals Dashboard 验证 Deal Health。来源：\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/6a6f3b4a-97a8-4f04-b671-4f7a1ae6046b\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Seller Forums BFCM 2026 checklist\u003c/a>。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-10-22\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-10-22", "text": "### Europe Q4 2026 peak-season inbound｜amz-eu-q4-peak-holiday-2026-deadlines\n\n- **历史事件：** 欧洲站 Prime Big Deal Days / Black Friday Week 入仓节点与旺季履约费用。\n- **上次状态：** 2026-09-28 仍按节后主推池、促销可执行性、库存和预算承接进行复查，长期索引未记录 Black Friday Week 的到仓节点已到期。\n- **本次新增变化：** Amazon 官方公告显示，DE/FR/IT/ES 的 Black Friday Week Prime-badge 相关 FBA 库存应在 **2026-10-21** 前到达欧洲设施；UK 的相应节点为 **2026-10-28**。欧陆节点今天已进入到期后执行阶段，UK 仍有 6 天补救窗口。\n- **变化原因：** Amazon 旺季履约中心将由接收入库逐步转向处理客户订单，可用入库预约窗口受限；公告未改变促销资格或费用标准。\n- **行动是否需要调整：** 欧陆升级为 P0：欧洲运营在 Seller Central > 库存 > 管理货件及 FBA Inventory 页面，按 DE/FR/IT/ES 主推 ASIN 导出货件状态、Available、Reserved、Inbound 和预计到仓日；对未接收或活动期间预测可售覆盖不足 1.3 倍的 ASIN，今天确定降预算、替代 ASIN 或非促销价格方案。UK 保持 P1：今天锁定 2026-10-28 前可到仓货件，无法达成的 SKU 不新增 Black Friday 预算。验收为每个主推 ASIN 有“可售/异常 Case/替代方案”之一。来源：[Amazon Europe peak season 2026 官方公告](https://sellercentral.amazon.com/seller-forums/discussions/t/d8c34b0b-86ed-4aec-9b0a-8be6eabb8fb0)。\n\n", "title": "Europe Q4 2026 peak-season inbound｜amz-eu-q4-peak-holiday-2026-deadlines", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-22\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-22\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>Europe Q4 2026 peak-season inbound｜amz-eu-q4-peak-holiday-2026-deadlines\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>历史事件：\u003c/strong> 欧洲站 Prime Big Deal Days / Black Friday Week 入仓节点与旺季履约费用。\u003c/li>\n\u003cli>\u003cstrong>上次状态：\u003c/strong> 2026-09-28 仍按节后主推池、促销可执行性、库存和预算承接进行复查，长期索引未记录 Black Friday Week 的到仓节点已到期。\u003c/li>\n\u003cli>\u003cstrong>本次新增变化：\u003c/strong> Amazon 官方公告显示，DE/FR/IT/ES 的 Black Friday Week Prime-badge 相关 FBA 库存应在 \u003cstrong>2026-10-21\u003c/strong> 前到达欧洲设施；UK 的相应节点为 \u003cstrong>2026-10-28\u003c/strong>。欧陆节点今天已进入到期后执行阶段，UK 仍有 6 天补救窗口。\u003c/li>\n\u003cli>\u003cstrong>变化原因：\u003c/strong> Amazon 旺季履约中心将由接收入库逐步转向处理客户订单，可用入库预约窗口受限；公告未改变促销资格或费用标准。\u003c/li>\n\u003cli>\u003cstrong>行动是否需要调整：\u003c/strong> 欧陆升级为 P0：欧洲运营在 Seller Central &gt; 库存 &gt; 管理货件及 FBA Inventory 页面，按 DE/FR/IT/ES 主推 ASIN 导出货件状态、Available、Reserved、Inbound 和预计到仓日；对未接收或活动期间预测可售覆盖不足 1.3 倍的 ASIN，今天确定降预算、替代 ASIN 或非促销价格方案。UK 保持 P1：今天锁定 2026-10-28 前可到仓货件，无法达成的 SKU 不新增 Black Friday 预算。验收为每个主推 ASIN 有“可售/异常 Case/替代方案”之一。来源：\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/d8c34b0b-86ed-4aec-9b0a-8be6eabb8fb0\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Europe peak season 2026 官方公告\u003c/a>。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-10-22\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}]}, {"date": "2026-10-21", "text": "# 亚马逊及海外市场情报增量日报｜2026-10-21\n\n## 1. 今日判断\n\n今日无新的重大 Amazon 平台政策或广告规则；唯一需要更新的是美国柴油周度价格反弹，对未锁价的入仓、drayage、3PL 与 FBM 应急配送成本形成轻度上行压力。最高优先级仍是美国 BFCM：2026-10-20 Deal 提交和 FBA minimal-split 到仓节点已过，今天应关闭未接收货件、Deal Health 与可售库存异常。DE/FR/IT/ES 的 Union Handling Fee 将于 2026-11-01 生效，仍未获得 Amazon 或承运商的实际计费主体确认，暂不改售价。重点站点为 US；最紧急动作是今天完成 BFCM 例外 Case 与毛利复算。\n\n## 2. 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n|---|---|---|---|---|---|\n| P0 | US BFCM 到仓、Deal Health 与可售库存异常闭环 | US | FBA、促销、库存、利润 | 2026-10-21；optimized-split 到仓 2026-10-30 | 是 |\n| P1 | 周度柴油价格反弹纳入未锁价配送成本 | US | 物流、FBM、利润 | 2026-10-22 复核 | 是 |\n| P1 | EU UHF 计费主体确认 | DE/FR/IT/ES | 成本、定价、清关 | 2026-11-01 生效 | 是，确认口径；暂不改价 |\n\n## 3. 今日新情报\n\n本次检索未发现符合“首次发现且具运营影响”标准的新事件。\n\n## 4. 已有事件的重要更新\n\n### US 柴油物流成本信号｜us-eia-diesel-logistics-cost-signal-2026-09-09\n\n- **历史事件：** 美国 EIA 周度公路柴油价格，作为 Q4 入仓与配送成本敏感性信号。\n- **上次状态：** 2026-10-12 数据周全国均价为 $6.179/加仑，环比下降 $0.020；仅用于未锁价物流假设。\n- **本次新增变化：** EIA 于 2026-10-20 发布的 2026-10-19 数据周显示，全国均价升至 **$6.276/加仑**，环比 **+$0.097/加仑（+1.6%）**；东海岸从 $5.908 升至 $5.984，中西部从 $6.259 升至 $6.352。 \n- **变化原因：** EIA 的周度零售柴油数据变化；并非 Amazon 费用或承运商已宣布的附加费调整。\n- **行动是否需要调整：** 升级为一次 P1 成本复核。供应链在 TMS/3PL 报价表筛选“燃油附加费浮动、未锁价、预计 2026-10-21 至 2026-11-15 发运”的线路；财务用 +$0.097/加仑替换基准，复算 BFCM 候选 ASIN 的每单履约成本和贡献毛利。若任一 ASIN 重算后贡献毛利低于目标或低于 0，停止加码预算/Deal，改用可承受 ACoS 上限。 \n- **来源：** [U.S. EIA Gasoline and Diesel Fuel Update](https://www.eia.gov/petroleum/gasdiesel/)（发布 2026-10-20；数据周截至 2026-10-19）；[EIA Weekly Retail Diesel Price Table](https://www.eia.gov/dnav/pet/PET_PRI_GND_A_EPD2D_PTE_DPGAL_W.htm)。\n\n## 5. 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n|---|---|---|---|---|---|---|\n| P0 | 在 Seller Central > 库存 > 管理货件，导出 BFCM 主推 ASIN 的货件状态；筛选 Received 后仍不可售、预计送达已过期和异常货件，逐票开/追踪 Case，并在 Deals Dashboard 检查 Deal Health | US | US运营/供应链 | 2026-10-21 | 100% 主推 ASIN 有货件状态、可售数、Case 编号/无异常结论；Deal Health 无未处理红项 | 2026-10-22 |\n| P1 | 在 3PL/TMS 报价表筛选燃油附加费浮动且未锁价的 2026-10-21 至 2026-11-15 线路；以 $6.276/加仑重算 BFCM 候选 ASIN 单件履约成本和最低可售价格 | US | 供应链/财务 | 2026-10-22 | 清单覆盖 100% 未锁价线路；每个候选 ASIN 有新成本、贡献毛利、可承受 ACoS 与保留/下调/退出结论 | 2026-10-28 |\n| P1 | 向 Amazon 物流/承运商/清关服务商取得 UHF 的申报方、账单对象、收费时点与 Amazon EU FBA 是否涉及的书面确认；成本模板保留 €2/件占位，不直接改售价 | DE/FR/IT/ES | 供应链/财务/ERP | 2026-10-22 | 至少一份书面答复或升级工单；成本模板含 charging-party 字段及证据链接 | 2026-10-28 |\n\n## 6. 持续关注\n\n- **事项：** US BFCM FBA optimized-shipment-splits 到仓。**当前状态：** minimal-split 节点已过，异常待闭环。**下次复查日期：** 2026-10-22。**触发升级条件：** 主推 ASIN 的可售覆盖天数低于活动预测销量的 1.3 倍，或 Case 未给预计解决日。\n- **事项：** EU Union Handling Fee。**当前状态：** 2026-11-01 起 €2/个独立商品已确认，账单主体未确认。**下次复查日期：** 2026-10-28。**触发升级条件：** Amazon、承运商或清关方明确卖家承担或新增账单，则立即重算 DE/FR/IT/ES 到岸成本与最低价。\n- **事项：** UK 玩具/灯具 Amazon 渠道产品安全报告。**当前状态：** 定向风险词筛查待关闭。**下次复查日期：** 2026-10-22。**触发升级条件：** 命中 toy、craft kit、LED/light、cord、small parts 等在售或开发 SKU，则升级为合规证据与 Listing 排查。\n\n## 7. 情报边界与可信度\n\n- 本次纳入 **2 个官方来源页面**（EIA 两个数据页面），无非官方来源；确认 1 项已有事件的量化变化，新增事件 0 项，仍待确认事项 1 项（EU UHF 的实际计费主体）。\n- 排除了 Amazon Seller Forums 中的卖家个案、已于 2026-10-20 截止的 BFCM Deal 提醒重复报道，以及没有新增规则、费用、日期或适用范围的 Amazon Ads/监管内容。\n- 柴油价格是成本敏感性指标，不等同于 Amazon FBA 费用或所有承运商燃油附加费已调整；只有合同费率与实际账单可决定真实成本影响。\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-21\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-21\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报增量日报｜2026-10-21\u003c/h1>\n\u003ch2>1. 今日判断\u003c/h2>\n\u003cp>今日无新的重大 Amazon 平台政策或广告规则；唯一需要更新的是美国柴油周度价格反弹，对未锁价的入仓、drayage、3PL 与 FBM 应急配送成本形成轻度上行压力。最高优先级仍是美国 BFCM：2026-10-20 Deal 提交和 FBA minimal-split 到仓节点已过，今天应关闭未接收货件、Deal Health 与可售库存异常。DE/FR/IT/ES 的 Union Handling Fee 将于 2026-11-01 生效，仍未获得 Amazon 或承运商的实际计费主体确认，暂不改售价。重点站点为 US；最紧急动作是今天完成 BFCM 例外 Case 与毛利复算。\u003c/p>\n\u003ch2>2. 优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>影响站点\u003c/th>\n\u003cth>影响模块\u003c/th>\n\u003cth>截止/生效日期\u003c/th>\n\u003cth>今天是否需要动作\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P0\u003c/td>\n\u003ctd>US BFCM 到仓、Deal Health 与可售库存异常闭环\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>FBA、促销、库存、利润\u003c/td>\n\u003ctd>2026-10-21；optimized-split 到仓 2026-10-30\u003c/td>\n\u003ctd>是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>周度柴油价格反弹纳入未锁价配送成本\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>物流、FBM、利润\u003c/td>\n\u003ctd>2026-10-22 复核\u003c/td>\n\u003ctd>是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>EU UHF 计费主体确认\u003c/td>\n\u003ctd>DE/FR/IT/ES\u003c/td>\n\u003ctd>成本、定价、清关\u003c/td>\n\u003ctd>2026-11-01 生效\u003c/td>\n\u003ctd>是，确认口径；暂不改价\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>3. 今日新情报\u003c/h2>\n\u003cp>本次检索未发现符合“首次发现且具运营影响”标准的新事件。\u003c/p>\n\u003ch2>4. 已有事件的重要更新\u003c/h2>\n\u003ch3>US 柴油物流成本信号｜us-eia-diesel-logistics-cost-signal-2026-09-09\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>历史事件：\u003c/strong> 美国 EIA 周度公路柴油价格，作为 Q4 入仓与配送成本敏感性信号。\u003c/li>\n\u003cli>\u003cstrong>上次状态：\u003c/strong> 2026-10-12 数据周全国均价为 $6.179/加仑，环比下降 $0.020；仅用于未锁价物流假设。\u003c/li>\n\u003cli>\u003cstrong>本次新增变化：\u003c/strong> EIA 于 2026-10-20 发布的 2026-10-19 数据周显示，全国均价升至 \u003cstrong>$6.276/加仑\u003c/strong>，环比 \u003cstrong>+$0.097/加仑（+1.6%）\u003c/strong>；东海岸从 $5.908 升至 $5.984，中西部从 $6.259 升至 $6.352。\u003c/li>\n\u003cli>\u003cstrong>变化原因：\u003c/strong> EIA 的周度零售柴油数据变化；并非 Amazon 费用或承运商已宣布的附加费调整。\u003c/li>\n\u003cli>\u003cstrong>行动是否需要调整：\u003c/strong> 升级为一次 P1 成本复核。供应链在 TMS/3PL 报价表筛选“燃油附加费浮动、未锁价、预计 2026-10-21 至 2026-11-15 发运”的线路；财务用 +$0.097/加仑替换基准，复算 BFCM 候选 ASIN 的每单履约成本和贡献毛利。若任一 ASIN 重算后贡献毛利低于目标或低于 0，停止加码预算/Deal，改用可承受 ACoS 上限。\u003c/li>\n\u003cli>\u003cstrong>来源：\u003c/strong> \u003ca href=\"https://www.eia.gov/petroleum/gasdiesel/\" target=\"_blank\" rel=\"noopener noreferrer\">U.S. EIA Gasoline and Diesel Fuel Update\u003c/a>（发布 2026-10-20；数据周截至 2026-10-19）；\u003ca href=\"https://www.eia.gov/dnav/pet/PET_PRI_GND_A_EPD2D_PTE_DPGAL_W.htm\" target=\"_blank\" rel=\"noopener noreferrer\">EIA Weekly Retail Diesel Price Table\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003ch2>5. 今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P0\u003c/td>\n\u003ctd>在 Seller Central &gt; 库存 &gt; 管理货件，导出 BFCM 主推 ASIN 的货件状态；筛选 Received 后仍不可售、预计送达已过期和异常货件，逐票开/追踪 Case，并在 Deals Dashboard 检查 Deal Health\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>US运营/供应链\u003c/td>\n\u003ctd>2026-10-21\u003c/td>\n\u003ctd>100% 主推 ASIN 有货件状态、可售数、Case 编号/无异常结论；Deal Health 无未处理红项\u003c/td>\n\u003ctd>2026-10-22\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>在 3PL/TMS 报价表筛选燃油附加费浮动且未锁价的 2026-10-21 至 2026-11-15 线路；以 $6.276/加仑重算 BFCM 候选 ASIN 单件履约成本和最低可售价格\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>供应链/财务\u003c/td>\n\u003ctd>2026-10-22\u003c/td>\n\u003ctd>清单覆盖 100% 未锁价线路；每个候选 ASIN 有新成本、贡献毛利、可承受 ACoS 与保留/下调/退出结论\u003c/td>\n\u003ctd>2026-10-28\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>向 Amazon 物流/承运商/清关服务商取得 UHF 的申报方、账单对象、收费时点与 Amazon EU FBA 是否涉及的书面确认；成本模板保留 €2/件占位，不直接改售价\u003c/td>\n\u003ctd>DE/FR/IT/ES\u003c/td>\n\u003ctd>供应链/财务/ERP\u003c/td>\n\u003ctd>2026-10-22\u003c/td>\n\u003ctd>至少一份书面答复或升级工单；成本模板含 charging-party 字段及证据链接\u003c/td>\n\u003ctd>2026-10-28\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>6. 持续关注\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>事项：\u003c/strong> US BFCM FBA optimized-shipment-splits 到仓。\u003cstrong>当前状态：\u003c/strong> minimal-split 节点已过，异常待闭环。\u003cstrong>下次复查日期：\u003c/strong> 2026-10-22。\u003cstrong>触发升级条件：\u003c/strong> 主推 ASIN 的可售覆盖天数低于活动预测销量的 1.3 倍，或 Case 未给预计解决日。\u003c/li>\n\u003cli>\u003cstrong>事项：\u003c/strong> EU Union Handling Fee。\u003cstrong>当前状态：\u003c/strong> 2026-11-01 起 €2/个独立商品已确认，账单主体未确认。\u003cstrong>下次复查日期：\u003c/strong> 2026-10-28。\u003cstrong>触发升级条件：\u003c/strong> Amazon、承运商或清关方明确卖家承担或新增账单，则立即重算 DE/FR/IT/ES 到岸成本与最低价。\u003c/li>\n\u003cli>\u003cstrong>事项：\u003c/strong> UK 玩具/灯具 Amazon 渠道产品安全报告。\u003cstrong>当前状态：\u003c/strong> 定向风险词筛查待关闭。\u003cstrong>下次复查日期：\u003c/strong> 2026-10-22。\u003cstrong>触发升级条件：\u003c/strong> 命中 toy、craft kit、LED/light、cord、small parts 等在售或开发 SKU，则升级为合规证据与 Listing 排查。\u003c/li>\n\u003c/ul>\n\u003ch2>7. 情报边界与可信度\u003c/h2>\n\u003cul>\n\u003cli>本次纳入 \u003cstrong>2 个官方来源页面\u003c/strong>（EIA 两个数据页面），无非官方来源；确认 1 项已有事件的量化变化，新增事件 0 项，仍待确认事项 1 项（EU UHF 的实际计费主体）。\u003c/li>\n\u003cli>排除了 Amazon Seller Forums 中的卖家个案、已于 2026-10-20 截止的 BFCM Deal 提醒重复报道，以及没有新增规则、费用、日期或适用范围的 Amazon Ads/监管内容。\u003c/li>\n\u003cli>柴油价格是成本敏感性指标，不等同于 Amazon FBA 费用或所有承运商燃油附加费已调整；只有合同费率与实际账单可决定真实成本影响。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-10-21\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-10-21", "text": "### US 柴油物流成本信号｜us-eia-diesel-logistics-cost-signal-2026-09-09\n\n- **历史事件：** 美国 EIA 周度公路柴油价格，作为 Q4 入仓与配送成本敏感性信号。\n- **上次状态：** 2026-10-12 数据周全国均价为 $6.179/加仑，环比下降 $0.020；仅用于未锁价物流假设。\n- **本次新增变化：** EIA 于 2026-10-20 发布的 2026-10-19 数据周显示，全国均价升至 **$6.276/加仑**，环比 **+$0.097/加仑（+1.6%）**；东海岸从 $5.908 升至 $5.984，中西部从 $6.259 升至 $6.352。 \n- **变化原因：** EIA 的周度零售柴油数据变化；并非 Amazon 费用或承运商已宣布的附加费调整。\n- **行动是否需要调整：** 升级为一次 P1 成本复核。供应链在 TMS/3PL 报价表筛选“燃油附加费浮动、未锁价、预计 2026-10-21 至 2026-11-15 发运”的线路；财务用 +$0.097/加仑替换基准，复算 BFCM 候选 ASIN 的每单履约成本和贡献毛利。若任一 ASIN 重算后贡献毛利低于目标或低于 0，停止加码预算/Deal，改用可承受 ACoS 上限。 \n- **来源：** [U.S. EIA Gasoline and Diesel Fuel Update](https://www.eia.gov/petroleum/gasdiesel/)（发布 2026-10-20；数据周截至 2026-10-19）；[EIA Weekly Retail Diesel Price Table](https://www.eia.gov/dnav/pet/PET_PRI_GND_A_EPD2D_PTE_DPGAL_W.htm)。\n\n", "title": "US 柴油物流成本信号｜us-eia-diesel-logistics-cost-signal-2026-09-09", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-21\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-21\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>US 柴油物流成本信号｜us-eia-diesel-logistics-cost-signal-2026-09-09\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>历史事件：\u003c/strong> 美国 EIA 周度公路柴油价格，作为 Q4 入仓与配送成本敏感性信号。\u003c/li>\n\u003cli>\u003cstrong>上次状态：\u003c/strong> 2026-10-12 数据周全国均价为 $6.179/加仑，环比下降 $0.020；仅用于未锁价物流假设。\u003c/li>\n\u003cli>\u003cstrong>本次新增变化：\u003c/strong> EIA 于 2026-10-20 发布的 2026-10-19 数据周显示，全国均价升至 \u003cstrong>$6.276/加仑\u003c/strong>，环比 \u003cstrong>+$0.097/加仑（+1.6%）\u003c/strong>；东海岸从 $5.908 升至 $5.984，中西部从 $6.259 升至 $6.352。\u003c/li>\n\u003cli>\u003cstrong>变化原因：\u003c/strong> EIA 的周度零售柴油数据变化；并非 Amazon 费用或承运商已宣布的附加费调整。\u003c/li>\n\u003cli>\u003cstrong>行动是否需要调整：\u003c/strong> 升级为一次 P1 成本复核。供应链在 TMS/3PL 报价表筛选“燃油附加费浮动、未锁价、预计 2026-10-21 至 2026-11-15 发运”的线路；财务用 +$0.097/加仑替换基准，复算 BFCM 候选 ASIN 的每单履约成本和贡献毛利。若任一 ASIN 重算后贡献毛利低于目标或低于 0，停止加码预算/Deal，改用可承受 ACoS 上限。\u003c/li>\n\u003cli>\u003cstrong>来源：\u003c/strong> \u003ca href=\"https://www.eia.gov/petroleum/gasdiesel/\" target=\"_blank\" rel=\"noopener noreferrer\">U.S. EIA Gasoline and Diesel Fuel Update\u003c/a>（发布 2026-10-20；数据周截至 2026-10-19）；\u003ca href=\"https://www.eia.gov/dnav/pet/PET_PRI_GND_A_EPD2D_PTE_DPGAL_W.htm\" target=\"_blank\" rel=\"noopener noreferrer\">EIA Weekly Retail Diesel Price Table\u003c/a>。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-10-21\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}]}, {"date": "2026-10-20", "text": "# 亚马逊及海外市场情报增量日报｜2026-10-20\n\n## 今日判断\n\n今日没有新发布的重大 Amazon 或监管规则；但 US BFCM 履约节点今天进入执行日。最高优先级为 US FBA Black Friday/Cyber Monday 最小拆分入仓到货核验，以及 BFCM Deal 候选 ASIN 的提交、利润和库存最后复核。重点站点为 US，最紧急截止日为 2026-10-20；未完成的 FBA 入仓和 Deal Health 异常须今天建立例外清单并升级。\n\n## 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n|---|---|---|---|---|---|\n| P0 | BFCM 最小拆分 FBA 入仓到货节点 | US | FBA / 库存 / Prime 可售 | 2026-10-20 | 是：逐票核验已接收、可售与异常处理 |\n| P0 | BFCM Deal 候选池最后提交与新费用利润复核 | US | 促销 / 定价 / 财务 / PPC | 2026-10-20 | 是：提交前完成 Deal Health、库存与贡献毛利校验 |\n| P1 | 商业责任险账户适用性复核 | US/多站点 | 合规 / 账户健康 | 2026-10-20 | 是：核验后台 warning 与保单信息 |\n\n## 已有事件的重要更新\n\n### Amazon US Q4 2026 Holiday Readiness and Prime Big Deal Days inbound deadlines｜amz-q4-peak-holiday-2026-deadlines\n\n- 上次状态：2026-10-09 已将工作重心由 PBDD 转为 BFCM Deal 提交；候选 ASIN 要先完成利润、库存与 Deal Health 预审。\n- 本次新增变化：2026-10-20 到达 BFCM FBA “minimal shipment splits”到货节点；Amazon 公开论坛中的 Amazon 回复列明该节点，并保留 2026-10-30 的 Amazon-optimized shipment splits 到货节点。既有索引中的 BFCM Deal 提交截止日也在今天。\n- 行动是否需要调整：升级为 P0。未接收货件须取得 POD/预约号并在 Seller Central 开 Case；仅在新费用后贡献毛利达标、可售库存不少于预测活动销量 1.3 倍、Deal Health 无 blocker 时提交 Deal。\n- 来源：Amazon Seller Forums（Amazon 回复）：https://sellercentral.amazon.com/seller-forums/discussions/t/67ab1bf7-8ea5-4a10-ab19-dc600193715a?mons_sel_locale=fr_FR\n\n## 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n|---|---|---|---|---|---|---|\n| P0 | 在 Send to Amazon 与 Shipment Performance 导出 BFCM 货件；按 shipment ID 标记 received、FC processing、appointment、carrier exception 与 available inventory | US | US 运营 / 供应链 | 2026-10-20 16:00 | 100% BFCM 货件有状态、ETA、异常负责人和下一步；异常货件已有 Case 或承运商工单号 | 2026-10-21 |\n| P0 | 在 Deals/Deal Health 导出 BFCM 候选 ASIN；重算实际 FBA fee、3.5% surcharge、coupon/deal fee、广告预算后的贡献毛利和最低价 | US | US 运营 / 财务 / PPC | 2026-10-20 18:00 | 提交 ASIN 库存覆盖≥预测销量1.3倍、Deal Health 无 blocker；不达标项已移出 | 2026-10-21 |\n| P1 | 在 Account Health 与 Business Insurance 核对 enhanced safety category、AIA、insured entity、保额、到期日和 warning | US/多站点 | 合规 / 财务 | 2026-10-20 17:00 | 已留存核验记录；warning 有补件、责任人和提交时点 | 2026-10-24 |\n\n## 情报边界与可信度\n\n门禁使用中国政府网《国务院办公厅关于2026年部分节假日安排的通知》（国办发明电〔2025〕7号）：https://www.gov.cn/zhengce/zhengceku/202511/content_7047091.htm；2026-10-20 为大陆法定工作日。本周最后一个大陆工作日为 2026-10-23，应在当日随日报生成周报。\n\n检索窗口为 2026-10-19 11:20:08 至 2026-10-20 09:06:14（Asia/Shanghai）。复查来源 16 个，其中官方/监管/一手来源 13 个、非官方辅助来源 3 个；首次发现新事件 0 条、已有事件实质更新 1 条、仍待确认事项 2 条。排除了无新增事实的 Accelerate/unBoxed/Ads 营销稿、已推送的 Review Requests 与 DVA+ 预告、旧 OPSS/CPSC 通报及无权威确认的关税与物流传闻。\n\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-20\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-20\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * 3cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P0\u003c/td>\n\u003ctd>在 Send to Amazon 与 Shipment Performance 导出 BFCM 货件；按 shipment ID 标记 received、FC processing、appointment、carrier exception 与 available inventory\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>US 运营 / 供应链\u003c/td>\n\u003ctd>2026-10-20 16:00\u003c/td>\n\u003ctd>100% BFCM 货件有状态、ETA、异常负责人和下一步；异常货件已有 Case 或承运商工单号\u003c/td>\n\u003ctd>2026-10-21\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P0\u003c/td>\n\u003ctd>在 Deals/Deal Health 导出 BFCM 候选 ASIN；重算实际 FBA fee、3.5% surcharge、coupon/deal fee、广告预算后的贡献毛利和最低价\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>US 运营 / 财务 / PPC\u003c/td>\n\u003ctd>2026-10-20 18:00\u003c/td>\n\u003ctd>提交 ASIN 库存覆盖≥预测销量1.3倍、Deal Health 无 blocker；不达标项已移出\u003c/td>\n\u003ctd>2026-10-21\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>在 Account Health 与 Business Insurance 核对 enhanced safety category、AIA、insured entity、保额、到期日和 warning\u003c/td>\n\u003ctd>US/多站点\u003c/td>\n\u003ctd>合规 / 财务\u003c/td>\n\u003ctd>2026-10-20 17:00\u003c/td>\n\u003ctd>已留存核验记录；warning 有补件、责任人和提交时点\u003c/td>\n\u003ctd>2026-10-24\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>情报边界与可信度\u003c/h2>\n\u003cp>门禁使用中国政府网《国务院办公厅关于2026年部分节假日安排的通知》（国办发明电〔2025〕7号）：\u003ca href=\"https://www.gov.cn/zhengce/zhengceku/202511/content_7047091.htm；2026-10-20\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.cn/zhengce/zhengceku/202511/content_7047091.htm；2026-10-20\u003c/a> 为大陆法定工作日。本周最后一个大陆工作日为 2026-10-23，应在当日随日报生成周报。\u003c/p>\n\u003cp>检索窗口为 2026-10-19 11:20:08 至 2026-10-20 09:06:14（Asia/Shanghai）。复查来源 16 个，其中官方/监管/一手来源 13 个、非官方辅助来源 3 个；首次发现新事件 0 条、已有事件实质更新 1 条、仍待确认事项 2 条。排除了无新增事实的 Accelerate/unBoxed/Ads 营销稿、已推送的 Review Requests 与 DVA+ 预告、旧 OPSS/CPSC 通报及无权威确认的关税与物流传闻。\u003c/p>\n    \u003cfoot
