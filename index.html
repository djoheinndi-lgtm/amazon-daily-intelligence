整：商业责任险 2026-11-02 新要求需要账号内原始通知确认，USPS 旺季加价需等待 PRC 审核，Amazon Ads 诉讼需等待官方后台口径变化。\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-04\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-04\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报增量日报｜2026-09-04\u003c/h1>\n\u003ch2>1. 今日判断\u003c/h2>\n\u003cp>今日没有发现新的 Amazon 强制 Listing、图片、A+ 或 FBA 费用规则；最高优先级是确认商业责任险新要求是否已进入本账号后台通知。若团队在中国大陆主体运营 US 站，需重点验证 2026-11-02 起是否必须通过 Amazon Insurance Accelerator 提交新保单，以及儿童、化妆品/摄入类、锂电等 enhanced safety 类目是否不再适用 10,000 美元月销售触发门槛。US FBM/Buy Shipping 旺季成本需开始重算，USPS 提议 2026-10-04 至 2027-01-17 对主要包裹服务加收临时旺季价格。物流侧 Drewry 2026-09-03 WCI 稳在 4,465 美元/40尺柜，跨太平洋上行和亚欧下行相互抵消，暂不建议因单周指数变化调整补货节奏。今天是本周最后一个中国大陆法定工作日，需要追加周报。\u003c/p>\n\u003ch2>2. 优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>影响站点\u003c/th>\n\u003cth>影响模块\u003c/th>\n\u003cth>截止/生效日期\u003c/th>\n\u003cth>今天是否需要动作\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>商业责任险新要求需账号内确认\u003c/td>\n\u003ctd>US 为主，多站点观察\u003c/td>\n\u003ctd>Account Health / Compliance / Risk\u003c/td>\n\u003ctd>2026-11-02\u003c/td>\n\u003ctd>今天创建核查任务，2026-09-08 前完成 Seller Central 通知与保单路径确认\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>USPS 旺季包裹临时加价进入成本测算\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>FBM / Buy Shipping / Pricing / Profit\u003c/td>\n\u003ctd>2026-10-04\u003c/td>\n\u003ctd>对 FBM/SFP/备用自发货 SKU 重算 10-1 月运费毛利\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>CPSC 新增 Amazon 渠道水珠玩具与床护栏召回\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Product Compliance / Listing Risk\u003c/td>\n\u003ctd>2026-09-03\u003c/td>\n\u003ctd>只筛查儿童、玩具、水珠、床护栏、家具类风险词\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Drewry WCI 9 月 3 日运价稳定\u003c/td>\n\u003ctd>US/EU/UK\u003c/td>\n\u003ctd>Supply Chain / Landed Cost\u003c/td>\n\u003ctd>2026-09-03\u003c/td>\n\u003ctd>更新补货模型海运参考价，暂不改旺季备货节奏\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>3. 今日新情报\u003c/h2>\n\u003ch3>商业责任险新要求出现 Amazon Announcement 转述，需账号内确认\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P1\u003c/li>\n\u003cli>【站点】US 为主，多站点观察\u003c/li>\n\u003cli>【发布日期】2026-09-03\u003c/li>\n\u003cli>【生效日期】2026-11-02\u003c/li>\n\u003cli>【信息状态】Amazon Announcement 转述，待 Seller Central 账号后台确认\u003c/li>\n\u003cli>【来源】Sellers Ask Sellers 转述 Amazon Announcement：\u003ca href=\"https://sellersasksellers.com/t/new-insurance-requirements-effective-nov-2-2026/7505；Amazon\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellersasksellers.com/t/new-insurance-requirements-effective-nov-2-2026/7505；Amazon\u003c/a> enhanced safety 类目帮助页：\u003ca href=\"https://sellercentral.amazon.com/help/hub/reference/external/GUQ848NB5HZ6M6A4；Amazon\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/help/hub/reference/external/GUQ848NB5HZ6M6A4；Amazon\u003c/a> 商业责任险现行要求：\u003ca href=\"https://sellercentral.amazon.com.tr/seller-forums/discussions/t/4d4b6fe5-f6c1-4c65-bbe8-584326d76408\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com.tr/seller-forums/discussions/t/4d4b6fe5-f6c1-4c65-bbe8-584326d76408\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>发生了什么\u003c/strong>：第三方卖家社区转述的 Amazon Announcement 显示，2026-11-02 起商业责任险规则可能新增两点：enhanced safety listing requirements 类目即使未达到 US 站单月 10,000 美元销售额，也需维持 100 万美元/次及累计的商业责任险；中国大陆主体卖家新提交保险可能需通过 Amazon Insurance Accelerator。现行 Amazon 帮助内容仍可确认 10,000 美元触发门槛、100 万美元保额和覆盖全部在售商品等基础要求。\u003c/p>\n\u003cp>\u003cstrong>我们怎么看\u003c/strong>：这对相册、补充页、portfolio binder 的直接影响通常低于儿童、化妆品、食品、锂电商品，但 school memory book、craft kit、puzzle accessories 若在后台或前台被归到儿童/玩具/套装/活动用品，可能被纳入安全增强类目。关键风险不是今天立即下架，而是 45 天补交保险证明、保单供应商不被接受、续保时无法通过 AIA 路径导致高风险类目 Listing 停用。\u003c/p>\n\u003cp>\u003cstrong>建议动作\u003c/strong>：合规/财务在 2026-09-08 前登录 Seller Central，路径优先查 Performance Notifications、Account Health、Business Insurance、Product Compliance Requests；导出涉及 children、toy、craft kit、battery、cosmetic、ingestible 的 ASIN 清单。验收标准：确认本账号是否收到 Amazon 原始通知、当前保单到期日、承保主体是否匹配 legal entity、是否通过 AIA，以及 enhanced safety SKU 是否需要单独保险证明。未收到后台通知时，先标记为“待确认”，不更换保险供应商。\u003c/p>\n\u003ch3>USPS 提议 2026 旺季包裹临时加价，影响 US FBM 和 Buy Shipping 毛利\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P1\u003c/li>\n\u003cli>【站点】US\u003c/li>\n\u003cli>【发布日期】2026-08-25；本次首次纳入：2026-09-04\u003c/li>\n\u003cli>【生效日期】2026-10-04 至 2027-01-17，待 PRC 审核\u003c/li>\n\u003cli>【信息状态】政府/邮政正式公告，待 Postal Regulatory Commission 审核\u003c/li>\n\u003cli>【来源】USPS Newsroom：\u003ca href=\"https://about.usps.com/newsroom/national-releases/2026/0825-usps-announces-temporary-price-change-for-2026-holiday-shipping-season.htm；PluginHive\" target=\"_blank\" rel=\"noopener noreferrer\">https://about.usps.com/newsroom/national-releases/2026/0825-usps-announces-temporary-price-change-for-2026-holiday-shipping-season.htm；PluginHive\u003c/a> 2026-09-03 解读：\u003ca href=\"https://www.pluginhive.com/usps-holiday-shipping-in-shopify/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.pluginhive.com/usps-holiday-shipping-in-shopify/\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>发生了什么\u003c/strong>：USPS 已向 PRC 提交通知，计划在 2026-10-04 至 2027-01-17 对 Priority Mail Express、Priority Mail、USPS Ground Advantage 和 Parcel Select 等国内竞争性包裹产品实行旺季临时价格调整。公告明确其他产品不受影响，最终仍取决于 PRC 审核。\u003c/p>\n\u003cp>\u003cstrong>我们怎么看\u003c/strong>：如果 US 店铺全部 FBA，直接影响有限；但 FBM、SFP、Amazon Business 大单备用自发货、退换货补发、低价配件单件发货会受到毛利挤压。相册和 refill pages 若重量集中在 0-3 lb 或 4-10 lb，单票加价金额看似小，但 Q4 大促期间会直接影响 contribution margin 和优惠力度。\u003c/p>\n\u003cp>\u003cstrong>建议动作\u003c/strong>：运营/财务在 2026-09-11 前筛选近 90 天 US FBM、SFP、Buy Shipping、补发订单，字段包含 SKU、重量段、zone、承运服务、当前运费、售价、毛利率、退货/补发率。对毛利率低于目标 3 个点或运费占售价超过 18% 的 SKU，提前给出三种方案：改 FBA、提高 FBM shipping charge/价格、或限制促销折扣。PRC 审核结果在 2026-09-18 复查。\u003c/p>\n\u003ch3>CPSC 9 月 3 日新增多起 Amazon 渠道产品安全召回\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】US\u003c/li>\n\u003cli>【发布日期】2026-09-03\u003c/li>\n\u003cli>【生效日期】2026-09-03\u003c/li>\n\u003cli>【信息状态】正式监管召回\u003c/li>\n\u003cli>【来源】CPSC GIHNJSI 水珠玩具召回：\u003ca href=\"https://www.cpsc.gov/Recalls/2026/GIHNJSI-Squeezy-Dumplings-Toys-Recalled-Due-to-Serious-Ingestion-Choking-and-Obstruction-Hazards-Sold-on-Amazon-by-Chenyuanhui；CPSC\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.cpsc.gov/Recalls/2026/GIHNJSI-Squeezy-Dumplings-Toys-Recalled-Due-to-Serious-Ingestion-Choking-and-Obstruction-Hazards-Sold-on-Amazon-by-Chenyuanhui；CPSC\u003c/a> Loyoda 床护栏召回：\u003ca href=\"https://www.cpsc.gov/Recalls/2026/Adult-Portable-Bed-Rails-Recalled-Due-to-Risk-of-Serious-Injury-or-Death-from-Entrapment-and-Asphyxiation-Violate-Mandatory-Standard-for-Adult-Portable-Bed-Rails-Sold-on-Amazon-by-Loyoda-Direct-and-Loyoda；Amazon\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.cpsc.gov/Recalls/2026/Adult-Portable-Bed-Rails-Recalled-Due-to-Risk-of-Serious-Injury-or-Death-from-Entrapment-and-Asphyxiation-Violate-Mandatory-Standard-for-Adult-Portable-Bed-Rails-Sold-on-Amazon-by-Loyoda-Direct-and-Loyoda；Amazon\u003c/a> Product Safety Alerts：\u003ca href=\"https://www.amazon.com/product-safety-alerts\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.amazon.com/product-safety-alerts\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>发生了什么\u003c/strong>：CPSC 2026-09-03 发布多起与 Amazon 销售渠道相关的召回或安全警示，包括约 8,000 件 GIHNJSI Squeezy Dumplings 水珠玩具，以及约 2,200 件 Loyoda 成人便携床护栏。主要风险涉及水珠误食、窒息/肠梗阻、床护栏夹陷/窒息、跌落、标签缺失等强制标准问题。\u003c/p>\n\u003cp>\u003cstrong>我们怎么看\u003c/strong>：这不是相册主线类目的直接规则变化，但与 2026-09-03 已记录的 UK 水珠/感官玩具案例形成同一条产品安全信号：Amazon 渠道上儿童、玩具、感官、家具/支撑结构商品正在被监管集中点名。若 puzzle accessories 含磁吸、小零件、水珠、软胶、儿童玩具定位，或 school memory book 被包装成儿童活动套装，需要从“是否能卖”提升到“测试报告、标签、年龄分级、材料证明是否能逐 ASIN 对应”。\u003c/p>\n\u003cp>\u003cstrong>建议动作\u003c/strong>：合规/Listing 在 2026-09-12 前筛查 US 店铺标题、五点、A+、Search Terms、Item Type Keyword 中包含 kids、toy、sensory、beads、magnetic、small parts、bed rail、dresser、furniture、activity kit 的 ASIN。验收标准：命中 ASIN 有 CPSC/CPC、ASTM F963、警示标签、年龄分级、供应商测试报告或“不适用”说明；未命中则仅观察，暂不调整 Listing。\u003c/p>\n\u003ch3>Drewry 9 月 3 日 WCI 稳定在 4,465 美元/40尺柜\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】US/EU/UK\u003c/li>\n\u003cli>【发布日期】2026-09-03\u003c/li>\n\u003cli>【生效日期】2026-09-03\u003c/li>\n\u003cli>【信息状态】权威行业指数\u003c/li>\n\u003cli>【来源】Drewry World Container Index：\u003ca href=\"https://www.drewry.co.uk/supply-chain-advisors/supply-chain-expertise/world-container-index-assessed-by-drewry\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.drewry.co.uk/supply-chain-advisors/supply-chain-expertise/world-container-index-assessed-by-drewry\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>发生了什么\u003c/strong>：Drewry 2026-09-03 的 World Container Index 稳定在 4,465 美元/40尺柜；跨太平洋航线涨幅被亚欧航线下跌抵消。相比 2026-08-27 的 4,473 美元/40尺柜，整体基本持平。\u003c/p>\n\u003cp>\u003cstrong>我们怎么看\u003c/strong>：海运成本仍处高位但单周没有方向性突破，不能单独触发加速补货或暂停补货。对 US、DE、FR、IT、ES 的旺季备货，更重要的是 FC 预约、预计到仓日、FBA 可售库存覆盖天数和每 SKU landed cost，而不是用指数涨跌替代 SKU 级预测。\u003c/p>\n\u003cp>\u003cstrong>建议动作\u003c/strong>：供应链在 2026-09-09 前更新 US/EU 重点 SKU landed cost 模型，海运假设使用当前货代报价并保留 Drewry WCI 4,465 美元作为外部校验。验收标准：核心相册、补充页、学校记忆册 SKU 有在途 ETA、FBA receiving 状态、目标库存覆盖天数、补货毛利率和缺货风险分层。\u003c/p>\n\u003ch2>4. 已有事件的重要更新\u003c/h2>\n\u003ch3>Pan-EU FBA 荷兰 active offer 要求进入执行后核查\u003c/h3>\n\u003cul>\n\u003cli>历史事件：amazon-pan-eu-fba-nl-be-offer-2026\u003c/li>\n\u003cli>上次状态：2026-09-03 已提示 Netherlands active offer 要求到达生效日，需核对 Pan-EU SKU。\u003c/li>\n\u003cli>本次新增变化：今天进入生效后第一个工作日复查节点，未见 Amazon 对规则口径做新的公开变更。\u003c/li>\n\u003cli>变化原因：长期索引复查日期为 2026-09-04，需要确认动作是否完成，而不是重复推送旧规则。\u003c/li>\n\u003cli>行动是否需要调整：若欧洲运营已导出 Pan-EU SKU 并确认 NL active offer、价格、库存、VAT 配置，状态可关闭；若未完成，维持 P1 并将截止日改为 2026-09-05。复查路径：Seller Central Europe &gt; Manage Inventory / Pan-European FBA enrollment / Netherlands offer status。\u003c/li>\n\u003c/ul>\n\u003ch3>Amazon Ads 诉讼主线暂无后台规则更新\u003c/h3>\n\u003cul>\n\u003cli>历史事件：amazon-sponsored-ads-ftc-lawsuit-2026-08-31\u003c/li>\n\u003cli>上次状态：2026-09-03 记录为监管诉讼，等待 Amazon Ads 是否发布计费、拍卖或报表口径新说明。\u003c/li>\n\u003cli>本次新增变化：本次检索未发现 2026-09-03 至 2026-09-04 Amazon Ads 官方发布新的 Sponsored Products、Sponsored Brands、Sponsored Display、DSP 或 AMC 后台规则调整。\u003c/li>\n\u003cli>变化原因：诉讼媒体解读仍在传播，但没有新增可执行的广告后台事实。\u003c/li>\n\u003cli>行动是否需要调整：继续原动作，PPC/Finance 在 2026-09-05 前完成 CPC、CVR、ROAS、TACoS 异常审计；不建议因诉讼新闻机械停投核心词。\u003c/li>\n\u003c/ul>\n\u003ch2>5. 今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>在 Seller Central 查验是否收到商业责任险新要求原始通知，并建立 enhanced safety ASIN 清单\u003c/td>\n\u003ctd>US/多站点\u003c/td>\n\u003ctd>合规/财务\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003ctd>有通知截图或“未收到”记录；保单到期日、承保主体、AIA 路径、风险 ASIN 清单齐全\u003c/td>\n\u003ctd>2026-09-10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>重算 US FBM/SFP/Buy Shipping 旺季运费毛利\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>运营/财务\u003c/td>\n\u003ctd>2026-09-11\u003c/td>\n\u003ctd>近 90 天自发货 SKU 按重量段、zone、服务、毛利率输出风险等级和处理方案\u003c/td>\n\u003ctd>2026-09-18\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>完成 Pan-EU FBA NL offer 生效后复查\u003c/td>\n\u003ctd>DE/FR/IT/ES/NL\u003c/td>\n\u003ctd>欧洲运营\u003c/td>\n\u003ctd>2026-09-05\u003c/td>\n\u003ctd>所有 Pan-EU SKU 有 NL offer 状态、价格、库存、VAT 风险备注；不适用则关闭\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>筛查 US 儿童/玩具/感官/小零件/家具风险词 ASIN\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>合规/Listing\u003c/td>\n\u003ctd>2026-09-12\u003c/td>\n\u003ctd>命中 ASIN 有合规文件或不适用说明；高风险项有停售/整改判断\u003c/td>\n\u003ctd>2026-09-19\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>更新 US/EU 核心 SKU landed cost 和库存覆盖模型\u003c/td>\n\u003ctd>US/EU/UK\u003c/td>\n\u003ctd>供应链\u003c/td>\n\u003ctd>2026-09-09\u003c/td>\n\u003ctd>模型包含货代报价、Drewry WCI 校验、ETA、FBA receiving、覆盖天数和毛利率\u003c/td>\n\u003ctd>2026-09-16\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>6. 持续关注\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>事项\u003c/th>\n\u003cth>当前状态\u003c/th>\n\u003cth>下次复查日期\u003c/th>\n\u003cth>触发升级条件\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>商业责任险新要求\u003c/td>\n\u003ctd>第三方转述 Amazon Announcement，需账号内一手确认\u003c/td>\n\u003ctd>2026-09-10\u003c/td>\n\u003ctd>Seller Central 收到保险通知、AIA 强制路径或 enhanced safety ASIN 保险请求时升级 P1/P0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>USPS 2026 旺季包裹临时加价\u003c/td>\n\u003ctd>USPS 已提交 PRC 审核，尚未正式生效\u003c/td>\n\u003ctd>2026-09-18\u003c/td>\n\u003ctd>PRC 审核通过或 Amazon Buy Shipping 同步费率表时升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>US Prime Big Deal Days FBA 入仓\u003c/td>\n\u003ctd>下一节点为 2026-09-09 minimal shipment splits 到仓\u003c/td>\n\u003ctd>2026-09-09\u003c/td>\n\u003ctd>促销 SKU 未到仓、FC 接收异常或可售库存低于活动需求时升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EUCDM 7.0.11 清关字段\u003c/td>\n\u003ctd>仍等待货代/ERP 对低价值包裹字段执行反馈\u003c/td>\n\u003ctd>2026-09-07\u003c/td>\n\u003ctd>货代要求新增字段、IOSS/HS code/原产地模板变更时升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Amazon Ads 诉讼后续官方口径\u003c/td>\n\u003ctd>暂无 Amazon Ads 后台规则更新\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003ctd>Amazon Ads 发布计费、拍卖、报表或竞价规则说明时升级\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>7. 情报边界与可信度\u003c/h2>\n\u003cp>本次核验来源 13 个，其中官方/监管/一手来源 8 个，包括中国政府网/国务院办公厅、USPS、CPSC、Amazon Product Safety Alerts、Amazon Seller Central 帮助页、Amazon Ads、FTC/Amazon 官方回应、Drewry；非官方来源 5 个，主要用于发现 Amazon Announcement 转述、运费细节解读和行业线索。纳入日报的新增/更新共 6 条，其中正式公告或监管来源 4 条，权威行业指数 1 条，待账号后台确认 1 条。仍待确认事项：商业责任险 2026-11-02 新要求是否已进入当前卖家账号后台，以及 USPS 旺季加价是否获 PRC 最终审核并同步到 Amazon Buy Shipping。排除项：New Seller Central coming soon 仅为卖家界面讨论，未见可验证后台规则；CNBC/媒体对 FTC 广告诉讼的二次报道无新增执行事实；Amazon Prime Video/Upfront 类广告娱乐内容对 Seller Central 运营无直接动作。\u003c/p>\n\u003cp>工作日门禁来源：中国政府网《国务院办公厅关于2026年部分节假日安排的通知》（\u003ca href=\"https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-04\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-04\u003c/a> 为周五，不在 2026-09-25 至 2026-09-27 中秋节或其他法定假日范围内，按中国大陆法定工作日运行。\u003c/p>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报周报｜2026-09-04\u003c/h1>\n\u003ch2>1. 本周管理层摘要\u003c/h2>\n\u003cp>本周确认的新增与实质更新约 12 条，影响站点集中在 US、UK、DE、FR、IT、ES/NL。最高风险从单一 Listing 优化转向“合规证明 + 履约成本 + 旺季库存节点”：商业责任险新要求需要账号内确认，Pan-EU FBA 荷兰 Offer 已于 2026-09-03 生效，US Product Bundling policy 将于 2026-09-30 扩展执行，USPS 旺季包裹加价可能压缩 FBM 利润。最近截止日是 2026-09-05 完成 Pan-EU NL offer 复查和 US PBDD 入仓表更新，其次是 2026-09-08 完成商业责任险后台确认和 bundle 风险清单。\u003c/p>\n\u003ch2>2. 本周优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事件主线\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>模块\u003c/th>\n\u003cth>下周动作\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>商业责任险与 enhanced safety 类目保险要求\u003c/td>\n\u003ctd>US/多站点\u003c/td>\n\u003ctd>Compliance / Account Health\u003c/td>\n\u003ctd>查 Seller Central 原始通知、保单到期日、AIA 路径、风险 ASIN\u003c/td>\n\u003ctd>合规/财务\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>Pan-EU FBA NL active offer 生效\u003c/td>\n\u003ctd>DE/FR/IT/ES/NL\u003c/td>\n\u003ctd>FBA / Listing / VAT\u003c/td>\n\u003ctd>导出 Pan-EU SKU，核对 NL offer、价格、库存、VAT\u003c/td>\n\u003ctd>欧洲运营\u003c/td>\n\u003ctd>2026-09-05\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>US Product Bundling policy 9 月底生效\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Listing / Compliance\u003c/td>\n\u003ctd>筛查 bundle、kit、set、multipack、refill pages 结构\u003c/td>\n\u003ctd>Listing/合规\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>FTC Sponsored Ads 诉讼后的广告成本审计\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>PPC / Finance\u003c/td>\n\u003ctd>导出 30/60/90 天 CPC、CVR、ROAS、TACoS 异常表\u003c/td>\n\u003ctd>PPC/财务\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>PBDD/FBA 旺季入仓节点\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Inventory / Deals / FBA\u003c/td>\n\u003ctd>更新促销 ASIN shipment ID、split option、ETA、receiving 状态\u003c/td>\n\u003ctd>运营/供应链\u003c/td>\n\u003ctd>2026-09-09\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>USPS 旺季包裹加价\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>FBM / Profit\u003c/td>\n\u003ctd>重算 FBM、SFP、Buy Shipping SKU 毛利\u003c/td>\n\u003ctd>运营/财务\u003c/td>\n\u003ctd>2026-09-11\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>CPSC/OPSS Amazon 渠道产品安全案例\u003c/td>\n\u003ctd>US/UK\u003c/td>\n\u003ctd>Product Safety\u003c/td>\n\u003ctd>筛查儿童、玩具、感官、小零件、家具风险词 ASIN\u003c/td>\n\u003ctd>合规/产品\u003c/td>\n\u003ctd>2026-09-12\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Drewry WCI 与旺季海运成本\u003c/td>\n\u003ctd>US/EU/UK\u003c/td>\n\u003ctd>Supply Chain\u003c/td>\n\u003ctd>更新 landed cost、ETA、库存覆盖天数模型\u003c/td>\n\u003ctd>供应链\u003c/td>\n\u003ctd>2026-09-09\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>3. 本周政策与平台变化\u003c/h2>\n\u003ch3>合规\u003c/h3>\n\u003cul>\n\u003cli>商业责任险新要求为本周最高不确定项。若 Amazon 后台确认 2026-11-02 新规，中国大陆主体和 enhanced safety 类目 ASIN 将比普通类目面临更高保险证明要求。\u003c/li>\n\u003cli>US Product Bundling policy 已进入 9 月整改窗口，2026-09-30 前需把 bundle、set、multipack、refill pages、variation 的真实包装关系核清，避免把独立组合误做变体或把非厂家套装做成不合规 bundle。\u003c/li>\n\u003cli>CPSC 与 UK OPSS 本周均出现 Amazon 渠道水珠/感官玩具或高风险产品案例；对主线相册业务不是直接下架风险，但对儿童活动套装、puzzle accessories、带小零件/磁吸/软胶材料商品是合规提醒。\u003c/li>\n\u003c/ul>\n\u003ch3>Listing\u003c/h3>\n\u003cul>\n\u003cli>Total Product Quantity 变体主题已作为 US 数据质量主线纳入观察，适合检查 refill pages、多包装、set、count、pages 这类数量表达是否统一。\u003c/li>\n\u003cli>本周未发现 Amazon 对 Title、Bullet、A+、主图、视频或 Search Terms 发布新的强制格式规则。Rufus/COSMO 仍按语义相关性长期优化，不因无官方新规而暂停基础内容质量建设。\u003c/li>\n\u003c/ul>\n\u003ch3>广告\u003c/h3>\n\u003cul>\n\u003cli>FTC 与 22 州对 Sponsored Ads 定价机制的诉讼是本周广告主线，但截至 2026-09-04 未发现 Amazon Ads 后台竞价、计费或报表口径新规。\u003c/li>\n\u003cli>团队动作应落在成本审计：用 30/60/90 天报表定位 CPC 上升超过 15%、CVR 未改善、ROAS 下降的 campaign、placement、keyword 和 ASIN。\u003c/li>\n\u003cli>Amazon Ads 本周检索未见 SP/SB/SD/DSP/AMC 新增必须调整的卖家操作规则。\u003c/li>\n\u003c/ul>\n\u003ch3>费用\u003c/h3>\n\u003cul>\n\u003cli>本周未发现 US/UK/DE/FR/IT/ES FBA fee 或 referral fee 新数值变化。\u003c/li>\n\u003cli>USPS 旺季临时加价若获批，会影响 US 自发货、备用补发、退换货补发和 Business 大单发货成本；FBA SKU 主要通过退补发和多渠道履约间接受影响。\u003c/li>\n\u003c/ul>\n\u003ch3>库存物流\u003c/h3>\n\u003cul>\n\u003cli>US PBDD/FBA Q4 入仓节点继续推进：2026-09-09 minimal shipment splits 到仓，2026-09-16 Amazon-optimized shipment splits 到仓。\u003c/li>\n\u003cli>Drewry WCI 2026-09-03 为 4,465 美元/40尺柜，单周稳定但绝对价格仍需进入 landed cost 模型。\u003c/li>\n\u003cli>EUCDM 7.0.11 清关字段仍需货代/ERP 书面确认，当前不直接改 Listing。\u003c/li>\n\u003c/ul>\n\u003ch3>促销\u003c/h3>\n\u003cul>\n\u003cli>Amazon Business Deals 本周已纳入 B2B 促销机会：适合 US/UK/DE/FR/IT/ES 中学校、办公室、活动采购需求强且毛利足够的 ASIN 小范围测试。\u003c/li>\n\u003cli>PBDD deal 提报和库存节点仍比新增促销工具更紧急；促销折扣必须与到仓和可售库存一起审核。\u003c/li>\n\u003c/ul>\n\u003ch2>4. 本周海外市场与供应链变化\u003c/h2>\n\u003cul>\n\u003cli>USPS 2026 旺季包裹临时加价计划覆盖 2026-10-04 至 2027-01-17，若获批将与 Q4 礼品季、PBDD 后续发货、退换货高峰重叠。\u003c/li>\n\u003cli>Drewry WCI 稳定说明本周没有明显单边运价信号，但跨太平洋上行仍提醒 US 旺季补货不要只看平均指数。\u003c/li>\n\u003cli>CPSC 9 月 3 日集中发布多项召回/警示，多个 Amazon 渠道商品涉及中国卖家或进口产品。对当前团队的启示是：供应商文件、测试报告、警示标签、年龄分级和实物包装一致性要能逐 ASIN 留档。\u003c/li>\n\u003c/ul>\n\u003ch2>5. 对当前业务的量化影响\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>影响判断\u003c/th>\n\u003cth>建议量化口径\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>销售\u003c/td>\n\u003ctd>本周无直接拉动销量的新平台工具，B2B Deals 可小样本测试学校/办公室/活动采购需求。\u003c/td>\n\u003ctd>选择 10-20 个毛利达标 ASIN，跟踪 B2B 订单数、Business CVR、折后贡献利润率。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>利润率\u003c/td>\n\u003ctd>USPS 旺季加价和高位海运会压缩低价、重货、远区 FBM SKU。\u003c/td>\n\u003ctd>运费占售价 &gt;18% 或毛利率低于目标 3 个点的 SKU 进入调价/改 FBA 队列。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CTR/CVR\u003c/td>\n\u003ctd>Total Product Quantity 和 bundle 合规主要影响顾客理解与退货风险，不是短期流量红利。\u003c/td>\n\u003ctd>标题/图片/A+ 对 count、pages、pack、set 的表达一致率达到 100%。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ACoS/TACoS\u003c/td>\n\u003ctd>FTC 诉讼不改变后台动作，但强化广告成本审计必要性。\u003c/td>\n\u003ctd>CPC 上升 &gt;15%、CVR 未提升且 ROAS 下降的投放对象，优先下调 bid 或 placement 加价 10%-20%。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>库存覆盖\u003c/td>\n\u003ctd>PBDD/FBA 到仓节点比新规更紧急。\u003c/td>\n\u003ctd>核心促销 SKU 可售库存覆盖活动需求 100%，缺口 SKU 有备用履约方案。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>合规风险\u003c/td>\n\u003ctd>保险、bundle、CPSC/OPSS 是本周合规组合风险。\u003c/td>\n\u003ctd>enhanced safety 命中 ASIN、bundle/multipack ASIN、儿童/玩具风险词 ASIN 均要有“命中/未命中/整改”闭环。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>6. 下周行动清单\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>动作\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>对象\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日\u003c/th>\n\u003cth>验收指标\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>验证商业责任险新要求是否进入账号后台\u003c/td>\n\u003ctd>US/多站点\u003c/td>\n\u003ctd>高风险类目 ASIN、保单、主体\u003c/td>\n\u003ctd>合规/财务\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003ctd>有原始通知截图或未收到记录；保单与主体匹配检查完成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>完成 Pan-EU NL active offer 复查\u003c/td>\n\u003ctd>DE/FR/IT/ES/NL\u003c/td>\n\u003ctd>Pan-EU FBA SKU\u003c/td>\n\u003ctd>欧洲运营\u003c/td>\n\u003ctd>2026-09-05\u003c/td>\n\u003ctd>NL offer、价格、库存、VAT 状态齐全\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>输出 bundle/multipack/refill pages 合规风险清单\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>bundle、kit、set、multipack、variation\u003c/td>\n\u003ctd>Listing/合规\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003ctd>每个 ASIN 有风险等级、证据和整改动作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>更新 PBDD 促销 ASIN 入仓表\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>PBDD/FBA 促销 SKU\u003c/td>\n\u003ctd>运营/供应链\u003c/td>\n\u003ctd>2026-09-09\u003c/td>\n\u003ctd>Shipment ID、split option、ETA、FC receiving、可售库存完整\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>完成广告成本异常审计\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>SP/SB/SD campaign、keyword、placement\u003c/td>\n\u003ctd>PPC/财务\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003ctd>Top 20 风险对象有调价动作或保留理由\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>重算 US FBM 旺季包裹成本\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>FBM/SFP/Buy Shipping SKU\u003c/td>\n\u003ctd>运营/财务\u003c/td>\n\u003ctd>2026-09-11\u003c/td>\n\u003ctd>每个风险 SKU 有改 FBA、调价或限促方案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>完成儿童/玩具/感官/小零件风险词筛查\u003c/td>\n\u003ctd>US/UK\u003c/td>\n\u003ctd>相关 ASIN\u003c/td>\n\u003ctd>合规/产品\u003c/td>\n\u003ctd>2026-09-12\u003c/td>\n\u003ctd>命中 ASIN 合规文件齐全或已标记不适用\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>7. 已关闭与继续跟踪事项\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>状态\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>依据或下次检查\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>关闭\u003c/td>\n\u003ctd>New Seller Central coming soon 社区讨论\u003c/td>\n\u003ctd>无可验证后台规则、字段、费用或合规动作。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>关闭\u003c/td>\n\u003ctd>Amazon Ads 娱乐/Prime Video 内容更新\u003c/td>\n\u003ctd>对 Seller Central、SP/SB/SD、Listing 无直接执行动作。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>继续跟踪\u003c/td>\n\u003ctd>商业责任险 2026-11-02 新要求\u003c/td>\n\u003ctd>2026-09-10 查账号后台原始通知和 Amazon 帮助页更新。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>继续跟踪\u003c/td>\n\u003ctd>USPS 旺季临时加价\u003c/td>\n\u003ctd>2026-09-18 查 PRC 审核和 Amazon Buy Shipping 是否同步。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>继续跟踪\u003c/td>\n\u003ctd>EUCDM 7.0.11\u003c/td>\n\u003ctd>2026-09-07 查货代/ERP 字段执行反馈。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>继续跟踪\u003c/td>\n\u003ctd>Amazon Ads 诉讼\u003c/td>\n\u003ctd>2026-09-08 查 Amazon Ads 官方是否发布后台口径更新。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>8. 来源与可信度统计\u003c/h2>\n\u003cp>本周用于判断的来源约 24 个；官方/监管/一手来源约 15 个，覆盖 Amazon Seller Forums/Help、Amazon Ads、Amazon 官方回应、FTC、USPS、CPSC、GOV.UK OPSS、Drewry、中国政府网/国务院办公厅等；非官方来源约 9 个，主要用于发现 Seller Central 登录墙后的公告线索、物流费率解读和行业讨论。未确认事项不进入强制后台调整：商业责任险 2026-11-02 新要求需要账号内原始通知确认，USPS 旺季加价需等待 PRC 审核，Amazon Ads 诉讼需等待官方后台口径变化。\u003c/p>\n\u003cp>生产链接：\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-04\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-09-04", "text": "### 商业责任险新要求出现 Amazon Announcement 转述，需账号内确认\n\n- 【影响等级】P1\n- 【站点】US 为主，多站点观察\n- 【发布日期】2026-09-03\n- 【生效日期】2026-11-02\n- 【信息状态】Amazon Announcement 转述，待 Seller Central 账号后台确认\n- 【来源】Sellers Ask Sellers 转述 Amazon Announcement：https://sellersasksellers.com/t/new-insurance-requirements-effective-nov-2-2026/7505；Amazon enhanced safety 类目帮助页：https://sellercentral.amazon.com/help/hub/reference/external/GUQ848NB5HZ6M6A4；Amazon 商业责任险现行要求：https://sellercentral.amazon.com.tr/seller-forums/discussions/t/4d4b6fe5-f6c1-4c65-bbe8-584326d76408\n\n**发生了什么**：第三方卖家社区转述的 Amazon Announcement 显示，2026-11-02 起商业责任险规则可能新增两点：enhanced safety listing requirements 类目即使未达到 US 站单月 10,000 美元销售额，也需维持 100 万美元/次及累计的商业责任险；中国大陆主体卖家新提交保险可能需通过 Amazon Insurance Accelerator。现行 Amazon 帮助内容仍可确认 10,000 美元触发门槛、100 万美元保额和覆盖全部在售商品等基础要求。\n\n**我们怎么看**：这对相册、补充页、portfolio binder 的直接影响通常低于儿童、化妆品、食品、锂电商品，但 school memory book、craft kit、puzzle accessories 若在后台或前台被归到儿童/玩具/套装/活动用品，可能被纳入安全增强类目。关键风险不是今天立即下架，而是 45 天补交保险证明、保单供应商不被接受、续保时无法通过 AIA 路径导致高风险类目 Listing 停用。\n\n**建议动作**：合规/财务在 2026-09-08 前登录 Seller Central，路径优先查 Performance Notifications、Account Health、Business Insurance、Product Compliance Requests；导出涉及 children、toy、craft kit、battery、cosmetic、ingestible 的 ASIN 清单。验收标准：确认本账号是否收到 Amazon 原始通知、当前保单到期日、承保主体是否匹配 legal entity、是否通过 AIA，以及 enhanced safety SKU 是否需要单独保险证明。未收到后台通知时，先标记为“待确认”，不更换保险供应商。\n\n", "title": "商业责任险新要求出现 Amazon Announcement 转述，需账号内确认", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-04\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-04\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>商业责任险新要求出现 Amazon Announcement 转述，需账号内确认\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P1\u003c/li>\n\u003cli>【站点】US 为主，多站点观察\u003c/li>\n\u003cli>【发布日期】2026-09-03\u003c/li>\n\u003cli>【生效日期】2026-11-02\u003c/li>\n\u003cli>【信息状态】Amazon Announcement 转述，待 Seller Central 账号后台确认\u003c/li>\n\u003cli>【来源】Sellers Ask Sellers 转述 Amazon Announcement：\u003ca href=\"https://sellersasksellers.com/t/new-insurance-requirements-effective-nov-2-2026/7505；Amazon\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellersasksellers.com/t/new-insurance-requirements-effective-nov-2-2026/7505；Amazon\u003c/a> enhanced safety 类目帮助页：\u003ca href=\"https://sellercentral.amazon.com/help/hub/reference/external/GUQ848NB5HZ6M6A4；Amazon\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/help/hub/reference/external/GUQ848NB5HZ6M6A4；Amazon\u003c/a> 商业责任险现行要求：\u003ca href=\"https://sellercentral.amazon.com.tr/seller-forums/discussions/t/4d4b6fe5-f6c1-4c65-bbe8-584326d76408\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com.tr/seller-forums/discussions/t/4d4b6fe5-f6c1-4c65-bbe8-584326d76408\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>发生了什么\u003c/strong>：第三方卖家社区转述的 Amazon Announcement 显示，2026-11-02 起商业责任险规则可能新增两点：enhanced safety listing requirements 类目即使未达到 US 站单月 10,000 美元销售额，也需维持 100 万美元/次及累计的商业责任险；中国大陆主体卖家新提交保险可能需通过 Amazon Insurance Accelerator。现行 Amazon 帮助内容仍可确认 10,000 美元触发门槛、100 万美元保额和覆盖全部在售商品等基础要求。\u003c/p>\n\u003cp>\u003cstrong>我们怎么看\u003c/strong>：这对相册、补充页、portfolio binder 的直接影响通常低于儿童、化妆品、食品、锂电商品，但 school memory book、craft kit、puzzle accessories 若在后台或前台被归到儿童/玩具/套装/活动用品，可能被纳入安全增强类目。关键风险不是今天立即下架，而是 45 天补交保险证明、保单供应商不被接受、续保时无法通过 AIA 路径导致高风险类目 Listing 停用。\u003c/p>\n\u003cp>\u003cstrong>建议动作\u003c/strong>：合规/财务在 2026-09-08 前登录 Seller Central，路径优先查 Performance Notifications、Account Health、Business Insurance、Product Compliance Requests；导出涉及 children、toy、craft kit、battery、cosmetic、ingestible 的 ASIN 清单。验收标准：确认本账号是否收到 Amazon 原始通知、当前保单到期日、承保主体是否匹配 legal entity、是否通过 AIA，以及 enhanced safety SKU 是否需要单独保险证明。未收到后台通知时，先标记为“待确认”，不更换保险供应商。\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-04\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-04", "text": "### USPS 提议 2026 旺季包裹临时加价，影响 US FBM 和 Buy Shipping 毛利\n\n- 【影响等级】P1\n- 【站点】US\n- 【发布日期】2026-08-25；本次首次纳入：2026-09-04\n- 【生效日期】2026-10-04 至 2027-01-17，待 PRC 审核\n- 【信息状态】政府/邮政正式公告，待 Postal Regulatory Commission 审核\n- 【来源】USPS Newsroom：https://about.usps.com/newsroom/national-releases/2026/0825-usps-announces-temporary-price-change-for-2026-holiday-shipping-season.htm；PluginHive 2026-09-03 解读：https://www.pluginhive.com/usps-holiday-shipping-in-shopify/\n\n**发生了什么**：USPS 已向 PRC 提交通知，计划在 2026-10-04 至 2027-01-17 对 Priority Mail Express、Priority Mail、USPS Ground Advantage 和 Parcel Select 等国内竞争性包裹产品实行旺季临时价格调整。公告明确其他产品不受影响，最终仍取决于 PRC 审核。\n\n**我们怎么看**：如果 US 店铺全部 FBA，直接影响有限；但 FBM、SFP、Amazon Business 大单备用自发货、退换货补发、低价配件单件发货会受到毛利挤压。相册和 refill pages 若重量集中在 0-3 lb 或 4-10 lb，单票加价金额看似小，但 Q4 大促期间会直接影响 contribution margin 和优惠力度。\n\n**建议动作**：运营/财务在 2026-09-11 前筛选近 90 天 US FBM、SFP、Buy Shipping、补发订单，字段包含 SKU、重量段、zone、承运服务、当前运费、售价、毛利率、退货/补发率。对毛利率低于目标 3 个点或运费占售价超过 18% 的 SKU，提前给出三种方案：改 FBA、提高 FBM shipping charge/价格、或限制促销折扣。PRC 审核结果在 2026-09-18 复查。\n\n", "title": "USPS 提议 2026 旺季包裹临时加价，影响 US FBM 和 Buy Shipping 毛利", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-04\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-04\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172 ostal Regulatory Commission 审核\u003c/li>\n\u003cli>【来源】USPS Newsroom：\u003ca href=\"https://about.usps.com/newsroom/national-releases/2026/0825-usps-announces-temporary-price-change-for-2026-holiday-shipping-season.htm；PluginHive\" target=\"_blank\" rel=\"noopener noreferrer\">https://about.usps.com/newsroom/national-releases/2026/0825-usps-announces-temporary-price-change-for-2026-holiday-shipping-season.htm；PluginHive\u003c/a> 2026-09-03 解读：\u003ca href=\"https://www.pluginhive.com/usps-holiday-shipping-in-shopify/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.pluginhive.com/usps-holiday-shipping-in-shopify/\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>发生了什么\u003c/strong>：USPS 已向 PRC 提交通知，计划在 2026-10-04 至 2027-01-17 对 Priority Mail Express、Priority Mail、USPS Ground Advantage 和 Parcel Select 等国内竞争性包裹产品实行旺季临时价格调整。公告明确其他产品不受影响，最终仍取决于 PRC 审核。\u003c/p>\n\u003cp>\u003cstrong>我们怎么看\u003c/strong>：如果 US 店铺全部 FBA，直接影响有限；但 FBM、SFP、Amazon Business 大单备用自发货、退换货补发、低价配件单件发货会受到毛利挤压。相册和 refill pages 若重量集中在 0-3 lb 或 4-10 lb，单票加价金额看似小，但 Q4 大促期间会直接影响 contribution margin 和优惠力度。\u003c/p>\n\u003cp>\u003cstrong>建议动作\u003c/strong>：运营/财务在 2026-09-11 前筛选近 90 天 US FBM、SFP、Buy Shipping、补发订单，字段包含 SKU、重量段、zone、承运服务、当前运费、售价、毛利率、退货/补发率。对毛利率低于目标 3 个点或运费占售价超过 18% 的 SKU，提前给出三种方案：改 FBA、提高 FBM shipping charge/价格、或限制促销折扣。PRC 审核结果在 2026-09-18 复查。\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-04\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-04", "text": "### CPSC 9 月 3 日新增多起 Amazon 渠道产品安全召回\n\n- 【影响等级】P2\n- 【站点】US\n- 【发布日期】2026-09-03\n- 【生效日期】2026-09-03\n- 【信息状态】正式监管召回\n- 【来源】CPSC GIHNJSI 水珠玩具召回：https://www.cpsc.gov/Recalls/2026/GIHNJSI-Squeezy-Dumplings-Toys-Recalled-Due-to-Serious-Ingestion-Choking-and-Obstruction-Hazards-Sold-on-Amazon-by-Chenyuanhui；CPSC Loyoda 床护栏召回：https://www.cpsc.gov/Recalls/2026/Adult-Portable-Bed-Rails-Recalled-Due-to-Risk-of-Serious-Injury-or-Death-from-Entrapment-and-Asphyxiation-Violate-Mandatory-Standard-for-Adult-Portable-Bed-Rails-Sold-on-Amazon-by-Loyoda-Direct-and-Loyoda；Amazon Product Safety Alerts：https://www.amazon.com/product-safety-alerts\n\n**发生了什么**：CPSC 2026-09-03 发布多起与 Amazon 销售渠道相关的召回或安全警示，包括约 8,000 件 GIHNJSI Squeezy Dumplings 水珠玩具，以及约 2,200 件 Loyoda 成人便携床护栏。主要风险涉及水珠误食、窒息/肠梗阻、床护栏夹陷/窒息、跌落、标签缺失等强制标准问题。\n\n**我们怎么看**：这不是相册主线类目的直接规则变化，但与 2026-09-03 已记录的 UK 水珠/感官玩具案例形成同一条产品安全信号：Amazon 渠道上儿童、玩具、感官、家具/支撑结构商品正在被监管集中点名。若 puzzle accessories 含磁吸、小零件、水珠、软胶、儿童玩具定位，或 school memory book 被包装成儿童活动套装，需要从“是否能卖”提升到“测试报告、标签、年龄分级、材料证明是否能逐 ASIN 对应”。\n\n**建议动作**：合规/Listing 在 2026-09-12 前筛查 US 店铺标题、五点、A+、Search Terms、Item Type Keyword 中包含 kids、toy、sensory、beads、magnetic、small parts、bed rail、dresser、furniture、activity kit 的 ASIN。验收标准：命中 ASIN 有 CPSC/CPC、ASTM F963、警示标签、年龄分级、供应商测试报告或“不适用”说明；未命中则仅观察，暂不调整 Listing。\n\n", "title": "CPSC 9 月 3 日新增多起 Amazon 渠道产品安全召回", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-04\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-04\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; 马逊及海外市场情报增量日报｜2026-09-03\n\n## 今日判断\n\n今日没有新的 Amazon 强制 Listing、图片、A+ 或 FBA 费用规则，运营侧不需要临时大范围改后台。最高优先级是欧洲 Pan-EU FBA：2026-09-03 起新老 Pan-EU FBA 商品需要 Netherlands active offer，今天应完成 SKU 级核对。US Q4 仍按既有入仓日历推进，PBDD AWD 到仓节点已过，下一紧急节点是 2026-09-09 FBA minimal shipment splits 到仓。UK OPSS 新增一个 Amazon 上架感官玩具因合规文件与 VOC 风险被边境拒收并下架的案例，对相册主线业务只做定向合规观察。今天不是本周最后一个中国大陆法定工作日，不生成周报。\n\n## 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n| --- | --- | --- | --- | --- | --- |\n| P1 | Pan-EU FBA 荷兰 Offer 要求今日生效 | DE/FR/IT/ES/NL | FBA / Listing / VAT | 2026-09-03 | 今天核对 Pan-EU SKU 是否有 NL active offer |\n| P1 | US PBDD FBA minimal shipment splits 到仓 | US | Inventory / Deals / FBA | 2026-09-09 | 3 天内确认促销 ASIN 入仓进度 |\n| P2 | UK Amazon 玩具类产品安全下架案例 | UK | Compliance / Listing | 2026-09-02 | 仅对儿童/玩具/感官类 SKU 做定向自查 |\n\n## 今日新情报\n\n### UK OPSS 发布 Amazon 感官玩具产品安全报告\n\n- 【影响等级】P2\n- 【站点】UK\n- 【发布日期】2026-09-02\n- 【生效日期】2026-09-02\n- 【信息状态】正式监管报告\n- 【来源】GOV.UK OPSS：https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-pipihome-rainbow-mystery-squishy-bun-sold-via-amazon-2609-0002\n\n**发生了什么**：UK OPSS 对一款通过 Amazon 销售的 Pipihome Rainbow Mystery Squishy Bun 发布高风险产品安全报告，原因包括 Declaration of Conformity 与产品不匹配、技术文件不足、缺少必要标签/标识，并检出 VOCs。监管措施为边境拒收，Amazon listing 已被移除。\n\n**我们怎么看**：这不是相册、活页补充页或 portfolio binder 的直接规则变化，但对 UK 儿童、玩具、感官、软胶、带香味或可接触材料商品有提醒意义。若 puzzle accessories 或学校记忆册被包装成儿童礼品或活动套装，合规文件、标签和材料证明要能对应到具体 ASIN。\n\n**建议动作**：合规/产品团队在 2026-09-10 前筛选 UK 店铺中标题、五点、A+ 含 toy、kids、sensory、squishy、school activity、craft kit 的 SKU；对适用 SKU 归档 UKCA、DoC、测试报告、BOM 和标签图。无儿童/玩具属性商品则记录“不适用”，暂不调整 Listing。\n\n## 已有事件的重要更新\n\n### Pan-EU FBA 荷兰 active offer 要求到达生效日\n\n- 历史事件：amazon-pan-eu-fba-nl-be-offer-2026\n- 上次状态：2026-09-01 已列为持续关注，提示 2026-09-03 Netherlands active offer 要求即将生效。\n- 本次新增变化：2026-09-03 生效日已经到达。Amazon 帮助页与卖家论坛均显示：新老 Pan-EU FBA 商品需要 Netherlands active offer 才能 enrollment 并继续获得 Pan-EU FBA 权益；Belgium active offer 要求计划 2027-02-26 起在 enrollment 环节适用。\n- 变化原因：Amazon 扩展 Pan-EU 覆盖要求，推动荷兰与比利时站点的跨境选品可售性。\n- 行动是否需要调整：升级为 P1 当日核查。欧洲运营今天从 Pan-EU SKU 清单中筛出无 NL active offer、价格异常、库存不可售或 VAT 配置未确认的 ASIN。若没有 Pan-EU FBA 项目，记录“不适用”后关闭。\n- 来源：https://sellercentral.amazon.ie/help/hub/reference/external/G201855460；https://sellercentral.amazon.co.uk/seller-forums/discussions/t/61296686-3581-4d1a-b3c2-dacbef755b22\n\n### US Q4 入仓主线从 AWD 截止切换到 FBA minimal splits\n\n- 历史事件：amz-q4-peak-holiday-2026-deadlines\n- 上次状态：2026-09-02 已按 P0 提醒 Prime Big Deal Days AWD 到仓截止。\n- 本次新增变化：AWD 到仓日已过去，下一运营节点切换为 2026-09-09 FBA shipments with minimal shipment splits；2026-09-16 为 Amazon-optimized shipment splits 到仓节点。\n- 变化原因：Prime Big Deal Days 前的不同入仓方式截止日逐步到达，逾期会影响 Prime-badge eligibility 和活动期可售库存。\n- 行动是否需要调整：从 P0 降为 P1 持续跟踪。供应链在 2026-09-05 前更新促销 ASIN 入仓表，字段包含 Shipment ID、split option、预计到仓日、FC receiving 状态、可售库存、活动需求量和备选履约方案。\n- 来源：https://sellercentral.amazon.com/seller-forums/discussions/t/3e31fbb7-04e0-4ed4-873e-f74b1052e2ff\n\n## 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n| --- | --- | --- | --- | --- | --- | --- |\n| P1 | 导出 Pan-EU FBA SKU 清单，筛选缺少 Netherlands active offer 的 ASIN/SKU | DE/FR/IT/ES/NL | 欧洲运营 | 2026-09-03 | 所有 Pan-EU SKU 有 NL offer 状态、价格、库存和 VAT 风险备注 | 2026-09-04 |\n| P1 | 复核 US Prime Big Deal Days 促销 ASIN 的 FBA minimal shipment splits 到仓计划 | US | 运营/供应链 | 2026-09-05 | 每个促销 ASIN 有预计到仓日、接收状态和缺货替代方案 | 2026-09-09 |\n| P2 | 核对 UK 是否有儿童、玩具、感官、软胶或带气味材料类商品，并归档 UKCA/DoC/测试报告 | UK | 合规/产品 | 2026-09-10 | 适用 SKU 有合规文件清单；无适用 SKU 则记录不适用 | 2026-09-17 |\n\n## 持续关注\n\n| 事项 | 当前状态 | 下次复查日期 | 触发升级条件 |\n| --- | --- | --- | --- |\n| US Prime Big Deal Days deal 提报窗口 | Deal submission 仍在窗口内，PBDD 截止日为 2026-09-08 | 2026-09-08 | 核心促销 ASIN 未完成提报或库存未确认时升级 |\n| US Prime Big Deal Days FBA 入仓 | AWD 到仓日已过，下一节点为 minimal shipment splits | 2026-09-09 | 促销 SKU 未到仓、FC 接收异常或可售库存低于活动需求时升级 |\n| Amazon Ads 诉讼后续官方口径 | 监管诉讼已提交，Amazon Ads 后台规则暂无新增变化 | 2026-09-05 | Amazon Ads 发布计费、拍卖或报表口径新说明时升级 |\n\n## 情报边界与可信度\n\n本次重点核验 Amazon Seller Central/Help、Amazon Ads、Amazon 官方新闻、GOV.UK OPSS、Freightos、美国/欧盟监管与贸易来源。纳入日报的新增/更新共 3 条，其中 Amazon 官方来源 2 条、政府监管来源 1 条；未确认事项 0 条。排除项：Amazon meltable inventory 提醒与当前相册/补充页/学校记忆册业务不直接相关；First Day Ready 属品牌广告活动，无卖家后台规则变化；FTC 广告诉讼的二次解读无新增官方事实。\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-03\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-03\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报增量日报｜2026-09-03\u003c/h1>\n\u003ch2>今日判断\u003c/h2>\n\u003cp>今日没有新的 Amazon 强制 Listing、图片、A+ 或 FBA 费用规则，运营侧不需要临时大范围改后台。最高优先级是欧洲 Pan-EU FBA：2026-09-03 起新老 Pan-EU FBA 商品需要 Netherlands active offer，今天应完成 SKU 级核对。US Q4 仍按既有入仓日历推进，PBDD AWD 到仓节点已过，下一紧急节点是 2026-09-09 FBA minimal shipment splits 到仓。UK OPSS 新增一个 Amazon 上架感官玩具因合规文件与 VOC 风险被边境拒收并下架的案例，对相册主线业务只做定向合规观察。今天不是本周最后一个中国大陆法定工作日，不生成周报。\u003c/p>\n\u003ch2>优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>影响站点\u003c/th>\n\u003cth>影响模块\u003c/th>\n\u003cth>截止/生效日期\u003c/th>\n\u003cth>今天是否需要动作\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>Pan-EU FBA 荷兰 Offer 要求今日生效\u003c/td>\n\u003ctd>DE/FR/IT/ES/NL\u003c/td>\n\u003ctd>FBA / Listing / VAT\u003c/td>\n\u003ctd>2026-09-03\u003c/td>\n\u003ctd>今天核对 Pan-EU SKU 是否有 NL active offer\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>US PBDD FBA minimal shipment splits 到仓\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Inventory / Deals / FBA\u003c/td>\n\u003ctd>2026-09-09\u003c/td>\n\u003ctd>3 天内确认促销 ASIN 入仓进度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>UK Amazon 玩具类产品安全下架案例\u003c/td>\n\u003ctd>UK\u003c/td>\n\u003ctd>Compliance / Listing\u003c/td>\n\u003ctd>2026-09-02\u003c/td>\n\u003ctd>仅对儿童/玩具/感官类 SKU 做定向自查\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>今日新情报\u003c/h2>\n\u003ch3>UK OPSS 发布 Amazon 感官玩具产品安全报告\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】UK\u003c/li>\n\u003cli>【发布日期】2026-09-02\u003c/li>\n\u003cli>【生效日期】2026-09-02\u003c/li>\n\u003cli>【信息状态】正式监管报告\u003c/li>\n\u003cli>【来源】GOV.UK OPSS：\u003ca href=\"https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-pipihome-rainbow-mystery-squishy-bun-sold-via-amazon-2609-0002\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-pipihome-rainbow-mystery-squishy-bun-sold-via-amazon-2609-0002\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>发生了什么\u003c/strong>：UK OPSS 对一款通过 Amazon 销售的 Pipihome Rainbow Mystery Squishy Bun 发布高风险产品安全报告，原因包括 Declaration of Conformity 与产品不匹配、技术文件不足、缺少必要标签/标识，并检出 VOCs。监管措施为边境拒收，Amazon listing 已被移除。\u003c/p>\n\u003cp>\u003cstrong>我们怎么看\u003c/strong>：这不是相册、活页补充页或 portfolio binder 的直接规则变化，但对 UK 儿童、玩具、感官、软胶、带香味或可接触材料商品有提醒意义。若 puzzle accessories 或学校记忆册被包装成儿童礼品或活动套装，合规文件、标签和材料证明要能对应到具体 ASIN。\u003c/p>\n\u003cp>\u003cstrong>建议动作\u003c/strong>：合规/产品团队在 2026-09-10 前筛选 UK 店铺中标题、五点、A+ 含 toy、kids、sensory、squishy、school activity、craft kit 的 SKU；对适用 SKU 归档 UKCA、DoC、测试报告、BOM 和标签图。无儿童/玩具属性商品则记录“不适用”，暂不调整 Listing。\u003c/p>\n\u003ch2>已有事件的重要更新\u003c/h2>\n\u003ch3>Pan-EU FBA 荷兰 active offer 要求到达生效日\u003c/h3>\n\u003cul>\n\u003cli>历史事件：amazon-pan-eu-fba-nl-be-offer-2026\u003c/li>\n\u003cli>上次状态：2026-09-01 已列为持续关注，提示 2026-09-03 Netherlands active offer 要求即将生效。\u003c/li>\n\u003cli>本次新增变化：2026-09-03 生效日已经到达。Amazon 帮助页与卖家论坛均显示：新老 Pan-EU FBA 商品需要 Netherlands active offer 才能 enrollment 并继续获得 Pan-EU FBA 权益；Belgium active offer 要求计划 2027-02-26 起在 enrollment 环节适用。\u003c/li>\n\u003cli>变化原因：Amazon 扩展 Pan-EU 覆盖要求，推动荷兰与比利时站点的跨境选品可售性。\u003c/li>\n\u003cli>行动是否需要调整：升级为 P1 当日核查。欧洲运营今天从 Pan-EU SKU 清单中筛出无 NL active offer、价格异常、库存不可售或 VAT 配置未确认的 ASIN。若没有 Pan-EU FBA 项目，记录“不适用”后关闭。\u003c/li>\n\u003cli>来源：\u003ca href=\"https://sellercentral.amazon.ie/help/hub/reference/external/G201855460；https://sellercentral.amazon.co.uk/seller-forums/discussions/t/61296686-3581-4d1a-b3c2-dacbef755b22\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.ie/help/hub/reference/external/G201855460；https://sellercentral.amazon.co.uk/seller-forums/discussions/t/61296686-3581-4d1a-b3c2-dacbef755b22\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch3>US Q4 入仓主线从 AWD 截止切换到 FBA minimal splits\u003c/h3>\n\u003cul>\n\u003cli>历史事件：amz-q4-peak-holiday-2026-deadlines\u003c/li>\n\u003cli>上次状态：2026-09-02 已按 P0 提醒 Prime Big Deal Days AWD 到仓截止。\u003c/li>\n\u003cli>本次新增变化：AWD 到仓日已过去，下一运营节点切换为 2026-09-09 FBA shipments with minimal shipment splits；2026-09-16 为 Amazon-optimized shipment splits 到仓节点。\u003c/li>\n\u003cli>变化原因：Prime Big Deal Days 前的不同入仓方式截止日逐步到达，逾期会影响 Prime-badge eligibility 和活动期可售库存。\u003c/li>\n\u003cli>行动是否需要调整：从 P0 降为 P1 持续跟踪。供应链在 2026-09-05 前更新促销 ASIN 入仓表，字段包含 Shipment ID、split option、预计到仓日、FC receiving 状态、可售库存、活动需求量和备选履约方案。\u003c/li>\n\u003cli>来源：\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/3e31fbb7-04e0-4ed4-873e-f74b1052e2ff\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/seller-forums/discussions/t/3e31fbb7-04e0-4ed4-873e-f74b1052e2ff\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>导出 Pan-EU FBA SKU 清单，筛选缺少 Netherlands active offer 的 ASIN/SKU\u003c/td>\n\u003ctd>DE/FR/IT/ES/NL\u003c/td>\n\u003ctd>欧洲运营\u003c/td>\n\u003ctd>2026-09-03\u003c/td>\n\u003ctd>所有 Pan-EU SKU 有 NL offer 状态、价格、库存和 VAT 风险备注\u003c/td>\n\u003ctd>2026-09-04\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>复核 US Prime Big Deal Days 促销 ASIN 的 FBA minimal shipment splits 到仓计划\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>运营/供应链\u003c/td>\n\u003ctd>2026-09-05\u003c/td>\n\u003ctd>每个促销 ASIN 有预计到仓日、接收状态和缺货替代方案\u003c/td>\n\u003ctd>2026-09-09\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>核对 UK 是否有儿童、玩具、感官、软胶或带气味材料类商品，并归档 UKCA/DoC/测试报告\u003c/td>\n\u003ctd>UK\u003c/td>\n\u003ctd>合规/产品\u003c/td>\n\u003ctd>2026-09-10\u003c/td>\n\u003ctd>适用 SKU 有合规文件清单；无适用 SKU 则记录不适用\u003c/td>\n\u003ctd>2026-09-17\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>持续关注\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>事项\u003c/th>\n\u003cth>当前状态\u003c/th>\n\u003cth>下次复查日期\u003c/th>\n\u003cth>触发升级条件\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>US Prime Big Deal Days deal 提报窗口\u003c/td>\n\u003ctd>Deal submission 仍在窗口内，PBDD 截止日为 2026-09-08\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003ctd>核心促销 ASIN 未完成提报或库存未确认时升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>US Prime Big Deal Days FBA 入仓\u003c/td>\n\u003ctd>AWD 到仓日已过，下一节点为 minimal shipment splits\u003c/td>\n\u003ctd>2026-09-09\u003c/td>\n\u003ctd>促销 SKU 未到仓、FC 接收异常或可售库存低于活动需求时升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Amazon Ads 诉讼后续官方口径\u003c/td>\n\u003ctd>监管诉讼已提交，Amazon Ads 后台规则暂无新增变化\u003c/td>\n\u003ctd>2026-09-05\u003c/td>\n\u003ctd>Amazon Ads 发布计费、拍卖或报表口径新说明时升级\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>情报边界与可信度\u003c/h2>\n\u003cp>本次重点核验 Amazon Seller Central/Help、Amazon Ads、Amazon 官方新闻、GOV.UK OPSS、Freightos、美国/欧盟监管与贸易来源。纳入日报的新增/更新共 3 条，其中 Amazon 官方来源 2 条、政府监管来源 1 条；未确认事项 0 条。排除项：Amazon meltable inventory 提醒与当前相册/补充页/学校记忆册业务不直接相关；First Day Ready 属品牌广告活动，无卖家后台规则变化；FTC 广告诉讼的二次解读无新增官方事实。\u003c/p>\n\u003cp>生产链接：\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-03\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-09-03", "text": "### UK OPSS 发布 Amazon 感官玩具产品安全报告\n\n- 【影响等级】P2\n- 【站点】UK\n- 【发布日期】2026-09-02\n- 【生效日期】2026-09-02\n- 【信息状态】正式监管报告\n DoC、测试报告、BOM 和标签图。无儿童/玩具属性商品则记录“不适用”，暂不调整 Listing。\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-03\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-03", "text": "### Pan-EU FBA 荷兰 active offer 要求到达生效日\n\n- 历史事件：amazon-pan-eu-fba-nl-be-offer-2026\n- 上次状态：2026-09-01 已列为持续关注，提示 2026-09-03 Netherlands active offer 要求即将生效。\n- 本次新增变化：2026-09-03 生效日已经到达。Amazon 帮助页与卖家论坛均显示：新老 Pan-EU FBA 商品需要 Netherlands active offer 才能 enrollment 并继续获得 Pan-EU FBA 权益；Belgium active offer 要求计划 2027-02-26 起在 enrollment 环节适用。\n- 变化原因：Amazon 扩展 Pan-EU 覆盖要求，推动荷兰与比利时站点的跨境选品可售性。\n- 行动是否需要调整：升级为 P1 当日核查。欧洲运营今天从 Pan-EU SKU 清单中筛出无 NL active offer、价格异常、库存不可售或 VAT 配置未确认的 ASIN。若没有 Pan-EU FBA 项目，记录“不适用”后关闭。\n- 来源：https://sellercentral.amazon.ie/help/hub/reference/external/G201855460；https://sellercentral.amazon.co.uk/seller-forums/discussions/t/61296686-3581-4d1a-b3c2-dacbef755b22\n\n", "title": "Pan-EU FBA 荷兰 active offer 要求到达生效日", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-03\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-03\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-siz
