l Product Quantity variation theme](https://sellercentral.amazon.com/seller-forums/discussions/t/dcea0ef0-ce36-4503-b579-dfc8a369c8d8)\n\n", "title": "3. Total Product Quantity 变体主题标准化件数表达", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-01\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-01\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>3. Total Product Quantity 变体主题标准化件数表达\u003c/h3>\n\u003cp>\u003cstrong>覆盖站点\u003c/strong>：US（官方确认） \u003cstrong>影响等级\u003c/strong>：P1 \u003cstrong>信息状态\u003c/strong>：Amazon Seller Forums 官方公告 \u003cstrong>发布日期\u003c/strong>：2026-08-29 \u003cstrong>当前状态\u003c/strong>：已开放，现阶段为可选结构\u003c/p>\n\u003cp>\u003cstrong>发生了什么（事实）\u003c/strong> Amazon 新增 Total Product Quantity 变体主题，用 “X count” 或 “X count（Y packs of Z）” 统一显示商品总件数，并把 Unit Count 与 Number of Packs 从尺寸、颜色等属性中分离。公告称当前覆盖 193 个 Product Type，主要为 Hardlines 类目，并计划在 2026 年稍后扩展到其他类目。\u003c/p>\n\u003cp>\u003cstrong>我们怎么看（经营解读）\u003c/strong> 这对 refill pages、多件装、组合页数、pack 数量等商品表达很有价值。它可能减少顾客对“总页数、包装数、单包数量”的理解偏差，从而改善转化和退货风险。但目前没有证据证明采用该主题会直接提升 ranking；执行前要确认 Product Type 是否适用，避免为了合并变体而改变真实包装含义。\u003c/p>\n\u003cp>\u003cstrong>建议动作\u003c/strong> 2026-09-08 前筛查标题或变体含 \u003ccode>pack\u003c/code>、\u003ccode>count\u003c/code>、\u003ccode>pages\u003c/code>、\u003ccode>refill\u003c/code>、\u003ccode>set\u003c/code>、\u003ccode>bundle\u003c/code> 的 US ASIN。优先处理补充页、多包装相册配件和拼图配件：检查 Unit Count、Number of Packs、标题、图片、A+ 和包装实物是否一致。\u003c/p>\n\u003cp>\u003cstrong>来源\u003c/strong> \u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/dcea0ef0-ce36-4503-b579-dfc8a369c8d8\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon US Seller Forums - Total Product Quantity variation theme\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-01\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-01", "text": "### 4. FTC 起诉 Amazon Sponsored Ads 拍卖定价，短期先做广告成本审计\n\n**覆盖站点**：US 为主  \n**影响等级**：P1，高关注但非后台规则变更  \n**信息状态**：FTC 官方诉讼公告 + Amazon 官方回应；事实争议需等待法院进展  \n**发布日期**：2026-08-31  \n**生效日期**：诉讼已提交，无 Seller Central 操作要求\n\n**发生了什么（事实）**  \nFTC 与 22 个州在 2026-08-31 起诉 Amazon，指控其 Sponsored Ads 拍卖存在未充分披露的广告价格上调机制。Amazon 同日回应称 FTC 误解广告拍卖机制，并称广告主不会支付超过自身出价。\n\n**我们怎么看（经营解读）**  \n这件事短期不会直接改变 Sponsored Products、Sponsored Brands 或 Sponsored Display 的后台设置，但会提升广告成本审计的重要性。对运营团队来说，关键不是判断诉讼输赢，而是检查 Q4 前是否存在 CPC 上涨、CVR 不变或下降、ROAS 下降、TACoS 上升的投放对象。\n\n**建议动作**  \n2026-09-03 前导出 US 近 30/60/90 天 campaign、ad group、keyword、placement 报表。对 CPC 上升超过 15%、CVR 未提升、ROAS 下降的对象，优先降低 bid 或 placement 加价 10%-20%；自然排名贡献高的核心词保留测试预算。\n\n**来源**  \n[FTC 新闻稿](https://www.ftc.gov/news-events/news/press-releases/2026/08/ftc-states-sue-amazon-over-secret-ad-surcharge-scheme)；[FTC 起诉书 PDF](https://www.ftc.gov/system/files/ftc_gov/pdf/AmazonAds-Complaint.pdf)；[Amazon 官方回应](https://www.aboutamazon.com/company-news/amazon-ftc-sponsored-ads-lawsuit-response)\n\n", "title": "4. FTC 起诉 Amazon Sponsored Ads 拍卖定价，短期先做广告成本审计", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-01\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-01\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>4. FTC 起诉 Amazon Sponsored Ads 拍卖定价，短期先做广告成本审计\u003c/h3>\n\u003cp>\u003cstrong>覆盖站点\u003c/strong>：US 为主 \u003cstrong>影响等级\u003c/strong>：P1，高关注但非后台规则变更 \u003cstrong>信息状态\u003c/strong>：FTC 官方诉讼公告 + Amazon 官方回应；事实争议需等待法院进展 \u003cstrong>发布日期\u003c/strong>：2026-08-31 \u003cstrong>生效日期\u003c/strong>：诉讼已提交，无 Seller Central 操作要求\u003c/p>\n\u003cp>\u003cstrong>发生了什么（事实）\u003c/strong> FTC 与 22 个州在 2026-08-31 起诉 Amazon，指控其 Sponsored Ads 拍卖存在未充分披露的广告价格上调机制。Amazon 同日回应称 FTC 误解广告拍卖机制，并称广告主不会支付超过自身出价。\u003c/p>\n\u003cp>\u003cstrong>我们怎么看（经营解读）\u003c/strong> 这件事短期不会直接改变 Sponsored Products、Sponsored Brands 或 Sponsored Display 的后台设置，但会提升广告成本审计的重要性。对运营团队来说，关键不是判断诉讼输赢，而是检查 Q4 前是否存在 CPC 上涨、CVR 不变或下降、ROAS 下降、TACoS 上升的投放对象。\u003c/p>\n\u003cp>\u003cstrong>建议动作\u003c/strong> 2026-09-03 前导出 US 近 30/60/90 天 campaign、ad group、keyword、placement 报表。对 CPC 上升超过 15%、CVR 未提升、ROAS 下降的对象，优先降低 bid 或 placement 加价 10%-20%；自然排名贡献高的核心词保留测试预算。\u003c/p>\n\u003cp>\u003cstrong>来源\u003c/strong> \u003ca href=\"https://www.ftc.gov/news-events/news/press-releases/2026/08/ftc-states-sue-amazon-over-secret-ad-surcharge-scheme\" target=\"_blank\" rel=\"noopener noreferrer\">FTC 新闻稿\u003c/a>；\u003ca href=\"https://www.ftc.gov/system/files/ftc_gov/pdf/AmazonAds-Complaint.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">FTC 起诉书 PDF\u003c/a>；\u003ca href=\"https://www.aboutamazon.com/company-news/amazon-ftc-sponsored-ads-lawsuit-response\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon 官方回应\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-01\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-01", "text": "### UK/DE FBM Automated Handling Time 与 BHDR 今日进入执行窗口\n\n**上次状态**：已在 2026-08-31 作为持续关注事项记录。  \n**本次新增变化**：2026-09-01 是 UK/DE 相关 FBM Automated Handling Time 执行窗口日。Business Hour Delivery Rate 90% 要求将在 2026-09-30 生效，2026-10-30 后仍不达标的相关 Business 客户 offer 可能被停用。  \n**行动调整**：如果 UK/DE 全部为 FBA，可后台确认后关闭；如果存在 FBM、SFP 或 Amazon Business 订单，今天必须查 SKU 级 handling time、OTDR、BHDR、Buy Shipping、SSA 与 AHT 设置。  \n**来源**：[Amazon UK Seller Forums](https://sellercentral.amazon.co.uk/seller-forums/discussions/t/20198e40-521c-4a27-b682-3f088fa0a7dc)；[Amazon DE Seller Forums](https://sellercentral.amazon.de/seller-forums/discussions/t/df8547c7-5e56-4ad5-ae84-4b30834c932f)\n\n", "title": "UK/DE FBM Automated Handling Time 与 BHDR 今日进入执行窗口", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-01\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-01\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>UK/DE FBM Automated Handling Time 与 BHDR 今日进入执行窗口\u003c/h3>\n\u003cp>\u003cstrong>上次状态\u003c/strong>：已在 2026-08-31 作为持续关注事项记录。 \u003cstrong>本次新增变化\u003c/strong>：2026-09-01 是 UK/DE 相关 FBM Automated Handling Time 执行窗口日。Business Hour Delivery Rate 90% 要求将在 2026-09-30 生效，2026-10-30 后仍不达标的相关 Business 客户 offer 可能被停用。 \u003cstrong>行动调整\u003c/strong>：如果 UK/DE 全部为 FBA，可后台确认后关闭；如果存在 FBM、SFP 或 Amazon Business 订单，今天必须查 SKU 级 handling time、OTDR、BHDR、Buy Shipping、SSA 与 AHT 设置。 \u003cstrong>来源\u003c/strong>：\u003ca href=\"https://sellercentral.amazon.co.uk/seller-forums/discussions/t/20198e40-521c-4a27-b682-3f088fa0a7dc\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon UK Seller Forums\u003c/a>；\u003ca href=\"https://sellercentral.amazon.de/seller-forums/discussions/t/df8547c7-5e56-4ad5-ae84-4b30834c932f\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon DE Seller Forums\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-01\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-01", "text": "### US Product Bundling policy 进入 9 月合规排查期\n\n**上次状态**：2026-09-01 首次纳入长期索引。  \n**本次新增变化**：Seller Central 政策页显示 2026-09-30 起 Product Bundling policy 要求扩展到多数类目。  \n**行动调整**：将 bundle、kit、set、multipack 与 variation 分开判断；重点排查自行组合、独立 UPC、跨品牌组合、包装图片与实物不一致的 ASIN。  \n**来源**：[Amazon Changes to program policies](https://sellercentral.amazon.com/help/hub/reference/external/GQHQGBTD7XB7EECN)；[Amazon Product bundling policy](https://sellercentral.amazon.com/help/hub/reference/external/G200442350)\n\n", "title": "US Product Bundling policy 进入 9 月合规排查期", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-01\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-01\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>US Product Bundling policy 进入 9 月合规排查期\u003c/h3>\n\u003cp>\u003cstrong>上次状态\u003c/strong>：2026-09-01 首次纳入长期索引。 \u003cstrong>本次新增变化\u003c/strong>：Seller Central 政策页显示 2026-09-30 起 Product Bundling policy 要求扩展到多数类目。 \u003cstrong>行动调整\u003c/strong>：将 bundle、kit、set、multipack 与 variation 分开判断；重点排查自行组合、独立 UPC、跨品牌组合、包装图片与实物不一致的 ASIN。 \u003cstrong>来源\u003c/strong>：\u003ca href=\"https://sellercentral.amazon.com/help/hub/reference/external/GQHQGBTD7XB7EECN\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Changes to program policies\u003c/a>；\u003ca href=\"https://sellercentral.amazon.com/help/hub/reference/external/G200442350\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Product bundling policy\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-01\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}]}, {"date": "2026-08-28", "text": "# 《亚马逊及海外市场情报增量日报｜2026-08-28》\n\n## 今日结论\n\n过去 24 小时未发现 Amazon Seller Central 面向 US/UK/DE/FR/IT/ES 卖家的重大强制新规，但有 1 项 Amazon Ads 官方技术更新、2 项政府/监管侧新增变化需要进入运营观察。最高优先级是排查 CPSC 2026-08-27 召回中是否存在供应商、类目或相似风险商品，尤其是儿童、家居电器、玩具、厨房设备和带电产品。EUCDM 7.0.11 属于欧盟海关数据结构更新，当前主要影响清关数据、IOSS/低价值包裹申报和 ERP/货代字段映射，不建议立刻修改 Listing。今天也是本周最后一个中国大陆法定工作日，需要追加周度合并报告。\n\n## 新增事件\n\n| 影响等级 | 站点 | 发布日期 | 生效日期 | 信息状态 | 来源 | 核心变化 | 影响对象 | 运营影响 |\n|---|---|---:|---:|---|---|---|---|---|\n| P1 | US/UK/EU，DSP 广告账户 | 2026-08-27 | 2026-08-27 | Amazon 官方发布 | Amazon Ads API Release Notes / DSP Bulk operations entities | DSP bulk operations 新增只读字段 `Creative Association Status`，用于识别 creative 与 line item 的关联状态。 | 使用 DSP bulk sheet/API 做广告素材、line item 批量管理的广告/投放团队。 | 广告：批量上传前可用该字段检查素材关联失败或未生效状态，降低素材上线失败、展示断档和预算浪费；对 SP/SB/SD 常规投放无直接影响。 |\n| P1 | US | 2026-08-27 | 立即执行召回 | 美国 CPSC 官方召回 | CPSC Recalls 2026-08-27 | CPSC 当日发布多项召回，其中包括 Amazon 销售渠道商品，如 Cuisinart Portable Butane Stoves、若干童装/玩具/家居电器类商品。 | US 站销售或采购儿童用品、厨房设备、带电产品、压力清洗机、玩具或相似风险商品的团队。 | 合规/销售：需按供应商和关键词筛查是否存在相同品牌、同款、同供应商或相似高风险结构；若命中，立即停售、留存测试文件并联系供应商。相册/手工类若不含儿童玩具、电池、磁吸、小零件或加热/用电结构，直接影响较低。 |\n| P2 | EU/UK 供应链与清关 | 2026-08-27 | 待各系统/成员国执行节奏确认 | 欧盟官方文档更新 | European Commission EU Customs Data Model 7.0.11 | 欧盟发布 EUCDM 7.0.11 更新，包含低价值进口货物等海关数据元素维护。 | 面向 DE/FR/IT/ES 的跨境清关、IOSS、低价值包裹、ERP/货代接口字段维护人员。 | 库存/利润：短期不改销售页面；下周需让货代确认字段映射是否影响 HS code、IOSS、申报价值、原产地和低价值包裹申报，避免清关延误或补税。 |\n| P2 | US/全球供应链 | 2026-08-27 | 数据期：2026-07 | 美国 Census 官方数据 | U.S. Census Advance Economic Indicators | 美国 7 月商品贸易、批发和零售库存先行数据发布。 | 做 US 站补货、价格和库存覆盖判断的运营/供应链团队。 | 库存/利润：作为宏观校验信号使用，不单独触发备货；若进口前置或库存上升，应结合自有周转、FBA 入仓时效和旺季预测修正安全库存。 |\n\n## 已有事件的重要更新\n\n| 历史事件 | 上次状态 | 本次新增变化 | 变化原因 | 行动是否调整 |\n|---|---|---|---|---|\n| Amazon Ads 指标/批量管理文档更新 | 2026-08-27 已记录 conversion metrics 支持页更新 | 2026-08-28 新增 DSP bulk operations 字段变化，属于同一广告数据治理主线下的新事实。 | Amazon Ads API release notes 出现新的字段级更新。 | 调整：DSP 账户增加素材关联状态检查；非 DSP 账户不新增动作。 |\n| CPSC/OPSS 产品安全观察 | 2026-08-21 和 2026-08-27 已做召回与安全风险观察 | 2026-08-27 CPSC 新增 Amazon 渠道召回案例，需补做 US SKU 供应商和产品结构筛查。 | 政府召回清单新增，且包含 Amazon 销售渠道。 | 调整：将 US 高风险结构筛查列为 P1，非相关类目仅保留记录。 |\n| EU/UK 清关与跨境合规观察 | 2026-08-24 记录 Maersk/PPWR/customs 观察 | 2026-08-27 EUCDM 7.0.11 官方更新，需让货代确认是否影响低价值包裹申报字段。 | 欧盟官方海关数据模型更新。 | 调整：新增 ERP/货代字段映射确认，不直接改 Listing。 |\n\n## 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n|---|---|---|---|---:|---|---:|\n| P1 | 按 CPSC 2026-08-27 召回清单筛查 US 在售 SKU：品牌、供应商、儿童/玩具/电器/厨房/带电/磁吸/小零件结构。 | US | 合规负责人 | 2026-08-31 | 输出命中/未命中清单；命中项有停售、供应商文件和测试报告处理记录。 | 2026-09-01 |\n| P1 | DSP 账户检查 bulk sheet/API 是否使用 `Creative Association Status`，上线前增加素材关联状态校验。 | US/UK/EU | 广告负责人 | 2026-08-31 | DSP 批量投放 SOP 增加字段检查；抽查最近 7 天 creative-line item 异常。 | 2026-09-02 |\n| P2 | 向货代/ERP 负责人确认 EUCDM 7.0.11 是否影响 DE/FR/IT/ES 低价值包裹和 IOSS 字段。 | DE/FR/IT/ES | 物流负责人 | 2026-09-04 | 收到货代书面确认；字段清单覆盖 HS code、申报价值、原产地、IOSS、低价值包裹标识。 | 2026-09-07 |\n| P2 | 用 Census 7 月贸易/库存先行数据校验 US 旺季备货假设。 | US | 运营负责人 | 2026-09-04 | 对自有 SKU 输出库存覆盖天数、在途节点、旺季 forecast 差异表。 | 2026-09-07 |\n\n## 持续关注\n\n| 事项 | 下次复查日期 | 关注点 |\n|---|---:|---|\n| UK Automated Handling Time / Business Hour Delivery Rate | 2026-09-01 | UK FBM/SFP 是否触发处理时间或工作时段配送指标变化。 |\n| Amazon Accelerate 2026 early-bird / 会议日程 | 2026-08-29 | 是否有面向卖家的 Listing、广告、AI 搜索、费用或履约新增公告。 |\n| EUCDM 7.0.11 清关字段落地 | 2026-09-07 | 货代/ERP 是否要求调整申报字段或模板。 |\n\n## 可信度\n\n来源总数：7。官方来源数：5，包括国务院/中国政府网节假日安排、Amazon Ads、CPSC、European Commission、U.S. Census。非官方来源数：2，主要用于发现线索或物流价格交叉验证。仍待确认事项：2，EUCDM 7.0.11 对具体货代字段的执行影响、UK AHT/BHDR 对当前账户后台的实际触发情况。\n\n# 《亚马逊及海外市场情报周报｜2026-08-28》\n\n## 1. 本周管理层摘要\n\n本周确认的新增或实质更新共 8 条，其中高影响主线为 Amazon BSA Section 18 生效、EU/UK AWD 与 UK handling-time 运营变化、Amazon Ads 数据字段与指标口径更新、产品安全召回与物流/贸易信号。影响站点集中在 US、UK、DE、FR、IT、ES。最高风险是合规与履约：合同/融资安排需核对 BSA，US 高风险商品需按 CPSC 召回筛查，UK FBM 需确认自动处理时间和 Business Hour Delivery Rate。最近截止日为 2026-08-29 Amazon Accelerate early-bird/议程关注，2026-09-01 UK 处理时间相关复查。\n\n## 2. 本周政策与平台变化\n\n### 合规\n\n- Amazon BSA Section 18 transfer/pledging 条款于 2026-08-24 生效。涉及主体转让、账户/应收款质押、融资、并购、收款和法务文件的卖家需留档核对；普通 Listing 操作不受直接影响。\n- CPSC 在 2026-08-21 和 2026-08-27 均出现 Amazon 销售渠道或 Amazon-sold 商品召回信号。本周动作是筛查 US 高风险结构 SKU，而不是泛化修改所有相册/手工类商品。\n- EUCDM 7.0.11 在 2026-08-27 更新，属于 EU 清关数据模型变化。当前动作是确认货代/ERP 字段，不直接变更 Amazon 前台内容。\n\n### Listing\n\n- 2026-08-26 Seller Forums / Amazon 相关标题规则问答延续产品标题治理主题。行动标准：抽样检查核心 ASIN 标题长度、品牌展示、堆词、特殊符号和变体一致性；若无违规，不做大规模改写。\n- Rufus/COSMO/AI 搜索本周未发现 Amazon 官方强制新规；继续把标题、五点、A+、图片 Alt/模块语义和 QA 作为语义相关性建设项。\n\n### 广告\n\n- 2026-08-27 Amazon Ads conversion metrics 支持页更新，适合广告团队复核 CVR、attribution 和转化口径，不等同于出价规则变化。\n- 2026-08-28 新增 DSP bulk operations `Creative Association Status` 字段，影响 DSP 批量素材与 line item 管理；SP/SB/SD 常规投放不需要即时结构调整。\n- Sponsored Prompts/AI 广告仅有行业分析和专利线索，未见 Amazon 官方产品化公告，不作为本周强制动作。\n\n### 费用\n\n- 本周未发现 US/UK/DE/FR/IT/ES FBA 费率或 referral fee 新官方数值变化。AWD、货代报价和海运指数变化仍会影响入仓综合成本，需要在补货测算中单列。\n\n### 库存物流\n\n- Europe/UK AWD Q4 运营日期与 Oct-Dec 2026 storage-fee waiver 相关信息在本周被记录，需用于 EU/UK 旺季入仓节奏和成本测算。\n- Freightos/Drewry/行业周报显示跨太平洋与欧线运价仍需周度跟踪。行动重点是看自有在途 ETA、FBA 预约、旺季库存覆盖天数，而不是仅看指数涨跌。\n\n### 促销\n\n- FR/EU 促销参考价、折扣展示和价格真实性风险继续观察；本周无新增 Amazon 官方促销规则。\n\n## 3. 本周海外市场与供应链变化\n\n- 美国 2026-07 贸易和库存先行数据为旺季备货提供宏观校验，不能替代 SKU 级销量预测。若自有库存覆盖天数已经超过目标，应优先优化价格、广告和促销，而不是继续追高补货。\n- Canada/US 关税、NYC delivery regulation、UK OPSS 产品安全和 EU customs 数据模型均为观察事项。只有当业务涉及对应渠道、FBM 配送、产品结构或清关路径时才升级为执行动作。\n- Back-to-school、home goods、gift/craft 类需求仍是 Q3-Q4 转换信号；对相册、学校记忆册、手工册、portfolio binder，应重点复盘关键词流量、主图 CTR、礼品场景 CVR 和广告 ACOS。\n\n## 4. 对当前业务的量化影响\n\n| 维度 | 影响判断 | 建议量化口径 |\n|---|---|---|\n| 销售 | BTS/礼品需求仍有机会，但本周无单一平台新规直接拉动销售。 | 按 US/UK/DE 核心 ASIN 跟踪 7 日 sessions、CVR、订单量，和去年同期/前 4 周均值对比。 |\n| 利润率 | AWD/海运/清关字段变化可能影响入仓成本和延误成本。 | 补货表增加 landed cost、AWD storage waiver、滞港/改约费用假设；利润率低于目标 3 个点的 SKU 暂缓补货。 |\n| CTR/CVR | 标题治理、Rufus 语义、BTS 场景影响 CTR/CVR，但无官方强制改版。 | 主图 CTR、广告 CVR、自然转化率任一较 28 日均值下降 10% 以上才进入优化队列。 |\n| ACoS/TACoS | DSP 新字段有助于降低素材关联失败；SP/SB/SD 无直接新规。 | DSP creative 异常率目标 0；SP/SB/SD 按搜索词浪费花费和 CVR 分层调价。 |\n| 库存覆盖 | 宏观库存与运价信号提示旺季节奏要更稳。 | US 旺季核心 SKU 目标覆盖 45-60 天；慢销或毛利低 SKU 控制在 30-45 天。 |\n| 合规 | BSA、CPSC、EUCDM 是本周最高风险组合。 | 100% 完成高风险 SKU 召回筛查；100% 完成融资/主体文件核对；EU 货代字段确认留档。 |\n\n## 5. 下周行动清单\n\n| 优先级 | 动作 | 站点 | 对象 | 负责人 | 截止日 | 验收指标 |\n|---|---|---|---|---|---:|---|\n| P0 | 复查 UK FBM/SFP 自动处理时间与 Business Hour Delivery Rate 后台提示。 | UK | FBM/SFP SKU | 运营负责人 | 2026-09-01 | 后台无红色风险；处理时间和配送时段设置留档。 |\n| P1 | 完成 CPSC 2026-08-27 召回筛查。 | US | 高风险结构 SKU | 合规负责人 | 2026-08-31 | 命中/未命中清单和供应商确认文件。 |\n| P1 | 核对 BSA Section 18 对主体、融资、收款和质押安排的影响。 | 全站点 | 公司主体/收款/融资 | 财务/法务 | 2026-09-02 | 风险清单关闭或升级给法务。 |\n| P1 | 更新 DSP 批量投放 SOP。 | US/UK/EU | DSP campaign | 广告负责人 | 2026-08-31 | creative 关联异常率为 0。 |\n| P2 | 完成 EUCDM 7.0.11 货代字段确认。 | DE/FR/IT/ES | IOSS/清关模板 | 物流负责人 | 2026-09-04 | 货代书面确认；ERP 字段无需或已完成调整。 |\n| P2 | 复盘 BTS/礼品关键词与广告效率。 | US/UK/DE | 相册、学校记忆册、手工册 | Listing/广告负责人 | 2026-09-04 | sessions、CVR、ACoS、TACoS 与去年同期/4周均值对比完成。 |\n\n## 6. 已关闭与继续跟踪事项\n\n| 状态 | 事项 | 依据或下次检查 |\n|---|---|---|\n| 关闭 | 2026-08-25 非官方关税传闻 | 本周未见 USTR/CBP/Commerce 官方确认；不进入执行动作。 |\n| 关闭 | Amazon 8 月 27 日一般公司新闻 | 无 Seller Central 后台动作、费用、合规或广告规则变化。 |\n| 继续跟踪 | Amazon Accelerate 2026 | 2026-08-29 检查是否出现卖家工具、广告、AI 搜索、费用或履约公告。 |\n| 继续跟踪 | UK AHT/BHDR | 2026-09-01 后台复查。 |\n| 继续跟踪 | EUCDM 7.0.11 | 2026-09-07 检查货代执行反馈。 |\n\n## 7. 来源与可信度统计\n\n本周用于判断的来源约 18 个；官方来源约 10 个，覆盖 Amazon/Amazon Ads、CPSC、European Commission、U.S. Census、中国政府网/国务院办公厅、UK OPSS/HMRC 等；非官方来源约 8 个，主要用于物流、零售需求和行业线索交叉验证。未确认事项不进入强制动作：Sponsored Prompts 商业化、关税传闻、具体货代对 EUCDM 的执行要求。\n\n## 主要来源\n\n- 国务院办公厅关于 2026 年部分节假日安排的通知： https://www.gov.cn/zhengce/content/202511/content_7047090.htm\n- Amazon Ads API Release Notes： https://advertising.amazon.com/API/docs/en-us/release-notes/index\n- Amazon DSP bulk operations entities： https://advertising.amazon.com/API/docs/en-us/no-code-tools/bulk-operations/dsp/entities\n- CPSC Recalls： https://www.cpsc.gov/Recalls\n- CPSC Cuisinart Portable Butane Stoves recall： https://www.cpsc.gov/Recalls/2026/Cuisinart-Portable-Butane-Stoves-Recalled-Due-to-Risk-of-Serious-Injury-or-Death-from-Fire-Hazard-Sold-by-Conair\n- European Commission EU Customs Data Model 7.0.11： https://taxation-customs.ec.europa.eu/customs-4/union-customs-code/electronic-customs/eu-customs-data-model-eucdm/eu-customs-data-model-7011_en\n- U.S. Census Advance Economic Indicators： https://www.census.gov/econ/indicators/\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-08-28\">\n  \u003ctitle>《亚马逊及海外市场情报增量日报｜2026-08-28》\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">《亚马逊及海外市场情报增量日报｜2026-08-28》\u003c/h1>\n\u003ch2>今日结论\u003c/h2>\n\u003cp>过去 24 小时未发现 Amazon Seller Central 面向 US/UK/DE/FR/IT/ES 卖家的重大强制新规，但有 1 项 Amazon Ads 官方技术更新、2 项政府/监管侧新增变化需要进入运营观察。最高优先级是排查 CPSC 2026-08-27 召回中是否存在供应商、类目或相似风险商品，尤其是儿童、家居电器、玩具、厨房设备和带电产品。EUCDM 7.0.11 属于欧盟海关数据结构更新，当前主要影响清关数据、IOSS/低价值包裹申报和 ERP/货代字段映射，不建议立刻修改 Listing。今天也是本周最后一个中国大陆法定工作日，需要追加周度合并报告。\u003c/p>\n\u003ch2>新增事件\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>影响等级\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>发布日期\u003c/th>\n\u003cth>生效日期\u003c/th>\n\u003cth>信息状态\u003c/th>\n\u003cth>来源\u003c/th>\n\u003cth>核心变化\u003c/th>\n\u003cth>影响对象\u003c/th>\n\u003cth>运营影响\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>US/UK/EU，DSP 广告账户\u003c/td>\n\u003ctd>2026-08-27\u003c/td>\n\u003ctd>2026-08-27\u003c/td>\n\u003ctd>Amazon 官方发布\u003c/td>\n\u003ctd>Amazon Ads API Release Notes / DSP Bulk operations entities\u003c/td>\n\u003ctd>DSP bulk operations 新增只读字段 \u003ccode>Creative Association Status\u003c/code>，用于识别 creative 与 line item 的关联状态。\u003c/td>\n\u003ctd>使用 DSP bulk sheet/API 做广告素材、line item 批量管理的广告/投放团队。\u003c/td>\n\u003ctd>广告：批量上传前可用该字段检查素材关联失败或未生效状态，降低素材上线失败、展示断档和预算浪费；对 SP/SB/SD 常规投放无直接影响。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>2026-08-27\u003c/td>\n\u003ctd>立即执行召回\u003c/td>\n\u003ctd>美国 CPSC 官方召回\u003c/td>\n\u003ctd>CPSC Recalls 2026-08-27\u003c/td>\n\u003ctd>CPSC 当日发布多项召回，其中包括 Amazon 销售渠道商品，如 Cuisinart Portable Butane Stoves、若干童装/玩具/家居电器类商品。\u003c/td>\n\u003ctd>US 站销售或采购儿童用品、厨房设备、带电产品、压力清洗机、玩具或相似风险商品的团队。\u003c/td>\n\u003ctd>合规/销售：需按供应商和关键词筛查是否存在相同品牌、同款、同供应商或相似高风险结构；若命中，立即停售、留存测试文件并联系供应商。相册/手工类若不含儿童玩具、电池、磁吸、小零件或加热/用电结构，直接影响较低。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>EU/UK 供应链与清关\u003c/td>\n\u003ctd>2026-08-27\u003c/td>\n\u003ctd>待各系统/成员国执行节奏确认\u003c/td>\n\u003ctd>欧盟官方文档更新\u003c/td>\n\u003ctd>European Commission EU Customs Data Model 7.0.11\u003c/td>\n\u003ctd>欧盟发布 EUCDM 7.0.11 更新，包含低价值进口货物等海关数据元素维护。\u003c/td>\n\u003ctd>面向 DE/FR/IT/ES 的跨境清关、IOSS、低价值包裹、ERP/货代接口字段维护人员。\u003c/td>\n\u003ctd>库存/利润：短期不改销售页面；下周需让货代确认字段映射是否影响 HS code、IOSS、申报价值、原产地和低价值包裹申报，避免清关延误或补税。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>US/全球供应链\u003c/td>\n\u003ctd>2026-08-27\u003c/td>\n\u003ctd>数据期：2026-07\u003c/td>\n\u003ctd>美国 Census 官方数据\u003c/td>\n\u003ctd>U.S. Census Advance Economic Indicators\u003c/td>\n\u003ctd>美国 7 月商品贸易、批发和零售库存先行数据发布。\u003c/td>\n\u003ctd>做 US 站补货、价格和库存覆盖判断的运营/供应链团队。\u003c/td>\n\u003ctd>库存/利润：作为宏观校验信号使用，不单独触发备货；若进口前置或库存上升，应结合自有周转、FBA 入仓时效和旺季预测修正安全库存。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>已有事件的重要更新\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>历史事件\u003c/th>\n\u003cth>上次状态\u003c/th>\n\u003cth>本次新增变化\u003c/th>\n\u003cth>变化原因\u003c/th>\n\u003cth>行动是否调整\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>Amazon Ads 指标/批量管理文档更新\u003c/td>\n\u003ctd>2026-08-27 已记录 conversion metrics 支持页更新\u003c/td>\n\u003ctd>2026-08-28 新增 DSP bulk operations 字段变化，属于同一广告数据治理主线下的新事实。\u003c/td>\n\u003ctd>Amazon Ads API release notes 出现新的字段级更新。\u003c/td>\n\u003ctd>调整：DSP 账户增加素材关联状态检查；非 DSP 账户不新增动作。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CPSC/OPSS 产品安全观察\u003c/td>\n\u003ctd>2026-08-21 和 2026-08-27 已做召回与安全风险观察\u003c/td>\n\u003ctd>2026-08-27 CPSC 新增 Amazon 渠道召回案例，需补做 US SKU 供应商和产品结构筛查。\u003c/td>\n\u003ctd>政府召回清单新增，且包含 Amazon 销售渠道。\u003c/td>\n\u003ctd>调整：将 US 高风险结构筛查列为 P1，非相关类目仅保留记录。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EU/UK 清关与跨境合规观察\u003c/td>\n\u003ctd>2026-08-24 记录 Maersk/PPWR/customs 观察\u003c/td>\n\u003ctd>2026-08-27 EUCDM 7.0.11 官方更新，需让货代确认是否影响低价值包裹申报字段。\u003c/td>\n\u003ctd>欧盟官方海关数据模型更新。\u003c/td>\n\u003ctd>调整：新增 ERP/货代字段映射确认，不直接改 Listing。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>按 CPSC 2026-08-27 召回清单筛查 US 在售 SKU：品牌、供应商、儿童/玩具/电器/厨房/带电/磁吸/小零件结构。\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>合规负责人\u003c/td>\n\u003ctd>2026-08-31\u003c/td>\n\u003ctd>输出命中/未命中清单；命中项有停售、供应商文件和测试报告处理记录。\u003c/td>\n\u003ctd>2026-09-01\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>DSP 账户检查 bulk sheet/API 是否使用 \u003ccode>Creative Association Status\u003c/code>，上线前增加素材关联状态校验。\u003c/td>\n\u003ctd>US/UK/EU\u003c/td>\n\u003ctd>广告负责人\u003c/td>\n\u003ctd>2026-08-31\u003c/td>\n\u003ctd>DSP 批量投放 SOP 增加字段检查；抽查最近 7 天 creative-line item 异常。\u003c/td>\n\u003ctd>2026-09-02\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>向货代/ERP 负责人确认 EUCDM 7.0.11 是否影响 DE/FR/IT/ES 低价值包裹和 IOSS 字段。\u003c/td>\n\u003ctd>DE/FR/IT/ES\u003c/td>\n\u003ctd>物流负责人\u003c/td>\n\u003ctd>2026-09-04\u003c/td>\n\u003ctd>收到货代书面确认；字段清单覆盖 HS code、申报价值、原产地、IOSS、低价值包裹标识。\u003c/td>\n\u003ctd>2026-09-07\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>用 Census 7 月贸易/库存先行数据校验 US 旺季备货假设。\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>运营负责人\u003c/td>\n\u003ctd>2026-09-04\u003c/td>\n\u003ctd>对自有 SKU 输出库存覆盖天数、在途节点、旺季 forecast 差异表。\u003c/td>\n\u003ctd>2026-09-07\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>持续关注\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>事项\u003c/th>\n\u003cth>下次复查日期\u003c/th>\n\u003cth>关注点\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>UK Automated Handling Time / Business Hour Delivery Rate\u003c/td>\n\u003ctd>2026-09-01\u003c/td>\n\u003ctd>UK FBM/SFP 是否触发处理时间或工作时段配送指标变化。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Amazon Accelerate 2026 early-bird / 会议日程\u003c/td>\n\u003ctd>2026-08-29\u003c/td>\n\u003ctd>是否有面向卖家的 Listing、广告、AI 搜索、费用或履约新增公告。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EUCDM 7.0.11 清关字段落地\u003c/td>\n\u003ctd>2026-09-07\u003c/td>\n\u003ctd>货代/ERP 是否要求调整申报字段或模板。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>可信度\u003c/h2>\n\u003cp>来源总数：7。官方来源数：5，包括国务院/中国政府网节假日安排、Amazon Ads、CPSC、European Commission、U.S. Census。非官方来源数：2，主要用于发现线索或物流价格交叉验证。仍待确认事项：2，EUCDM 7.0.11 对具体货代字段的执行影响、UK AHT/BHDR 对当前账户后台的实际触发情况。\u003c/p>\n\u003ch1 class=\"report-title\">《亚马逊及海外市场情报周报｜2026-08-28》\u003c/h1>\n\u003ch2>1. 本周管理层摘要\u003c/h2>\n\u003cp>本周确认的新增或实质更新共 8 条，其中高影响主线为 Amazon BSA Section 18 生效、EU/UK AWD 与 UK handling-time 运营变化、Amazon Ads 数据字段与指标口径更新、产品安全召回与物流/贸易信号。影响站点集中在 US、UK、DE、FR、IT、ES。最高风险是合规与履约：合同/融资安排需核对 BSA，US 高风险商品需按 CPSC 召回筛查，UK FBM 需确认自动处理时间和 Business Hour Delivery Rate。最近截止日为 2026-08-29 Amazon Accelerate early-bird/议程关注，2026-09-01 UK 处理时间相关复查。\u003c/p>\n\u003ch2>2. 本周政策与平台变化\u003c/h2>\n\u003ch3>合规\u003c/h3>\n\u003cul>\n\u003cli>Amazon BSA Section 18 transfer/pledging 条款于 2026-08-24 生效。涉及主体转让、账户/应收款质押、融资、并购、收款和法务文件的卖家需留档核对；普通 Listing 操作不受直接影响。\u003c/li>\n\u003cli>CPSC 在 2026-08-21 和 2026-08-27 均出现 Amazon 销售渠道或 Amazon-sold 商品召回信号。本周动作是筛查 US 高风险结构 SKU，而不是泛化修改所有相册/手工类商品。\u003c/li>\n\u003cli>EUCDM 7.0.11 在 2026-08-27 更新，属于 EU 清关数据模型变化。当前动作是确认货代/ERP 字段，不直接变更 Amazon 前台内容。\u003c/li>\n\u003c/ul>\n\u003ch3>Listing\u003c/h3>\n\u003cul>\n\u003cli>2026-08-26 Seller Forums / Amazon 相关标题规则问答延续产品标题治理主题。行动标准：抽样检查核心 ASIN 标题长度、品牌展示、堆词、特殊符号和变体一致性；若无违规，不做大规模改写。\u003c/li>\n\u003cli>Rufus/COSMO/AI 搜索本周未发现 Amazon 官方强制新规；继续把标题、五点、A+、图片 Alt/模块语义和 QA 作为语义相关性建设项。\u003c/li>\n\u003c/ul>\n\u003ch3>广告\u003c/h3>\n\u003cul>\n\u003cli>2026-08-27 Amazon Ads conversion metrics 支持页更新，适合广告团队复核 CVR、attribution 和转化口径，不等同于出价规则变化。\u003c/li>\n\u003cli>2026-08-28 新增 DSP bulk operations \u003ccode>Creative Association Status\u003c/code> 字段，影响 DSP 批量素材与 line item 管理；SP/SB/SD 常规投放不需要即时结构调整。\u003c/li>\n\u003cli>Sponsored Prompts/AI 广告仅有行业分析和专利线索，未见 Amazon 官方产品化公告，不作为本周强制动作。\u003c/li>\n\u003c/ul>\n\u003ch3>费用\u003c/h3>\n\u003cul>\n\u003cli>本周未发现 US/UK/DE/FR/IT/ES FBA 费率或 referral fee 新官方数值变化。AWD、货代报价和海运指数变化仍会影响入仓综合成本，需要在补货测算中单列。\u003c/li>\n\u003c/ul>\n\u003ch3>库存物流\u003c/h3>\n\u003cul>\n\u003cli>Europe/UK AWD Q4 运营日期与 Oct-Dec 2026 storage-fee waiver 相关信息在本周被记录，需用于 EU/UK 旺季入仓节奏和成本测算。\u003c/li>\n\u003cli>Freightos/Drewry/行业周报显示跨太平洋与欧线运价仍需周度跟踪。行动重点是看自有在途 ETA、FBA 预约、旺季库存覆盖天数，而不是仅看指数涨跌。\u003c/li>\n\u003c/ul>\n\u003ch3>促销\u003c/h3>\n\u003cul>\n\u003cli>FR/EU 促销参考价、折扣展示和价格真实性风险继续观察；本周无新增 Amazon 官方促销规则。\u003c/li>\n\u003c/ul>\n\u003ch2>3. 本周海外市场与供应链变化\u003c/h2>\n\u003cul>\n\u003cli>美国 2026-07 贸易和库存先行数据为旺季备货提供宏观校验，不能替代 SKU 级销量预测。若自有库存覆盖天数已经超过目标，应优先优化价格、广告和促销，而不是继续追高补货。\u003c/li>\n\u003cli>Canada/US 关税、NYC delivery regulation、UK OPSS 产品安全和 EU customs 数据模型均为观察事项。只有当业务涉及对应渠道、FBM 配送、产品结构或清关路径时才升级为执行动作。\u003c/li>\n\u003cli>Back-to-school、home goods、gift/craft 类需求仍是 Q3-Q4 转换信号；对相册、学校记忆册、手工册、portfolio binder，应重点复盘关键词流量、主图 CTR、礼品场景 CVR 和广告 ACOS。\u003c/li>\n\u003c/ul>\n\u003ch2>4. 对当前业务的量化影响\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>影响判断\u003c/th>\n\u003cth>建议量化口径\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>销售\u003c/td>\n\u003ctd>BTS/礼品需求仍有机会，但本周无单一平台新规直接拉动销售。\u003c/td>\n\u003ctd>按 US/UK/DE 核心 ASIN 跟踪 7 日 sessions、CVR、订单量，和去年同期/前 4 周均值对比。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>利润率\u003c/td>\n\u003ctd>AWD/海运/清关字段变化可能影响入仓成本和延误成本。\u003c/td>\n\u003ctd>补货表增加 landed cost、AWD storage waiver、滞港/改约费用假设；利润率低于目标 3 个点的 SKU 暂缓补货。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CTR/CVR\u003c/td>\n\u003ctd>标题治理、Rufus 语义、BTS 场景影响 CTR/CVR，但无官方强制改版。\u003c/td>\n\u003ctd>主图 CTR、广告 CVR、自然转化率任一较 28 日均值下降 10% 以上才进入优化队列。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ACoS/TACoS\u003c/td>\n\u003ctd>DSP 新字段有助于降低素材关联失败；SP/SB/SD 无直接新规。\u003c/td>\n\u003ctd>DSP creative 异常率目标 0；SP/SB/SD 按搜索词浪费花费和 CVR 分层调价。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>库存覆盖\u003c/td>\n\u003ctd>宏观库存与运价信号提示旺季节奏要更稳。\u003c/td>\n\u003ctd>US 旺季核心 SKU 目标覆盖 45-60 天；慢销或毛利低 SKU 控制在 30-45 天。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>合规\u003c/td>\n\u003ctd>BSA、CPSC、EUCDM 是本周最高风险组合。\u003c/td>\n\u003ctd>100% 完成高风险 SKU 召回筛查；100% 完成融资/主体文件核对；EU 货代字段确认留档。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>5. 下周行动清单\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>动作\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>对象\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日\u003c/th>\n\u003cth>验收指标\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P0\u003c/td>\n\u003ctd>复查 UK FBM/SFP 自动处理时间与 Business Hour Delivery Rate 后台提示。\u003c/td>\n\u003ctd>UK\u003c/td>\n\u003ctd>FBM/SFP SKU\u003c/td>\n\u003ctd>运营负责人\u003c/td>\n\u003ctd>2026-09-01\u003c/td>\n\u003ctd>后台无红色风险；处理时间和配送时段设置留档。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>完成 CPSC 2026-08-27 召回筛查。\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>高风险结构 SKU\u003c/td>\n\u003ctd>合规负责人\u003c/td>\n\u003ctd>2026-08-31\u003c/td>\n\u003ctd>命中/未命中清单和供应商确认文件。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>核对 BSA Section 18 对主体、融资、收款和质押安排的影响。\u003c/td>\n\u003ctd>全站点\u003c/td>\n\u003ctd>公司主体/收款/融资\u003c/td>\n\u003ctd>财务/法务\u003c/td>\n\u003ctd>2026-09-02\u003c/td>\n\u003ctd>风险清单关闭或升级给法务。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>更新 DSP 批量投放 SOP。\u003c/td>\n\u003ctd>US/UK/EU\u003c/td>\n\u003ctd>DSP campaign\u003c/td>\n\u003ctd>广告负责人\u003c/td>\n\u003ctd>2026-08-31\u003c/td>\n\u003ctd>creative 关联异常率为 0。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>完成 EUCDM 7.0.11 货代字段确认。\u003c/td>\n\u003ctd>DE/FR/IT/ES\u003c/td>\n\u003ctd>IOSS/清关模板\u003c/td>\n\u003ctd>物流负责人\u003c/td>\n\u003ctd>2026-09-04\u003c/td>\n\u003ctd>货代书面确认；ERP 字段无需或已完成调整。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>复盘 BTS/礼品关键词与广告效率。\u003c/td>\n\u003ctd>US/UK/DE\u003c/td>\n\u003ctd>相册、学校记忆册、手工册\u003c/td>\n\u003ctd>Listing/广告负责人\u003c/td>\n\u003ctd>2026-09-04\u003c/td>\n\u003ctd>sessions、CVR、ACoS、TACoS 与去年同期/4周均值对比完成。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>6. 已关闭与继续跟踪事项\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>状态\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>依据或下次检查\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>关闭\u003c/td>\n\u003ctd>2026-08-25 非官方关税传闻\u003c/td>\n\u003ctd>本周未见 USTR/CBP/Commerce 官方确认；不进入执行动作。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>关闭\u003c/td>\n\u003ctd>Amazon 8 月 27 日一般公司新闻\u003c/td>\n\u003ctd>无 Seller Central 后台动作、费用、合规或广告规则变化。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>继续跟踪\u003c/td>\n\u003ctd>Amazon Accelerate 2026\u003c/td>\n\u003ctd>2026-08-29 检查是否出现卖家工具、广告、AI 搜索、费用或履约公告。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>继续跟踪\u003c/td>\n\u003ctd>UK AHT/BHDR\u003c/td>\n\u003ctd>2026-09-01 后台复查。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>继续跟踪\u003c/td>\n\u003ctd>EUCDM 7.0.11\u003c/td>\n\u003ctd>2026-09-07 检查货代执行反馈。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>7. 来源与可信度统计\u003c/h2>\n\u003cp>本周用于判断的来源约 18 个；官方来源约 10 个，覆盖 Amazon/Amazon Ads、CPSC、European Commission、U.S. Census、中国政府网/国务院办公厅、UK OPSS/HMRC 等；非官方来源约 8 个，主要用于物流、零售需求和行业线索交叉验证。未确认事项不进入强制动作：Sponsored Prompts 商业化、关税传闻、具体货代对 EUCDM 的执行要求。\u003c/p>\n\u003ch2>主要来源\u003c/h2>\n\u003cul>\n\u003cli>国务院办公厅关于 2026 年部分节假日安排的通知： \u003ca href=\"https://www.gov.cn/zhengce/content/202511/content_7047090.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.cn/zhengce/content/202511/content_7047090.htm\u003c/a>\u003c/li>\n\u003cli>Amazon Ads API Release Notes： \u003ca href=\"https://advertising.amazon.com/API/docs/en-us/release-notes/index\" target=\"_blank\" rel=\"noopener noreferrer\">https://advertising.amazon.com/API/docs/en-us/release-notes/index\u003c/a>\u003c/li>\n\u003cli>Amazon DSP bulk operations entities： \u003ca href=\"https://advertising.amazon.com/API/docs/en-us/no-code-tools/bulk-operations/dsp/entities\" target=\"_blank\" rel=\"noopener noreferrer\">https://advertising.amazon.com/API/docs/en-us/no-code-tools/bulk-operations/dsp/entities\u003c/a>\u003c/li>\n\u003cli>CPSC Recalls： \u003ca href=\"https://www.cpsc.gov/Recalls\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.cpsc.gov/Recalls\u003c/a>\u003c/li>\n\u003cli>CPSC Cuisinart Portable Butane Stoves recall： \u003ca href=\"https://www.cpsc.gov/Recalls/2026/Cuisinart-Portable-Butane-Stoves-Recalled-Due-to-Risk-of-Serious-Injury-or-Death-from-Fire-Hazard-Sold-by-Conair\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.cpsc.gov/Recalls/2026/Cuisinart-Portable-Butane-Stoves-Recalled-Due-to-Risk-of-Serious-Injury-or-Death-from-Fire-Hazard-Sold-by-Conair\u003c/a>\u003c/li>\n\u003cli>European Commission EU Customs Data Model 7.0.11： \u003ca href=\"https://taxation-customs.ec.europa.eu/customs-4/union-customs-code/electronic-customs/eu-customs-data-model-eucdm/eu-customs-data-model-7011_en\" target=\"_blank\" rel=\"noopener noreferrer\">https://taxation-customs.ec.europa.eu/customs-4/union-customs-code/electronic-customs/eu-customs-data-model-eucdm/eu-customs-data-model-7011_en\u003c/a>\u003c/li>\n\u003cli>U.S. Census Advance Economic Indicators： \u003ca href=\"https://www.census.gov/econ/indicators/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.census.gov/econ/indicators/\u003c/a>\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-08-28\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-08-28", "text": "## 已有事件的重要更新\n\n| 历史事件 | 上次状态 | 本次新增变化 | 变化原因 | 行动是否调整 |\n|---|---|---|---|---|\n| Amazon Ads 指标/批量管理文档更新 | 2026-08-27 已记录 conversion metrics 支持页更新 | 2026-08-28 新增 DSP bulk operations 字段变化，属于同一广告数据治理主线下的新事实。 | Amazon Ads API release notes 出现新的字段级更新。 | 调整：DSP 账户增加素材关联状态检查；非 DSP 账户不新增动作。 |\n| CPSC/OPSS 产品安全观察 | 2026-08-21 和 2026-08-27 已做召回与安全风险观察 | 2026-08-27 CPSC 新增 Amazon 渠道召回案例，需补做 US SKU 供应商和产品结构筛查。 | 政府召回清单新增，且包含 Amazon 销售渠道。 | 调整：将 US 高风险结构筛查列为 P1，非相关类目仅保留记录。 |\n| EU/UK 清关与跨境合规观察 | 2026-08-24 记录 Maersk/PPWR/customs 观察 | 2026-08-27 EUCDM 7.0.11 官方更新，需让货代确认是否影响低价值包裹申报字段。 | 欧盟官方海关数据模型更新。 | 调整：新增 ERP/货代字段映射确认，不直接改 Listing。 |\n\n", "title": "已有事件的重要更新", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-08-28\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-08-28\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch2>已有事件的重要更新\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>历史事件\u003c/th>\n\u003cth>上次状态\u003c/th>\n\u003cth>本次新增变化\u003c/th>\n\u003cth>变化原因\u003c/th>\n\u003cth>行动是否调整\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>Amazon Ads 指标/批量管理文档更新\u003c/td>\n\u003ctd>2026-08-27 已记录 conversion metrics 支持页更新\u003c/td>\n\u003ctd>2026-08-28 新增 DSP bulk operations 字段变化，属于同一广告数据治理主线下的新事实。\u003c/td>\n\u003ctd>Amazon Ads API release notes 出现新的字段级更新。\u003c/td>\n\u003ctd>调整：DSP 账户增加素材关联状态检查；非 DSP 账户不新增动作。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CPSC/OPSS 产品安全观察\u003c/td>\n\u003ctd>2026-08-21 和 2026-08-27 已做召回与安全风险观察\u003c/td>\n\u003ctd>2026-08-27 CPSC 新增 Amazon 渠道召回案例，需补做 US SKU 供应商和产品结构筛查。\u003c/td>\n\u003ctd>政府召回清单新增，且包含 Amazon 销售渠道。\u003c/td>\n\u003ctd>调整：将 US 高风险结构筛查列为 P1，非相关类目仅保留记录。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EU/UK 清关与跨境合规观察\u003c/td>\n\u003ctd>2026-08-24 记录 Maersk/PPWR/customs 观察\u003c/td>\n\u003ctd>2026-08-27 EUCDM 7.0.11 官方更新，需让货代确认是否影响低价值包裹申报字段。\u003c/td>\n\u003ctd>欧盟官方海关数据模型更新。\u003c/td>\n\u003ctd>调整：新增 ERP/货代字段映射确认，不直接改 Listing。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-08-28\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}]}];
const groups={'政策与合规':/合规|监管|保险|PGA|CBP|申报|关税/i,'Listing与内容':/Listing|图片|A\+|属性|Rufus|COSMO/i,'广告与流量':/广告|PPC|ACoS|DSP|竞价/i,'费用与利润':/费用|毛利|利润|UHF|定价/i,'库存与物流':/库存|物流|入仓|货件|柴油|FBA/i,'促销与市场':/促销|BFCM|消费|市场|Deal/i,'客服与退货':/客服|退货|CSBA|退款/i};
const $=id=>document.getElementById(id);let category='全部分类';
reports.forEach(r=>{const o=document.createElement('option');o.value=r.date;o.textContent=r.date+(r.text.includes('市场情报周报')?' · 日报＋周报':' · 增量日报');$('date').append(o)});
let moduleKind='intelligence';
const sections=reports.flatMap(r=>r.sections.filter(s=>s.kind==='intelligence').map(s=>({...s,categories:Object.keys(groups).filter(k=>groups[k].test(s.text))})));
['全部分类',...Object.keys(groups)].forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{category=k;render()};$('categories').append(b)});
function render(){$('charts').parentElement.classList.toggle('hidden',moduleKind!=='intelligence');const q=$('query').value.trim().toLowerCase(),site=$('site').value;const found=sections.filter(s=>s.kind===moduleKind&&($('scope').value==='all'||s.date===$('date').value)&&(!q||q.split(/\s+/).every(w=>s.text.toLowerCase().includes(w)))&&(!site||new RegExp('\\b'+site+'\\b','i').test(s.text))&&(category==='全部分类'||s.categories.includes(category)));$('status').textContent=`历史 ${reports.length} 期 · 匹配 ${found.length} 条情报 · ${$('date').value}`;
Array.from($('categories').children).forEach(b=>b.classList.toggle('active',b.textContent===category));$('results').replaceChildren();found.forEach(s=>{const card=document.createElement('article');card.className='card';const badge=document.createElement('div');badge.className='badge';badge.textContent=s.date+' · '+(s.categories.join(' / ')||'运营综述');const h=document.createElement('h3');h.textContent=s.title;const p=document.createElement('p');p.textContent=s.text.replace(/^#+[^\n]*\n/,'').replace(/[#*|]/g,'').slice(0,230)+'…';const b=document.createElement('button');b.textContent='查看情报与解读';b.onclick=()=>showEvent(s);card.append(badge,h,p,b);$('results').append(card)});if(!found.length)$('results').textContent='没有匹配内容，请更换关键词或重置筛选。';$('charts').replaceChildren();Object.keys(groups).forEach((k,i)=>{const n=found.filter(s=>s.kind==='intelligence'&&s.categories.includes(k)).length;const d=document.createElement('div');d.className='card';d.innerHTML='<svg viewBox="0 0 240 100" role="img" aria-label="主题说明图"><rect x="0" y="0" width="240" height="100" rx="12" fill="#eef4fb"/><circle cx="55" cy="50" r="25" fill="#bfd4ed"/><path d="M100 70V45h20v25m12 0V25h20v45m12 0V35h20v35" fill="#3d78b6"/></svg>';const label=document.createElement('strong');label.textContent=k+' · '+n;const bar=document.createElement('div');bar.className='bar';const span=document.createElement('span');span.style.width=(found.length?n/found.length*100:0)+'%';bar.append(span);d.append(label,bar);$('charts').append(d)});}
function showEvent(s){$('eventFrame').srcdoc=s.detail_html;$('eventDialog').showModal()}
$('closeEvent').onclick=()=>$('eventDialog').close();
function showReport(){$('reader').classList.remove('hidden');$('results').classList.add('hidden');$('reportButton').classList.add('active');$('cardsButton').classList.remove('active');const r=reports.find(r=>r.date===$('date').value);document.querySelector('#reader iframe').srcdoc=r.html;document.querySelector('#reader iframe').onload=()=>{const f=document.querySelector('#reader iframe');f.style.height=f.contentDocument.documentElement.scrollHeight+40+'px'}}
$('cardsButton').onclick=()=>{moduleKind='intelligence';render();$('reader').classList.add('hidden');$('results').classList.remove('hidden');$('cardsButton').classList.add('active');$('reportButton').classList.remove('active')};$('reportButton').onclick=showReport;
['query','scope','site'].forEach(id=>$(id).addEventListener('input',render));$('date').onchange=()=>{render();if(!$('reader').classList.contains('hidden'))showReport()};$('reset').onclick=()=>{$('query').value='';$('site').value='';$('scope').value='current';category='全部分类';render()};$('download').onclick=()=>{const r=reports.find(r=>r.date===$('date').value),url=URL.createObjectURL(new Blob([r.text],{type:'text/markdown;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=r.date+'-市场日报.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></html>
