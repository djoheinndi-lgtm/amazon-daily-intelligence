ectric、USB、battery、blanket、pad、warmer；如无命中，在复查表记录“无相关 SKU，关闭动作”。如有命中，建立 ASIN/SKU、供应商、测试报告、说明书警示语、UL/ETL/FCC/电池文件、差评/退货原因字段清单，并由产品负责人确认是否暂停上新或补证。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-18\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-18", "text": "### Drewry World Container Index 旺季物流成本信号｜drewry-wci-2026-09-03-4465-stable\n\n- 历史事件：Drewry WCI 周度海运指数，用于 US/EU/UK 旺季补货、订舱、促销毛利和到货节点压力判断。\n- 上次状态：2026-09-11 已推送 2026-09-10 WCI 为 4,476 美元/40ft，整体连续第二周持稳，Transpacific 小幅上行、Asia-Europe 回落。\n- 本次新增变化：Drewry 2026-09-17 更新显示 WCI 上升 1% 至 4,500 美元/40ft；Shanghai-Los Angeles 上升 5% 至 7,712 美元/40ft，Shanghai-New York 上升 7% 至 10,394 美元/40ft；Shanghai-Genoa 下降 5% 至 4,016 美元/40ft，Shanghai-Rotterdam 下降 9% 至 3,626 美元/40ft。\n- 变化原因：Drewry 将本周综合指数上行主要归因于 Transpacific 运价上涨；同时，黄金周前船公司通过 blank sailings 管理运力，上海等待时间从第 36 周 65 小时上升到第 37 周 78 小时。\n- 行动是否需要调整：继续原动作但提高 US 线优先级。供应链负责人只对未锁价、未订舱或 ETA 紧贴 PBDD/Q4 节点的批次更新运费和 ETA 假设；EU 线不要因为综合指数上行而统一上调成本，必须按 Rotterdam/Genoa 实际报价验证。\n\n", "title": "Drewry World Container Index 旺季物流成本信号｜drewry-wci-2026-09-03-4465-stable", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-18\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-18\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-s y book、portfolio binder、puzzle accessories 直接匹配的高优先级动作；重复转述 Prime Big Deal Days、AI 购物、返校/节日消费趋势但无新增运营事实的信息未纳入日报。\n\n工作日门禁来源：中国政府网《国务院办公厅关于2026年部分节假日安排的通知》（https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-17 为周四，不在 2026 年中秋节 2026-09-25 至 2026-09-27 或国庆节 2026-10-01 至 2026-10-07 等法定节假日范围内；2026-09-20（周日）为国庆节调休上班日，因此本周最后一个大陆法定工作日不是今天。\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-17\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-17\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-al 03c/ul>\n\u003ch2>情报边界与可信度\u003c/h2>\n\u003cp>本次核验来源约 12 个，其中官方/监管/一手来源约 9 个，包括中国政府网/国务院办公厅、Amazon Seller Central/Forums、Amazon Ads、About Amazon、CPSC、GOV.UK OPSS、EIA、BLS、Drewry/NRF 既有跟踪源；非官方或行业辅助来源约 3 个，仅用于排重和背景判断。纳入日报的新事件 0 条；纳入已有事件重要更新 0 条；仍待确认事项 3 条：PBDD/Deal ASIN 的账号内可售库存缺口、商业责任险对当前账号的实际适用范围、Product Bundling 2026-09-30 是否触发账号级提醒。\u003c/p>\n\u003cp>排除项：本次窗口内未发现 Seller Central 对 Listing、A+、图片、搜索词、属性、变体、FBA 费用或库存限制发布新的全量强制变更；Amazon Ads 未发布 SP/SB/SD/DSP/AMC 计费、竞价、匹配或归因规则的全量强制变化；CPSC/OPSS 新增安全通报未发现与相册、补充页、school memory book、portfolio binder、puzzle accessories 直接匹配的高优先级动作；重复转述 Prime Big Deal Days、AI 购物、返校/节日消费趋势但无新增运营事实的信息未纳入日报。\u003c/p>\n\u003cp>工作日门禁来源：中国政府网《国务院办公厅关于2026年部分节假日安排的通知》（\u003ca href=\"https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-17\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-17\u003c/a> 为周四，不在 2026 年中秋节 2026-09-25 至 2026-09-27 或国庆节 2026-10-01 至 2026-10-07 等法定节假日范围内；2026-09-20（周日）为国庆节调休上班日，因此本周最后一个大陆法定工作日不是今天。\u003c/p>\n\u003cp>生产链接：\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-17\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": []}, {"date": "2026-09-16", "text": "# 亚马逊及海外市场情报增量日报｜2026-09-16\n\n## 今日判断\n\n今天有两项需要运营团队处理的实质更新，但没有发现 Amazon 对 Listing、A+、图片、Search Terms、FBA 费用或 SP/SB/SD 竞价计费规则发布新的全量强制变更。最高优先级是今天收口 US Amazon-optimized shipment splits 与 UK Prime Big Deal Days 入仓节点，避免促销 ASIN 到货、接收或可售库存缺口拖累 10 月大促。第二项是 EIA 9 月 15 日发布的美国柴油价格周更，显示柴油成本继续走高，需要供应链和财务用实际报价复核 Q4 landed cost 与促销毛利。今天是中国大陆法定工作日，但不是本周最后一个大陆法定工作日，不生成周报。\n\n## 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n| --- | --- | --- | --- | --- | --- |\n| P0 | US Amazon-optimized shipment splits 与 UK PBDD 入仓节点到期 | US/UK | FBA入仓、促销库存、供应链异常收口 | 2026-09-16 | 是。今天按 shipment ID 和促销 ASIN 拉清单，确认 FC receiving、available units、reserved units、缺口数量和替代履约方案 |\n| P1 | EIA 美国柴油价格 2026-09-15 周更 | US | 物流成本、补货毛利、促销折扣空间 | 2026-09-15 发布；2026-09-18 前复核 | 是。更新美国陆运/尾程成本模型，用实际货代报价验证是否影响 Q4 促销底价 |\n| P2 | 商业责任险 2026-11-02 新要求账号侧证据 | US/多站点 | 合规、账号健康、保险资料 | 2026-09-16 复查 | 是。若后台无通知，归档未收到截图；若有通知，整理保险公司、保额、被保险主体和 AIA 路径 |\n| P2 | Product Bundling 2026-09-30 风险清单 | US | Listing合规、bundle/kit/set/multipack/refill pages | 2026-09-18 风险清单复查 | 是。继续筛选 bundle、kit、set、multipack、refill pages 和异常变体关系 |\n\n## 今日新情报\n\n本次窗口为 2026-09-15 09:14:44 至 2026-09-16 09:14:19（Asia/Shanghai）。未发现符合增量标准的首次发现新事件；今天日报只纳入长期索引中已跟踪事项的实质更新。\n\n## 已有事件的重要更新\n\n### 1. US/UK Prime Big Deal Days 与 Q4 入仓节点\n\n- 历史事件：amz-q4-peak-holiday-2026-deadlines；amz-eu-q4-peak-holiday-2026-deadlines\n- 上次状态：2026-09-10 已将 US 2026-09-16 Amazon-optimized shipment splits 与 UK 2026-09-16 PBDD 入仓节点列为下一次执行节点；DE/FR/IT/ES 2026-09-09 节点已转入异常处理。\n- 本次新增变化：今天 2026-09-16 节点到期，状态从“节点前跟踪”升级为“当天收口”。Amazon 公开零售侧页面已确认 2026 年 Prime Big Deal Days 在 2026-10-06 至 2026-10-07 举行，进一步压缩促销 ASIN 的接收、上架和广告预热缓冲期。\n- 变化原因：大促前 FBA 入仓节点进入执行日，运营风险从计划延迟转为可售库存、接收异常和促销库存缺口。\n- 行动是否需要调整：升级为 P0 当天动作。供应链负责人今天 18:00 前导出 Seller Central > Inventory > Shipments 与 FBA Inventory，按 PBDD/Deal/高销量 ASIN 筛选 shipment ID、目的 FC、carrier ETA、received units、available units、reserved units、缺口数量；运营负责人同步检查 Manage Deals / Coupons 中参与大促的 ASIN 是否存在库存不足或促销不可执行风险。验收标准：每个促销 ASIN 有“足量可售 / 在途可接收 / 缺口及替代方案”三选一结论。\n- 来源：Amazon Seller Forums US Q4 holiday readiness（https://sellercentral.amazon.com/seller-forums/discussions/t/3e31fbb7-04e0-4ed4-873e-f74b1052e2ff）；Amazon Seller Forums Europe Q4/PBDD readiness（https://sellercentral-europe.amazon.com/seller-forums/discussions/t/6f722adc-b82b-4faa-b2dd-dd95869dca88）；About Amazon Prime Big Deal Days 日期公告（https://www.aboutamazon.com/news/retail/amazon-prime-big-deals-day-2026-when-october-6-7）。\n\n### 2. 美国柴油成本信号\n\n- 历史事件：us-eia-diesel-logistics-cost-signal-2026-09-09；us-bls-cpi-energy-logistics-cost-signal-2026-09-11\n- 上次状态：2026-09-14 已用 BLS 8 月 CPI 交叉确认能源成本压力，行动为 P2 landed cost 与促销毛利敏感性复核。\n- 本次新增变化：EIA 2026-09-15 周更显示，美国公路柴油价格继续处于高位，作为 US FBA 头程尾程、卡派和补货 ETA 成本复核信号。\n- 变化原因：旺季入仓与美国进口高峰叠加，能源成本会先影响卡车、尾程和仓配附加费，再传导到 Q4 促销底价与补货节奏。\n- 行动是否需要调整：保持 P1/P2 之间，今天先完成模型更新，不建议立即改价。供应链/财务负责人 2026-09-18 前把近 30 天美国陆运、尾程、仓储附加费实际报价写入 landed cost 模板，按相册、补充页、school memory book、portfolio binder、puzzle accessories 五类核算毛利率变化；若任一核心 ASIN 毛利率下降超过 1.5 个百分点或促销后毛利低于底线，提交价格/折扣调整建议。\n- 来源：U.S. EIA Gasoline and Diesel Fuel Update（https://www.eia.gov/petroleum/gasdiesel/）；U.S. BLS CPI 2026-09-11（https://www.bls.gov/news.release/cpi.nr0.htm）。\n\n## 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n| --- | --- | --- | --- | --- | --- | --- |\n| P0 | 导出 PBDD/Deal/高销量 ASIN 入仓与可售库存清单，逐个标记 received units、available units、reserved units、缺口数量和替代履约方案 | US/UK | 供应链 + 运营 | 2026-09-16 18:00 | 每个促销 ASIN 有明确库存状态和缺口处理人；缺口 ASIN 有取消促销、补货加急或广告降预算方案 | 2026-09-17 |\n| P1 | 更新美国 landed cost 模型中的陆运、尾程、仓配附加费，用近 30 天实际报价替代默认假设 | US | 供应链 + 财务 | 2026-09-18 | 五个核心产品线完成毛利率敏感性表；低于毛利底线的 ASIN 单独列出 | 2026-09-19 |\n| P2 | 归档商业责任险账号侧证据：是否收到 Seller Central 通知、适用类目、保险主体、AIA 要求和下一步资料缺口 | US/多站点 | 合规 + 财务 | 2026-09-16 | 有后台截图或未收到通知的检查记录；若命中要求，有资料清单和责任人 | 2026-09-18 |\n| P2 | 复核 bundle、kit、set、multipack、refill pages 和异常变体关系风险清单 | US | Listing + 合规 | 2026-09-18 | 输出 ASIN、父子关系、UPC/品牌一致性、是否制造商预包装、建议处理动作 | 2026-09-22 |\n\n## 持续关注\n\n- 事项：PBDD 与 Q4 促销 ASIN 可售库存。当前状态：2026-09-16 入仓节点到期，今天转为异常收口。下次复查日期：2026-09-17。触发升级条件：任一 PBDD/Deal ASIN 缺口超过目标促销量 10%，或 FC receiving 超过 48 小时未更新。\n- 事项：商业责任险 2026-11-02 要求。当前状态：公开官方线索存在，账号适用范围需后台确认。下次复查日期：2026-09-18。触发升级条件：后台出现强制通知、Account Health 提醒、AIA 添加入口或保险资料截止日。\n- 事项：USPS 2026 旺季临时包裹加价。当前状态：已跟踪 USPS 公告和 PRC/Buy Shipping 影响。下次复查日期：2026-09-18。触发升级条件：PRC 批准、USPS 生效确认或 Amazon Buy Shipping 同步费率公告。\n- 事项：Product Bundling 2026-09-30。当前状态：风险清单复查中。下次复查日期：2026-09-22。触发升级条件：Seller Central 出现 Account Health 提醒、ASIN 被抑制、bundle 政策文本或执行范围更新。\n\n## 情报边界与可信度\n\n本次核验来源约 11 个，其中官方/监管/一手来源约 8 个，包括中国政府网/国务院办公厅、Amazon Seller Central/Forums、About Amazon、EIA、BLS、CPSC、GOV.UK OPSS、USPS/PRC 既有跟踪源；非官方或行业辅助来源约 3 个，仅用于排重和背景判断。纳入日报的新事件 0 条；纳入已有事件重要更新 2 条。仍待确认事项 3 条：商业责任险对当前账号和 ASIN 的实际适用范围、USPS 2026 旺季包裹临时加价是否同步到 Amazon Buy Shipping、Product Bundling 2026-09-30 是否触发账号级提醒。\n\n排除项：本次窗口内未发现 Seller Central 对 Listing、A+、图片、搜索词、属性、变体、FBA 费用或库存限制发布新的全量强制变更；Amazon Ads 未发布 SP/SB/SD/DSP/AMC 计费、竞价、匹配或归因规则的全量强制变化；CPSC/OPSS 新增召回未发现与相册、补充页、school memory book、portfolio binder、puzzle accessories 直接匹配的高优先级动作；重复转述 Prime Big Deal Days、AI 购物和宏观消费趋势但无新增运营事实的内容未纳入日报。\n\n工作日门禁来源：中国政府网《国务院办公厅关于2026年部分节假日安排的通知》（https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-16 为周三，不在 2026 年中秋节 2026-09-25 至 2026-09-27 或国庆节 2026-10-01 至 2026-10-07 等法定节假日范围内，按中国大陆法定工作日运行；本周最后一个大陆法定工作日预计为 2026-09-18。\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-16\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-16\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报增量日报｜2026-09-16\u003c/h1>\n\u003ch2>今日判断\u003c/h2>\n\u003cp>今天有两项需要运营团队处理的实质更新，但没有发现 Amazon 对 Listing、A+、图片、Search Terms、FBA 费用或 SP/SB/SD 竞价计费规则发布新的全量强制变更。最高优先级是今天收口 US Amazon-optimized shipment splits 与 UK Prime Big Deal Days 入仓节点，避免促销 ASIN 到货、接收或可售库存缺口拖累 10 月大促。第二项是 EIA 9 月 15 日发布的美国柴油价格周更，显示柴油成本继续走高，需要供应链和财务用实际报价复核 Q4 landed cost 与促销毛利。今天是中国大陆法定工作日，但不是本周最后一个大陆法定工作日，不生成周报。\u003c/p>\n\u003ch2>优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>影响站点\u003c/th>\n\u003cth>影响模块\u003c/th>\n\u003cth>截止/生效日期\u003c/th>\n\u003cth>今天是否需要动作\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P0\u003c/td>\n\u003ctd>US Amazon-optimized shipment splits 与 UK PBDD 入仓节点到期\u003c/td>\n\u003ctd>US/UK\u003c/td>\n\u003ctd>FBA入仓、促销库存、供应链异常收口\u003c/td>\n\u003ctd>2026-09-16\u003c/td>\n\u003ctd>是。今天按 shipment ID 和促销 ASIN 拉清单，确认 FC receiving、available units、reserved units、缺口数量和替代履约方案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>EIA 美国柴油价格 2026-09-15 周更\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>物流成本、补货毛利、促销折扣空间\u003c/td>\n\u003ctd>2026-09-15 发布；2026-09-18 前复核\u003c/td>\n\u003ctd>是。更新美国陆运/尾程成本模型，用实际货代报价验证是否影响 Q4 促销底价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>商业责任险 2026-11-02 新要求账号侧证据\u003c/td>\n\u003ctd>US/多站点\u003c/td>\n\u003ctd>合规、账号健康、保险资料\u003c/td>\n\u003ctd>2026-09-16 复查\u003c/td>\n\u003ctd>是。若后台无通知，归档未收到截图；若有通知，整理保险公司、保额、被保险主体和 AIA 路径\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Product Bundling 2026-09-30 风险清单\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Listing合规、bundle/kit/set/multipack/refill pages\u003c/td>\n\u003ctd>2026-09-18 风险清单复查\u003c/td>\n\u003ctd>是。继续筛选 bundle、kit、set、multipack、refill pages 和异常变体关系\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>今日新情报\u003c/h2>\n\u003cp>本次窗口为 2026-09-15 09:14:44 至 2026-09-16 09:14:19（Asia/Shanghai）。未发现符合增量标准的首次发现新事件；今天日报只纳入长期索引中已跟踪事项的实质更新。\u003c/p>\n\u003ch2>已有事件的重要更新\u003c/h2>\n\u003ch3>1. US/UK Prime Big Deal Days 与 Q4 入仓节点\u003c/h3>\n\u003cul>\n\u003cli>历史事件：amz-q4-peak-holiday-2026-deadlines；amz-eu-q4-peak-holiday-2026-deadlines\u003c/li>\n\u003cli>上次状态：2026-09-10 已将 US 2026-09-16 Amazon-optimized shipment splits 与 UK 2026-09-16 PBDD 入仓节点列为下一次执行节点；DE/FR/IT/ES 2026-09-09 节点已转入异常处理。\u003c/li>\n\u003cli>本次新增变化：今天 2026-09-16 节点到期，状态从“节点前跟踪”升级为“当天收口”。Amazon 公开零售侧页面已确认 2026 年 Prime Big Deal Days 在 2026-10-06 至 2026-10-07 举行，进一步压缩促销 ASIN 的接收、上架和广告预热缓冲期。\u003c/li>\n\u003cli>变化原因：大促前 FBA 入仓节点进入执行日，运营风险从计划延迟转为可售库存、接收异常和促销库存缺口。\u003c/li>\n\u003cli>行动是否需要调整：升级为 P0 当天动作。供应链负责人今天 18:00 前导出 Seller Central &gt; Inventory &gt; Shipments 与 FBA Inventory，按 PBDD/Deal/高销量 ASIN 筛选 shipment ID、目的 FC、carrier ETA、received units、available units、reserved units、缺口数量；运营负责人同步检查 Manage Deals / Coupons 中参与大促的 ASIN 是否存在库存不足或促销不可执行风险。验收标准：每个促销 ASIN 有“足量可售 / 在途可接收 / 缺口及替代方案”三选一结论。\u003c/li>\n\u003cli>来源：Amazon Seller Forums US Q4 holiday readiness（\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/3e31fbb7-04e0-4ed4-873e-f74b1052e2ff）；Amazon\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/seller-forums/discussions/t/3e31fbb7-04e0-4ed4-873e-f74b1052e2ff）；Amazon\u003c/a> Seller Forums Europe Q4/PBDD readiness（\u003ca href=\"https://sellercentral-europe.amazon.com/seller-forums/discussions/t/6f722adc-b82b-4faa-b2dd-dd95869dca88）；About\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral-europe.amazon.com/seller-forums/discussions/t/6f722adc-b82b-4faa-b2dd-dd95869dca88）；About\u003c/a> Amazon Prime Big Deal Days 日期公告（\u003ca href=\"https://www.aboutamazon.com/news/retail/amazon-prime-big-deals-day-2026-when-october-6-7）。\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.aboutamazon.com/news/retail/amazon-prime-big-deals-day-2026-when-october-6-7）。\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch3>2. 美国柴油成本信号\u003c/h3>\n\u003cul>\n\u003cli>历史事件：us-eia-diesel-logistics-cost-signal-2026-09-09；us-bls-cpi-energy-logistics-cost-signal-2026-09-11\u003c/li>\n\u003cli>上次状态：2026-09-14 已用 BLS 8 月 CPI 交叉确认能源成本压力，行动为 P2 landed cost 与促销毛利敏感性复核。\u003c/li>\n\u003cli>本次新增变化：EIA 2026-09-15 周更显示，美国公路柴油价格继续处于高位，作为 US FBA 头程尾程、卡派和补货 ETA 成本复核信号。\u003c/li>\n\u003cli>变化原因：旺季入仓与美国进口高峰叠加，能源成本会先影响卡车、尾程和仓配附加费，再传导到 Q4 促销底价与补货节奏。\u003c/li>\n\u003cli>行动是否需要调整：保持 P1/P2 之间，今天先完成模型更新，不建议立即改价。供应链/财务负责人 2026-09-18 前把近 30 天美国陆运、尾程、仓储附加费实际报价写入 landed cost 模板，按相册、补充页、school memory book、portfolio binder、puzzle accessories 五类核算毛利率变化；若任一核心 ASIN 毛利率下降超过 1.5 个百分点或促销后毛利低于底线，提交价格/折扣调整建议。\u003c/li>\n\u003cli>来源：U.S. EIA Gasoline and Diesel Fuel Update（\u003ca href=\"https://www.eia.gov/petroleum/gasdiesel/）；U.S.\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.eia.gov/petroleum/gasdiesel/）；U.S.\u003c/a> BLS CPI 2026-09-11（\u003ca href=\"https://www.bls.gov/news.release/cpi.nr0.htm）。\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.bls.gov/news.release/cpi.nr0.htm）。\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P0\u003c/td>\n\u003ctd>导出 PBDD/Deal/高销量 ASIN 入仓与可售库存清单，逐个标记 received units、available units、reserved units、缺口数量和替代履约方案\u003c/td>\n\u003ctd>US/UK\u003c/td>\n\u003ctd>供应链 + 运营\u003c/td>\n\u003ctd>2026-09-16 18:00\u003c/td>\n\u003ctd>每个促销 ASIN 有明确库存状态和缺口处理人；缺口 ASIN 有取消促销、补货加急或广告降预算方案\u003c/td>\n\u003ctd>2026-09-17\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>更新美国 landed cost 模型中的陆运、尾程、仓配附加费，用近 30 天实际报价替代默认假设\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>供应链 + 财务\u003c/td>\n\u003ctd>2026-09-18\u003c/td>\n\u003ctd>五个核心产品线完成毛利率敏感性表；低于毛利底线的 ASIN 单独列出\u003c/td>\n\u003ctd>2026-09-19\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>归档商业责任险账号侧证据：是否收到 Seller Central 通知、适用类目、保险主体、AIA 要求和下一步资料缺口\u003c/td>\n\u003ctd>US/多站点\u003c/td>\n\u003ctd>合规 + 财务\u003c/td>\n\u003ctd>2026-09-16\u003c/td>\n\u003ctd>有后台截图或未收到通知的检查记录；若命中要求，有资料清单和责任人\u003c/td>\n\u003ctd>2026-09-18\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>复核 bundle、kit、set、multipack、refill pages 和异常变体关系风险清单\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Listing + 合规\u003c/td>\n\u003ctd>2026-09-18\u003c/td>\n\u003ctd>输出 ASIN、父子关系、UPC/品牌一致性、是否制造商预包装、建议处理动作\u003c/td>\n\u003ctd>2026-09-22\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>持续关注\u003c/h2>\n\u003cul>\n\u003cli>事项：PBDD 与 Q4 促销 ASIN 可售库存。当前状态：2026-09-16 入仓节点到期，今天转为异常收口。下次复查日期：2026-09-17。触发升级条件：任一 PBDD/Deal ASIN 缺口超过目标促销量 10%，或 FC receiving 超过 48 小时未更新。\u003c/li>\n\u003cli>事项：商业责任险 2026-11-02 要求。当前状态：公开官方线索存在，账号适用范围需后台确认。下次复查日期：2026-09-18。触发升级条件：后台出现强制通知、Account Health 提醒、AIA 添加入口或保险资料截止日。\u003c/li>\n\u003cli>事项：USPS 2026 旺季临时包裹加价。当前状态：已跟踪 USPS 公告和 PRC/Buy Shipping 影响。下次复查日期：2026-09-18。触发升级条件：PRC 批准、USPS 生效确认或 Amazon Buy Shipping 同步费率公告。\u003c/li>\n\u003cli>事项：Product Bundling 2026-09-30。当前状态：风险清单复查中。下次复查日期：2026-09-22。触发升级条件：Seller Central 出现 Account Health 提醒、ASIN 被抑制、bundle 政策文本或执行范围更新。\u003c/li>\n\u003c/ul>\n\u003ch2>情报边界与可信度\u003c/h2>\n\u003cp>本次核验来源约 11 个，其中官方/监管/一手来源约 8 个，包括中国政府网/国务院办公厅、Amazon Seller Central/Forums、About Amazon、EIA、BLS、CPSC、GOV.UK OPSS、USPS/PRC 既有跟踪源；非官方或行业辅助来源约 3 个，仅用于排重和背景判断。纳入日报的新事件 0 条；纳入已有事件重要更新 2 条。仍待确认事项 3 条：商业责任险对当前账号和 ASIN 的实际适用范围、USPS 2026 旺季包裹临时加价是否同步到 Amazon Buy Shipping、Product Bundling 2026-09-30 是否触发账号级提醒。\u003c/p>\n\u003cp>排除项：本次窗口内未发现 Seller Central 对 Listing、A+、图片、搜索词、属性、变体、FBA 费用或库存限制发布新的全量强制变更；Amazon Ads 未发布 SP/SB/SD/DSP/AMC 计费、竞价、匹配或归因规则的全量强制变化；CPSC/OPSS 新增召回未发现与相册、补充页、school memory book、portfolio binder、puzzle accessories 直接匹配的高优先级动作；重复转述 Prime Big Deal Days、AI 购物和宏观消费趋势但无新增运营事实的内容未纳入日报。\u003c/p>\n\u003cp>工作日门禁来源：中国政府网《国务院办公厅关于2026年部分节假日安排的通知》（\u003ca href=\"https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-16\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-16\u003c/a> 为周三，不在 2026 年中秋节 2026-09-25 至 2026-09-27 或国庆节 2026-10-01 至 2026-10-07 等法定节假日范围内，按中国大陆法定工作日运行；本周最后一个大陆法定工作日预计为 2026-09-18。\u003c/p>\n\u003cp>生产链接：\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-16\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-09-16", "text": "### 1. US/UK Prime Big Deal Days 与 Q4 入仓节点\n\n- 历史事件：amz-q4-peak-holiday-2026-deadlines；amz-eu-q4-peak-holiday-2026-deadlines\n- 上次状态：2026-09-10 已将 US 2026-09-16 Amazon-optimized shipment splits 与 UK 2026-09-16 PBDD 入仓节点列为下一次执行节点；DE/FR/IT/ES 2026-09-09 节点已转入异常处理。\n- 本次新增变化：今天 2026-09-16 节点到期，状态从“节点前跟踪”升级为“当天收口”。Amazon 公开零售侧页面已确认 2026 年 Prime Big Deal Days 在 2026-10-06 至 2026-10-07 举行，进一步压缩促销 ASIN 的接收、上架和广告预热缓冲期。\n- 变化原因：大促前 FBA 入仓节点进入执行日，运营风险从计划延迟转为可售库存、接收异常和促销库存缺口。\n- 行动是否需要调整：升级为 P0 当天动作。供应链负责人今天 18:00 前导出 Seller Central > Inventory > Shipments 与 FBA Inventory，按 PBDD/Deal/高销量 ASIN 筛选 shipment ID、目的 FC、carrier ETA、received units、available units、reserved units、缺口数量；运营负责人同步检查 Manage Deals / Coupons 中参与大促的 ASIN 是否存在库存不足或促销不可执行风险。验收标准：每个促销 ASIN 有“足量可售 / 在途可接收 / 缺口及替代方案”三选一结论。\n- 来源：Amazon Seller Forums US Q4 holiday readiness（https://sellercentral.amazon.com/seller-forums/discussions/t/3e31fbb7-04e0-4ed4-873e-f74b1052e2ff）；Amazon Seller Forums Europe Q4/PBDD readiness（https://sellercentral-europe.amazon.com/seller-forums/discussions/t/6f722adc-b82b-4faa-b2dd-dd95869dca88）；About Amazon Prime Big Deal Days 日期公告（https://www.aboutamazon.com/news/retail/amazon-prime-big-deals-day-2026-when-october-6-7）。\n\n", "title": "1. US/UK Prime Big Deal Days 与 Q4 入仓节点", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-16\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-16\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>1. US/UK Prime Big Deal Days 与 Q4 入仓节点\u003c/h3>\n\u003cul>\n\u003cli>历史事件：amz-q4-peak-holiday-2026-deadlines；amz-eu-q4-peak-holiday-2026-deadlines\u003c/li>\n\u003cli>上次状态：2026-09-10 已将 US 2026-09-16 Amazon-optimized shipment splits 与 UK 2026-09-16 PBDD 入仓节点列为下一次执行节点；DE/FR/IT/ES 2026-09-09 节点已转入异常处理。\u003c/li>\n\u003cli>本次新增变化：今天 2026-09-16 节点到期，状态从“节点前跟踪”升级为“当天收口”。Amazon 公开零售侧页面已确认 2026 年 Prime Big Deal Days 在 2026-10-06 至 2026-10-07 举行，进一步压缩促销 ASIN 的接收、上架和广告预热缓冲期。\u003c/li>\n\u003cli>变化原因：大促前 FBA 入仓节点进入执行日，运营风险从计划延迟转为可售库存、接收异常和促销库存缺口。\u003c/li>\n\u003cli>行动是否需要调整：升级为 P0 当天动作。供应链负责人今天 18:00 前导出 Seller Central &gt; Inventory &gt; Shipments 与 FBA Inventory，按 PBDD/Deal/高销量 ASIN 筛选 shipment ID、目的 FC、carrier ETA、received units、available units、reserved units、缺口数量；运营负责人同步检查 Manage Deals / Coupons 中参与大促的 ASIN 是否存在库存不足或促销不可执行风险。验收标准：每个促销 ASIN 有“足量可售 / 在途可接收 / 缺口及替代方案”三选一结论。\u003c/li>\n\u003cli>来源：Amazon Seller Forums US Q4 holiday readiness（\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/3e31fbb7-04e0-4ed4-873e-f74b1052e2ff）；Amazon\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/seller-forums/discussions/t/3e31fbb7-04e0-4ed4-873e-f74b1052e2ff）；Amazon\u003c/a> Seller Forums Europe Q4/PBDD readiness（\u003ca href=\"https://sellercentral-europe.amazon.com/seller-forums/discussions/t/6f722adc-b82b-4faa-b2dd-dd95869dca88）；About\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral-europe.amazon.com/seller-forums/discussions/t/6f722adc-b82b-4faa-b2dd-dd95869dca88）；About\u003c/a> Amazon Prime Big Deal Days 日期公告（\u003ca href=\"https://www.aboutamazon.com/news/retail/amazon-prime-big-deals-day-2026-when-october-6-7）。\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.aboutamazon.com/news/retail/amazon-prime-big-deals-day-2026-when-october-6-7）。\u003c/a>\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-16\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-16", "text": "### 2. 美国柴油成本信号\n\n- 历史事件：us-eia-diesel-logistics-cost-signal-2026-09-09；us-bls-cpi-energy-logistics-cost-signal-2026-09-11\n- 上次状态：2026-09-14 已用 BLS 8 月 CPI 交叉确认能源成本压力，行动为 P2 landed cost 与促销毛利敏感性复核。\n- 本次新增变化：EIA 2026-09-15 周更显示，美国公路柴油价格继续处于高位，作为 US FBA 头程尾程、卡派和补货 ETA 成本复核信号。\n- 变化原因：旺季入仓与美国进口高峰叠加，能源成本会先影响卡车、尾程和仓配附加费，再传导到 Q4 促销底价与补货节奏。\n- 行动是否需要调整：保持 P1/P2 之间，今天先完成模型更新，不建议立即改价。供应链/财务负责人 2026-09-18 前把近 30 天美国陆运、尾程、仓储附加费实际报价写入 landed cost 模板，按相册、补充页、school memory book、portfolio binder、puzzle accessories 五类核算毛利率变化；若任一核心 ASIN 毛利率下降超过 1.5 个百分点或促销后毛利低于底线，提交价格/折扣调整建议。\n- 来源：U.S. EIA Gasoline and Diesel Fuel Update（https://www.eia.gov/petroleum/gasdiesel/）；U.S. BLS CPI 2026-09-11（https://www.bls.gov/news.release/cpi.nr0.htm）。\n\n", "title": "2. 美国柴油成本信号", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09 ：2026-09-14 已用 BLS 8 月 CPI 交叉确认能源成本压力，行动为 P2 landed cost 与促销毛利敏感性复核。\u003c/li>\n\u003cli>本次新增变化：EIA 2026-09-15 周更显示，美国公路柴油价格继续处于高位，作为 US FBA 头程尾程、卡派和补货 ETA 成本复核信号。\u003c/li>\n\u003cli>变化原因：旺季入仓与美国进口高峰叠加，能源成本会先影响卡车、尾程和仓配附加费，再传导到 Q4 促销底价与补货节奏。\u003c/li>\n\u003cli>行动是否需要调整：保持 P1/P2 之间，今天先完成模型更新，不建议立即改价。供应链/财务负责人 2026-09-18 前把近 30 天美国陆运、尾程、仓储附加费实际报价写入 landed cost 模板，按相册、补充页、school memory book、portfolio binder、puzzle accessories 五类核算毛利率变化；若任一核心 ASIN 毛利率下降超过 1.5 个百分点或促销后毛利低于底线，提交价格/折扣调整建议。\u003c/li>\n\u003cli>来源：U.S. EIA Gasoline and Diesel Fuel Update（\u003ca href=\"https://www.eia.gov/petroleum/gasdiesel/）；U.S.\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.eia.gov/petroleum/gasdiesel/）；U.S.\u003c/a> BLS CPI 2026-09-11（\u003ca href=\"https://www.bls.gov/news.release/cpi.nr0.htm）。\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.bls.gov/news.release/cpi.nr0.htm）。\u003c/a>\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-16\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}]}, {"date": "2026-09-15", "text": "# 亚马逊及海外市场情报增量日报｜2026-09-15\n\n## 今日判断\n\n今日无重大运营变化。本次窗口为 2026-09-14 09:18:22 至 2026-09-15 09:14:44（Asia/Shanghai），未发现 Amazon US/UK/DE/FR/IT/ES 对 Seller Central Listing、图片、A+、Search Terms、FBA 费用、SP/SB/SD/DSP/AMC 计费口径发布新的全量强制变更。今天最高优先级是把 2026-09-16 前 UK PBDD 与 US Amazon-optimized shipment splits 入仓节点收口，并在今天完成商业责任险账号侧证据归档。今天不是本周最后一个中国大陆法定工作日，不生成周报。\n\n## 临近事项\n\n| 优先级 | 事项 | 影响站点 | 当前状态 | 截止/复查日期 | 今天是否需要动作 |\n| --- | --- | --- | --- | --- | --- |\n| P1 | UK PBDD 与 US Amazon-optimized shipment splits 入仓节点 | UK/US | 已跟踪事项，无新增 Amazon 官方事实 | 2026-09-16 | 今天更新促销 ASIN 的 shipment ID、ETA、FC receiving、available units、缺口数量和替代履约方案 |\n| P1 | 商业责任险 2026-11-02 新要求账号侧证据 | US/多站点 | 已有 Amazon 官方线索，账号适用范围仍需后台确认 | 2026-09-15 | 今天归档 Seller Central 原始通知截图；若未收到，保留未收到记录、账号截图和检查人 |\n| P2 | Product Bundling 2026-09-30 风险清单 | US | 已跟踪事项，今日未见新政策文本 | 2026-09-18 | 继续筛选 bundle、kit、set、multipack、refill pages、variation relationship 命中 ASIN |\n\n## 情报边界与可信度\n\n本次核验来源约 10 个，其中官方/监管/一手来源约 7 个，包括中国政府网/国务院办公厅、Amazon Seller Central/Forums、Amazon Ads、CPSC、GOV.UK OPSS、USTR/Federal Register、USPS/PRC 既有跟踪源；非官方或行业辅助来源约 3 个，仅用于排重和背景判断。纳入日报的新事件 0 条；纳入已有事件重要更新 0 条。仍待确认事项 2 条：商业责任险要求对当前账号和 ASIN 的实际适用范围，以及 USPS 2026 旺季包裹临时加价是否获 PRC 审核并同步到 Amazon Buy Shipping。\n\n排除项：本次窗口内未发现 Seller Central 对 Listing、A+、图片、搜索词、属性、变体、FBA 费用或库存限制发布新的强制变更；Amazon Ads 未发布 SP/SB/SD/DSP/AMC 计费、竞价、匹配或归因规则的全量强制变化；CPSC/OPSS 新增召回未发现与相册、补充页、school memory book、portfolio binder、puzzle accessories 直接匹配的高优先级动作；USTR 贸易壁垒征求意见属于政策输入窗口，不构成今天的进口成本或平台规则变更。\n\n工作日门禁来源：中国政府网《国务院办公厅关于2026年部分节假日安排的通知》（https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-15 为周二，不在 2026 年中秋节 2026-09-25 至 2026-09-27 或国庆节 2026-10-01 至 2026-10-07 等法定节假日范围内，按中国大陆法定工作日运行；本周最后一个大陆法定工作日预计为 2026-09-18。\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-15\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-15\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报增量日报｜2026-09-15\u003c/h1>\n\u003ch2>今日判断\u003c/h2>\n\u003cp>今日无重大运营变化。本次窗口为 2026-09-14 09:18:22 至 2026-09-15 09:14:44（Asia/Shanghai），未发现 Amazon US/UK/DE/FR/IT/ES 对 Seller Central Listing、图片、A+、Search Terms、FBA 费用、SP/SB/SD/DSP/AMC 计费口径发布新的全量强制变更。今天最高优先级是把 2026-09-16 前 UK PBDD 与 US Amazon-optimized shipment splits 入仓节点收口，并在今天完成商业责任险账号侧证据归档。今天不是本周最后一个中国大陆法定工作日，不生成周报。\u003c/p>\n\u003ch2>临近事项\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>影响站点\u003c/th>\n\u003cth>当前状态\u003c/th>\n\u003cth>截止/复查日期\u003c/th>\n\u003cth>今天是否需要动作\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>UK PBDD 与 US Amazon-optimized shipment splits 入仓节点\u003c/td>\n\u003ctd>UK/US\u003c/td>\n\u003ctd>已跟踪事项，无新增 Amazon 官方事实\u003c/td>\n\u003ctd>2026-09-16\u003c/td>\n\u003ctd>今天更新促销 ASIN 的 shipment ID、ETA、FC receiving、available units、缺口数量和替代履约方案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>商业责任险 2026-11-02 新要求账号侧证据\u003c/td>\n\u003ctd>US/多站点\u003c/td>\n\u003ctd>已有 Amazon 官方线索，账号适用范围仍需后台确认\u003c/td>\n\u003ctd>2026-09-15\u003c/td>\n\u003ctd>今天归档 Seller Central 原始通知截图；若未收到，保留未收到记录、账号截图和检查人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Product Bundling 2026-09-30 风险清单\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>已跟踪事项，今日未见新政策文本\u003c/td>\n\u003ctd>2026-09-18\u003c/td>\n\u003ctd>继续筛选 bundle、kit、set、multipack、refill pages、variation relationship 命中 ASIN\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>情报边界与可信度\u003c/h2>\n\u003cp>本次核验来源约 10 个，其中官方/监管/一手来源约 7 个，包括中国政府网/国务院办公厅、Amazon Seller Central/Forums、Amazon Ads、CPSC、GOV.UK OPSS、USTR/Federal Register、USPS/PRC 既有跟踪源；非官方或行业辅助来源约 3 个，仅用于排重和背景判断。纳入日报的新事件 0 条；纳入已有事件重要更新 0 条。仍待确认事项 2 条：商业责任险要求对当前账号和 ASIN 的实际适用范围，以及 USPS 2026 旺季包裹临时加价是否获 PRC 审核并同步到 Amazon Buy Shipping。\u003c/p>\n\u003cp>排除项：本次窗口内未发现 Seller Central 对 Listing、A+、图片、搜索词、属性、变体、FBA 费用或库存限制发布新的强制变更；Amazon Ads 未发布 SP/SB/SD/DSP/AMC 计费、竞价、匹配或归因规则的全量强制变化；CPSC/OPSS 新增召回未发现与相册、补充页、school memory book、portfolio binder、puzzle accessories 直接匹配的高优先级动作；USTR 贸易壁垒征求意见属于政策输入窗口，不构成今天的进口成本或平台规则变更。\u003c/p>\n\u003cp>工作日门禁来源：中国政府网《国务院办公厅关于2026年部分节假日安排的通知》（\u003ca href=\"https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-15\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-15\u003c/a> 为周二，不在 2026 年中秋节 2026-09-25 至 2026-09-27 或国庆节 2026-10-01 至 2026-10-07 等法定节假日范围内，按中国大陆法定工作日运行；本周最后一个大陆法定工作日预计为 2026-09-18。\u003c/p>\n\u003cp>生产链接：\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-15\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": []}, {"date": "2026-09-14", "text": "# 亚马逊及海外市场情报增量日报｜2026-09-14\n\n## 1. 今日判断\n\n今日没有发现 Amazon US/UK/DE/FR/IT/ES 对 Seller Central Listing、图片、A+、Search Terms、FBA 费用、SP/SB/SD/DSP/AMC 计费口径发布新的全量强制变更。今天最高优先级不是改后台字段，而是把 2026-09-16 前 UK PBDD 与 US Amazon-optimized shipment splits 入仓节点收口，并补齐商业责任险账号后台证据。新增情报中，Amazon Ads 与 OpenAI/ChatGPT 的官方集成是 AI 广告流量入口变化，短期只影响被邀请的广告主，但需要 PPC 与品牌内容团队提前准备可验证的 ASIN/品牌语义素材。美国 2026 年 8 月 CPI 显示能源成本回升，应作为 US 旺季物流、退货补发和低价促销毛利复核信号。今天不是本周最后一个中国大陆法定工作日，不生成周报。\n\n## 2. 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n| --- | --- | --- | --- | --- | --- |\n| P1 | UK PBDD 与 US Amazon-optimized shipment splits 入仓节点 | UK/US | FBA / Inventory / Deals | 2026-09-16 | 今天更新促销 ASIN ETA、FC receiving、可售库存缺口和替代履约方案 |\n| P1 | 商业责任险 2026-11-02 新要求账号侧证据仍需归档 | US/多站点 | Compliance / Account Health / Insurance | 2026-09-15 | 若未完成，今天补齐 Seller Central 原始通知截图或未收到记录 |\n| P2 | Amazon Ads 与 OpenAI/ChatGPT 官方集成试点 | US 优先/多站点观察 | DSP / AI Ads / Brand Content | 2026-09-10 | 检查是否有 DSP 邀请；未被邀请则准备语义素材与监控方案 |\n| P2 | 美国 CPI 能源项回升，旺季物流成本需复核 | US | Pricing / Landed Cost / Logistics | 2026-09-11 | 更新 Top 20 和促销 ASIN 的物流成本敏感性，不因单月 CPI 直接调价 |\n\n## 3. 今日新情报\n\n### Amazon Ads 与 OpenAI/ChatGPT 推出官方广告集成试点\n\n- 【影响等级】P2\n- 【站点】US 优先/多站点观察\n- 【发布日期】2026-09-10\n- 【生效日期】暂未公布\n- 【信息状态】Amazon Ads 官方公告 / 试点中\n- 【来源】Amazon Ads：https://advertising.amazon.com/library/news/amazon-ads-chat-gpt-advertising-integration\n- 发生了什么：Amazon Ads 宣布与 OpenAI 建立新的广告集成，首阶段让部分广告主可以通过 Amazon DSP 在 ChatGPT 内相关对话场景展示产品或服务广告。公告未显示这是所有 Seller Central 广告主可自助启用的新广告位，也未发布 SP/SB/SD 计费、匹配或竞价规则变更。\n- 我们怎么看：这代表 AI 对话场景正在成为 Amazon Ads 的外部流量入口，短期对未使用 DSP 或未被邀请的账号没有直接后台动作。对相册、补充页、school memory book、portfolio binder、puzzle accessories 这类非标长尾需求产品，长期影响在于 AI 能否理解用途、场景、材质、尺寸、适配关系和送礼场景；Listing 语义、A+ 信息完整度和品牌内容一致性会影响未来 AI 广告与自然推荐质量。\n- 建议动作：PPC/品牌内容在 2026-09-18 前完成一次 AI 广告准备清单：确认 Amazon DSP 或 agency contact 是否有 ChatGPT placement/integration 邀请；整理 Top 20 ASIN 的核心使用场景、尺寸/页数、材质、适配对象、礼品季节、负面不适用场景；检查 Store、A+、Brand Story、Sponsored Brands 落地页是否能回答“适合谁、解决什么问题、为什么比竞品更可信”。验收标准：若被邀请试点，输出预算上限、转化归因、增量流量监控字段和暂停条件；若未被邀请，仅观察，暂不调整 SP/SB/SD 结构。\n\n### 美国 8 月 CPI 能源项回升，US 旺季物流成本需要重新压测\n\n- 【影响等级】P2\n- 【站点】US\n- 【发布日期】2026-09-11\n- 【生效日期】2026-09-11\n- 【信息状态】政府经济数据\n- 【来源】U.S. Bureau of Labor Statistics：https://www.bls.gov/news.release/cpi.nr0.htm\n- 发生了什么：BLS 发布 2026 年 8 月 CPI，CPI-U 环比上升 0.4%，过去 12 个月上升 3.0%；能源指数环比上升 2.1%，其中汽油指数上升 3.9%。这不是 Amazon 费用公告，但会影响 US domestic trucking、FBM、自配送、退货补发和低价配件订单的成本敏感性。\n- 我们怎么看：对体积型纸制品和相册类产品，CPI 不应直接触发前台涨价，但应进入 Q4 landed cost 和促销利润复核。若同时叠加 NRF 9 月进口高峰、Drewry 跨太平洋航线小幅上行和 USPS 旺季包裹临时加价待审，低客单价、远区配送、退货率高或促销折扣深的 ASIN 毛利缓冲会变薄。\n- 建议动作：供应链/财务在 2026-09-17 前重算 US Top 20 ASIN、PBDD/黑五促销 ASIN、库存覆盖低于 45 天 ASIN 的 landed cost。字段包括 FBA inbound 单件成本、海运/卡派/仓储摊销、FBM/补发邮费、退货处理成本、广告前贡献利润率、促销后贡献利润率。验收标准：若贡献利润率较目标低于 3 个百分点，输出“降折扣、降广告预算、提价、换包装/箱规、暂不参加促销”中的一项决策；否则仅记录成本模型版本，不做前台动作。\n\n## 4. 已有事件的重要更新\n\n### US 物流成本信号获得 BLS CPI 能源数据交叉确认\n\n- 历史事件：us-eia-diesel-logistics-cost-signal-2026-09-09\n- 上次状态：2026-09-10 已用 EIA 柴油数据作为 Q4 US 物流成本信号，要求更新 US landed cost、FBM、退货补发和促销毛利敏感性。\n- 本次新增变化：BLS 2026-09-11 CPI 显示 8 月能源指数环比上升 2.1%、汽油环比上升 3.9%，与 US 旺季物流成本复核方向一致。\n- 变化原因：美国能源价格回升会传导到干线、卡派、末端配送、退货补发和第三方仓储报价，但 BLS CPI 是宏观数据，不能替代货代、卡派和 Amazon Buy Shipping 实际费率。\n- 行动是否需要调整：继续原动作，不升级为 P1 强制调价。把复核截止日从 2026-09-15 延至 2026-09-17，并要求以实际物流报价和订单毛利为最终依据；只有当实际物流成本较预算上升超过 5%，或促销后贡献利润率低于目标 3 个百分点以上，才升级为价格/促销/广告联动调整。\n\n## 5. 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n| --- | --- | --- | --- | --- | --- | --- |\n| P1 | 完成 UK PBDD 与 US Amazon-optimized shipment splits 2026-09-16 节点前风险表 | UK/US | 运营/供应链 | 2026-09-15 | 促销 ASIN 100% 有 shipment ID、ETA、FC receiving、available units、缺口数量和替代方案 | 2026-09-16 |\n| P1 | 归档商业责任险新要求账号后台证据 | US/多站点 | 合规/财务 | 2026-09-15 | 有 Seller Central 原始通知截图或未收到记录；保单主体、到期日、承保站点、AIA 路径和 enhanced safety ASIN 清单齐全 | 2026-09-16 |\n| P2 | 建立 ChatGPT/Amazon DSP 试点观察与素材准备清单 | US/多站点 | PPC/品牌内容 | 2026-09-18 | 确认是否有 DSP 邀请；Top 20 ASIN 有场景、属性、适配对象、禁用场景、落地页和监控字段 | 2026-09-25 |\n| P2 | 更新 US landed cost 与促销毛利敏感性 | US | 供应链/财务 | 2026-09-17 | Top 20、促销、库存覆盖低于 45 天 ASIN 均有新版成本、贡献利润率和调价/限促判断 | 2026-09-19 |\n| P2 | 复查 Product Bundling 2026-09-30 风险清单 | US | Listing/合规 | 2026-09-18 | bundle、kit、set、multipack、refill pages、variation relationship 命中 ASIN 有合规证据或修订计划 | 2026-09-22 |\n\n## 6. 持续关注\n\n| 事项 | 当前状态 | 下次复查日期 | 触发升级条件 |\n| --- | --- | --- | --- |\n| UK/US PBDD 与 Q4 入仓节点 | UK PBDD 与 US Amazon-optimized shipment splits 下一关键日期为 2026-09-16 | 2026-09-16 | 促销 SKU ETA 晚于 2026-09-16、FC receiving 异常或可售库存低于活动需求时升级 |\n| 商业责任险 2026-11-02 新要求 | Amazon 官方线索已出现，账号适用范围仍需 Seller Central 后台确认 | 2026-09-16 | 账号收到保险通知、AIA 强制路径或 enhanced safety ASIN 保险请求时升级 |\n| Amazon Ads 与 ChatGPT 集成 | Amazon Ads 官方公告已发布，当前为部分广告主试点，无全量自助入口 | 2026-09-25 | 账号收到 DSP 邀请、Amazon Ads 发布自助入口或出现可量化流量/转化报告字段时升级 |\n| USPS 2026 旺季临时包裹加价 | USPS 已提交 PRC 审核，尚未见最终同步到 Amazon Buy Shipping 的公开结果 | 2026-09-18 | PRC 审核通过或 Amazon Buy Shipping 费率表出现对应旺季加价时升级 |\n| US 产品安全监管召回 | CPSC 9 月 10 日 Amazon.com 渠道儿童玩具召回已进入筛查清单 | 2026-09-18 | 自有 ASIN 命中儿童玩具、电池、铅漆、磁吸、小零件或供应商文件缺失时升级 |\n\n## 7. 情报边界与可信度\n\n本次核验来源约 12 个，其中官方/监管/一手来源约 8 个，包括中国政府网/国务院办公厅、Amazon Ads、Amazon Seller Central/Forums、BLS、CPSC、GOV.UK OPSS、USPS/PRC、Drewry/NRF 既有跟踪源；非官方或行业辅助来源约 4 个，仅用于发现重复报道和背景判断。纳入日报的新事件 2 条；纳入已有事件重要更新 1 条。仍待确认事项 2 条：商业责任险要求对当前账号和 ASIN 的实际适用范围，以及 USPS 2026 旺季包裹临时加价是否获 PRC 审核并同步到 Amazon Buy Shipping。\n\n排除项：本次窗口内未发现 Seller Central 对 Listing、A+、图片、搜索词、属性、变体、FBA 费用或库存限制发布新的强制变更；Amazon Ads 未发布 SP/SB/SD/DSP/AMC 计费、竞价、匹配或归因规则的全量强制变化；CPSC/OPSS 新增低相关召回未进入待办；Perplexity/AI 购物代理、Google Merchant Center 视频项等行业新闻没有新的 Amazon 官方执行口径，暂不作为团队动作。\n\n工作日门禁来源：中国政府网《国务院办公厅关于2026年部分节假日安排的通知》（https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-14 为周一，不在 2026 年中秋节 2026-09-25 至 2026-09-27 或国庆节 2026-10-01 至 2026-10-07 等法定节假日范围内，按中国大陆法定工作日运行；本周后续最后一个大陆法定工作日预计为 2026-09-18，今天不追加周报。\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-14\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-14\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报增量日报｜2026-09-14\u003c/h1>\n\u003ch2>1. 今日判断\u003c/h2>\n\u003cp>今日没有发现 Amazon US/UK/DE/FR/IT/ES 对 Seller Central Listing、图片、A+、Search Terms、FBA 费用、SP/SB/SD/DSP/AMC 计费口径发布新的全量强制变更。今天最高优先级不是改后台字段，而是把 2026-09-16 前 UK PBDD 与 US Amazon-optimized shipment splits 入仓节点收口，并补齐商业责任险账号后台证据。新增情报中，Amazon Ads 与 OpenAI/ChatGPT 的官方集成是 AI 广告流量入口变化，短期只影响被邀请的广告主，但需要 PPC 与品牌内容团队提前准备可验证的 ASIN/品牌语义素材。美国 2026 年 8 月 CPI 显示能源成本回升，应作为 US 旺季物流、退货补发和低价促销毛利复核信号。今天不是本周最后一个中国大陆法定工作日，不生成周报。\u003c/p>\n\u003ch2>2. 优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>影响站点\u003c/th>\n\u003cth>影响模块\u003c/th>\n\u003cth>截止/生效日期\u003c/th>\n\u003cth>今天是否需要动作\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>UK PBDD 与 US Amazon-optimized shipment splits 入仓节点\u003c/td>\n\u003ctd>UK/US\u003c/td>\n\u003ctd>FBA / Inventory / Deals\u003c/td>\n\u003ctd>2026-09-16\u003c/td>\n\u003ctd>今天更新促销 ASIN ETA、FC receiving、可售库存缺口和替代履约方案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>商业责任险 2026-11-02 新要求账号侧证据仍需归档\u003c/td>\n\u003ctd>US/多站点\u003c/td>\n\u003ctd>Compliance / Account Health / Insurance\u003c/td>\n\u003ctd>2026-09-15\u003c/td>\n\u003ctd>若未完成，今天补齐 Seller Central 原始通知截图或未收到记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Amazon Ads 与 OpenAI/ChatGPT 官方集成试点\u003c/td>\n\u003ctd>US 优先/多站点观察\u003c/td>\n\u003ctd>DSP / AI Ads / Brand Content\u003c/td>\n\u003ctd>2026-09-10\u003c/td>\n\u003ctd>检查是否有 DSP 邀请；未被邀请则准备语义素材与监控方案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>美国 CPI 能源项回升，旺季物流成本需复核\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Pricing / Landed Cost / Logistics\u003c/td>\n\u003ctd>2026-09-11\u003c/td>\n\u003ctd>更新 Top 20 和促销 ASIN 的物流成本敏感性，不因单月 CPI 直接调价\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>3. 今日新情报\u003c/h2>\n\u003ch3>Amazon Ads 与 OpenAI/ChatGPT 推出官方广告集成试点\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】US 优先/多站点观察\u003c/li>\n\u003cli>【发布日期】2026-09-10\u003c/li>\n\u003cli>【生效日期】暂未公布\u003c/li>\n\u003cli>【信息状态】Amazon Ads 官方公告 / 试点中\u003c/li>\n\u003cli>【来源】Amazon Ads：\u003ca href=\"https://advertising.amazon.com/library/news/amazon-ads-chat-gpt-advertising-integration\" target=\"_blank\" rel=\"noopener noreferrer\">https://advertising.amazon.com/library/news/amazon-ads-chat-gpt-advertising-integration\u003c/a>\u003c/li>\n\u003cli>发生了什么：Amazon Ads 宣布与 OpenAI 建立新的广告集成，首阶段让部分广告主可以通过 Amazon DSP 在 ChatGPT 内相关对话场景展示产品或服务广告。公告未显示这是所有 Seller Central 广告主可自助启用的新广告位，也未发布 SP/SB/SD 计费、匹配或竞价规则变更。\u003c/li>\n\u003cli>我们怎么看：这代表 AI 对话场景正在成为 Amazon Ads 的外部流量入口，短期对未使用 DSP 或未被邀请的账号没有直接后台动作。对相册、补充页、school memory book、portfolio binder、puzzle accessories 这类非标长尾需求产品，长期影响在于 AI 能否理解用途、场景、材质、尺寸、适配关系和送礼场景；Listing 语义、A+ 信息完整度和品牌内容一致性会影响未来 AI 广告与自然推荐质量。\u003c/li>\n\u003cli>建议动作：PPC/品牌内容在 2026-09-18 前完成一次 AI 广告准备清单：确认 Amazon DSP 或 agency contact 是否有 ChatGPT placement/integration 邀请；整理 Top 20 ASIN 的核心使用场景、尺寸/页数、材质、适配对象、礼品季节、负面不适用场景；检查 Store、A+、Brand Story、Sponsored Brands 落地页是否能回答“适合谁、解决什么问题、为什么比竞品更可信”。验收标准：若被邀请试点，输出预算上限、转化归因、增量流量监控字段和暂停条件；若未被邀请，仅观察，暂不调整 SP/SB/SD 结构。\u003c/li>\n\u003c/ul>\n\u003ch3>美国 8 月 CPI 能源项回升，US 旺季物流成本需要重新压测\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】US\u003c/li>\n\u003cli>【发布日期】2026-09-11\u003c/li>\n\u003cli>【生效日期】2026-09-11\u003c/li>\n\u003cli>【信息状态】政府经济数据\u003c/li>\n\u003cli>【来源】U.S. Bureau of Labor Statistics：\u003ca href=\"https://www.bls.gov/news.release/cpi.nr0.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.bls.gov/news.release/cpi.nr0.htm\u003c/a>\u003c/li>\n\u003cli>发生了什么：BLS 发布 2026 年 8 月 CPI，CPI-U 环比上升 0.4%，过去 12 个月上升 3.0%；能源指数环比上升 2.1%，其中汽油指数上升 3.9%。这不是 Amazon 费用公告，但会影响 US domestic trucking、FBM、自配送、退货补发和低价配件订单的成本敏感性。\u003c/li>\n\u003cli>我们怎么看：对体积型纸制品和相册类产品，CPI 不应直接触发前台涨价，但应进入 Q4 landed cost 和促销利润复核。若同时叠加 NRF 9 月进口高峰、Drewry 跨太平洋航线小幅上行和 USPS 旺季包裹临时加价待审，低客单价、远区配送、退货率高或促销折扣深的 ASIN 毛利缓冲会变薄。\u003c/li>\n\u003cli>建议动作：供应链/财务在 2026-09-17 前重算 US Top 20 ASIN、PBDD/黑五促销 ASIN、库存覆盖低于 45 天 ASIN 的 landed cost。字段包括 FBA inbound 单件成本、海运/卡派/仓储摊销、FBM/补发邮费、退货处理成本、广告前贡献利润率、促销后贡献利润率。验收标准：若贡献利润率较目标低于 3 个百分点，输出“降折扣、降广告预算、提价、换包装/箱规、暂不参加促销”中的一项决策；否则仅记录成本模型版本，不做前台动作。\u003c/li>\n\u003c/ul>\n\u003ch2>4. 已有事件的重要更新\u003c/h2>\n\u003ch3>US 物流成本信号获得 BLS CPI 能源数据交叉确认\u003c/h3>\n\u003cul>\n\u003cli>历史事件：us-eia-diesel-logistics-cost-signal-2026-09-09\u003c/li>\n\u003cli>上次状态：2026-09-10 已用 EIA 柴油数据作为 Q4 US 物流成本信号，要求更新 US landed cost、FBM、退货补发和促销毛利敏感性。\u003c/li>\n\u003cli>本次新增变化：BLS 2026-09-11 CPI 显示 8 月能源指数环比上升 2.1%、汽油环比上升 3.9%，与 US 旺季物流成本复核方向一致。\u003c/li>\n\u003cli>变化原因：美国能源价格回升会传导到干线、卡派、末端配送、退货补发和第三方仓储报价，但 BLS CPI 是宏观数据，不能替代货代、卡派和 Amazon Buy Shipping 实际费率。\u003c/li>\n\u003cli>行动是否需要调整：继续原动作，不升级为 P1 强制调价。把复核截止日从 2026-09-15 延至 2026-09-17，并要求以实际物流报价和订单毛利为最终依据；只有当实际物流成本较预算上升超过 5%，或促销后贡献利润率低于目标 3 个百分点以上，才升级为价格/促销/广告联动调整。\u003c/li>\n\u003c/ul>\n\u003ch2>5. 今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>完成 UK PBDD 与 US Amazon-optimized shipment splits 2026-09-16 节点前风险表\u003c/td>\n\u003ctd>UK/US\u003c/td>\n\u003ctd>运营/供应链\u003c/td>\n\u003ctd>2026-09-15\u003c/td>\n\u003ctd>促销 ASIN 100% 有 shipment ID、ETA、FC receiving、available units、缺口数量和替代方案\u003c/td>\n\u003ctd>2026-09-16\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>归档商业责任险新要求账号后台证据\u003c/td>\n\u003ctd>US/多站点\u003c/td>\n\u003ctd>合规/财务\u003c/td>\n\u003ctd>2026-09-15\u003c/td>\n\u003ctd>有 Seller Central 原始通知截图或未收到记录；保单主体、到期日、承保站点、AIA 路径和 enhanced safety ASIN 清单齐全\u003c/td>\n\u003ctd>2026-09-16\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>建立 ChatGPT/Amazon DSP 试点观察与素材准备清单\u003c/td>\n\u003ctd>US/多站点\u003c/td>\n\u003ctd>PPC/品牌内容\u003c/td>\n\u003ctd>2026-09-18\u003c/td>\n\u003ctd>确认是否有 DSP 邀请；Top 20 ASIN 有场景、属性、适配对象、禁用场景、落地页和监控字段\u003c/td>\n\u003ctd>2026-09-25\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>更新 US landed cost 与促销毛利敏感性\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>供应链/财务\u003c/td>\n\u003ctd>2026-09-17\u003c/td>\n\u003ctd>Top 20、促销、库存覆盖低于 45 天 ASIN 均有新版成本、贡献利润率和调价/限促判断\u003c/td>\n\u003ctd>2026-09-19\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>复查 Product Bundling 2026-09-30 风险清单\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Listing/合规\u003c/td>\n\u003ctd>2026-09-18\u003c/td>\n\u003ctd>bundle、kit、set、multipack、refill pages、variation relationship 命中 ASIN 有合规证据或修订计划\u003c/td>\n\u003ctd>2026-09-22\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>6. 持续关注\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>事项\u003c/th>\n\u003cth>当前状态\u003c/th>\n\u003cth>下次复查日期\u003c/th>\n\u003cth>触发升级条件\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>UK/US PBDD 与 Q4 入仓节点\u003c/td>\n\u003ctd>UK PBDD 与 US Amazon-optimized shipment splits 下一关键日期为 2026-09-16\u003c/td>\n\u003ctd>2026-09-16\u003c/td>\n\u003ctd>促销 SKU ETA 晚于 2026-09-16、FC receiving 异常或可售库存低于活动需求时升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>商业责任险 2026-11-02 新要求\u003c/td>\n\u003ctd>Amazon 官方线索已出现，账号适用范围仍需 Seller Central 后台确认\u003c/td>\n\u003ctd>2026-09-16\u003c/td>\n\u003ctd>账号收到保险通知、AIA 强制路径或 enhanced safety ASIN 保险请求时升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Amazon Ads 与 ChatGPT 集成\u003c/td>\n\u003ctd>Amazon Ads 官方公告已发布，当前为部分广告主试点，无全量自助入口\u003c/td>\n\u003ctd>2026-09-25\u003c/td>\n\u003ctd>账号收到 DSP 邀请、Amazon Ads 发布自助入口或出现可量化流量/转化报告字段时升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>USPS 2026 旺季临时包裹加价\u003c/td>\n\u003ctd>USPS 已提交 PRC 审核，尚未见最终同步到 Amazon Buy Shipping 的公开结果\u003c/td>\n\u003ctd>2026-09-18\u003c/td>\n\u003ctd>PRC 审核通过或 Amazon Buy Shipping 费率表出现对应旺季加价时升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>US 产品安全监管召回\u003c/td>\n\u003ctd>CPSC 9 月 10 日 Amazon.com 渠道儿童玩具召回已进入筛查清单\u003c/td>\n\u003ctd>2026-09-18\u003c/td>\n\u003ctd>自有 ASIN 命中儿童玩具、电池、铅漆、磁吸、小零件或供应商文件缺失时升级\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>7. 情报边界与可信度\u003c/h2>\n\u003cp>本次核验来源约 12 个，其中官方/监管/一手来源约 8 个，包括中国政府网/国务院办公厅、Amazon Ads、Amazon Seller Central/Forums、BLS、CPSC、GOV.UK OPSS、USPS/PRC、Drewry/NRF 既有跟踪源；非官方或行业辅助来源约 4 个，仅用于发现重复报道和背景判断。纳入日报的新事件 2 条；纳入已有事件重要更新 1 条。仍待确认事项 2 条：商业责任险要求对当前账号和 ASIN 的实际适用范围，以及 USPS 2026 旺季包裹临时加价是否获 PRC 审核并同步到 Amazon Buy Shipping。\u003c/p>\n\u003cp>排除项：本次窗口内未发现 Seller Central 对 Listing、A+、图片、搜索词、属性、变体、FBA 费用或库存限制发布新的强制变更；Amazon Ads 未发布 SP/SB/SD/DSP/AMC 计费、竞价、匹配或归因规则的全量强制变化；CPSC/OPSS 新增低相关召回未进入待办；Perplexity/AI 购物代理、Google Merchant Center 视频项等行业新闻没有新的 Amazon 官方执行口径，暂不作为团队动作。\u003c/p>\n\u003cp>工作日门禁来源：中国政府网《国务院办公厅关于2026年部分节假日安排的通知》（\u003ca href=\"https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-14\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-14\u003c/a> 为周一，不在 2026 年中秋节 2026-09-25 至 2026-09-27 或国庆节 2026-10-01 至 2026-10-07 等法定节假日范围内，按中国大陆法定工作日运行；本周后续最后一个大陆法定工作日预计为 2026-09-18，今天不追加周报。\u003c/p>\n\u003cp>生产链接：\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-14\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-09-14", "text": "### Amazon Ads 与 OpenAI/ChatGPT 推出官方广告集成试点\n\n- 【影响等级】P2\n- 【站点】US 优先/多站点观察\n- 【发布日期】2026-09-10\n- 【生效日期】暂未公布\n- 【信息状态】Amazon Ads 官方公告 / 试点中\n- 【来源】Amazon Ads：https://advertising.amazon.com/library/news/amazon-ads-chat-gpt-advertising-integration\n- 发生了什么：Amazon Ads 宣布与 OpenAI 建立新的广告集成，首阶段让部分广告主可以通过 Amazon DSP 在 ChatGPT 内相关对话场景展示产品或服务广告。公告未显示这是所有 Seller Central 广告主可自助启用的新广告位，也未发布 SP/SB/SD 计费、匹配或竞价规则变更。\n- 我们怎么看：这代表 AI 对话场景正在成为 Amazon Ads 的外部流量入口，短期对未使用 DSP 或未被邀请的账号没有直接后台动作。对相册、补充页、school memory book、portfolio binder、puzzle accessories 这类非标长尾需求产品，长期影响在于 AI 能否理解用途、场景、材质、尺寸、适配关系和送礼场景；Listing 语义、A+ 信息完整度和品牌内容一致性会影响未来 AI 广告与自然推荐质量。\n- 建议动作：PPC/品牌内容在 2026-09-18 前完成一次 AI 广告准备清单：确认 Amazon DSP 或 agency contact 是否有 ChatGPT placement/integration 邀请；整理 Top 20 ASIN 的核心使用场景、尺寸/页数、材质、适配对象、礼品季节、负面不适用场景；检查 Store、A+、Brand Story、Sponsored Brands 落地页是否能回答“适合谁、解决什么问题、为什么比竞品更可信”。验收标准：若被邀请试点，输出预算上限、转化归因、增量流量监控字段和暂停条件；若未被邀请，仅观察，暂不调整 SP/SB/SD 结构。\n\n", "title": "Amazon Ads 与 OpenAI/ChatGPT 推出官方广告集成试点", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-14\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-14\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>Amazon Ads 与 OpenAI/ChatGPT 推出官方广告集成试点\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】US 优先/多站点观察\u003c/li>\n\u003cli>【发布日期】2026-09-10\u003c/li>\n\u003cli>【生效日期】暂未公布\u003c/li>\n\u003cli>【信息状态】Amazon Ads 官方公告 / 试点中\u003c/li>\n\u003cli>【来源】Amazon Ads：\u003ca href=\"https://advertising.amazon.com/library/news/amazon-ads-chat-gpt-advertising-integration\" target=\"_blank\" rel=\"noopener noreferrer\">https://advertising.amazon.com/library/news/amazon-ads-chat-gpt-advertising-integration\u003c/a>\u003c/li>\n\u003cli>发生了什么：Amazon Ads 宣布与 OpenAI 建立新的广告集成，首阶段让部分广告主可以通过 Amazon DSP 在 ChatGPT 内相关对话场景展示产品或服务广告。公告未显示这是所有 Seller Central 广告主可自助启用的新广告位，也未发布 SP/SB/SD 计费、匹配或竞价规则变更。\u003c/li>\n\u003cli>我们怎么看：这代表 AI 对话场景正在成为 Amazon Ads 的外部流量入口，短期对未使用 DSP 或未被邀请的账号没有直接后台动作。对相册、补充页、school memory book、portfolio binder、puzzle accessories 这类非标长尾需求产品，长期影响在于 AI 能否理解用途、场景、材质、尺寸、适配关系和送礼场景；Listing 语义、A+ 信息完整度和品牌内容一致性会影响未来 AI 广告与自然推荐质量。\u003c/li>\n\u003cli>建议动作：PPC/品牌内容在 2026-09-18 前完成一次 AI 广告准备清单：确认 Amazon DSP 或 agency contact 是否有 ChatGPT placement/integration 邀请；整理 Top 20 ASIN 的核心使用场景、尺寸/页数、材质、适配对象、礼品季节、负面不适用场景；检查 Store、A+、Brand Story、Sponsored Brands 落地页是否能回答“适合谁、解决什么问题、为什么比竞品更可信”。验收标准：若被邀请试点，输出预算上限、转化归因、增量流量监控字段和暂停条件；若未被邀请，仅观察，暂不调整 SP/SB/SD 结构。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-14\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-14", "text": "### 美国 8 月 CPI 能源项回升，US 旺季物流成本需要重新压测\n\n- 【影响等级】P2\n- 【站点】US\n- 【发布日期】2026-09-11\n- 【生效日期】2026-09-11\n- 【信息状态】政府经济数据\n- 【来源】U.S. Bureau of Labor Statistics：https://www.bls.gov/news.release/cpi.nr0.htm\n- 发生了什么：BLS 发布 2026 年 8 月 CPI，CPI-U 环比上升 0.4%，过去 12 个月上升 3.0%；能源指数环比上升 2.1%，其中汽油指数上升 3.9%。这不是 Amazon 费用公告，但会影响 US domestic trucking、FBM、自配送、退货补发和低价配件订单的成本敏感性。\n- 我们怎么看：对体积型纸制品和相册类产品，CPI 不应直接触发前台涨价，但应进入 Q4 landed cost 和促销利润复核。若同时叠加 NRF 9 月进口高峰、Drewry 跨太平洋航线小幅上行和 USPS 旺季包裹临时加价待审，低客单价、远区配送、退货率高或促销折扣深的 ASIN 毛利缓冲会变薄。\n- 建议动作：供应链/财务在 2026-09-17 前重算 US Top 20 ASIN、PBDD/黑五促销 ASIN、库存覆盖低于 45 天 ASIN 的 landed cost。字段包括 FBA inbound 单件成本、海运/卡派/仓储摊销、FBM/补发邮费、退货处理成本、广告前贡献利润率、促销后贡献利润率。验收标准：若贡献利润率较目标低于 3 个百分点，输出“降折扣、降广告预算、提价、换包装/箱规、暂不参加促销”中的一项决策；否则仅记录成本模型版本，不做前台动作。\n\n", "title": "美国 8 月 CPI 能源项回升，US 旺季物流成本需要重新压测", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-14\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-14\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:b
