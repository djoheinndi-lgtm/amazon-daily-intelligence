录 national diesel、PADD5、California、carrier fuel surcharge、drayage quote、3PL outbound quote 和 ASIN landed cost impact。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-10-09\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-10-09", "text": "### Drewry WCI 国庆周后回落，美线仍需逐票比价\n\n- 历史事件：drewry-wci-2026-09-03-4465-stable\n- 上次状态：2026-09-28 已推送 Drewry 2026-09-24 WCI 降至 USD 4,468/40ft，Shanghai-Los Angeles 升至 USD 7,838，Shanghai-New York 为 USD 10,373，要求只对未锁价 Q4 货件做航线级报价验证。\n- 本次新增变化：Drewry 2026-10-08 World Container Index 降 2% 至 USD 4,351/40ft；Shanghai-Los Angeles 降 3% 至 USD 7,624，Shanghai-New York 降 2% 至 USD 10,220；Shanghai-Rotterdam 降 2% 至 USD 3,337，Shanghai-Genoa 持平 USD 3,696。来源：https://www.drewry.co.uk/supply-chain-advisors/world-container-index-weekly-update?topics=Supply+Chain+Advisors\n- 相比上次变化：美线从上行/高位分化变为国庆需求放缓后的回落；亚欧线已连续 13 周下跌，承运商可能在 10 月下半月尝试推高 FAK rates。\n- 变化原因：中国黄金周工厂停工导致出口需求短期放缓，部分航线取消班次，同时苏伊士航线回归增加亚欧运力不确定性。\n- 行动是否需要调整：继续 P2。供应链在 2026-10-14 前逐票复核未锁价 US/EU 货件，不用 WCI 单一均值直接改 landed cost。验收标准：每票 open shipment 必须有当前货代报价、目标到仓日期、Lane、预计库存覆盖天数、可接受 ETA 延误天数和是否需要改发/拆单结论。\n\n", "title": "Drewry WCI 国庆周后回落，美线仍需逐票比价", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-09\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-09\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .repor 新增变化：本次补查 Amazon Ads 2026-09-29 unBoxed 官方公告，确认 Branded Conversations 将于 2027-01 在美国启动，面向使用 Sponsored Brands collections 的 US endemic advertisers；Review Requests 将于 2026-11 启动，用广告形式向 verified buyers 邀请评论。来源：\u003ca href=\"https://advertising.amazon.com/resources/whats-new/unboxed-2026-branded-conversations；https://advertising.amazon.com/en-ca/library/news/branded-conversations-review-requests\" target=\"_blank\" rel=\"noopener noreferrer\">https://advertising.amazon.com/resources/whats-new/unboxed-2026-branded-conversations；https://advertising.amazon.com/en-ca/library/news/branded-conversations-review-requests\u003c/a>\u003c/li>\n\u003cli>相比上次变化：上次关注的是广告工作流和优化建议；本次新增的是 AI Shopping 对话中的品牌内容入口和付费评论请求工具，影响 Sponsored Brands、Review、品牌内容和新品冷启动，而不只是 bid/budget。\u003c/li>\n\u003cli>变化原因：Amazon Ads 正把 AI 搜索/对话、评论获取和 Sponsored Brands 连接到广告产品，未来可能影响 CTR、CVR、评论积累速度和品牌搜索承接。\u003c/li>\n\u003cli>行动是否需要调整：继续 P2。PPC/品牌内容负责人在 2026-10-17 前准备 US 站 Brand Conversation 素材底稿，字段包括品牌差异点、产品适用场景、尺寸/页数/兼容性、礼品场景、常见购买顾虑、与竞品差异、不可使用的夸大声明。同时建立 Review Requests 观察表，只跟踪官方开放入口、计费方式、合规限制、每周新增 review/rating、CVR 和 ACoS，不提前使用非官方催评方式。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-10-09\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}]}, {"date": "2026-09-30", "text": "# 亚马逊及海外市场情报增量日报｜2026-09-30\n\n## 今日判断\n\n今天有一个当天必须处理的运营节点：US/UK seller-fulfilled Amazon Business 订单的 Business Hour Delivery Rate 90% 要求在 2026-09-30 进入首次通知节点，低于 90% 的账号需要今天完成后台核查和纠偏清单。新增情报方面，Amazon Ads 在 2026-09-29 发布 Amazon Ads Agent，把 DSP、广告控制台、Sponsored Ads 建议、媒体规划、受众、分析和 DVA+ 自动化放到统一 AI 工作流，当前应做小范围人工审核测试，不应直接放开自动调价。EIA 2026-09-29 柴油周更显示美国 on-highway diesel 回落到 USD 6.382/gal，但仍显著高于去年同期，物流成本模型可以下调本周增量压力，但不能撤销 Q4 燃油附加费监控。今天是国庆假期前最后一个中国大陆法定工作日，因此日报后追加周度合并报告。\n\n## 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n|---|---|---|---|---|---|\n| P0 | US/UK seller-fulfilled BHDR 90% 首次通知节点到期 | US/UK | FBM/SFP/Amazon Business/Account Health/配送模板 | 2026-09-30；2026-10-30 可能停用相关 Business offer | 是，今天必须读取 Account Health 并输出低于 90% 的订单级纠偏表 |\n| P2 | Amazon Ads Agent 统一 AI 投放工作流发布 | 多站点，US/UK/DE/FR/IT/ES 重点观察 | PPC/DSP/Sponsored Ads/预算/竞价/受众/分析 | 2026-09-29 发布；DVA+ 未来数月逐步推出 | 是，建立人工审批试点池，不自动应用 AI 建议 |\n| P2 | EIA 9月29日柴油价格更新：US diesel 周环比下降 USD 0.147/gal | US | 物流/入仓/FBM 应急配送/毛利模型 | 2026-09-29 发布；数据周 2026-09-28 | 是，更新燃油假设并继续保留 Q4 附加费监控 |\n\n## 今日新情报\n\n### Amazon Ads Agent 发布，统一 DSP、广告控制台和 AI 投放建议\n\n- 【影响等级】P2\n- 【站点】多站点，US/UK/DE/FR/IT/ES 重点观察\n- 【发布日期】2026-09-29\n- 【生效日期】暂未公布；DVA+ 未来数月逐步推出\n- 【信息状态】正式公告\n- 【来源】Amazon Press Center：https://press.aboutamazon.com/es/news/advertising/2026/9/amazon-ads-presenta-amazon-ads-agent\n- 发生了什么：Amazon Ads 在 unBoxed 2026 发布 Amazon Ads Agent，把 Amazon DSP 与广告控制台整合到统一体验，并提供对话式 AI，用于创建和优化广告、定义受众、获取实时洞察。公告同时提到 DVA+ 将把 Sponsored Display、程序化、Streaming TV、online video、display 和 audio 放在一个 AI 辅助购买与优化流程中，Sponsored Products 也会出现基于 AI 的 targeting、bid 和 budget 建议。\n- 我们怎么看：这是广告操作方式的变化，不是 Seller Central 强制政策。对相册、Scrapbook、School Memory Book、Portfolio Binder 和 Puzzle Accessories 这类季节性/礼品属性强的品类，AI 建议可能提升关键词扩展、预算分配和跨渠道再营销效率；但若直接一键应用，可能把预算推向库存不足、毛利低、转化不稳定或活动前还未准备好的 ASIN。\n- 建议动作：PPC 负责人在 2026-10-03 前建立“AI 建议复核表”，字段包括 marketplace、campaign、ASIN、库存覆盖天数、毛利率、当前 ACoS/TACoS、建议类型、建议前 bid/budget/targeting、建议后变化、人工批准人和 7 日复盘指标。仅允许选择库存覆盖 >= 21 天、毛利率高于目标线、近 14 天 CVR 不低于类目均值、且 ACoS 未超过目标 +20% 的 campaign 做人工批准测试；验证方式：测试组和对照组分别记录 7 天 CTR、CVR、CPC、ACoS、TACoS 和订单增量，未复盘前不扩大到全账号。\n\n## 已有事件的重要更新\n\n### BHDR 90% 要求进入首个通知节点\n\n- 历史事件：amazon-business-bhdr-90-seller-fulfilled-us-2026-09-30\n- 上次状态：已推送 US/UK seller-fulfilled Amazon Business 订单需维持 Business Hour Delivery Rate >= 90%；2026-09-30 为首次通知节点，2026-10-30 仍未改善可能导致相关 seller-fulfilled offer 对 Amazon Business 客户停用。\n- 本次新增变化：2026-09-30 节点已经到期，今天不再是准备期，而是必须读取 Account Health/Delivery Performance 的节点日。US Seller Forums 原公告显示该指标按滚动 14 天衡量，低于 90% 将收到通知；Amazon 建议使用可靠承运商、准确 handling/transit time、Automated Handling Time、Shipping Settings Automation 和 Amazon Buy Shipping。来源：https://sellercentral.amazon.com/seller-forums/discussions/t/57222b70-40df-4574-aa0f-9f815c197987\n- 相比上次变化：从“9月30日前预检查”变为“9月30日当天读数与异常闭环”；行动重点从提醒变为输出订单级失败原因、承运商和配送模板纠偏方案。\n- 变化原因：Amazon 对 Amazon Business 买家的营业时间内收货体验开始执行最低阈值，滚动 14 天窗口会放大近期承运商延误、晚间投递和节前处理波动。\n- 行动是否需要调整：升级为 P0，当天必须处理。US 运营/欧洲运营今天进入 Account Health > Delivery Performance 或 BHDR 相关页面，按 US、UK 分站导出近 14 天 seller-fulfilled Amazon Business 订单，字段必须包含 order ID、ASIN、shipping template、carrier、ship date、promised delivery date、actual delivery timestamp、business-hours pass/fail、failure reason。截止：2026-09-30 18:00；验收：每站 BHDR >= 90%，或形成低于 90% 的订单级纠偏表、承运商替换/Buy Shipping/AHT/SSA 动作和 2026-10-06 复查节点。\n\n### EIA 柴油价格更新，US 物流成本压力小幅回落但仍高位\n\n- 历史事件：us-eia-diesel-logistics-cost-signal-2026-09-09\n- 上次状态：2026-09-24 已推送 EIA 2026-09-22 release，US on-highway diesel 为 USD 6.529/gal，周环比上涨 USD 0.244/gal，用于 US 10 月入仓、drayage、3PL 和 FBM 应急成本复核。\n- 本次新增变化：EIA 2026-09-29 release 显示 2026-09-28 数据周 US on-highway diesel 为 USD 6.382/gal，较 2026-09-21 的 USD 6.529/gal 下降 USD 0.147/gal；West Coast 为 USD 7.357/gal，California 为 USD 8.181/gal，仍明显高于全国均值。来源：https://www.eia.gov/petroleum/gasdiesel/\n- 相比上次变化：从“周环比上行、短期成本压力上升”调整为“周环比回落，但绝对价格和西海岸/加州差异仍高”；不支持立即下调售价或促销折扣，只能更新成本模型中的燃油敏感性。\n- 变化原因：EIA 周度燃油价格波动回落，但美国区域差异仍会影响港口提柜、卡车派送、3PL 和 FBM 应急配送报价。\n- 行动是否需要调整：降级为 P2。供应链/财务在 2026-10-02 前更新 US inbound/FBM emergency cost model，字段包括 national diesel、PADD5 diesel、California diesel、carrier fuel surcharge、drayage quote、3PL outbound quote、ASIN landed cost impact。验证方式：只对未锁价运输单和 10 月新报价做模型更新；已锁价或 FBA 主履约 ASIN 不做售价动作。\n\n## 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n|---|---|---|---|---|---|---|\n| P0 | 读取 US/UK BHDR 当前值并导出近 14 天 seller-fulfilled Amazon Business 失败订单 | US/UK | US 运营/欧洲运营 | 2026-09-30 | 每站 BHDR >= 90%，或提交包含 order ID、ASIN、carrier、template、failure reason、纠偏动作的表格 | 2026-10-06 |\n| P1 | 复查 PBDD 主推池 Deal/Coupon/PED 状态、可售库存、reserved units、FC receiving 和广告预算承接 | US/UK/DE/FR/IT/ES | 运营/PPC | 2026-10-02 | 每个主推 ASIN 有促销状态、库存覆盖天数、预算覆盖天数、异常处理方式和后台截图 | 2026-10-02 |\n| P1 | 完成 UK EPR Pay on Behalf 服务费与 eco-contribution 分开发票归档 | UK | 欧洲运营/财务 | 2026-10-01 | 每个适用 EPR category 有 enrollment status、fee type、invoice number、deduction date 和 GBP 金额 | 2026-10-08 |\n| P2 | 建立 Amazon Ads Agent AI 建议人工审批试点表 | 多站点 | PPC | 2026-10-03 | 仅纳入库存覆盖 >= 21 天、毛利合格、ACoS 未超目标 +20% 的 campaign；7 天后复盘 CTR/CVR/CPC/ACoS/TACoS | 2026-10-10 |\n| P2 | 更新 EIA 柴油价到 US 物流成本模型 | US | 供应链/财务 | 2026-10-02 | 模型记录 USD 6.382/gal、周环比 -0.147、PADD5/California 差异和承运商燃油附加费影响 | 2026-10-07 |\n| P2 | 建立 USTR/White House 30-for-30 清单与现有 SKU/新品池 HS code 映射 | US | 供应链/产品开发 | 2026-10-03 | 输出“可能受益/不确定/无关”三分类表，含 HS code、供应商、原产地、当前 duty rate、年化采购额 | 2026-10-08 |\n\n## 持续关注\n\n- 事项：US/UK Business Hour Delivery Rate。当前状态：2026-09-30 首次通知节点已到期，今天必须读取后台实际值。下次复查日期：2026-10-06。触发升级条件：任一站点 BHDR \u003c 90%、失败订单集中在某承运商/配送模板、或 2026-10-30 前无法改善。\n- 事项：UK EPR Pay on Behalf 费用入账。当前状态：服务费扣费时间与发票拆分方式变化，金额 GBP 20/年/适用 EPR 类别不变。下次复查日期：2026-10-08。触发升级条件：出现未归类 EPR 扣费、发票缺失、类目适用范围不清，或 eco-contribution fee 与 service fee 混账。\n- 事项：Amazon Ads Agent / DVA+。当前状态：Amazon Ads 官方发布统一 AI 投放工作流，DVA+ 未来数月逐步推出。下次复查日期：2026-10-10。触发升级条件：账号出现可用入口、Sponsored Ads 建议可一键应用、或 Amazon 发布具体市场/产品 rollout 日期。\n- 事项：USTR/White House 30-for-30 推荐清单。当前状态：官方建议清单已发布，但无正式税率、生效日或 CBP 执行规则。下次复查日期：2026-10-08。触发升级条件：USTR/CBP/Federal Register 公布正式税率、执行日期、进口申报规则，或清单中明确覆盖我方核心 HS code。\n- 事项：PBDD 主推池。当前状态：节前进入活动前最后执行复查。下次复查日期：2026-10-02。触发升级条件：Deal/Coupon/PED 不可执行、可售库存低于预计活动销量 1.3 倍、reserved units 异常、或广告预算覆盖低于 2 天。\n- 事项：EU Customs Reform 小包 handling fee。当前状态：2026-11-01 前引入，金额待 delegated act。下次复查日期：2026-10-15。触发升级条件：欧盟公布 fee 金额、货代报价新增该费用、或 DE/FR/IT/ES 清关资料字段被退回。\n\n## 情报边界与可信度\n\n本次窗口覆盖 2026-09-29 09:03:12 至 2026-09-30 10:33:56（Asia/Shanghai），并补查长期索引中 BHDR、UK EPR、PBDD、Product Bundling、USPS、EIA、EU Customs Reform、USTR 30-for-30、Amazon Ads AI 工具、Drewry WCI 等持续关注事项。复查来源约 21 个，其中官方/监管/一手来源 16 个，包括中国政府网/国务院办公厅、Amazon Seller Forums US/UK/EU、Amazon Seller Central Help、Amazon Press Center、Amazon Ads、EIA、USTR、White House、CBP、European Commission、CPSC、GOV.UK OPSS、USPS/Postal Explorer、Drewry；非官方或行业辅助来源 5 个，仅用于发现线索和排重。纳入日报的新事件 1 条，纳入已有事件重要更新 2 条；仍待确认事项 8 条：US/UK BHDR 账号侧具体数值、UK EPR 实际账号扣费、PBDD 各账号实际可执行状态、Product Bundling 账号侧风险提醒、USPS 价格在 Buy Shipping 的账号侧同步、EU handling fee 金额、USTR/CBP 关税执行细则、Amazon Ads Agent 各账号可用入口。\n\n今天排除了 Amazon unBoxed/Accelerate 参会预热、重复的 Prime Big Deal Days 零售宣传、无官方新控制项的 AI shopping 评论、与相册/纸品/礼品/收纳/拼图配件产品线无直接关系的 CPSC/OPSS 召回、AWS 企业客户案例、以及没有 USTR/CBP/European Commission/Amazon 官方确认的新关税传闻。工作日门禁来源：中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（国办发明电〔2025〕7号，https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/2025/issue_12406/202511/content_7048922.html）。文件显示 2026 年中秋节为 2026-09-25 至 2026-09-27 放假，共 3 天；国庆节为 2026-10-01 至 2026-10-07 放假，2026-09-20 和 2026-10-10 上班。因此 2026-09-30 为大陆法定工作日，且是本周最后一个大陆法定工作日。\n\n# 亚马逊及海外市场情报周报｜2026-09-30\n\n## 本周管理层摘要\n\n本周覆盖 2026-09-25 至 2026-09-30，实际工作日为 2026-09-28、2026-09-29、2026-09-30，中秋假期 2026-09-25 至 2026-09-27 无推送。确认新增与实质更新 6 条主线：BHDR 进入首个通知节点、UK EPR Pay on Behalf 扣费方式变化、Amazon Ads Agent 发布、USTR/White House 30-for-30 推荐清单、EIA 柴油价更新、Drewry WCI/跨太平洋运价分化。最高风险是 BHDR，因为它已经从观察期进入通知节点，且会影响 seller-fulfilled Amazon Business 可见性；最近截止日是今天 2026-09-30 的 BHDR 后台读数，其次是 2026-10-01 的 UK EPR 费用归档和 2026-10-02 的 PBDD 主推池复查。\n\n## 本周优先级快览\n\n| 优先级 | 事件主线 | 站点 | 模块 | 下周动作 | 负责人 | 截止日 |\n|---|---|---|---|---|---|---|\n| P0 | BHDR 90% 首次通知节点 | US/UK | FBM/SFP/Amazon Business/Account Health | 输出低于 90% 的订单级纠偏表，并验证 AHT/SSA/Buy Shipping/承运商替换动作 | US 运营/欧洲运营 | 2026-09-30 |\n| P1 | PBDD 活动前最后执行复查 | US/UK/DE/FR/IT/ES | 促销/库存/PPC | 核对 Deal/Coupon/PED、可售库存、reserved units、FC receiving 和预算覆盖 | 运营/PPC | 2026-10-02 |\n| P1 | UK EPR Pay on Behalf 扣费与发票拆分 | UK | EPR/财务/Invoice | 建立 service fee 与 eco-contribution 分开发票归档和费用科目 | 欧洲运营/财务 | 2026-10-01 |\n| P2 | Amazon Ads Agent / DVA+ | 多站点 | PPC/DSP/Sponsored Ads | 建立 AI 建议人工审批试点，不自动应用全账号建议 | PPC | 2026-10-03 |\n| P2 | USTR/White House 30-for-30 推荐清单 | US | 关税/新品/供应链 | 建立 HS code 和新品池映射，不改售价和促销 | 供应链/产品开发/财务 | 2026-10-03 |\n| P2 | EIA/Drewry 物流成本信号 | US/EU/UK | 入仓/海运/燃油附加费 | 更新未锁价运输单的成本模型，分开看美西、美东和欧洲航线 | 供应链/财务 | 2026-10-07 |\n\n## 本周政策与平台变化\n\n### 合规\n\nUK EPR Pay on Behalf 服务费扣费方式从账户 reserve 后扣转为每个 reporting period enrollment 或首次 qualifying sale 后 30 天内直接扣费，GBP 20/年/适用 EPR 类别不变，但 service fee 与 eco-contribution 分开发票。对运营动作的影响是费用入账与发票归档，不是 Listing 改写。BHDR 属于账户绩效和 B2B 履约合规，2026-09-30 已到通知节点，低于 90% 的 seller-fulfilled offer 需要在 2026-10-30 前改善，否则可能影响 Amazon Business 客户可见性。\n\n### Listing\n\n本周未发现新的 Amazon US/UK/DE/FR/IT/ES Listing 标题、Bullet、A+、图片、视频、搜索词、属性或变体强制规则变化。Product Bundling 仍按 2027-01-11 风险清单推进，当前重点是内部 bundle/kit/set/multipack/refill-page 清单闭环，不重复作为新情报推送。\n\n### 广告\n\nAmazon Ads Agent 是本周最重要的平台变化：Amazon 把 DSP、广告控制台、对话式 AI、DVA+、media planning、audience、analytics 和 Sponsored Products 建议放进统一 workflow。管理层判断是“值得试点但不能放权”：先筛选库存、毛利和 ACoS 安全的 campaign，保留人工审批和 7 天复盘。\n\n### 费用\n\nUK EPR 服务费金额未变，但扣费时点和发票拆分会影响月度费用表；US 柴油价格从 USD 6.529/gal 回落到 USD 6.382/gal，燃油压力减轻但仍高于去年同期，不支持立刻降价或提高促销折扣。\n\n### 库存物流\n\nDrewry 2026-09-24 WCI 降至 USD 4,468/40ft，但 Shanghai-Los Angeles 上涨至 USD 7,838，Shanghai-New York 仍为 USD 10,373，说明 US 航线和 EU 航线不能用一个平均值判断。PBDD 进入活动前最后执行复查，库存、reserved units、FC receiving 和广告预算是下周销售承接关键。\n\n### 促销\n\n本周无新的 Amazon 大促规则变化；重点仍是 PBDD 主推池执行而不是新建促销。每个主推 ASIN 需要有 Deal/Coupon/PED 可执行状态、库存覆盖天数、兜底促销、预算覆盖和异常截图。\n\n## 本周海外市场与供应链变化\n\nUSTR 和 White House 发布 U.S.-China Board of Trade 30-for-30 推荐清单，属于正式政策建议，但尚无正式税率、CBP 执行规则或生效日期。对当前业务的意义是提前建立 HS code 和新品池映射，特别是 household goods、toys、gift/craft accessories、paper/storage adjacent 相关 SKU；在正式税率公布前，不应改售价、不应承诺供应商降本。物流侧，本周 EIA 燃油价格从高点回落，Drewry 显示跨太平洋航线仍偏强，供应链要继续按航线和报价单判断，而不是按全国平均柴油价或 WCI 单一指数判断。\n\n## 对当前业务的量化影响\n\n- 销售：BHDR 若低于 90% 且 2026-10-30 前不改善，seller-fulfilled offer 可能对 Amazon Business 客户停用；若 B2B 订单占相关 SKU 销量 10%-20%，短期销售风险应按对应 seller-fulfilled B2B GMV 建模。\n- 利润率：UK EPR 服务费金额为 GBP 20/年/适用 EPR 类别，单项金额不大，但若财务科目混入平台费或 eco-contribution，会影响 UK 站净利率归因。\n- CTR/CVR：Amazon Ads Agent 可能通过更快的 targeting、budget 和 bid 建议改善广告效率，但只有在库存、价格、评价和页面内容稳定时才有意义；试点复盘以 7 天 CTR、CVR、CPC、ACoS、TACoS 为准。\n- ACoS/TACoS：AI 建议只允许在 ACoS 未超过目标 +20%、库存覆盖 >= 21 天、毛利合格的 campaign 中测试；否则可能扩大低毛利订单。\n- 库存覆盖天数：PBDD 主推 ASIN 需至少覆盖预计活动销量 1.3 倍；低于该阈值的 ASIN 应降低广告放量或准备兜底 Coupon/PED。\n- 到货节点：EIA 柴油价回落 USD 0.147/gal 只影响未锁价运输单的燃油敏感性；Drewry 美线高位意味着 US open shipment 仍需逐票比价。\n- 合规风险：BHDR 和 UK EPR 都是后台/费用型风险，不是 Listing 文案风险；Product Bundling 保持 2027-01-11 风险清单节奏。\n\n## 下周行动清单\n\n| 优先级 | 动作 | 站点 | 对象 | 负责人 | 截止日 | 验收指标 |\n|---|---|---|---|---|---|---|\n| P0 | 完成 BHDR 低于 90% 订单级复盘并提交纠偏方案 | US/UK | seller-fulfilled Amazon Business 订单 | US 运营/欧洲运营 | 2026-09-30 | 每站 BHDR >= 90%，或失败订单 100% 有原因与动作 |\n| P1 | PBDD 主推池活动前复查 | US/UK/DE/FR/IT/ES | Deal/Coupon/PED ASIN | 运营/PPC | 2026-10-02 | 每个 ASIN 有促销状态、库存覆盖、预算覆盖和异常处理记录 |\n| P1 | UK EPR 费用归档 | UK | EPR category、service fee、eco-contribution | 欧洲运营/财务 | 2026-10-01 | service fee 与 eco-contribution 分开发票归档，费用科目正确 |\n| P2 | Amazon Ads Agent 试点表 | 多站点 | PPC campaign | PPC | 2026-10-03 | 试点池 campaign 100% 有库存、毛利、ACoS/TACoS 和人工批准字段 |\n| P2 | 30-for-30 HS code 映射 | US | 在售 SKU 与 2027 新品池 | 供应链/产品开发 | 2026-10-03 | 输出可能受益/不确定/无关三分类表 |\n| P2 | 更新物流成本模型 | US/EU/UK | 未锁价海运/卡车/3PL/FBM 应急单 | 供应链/财务 | 2026-10-07 | 模型区分 diesel national/PADD5/California、Drewry 美线/欧线、实际 carrier quote |\n\n## 已关闭与继续跟踪事项\n\n- 继续跟踪：BHDR，下一次复查 2026-10-06，若低于 90% 或收到账户通知则升级。\n- 继续跟踪：UK EPR Pay on Behalf，下一次复查 2026-10-08，若实际扣费/发票与公告不一致则升级。\n- 继续跟踪：Amazon Ads Agent，下一次复查 2026-10-10，若账号出现入口或 Amazon 公布 rollout 市场则升级。\n- 继续跟踪：USTR/White House 30-for-30，下一次复查 2026-10-08，等待正式税率、CBP/Federal Register 执行细则。\n- 继续跟踪：EU Customs Reform handling fee，下一次复查 2026-10-15，等待 fee 金额和 delegated act。\n- 继续跟踪：Product Bundling 2027-01-11，下一次复查 2026-10-15，等待账号侧风险提醒或 Seller Central 帮助页新增解释。\n- 本周关闭：无。没有足够证据关闭 BHDR、PBDD、UK EPR、30-for-30 或 Amazon Ads AI 工具相关事项。\n\n## 来源与可信度统计\n\n本周合并复查来源约 35 个，其中官方/监管/一手来源 26 个，非官方或行业辅助来源 9 个。核心来源包括中国政府网/国务院办公厅 2026 节假日安排、Amazon Seller Forums US/UK/EU、Amazon Press Center、Amazon Ads、EIA、USTR、White House、European Commission、USPS/Postal Explorer、Drewry、CPSC 和 GOV.UK OPSS。周报只合并已确认新增和实质更新，不纳入单纯转载、活动预热、重复零售宣传、无后台动作的行业评论和无官方确认的关税传闻。\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-30\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-30\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报增量日报｜2026-09-30\u003c/h1>\n\u003ch2>今日判断\u003c/h2>\n\u003cp>今天有一个当天必须处理的运营节点：US/UK seller-fulfilled Amazon Business 订单的 Business Hour Delivery Rate 90% 要求在 2026-09-30 进入首次通知节点，低于 90% 的账号需要今天完成后台核查和纠偏清单。新增情报方面，Amazon Ads 在 2026-09-29 发布 Amazon Ads Agent，把 DSP、广告控制台、Sponsored Ads 建议、媒体规划、受众、分析和 DVA+ 自动化放到统一 AI 工作流，当前应做小范围人工审核测试，不应直接放开自动调价。EIA 2026-09-29 柴油周更显示美国 on-highway diesel 回落到 USD 6.382/gal，但仍显著高于去年同期，物流成本模型可以下调本周增量压力，但不能撤销 Q4 燃油附加费监控。今天是国庆假期前最后一个中国大陆法定工作日，因此日报后追加周度合并报告。\u003c/p>\n\u003ch2>优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>影响站点\u003c/th>\n\u003cth>影响模块\u003c/th>\n\u003cth>截止/生效日期\u003c/th>\n\u003cth>今天是否需要动作\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P0\u003c/td>\n\u003ctd>US/UK seller-fulfilled BHDR 90% 首次通知节点到期\u003c/td>\n\u003ctd>US/UK\u003c/td>\n\u003ctd>FBM/SFP/Amazon Business/Account Health/配送模板\u003c/td>\n\u003ctd>2026-09-30；2026-10-30 可能停用相关 Business offer\u003c/td>\n\u003ctd>是，今天必须读取 Account Health 并输出低于 90% 的订单级纠偏表\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Amazon Ads Agent 统一 AI 投放工作流发布\u003c/td>\n\u003ctd>多站点，US/UK/DE/FR/IT/ES 重点观察\u003c/td>\n\u003ctd>PPC/DSP/Sponsored Ads/预算/竞价/受众/分析\u003c/td>\n\u003ctd>2026-09-29 发布；DVA+ 未来数月逐步推出\u003c/td>\n\u003ctd>是，建立人工审批试点池，不自动应用 AI 建议\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>EIA 9月29日柴油价格更新：US diesel 周环比下降 USD 0.147/gal\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>物流/入仓/FBM 应急配送/毛利模型\u003c/td>\n\u003ctd>2026-09-29 发布；数据周 2026-09-28\u003c/td>\n\u003ctd>是，更新燃油假设并继续保留 Q4 附加费监控\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>今日新情报\u003c/h2>\n\u003ch3>Amazon Ads Agent 发布，统一 DSP、广告控制台和 AI 投放建议\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】多站点，US/UK/DE/FR/IT/ES 重点观察\u003c/li>\n\u003cli>【发布日期】2026-09-29\u003c/li>\n\u003cli>【生效日期】暂未公布；DVA+ 未来数月逐步推出\u003c/li>\n\u003cli>【信息状态】正式公告\u003c/li>\n\u003cli>【来源】Amazon Press Center：\u003ca href=\"https://press.aboutamazon.com/es/news/advertising/2026/9/amazon-ads-presenta-amazon-ads-agent\" target=\"_blank\" rel=\"noopener noreferrer\">https://press.aboutamazon.com/es/news/advertising/2026/9/amazon-ads-presenta-amazon-ads-agent\u003c/a>\u003c/li>\n\u003cli>发生了什么：Amazon Ads 在 unBoxed 2026 发布 Amazon Ads Agent，把 Amazon DSP 与广告控制台整合到统一体验，并提供对话式 AI，用于创建和优化广告、定义受众、获取实时洞察。公告同时提到 DVA+ 将把 Sponsored Display、程序化、Streaming TV、online video、display 和 audio 放在一个 AI 辅助购买与优化流程中，Sponsored Products 也会出现基于 AI 的 targeting、bid 和 budget 建议。\u003c/li>\n\u003cli>我们怎么看：这是广告操作方式的变化，不是 Seller Central 强制政策。对相册、Scrapbook、School Memory Book、Portfolio Binder 和 Puzzle Accessories 这类季节性/礼品属性强的品类，AI 建议可能提升关键词扩展、预算分配和跨渠道再营销效率；但若直接一键应用，可能把预算推向库存不足、毛利低、转化不稳定或活动前还未准备好的 ASIN。\u003c/li>\n\u003cli>建议动作：PPC 负责人在 2026-10-03 前建立“AI 建议复核表”，字段包括 marketplace、campaign、ASIN、库存覆盖天数、毛利率、当前 ACoS/TACoS、建议类型、建议前 bid/budget/targeting、建议后变化、人工批准人和 7 日复盘指标。仅允许选择库存覆盖 &gt;= 21 天、毛利率高于目标线、近 14 天 CVR 不低于类目均值、且 ACoS 未超过目标 +20% 的 campaign 做人工批准测试；验证方式：测试组和对照组分别记录 7 天 CTR、CVR、CPC、ACoS、TACoS 和订单增量，未复盘前不扩大到全账号。\u003c/li>\n\u003c/ul>\n\u003ch2>已有事件的重要更新\u003c/h2>\n\u003ch3>BHDR 90% 要求进入首个通知节点\u003c/h3>\n\u003cul>\n\u003cli>历史事件：amazon-business-bhdr-90-seller-fulfilled-us-2026-09-30\u003c/li>\n\u003cli>上次状态：已推送 US/UK seller-fulfilled Amazon Business 订单需维持 Business Hour Delivery Rate &gt;= 90%；2026-09-30 为首次通知节点，2026-10-30 仍未改善可能导致相关 seller-fulfilled offer 对 Amazon Business 客户停用。\u003c/li>\n\u003cli>本次新增变化：2026-09-30 节点已经到期，今天不再是准备期，而是必须读取 Account Health/Delivery Performance 的节点日。US Seller Forums 原公告显示该指标按滚动 14 天衡量，低于 90% 将收到通知；Amazon 建议使用可靠承运商、准确 handling/transit time、Automated Handling Time、Shipping Settings Automation 和 Amazon Buy Shipping。来源：\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/57222b70-40df-4574-aa0f-9f815c197987\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/seller-forums/discussions/t/57222b70-40df-4574-aa0f-9f815c197987\u003c/a>\u003c/li>\n\u003cli>相比上次变化：从“9月30日前预检查”变为“9月30日当天读数与异常闭环”；行动重点从提醒变为输出订单级失败原因、承运商和配送模板纠偏方案。\u003c/li>\n\u003cli>变化原因：Amazon 对 Amazon Business 买家的营业时间内收货体验开始执行最低阈值，滚动 14 天窗口会放大近期承运商延误、晚间投递和节前处理波动。\u003c/li>\n\u003cli>行动是否需要调整：升级为 P0，当天必须处理。US 运营/欧洲运营今天进入 Account Health &gt; Delivery Performance 或 BHDR 相关页面，按 US、UK 分站导出近 14 天 seller-fulfilled Amazon Business 订单，字段必须包含 order ID、ASIN、shipping template、carrier、ship date、promised delivery date、actual delivery timestamp、business-hours pass/fail、failure reason。截止：2026-09-30 18:00；验收：每站 BHDR &gt;= 90%，或形成低于 90% 的订单级纠偏表、承运商替换/Buy Shipping/AHT/SSA 动作和 2026-10-06 复查节点。\u003c/li>\n\u003c/ul>\n\u003ch3>EIA 柴油价格更新，US 物流成本压力小幅回落但仍高位\u003c/h3>\n\u003cul>\n\u003cli>历史事件：us-eia-diesel-logistics-cost-signal-2026-09-09\u003c/li>\n\u003cli>上次状态：2026-09-24 已推送 EIA 2026-09-22 release，US on-highway diesel 为 USD 6.529/gal，周环比上涨 USD 0.244/gal，用于 US 10 月入仓、drayage、3PL 和 FBM 应急成本复核。\u003c/li>\n\u003cli>本次新增变化：EIA 2026-09-29 release 显示 2026-09-28 数据周 US on-highway diesel 为 USD 6.382/gal，较 2026-09-21 的 USD 6.529/gal 下降 USD 0.147/gal；West Coast 为 USD 7.357/gal，California 为 USD 8.181/gal，仍明显高于全国均值。来源：\u003ca href=\"https://www.eia.gov/petroleum/gasdiesel/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.eia.gov/petroleum/gasdiesel/\u003c/a>\u003c/li>\n\u003cli>相比上次变化：从“周环比上行、短期成本压力上升”调整为“周环比回落，但绝对价格和西海岸/加州差异仍高”；不支持立即下调售价或促销折扣，只能更新成本模型中的燃油敏感性。\u003c/li>\n\u003cli>变化原因：EIA 周度燃油价格波动回落，但美国区域差异仍会影响港口提柜、卡车派送、3PL 和 FBM 应急配送报价。\u003c/li>\n\u003cli>行动是否需要调整：降级为 P2。供应链/财务在 2026-10-02 前更新 US inbound/FBM emergency cost model，字段包括 national diesel、PADD5 diesel、California diesel、carrier fuel surcharge、drayage quote、3PL outbound quote、ASIN landed cost impact。验证方式：只对未锁价运输单和 10 月新报价做模型更新；已锁价或 FBA 主履约 ASIN 不做售价动作。\u003c/li>\n\u003c/ul>\n\u003ch2>今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P0\u003c/td>\n\u003ctd>读取 US/UK BHDR 当前值并导出近 14 天 seller-fulfilled Amazon Business 失败订单\u003c/td>\n\u003ctd>US/UK\u003c/td>\n\u003ctd>US 运营/欧洲运营\u003c/td>\n\u003ctd>2026-09-30\u003c/td>\n\u003ctd>每站 BHDR &gt;= 90%，或提交包含 order ID、ASIN、carrier、template、failure reason、纠偏动作的表格\u003c/td>\n\u003ctd>2026-10-06\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>复查 PBDD 主推池 Deal/Coupon/PED 状态、可售库存、reserved units、FC receiving 和广告预算承接\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES\u003c/td>\n\u003ctd>运营/PPC\u003c/td>\n\u003ctd>2026-10-02\u003c/td>\n\u003ctd>每个主推 ASIN 有促销状态、库存覆盖天数、预算覆盖天数、异常处理方式和后台截图\u003c/td>\n\u003ctd>2026-10-02\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>完成 UK EPR Pay on Behalf 服务费与 eco-contribution 分开发票归档\u003c/td>\n\u003ctd>UK\u003c/td>\n\u003ctd>欧洲运营/财务\u003c/td>\n\u003ctd>2026-10-01\u003c/td>\n\u003ctd>每个适用 EPR category 有 enrollment status、fee type、invoice number、deduction date 和 GBP 金额\u003c/td>\n\u003ctd>2026-10-08\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>建立 Amazon Ads Agent AI 建议人工审批试点表\u003c/td>\n\u003ctd>多站点\u003c/td>\n\u003ctd>PPC\u003c/td>\n\u003ctd>2026-10-03\u003c/td>\n\u003ctd>仅纳入库存覆盖 &gt;= 21 天、毛利合格、ACoS 未超目标 +20% 的 campaign；7 天后复盘 CTR/CVR/CPC/ACoS/TACoS\u003c/td>\n\u003ctd>2026-10-10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>更新 EIA 柴油价到 US 物流成本模型\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>供应链/财务\u003c/td>\n\u003ctd>2026-10-02\u003c/td>\n\u003ctd>模型记录 USD 6.382/gal、周环比 -0.147、PADD5/California 差异和承运商燃油附加费影响\u003c/td>\n\u003ctd>2026-10-07\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>建立 USTR/White House 30-for-30 清单与现有 SKU/新品池 HS code 映射\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>供应链/产品开发\u003c/td>\n\u003ctd>2026-10-03\u003c/td>\n\u003ctd>输出“可能受益/不确定/无关”三分类表，含 HS code、供应商、原产地、当前 duty rate、年化采购额\u003c/td>\n\u003ctd>2026-10-08\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>持续关注\u003c/h2>\n\u003cul>\n\u003cli>事项：US/UK Business Hour Delivery Rate。当前状态：2026-09-30 首次通知节点已到期，今天必须读取后台实际值。下次复查日期：2026-10-06。触发升级条件：任一站点 BHDR &lt; 90%、失败订单集中在某承运商/配送模板、或 2026-10-30 前无法改善。\u003c/li>\n\u003cli>事项：UK EPR Pay on Behalf 费用入账。当前状态：服务费扣费时间与发票拆分方式变化，金额 GBP 20/年/适用 EPR 类别不变。下次复查日期：2026-10-08。触发升级条件：出现未归类 EPR 扣费、发票缺失、类目适用范围不清，或 eco-contribution fee 与 service fee 混账。\u003c/li>\n\u003cli>事项：Amazon Ads Agent / DVA+。当前状态：Amazon Ads 官方发布统一 AI 投放工作流，DVA+ 未来数月逐步推出。下次复查日期：2026-10-10。触发升级条件：账号出现可用入口、Sponsored Ads 建议可一键应用、或 Amazon 发布具体市场/产品 rollout 日期。\u003c/li>\n\u003cli>事项：USTR/White House 30-for-30 推荐清单。当前状态：官方建议清单已发布，但无正式税率、生效日或 CBP 执行规则。下次复查日期：2026-10-08。触发升级条件：USTR/CBP/Federal Register 公布正式税率、执行日期、进口申报规则，或清单中明确覆盖我方核心 HS code。\u003c/li>\n\u003cli>事项：PBDD 主推池。当前状态：节前进入活动前最后执行复查。下次复查日期：2026-10-02。触发升级条件：Deal/Coupon/PED 不可执行、可售库存低于预计活动销量 1.3 倍、reserved units 异常、或广告预算覆盖低于 2 天。\u003c/li>\n\u003cli>事项：EU Customs Reform 小包 handling fee。当前状态：2026-11-01 前引入，金额待 delegated act。下次复查日期：2026-10-15。触发升级条件：欧盟公布 fee 金额、货代报价新增该费用、或 DE/FR/IT/ES 清关资料字段被退回。\u003c/li>\n\u003c/ul>\n\u003ch2>情报边界与可信度\u003c/h2>\n\u003cp>本次窗口覆盖 2026-09-29 09:03:12 至 2026-09-30 10:33:56（Asia/Shanghai），并补查长期索引中 BHDR、UK EPR、PBDD、Product Bundling、USPS、EIA、EU Customs Reform、USTR 30-for-30、Amazon Ads AI 工具、Drewry WCI 等持续关注事项。复查来源约 21 个，其中官方/监管/一手来源 16 个，包括中国政府网/国务院办公厅、Amazon Seller Forums US/UK/EU、Amazon Seller Central Help、Amazon Press Center、Amazon Ads、EIA、USTR、White House、CBP、European Commission、CPSC、GOV.UK OPSS、USPS/Postal Explorer、Drewry；非官方或行业辅助来源 5 个，仅用于发现线索和排重。纳入日报的新事件 1 条，纳入已有事件重要更新 2 条；仍待确认事项 8 条：US/UK BHDR 账号侧具体数值、UK EPR 实际账号扣费、PBDD 各账号实际可执行状态、Product Bundling 账号侧风险提醒、USPS 价格在 Buy Shipping 的账号侧同步、EU handling fee 金额、USTR/CBP 关税执行细则、Amazon Ads Agent 各账号可用入口。\u003c/p>\n\u003cp>今天排除了 Amazon unBoxed/Accelerate 参会预热、重复的 Prime Big Deal Days 零售宣传、无官方新控制项的 AI shopping 评论、与相册/纸品/礼品/收纳/拼图配件产品线无直接关系的 CPSC/OPSS 召回、AWS 企业客户案例、以及没有 USTR/CBP/European Commission/Amazon 官方确认的新关税传闻。工作日门禁来源：中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（国办发明电〔2025〕7号，\u003ca href=\"https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/2025/issue_12406/202511/content_7048922.html）。文件显示\" target=\"_blank\" rel=\"noopener noreferrer\">https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/2025/issue_12406/202511/content_7048922.html）。文件显示\u003c/a> 2026 年中秋节为 2026-09-25 至 2026-09-27 放假，共 3 天；国庆节为 2026-10-01 至 2026-10-07 放假，2026-09-20 和 2026-10-10 上班。因此 2026-09-30 为大陆法定工作日，且是本周最后一个大陆法定工作日。\u003c/p>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报周报｜2026-09-30\u003c/h1>\n\u003ch2>本周管理层摘要\u003c/h2>\n\u003cp>本周覆盖 2026-09-25 至 2026-09-30，实际工作日为 2026-09-28、2026-09-29、2026-09-30，中秋假期 2026-09-25 至 2026-09-27 无推送。确认新增与实质更新 6 条主线：BHDR 进入首个通知节点、UK EPR Pay on Behalf 扣费方式变化、Amazon Ads Agent 发布、USTR/White House 30-for-30 推荐清单、EIA 柴油价更新、Drewry WCI/跨太平洋运价分化。最高风险是 BHDR，因为它已经从观察期进入通知节点，且会影响 seller-fulfilled Amazon Business 可见性；最近截止日是今天 2026-09-30 的 BHDR 后台读数，其次是 2026-10-01 的 UK EPR 费用归档和 2026-10-02 的 PBDD 主推池复查。\u003c/p>\n\u003ch2>本周优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事件主线\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>模块\u003c/th>\n\u003cth>下周动作\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P0\u003c/td>\n\u003ctd>BHDR 90% 首次通知节点\u003c/td>\n\u003ctd>US/UK\u003c/td>\n\u003ctd>FBM/SFP/Amazon Business/Account Health\u003c/td>\n\u003ctd>输出低于 90% 的订单级纠偏表，并验证 AHT/SSA/Buy Shipping/承运商替换动作\u003c/td>\n\u003ctd>US 运营/欧洲运营\u003c/td>\n\u003ctd>2026-09-30\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>PBDD 活动前最后执行复查\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES\u003c/td>\n\u003ctd>促销/库存/PPC\u003c/td>\n\u003ctd>核对 Deal/Coupon/PED、可售库存、reserved units、FC receiving 和预算覆盖\u003c/td>\n\u003ctd>运营/PPC\u003c/td>\n\u003ctd>2026-10-02\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>UK EPR Pay on Behalf 扣费与发票拆分\u003c/td>\n\u003ctd>UK\u003c/td>\n\u003ctd>EPR/财务/Invoice\u003c/td>\n\u003ctd>建立 service fee 与 eco-contribution 分开发票归档和费用科目\u003c/td>\n\u003ctd>欧洲运营/财务\u003c/td>\n\u003ctd>2026-10-01\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Amazon Ads Agent / DVA+\u003c/td>\n\u003ctd>多站点\u003c/td>\n\u003ctd>PPC/DSP/Sponsored Ads\u003c/td>\n\u003ctd>建立 AI 建议人工审批试点，不自动应用全账号建议\u003c/td>\n\u003ctd>PPC\u003c/td>\n\u003ctd>2026-10-03\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>USTR/White House 30-for-30 推荐清单\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>关税/新品/供应链\u003c/td>\n\u003ctd>建立 HS code 和新品池映射，不改售价和促销\u003c/td>\n\u003ctd>供应链/产品开发/财务\u003c/td>\n\u003ctd>2026-10-03\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>EIA/Drewry 物流成本信号\u003c/td>\n\u003ctd>US/EU/UK\u003c/td>\n\u003ctd>入仓/海运/燃油附加费\u003c/td>\n\u003ctd>更新未锁价运输单的成本模型，分开看美西、美东和欧洲航线\u003c/td>\n\u003ctd>供应链/财务\u003c/td>\n\u003ctd>2026-10-07\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>本周政策与平台变化\u003c/h2>\n\u003ch3>合规\u003c/h3>\n\u003cp>UK EPR Pay on Behalf 服务费扣费方式从账户 reserve 后扣转为每个 reporting period enrollment 或首次 qualifying sale 后 30 天内直接扣费，GBP 20/年/适用 EPR 类别不变，但 service fee 与 eco-contribution 分开发票。对运营动作的影响是费用入账与发票归档，不是 Listing 改写。BHDR 属于账户绩效和 B2B 履约合规，2026-09-30 已到通知节点，低于 90% 的 seller-fulfilled offer 需要在 2026-10-30 前改善，否则可能影响 Amazon Business 客户可见性。\u003c/p>\n\u003ch3>Listing\u003c/h3>\n\u003cp>本周未发现新的 Amazon US/UK/DE/FR/IT/ES Listing 标题、Bullet、A+、图片、视频、搜索词、属性或变体强制规则变化。Product Bundling 仍按 2027-01-11 风险清单推进，当前重点是内部 bundle/kit/set/multipack/refill-page 清单闭环，不重复作为新情报推送。\u003c/p>\n\u003ch3>广告\u003c/h3>\n\u003cp>Amazon Ads Agent 是本周最重要的平台变化：Amazon 把 DSP、广告控制台、对话式 AI、DVA+、media planning、audience、analytics 和 Sponsored Products 建议放进统一 workflow。管理层判断是“值得试点但不能放权”：先筛选库存、毛利和 ACoS 安全的 campaign，保留人工审批和 7 天复盘。\u003c/p>\n\u003ch3>费用\u003c/h3>\n\u003cp>UK EPR 服务费金额未变，但扣费时点和发票拆分会影响月度费用表；US 柴油价格从 USD 6.529/gal 回落到 USD 6.382/gal，燃油压力减轻但仍高于去年同期，不支持立刻降价或提高促销折扣。\u003c/p>\n\u003ch3>库存物流\u003c/h3>\n\u003cp>Drewry 2026-09-24 WCI 降至 USD 4,468/40ft，但 Shanghai-Los Angeles 上涨至 USD 7,838，Shanghai-New York 仍为 USD 10,373，说明 US 航线和 EU 航线不能用一个平均值判断。PBDD 进入活动前最后执行复查，库存、reserved units、FC receiving 和广告预算是下周销售承接关键。\u003c/p>\n\u003ch3>促销\u003c/h3>\n\u003cp>本周无新的 Amazon 大促规则变化；重点仍是 PBDD 主推池执行而不是新建促销。每个主推 ASIN 需要有 Deal/Coupon/PED 可执行状态、库存覆盖天数、兜底促销、预算覆盖和异常截图。\u003c/p>\n\u003ch2>本周海外市场与供应链变化\u003c/h2>\n\u003cp>USTR 和 White House 发布 U.S.-China Board of Trade 30-for-30 推荐清单，属于正式政策建议，但尚无正式税率、CBP 执行规则或生效日期。对当前业务的意义是提前建立 HS code 和新品池映射，特别是 household goods、toys、gift/craft accessories、paper/storage adjacent 相关 SKU；在正式税率公布前，不应改售价、不应承诺供应商降本。物流侧，本周 EIA 燃油价格从高点回落，Drewry 显示跨太平洋航线仍偏强，供应链要继续按航线和报价单判断，而不是按全国平均柴油价或 WCI 单一指数判断。\u003c/p>\n\u003ch2>对当前业务的量化影响\u003c/h2>\n\u003cul>\n\u003cli>销售：BHDR 若低于 90% 且 2026-10-30 前不改善，seller-fulfilled offer 可能对 Amazon Business 客户停用；若 B2B 订单占相关 SKU 销量 10%-20%，短期销售风险应按对应 seller-fulfilled B2B GMV 建模。\u003c/li>\n\u003cli>利润率：UK EPR 服务费金额为 GBP 20/年/适用 EPR 类别，单项金额不大，但若财务科目混入平台费或 eco-contribution，会影响 UK 站净利率归因。\u003c/li>\n\u003cli>CTR/CVR：Amazon Ads Agent 可能通过更快的 targeting、budget 和 bid 建议改善广告效率，但只有在库存、价格、评价和页面内容稳定时才有意义；试点复盘以 7 天 CTR、CVR、CPC、ACoS、TACoS 为准。\u003c/li>\n\u003cli>ACoS/TACoS：AI 建议只允许在 ACoS 未超过目标 +20%、库存覆盖 &gt;= 21 天、毛利合格的 campaign 中测试；否则可能扩大低毛利订单。\u003c/li>\n\u003cli>库存覆盖天数：PBDD 主推 ASIN 需至少覆盖预计活动销量 1.3 倍；低于该阈值的 ASIN 应降低广告放量或准备兜底 Coupon/PED。\u003c/li>\n\u003cli>到货节点：EIA 柴油价回落 USD 0.147/gal 只影响未锁价运输单的燃油敏感性；Drewry 美线高位意味着 US open shipment 仍需逐票比价。\u003c/li>\n\u003cli>合规风险：BHDR 和 UK EPR 都是后台/费用型风险，不是 Listing 文案风险；Product Bundling 保持 2027-01-11 风险清单节奏。\u003c/li>\n\u003c/ul>\n\u003ch2>下周行动清单\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>动作\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>对象\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日\u003c/th>\n\u003cth>验收指标\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P0\u003c/td>\n\u003ctd>完成 BHDR 低于 90% 订单级复盘并提交纠偏方案\u003c/td>\n\u003ctd>US/UK\u003c/td>\n\u003ctd>seller-fulfilled Amazon Business 订单\u003c/td>\n\u003ctd>US 运营/欧洲运营\u003c/td>\n\u003ctd>2026-09-30\u003c/td>\n\u003ctd>每站 BHDR &gt;= 90%，或失败订单 100% 有原因与动作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>PBDD 主推池活动前复查\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES\u003c/td>\n\u003ctd>Deal/Coupon/PED ASIN\u003c/td>\n\u003ctd>运营/PPC\u003c/td>\n\u003ctd>2026-10-02\u003c/td>\n\u003ctd>每个 ASIN 有促销状态、库存覆盖、预算覆盖和异常处理记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>UK EPR 费用归档\u003c/td>\n\u003ctd>UK\u003c/td>\n\u003ctd>EPR category、service fee、eco-contribution\u003c/td>\n\u003ctd>欧洲运营/财务\u003c/td>\n\u003ctd>2026-10-01\u003c/td>\n\u003ctd>service fee 与 eco-contribution 分开发票归档，费用科目正确\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Amazon Ads Agent 试点表\u003c/td>\n\u003ctd>多站点\u003c/td>\n\u003ctd>PPC campaign\u003c/td>\n\u003ctd>PPC\u003c/td>\n\u003ctd>2026-10-03\u003c/td>\n\u003ctd>试点池 campaign 100% 有库存、毛利、ACoS/TACoS 和人工批准字段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>30-for-30 HS code 映射\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>在售 SKU 与 2027 新品池\u003c/td>\n\u003ctd>供应链/产品开发\u003c/td>\n\u003ctd>2026-10-03\u003c/td>\n\u003ctd>输出可能受益/不确定/无关三分类表\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>更新物流成本模型\u003c/td>\n\u003ctd>US/EU/UK\u003c/td>\n\u003ctd>未锁价海运/卡车/3PL/FBM 应急单\u003c/td>\n\u003ctd>供应链/财务\u003c/td>\n\u003ctd>2026-10-07\u003c/td>\n\u003ctd>模型区分 diesel national/PADD5/California、Drewry 美线/欧线、实际 carrier quote\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>已关闭与继续跟踪事项\u003c/h2>\n\u003cul>\n\u003cli>继续跟踪：BHDR，下一次复查 2026-10-06，若低于 90% 或收到账户通知则升级。\u003c/li>\n\u003cli>继续跟踪：UK EPR Pay on Behalf，下一次复查 2026-10-08，若实际扣费/发票与公告不一致则升级。\u003c/li>\n\u003cli>继续跟踪：Amazon Ads Agent，下一次复查 2026-10-10，若账号出现入口或 Amazon 公布 rollout 市场则升级。\u003c/li>\n\u003cli>继续跟踪：USTR/White House 30-for-30，下一次复查 2026-10-08，等待正式税率、CBP/Federal Register 执行细则。\u003c/li>\n\u003cli>继续跟踪：EU Customs Reform handling fee，下一次复查 2026-10-15，等待 fee 金额和 delegated act。\u003c/li>\n\u003cli>继续跟踪：Product Bundling 2027-01-11，下一次复查 2026-10-15，等待账号侧风险提醒或 Seller Central 帮助页新增解释。\u003c/li>\n\u003cli>本周关闭：无。没有足够证据关闭 BHDR、PBDD、UK EPR、30-for-30 或 Amazon Ads AI 工具相关事项。\u003c/li>\n\u003c/ul>\n\u003ch2>来源与可信度统计\u003c/h2>\n\u003cp>本周合并复查来源约 35 个，其中官方/监管/一手来源 26 个，非官方或行业辅助来源 9 个。核心来源包括中国政府网/国务院办公厅 2026 节假日安排、Amazon Seller Forums US/UK/EU、Amazon Press Center、Amazon Ads、EIA、USTR、White House、European Commission、USPS/Postal Explorer、Drewry、CPSC 和 GOV.UK OPSS。周报只合并已确认新增和实质更新，不纳入单纯转载、活动预热、重复零售宣传、无后台动作的行业评论和无官方确认的关税传闻。\u003c/p>\n\u003cp>生产链接：\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-30\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-09-30", "text": "### Amazon Ads Agent 发布，统一 DSP、广告控制台和 AI 投放建议\n\n- 【影响等级】P2\n- 【站点】多站点，US/UK/DE/FR/IT/ES 重点观察\n- 【发布日期】2026-09-29\n- 【生效日期】暂未公布；DVA+ 未来数月逐步推出\n- 【信息状态】正式公告\n- 【来源】Amazon Press Center：https://press.aboutamazon.com/es/news/advertising/2026/9/amazon-ads-presenta-amazon-ads-agent\n- 发生了什么：Amazon Ads 在 unBoxed 2026 发布 Amazon Ads Agent，把 Amazon DSP 与广告控制台整合到统一体验，并提供对话式 AI，用于创建和优化广告、定义受众、获取实时洞察。公告同时提到 DVA+ 将把 Sponsored Display、程序化、Streaming TV、online video、display 和 audio 放在一个 AI 辅助购买与优化流程中，Sponsored Products 也会出现基于 AI 的 targeting、bid 和 budget 建议。\n- 我们怎么看：这是广告操作方式的变化，不是 Seller Central 强制政策。对相册、Scrapbook、School Memory Book、Portfolio Binder 和 Puzzle Accessories 这类季节性/礼品属性强的品类，AI 建议可能提升关键词扩展、预算分配和跨渠道再营销效率；但若直接一键应用，可能把预算推向库存不足、毛利低、转化不稳定或活动前还未准备好的 ASIN。\n- 建议动作：PPC 负责人在 2026-10-03 前建立“AI 建议复核表”，字段包括 marketplace、campaign、ASIN、库存覆盖天数、毛利率、当前 ACoS/TACoS、建议类型、建议前 bid/budget/targeting、建议后变化、人工批准人和 7 日复盘指标。仅允许选择库存覆盖 >= 21 天、毛利率高于目标线、近 14 天 CVR 不低于类目均值、且 ACoS 未超过目标 +20% 的 campaign 做人工批准测试；验证方式：测试组和对照组分别记录 7 天 CTR、CVR、CPC、ACoS、TACoS 和订单增量，未复盘前不扩大到全账号。\n\n", "title": "Amazon Ads Agent 发布，统一 DSP、广告控制台和 AI 投放建议", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-30\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-30\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bott illed Amazon Business 订单需维持 Business Hour Delivery Rate >= 90%；2026-09-30 为首次通知节点，2026-10-30 仍未改善可能导致相关 seller-fulfilled offer 对 Amazon Business 客户停用。\n- 本次新增变化：2026-09-30 节点已经到期，今天不再是准备期，而是必须读取 Account Health/Delivery Performance 的节点日。US Seller Forums 原公告显示该指标按滚动 14 天衡量，低于 90% 将收到通知；Amazon 建议使用可靠承运商、准确 handling/transit time、Automated Handling Time、Shipping Settings Automation 和 Amazon Buy Shipping。来源：https://sellercentral.amazon.com/seller-forums/discussions/t/57222b70-40df-4574-aa0f-9f815c197987\n- 相比上次变化：从“9月30日前预检查”变为“9月30日当天读数与异常闭环”；行动重点从提醒变为输出订单级失败原因、承运商和配送模板纠偏方案。\n- 变化原因：Amazon 对 Amazon Business 买家的营业时间内收货体验开始执行最低阈值，滚动 14 天窗口会放大近期承运商延误、晚间投递和节前处理波动。\n- 行动是否需要调整：升级为 P0，当天必须处理。US 运营/欧洲运营今天进入 Account Health > Delivery Performance 或 BHDR 相关页面，按 US、UK 分站导出近 14 天 seller-fulfilled Amazon Business 订单，字段必须包含 order ID、ASIN、shipping template、carrier、ship date、promised delivery date、actual delivery timestamp、business-hours pass/fail、failure reason。截止：2026-09-30 18:00；验收：每站 BHDR >= 90%，或形成低于 90% 的订单级纠偏表、承运商替换/Buy Shipping/AHT/SSA 动作和 2026-10-06 复查节点。\n\n", "title": "BHDR 90% 要求进入首个通知节点", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-30\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-30\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>BHDR 90% 要求进入首个通知节点\u003c/h3>\n\u003cul>\n\u003cli>历史事件：amazon-business-bhdr-90-seller-fulfilled-us-2026-09-30\u003c/li>\n\u003cli>上次状态：已推送 US/UK seller-fulfilled Amazon Business 订单需维持 Business Hour Delivery Rate &gt;= 90%；2026-09-30 为首次通知节点，2026-10-30 仍未改善可能导致相关 seller-fulfilled offer 对 Amazon Business 客户停用。\u003c/li>\n\u003cli>本次新增变化：2026-09-30 节点已经到期，今天不再是准备期，而是必须读取 Account Health/Delivery Performance 的节点日。US Seller Forums 原公告显示该指标按滚动 14 天衡量，低于 90% 将收到通知；Amazon 建议使用可靠承运商、准确 handling/transit time、Automated Handling Time、Shipping Settings Automation 和 Amazon Buy Shipping。来源：\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/57222b70-40df-4574-aa0f-9f815c197987\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/seller-forums/discussions/t/57222b70-40df-4574-aa0f-9f815c197987\u003c/a>\u003c/li>\n\u003cli>相比上次变化：从“9月30日前预检查”变为“9月30日当天读数与异常闭环”；行动重点从提醒变为输出订单级失败原因、承运商和配送模板纠偏方案。\u003c/li>\n\u003cli>变化原因：Amazon 对 Amazon Business 买家的营业时间内收货体验开始执行最低阈值，滚动 14 天窗口会放大近期承运商延误、晚间投递和节前处理波动。\u003c/li>\n\u003cli>行动是否需要调整：升级为 P0，当天必须处理。US 运营/欧洲运营今天进入 Account Health &gt; Delivery Performance 或 BHDR 相关页面，按 US、UK 分站导出近 14 天 seller-fulfilled Amazon Business 订单，字段必须包含 order ID、ASIN、shipping template、carrier、ship date、promised delivery date、actual delivery timestamp、business-hours pass/fail、failure reason。截止：2026-09-30 18:00；验收：每站 BHDR &gt;= 90%，或形成低于 90% 的订单级纠偏表、承运商替换/Buy Shipping/AHT/SSA 动作和 2026-10-06 复查节点。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-30\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-30", "text": "### EIA 柴油价格更新，US 物流成本压力小幅回落但仍高位\n\n- 历史事件：us-eia-diesel-logistics-cost-signal-2026-09-09\n- 上次状态：2026-09-24 已推送 EIA 2026-09-22 release，US on-highway diesel 为 USD 6.529/gal，周环比上涨 USD 0.244/gal，用于 US 10 月入仓、drayage、3PL 和 FBM 应急成本复核。\n- 本次新增变化：EIA 2026-09-29 release 显示 2026-09-28 数据周 US on-highway diesel 为 USD 6.382/gal，较 2026-09-21 的 USD 6.529/gal 下降 USD 0.147/gal；West Coast 为 USD 7.357/gal，California 为 USD 8.181/gal，仍明显高于全国均值。来源：https://www.eia.gov/petroleum/gasdiesel/\n- 相比上次变化：从“周环比上行、短期成本压力上升”调整为“周环比回落，但绝对价格和西海岸/加州差异仍高”；不支持立即下调售价或促销折扣，只能更新成本模型中的燃油敏感性。\n- 变化原因：EIA 周度燃油价格波动回落，但美国区域差异仍会影响港口提柜、卡车派送、3PL 和 FBM 应急配送报价。\n- 行动是否需要调整：降级为 P2。供应链/财务在 2026-10-02 前更新 US inbound/FBM emergency cost model，字段包括 national diesel、PADD5 diesel、California diesel、carrier fuel surcharge、drayage quote、3PL outbound quote、ASIN landed cost impact。验证方式：只对未锁价运输单和 10 月新报价做模型更新；已锁价或 FBA 主履约 ASIN 不做售价动作。\n\n", "title": "EIA 柴油价格更新，US 物流成本压力小幅回落但仍高位", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"repor -24 已推送 EIA 2026-09-22 release，US on-highway diesel 为 USD 6.529/gal，周环比上涨 USD 0.244/gal，用于 US 10 月入仓、drayage、3PL 和 FBM 应急成本复核。\u003c/li>\n\u003cli>本次新增变化：EIA 2026-09-29 release 显示 2026-09-28 数据周 US on-highway diesel 为 USD 6.382/gal，较 2026-09-21 的 USD 6.529/gal 下降 USD 0.147/gal；West Coast 为 USD 7.357/gal，California 为 USD 8.181/gal，仍明显高于全国均值。来源：\u003ca href=\"https://www.eia.gov/petroleum/gasdiesel/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.eia.gov/petroleum/gasdiesel/\u003c/a>\u003c/li>\n\u003cli>相比上次变化：从“周环比上行、短期成本压力上升”调整为“周环比回落，但绝对价格和西海岸/加州差异仍高”；不支持立即下调售价或促销折扣，只能更新成本模型中的燃油敏感性。\u003c/li>\n\u003cli>变化原因：EIA 周度燃油价格波动回落，但美国区域差异仍会影响港口提柜、卡车派送、3PL 和 FBM 应急配送报价。\u003c/li>\n\u003cli>行动是否需要调整：降级为 P2。供应链/财务在 2026-10-02 前更新 US inbound/FBM emergency cost model，字段包括 national diesel、PADD5 diesel、California diesel、carrier fuel surcharge、drayage quote、3PL outbound quote、ASIN landed cost impact。验证方式：只对未锁价运输单和 10 月新报价做模型更新；已锁价或 FBA 主履约 ASIN 不做售价动作。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-30\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}]}, {"date": "2026-09-29", "text": "# 亚马逊及海外市场情报增量日报｜2026-09-29\n\n## 今日判断\n\n今天有两类需要团队处理的增量变化：UK 站 EPR Pay on Behalf 服务费从“账户层级预留后再扣”切换为按周期内首次符合条件销售后 30 天内直接扣费；US/UK seller-fulfilled 订单的 Business Hour Delivery Rate 节点集中落在 2026-09-30。最高优先级不是改 Listing，而是财务和运营在今天完成 UK EPR 费用对账口径、US/UK BHDR 后台核查和异常订单清单。USTR/White House 的 30-for-30 清单属于官方关税待遇建议，涉及 household goods、toys 等中国进口品，但尚无正式税率、生效日或 CBP 执行规则，只能进入 P2 情景测算。今天不是本周最后一个中国大陆法定工作日，周报应在 2026-09-30 生成。\n\n## 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n|---|---|---|---|---|---|\n| P1 | UK EPR Pay on Behalf 服务费改为 30 天内直接扣费，GBP 20/年/适用 EPR 类别不变 | UK | 财务/EPR/合规/Invoice/费用归集 | 2026-09 起执行；首次符合条件销售后 30 天内扣费 | 是，核对 EPR dashboard、费用科目和发票拆分 |\n| P1 | US/UK seller-fulfilled BHDR 90% 节点临近 | US/UK | FBM/SFP/Amazon Business/配送模板/Account Health | 2026-09-30 首次通知节点；2026-10-30 可能停用相关 offer | 是，导出近 14 天 seller-fulfilled 订单并排查失败原因 |\n| P2 | U.S.-China Board of Trade 公布 30-for-30 推荐清单 | US | 关税/landed cost/新品开发/供应链情景模型 | 发布 2026-09-27/2026-09-28；正式生效日期暂未公布 | 是，仅做 HS/品类映射，不调整报价和售价 |\n\n## 今日新情报\n\n### UK EPR Pay on Behalf 服务费改为 30 天内直接扣费\n\n- 【影响等级】P1\n- 【站点】UK\n- 【发布日期】2026-09-28\n- 【生效日期】2026-09 起；每个 reporting period 内首次 qualifying sale 后 30 天内扣费\n- 【信息状态】正式公告\n- 【来源】Amazon Seller Forums / News_Amazon：https://sellercentral-europe.amazon.com/seller-forums/discussions/t/1373befc-4bd7-43a5-86d2-858411599415\n- 发生了什么：Amazon UK 公告称，EPR Pay on Behalf 服务费将不再先放入账户层级 reserve 后续扣款，而是在每个 reporting period 注册或首次 qualifying sale 后 30 天内直接从销售账户扣取。服务费金额保持 GBP 20/年/适用 EPR 类别不变，但 service fee 与 eco-contribution fee 将分开开票。\n- 我们怎么看：这不是新增税费金额，但会影响 UK 站现金流、费用入账、毛利看板和发票归档。相册、Scrapbook、Portfolio Binder、补充页等纸品/包装类 SKU 如果在 UK 触发 EPR obligation，财务需要避免把 GBP 20 服务费误判为异常扣费或广告/平台费。\n- 建议动作：UK 运营今天进入 Seller Central > Reports > Compliance 或 EPR Pay on Behalf dashboard，导出 enrollment status、applicable EPR categories、service fee、eco-contribution fee 和 invoice 明细；财务在费用表新增字段：EPR category、fee type、reporting period、invoice number、deduction date。负责人：欧洲运营/财务；截止：2026-10-01 18:00；验证方式：每个 UK EPR 适用类目有 GBP 20 服务费记录或明确未触发原因，且 service fee 与 eco-contribution 分开发票归档。\n\n### U.S.-China Board of Trade 公布 30-for-30 推荐清单\n\n- 【影响等级】P2\n- 【站点】US\n- 【发布日期】2026-09-27（USTR statement）；2026-09-28（White House product list）\n- 【生效日期】暂未公布\n- 【信息状态】政府正式发布的政策建议 / 待正式实施\n- 【来源】USTR：https://ustr.gov/about/policy-offices/press-office/press-releases/2026/september/ambassador-greer-issues-statement-announcement-recommendations-us-china-board-trade；White House product list：https://www.whitehouse.gov/releases/2026/09/u-s-china-board-of-trade/\n- 发生了什么：USTR 表示 U.S.-China Board of Trade 推荐两国各约 USD 30 billion 的非敏感商品未来可能获得更有利关税待遇；White House 页面列出推荐产品清单。USTR 文中点名 household goods、toys 等中国进口商品，但目前没有正式税率、执行日期、CBP 指引或 Amazon 后台规则。\n- 我们怎么看：这对礼品、家居、拼图/玩具周边、纸品收纳等选品可能是中期 landed cost 机会，但现在不是降价或重做报价的触发点。若我们有 Puzzle Accessories 或 Gift/Craft 周边新品，应该先做 HS code 映射和供应商原产地资料准备，等正式税率再进价格模型。\n- 建议动作：供应链/产品开发在 2026-10-03 前把当前 US 在售和 2027 新品池按 HS code、品类关键词、供应商、原产地、当前 duty rate、年化采购额建立映射表；优先筛选 household goods、toys、craft/gift accessory、paper/storage adjacent 相关 SKU。验证方式：输出一张“可能受益/不确定/无关”三分类表；没有 CBP/USTR 正式税率前，不改售价、不改促销折扣、不承诺供应商成本下降。\n\n## 已有事件的重要更新\n\n### BHDR 90% 要求从 US 补充到 UK seller-fulfilled 订单范围\n\n- 历史事件：amazon-business-bhdr-90-seller-fulfilled-us-2026-09-30\n- 上次状态：2026-09-28 已推送 US Amazon Business seller-fulfilled 订单 14 天滚动 Business Hour Delivery Rate 需达到 90%，2026-09-30 低于 90% 将收到通知，2026-10-30 仍未改善可能影响 Amazon Business 客户可见性。\n- 本次新增变化：补查 BHDR 持续关注事项时发现 UK Seller Forums 同类官方公告，Amazon.co.uk seller-fulfilled order 也要求 Business Hour Delivery Rate 达到 90%，2026-09-30 进入通知节点，2026-10-30 未改善可能导致受影响 offer 对 Amazon Business 客户停用。来源：https://sellercentral.amazon.co.uk/seller-forums/discussions/t/20198e40-521c-4a27-b682-3f088fa0a7dc\n- 相比上次变化：影响范围从 US 扩展到 UK；US 聚焦 Amazon Business seller-fulfilled 订单，UK 同样需要检查 FBM/SFP 或任何自配送兜底 offer 的营业时间送达表现。\n- 变化原因：Amazon 在 US/UK 对 seller-fulfilled 订单的 B2B 送达体验提出一致性要求，重点从单纯准时送达扩展到客户营业时间内送达。\n- 行动是否需要调整：升级为 US/UK 双站 P1。US 运营和欧洲运营今天分别进入 Account Health/Delivery Performance 或相关 BHDR 页面，导出近 14 天 seller-fulfilled 订单，字段包含 marketplace、order type、ASIN、shipping template、carrier、promised delivery date、actual delivery timestamp、business-hours delivery pass/fail、failure reason。截止：2026-09-29 18:00；复查：2026-09-30；验收：US/UK 分站 BHDR >= 90%，或输出低于 90% 的订单清单和配送模板纠偏方案。\n\n## 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n|---|---|---|---|---|---|---|\n| P1 | 导出 UK EPR Pay on Behalf dashboard 和 invoice 明细，区分 service fee 与 eco-contribution fee | UK | 欧洲运营/财务 | 2026-10-01 | 每个 EPR category 有 enrollment status、fee type、invoice number、deduction date 和 GBP 金额；GBP 20/年服务费单独归集 | 2026-10-08 |\n| P1 | 检查 US/UK Business Hour Delivery Rate，并导出近 14 天 seller-fulfilled 失败订单 | US/UK | US 运营/欧洲运营 | 2026-09-29 | US/UK 分站 BHDR >= 90%，或输出失败订单、承运商、模板、纠偏动作清单 | 2026-09-30 |\n| P1 | 复查 PBDD 主推池，逐个核对 Deal/Coupon/PED 状态、可售库存、reserved units、FC receiving 和广告日预算 | US/UK/DE/FR/IT/ES | 运营/PPC | 2026-10-02 | 每个主推 ASIN 有促销状态、库存覆盖天数、预算覆盖天数、异常处理方式和截图/后台链接 | 2026-10-02 |\n| P2 | 建立 USTR/White House 30-for-30 清单与现有 SKU/新品池的 HS code 映射 | US | 供应链/产品开发 | 2026-10-03 | 输出“可能受益/不确定/无关”三分类表，含 HS code、供应商、原产地、当前 duty rate、年化采购额 | 2026-10-08 |\n| P2 | 复核 EIA 9月29日柴油数据是否发布，并更新 US 10 月入仓和 FBM 应急配送成本模型 | US | 供应链/财务 | 2026-09-30 | 若数据已发布，模型记录 diesel price、week-over-week change、承运商燃油附加费影响；未发布则记录官方 next release 状态 | 2026-09-30 |\n\n## 持续关注\n\n- 事项：US/UK Business Hour Delivery Rate。当前状态：2026-09-30 为首次通知节点，US/UK seller-fulfilled 订单均需排查。下次复查日期：2026-09-30。触发升级条件：任一站点 BHDR \u003c 90%、失败订单集中在某承运商/配送模板、或 2026-10-30 前无法改善。\n- 事项：UK EPR Pay on Behalf 费用入账。当前状态：服务费扣费时间与发票拆分方式变化，金额 GBP 20/年/适用 EPR 类别不变。下次复查日期：2026-10-08。触发升级条件：出现未归类 EPR 扣费、发票缺失、类目适用范围不清，或 eco-contribution fee 与 service fee 混账。\n- 事项：USTR/White House 30-for-30 推荐清单。当前状态：官方建议清单已发布，但无正式税率、生效日或 CBP 执行规则。下次复查日期：2026-10-08。触发升级条件：USTR/CBP/Federal Register 公布正式税率、执行日期、进口申报规则，或清单中明确覆盖我方核心 HS code。\n- 事项：PBDD 主推池。当前状态：节后进入活动前执行复查。下次复查日期：2026-10-02。触发升级条件：Deal/Coupon/PED 不可执行、可售库存低于预计活动销量 1.3 倍、reserved units 异常、或广告预算覆盖低于 2 天。\n- 事项：EIA US 柴油价。当前状态：当前页面仍显示 2026-09-22 数据和 2026-09-29 next release，当前中国时间尚未观察到新数值。下次复查日期：2026-09-30。触发升级条件：柴油价继续周环比上涨、承运商燃油附加费超过模型 +3%、或 US 10 月入仓报价上调。\n- 事项：EU Customs Reform 小包 handling fee。当前状态：2026-11-01 前引入，金额待 delegated act。下次复查日期：2026-10-15。触发升级条件：欧盟公布 fee 金额、货代报价新增该费用、或 DE/FR/IT/ES 清关资料字段被退回。\n\n## 情报边界与可信度\n\n本次窗口覆盖 2026-09-28 10:06:37 至 2026-09-29 09:03:12（Asia/Shanghai），并补查长期索引中 BHDR、PBDD、Product Bundling、USPS、EIA、EU Customs Reform、Amazon Ads AI 工具、Drewry WCI 等持续关注事项。复查来源约 18 个，其中官方/监管/一手来源 14 个，包括中国政府网/国务院办公厅、Amazon Seller Forums US/UK/EU、Amazon Seller Central Help、Amazon Ads、About Amazon、EIA、USTR、White House、CBP、European Commission、CPSC、GOV.UK OPSS、USPS/Postal Explorer、Drewry；非官方或行业辅助来源 4 个，仅用于发现线索和排重。纳入日报的新事件 2 条，纳入已有事件重要更新 1 条；仍待确认事项 7 条：UK EPR 实际账号扣费、US/UK BHDR 账号侧具体数值、PBDD 各账号实际可执行状态、Product Bundling 账号侧风险提醒、USPS 价格在 Buy Shipping 的账号侧同步、EU handling fee 金额、USTR/CBP 关税执行细则。\n\n今天排除了 Amazon Accelerate / unBoxed 参会与内容预热、重复的 Prime Big Deal Days 零售宣传、无新增后台动作的 AI shopping/AI ads 评论、EIA 尚未发布的新柴油数值、与相册/纸品/礼品/收纳/拼图配件产品线无直接关系的 CPSC/OPSS 召回，以及没有 USTR/CBP/European Commission/Amazon 官方确认的新关税传闻。工作日门禁来源：中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（国办发明电〔2025〕7号，https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/2025/issue_12406/202511/content_7048922.html）。文件显示 2026 年中秋节为 2026-09-25 至 2026-09-27 放假，共 3 天；国庆节为 2026-10-01 至 2026-10-07 放假，2026-09-20 和 2026-10-10 上班。因此 2026-09-29 为大陆法定工作日，但不是本周最后一个大陆法定工作日。\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-29\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-29\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报增量日报｜2026-09-29\u003c/h1>\n\u003ch2>今日判断\u003c/h2>\n\u003cp>今天有两类需要团队处理的增量变化：UK 站 EPR Pay on Behalf 服务费从“账户层级预留后再扣”切换为按周期内首次符合条件销售后 30 天内直接扣费；US/UK seller-fulfilled 订单的 Business Hour Delivery Rate 节点集中落在 2026-09-30。最高优先级不是改 Listing，而是财务和运营在今天完成 UK EPR 费用对账口径、US/UK BHDR 后台核查和异常订单清单。USTR/White House 的 30-for-30 清单属于官方关税待遇建议，涉及 household goods、toys 等中国进口品，但尚无正式税率、生效日或 CBP 执行规则，只能进入 P2 情景测算。今天不是本周最后一个中国大陆法定工作日，周报应在 2026-09-30 生成。\u003c/p>\n\u003ch2>优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>影响站点\u003c/th>\n\u003cth>影响模块\u003c/th>\n\u003cth>截止/生效日期\u003c/th>\n\u003cth>今天是否需要动作\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>UK EPR Pay on Behalf 服务费改为 30 天内直接扣费，GBP 20/年/适用 EPR 类别不变\u003c/td>\n\u003ctd>UK\u003c/td>\n\u003ctd>财务/EPR/合规/Invoice/费用归集\u003c/td>\n\u003ctd>2026-09 起执行；首次符合条件销售后 30 天内扣费\u003c/td>\n\u003ctd>是，核对 EPR dashboard、费用科目和发票拆分\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>US/UK seller-fulfilled BHDR 90% 节点临近\u003c/td>\n\u003ctd>US/UK\u003c/td>\n\u003ctd>FBM/SFP/Amazon Business/配送模板/Account Health\u003c/td>\n\u003ctd>2026-09-30 首次通知节点；2026-10-30 可能停用相关 offer\u003c/td>\n\u003ctd>是，导出近 14 天 seller-fulfilled 订单并排查失败原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>U.S.-China Board of Trade 公布 30-for-30 推荐清单\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>关税/landed cost/新品开发/供应链情景模型\u003c/td>\n\u003ctd>发布 2026-09-27/2026-09-28；正式生效日期暂未公布\u003c/td>\n\u003ctd>是，仅做 HS/品类映射，不调整报价和售价\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>今日新情报\u003c/h2>\n\u003ch3>UK EPR Pay on Behalf 服务费改为 30 天内直接扣费\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P1\u003c/li>\n\u003cli>【站点】UK\u003c/li>\n\u003cli>【发布日期】2026-09-28\u003c/li>\n\u003cli>【生效日期】2026-09 起；每个 reporting period 内首次 qualifying sale 后 30 天内扣费\u003c/li>\n\u003cli>【信息状态】正式公告\u003c/li>\n\u003cli>【来源】Amazon Seller Forums / News_Amazon：\u003ca href=\"https://sellercentral-europe.amazon.com/seller-forums/discussions/t/1373befc-4bd7-43a5-86d2-858411599415\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral-europe.amazon.com/seller-forums/discussions/t/1373befc-4bd7-43a5-86d2-858411599415\u003c/a>\u003c/li>\n\u003cli>发生了什么：Amazon UK 公告称，EPR Pay on Behalf 服务费将不再先放入账户层级 reserve 后续扣款，而是在每个 reporting period 注册或首次 qualifying sale 后 30 天内直接从销售账户扣取。服务费金额保持 GBP 20/年/适用 EPR 类别不变，但 service fee 与 eco-contribution fee 将分开开票。\u003c/li>\n\u003cli>我们怎么看：这不是新增税费金额，但会影响 UK 站现金流、费用入账、毛利看板和发票归档。相册、Scrapbook、Portfolio Binder、补充页等纸品/包装类 SKU 如果在 UK 触发 EPR obligation，财务需要避免把 GBP 20 服务费误判为异常扣费或广告/平台费。\u003c/li>\n\u003cli>建议动作：UK 运营今天进入 Seller Central &gt; Reports &gt; Compliance 或 EPR Pay on Behalf dashboard，导出 enrollment status、applicable EPR categories、service fee、eco-contribution fee 和 invoice 明细；财务在费用表新增字段：EPR category、fee type、reporting period、invoice number、deduction date。负责人：欧洲运营/财务；截止：2026-10-01 18:00；验证方式：每个 UK EPR 适用类目有 GBP 20 服务费记录或明确未触发原因，且 service fee 与 eco-contribution 分开发票归档。\u003c/li>\n\u003c/ul>\n\u003ch3>U.S.-China Board of Trade 公布 30-for-30 推荐清单\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】US\u003c/li>\n\u003cli>【发布日期】2026-09-27（USTR statement）；2026-09-28（White House product list）\u003c/li>\n\u003cli>【生效日期】暂未公布\u003c/li>\n\u003cli>【信息状态】政府正式发布的政策建议 / 待正式实施\u003c/li>\n\u003cli>【来源】USTR：\u003ca href=\"https://ustr.gov/about/policy-offices/press-office/press-releases/2026/september/ambassador-greer-issues-statement-announcement-recommendations-us-china-board-trade；White\" target=\"_blank\" rel=\"noopener noreferrer\">https://ustr.gov/about/policy-offices/press-office/press-releases/2026/september/ambassador-greer-issues-statement-announcement-recommendations-us-china-board-trade；White\u003c/a> House product list：\u003ca href=\"https://www.whitehouse.gov/releases/2026/09/u-s-china-board-of-trade/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.whitehouse.gov/releases/2026/09/u-s-china-board-of-trade/\u003c/a>\u003c/li>\n\u003cli>发生了什么：USTR 表示 U.S.-China Board of Trade 推荐两国各约 USD 30 billion 的非敏感商品未来可能获得更有利关税待遇；White House 页面列出推荐产品清单。USTR 文中点名 household goods、toys 等中国进口商品，但目前没有正式税率、执行日期、CBP 指引或 Amazon 后台规则。\u003c/li>\n\u003cli>我们怎么看：这对礼品、家居、拼图/玩具周边、纸品收纳等选品可能是中期 landed cost 机会，但现在不是降价或重做报价的触发点。若我们有 Puzzle Accessories 或 Gift/Craft 周边新品，应该先做 HS code 映射和供应商原产地资料准备，等正式税率再进价格模型。\u003c/li>\n\u003cli>建议动作：供应链/产品开发在 2026-10-03 前把当前 US 在售和 2027 新品池按 HS code、品类关键词、供应商、原产地、当前 duty rate、年化采购额建立映射表；优先筛选 household goods、toys、craft/gift accessory、paper/storage adjacent 相关 SKU。验证方式：输出一张“可能受益/不确定/无关”三分类表；没有 CBP/USTR 正式税率前，不改售价、不改促销折扣、不承诺供应商成本下降。\u003c/li>\n\u003c/ul>\n\u003ch2>已有事件的重要更新\u003c/h2>\n\u003ch3>BHDR 90% 要求从 US 补充到 UK seller-fulfilled 订单范围\u003c/h3>\n\u003cul>\n\u003cli>历史事件：amazon-business-bhdr-90-seller-fulfilled-us-2026-09-30\u003c/li>\n\u003cli>上次状态：2026-09-28 已推送 US Amazon Business seller-fulfilled 订单 14 天滚动 Business Hour Delivery Rate 需达到 90%，2026-09-30 低于 90% 将收到通知，2026-10-30 仍未改善可能影响 Amazon Business 客户可见性。\u003c/li>\n\u003cli>本次新增变化：补查 BHDR 持续关注事项时发现 UK Seller Forums 同类官方公告，Amazon.co.uk seller-fulfilled order 也要求 Business Hour Delivery Rate 达到 90%，2026-09-30 进入通知节点，2026-10-30 未改善可能导致受影响 offer 对 Amazon Business 客户停用。来源：\u003ca href=\"https://sellercentral.amazon.co.uk/seller-forums/discussions/t/20198e40-521c-4a27-b682-3f088fa0a7dc\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.co.uk/seller-forums/discussions/t/20198e40-521c-4a27-b682-3f088fa0a7dc\u003c/a>\u003c/li>\n\u003cli>相比上次变化：影响范围从 US 扩展到 UK；US 聚焦 Amazon Business seller-fulfilled 订单，UK 同样需要检查 FBM/SFP 或任何自配送兜底 offer 的营业时间送达表现。\u003c/li>\n\u003cli>变化原因：Amazon 在 US/UK 对 seller-fulfilled 订单的 B2B 送达体验提出一致性要求，重点从单纯准时送达扩展到客户营业时间内送达。\u003c/li>\n\u003cli>行动是否需要调整：升级为 US/UK 双站 P1。US 运营和欧洲运营今天分别进入 Account Health/Delivery Performance 或相关 BHDR 页面，导出近 14 天 seller-fulfilled 订单，字段包含 marketplace、order type、ASIN、shipping template、carrier、promised delivery date、actual delivery timestamp、business-hours delivery pass/fail、failure reason。截止：2026-09-29 18:00；复查：2026-09-30；验收：US/UK 分站 BHDR &gt;= 90%，或输出低于 90% 的订单清单和配送模板纠偏方案。\u003c/li>\n\u003c/ul>\n\u003ch2>今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>导出 UK EPR Pay on Behalf dashboard 和 invoice 明细，区分 service fee 与 eco-contribution fee\u003c/td>\n\u003ctd>UK\u003c/td>\n\u003ctd>欧洲运营/财务\u003c/td>\n\u003ctd>2026-10-01\u003c/td>\n\u003ctd>每个 EPR category 有 enrollment status、fee type、invoice number、deduction date 和 GBP 金额；GBP 20/年服务费单独归集\u003c/td>\n\u003ctd>2026-10-08\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>检查 US/UK Business Hour Delivery Rate，并导出近 14 天 seller-fulfilled 失败订单\u003c/td>\n\u003ctd>US/UK\u003c/td>\n\u003ctd>US 运营/欧洲运营\u003c/td>\n\u003ctd>2026-09-29\u003c/td>\n\u003ctd>US/UK 分站 BHDR &gt;= 90%，或输出失败订单、承运商、模板、纠偏动作清单\u003c/td>\n\u003ctd>2026-09-30\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>复查 PBDD 主推池，逐个核对 Deal/Coupon/PED 状态、可售库存、reserved units、FC receiving 和广告日预算\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES\u003c/td>\n\u003ctd>运营/PPC\u003c/td>\n\u003ctd>2026-10-02\u003c/td>\n\u003ctd>每个主推 ASIN 有促销状态、库存覆盖天数、预算覆盖天数、异常处理方式和截图/后台链接\u003c/td>\n\u003ctd>2026-10-02\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>建立 USTR/White House 30-for-30 清单与现有 SKU/新品池的 HS code 映射\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>供应链/产品开发\u003c/td>\n\u003ctd>2026-10-03\u003c/td>\n\u003ctd>输出“可能受益/不确定/无关”三分类表，含 HS code、供应商、原产地、当前 duty rate、年化采购额\u003c/td>\n\u003ctd>2026-10-08\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>复核 EIA 9月29日柴油数据是否发布，并更新 US 10 月入仓和 FBM 应急配送成本模型\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>供应链/财务\u003c/td>\n\u003ctd>2026-09-30\u003c/td>\n\u003ctd>若数据已发布，模型记录 diesel price、week-over-week change、承运商燃油附加费影响；未发布则记录官方 next release 状态\u003c/td>\n\u003ctd>2026-09-30\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>持续关注\u003c/h2>\n\u003cul>\n\u003cli>事项：US/UK Business Hour Delivery Rate。当前状态：2026-09-30 为首次通知节点，US/UK seller-fulfilled 订单均需排查。下次复查日期：2026-09-30。触发升级条件：任一站点 BHDR &lt; 90%、失败订单集中在某承运商/配送模板、或 2026-10-30 前无法改善。\u003c/li>\n\u003cli>事项：UK EPR Pay on Behalf 费用入账。当前状态：服务费扣费时间与发票拆分方式变化，金额 GBP 20/年/适用 EPR 类别不变。下次复查日期：2026-10-08。触发升级条件：出现未归类 EPR 扣费、发票缺失、类目适用范围不清，或 eco-contribution fee 与 service fee 混账。\u003c/li>\n\u003cli>事项：USTR/White House 30-for-30 推荐清单。当前状态：官方建议清单已发布，但无正式税率、生效日或 CBP 执行规则。下次复查日期：2026-10-08。触发升级条件：USTR/CBP/Federal Register 公布正式税率、执行日期、进口申报规则，或清单中明确覆盖我方核心 HS code。\u003c/li>\n\u003cli>事项：PBDD 主推池。当前状态：节后进入活动前执行复查。下次复查日期：2026-10-02。触发升级条件：Deal/Coupon/PED 不可执行、可售库存低于预计活动销量 1.3 倍、reserved units 异常、或广告预算覆盖低于 2 天。\u003c/li>\n\u003cli>事项：EIA US 柴油价。当前状态：当前页面仍显示 2026-09-22 数据和 2026-09-29 next release，当前中国时间尚未观察到新数值。下次复查日期：2026-09-30。触发升级条件：柴油价继续周环比上涨、承运商燃油附加费超过模型 +3%、或 US 10 月入仓报价上调。\u003c/li>\n\u003cli>事项：EU Customs Reform 小包 handling fee。当前状态：2026-11-01 前引入，金额待 delegated act。下次复查日期：2026-10-15。触发升级条件：欧盟公布 fee 金额、货代报价新增该费用、或 DE/FR/IT/ES 清关资料字段被退回。\u003c/li>\n\u003c/ul>\n\u003ch2>情报边界与可信度\u003c/h2>\n\u003cp>本次窗口覆盖 2026-09-28 10:06:37 至 2026-09-29 09:03:12（Asia/Shanghai），并补查长期索引中 BHDR、PBDD、Product Bundling、USPS、EIA、EU Customs Reform、Amazon Ads AI 工具、Drewry WCI 等持续关注事项。复查来源约 18 个，其中官方/监管/一手来源 14 个，包括中国政府网/国务院办公厅、Amazon Seller Forums US/UK/EU、Amazon Seller Central Help、Amazon Ads、About Amazon、EIA、USTR、White House、CBP、European Commission、CPSC、GOV.UK OPSS、USPS/Postal Explorer、Drewry；非官方或行业辅助来源 4 个，仅用于发现线索和排重。纳入日报的新事件 2 条，纳入已有事件重要更新 1 条；仍待确认事项 7 条：UK EPR 实际账号扣费、US/UK BHDR 账号侧具体数值、PBDD 各账号实际可执行状态、Product Bundling 账号侧风险提醒、USPS 价格在 Buy Shipping 的账号侧同步、EU handling fee 金额、USTR/CBP 关税执行细则。\u003c/p>\n\u003cp>今天排除了 Amazon Accelerate / unBoxed 参会与内容预热、重复的 Prime Big Deal Days 零售宣传、无新增后台动作的 AI shopping/AI ads 评论、EIA 尚未发布的新柴油数值、与相册/纸品/礼品/收纳/拼图配件产品线无直接关系的 CPSC/OPSS 召回，以及没有 USTR/CBP/European Commission/Amazon 官方确认的新关税传闻。工作日门禁来源：中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（国办发明电〔2025〕7号，\u003ca href=\"https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/2025/issue_12406/202511/content_7048922.html）。文件显示\" target=\"_blank\" rel=\"noopener noreferrer\">https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/2025/issue_12406/202511/content_7048922.html）。文件显示\u003c/a> 2026 年中秋节为 2026-09-25 至 2026-09-27 放假，共 3 天；国庆节为 2026-10-01 至 2026-10-07 放假，2026-09-20 和 2026-10-10 上班。因此 2026-09-29 为大陆法定工作日，但不是本周最后一个大陆法定工作日。\u003c/p>\n\u003cp>生产链接：\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-29\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-09-29", "text": "### UK EPR Pay on Behalf 服务费改为 30 天内直接扣费\n\n- 【影响等级】P1\n- 【站点】UK\n- 【发布日期】2026-09-28\n- 【生效日期】2026-09 起；每个 reporting period 内首次 qualifying sale 后 30 天内扣费\n- 【信息状态】正式公告\n- 【来源】Amazon Seller Forums / News_Amazon：https://sellercentral-europe.amazon.com/seller-forums/discussions/t/1373befc-4bd7-43a5-86d2-858411599415\n- 发生了什么：Amazon UK 公告称，EPR Pay on Behalf 服务费将不再先放入账户层级 reserve 后续扣款，而是在每个 reporting period 注册或首次 qualifying sale 后 30 天内直接从销售账户扣取。服务费金额保持 GBP 20/年/适用 EPR 类别不变，但 service fee 与 eco-contribution fee 将分开开票。\n- 我们怎么看：这不是新增税费金额，但会影响 UK 站现金流、费用入账、毛利看板和发票归档。相册、Scrapbook、Portfolio Binder、补充页等纸品/包装类 SKU 如果在 UK 触发 EPR obligation，财务需要避免把 GBP 20 服务费误判为异常扣费或广告/平台费。\n- 建议动作：UK 运营今天进入 Seller Central > Reports > Compliance 或 EPR Pay on Behalf dashboard，导出 enrollment status、applicable EPR categories、service fee、eco-contribution fee 和 invoice 明细；财务在费用表新增字段：EPR category、fee type、reporting period、invoice number、deduction date。负责人：欧洲运营/财务；截止：2026-10-01 18:00；验证方式：每个 UK EPR 适用类目有 GBP 20 服务费记录或明确未触发原因，且 service fee 与 eco-contribution 分开发票归档。\n\n", "title": "UK EPR Pay on Behalf 服务费改为 30 天内直接扣费", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-29\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-29\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>UK EPR Pay on Behalf 服务费改为 30 天内直接扣费\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P1\u003c/li>\n\u003cli>【站点】UK\u003c/li>\n\u003cli>【发布日期】2026-09-28\u003c/li>\n\u003cli>【生效日期】2026-09 起；每个 reporting period 内首次 qualifying sale 后 30 天内扣费\u003c/li>\n\u003cli>【信息状态】正式公告\u003c/li>\n\u003cli>【来源】Amazon Seller Forums / News_Amazon：\u003ca href=\"https://sellercentral-europe.amazon.com/seller-forums/discussions/t/1373befc-4bd7-43a5-86d2-858411599415\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral-europe.amazon.com/seller-forums/discussions/t/1373befc-4bd7-43a5-86d2-858411599415\u003c/a>\u003c/li>\n\u003cli>发生了什么：Amazon UK 公告称，EPR Pay on Behalf 服务费将不再先放入账户层级 reserve 后续扣款，而是在每个 reporting period 注册或首次 qualifying sale 后 30 天内直接从销售账户扣取。服务费金额保持 GBP 20/年/适用 EPR 类别不变，但 service fee 与 eco-contribution fee 将分开开票。\u003c/li>\n\u003cli>我们怎么看：这不是新增税费金额，但会影响 UK 站现金流、费用入账、毛利看板和发票归档。相册、Scrapbook、Portfolio Binder、补充页等纸品/包装类 SKU 如果在 UK 触发 EPR obligation，财务需要避免把 GBP 20 服务费误判为异常扣费或广告/平台费。\u003c/li>\n\u003cli>建议动作：UK 运营今天进入 Seller Central &gt; Reports &gt; Compliance 或 EPR Pay on Behalf dashboard，导出 enrollment status、applicable EPR categories、service fee、eco-contribution fee 和 invoice 明细；财务在费用表新增字段：EPR category、fee type、reporting period、invoice number、deduction date。负责人：欧洲运营/财务；截止：2026-10-01 18:00；验证方式：每个 UK EPR 适用类目有 GBP 20 服务费记录或明确未触发原因，且 service fee 与 eco-contribution 分开发票归档。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-29\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-29", "text": "### U.S.-China Board of Trade 公布 30-for-30 推荐清单\n\n- 【影响等级】P2\n- 【站点】US\n- 【发布日期】2026-09-27（USTR statement）；2026-09-28（White House product list）\n- 【生效日期】暂未公布\n- 【信息状态】政府正式发布的政策建议 / 待正式实施\n- 【来源】USTR：https://ustr.gov/about/policy-offices/press-office/press-releases/2026/september/ambassador-greer-issues-statement-announcement-recommendations-us-china-board-trade；White House product list：https://www.whitehouse.gov/releases/2026/09/u-s-china-board-of-trade/\n- 发生了什么：USTR 表示 U.S.-China Board of Trade 推荐两国各约 USD 30 billion 的非敏感商品未来可能获得更有利关税待遇；White House 页面列出推荐产品清单。USTR 文中点名 household goods、toys 等中国进口商品，但目前没有正式税率、执行日期、CBP 指引或 Amazon 后台规则。\n- 我们怎么看：这对礼品、家居、拼图/玩具周边、纸品收纳等选品可能是中期 landed cost 机会，但现在不是降价或重做报价的触发点。若我们有 Puzzle Accessories 或 Gift/Craft 周边新品，应该先做 HS code 映射和供应商原产地资料准备，等正式税率再进价格模型。\n- 建议动作：供应链/产品开发在 2026-10-03 前把当前 US 在售和 2027 新品池按 HS code、品类关键词、供应商、原产地、当前 duty rate、年化采购额建立映射表；优先筛选 household goods、toys、craft/gift accessory、paper/storage adjacent 相关 SKU。验证方式：输出一张“可能受益/不确定/无关”三分类表；没有 CBP/USTR 正式税率前，不改售价、不改促销折扣、不承诺供应商成本下降。\n\n", "title": "U.S.-China Board of Trade 公布 30-for-30 推荐清单", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-29\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-29\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * 扩展到 UK；US 聚焦 Amazon Business seller-fulfilled 订单，UK 同样需要检查 FBM/SFP 或任何自配送兜底 offer 的营业时间送达表现。\n- 变化原因：Amazon 在 US/UK 对 seller-fulfilled 订单的 B2B 送达体验提出一致性要求，重点从单纯准时送达扩展到客户营业时间内送达。\n- 行动是否需要调整：升级为 US/UK 双站 P1。US 运营和欧洲运营今天分别进入 Account Health/Delivery Performance 或相关 BHDR 页面，导出近 14 天 seller-fulfilled 订单，字段包含 marketplace、order type、ASIN、shipping template、carrier、promised delivery date、actual delivery timestamp、business-hours delivery pass/fail、failure reason。截止：2026-09-29 18:00；复查：2026-09-30；验收：US/UK 分站 BHDR >= 90%，或输出低于 90% 的订单清单和配送模板纠偏方案。\n\n", "title": "BHDR 90% 要求从 US 补充到 UK seller-fulfilled 订单范围", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-29\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-29\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>BHDR 90% 要求从 US 补充到 UK seller-fulfilled 订单范围\u003c/h3>\n\u003cul>\n\u003cli>历史事件：amazon-business-bhdr-90-seller-fulfilled-us-2026-09-30\u003c/li>\n\u003cli>上次状态：2026-09-28 已推送 US Amazon Business seller-fulfilled 订单 14 天滚动 Business Hour Delivery Rate 需达到 90%，2026-09-30 低于 90% 将收到通知，2026-10-30 仍未改善可能影响 Amazon Business 客户可见性。\u003c/li>\n\u003cli>本次新增变化：补查 BHDR 持续关注事项时发现 UK Seller Forums 同类官方公告，Amazon.co.uk seller-fulfilled order 也要求 Business Hour Delivery Rate 达到 90%，2026-09-30 进入通知节点，2026-10-30 未改善可能导致受影响 offer 对 Amazon Business 客户停用。来源：\u003ca href=\"https://sellercentral.amazon.co.uk/seller-forums/discussions/t/20198e40-521c-4a27-b682-3f088fa0a7dc\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.co.uk/seller-forums/discussions/t/20198e40-521c-4a27-b682-3f088fa0a7dc\u003c/a>\u003c/li>\n\u003cli>相比上次变化：影响范围从 US 扩展到 UK；US 聚焦 Amazon Business seller-fulfilled 订单，UK 同样需要检查 FBM/SFP 或任何自配送兜底 offer 的营业时间送达表现。\u003c/li>\n\u003cli>变化原因：Amazon 在 US/UK 对 seller-fulfilled 订单的 B2B 送达体验提出一致性要求，重点从单纯准时送达扩展到客户营业时间内送达。\u003c/li>\n\u003cli>行动是否需要调整：升级为 US/UK 双站 P1。US 运营和欧洲运营今天分别进入 Account Health/Delivery Performance 或相关 BHDR 页面，导出近 14 天 seller-fulfilled 订单，字段包含 marketplace、order type、ASIN、shipping template、carrier、promised delivery date、actual delivery timestamp、business-hours delivery pass/fail、failure reason。截止：2026-09-29 18:00；复查：2026-09-30；验收：US/UK 分站 BHDR &gt;= 90%，或输出低于 90% 的订单清单和配送模板纠偏方案。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-29\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}]}, {"date": "2026-09-28", "text": "# 亚马逊及海外市场情报增量日报｜2026-09-28\n\n## 今日判断\n\n今日没有发现 Amazon US/UK/DE/FR/IT/ES 发布新的全量强制 Listing、图片、A+、Search Terms、属性、变体或 FBA 费用规则。今天最需要处理的是两个近截止日事项：US Amazon Business seller-fulfilled 订单的 Business Hour Delivery Rate 要求将在 2026-09-30 进入首次通知节点；Product Bundling 风险清单原定 2026-09-25，但当天为中国大陆中秋假期，今天应完成节后闭环。供应链侧 Drewry 2026-09-24 WCI 更新显示综合指数小幅下降，但上海至洛杉矶仍上涨 2%，PBDD/Q4 美线补货不能只看综合指数判断成本放松。今天不是本周最后一个中国大陆法定工作日，本周周报应在 2026-09-30 生成。\n\n## 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n|---|---|---|---|---|---|\n| P1 | Amazon Business BHDR 90% 要求进入 9/30 首次通知节点 | US | FBM/Amazon Business/Account Health/配送模板 | 2026-09-30；未改善节点 2026-10-30 | 是，筛选 US seller-fulfilled Amazon Business 订单并核对 BHDR |\n| P1 | Product Bundling 风险清单节后闭环 | US | Listing/合规/套装/补充页/multipack | 原截止 2026-09-25；节后工作日 2026-09-28 | 是，今天交付第一版风险清单 |\n| P1 | PBDD 主推池节后执行复查 | US/UK/DE/FR/IT/ES | Deals/Coupons/PED/库存/广告预算 | 2026-09-28；PBDD 2026-10-06 至 2026-10-07 | 是，复查主推池、兜底促销、库存和预算承接 |\n| P2 | Drewry WCI 9/24 更新：综合下降但美西仍涨 | US/EU/UK | 海运报价/ETA/landed cost | 发布日期 2026-09-24；下次复查 2026-10-02 | 是，仅对未锁价货件复核实际报价 |\n\n## 今日新情报\n\n### US Amazon Business seller-fulfilled 订单将纳入 BHDR 90% 要求\n\n- 【影响等级】P1\n- 【站点】US\n- 【发布日期】Amazon Seller Forums 页面未显示精确发布日期；本自动化首次发现并纳入索引日期为 2026-09-28\n- 【生效日期】2026-09-30 首次通知；2026-10-30 未改善可能影响 Amazon Business 客户可见性\n- 【信息状态】Amazon Seller Forums 正式公告 / 账号适用范围需后台确认\n- 【来源】Amazon Seller Forums / News_Amazon：https://sellercentral.amazon.com/seller-forums/discussions/t/57222b70-40df-4574-aa0f-9f815c197987\n- 发生了什么：Amazon 将对 US seller-fulfilled 发往 Amazon Business 客户的订单引入 Business Hour Delivery Rate 要求，要求 14 天滚动 BHDR 达到 90% 或以上。2026-09-30 若低于 90%，Amazon 将通知卖家并给出改进建议；若到 2026-10-30 仍未改善，seller-fulfilled offer 可能对
