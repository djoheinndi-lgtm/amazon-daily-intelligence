ul>\n\u003ch2>5. 今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P0\u003c/td>\n\u003ctd>完成 Prime Big Deal Days deal submission 最终核查；未参活动则记录不适用\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>运营/供应链/PPC\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003ctd>每个目标 ASIN 有 deal status、促销价、预算、库存覆盖天数、毛利率、负责人；未参加 ASIN 有“不适用”原因\u003c/td>\n\u003ctd>2026-09-09\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>核对 PBDD FBA minimal shipment splits 到仓风险\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>供应链\u003c/td>\n\u003ctd>2026-09-09\u003c/td>\n\u003ctd>促销 SKU 有 shipment ID、split option、ETA、FC receiving、available units、缺口处理方案\u003c/td>\n\u003ctd>2026-09-10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>完成 DE Prime badge 与履约指标复核\u003c/td>\n\u003ctd>DE\u003c/td>\n\u003ctd>欧洲运营\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003ctd>DE Prime ASIN 100% 有 badge status、fulfillment channel、Featured Offer status、配送指标风险分级\u003c/td>\n\u003ctd>2026-09-10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>确认商业责任险 2026-11-02 新要求是否进入账号后台\u003c/td>\n\u003ctd>US/多站点\u003c/td>\n\u003ctd>合规/财务\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003ctd>有 Seller Central 原始通知截图或“未收到”记录；保单主体、到期日、AIA 路径和 enhanced safety ASIN 清单齐全\u003c/td>\n\u003ctd>2026-09-10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>输出 US bundle、kit、set、multipack、refill pages 合规风险清单\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Listing/合规\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003ctd>每个命中 ASIN 有真实包装关系、品牌/制造商依据、变体关系、整改动作和负责人\u003c/td>\n\u003ctd>2026-09-11\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>筛查 UK 加重/填充/布艺装饰类 SKU 的材料合规证据\u003c/td>\n\u003ctd>UK\u003c/td>\n\u003ctd>合规/产品\u003c/td>\n\u003ctd>2026-09-15\u003c/td>\n\u003ctd>命中 SKU 有 BOM、供应商禁限物质声明、批次追溯和不涉及石棉/矿物填充证据\u003c/td>\n\u003ctd>2026-09-22\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>6. 持续关注\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>事项\u003c/th>\n\u003cth>当前状态\u003c/th>\n\u003cth>下次复查日期\u003c/th>\n\u003cth>触发升级条件\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>PBDD/FBA Q4 入仓节点\u003c/td>\n\u003ctd>2026-09-08 deal submission 关闭，2026-09-09 minimal shipment splits 到仓\u003c/td>\n\u003ctd>2026-09-09\u003c/td>\n\u003ctd>促销 SKU 未到仓、FC receiving 异常或可售库存低于活动需求时升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>德国 Prime eligibility criteria 更新\u003c/td>\n\u003ctd>2026-09-07 已生效，待账号侧完成 Prime badge 和履约指标复核\u003c/td>\n\u003ctd>2026-09-10\u003c/td>\n\u003ctd>DE Prime badge 丢失、FBM/SFP 指标预警、Featured Offer 明显下降时升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>商业责任险 2026-11-02 新要求\u003c/td>\n\u003ctd>仍需 Seller Central 原始通知确认\u003c/td>\n\u003ctd>2026-09-10\u003c/td>\n\u003ctd>账号收到保险通知、AIA 强制路径或 enhanced safety ASIN 保险请求时升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>USPS 2026 旺季包裹临时加价\u003c/td>\n\u003ctd>USPS 已提交 PRC 审核，尚未正式生效\u003c/td>\n\u003ctd>2026-09-18\u003c/td>\n\u003ctd>PRC 审核通过或 Amazon Buy Shipping 同步费率表时升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>UK 家居礼品材料安全\u003c/td>\n\u003ctd>OPSS 更新门挡/挡风条召回，涉及石棉污染风险\u003c/td>\n\u003ctd>2026-09-22\u003c/td>\n\u003ctd>自有 SKU 命中加重填充、矿物颗粒、布艺封装或供应商无法提供材料声明时升级\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>7. 情报边界与可信度\u003c/h2>\n\u003cp>本次核验来源 7 个，其中官方/监管/一手来源 6 个，包括中国政府网/国务院办公厅、Amazon Seller Forums、Amazon Seller Central 公开帮助页线索、Amazon Ads 官方开发者文档入口、GOV.UK OPSS 产品安全页、OPSS 机构最新文件列表；非官方来源 1 个，仅用于对照是否存在重复转载，不纳入执行依据。\u003c/p>\n\u003cp>纳入日报的新事件 1 条：UK OPSS 监管召回更新。纳入已有事件重要更新 1 条：US PBDD deal submission 今日到期。仍待确认事项 2 条：商业责任险 2026-11-02 新要求是否进入当前卖家账号后台，德国 Prime 更新对本账号 DE ASIN 的实际 badge 与履约影响。\u003c/p>\n\u003cp>排除项：Amazon Ads 检索未发现 2026-09-07 09:37 至 2026-09-08 09:32 期间对 SP、SB、SD、DSP、AMC 必须调整的后台规则；Seller Central 帮助页与论坛中重复出现的 Q4 入仓日期不作为新事件重复推送，只在今天到期的 PBDD 提报节点做更新；CPSC/OPSS 既有儿童玩具和婴童用品安全案例无新增事实不重复列入；US/EU 关税、税务、海关公开源未见与相册、手工、礼品、家居类 Amazon 卖家直接相关的新执行要求。\u003c/p>\n\u003cp>工作日门禁来源：中国政府网《国务院办公厅关于2026年部分节假日安排的通知》（\u003ca href=\"https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-08\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-08\u003c/a> 为周二，不在 2026 年中秋节 2026-09-25 至 2026-09-27 或国庆节 2026-10-01 至 2026-10-07 等法定节假日范围内，按中国大陆法定工作日运行。\u003c/p>\n\u003cp>生产链接：\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-08\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-09-08", "text": "### UK OPSS 更新 Sophie Allport 门挡/挡风条召回，家居礼品类需关注填充物材料风险\n\n- 【影响等级】P2\n- 【站点】UK\n- 【发布日期】2026-09-07 更新\n- 【生效日期】2026-09-07\n- 【信息状态】正式监管召回更新\n- 【来源】UK OPSS Product Recall：https://www.gov.uk/product-safety-alerts-reports-recalls/product-recall-sophie-allport-doorstops-and-draught-excluders-2608-0008\n\n**发生了什么**：UK OPSS 在 2026-09-07 更新 Sophie Allport Doorstops and Draught Excluders 召回页，说明门挡/挡风条内部封装的大理石碎片可能含少量石棉，产品已由 Sophie Allport 和 John Lewis 从市场撤回并召回终端用户。\n\n**我们怎么看**：这不是相册主线类目的直接 Amazon 新规，但对 UK 家居、礼品、装饰、织物填充和加重类产品是合规信号。若相册配套礼品、收纳配件或装饰类 SKU 使用矿物颗粒、砂石、重物填充、布艺封装，需要把供应商材质声明和禁限物质证明纳入 UK 合规档案。\n\n**建议动作**：合规/产品在 2026-09-15 前筛查 UK SKU 与供应商 BOM，关键词包含 doorstop、draught excluder、weighted、filled、sand、stone、marble chips、decorative、fabric、gift、home decor。验收标准：命中 SKU 有材料清单、供应商禁限物质声明、批次追溯和“不涉及石棉/矿物填充”的书面证据；未命中则仅观察，暂不调整 Listing。\n\n", "title": "UK OPSS 更新 Sophie Allport 门挡/挡风条召回，家居礼品类需关注填充物材料风险", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=devi 2\u003c/li>\n\u003cli>【站点】UK\u003c/li>\n\u003cli>【发布日期】2026-09-07 更新\u003c/li>\n\u003cli>【生效日期】2026-09-07\u003c/li>\n\u003cli>【信息状态】正式监管召回更新\u003c/li>\n\u003cli>【来源】UK OPSS Product Recall：\u003ca href=\"https://www.gov.uk/product-safety-alerts-reports-recalls/product-recall-sophie-allport-doorstops-and-draught-excluders-2608-0008\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.uk/product-safety-alerts-reports-recalls/product-recall-sophie-allport-doorstops-and-draught-excluders-2608-0008\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>发生了什么\u003c/strong>：UK OPSS 在 2026-09-07 更新 Sophie Allport Doorstops and Draught Excluders 召回页，说明门挡/挡风条内部封装的大理石碎片可能含少量石棉，产品已由 Sophie Allport 和 John Lewis 从市场撤回并召回终端用户。\u003c/p>\n\u003cp>\u003cstrong>我们怎么看\u003c/strong>：这不是相册主线类目的直接 Amazon 新规，但对 UK 家居、礼品、装饰、织物填充和加重类产品是合规信号。若相册配套礼品、收纳配件或装饰类 SKU 使用矿物颗粒、砂石、重物填充、布艺封装，需要把供应商材质声明和禁限物质证明纳入 UK 合规档案。\u003c/p>\n\u003cp>\u003cstrong>建议动作\u003c/strong>：合规/产品在 2026-09-15 前筛查 UK SKU 与供应商 BOM，关键词包含 doorstop、draught excluder、weighted、filled、sand、stone、marble chips、decorative、fabric、gift、home decor。验收标准：命中 SKU 有材料清单、供应商禁限物质声明、批次追溯和“不涉及石棉/矿物填充”的书面证据；未命中则仅观察，暂不调整 Listing。\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-08\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-08", "text": "### US PBDD 促销提报窗口今日关闭\n\n- 历史事件：amz-q4-peak-holiday-2026-deadlines\n- 上次状态：长期索引上次状态聚焦 2026-09-09 FBA minimal shipment splits 到仓节点。\n- 本次新增变化：Amazon 官方 Holiday 2026 帖显示 Prime Big Deal Days deal submission window 为 2026-07-08 至 2026-09-08；今天是提报窗口最后一天，且 2026-09-09 是 FBA minimal shipment splits 入仓节点。\n- 变化原因：同一 Q4/PBDD 主线进入当天操作截止日，运营动作从“跟踪入仓节点”升级为“今日完成促销提报收口 + 明日到仓核验”。\n- 行动是否需要调整：若参加 PBDD，今日按 P0 收口；若不参加 PBDD，降为 P1 库存节点跟踪。运营/供应链在 2026-09-08 下班前确认 deal 提报状态、促销价、预算、库存覆盖、shipment ID 和 FC receiving 风险。\n- 来源：Amazon Seller Forums：https://sellercentral.amazon.com/seller-forums/discussions/t/3e31fbb7-04e0-4ed4-873e-f74b1052e2ff\n\n", "title": "US PBDD 促销提报窗口今日关闭", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-08\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-08\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>US PBDD 促销提报窗口今日关闭\u003c/h3>\n\u003cul>\n\u003cli>历史事件：amz-q4-peak-holiday-2026-deadlines\u003c/li>\n\u003cli>上次状态：长期索引上次状态聚焦 2026-09-09 FBA minimal shipment splits 到仓节点。\u003c/li>\n\u003cli>本次新增变化：Amazon 官方 Holiday 2026 帖显示 Prime Big Deal Days deal submission window 为 2026-07-08 至 2026-09-08；今天是提报窗口最后一天，且 2026-09-09 是 FBA minimal shipment splits 入仓节点。\u003c/li>\n\u003cli>变化原因：同一 Q4/PBDD 主线进入当天操作截止日，运营动作从“跟踪入仓节点”升级为“今日完成促销提报收口 + 明日到仓核验”。\u003c/li>\n\u003cli>行动是否需要调整：若参加 PBDD，今日按 P0 收口；若不参加 PBDD，降为 P1 库存节点跟踪。运营/供应链在 2026-09-08 下班前确认 deal 提报状态、促销价、预算、库存覆盖、shipment ID 和 FC receiving 风险。\u003c/li>\n\u003cli>来源：Amazon Seller Forums：\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/3e31fbb7-04e0-4ed4-873e-f74b1052e2ff\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/seller-forums/discussions/t/3e31fbb7-04e0-4ed4-873e-f74b1052e2ff\u003c/a>\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-08\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}]}, {"date": "2026-09-07", "text": "# 亚马逊及海外市场情报增量日报｜2026-09-07\n\n## 1. 今日判断\n\n今日没有发现新的 Amazon US/UK/EU 强制 Listing、图片、A+、Search Terms 或 FBA 费用数值变化；最高优先级是德国 Prime 资格标准在 2026-09-07 到达生效日，需要欧洲运营核查 DE 站 Prime badge、配送承诺和 FBM/SFP 履约指标。英国 OPSS 在 2026-09-04 新增多条 Amazon 渠道玩具/儿童用品安全通报，继续强化儿童、玩具、感官、小零件和婴童用品的合规筛查信号。今天没有 P0；P1 是 2026-09-08 前完成 DE Prime 风险排查，以及延续上周商业责任险、Product Bundling、广告成本审计的已设任务。今天不是本周最后一个中国大陆法定工作日，不追加周报。\n\n## 2. 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n| --- | --- | --- | --- | --- | --- |\n| P1 | 德国 Prime 资格标准今日生效，需核查 Prime badge 与配送指标 | DE | Prime / FBA / FBM / Featured Offer | 2026-09-07 | 今天导出 DE Prime ASIN，2026-09-08 前确认是否丢失 Prime badge 或触发履约指标风险 |\n| P2 | UK OPSS 新增 Amazon 渠道玩具/婴童用品安全通报 | UK | Product Compliance / Listing Risk | 2026-09-04 | 对儿童、玩具、感官、小零件、婴童用品关键词 ASIN 做定向筛查 |\n| P2 | EUCDM 7.0.11 清关字段暂无新增执行反馈 | EU/UK | Customs / ERP / Logistics | 2026-09-07 复查 | 今天向货代/ERP 确认是否要求新增字段；无反馈不改 Listing |\n| P2 | Amazon Ads 诉讼与 Sponsored Ads 后台口径暂无新增官方规则 | US | PPC / Finance | 2026-09-08 复查 | 继续做 CPC、CVR、ROAS、TACoS 异常审计，不因新闻停投核心词 |\n\n## 3. 今日新情报\n\n### 德国 Prime 资格标准今日生效，DE 站需核查 Prime badge 与配送履约指标\n\n- 【影响等级】P1\n- 【站点】DE\n- 【发布日期】2026-08-21；本次首次纳入：2026-09-07\n- 【生效日期】2026-09-07\n- 【信息状态】Amazon Seller Central 正式政策页\n- 【来源】Amazon Seller Central Germany：https://sellercentral.amazon.de/help/hub/reference/external/GQHQGBTD7XB7EECN?mons_sel_locale=en_DE；Amazon Seller Central Ireland 镜像页：https://sellercentral.amazon.ie/help/hub/reference/external/GQHQGBTD7XB7EECN；辅助解读：https://everywearbd.com/bangladesh-rmg-wholesale-blog/amazon-germany-prime-program-requirements-fbm-sellers-guide-2026\n\n**发生了什么**：Amazon Seller Central 的政策变更页显示，2026-09-07 起德国站 Prime eligibility criteria 更新，适用范围包含 FBA、FBM 和 Amazon Retail offers in Germany。公开可访问页面只能确认生效日期、站点和适用履约类型；具体账号侧指标与 offer 影响仍需登录 DE Seller Central 核验。\n\n**我们怎么看**：相册、refill pages、school memory book、portfolio binder 若 DE 站主要走 FBA，直接操作压力低于 FBM/SFP，但 Prime badge 一旦丢失会影响 CTR、CVR 和 Featured Offer 竞争力。若 DE 有自发货、海外仓、Amazon Business 大单或旺季备用 FBM 方案，需要把配送时效、有效追踪、取消率、承诺处理时间和 Business 客户工作时间配送要求作为同一张履约风险表管理。\n\n**建议动作**：欧洲运营在 2026-09-08 前导出 DE 站在售 ASIN，字段包含 ASIN、SKU、fulfillment channel、Prime badge status、Featured Offer status、handling time、promised delivery date、valid tracking rate、late shipment/on-time delivery、cancellation rate、Amazon Business order flag。路径优先查 Seller Central Germany > Manage Inventory、Account Health、Shipping Settings、Seller Fulfilled Prime / Delivery Performance；若发现 Prime badge 丢失或 FBM 订单履约指标低于账号要求，先暂停对应 ASIN 的 FBM 促销和低毛利折扣，保留 FBA offer 作为主履约方案。验收标准：DE Prime ASIN 清单 100% 有 badge 状态和履约风险分级；风险 SKU 有“维持 FBA / 改处理时间 / 暂停 FBM Prime / 改库存分配”的明确处理结论。\n\n### UK OPSS 9 月 4 日新增 Amazon 渠道玩具/婴童用品安全通报\n\n- 【影响等级】P2\n- 【站点】UK\n- 【发布日期】2026-09-04\n- 【生效日期】2026-09-04\n- 【信息状态】正式监管安全通报\n- 【来源】OPSS Squishy Dumpling D-9373：https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-squishy-dumpling-d-9373-2609-0028；OPSS Vicloon Baby Teether：https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-vicloon-baby-teether-sold-via-amazon-2609-0011；OPSS 最新文件列表：https://www.gov.uk/government/organisations/office-for-product-safety-and-standards\n\n**发生了什么**：UK OPSS 在 2026-09-04 发布多条产品安全报告，其中 Squishy Dumpling D-9373 涉及水珠释放导致儿童误食/窒息风险，不符合 Toys (Safety) Regulations 2011；Vicloon Baby Teether sold via Amazon 涉及婴童用品窒息风险，通报文件列明 Amazon marketplace listing 已移除。OPSS 机构最新文件页同时显示 2026-09-04 还有 Russko Limited Jumbo Duck Mega Squishy 等相关高风险通报。\n\n**我们怎么看**：这不是相册主线类目的直接新规，但它与上周 UK/US 水珠、感官玩具和 Amazon 渠道召回形成连续监管信号。对 puzzle accessories、school memory book、craft kit、儿童活动套装、带小零件或软胶材料的赠品/配件，需要把“是否被消费者或算法识别为 toy / sensory / childcare article”作为 Listing 风险，而不是只看内部产品线归类。\n\n**建议动作**：合规/Listing 在 2026-09-12 前筛查 UK 店铺标题、五点、A+、Search Terms、Generic Keyword、Item Type Keyword、Browse Node 和图片文案，关键词包含 kids、toy、sensory、beads、squishy、teether、baby、toddler、small parts、activity kit、gift for children。验收标准：命中 ASIN 有 UKCA/CE、EN71、年龄分级、警示标签、材料安全报告、供应商测试报告或“不适用”说明；若文案把成人/家庭相册误导成儿童玩具或儿童用品，2026-09-15 前完成前台文案降风险修订。\n\n## 4. 已有事件的重要更新\n\n今日未发现长期事件索引中已有事项发生实质政策变化。商业责任险新要求仍需账号内确认，USPS 旺季包裹临时加价仍待 PRC 审核，Amazon Ads 诉讼仍未见 Amazon Ads 后台计费、拍卖或报表口径更新；这些事项继续按原复查日期跟踪，不重复推送旧事实。\n\n## 5. 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n| --- | --- | --- | --- | --- | --- | --- |\n| P1 | 导出 DE 站 Prime ASIN 清单并核查 Prime badge、履约方式和配送指标 | DE | 欧洲运营 | 2026-09-08 | 每个 DE Prime ASIN 有 fulfillment channel、badge status、Featured Offer status、handling time、tracking、delivery/cancellation 风险分级 | 2026-09-10 |\n| P1 | 验证商业责任险 2026-11-02 新要求是否进入账号后台 | US/多站点 | 合规/财务 | 2026-09-08 | 有 Seller Central 原始通知截图或“未收到”记录；保单主体、到期日、AIA 路径、enhanced safety ASIN 清单齐全 | 2026-09-10 |\n| P1 | 输出 US bundle、kit、set、multipack、refill pages 合规风险清单 | US | Listing/合规 | 2026-09-08 | 每个命中 ASIN 有真实包装关系、品牌/制造商依据、变体关系、整改动作和负责人 | 2026-09-11 |\n| P1 | 完成 Sponsored Ads 成本异常审计 | US | PPC/财务 | 2026-09-08 | 30/60/90 天 CPC 上升>15%、CVR 未改善且 ROAS 下降的 Top 20 campaign/keyword/placement 有处理结论 | 2026-09-12 |\n| P2 | 筛查 UK 儿童/玩具/感官/小零件/婴童用品风险词 ASIN | UK | 合规/Listing | 2026-09-12 | 命中 ASIN 有 UKCA/CE、EN71、年龄分级、警示标签、测试报告或“不适用”说明 | 2026-09-19 |\n| P2 | 向货代/ERP 确认 EUCDM 7.0.11 是否要求新增低价值包裹字段 | EU/UK | 供应链/ERP | 2026-09-09 | 有货代或 ERP 书面回复；如需新增字段，列出 IOSS、HS code、原产地、商品描述字段责任人 | 2026-09-12 |\n\n## 6. 持续关注\n\n| 事项 | 当前状态 | 下次复查日期 | 触发升级条件 |\n| --- | --- | --- | --- |\n| 德国 Prime eligibility criteria 更新 | 2026-09-07 已生效，待账号侧核查 Prime badge 和履约指标 | 2026-09-10 | DE Prime badge 丢失、FBM/SFP 指标预警、Featured Offer 明显下降时升级 P1/P0 |\n| 商业责任险 2026-11-02 新要求 | 第三方转述 Amazon Announcement，仍需 Seller Central 原始通知确认 | 2026-09-10 | 账号收到保险通知、AIA 强制路径或 enhanced safety ASIN 保险请求时升级 |\n| US Prime Big Deal Days FBA 入仓 | 下一节点为 2026-09-09 minimal shipment splits 到仓 | 2026-09-09 | 促销 SKU 未到仓、FC receiving 异常或可售库存低于活动需求时升级 |\n| USPS 2026 旺季包裹临时加价 | USPS 已提交 PRC 审核，尚未正式生效 | 2026-09-18 | PRC 审核通过或 Amazon Buy Shipping 同步费率表时升级 |\n| EUCDM 7.0.11 清关字段 | 今日未见新增官方执行解释，等待货代/ERP 实操反馈 | 2026-09-12 | 货代要求新增字段、IOSS/HS code/原产地模板变更时升级 |\n\n## 7. 情报边界与可信度\n\n本次核验来源约 15 个，其中官方/监管/一手来源 12 个，包括中国政府网/国务院办公厅、Amazon Seller Central Germany/Ireland/Belgium、Amazon Ads 官方新闻与 API release notes、UK OPSS、CPSC、CBP/USITC/European Commission 税务与海关页面、Amazon Product Safety Alerts；非官方来源 3 个，主要用于补充 German Prime 指标解读和行业线索。纳入日报的新事件 2 条：Amazon 官方政策页 1 条、UK OPSS 监管安全通报 1 条；已有事件无实质更新。仍待确认事项 2 条：商业责任险 2026-11-02 新要求是否进入当前卖家账号后台，德国 Prime 更新对本账号 DE ASIN 的实际 badge 和履约影响。\n\n排除项：Amazon Business Deals 属于上周周报已提及的促销机会，本次无新增政策事实；Amazon Ads / DSP / API 检索未发现 2026-09-06 至 2026-09-07 对 SP、SB、SD、DSP、AMC 必须调整的后台规则；CPSC 近期 Amazon 渠道召回多为上周或更早已发布案例，本次不重复推送；US/EU 关税、税务、海关公开源未见过去 24 小时内与相册、手工、礼品、家居类 Amazon 卖家直接相关的新执行要求。\n\n工作日门禁来源：中国政府网《国务院办公厅关于2026年部分节假日安排的通知》（https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-07 为周一，不在 2026 年中秋节 2026-09-25 至 2026-09-27 或其他法定节假日范围内，按中国大陆法定工作日运行。\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-07\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-07\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报增量日报｜2026-09-07\u003c/h1>\n\u003ch2>1. 今日判断\u003c/h2>\n\u003cp>今日没有发现新的 Amazon US/UK/EU 强制 Listing、图片、A+、Search Terms 或 FBA 费用数值变化；最高优先级是德国 Prime 资格标准在 2026-09-07 到达生效日，需要欧洲运营核查 DE 站 Prime badge、配送承诺和 FBM/SFP 履约指标。英国 OPSS 在 2026-09-04 新增多条 Amazon 渠道玩具/儿童用品安全通报，继续强化儿童、玩具、感官、小零件和婴童用品的合规筛查信号。今天没有 P0；P1 是 2026-09-08 前完成 DE Prime 风险排查，以及延续上周商业责任险、Product Bundling、广告成本审计的已设任务。今天不是本周最后一个中国大陆法定工作日，不追加周报。\u003c/p>\n\u003ch2>2. 优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>影响站点\u003c/th>\n\u003cth>影响模块\u003c/th>\n\u003cth>截止/生效日期\u003c/th>\n\u003cth>今天是否需要动作\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>德国 Prime 资格标准今日生效，需核查 Prime badge 与配送指标\u003c/td>\n\u003ctd>DE\u003c/td>\n\u003ctd>Prime / FBA / FBM / Featured Offer\u003c/td>\n\u003ctd>2026-09-07\u003c/td>\n\u003ctd>今天导出 DE Prime ASIN，2026-09-08 前确认是否丢失 Prime badge 或触发履约指标风险\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>UK OPSS 新增 Amazon 渠道玩具/婴童用品安全通报\u003c/td>\n\u003ctd>UK\u003c/td>\n\u003ctd>Product Compliance / Listing Risk\u003c/td>\n\u003ctd>2026-09-04\u003c/td>\n\u003ctd>对儿童、玩具、感官、小零件、婴童用品关键词 ASIN 做定向筛查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>EUCDM 7.0.11 清关字段暂无新增执行反馈\u003c/td>\n\u003ctd>EU/UK\u003c/td>\n\u003ctd>Customs / ERP / Logistics\u003c/td>\n\u003ctd>2026-09-07 复查\u003c/td>\n\u003ctd>今天向货代/ERP 确认是否要求新增字段；无反馈不改 Listing\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Amazon Ads 诉讼与 Sponsored Ads 后台口径暂无新增官方规则\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>PPC / Finance\u003c/td>\n\u003ctd>2026-09-08 复查\u003c/td>\n\u003ctd>继续做 CPC、CVR、ROAS、TACoS 异常审计，不因新闻停投核心词\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>3. 今日新情报\u003c/h2>\n\u003ch3>德国 Prime 资格标准今日生效，DE 站需核查 Prime badge 与配送履约指标\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P1\u003c/li>\n\u003cli>【站点】DE\u003c/li>\n\u003cli>【发布日期】2026-08-21；本次首次纳入：2026-09-07\u003c/li>\n\u003cli>【生效日期】2026-09-07\u003c/li>\n\u003cli>【信息状态】Amazon Seller Central 正式政策页\u003c/li>\n\u003cli>【来源】Amazon Seller Central Germany：\u003ca href=\"https://sellercentral.amazon.de/help/hub/reference/external/GQHQGBTD7XB7EECN?mons_sel_locale=en_DE；Amazon\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.de/help/hub/reference/external/GQHQGBTD7XB7EECN?mons_sel_locale=en_DE；Amazon\u003c/a> Seller Central Ireland 镜像页：\u003ca href=\"https://sellercentral.amazon.ie/help/hub/reference/external/GQHQGBTD7XB7EECN；辅助解读：https://everywearbd.com/bangladesh-rmg-wholesale-blog/amazon-germany-prime-program-requirements-fbm-sellers-guide-2026\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.ie/help/hub/reference/external/GQHQGBTD7XB7EECN；辅助解读：https://everywearbd.com/bangladesh-rmg-wholesale-blog/amazon-germany-prime-program-requirements-fbm-sellers-guide-2026\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>发生了什么\u003c/strong>：Amazon Seller Central 的政策变更页显示，2026-09-07 起德国站 Prime eligibility criteria 更新，适用范围包含 FBA、FBM 和 Amazon Retail offers in Germany。公开可访问页面只能确认生效日期、站点和适用履约类型；具体账号侧指标与 offer 影响仍需登录 DE Seller Central 核验。\u003c/p>\n\u003cp>\u003cstrong>我们怎么看\u003c/strong>：相册、refill pages、school memory book、portfolio binder 若 DE 站主要走 FBA，直接操作压力低于 FBM/SFP，但 Prime badge 一旦丢失会影响 CTR、CVR 和 Featured Offer 竞争力。若 DE 有自发货、海外仓、Amazon Business 大单或旺季备用 FBM 方案，需要把配送时效、有效追踪、取消率、承诺处理时间和 Business 客户工作时间配送要求作为同一张履约风险表管理。\u003c/p>\n\u003cp>\u003cstrong>建议动作\u003c/strong>：欧洲运营在 2026-09-08 前导出 DE 站在售 ASIN，字段包含 ASIN、SKU、fulfillment channel、Prime badge status、Featured Offer status、handling time、promised delivery date、valid tracking rate、late shipment/on-time delivery、cancellation rate、Amazon Business order flag。路径优先查 Seller Central Germany &gt; Manage Inventory、Account Health、Shipping Settings、Seller Fulfilled Prime / Delivery Performance；若发现 Prime badge 丢失或 FBM 订单履约指标低于账号要求，先暂停对应 ASIN 的 FBM 促销和低毛利折扣，保留 FBA offer 作为主履约方案。验收标准：DE Prime ASIN 清单 100% 有 badge 状态和履约风险分级；风险 SKU 有“维持 FBA / 改处理时间 / 暂停 FBM Prime / 改库存分配”的明确处理结论。\u003c/p>\n\u003ch3>UK OPSS 9 月 4 日新增 Amazon 渠道玩具/婴童用品安全通报\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】UK\u003c/li>\n\u003cli>【发布日期】2026-09-04\u003c/li>\n\u003cli>【生效日期】2026-09-04\u003c/li>\n\u003cli>【信息状态】正式监管安全通报\u003c/li>\n\u003cli>【来源】OPSS Squishy Dumpling D-9373：\u003ca href=\"https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-squishy-dumpling-d-9373-2609-0028；OPSS\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-squishy-dumpling-d-9373-2609-0028；OPSS\u003c/a> Vicloon Baby Teether：\u003ca href=\"https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-vicloon-baby-teether-sold-via-amazon-2609-0011；OPSS\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-vicloon-baby-teether-sold-via-amazon-2609-0011；OPSS\u003c/a> 最新文件列表：\u003ca href=\"https://www.gov.uk/government/organisations/office-for-product-safety-and-standards\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.uk/government/organisations/office-for-product-safety-and-standards\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>发生了什么\u003c/strong>：UK OPSS 在 2026-09-04 发布多条产品安全报告，其中 Squishy Dumpling D-9373 涉及水珠释放导致儿童误食/窒息风险，不符合 Toys (Safety) Regulations 2011；Vicloon Baby Teether sold via Amazon 涉及婴童用品窒息风险，通报文件列明 Amazon marketplace listing 已移除。OPSS 机构最新文件页同时显示 2026-09-04 还有 Russko Limited Jumbo Duck Mega Squishy 等相关高风险通报。\u003c/p>\n\u003cp>\u003cstrong>我们怎么看\u003c/strong>：这不是相册主线类目的直接新规，但它与上周 UK/US 水珠、感官玩具和 Amazon 渠道召回形成连续监管信号。对 puzzle accessories、school memory book、craft kit、儿童活动套装、带小零件或软胶材料的赠品/配件，需要把“是否被消费者或算法识别为 toy / sensory / childcare article”作为 Listing 风险，而不是只看内部产品线归类。\u003c/p>\n\u003cp>\u003cstrong>建议动作\u003c/strong>：合规/Listing 在 2026-09-12 前筛查 UK 店铺标题、五点、A+、Search Terms、Generic Keyword、Item Type Keyword、Browse Node 和图片文案，关键词包含 kids、toy、sensory、beads、squishy、teether、baby、toddler、small parts、activity kit、gift for children。验收标准：命中 ASIN 有 UKCA/CE、EN71、年龄分级、警示标签、材料安全报告、供应商测试报告或“不适用”说明；若文案把成人/家庭相册误导成儿童玩具或儿童用品，2026-09-15 前完成前台文案降风险修订。\u003c/p>\n\u003ch2>4. 已有事件的重要更新\u003c/h2>\n\u003cp>今日未发现长期事件索引中已有事项发生实质政策变化。商业责任险新要求仍需账号内确认，USPS 旺季包裹临时加价仍待 PRC 审核，Amazon Ads 诉讼仍未见 Amazon Ads 后台计费、拍卖或报表口径更新；这些事项继续按原复查日期跟踪，不重复推送旧事实。\u003c/p>\n\u003ch2>5. 今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>导出 DE 站 Prime ASIN 清单并核查 Prime badge、履约方式和配送指标\u003c/td>\n\u003ctd>DE\u003c/td>\n\u003ctd>欧洲运营\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003ctd>每个 DE Prime ASIN 有 fulfillment channel、badge status、Featured Offer status、handling time、tracking、delivery/cancellation 风险分级\u003c/td>\n\u003ctd>2026-09-10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>验证商业责任险 2026-11-02 新要求是否进入账号后台\u003c/td>\n\u003ctd>US/多站点\u003c/td>\n\u003ctd>合规/财务\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003ctd>有 Seller Central 原始通知截图或“未收到”记录；保单主体、到期日、AIA 路径、enhanced safety ASIN 清单齐全\u003c/td>\n\u003ctd>2026-09-10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>输出 US bundle、kit、set、multipack、refill pages 合规风险清单\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Listing/合规\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003ctd>每个命中 ASIN 有真实包装关系、品牌/制造商依据、变体关系、整改动作和负责人\u003c/td>\n\u003ctd>2026-09-11\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>完成 Sponsored Ads 成本异常审计\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>PPC/财务\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003ctd>30/60/90 天 CPC 上升&gt;15%、CVR 未改善且 ROAS 下降的 Top 20 campaign/keyword/placement 有处理结论\u003c/td>\n\u003ctd>2026-09-12\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>筛查 UK 儿童/玩具/感官/小零件/婴童用品风险词 ASIN\u003c/td>\n\u003ctd>UK\u003c/td>\n\u003ctd>合规/Listing\u003c/td>\n\u003ctd>2026-09-12\u003c/td>\n\u003ctd>命中 ASIN 有 UKCA/CE、EN71、年龄分级、警示标签、测试报告或“不适用”说明\u003c/td>\n\u003ctd>2026-09-19\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>向货代/ERP 确认 EUCDM 7.0.11 是否要求新增低价值包裹字段\u003c/td>\n\u003ctd>EU/UK\u003c/td>\n\u003ctd>供应链/ERP\u003c/td>\n\u003ctd>2026-09-09\u003c/td>\n\u003ctd>有货代或 ERP 书面回复；如需新增字段，列出 IOSS、HS code、原产地、商品描述字段责任人\u003c/td>\n\u003ctd>2026-09-12\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>6. 持续关注\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>事项\u003c/th>\n\u003cth>当前状态\u003c/th>\n\u003cth>下次复查日期\u003c/th>\n\u003cth>触发升级条件\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>德国 Prime eligibility criteria 更新\u003c/td>\n\u003ctd>2026-09-07 已生效，待账号侧核查 Prime badge 和履约指标\u003c/td>\n\u003ctd>2026-09-10\u003c/td>\n\u003ctd>DE Prime badge 丢失、FBM/SFP 指标预警、Featured Offer 明显下降时升级 P1/P0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>商业责任险 2026-11-02 新要求\u003c/td>\n\u003ctd>第三方转述 Amazon Announcement，仍需 Seller Central 原始通知确认\u003c/td>\n\u003ctd>2026-09-10\u003c/td>\n\u003ctd>账号收到保险通知、AIA 强制路径或 enhanced safety ASIN 保险请求时升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>US Prime Big Deal Days FBA 入仓\u003c/td>\n\u003ctd>下一节点为 2026-09-09 minimal shipment splits 到仓\u003c/td>\n\u003ctd>2026-09-09\u003c/td>\n\u003ctd>促销 SKU 未到仓、FC receiving 异常或可售库存低于活动需求时升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>USPS 2026 旺季包裹临时加价\u003c/td>\n\u003ctd>USPS 已提交 PRC 审核，尚未正式生效\u003c/td>\n\u003ctd>2026-09-18\u003c/td>\n\u003ctd>PRC 审核通过或 Amazon Buy Shipping 同步费率表时升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EUCDM 7.0.11 清关字段\u003c/td>\n\u003ctd>今日未见新增官方执行解释，等待货代/ERP 实操反馈\u003c/td>\n\u003ctd>2026-09-12\u003c/td>\n\u003ctd>货代要求新增字段、IOSS/HS code/原产地模板变更时升级\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>7. 情报边界与可信度\u003c/h2>\n\u003cp>本次核验来源约 15 个，其中官方/监管/一手来源 12 个，包括中国政府网/国务院办公厅、Amazon Seller Central Germany/Ireland/Belgium、Amazon Ads 官方新闻与 API release notes、UK OPSS、CPSC、CBP/USITC/European Commission 税务与海关页面、Amazon Product Safety Alerts；非官方来源 3 个，主要用于补充 German Prime 指标解读和行业线索。纳入日报的新事件 2 条：Amazon 官方政策页 1 条、UK OPSS 监管安全通报 1 条；已有事件无实质更新。仍待确认事项 2 条：商业责任险 2026-11-02 新要求是否进入当前卖家账号后台，德国 Prime 更新对本账号 DE ASIN 的实际 badge 和履约影响。\u003c/p>\n\u003cp>排除项：Amazon Business Deals 属于上周周报已提及的促销机会，本次无新增政策事实；Amazon Ads / DSP / API 检索未发现 2026-09-06 至 2026-09-07 对 SP、SB、SD、DSP、AMC 必须调整的后台规则；CPSC 近期 Amazon 渠道召回多为上周或更早已发布案例，本次不重复推送；US/EU 关税、税务、海关公开源未见过去 24 小时内与相册、手工、礼品、家居类 Amazon 卖家直接相关的新执行要求。\u003c/p>\n\u003cp>工作日门禁来源：中国政府网《国务院办公厅关于2026年部分节假日安排的通知》（\u003ca href=\"https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-07\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-07\u003c/a> 为周一，不在 2026 年中秋节 2026-09-25 至 2026-09-27 或其他法定节假日范围内，按中国大陆法定工作日运行。\u003c/p>\n\u003cp>生产链接：\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-07\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-09-07", "text": "### 德国 Prime 资格标准今日生效，DE 站需核查 Prime badge 与配送履约指标\n\n- 【影响等级】P1\n- 【站点】DE\n- 【发布日期】2026-08-21；本次首次纳入：2026-09-07\n- 【生效日期】2026-09-07\n- 【信息状态】Amazon Seller Central 正式政策页\n- 【来源】Amazon Seller Central Germany：https://sellercentral.amazon.de/help/hub/reference/external/GQHQGBTD7XB7EECN?mons_sel_locale=en_DE；Amazon Seller Central Ireland 镜像页：https://sellercentral.amazon.ie/help/hub/reference/external/GQHQGBTD7XB7EECN；辅助解读：https://everywearbd.com/bangladesh-rmg-wholesale-blog/amazon-germany-prime-program-requirements-fbm-sellers-guide-2026\n\n**发生了什么**：Amazon Seller Central 的政策变更页显示，2026-09-07 起德国站 Prime eligibility criteria 更新，适用范围包含 FBA、FBM 和 Amazon Retail offers in Germany。公开可访问页面只能确认生效日期、站点和适用履约类型；具体账号侧指标与 offer 影响仍需登录 DE Seller Central 核验。\n\n**我们怎么看**：相册、refill pages、school memory book、portfolio binder 若 DE 站主要走 FBA，直接操作压力低于 FBM/SFP，但 Prime badge 一旦丢失会影响 CTR、CVR 和 Featured Offer 竞争力。若 DE 有自发货、海外仓、Amazon Business 大单或旺季备用 FBM 方案，需要把配送时效、有效追踪、取消率、承诺处理时间和 Business 客户工作时间配送要求作为同一张履约风险表管理。\n\n**建议动作**：欧洲运营在 2026-09-08 前导出 DE 站在售 ASIN，字段包含 ASIN、SKU、fulfillment channel、Prime badge status、Featured Offer status、handling time、promised delivery date、valid tracking rate、late shipment/on-time delivery、cancellation rate、Amazon Business order flag。路径优先查 Seller Central Germany > Manage Inventory、Account Health、Shipping Settings、Seller Fulfilled Prime / Delivery Performance；若发现 Prime badge 丢失或 FBM 订单履约指标低于账号要求，先暂停对应 ASIN 的 FBM 促销和低毛利折扣，保留 FBA offer 作为主履约方案。验收标准：DE Prime ASIN 清单 100% 有 badge 状态和履约风险分级；风险 SKU 有“维持 FBA / 改处理时间 / 暂停 FBM Prime / 改库存分配”的明确处理结论。\n\n", "title": "德国 Prime 资格标准今日生效，DE 站需核查 Prime badge 与配送履约指标", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-07\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-07\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>德国 Prime 资格标准今日生效，DE 站需核查 Prime badge 与配送履约指标\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P1\u003c/li>\n\u003cli>【站点】DE\u003c/li>\n\u003cli>【发布日期】2026-08-21；本次首次纳入：2026-09-07\u003c/li>\n\u003cli>【生效日期】2026-09-07\u003c/li>\n\u003cli>【信息状态】Amazon Seller Central 正式政策页\u003c/li>\n\u003cli>【来源】Amazon Seller Central Germany：\u003ca href=\"https://sellercentral.amazon.de/help/hub/reference/external/GQHQGBTD7XB7EECN?mons_sel_locale=en_DE；Amazon\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.de/help/hub/reference/external/GQHQGBTD7XB7EECN?mons_sel_locale=en_DE；Amazon\u003c/a> Seller Central Ireland 镜像页：\u003ca href=\"https://sellercentral.amazon.ie/help/hub/reference/external/GQHQGBTD7XB7EECN；辅助解读：https://everywearbd.com/bangladesh-rmg-wholesale-blog/amazon-germany-prime-program-requirements-fbm-sellers-guide-2026\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.ie/help/hub/reference/external/GQHQGBTD7XB7EECN；辅助解读：https://everywearbd.com/bangladesh-rmg-wholesale-blog/amazon-germany-prime-program-requirements-fbm-sellers-guide-2026\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>发生了什么\u003c/strong>：Amazon Seller Central 的政策变更页显示，2026-09-07 起德国站 Prime eligibility criteria 更新，适用范围包含 FBA、FBM 和 Amazon Retail offers in Germany。公开可访问页面只能确认生效日期、站点和适用履约类型；具体账号侧指标与 offer 影响仍需登录 DE Seller Central 核验。\u003c/p>\n\u003cp>\u003cstrong>我们怎么看\u003c/strong>：相册、refill pages、school memory book、portfolio binder 若 DE 站主要走 FBA，直接操作压力低于 FBM/SFP，但 Prime badge 一旦丢失会影响 CTR、CVR 和 Featured Offer 竞争力。若 DE 有自发货、海外仓、Amazon Business 大单或旺季备用 FBM 方案，需要把配送时效、有效追踪、取消率、承诺处理时间和 Business 客户工作时间配送要求作为同一张履约风险表管理。\u003c/p>\n\u003cp>\u003cstrong>建议动作\u003c/strong>：欧洲运营在 2026-09-08 前导出 DE 站在售 ASIN，字段包含 ASIN、SKU、fulfillment channel、Prime badge status、Featured Offer status、handling time、promised delivery date、valid tracking rate、late shipment/on-time delivery、cancellation rate、Amazon Business order flag。路径优先查 Seller Central Germany &gt; Manage Inventory、Account Health、Shipping Settings、Seller Fulfilled Prime / Delivery Performance；若发现 Prime badge 丢失或 FBM 订单履约指标低于账号要求，先暂停对应 ASIN 的 FBM 促销和低毛利折扣，保留 FBA offer 作为主履约方案。验收标准：DE Prime ASIN 清单 100% 有 badge 状态和履约风险分级；风险 SKU 有“维持 FBA / 改处理时间 / 暂停 FBM Prime / 改库存分配”的明确处理结论。\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-07\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-07", "text": "### UK OPSS 9 月 4 日新增 Amazon 渠道玩具/婴童用品安全通报\n\n- 【影响等级】P2\n- 【站点】UK\n- 【发布日期】2026-09-04\n- 【生效日期】2026-09-04\n- 【信息状态】正式监管安全通报\n- 【来源】OPSS Squishy Dumpling D-9373：https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-squishy-dumpling-d-9373-2609-0028；OPSS Vicloon Baby Teether：https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-vicloon-baby-teether-sold-via-amazon-2609-0011；OPSS 最新文件列表：https://www.gov.uk/government/organisations/office-for-product-safety-and-standards\n\n**发生了什么**：UK OPSS 在 2026-09-04 发布多条产品安全报告，其中 Squishy Dumpling D-9373 涉及水珠释放导致儿童误食/窒息风险，不符合 Toys (Safety) Regulations 2011；Vicloon Baby Teether sold via Amazon 涉及婴童用品窒息风险，通报文件列明 Amazon marketplace listing 已移除。OPSS 机构最新文件页同时显示 2026-09-04 还有 Russko Limited Jumbo Duck Mega Squishy 等相关高风险通报。\n\n**我们怎么看**：这不是相册主线类目的直接新规，但它与上周 UK/US 水珠、感官玩具和 Amazon 渠道召回形成连续监管信号。对 puzzle accessories、school memory book、craft kit、儿童活动套装、带小零件或软胶材料的赠品/配件，需要把“是否被消费者或算法识别为 toy / sensory / childcare article”作为 Listing 风险，而不是只看内部产品线归类。\n\n**建议动作**：合规/Listing 在 2026-09-12 前筛查 UK 店铺标题、五点、A+、Search Terms、Generic Keyword、Item Type Keyword、Browse Node 和图片文案，关键词包含 kids、toy、sensory、beads、squishy、teether、baby、toddler、small parts、activity kit、gift for children。验收标准：命中 ASIN 有 UKCA/CE、EN71、年龄分级、警示标签、材料安全报告、供应商测试报告或“不适用”说明；若文案把成人/家庭相册误导成儿童玩具或儿童用品，2026-09-15 前完成前台文案降风险修订。\n\n", "title": "UK OPSS 9 月 4 日新增 Amazon 渠道玩具/婴童用品安全通报", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-07\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-07\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14p k:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch2>4. 已有事件的重要更新\u003c/h2>\n\u003cp>今日未发现长期事件索引中已有事项发生实质政策变化。商业责任险新要求仍需账号内确认，USPS 旺季包裹临时加价仍待 PRC 审核，Amazon Ads 诉讼仍未见 Amazon Ads 后台计费、拍卖或报表口径更新；这些事项继续按原复查日期跟踪，不重复推送旧事实。\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-07\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}]}, {"date": "2026-09-04", "text": "# 亚马逊及海外市场情报增量日报｜2026-09-04\n\n## 1. 今日判断\n\n今日没有发现新的 Amazon 强制 Listing、图片、A+ 或 FBA 费用规则；最高优先级是确认商业责任险新要求是否已进入本账号后台通知。若团队在中国大陆主体运营 US 站，需重点验证 2026-11-02 起是否必须通过 Amazon Insurance Accelerator 提交新保单，以及儿童、化妆品/摄入类、锂电等 enhanced safety 类目是否不再适用 10,000 美元月销售触发门槛。US FBM/Buy Shipping 旺季成本需开始重算，USPS 提议 2026-10-04 至 2027-01-17 对主要包裹服务加收临时旺季价格。物流侧 Drewry 2026-09-03 WCI 稳在 4,465 美元/40尺柜，跨太平洋上行和亚欧下行相互抵消，暂不建议因单周指数变化调整补货节奏。今天是本周最后一个中国大陆法定工作日，需要追加周报。\n\n## 2. 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n| --- | --- | --- | --- | --- | --- |\n| P1 | 商业责任险新要求需账号内确认 | US 为主，多站点观察 | Account Health / Compliance / Risk | 2026-11-02 | 今天创建核查任务，2026-09-08 前完成 Seller Central 通知与保单路径确认 |\n| P1 | USPS 旺季包裹临时加价进入成本测算 | US | FBM / Buy Shipping / Pricing / Profit | 2026-10-04 | 对 FBM/SFP/备用自发货 SKU 重算 10-1 月运费毛利 |\n| P2 | CPSC 新增 Amazon 渠道水珠玩具与床护栏召回 | US | Product Compliance / Listing Risk | 2026-09-03 | 只筛查儿童、玩具、水珠、床护栏、家具类风险词 |\n| P2 | Drewry WCI 9 月 3 日运价稳定 | US/EU/UK | Supply Chain / Landed Cost | 2026-09-03 | 更新补货模型海运参考价，暂不改旺季备货节奏 |\n\n## 3. 今日新情报\n\n### 商业责任险新要求出现 Amazon Announcement 转述，需账号内确认\n\n- 【影响等级】P1\n- 【站点】US 为主，多站点观察\n- 【发布日期】2026-09-03\n- 【生效日期】2026-11-02\n- 【信息状态】Amazon Announcement 转述，待 Seller Central 账号后台确认\n- 【来源】Sellers Ask Sellers 转述 Amazon Announcement：https://sellersasksellers.com/t/new-insurance-requirements-effective-nov-2-2026/7505；Amazon enhanced safety 类目帮助页：https://sellercentral.amazon.com/help/hub/reference/external/GUQ848NB5HZ6M6A4；Amazon 商业责任险现行要求：https://sellercentral.amazon.com.tr/seller-forums/discussions/t/4d4b6fe5-f6c1-4c65-bbe8-584326d76408\n\n**发生了什么**：第三方卖家社区转述的 Amazon Announcement 显示，2026-11-02 起商业责任险规则可能新增两点：enhanced safety listing requirements 类目即使未达到 US 站单月 10,000 美元销售额，也需维持 100 万美元/次及累计的商业责任险；中国大陆主体卖家新提交保险可能需通过 Amazon Insurance Accelerator。现行 Amazon 帮助内容仍可确认 10,000 美元触发门槛、100 万美元保额和覆盖全部在售商品等基础要求。\n\n**我们怎么看**：这对相册、补充页、portfolio binder 的直接影响通常低于儿童、化妆品、食品、锂电商品，但 school memory book、craft kit、puzzle accessories 若在后台或前台被归到儿童/玩具/套装/活动用品，可能被纳入安全增强类目。关键风险不是今天立即下架，而是 45 天补交保险证明、保单供应商不被接受、续保时无法通过 AIA 路径导致高风险类目 Listing 停用。\n\n**建议动作**：合规/财务在 2026-09-08 前登录 Seller Central，路径优先查 Performance Notifications、Account Health、Business Insurance、Product Compliance Requests；导出涉及 children、toy、craft kit、battery、cosmetic、ingestible 的 ASIN 清单。验收标准：确认本账号是否收到 Amazon 原始通知、当前保单到期日、承保主体是否匹配 legal entity、是否通过 AIA，以及 enhanced safety SKU 是否需要单独保险证明。未收到后台通知时，先标记为“待确认”，不更换保险供应商。\n\n### USPS 提议 2026 旺季包裹临时加价，影响 US FBM 和 Buy Shipping 毛利\n\n- 【影响等级】P1\n- 【站点】US\n- 【发布日期】2026-08-25；本次首次纳入：2026-09-04\n- 【生效日期】2026-10-04 至 2027-01-17，待 PRC 审核\n- 【信息状态】政府/邮政正式公告，待 Postal Regulatory Commission 审核\n- 【来源】USPS Newsroom：https://about.usps.com/newsroom/national-releases/2026/0825-usps-announces-temporary-price-change-for-2026-holiday-shipping-season.htm；PluginHive 2026-09-03 解读：https://www.pluginhive.com/usps-holiday-shipping-in-shopify/\n\n**发生了什么**：USPS 已向 PRC 提交通知，计划在 2026-10-04 至 2027-01-17 对 Priority Mail Express、Priority Mail、USPS Ground Advantage 和 Parcel Select 等国内竞争性包裹产品实行旺季临时价格调整。公告明确其他产品不受影响，最终仍取决于 PRC 审核。\n\n**我们怎么看**：如果 US 店铺全部 FBA，直接影响有限；但 FBM、SFP、Amazon Business 大单备用自发货、退换货补发、低价配件单件发货会受到毛利挤压。相册和 refill pages 若重量集中在 0-3 lb 或 4-10 lb，单票加价金额看似小，但 Q4 大促期间会直接影响 contribution margin 和优惠力度。\n\n**建议动作**：运营/财务在 2026-09-11 前筛选近 90 天 US FBM、SFP、Buy Shipping、补发订单，字段包含 SKU、重量段、zone、承运服务、当前运费、售价、毛利率、退货/补发率。对毛利率低于目标 3 个点或运费占售价超过 18% 的 SKU，提前给出三种方案：改 FBA、提高 FBM shipping charge/价格、或限制促销折扣。PRC 审核结果在 2026-09-18 复查。\n\n### CPSC 9 月 3 日新增多起 Amazon 渠道产品安全召回\n\n- 【影响等级】P2\n- 【站点】US\n- 【发布日期】2026-09-03\n- 【生效日期】2026-09-03\n- 【信息状态】正式监管召回\n- 【来源】CPSC GIHNJSI 水珠玩具召回：https://www.cpsc.gov/Recalls/2026/GIHNJSI-Squeezy-Dumplings-Toys-Recalled-Due-to-Serious-Ingestion-Choking-and-Obstruction-Hazards-Sold-on-Amazon-by-Chenyuanhui；CPSC Loyoda 床护栏召回：https://www.cpsc.gov/Recalls/2026/Adult-Portable-Bed-Rails-Recalled-Due-to-Risk-of-Serious-Injury-or-Death-from-Entrapment-and-Asphyxiation-Violate-Mandatory-Standard-for-Adult-Portable-Bed-Rails-Sold-on-Amazon-by-Loyoda-Direct-and-Loyoda；Amazon Product Safety Alerts：https://www.amazon.com/product-safety-alerts\n\n**发生了什么**：CPSC 2026-09-03 发布多起与 Amazon 销售渠道相关的召回或安全警示，包括约 8,000 件 GIHNJSI Squeezy Dumplings 水珠玩具，以及约 2,200 件 Loyoda 成人便携床护栏。主要风险涉及水珠误食、窒息/肠梗阻、床护栏夹陷/窒息、跌落、标签缺失等强制标准问题。\n\n**我们怎么看**：这不是相册主线类目的直接规则变化，但与 2026-09-03 已记录的 UK 水珠/感官玩具案例形成同一条产品安全信号：Amazon 渠道上儿童、玩具、感官、家具/支撑结构商品正在被监管集中点名。若 puzzle accessories 含磁吸、小零件、水珠、软胶、儿童玩具定位，或 school memory book 被包装成儿童活动套装，需要从“是否能卖”提升到“测试报告、标签、年龄分级、材料证明是否能逐 ASIN 对应”。\n\n**建议动作**：合规/Listing 在 2026-09-12 前筛查 US 店铺标题、五点、A+、Search Terms、Item Type Keyword 中包含 kids、toy、sensory、beads、magnetic、small parts、bed rail、dresser、furniture、activity kit 的 ASIN。验收标准：命中 ASIN 有 CPSC/CPC、ASTM F963、警示标签、年龄分级、供应商测试报告或“不适用”说明；未命中则仅观察，暂不调整 Listing。\n\n### Drewry 9 月 3 日 WCI 稳定在 4,465 美元/40尺柜\n\n- 【影响等级】P2\n- 【站点】US/EU/UK\n- 【发布日期】2026-09-03\n- 【生效日期】2026-09-03\n- 【信息状态】权威行业指数\n- 【来源】Drewry World Container Index：https://www.drewry.co.uk/supply-chain-advisors/supply-chain-expertise/world-container-index-assessed-by-drewry\n\n**发生了什么**：Drewry 2026-09-03 的 World Container Index 稳定在 4,465 美元/40尺柜；跨太平洋航线涨幅被亚欧航线下跌抵消。相比 2026-08-27 的 4,473 美元/40尺柜，整体基本持平。\n\n**我们怎么看**：海运成本仍处高位但单周没有方向性突破，不能单独触发加速补货或暂停补货。对 US、DE、FR、IT、ES 的旺季备货，更重要的是 FC 预约、预计到仓日、FBA 可售库存覆盖天数和每 SKU landed cost，而不是用指数涨跌替代 SKU 级预测。\n\n**建议动作**：供应链在 2026-09-09 前更新 US/EU 重点 SKU landed cost 模型，海运假设使用当前货代报价并保留 Drewry WCI 4,465 美元作为外部校验。验收标准：核心相册、补充页、学校记忆册 SKU 有在途 ETA、FBA receiving 状态、目标库存覆盖天数、补货毛利率和缺货风险分层。\n\n## 4. 已有事件的重要更新\n\n### Pan-EU FBA 荷兰 active offer 要求进入执行后核查\n\n- 历史事件：amazon-pan-eu-fba-nl-be-offer-2026\n- 上次状态：2026-09-03 已提示 Netherlands active offer 要求到达生效日，需核对 Pan-EU SKU。\n- 本次新增变化：今天进入生效后第一个工作日复查节点，未见 Amazon 对规则口径做新的公开变更。\n- 变化原因：长期索引复查日期为 2026-09-04，需要确认动作是否完成，而不是重复推送旧规则。\n- 行动是否需要调整：若欧洲运营已导出 Pan-EU SKU 并确认 NL active offer、价格、库存、VAT 配置，状态可关闭；若未完成，维持 P1 并将截止日改为 2026-09-05。复查路径：Seller Central Europe > Manage Inventory / Pan-European FBA enrollment / Netherlands offer status。\n\n### Amazon Ads 诉讼主线暂无后台规则更新\n\n- 历史事件：amazon-sponsored-ads-ftc-lawsuit-2026-08-31\n- 上次状态：2026-09-03 记录为监管诉讼，等待 Amazon Ads 是否发布计费、拍卖或报表口径新说明。\n- 本次新增变化：本次检索未发现 2026-09-03 至 2026-09-04 Amazon Ads 官方发布新的 Sponsored Products、Sponsored Brands、Sponsored Display、DSP 或 AMC 后台规则调整。\n- 变化原因：诉讼媒体解读仍在传播，但没有新增可执行的广告后台事实。\n- 行动是否需要调整：继续原动作，PPC/Finance 在 2026-09-05 前完成 CPC、CVR、ROAS、TACoS 异常审计；不建议因诉讼新闻机械停投核心词。\n\n## 5. 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n| --- | --- | --- | --- | --- | --- | --- |\n| P1 | 在 Seller Central 查验是否收到商业责任险新要求原始通知，并建立 enhanced safety ASIN 清单 | US/多站点 | 合规/财务 | 2026-09-08 | 有通知截图或“未收到”记录；保单到期日、承保主体、AIA 路径、风险 ASIN 清单齐全 | 2026-09-10 |\n| P1 | 重算 US FBM/SFP/Buy Shipping 旺季运费毛利 | US | 运营/财务 | 2026-09-11 | 近 90 天自发货 SKU 按重量段、zone、服务、毛利率输出风险等级和处理方案 | 2026-09-18 |\n| P1 | 完成 Pan-EU FBA NL offer 生效后复查 | DE/FR/IT/ES/NL | 欧洲运营 | 2026-09-05 | 所有 Pan-EU SKU 有 NL offer 状态、价格、库存、VAT 风险备注；不适用则关闭 | 2026-09-08 |\n| P2 | 筛查 US 儿童/玩具/感官/小零件/家具风险词 ASIN | US | 合规/Listing | 2026-09-12 | 命中 ASIN 有合规文件或不适用说明；高风险项有停售/整改判断 | 2026-09-19 |\n| P2 | 更新 US/EU 核心 SKU landed cost 和库存覆盖模型 | US/EU/UK | 供应链 | 2026-09-09 | 模型包含货代报价、Drewry WCI 校验、ETA、FBA receiving、覆盖天数和毛利率 | 2026-09-16 |\n\n## 6. 持续关注\n\n| 事项 | 当前状态 | 下次复查日期 | 触发升级条件 |\n| --- | --- | --- | --- |\n| 商业责任险新要求 | 第三方转述 Amazon Announcement，需账号内一手确认 | 2026-09-10 | Seller Central 收到保险通知、AIA 强制路径或 enhanced safety ASIN 保险请求时升级 P1/P0 |\n| USPS 2026 旺季包裹临时加价 | USPS 已提交 PRC 审核，尚未正式生效 | 2026-09-18 | PRC 审核通过或 Amazon Buy Shipping 同步费率表时升级 |\n| US Prime Big Deal Days FBA 入仓 | 下一节点为 2026-09-09 minimal shipment splits 到仓 | 2026-09-09 | 促销 SKU 未到仓、FC 接收异常或可售库存低于活动需求时升级 |\n| EUCDM 7.0.11 清关字段 | 仍等待货代/ERP 对低价值包裹字段执行反馈 | 2026-09-07 | 货代要求新增字段、IOSS/HS code/原产地模板变更时升级 |\n| Amazon Ads 诉讼后续官方口径 | 暂无 Amazon Ads 后台规则更新 | 2026-09-08 | Amazon Ads 发布计费、拍卖、报表或竞价规则说明时升级 |\n\n## 7. 情报边界与可信度\n\n本次核验来源 13 个，其中官方/监管/一手来源 8 个，包括中国政府网/国务院办公厅、USPS、CPSC、Amazon Product Safety Alerts、Amazon Seller Central 帮助页、Amazon Ads、FTC/Amazon 台变化\n\n### 合规\n\n- 商业责任险新要求为本周最高不确定项。若 Amazon 后台确认 2026-11-02 新规，中国大陆主体和 enhanced safety 类目 ASIN 将比普通类目面临更高保险证明要求。\n- US Product Bundling policy 已进入 9 月整改窗口，2026-09-30 前需把 bundle、set、multipack、refill pages、variation 的真实包装关系核清，避免把独立组合误做变体或把非厂家套装做成不合规 bundle。\n- CPSC 与 UK OPSS 本周均出现 Amazon 渠道水珠/感官玩具或高风险产品案例；对主线相册业务不是直接下架风险，但对儿童活动套装、puzzle accessories、带小零件/磁吸/软胶材料商品是合规提醒。\n\n### Listing\n\n- Total Product Quantity 变体主题已作为 US 数据质量主线纳入观察，适合检查 refill pages、多包装、set、count、pages 这类数量表达是否统一。\n- 本周未发现 Amazon 对 Title、Bullet、A+、主图、视频或 Search Terms 发布新的强制格式规则。Rufus/COSMO 仍按语义相关性长期优化，不因无官方新规而暂停基础内容质量建设。\n\n### 广告\n\n- FTC 与 22 州对 Sponsored Ads 定价机制的诉讼是本周广告主线，但截至 2026-09-04 未发现 Amazon Ads 后台竞价、计费或报表口径新规。\n- 团队动作应落在成本审计：用 30/60/90 天报表定位 CPC 上升超过 15%、CVR 未改善、ROAS 下降的 campaign、placement、keyword 和 ASIN。\n- Amazon Ads 本周检索未见 SP/SB/SD/DSP/AMC 新增必须调整的卖家操作规则。\n\n### 费用\n\n- 本周未发现 US/UK/DE/FR/IT/ES FBA fee 或 referral fee 新数值变化。\n- USPS 旺季临时加价若获批，会影响 US 自发货、备用补发、退换货补发和 Business 大单发货成本；FBA SKU 主要通过退补发和多渠道履约间接受影响。\n\n### 库存物流\n\n- US PBDD/FBA Q4 入仓节点继续推进：2026-09-09 minimal shipment splits 到仓，2026-09-16 Amazon-optimized shipment splits 到仓。\n- Drewry WCI 2026-09-03 为 4,465 美元/40尺柜，单周稳定但绝对价格仍需进入 landed cost 模型。\n- EUCDM 7.0.11 清关字段仍需货代/ERP 书面确认，当前不直接改 Listing。\n\n### 促销\n\n- Amazon Business Deals 本周已纳入 B2B 促销机会：适合 US/UK/DE/FR/IT/ES 中学校、办公室、活动采购需求强且毛利足够的 ASIN 小范围测试。\n- PBDD deal 提报和库存节点仍比新增促销工具更紧急；促销折扣必须与到仓和可售库存一起审核。\n\n## 4. 本周海外市场与供应链变化\n\n- USPS 2026 旺季包裹临时加价计划覆盖 2026-10-04 至 2027-01-17，若获批将与 Q4 礼品季、PBDD 后续发货、退换货高峰重叠。\n- Drewry WCI 稳定说明本周没有明显单边运价信号，但跨太平洋上行仍提醒 US 旺季补货不要只看平均指数。\n- CPSC 9 月 3 日集中发布多项召回/警示，多个 Amazon 渠道商品涉及中国卖家或进口产品。对当前团队的启示是：供应商文件、测试报告、警示标签、年龄分级和实物包装一致性要能逐 ASIN 留档。\n\n## 5. 对当前业务的量化影响\n\n| 维度 | 影响判断 | 建议量化口径 |\n| --- | --- | --- |\n| 销售 | 本周无直接拉动销量的新平台工具，B2B Deals 可小样本测试学校/办公室/活动采购需求。 | 选择 10-20 个毛利达标 ASIN，跟踪 B2B 订单数、Business CVR、折后贡献利润率。 |\n| 利润率 | USPS 旺季加价和高位海运会压缩低价、重货、远区 FBM SKU。 | 运费占售价 >18% 或毛利率低于目标 3 个点的 SKU 进入调价/改 FBA 队列。 |\n| CTR/CVR | Total Product Quantity 和 bundle 合规主要影
