cli>当前状态：P1 按原动作推进；用 PBDD 结果筛选候选 ASIN。\u003c/li>\n\u003cli>下次复查日期：2026-10-14。\u003c/li>\n\u003cli>触发升级条件：Deal Health 异常、Account Health 警告、可售库存低于活动销量 1.3 倍、最低促销价低于毛利底线、或 PPC 预算无法覆盖活动流量。\u003c/li>\n\u003c/ul>\n\u003ch3>商业责任险 Nov 2 账号适用性确认\u003c/h3>\n\u003cul>\n\u003cli>事项：商业责任险要求 2026-11-02 节点仍需按账号后台确认，尤其是 enhanced safety categories、中国大陆卖家 AIA 路径、保单到期日和被保险实体。\u003c/li>\n\u003cli>当前状态：P1 待账号侧核实；公开信息不足以替代 Seller Central 后台判断。\u003c/li>\n\u003cli>下次复查日期：2026-10-17。\u003c/li>\n\u003cli>触发升级条件：Seller Central 出现 insurance warning、enhanced safety ASIN 被要求补资料、现有保单实体/保额不匹配、或中国大陆卖家新保单无法按原路径提交。\u003c/li>\n\u003c/ul>\n\u003ch2>情报边界与可信度\u003c/h2>\n\u003cp>本次门禁使用中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（国办发明电〔2025〕7号，\u003ca href=\"https://www.gov.cn/zhengce/zhengceku/202511/content_7047091.htm）。文件显示\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.cn/zhengce/zhengceku/202511/content_7047091.htm）。文件显示\u003c/a> 2026 年国庆节为 2026-10-01 至 2026-10-07 放假调休，2026-09-20 和 2026-10-10 上班；2026-10-12 不在假期范围内，为正常大陆工作日。\u003c/p>\n\u003cp>本次复查来源和线索约 18 个，其中官方/监管/一手来源约 14 个，非官方或行业辅助来源约 4 个；纳入日报的新事件 0 条，已有事件实质更新 0 条，仍待确认且需按既定日期复查的事项 3 条。官方/一手来源覆盖中国政府网、Amazon Seller Forums / News_Amazon 检索线索、Amazon Ads What&#x27;s New、Amazon Ads API release notes、EIA Gasoline and Diesel Fuel Update、GOV.UK OPSS、CPSC Recalls 检索线索及长期索引内的 Amazon / 监管原始链接。\u003c/p>\n\u003cp>今天排除了重复的 Prime Big Deal Days 零售宣传、Amazon Accelerate/unBoxed 内容回顾、无后台规则变化的 Seller Central UI 讨论、与相册/纸品/礼品/收纳/拼图配件产品线无直接关系的 CPSC/OPSS 召回线索、Amazon Ads 展示型案例或品牌营销内容、以及没有 USTR/CBP/European Commission/Amazon 官方确认的新关税传闻。EIA 页面显示下一次柴油燃油价格发布日期为 2026-10-14，因此今天未更新 US logistics fuel assumption；Drewry WCI 仍沿用 2026-10-08 已推送值，等待下一周更新。\u003c/p>\n\u003cp>生产链接：\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-10-12\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": []}, {"date": "2026-10-10", "text": "# 亚马逊及海外市场情报增量日报｜2026-10-10\n\n## 今日判断\n\n今天是中国大陆官方补班日，也是本周最后一个大陆法定工作日，因此本次在日报后追加周度合并报告。今天没有需要立即下架 ASIN 或冻结广告的 P0 规则，但退货与合规侧出现两个需要团队落地的新增动作：FBA Partial Refunds 可按退货原因配置，以及 Return and Recovery Insights 已进入新版 Seller Central。最高优先级是 2026-10-13 前完成 FBA partial refund 原因白名单和退货原因复盘，避免系统默认对不适合的退货原因自动退款。重点站点为 US、UK、DE、FR、IT、ES；最近业务截止日是 2026-10-13 退货动作初审，随后是 2026-10-14 BFCM 候选池与物流成本复查。\n\n## 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n|---|---|---|---|---|---|\n| P1 | FBA Partial Refunds 新增按退货原因配置 | US/UK/DE/FR/IT/ES/CA | 退货/利润/客服/FBA/财务 | 2026-10-10 发布；内部初审 2026-10-13 | 是，先建原因白名单，不要全量放开 |\n| P2 | Return and Recovery Insights 进入新版 Seller Central | 多站点 | 退货分析/Listing/质量/包装/CVR | 2026-10-10 发现；内部复盘 2026-10-16 | 是，导出高退货原因和高退货率 ASIN |\n| P2 | UK OPSS 发布 Amazon 渠道含针挤痘玩具安全报告 | UK | 合规/产品开发/Listing 风险词 | 2026-10-09 发布并生效 | 是，仅对 sensory/toy/needle/squishy 等风险词定向筛查 |\n| P1 | 商业责任险要求需按 Nov 2 节点做账号适用性确认 | US/多站点 | 合规/保险/账号健康/产品安全 | 2026-11-02 生效；内部确认 2026-10-17 | 是，确认是否涉及增强安全类目或中国大陆卖家新保单路径 |\n| P1 | BFCM Deal 候选池预审 | US | 促销/库存/PPC/利润 | 内部 2026-10-14；Amazon 2026-10-20 | 是，继续用 PBDD 结果筛选 BFCM 候选 ASIN |\n\n## 今日新情报\n\n### FBA Partial Refunds 现在可按退货原因配置\n\n- 【影响等级】P1\n- 【站点】US/UK/DE/FR/IT/ES/CA\n- 【发布日期】2026-10-10\n- 【生效日期】已可在 Seller Central 配置\n- 【信息状态】正式公告\n- 【来源】Amazon Seller Forums / News_Amazon：https://sellercentral.amazon.com/seller-forums/discussions/t/7643be96-2c16-46aa-b1c5-38e8f5df7249\n- 发生了什么：Amazon 表示 FBA Partial Refunds 现在可按退货原因细分设置，卖家可以只对特定原因提供 partial refund。已开启该功能的卖家会默认对所有退货原因应用 partial refund，卖家需要进入设置页调整。\n- 我们怎么看：这会直接影响退货成本、利润保护和客户体验。相册、补充页、活页夹、记忆册和拼图配件类目常见退货原因可能包括 damaged、wrong item、quality not as expected、size/fit expectation mismatch；并非所有原因都适合自动给 partial refund，尤其是疑似 FBA 损坏、错发、不可二次销售或高客诉风险原因。\n- 建议动作：运营/客服/财务负责人在 2026-10-13 前进入 Seller Central 路径 FBA > FBA inventory > FBA Partial Refunds > Create partial refund，先导出现有设置和近 30 天退货原因。按 ASIN 建立原因白名单：只对可保留商品且不影响合规和体验的原因开启 partial refund；对 damaged、missing parts、wrong item、safety concern、not as described 暂不自动开启。验收方式：每个开启 ASIN 必须记录 return reason、建议 partial refund rate、近 30 天退货率、可挽回 FBA fee/return processing cost、差评风险和负责人审批记录。\n\n### Return and Recovery Insights 已进入新版 Seller Central\n\n- 【影响等级】P2\n- 【站点】多站点\n- 【发布日期】2026-10-10\n- 【生效日期】已在新版 Seller Central 可用\n- 【信息状态】正式公告\n- 【来源】Amazon Seller Forums / News_Amazon：https://sellercentral.amazon.com/seller-forums/discussions/t/fd47dbea-fb29-4a0a-9fb1-662275c0d259\n- 发生了什么：Amazon 将 Return and Recovery Insights 放入新版 Seller Central，用于集中查看退货原因、退货频率和可恢复价值，并支持识别带有 Low 或 Frequently Kept 退货频率标识的机会。\n- 我们怎么看：这是退货率治理和 Listing 纠偏的直接数据入口。对相册和纸品类产品，退货原因往往能反推出包装防护、尺寸表达、相纸/内页兼容性、颜色预期、礼品场景图片和 A+ 信息缺口；比只看退货率更适合推动 CVR 和利润同步改善。\n- 建议动作：运营负责人在 2026-10-16 前从 Return and Recovery Insights 导出近 90 天数据，按父 ASIN 汇总 return rate、top 3 return reasons、recoverable value、Low/Frequently Kept badge、近 30 天 CVR、星级和差评关键词。验收方式：筛选退货率高于类目或本店目标 20% 以上、且 CVR 低于父体均值的 ASIN，形成 Listing/图片/A+/包装四类整改清单；无明确可执行原因的 ASIN 仅观察，不改文案。\n\n### UK OPSS 发布 Amazon 渠道含针挤痘玩具安全报告\n\n- 【影响等级】P2\n- 【站点】UK\n- 【发布日期】2026-10-09\n- 【生效日期】2026-10-09\n- 【信息状态】正式监管报告\n- 【来源】GOV.UK OPSS：https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-pimple-popping-squishes-containing-needles-sold-via-amazon-2610-0037\n- 发生了什么：UK OPSS 发布 Product Safety Report，涉及通过 Amazon 销售的 Pimple Popping Squishes containing needles，风险点为产品内含尖锐针状物，监管措施包括 listing removal 和 end-user withdrawal。\n- 我们怎么看：对现有相册/补充页/活页夹主线影响有限，但对礼品、儿童手工、感官玩具、解压玩具、school memory gift bundle 或未来产品开发有合规提醒价值。UK 站对 Amazon 渠道产品安全通报持续密集，不能把“非同类召回”理解为无风险。\n- 建议动作：合规/产品开发在 2026-10-14 前筛查 UK 在售和开发池关键词：squishy、sensory、pimple、needle、pin、toy、kids、stress relief、fidget、craft kit。验收方式：若无匹配 SKU 或开发项目，记录关闭依据；如有匹配，补查 GPSR/UKCA/玩具安全测试、年龄分级、小零件/尖锐物风险和供应商测试报告，并暂停上新评审直到资料齐全。\n\n## 已有事件的重要更新\n\n### 商业责任险要求补充账号适用性和中国大陆卖家路径\n\n- 历史事件：amazon-commercial-liability-insurance-enhanced-safety-aia-2026-11-02\n- 上次状态：2026-09-17 已记录 Amazon 官方线索，生效日为 2026-11-02，但账号适用范围、增强安全类目和 AIA 路径仍需后台确认。\n- 本次新增变化：本次补查到 Amazon 官方域名帮助页/论坛线索仍指向 2026-11-02 节点，重点包括 enhanced safety categories 的商业责任险要求，以及中国大陆卖家新提交保单需通过 Amazon Insurance Accelerator 的路径。来源：https://sellercentral.amazon.com/help/hub/reference/external/GUQ848NB5HZ6M6A4；https://sellercentral.amazon.com.tr/seller-forums/discussions/t/4d4b6fe5-f6c1-4c65-bbe8-584326d76408\n- 相比上次变化：行动从“等待公开口径”调整为“账号侧适用性确认和保险资料预审”。这仍不是 Listing 文案或广告动作，但可能影响账号健康、产品安全类目和未来新增保单提交。\n- 变化原因：2026-11-02 生效日进入 30 天内，且索引中的 2026-09-15/2026-09-22 跟进节点已过期，需要把确认责任落到账号后台和保险文件。\n- 行动是否需要调整：升级为 P1。合规/财务在 2026-10-17 前进入 Seller Central > Account Health > Manage Your Insurance，逐站确认是否出现商业责任险提醒、增强安全类目适用 ASIN、保单到期日、保险公司、保额、被保险实体、是否要求 AIA。验收方式：输出一张 insurance applicability 表，字段包括 marketplace、legal entity、ASIN/category、是否 enhanced safety、当前保单到期日、是否 AIA、新保单提交路径、缺口和责任人；如后台无提醒，截图留档并在 2026-10-24 复查。\n\n## 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n|---|---|---|---|---|---|---|\n| P1 | 配置 FBA Partial Refunds 退货原因白名单 | US/UK/DE/FR/IT/ES | 运营/客服/财务 | 2026-10-13 | 每个开启 ASIN 有 return reason、refund rate、退货率、预计节省、差评风险和审批记录 | 2026-10-16 |\n| P1 | 确认商业责任险 Nov 2 适用性 | US/多站点 | 合规/财务 | 2026-10-17 | 输出 marketplace/legal entity/ASIN/category/保单/AIA 缺口表，并保存后台截图 | 2026-10-24 |\n| P1 | 完成 BFCM 候选 ASIN、毛利、库存和 Deal Health 预审 | US | US 运营/PPC/财务 | 2026-10-14 | 表格覆盖最低促销价、Deal fee、毛利率、库存覆盖、ACoS/TACoS、Deal Health 和 Account Health | 2026-10-20 |\n| P2 | 导出 Return and Recovery Insights 并形成退货整改清单 | 多站点 | 运营/Listing/质量 | 2026-10-16 | 近 90 天父 ASIN return rate、top reasons、recoverable value、CVR 和整改动作齐全 | 2026-10-23 |\n| P2 | 筛查 UK 感官/玩具/尖锐物风险词 | UK | 合规/产品开发 | 2026-10-14 | 完成关键词筛查；无匹配则记录关闭，有匹配则补齐测试报告和年龄分级 | 2026-10-21 |\n| P2 | 更新 US/EU 未锁价物流成本模型 | US/EU/UK | 供应链/财务 | 2026-10-14 | 模型包含 EIA diesel、Drewry WCI、货代报价、ETA、库存覆盖天数和 landed cost impact | 2026-10-14 |\n\n## 持续关注\n\n- 事项：BFCM Deals 提交。当前状态：Amazon 2026-10-20 截止，内部 2026-10-14 预审未完成前不得批量提交。下次复查日期：2026-10-14。触发升级条件：Deal Health 异常、Account Health 警告、可售库存低于活动销量 1.3 倍、或最低促销价低于毛利底线。\n- 事项：FBA Partial Refunds。当前状态：新功能可按退货原因配置，已开启账号可能默认覆盖所有原因。下次复查日期：2026-10-16。触发升级条件：高退货 ASIN 开启后差评率上升、退款金额超过节省成本、或 customer damaged / wrong item 等原因被误纳入。\n- 事项：商业责任险 Nov 2 节点。当前状态：公开线索已足够触发账号侧确认，但最终适用范围以 Seller Central 提醒为准。下次复查日期：2026-10-24。触发升级条件：后台出现 insurance warning、enhanced safety ASIN 被要求补资料、或中国大陆卖家新保单无法按原路径提交。\n- 事项：EU Customs Reform 小包 handling fee。当前状态：2026-11-01 前引入，金额仍待 delegated act。下次复查日期：2026-10-15。触发升级条件：欧盟公布 fee 金额、货代报价新增该费用、或 DE/FR/IT/ES 清关字段被退回。\n- 事项：Product Bundling 2027-01-11。当前状态：bundle/kit/set/multipack/refill-page 风险清单继续推进。下次复查日期：2026-10-15。触发升级条件：Account Health 出现风险提醒、Seller Central 帮助页新增解释、或 refill pages/set/kit 结构被标记。\n- 事项：Amazon Ads Review Requests / Branded Conversations。当前状态：Review Requests 预计 2026-11，Branded Conversations 预计 2027-01 US 启动。下次复查日期：2026-11-03。触发升级条件：账号出现入口、Amazon 公布计费/合规规则、或 API 文档开放。\n\n## 情报边界与可信度\n\n本次窗口覆盖 2026-10-09 09:03:23 至 2026-10-10 09:03:05（Asia/Shanghai），并补查长期索引中 BHDR、商业责任险、BFCM、Product Opportunity Explorer、Amazon Ads AI、EU Customs Reform、Product Bundling、EIA、Drewry 和 UK 产品安全事项。复查来源约 31 个，其中官方/监管/一手来源 23 个，非官方或行业辅助来源 8 个；纳入日报的新事件 3 条，已有事件实质更新 1 条，仍待确认事项 6 条。\n\n官方/一手来源包括中国政府网/国务院办公厅 2026 节假日安排、Amazon Seller Forums / News_Amazon、Amazon Seller Central Help、GOV.UK OPSS、Amazon Ads、EIA、Drewry、European Commission、USTR/White House、USPS/Postal Explorer 和 CPSC。非官方来源仅用于发现线索和排重，未作为单独执行依据。\n\n今天排除了重复的 Prime Big Deal Days 零售宣传、Amazon Accelerate/unBoxed 参会内容、无后台规则变化的 Seller Central UI 讨论、与相册/纸品/礼品/收纳/拼图配件产品线无直接关系的 CPSC/OPSS 召回、AWS 企业客户案例、以及没有 USTR/CBP/European Commission/Amazon 官方确认的新关税传闻。工作日门禁来源为中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（国办发明电〔2025〕7号，https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/2025/issue_12406/202511/content_7048922.html）。文件显示 2026 年国庆节为 2026-10-01 至 2026-10-07 放假，2026-09-20 和 2026-10-10 上班；因此 2026-10-10 是大陆法定工作日，也是本周最后一个大陆法定工作日。\n\n# 亚马逊及海外市场情报周报｜2026-10-10\n\n## 本周管理层摘要\n\n本周合并口径覆盖 2026-10-01 至 2026-10-10，因 2026-10-01 至 2026-10-07 为国庆假期，实际工作日重点集中在 2026-10-09 和 2026-10-10。本周确认的新增和实质更新共 9 条：退货工具 2 条、合规/保险 2 条、促销 1 条、产品开发 1 条、广告 AI 1 条、物流成本 2 条。最高风险不是单一平台处罚，而是 Q4 期间退货成本、BFCM 促销利润、商业责任险账号适用性和高位物流成本叠加。最近截止日为 2026-10-13 FBA Partial Refunds 原因白名单初审，随后是 2026-10-14 BFCM 候选池和物流成本复查。\n\n## 本周优先级快览\n\n| 优先级 | 事件主线 | 站点 | 模块 | 下周动作 | 负责人 | 截止日 |\n|---|---|---|---|---|---|---|\n| P1 | FBA Partial Refunds + Return Insights | US/UK/DE/FR/IT/ES | 退货/利润/Listing/质量 | 建立原因白名单并输出高退货 ASIN 整改清单 | 运营/客服/财务/Listing | 2026-10-13 / 2026-10-16 |\n| P1 | BFCM Deals 2026-10-20 截止 | US | 促销/库存/PPC/利润 | 用 PBDD 结果筛选 BFCM ASIN，完成毛利和库存预审 | US 运营/PPC/财务 | 2026-10-14 |\n| P1 | 商业责任险 2026-11-02 节点 | US/多站点 | 合规/保险/账号健康 | 确认 enhanced safety 类目、中国大陆卖家 AIA 路径和保单缺口 | 合规/财务 | 2026-10-17 |\n| P2 | Product Opportunity Explorer / 90 天 Launch Plan | US 优先 | 产品开发/Listing/PPC | 用 3 个新品方向做机会验证，不直接替代人工利润评审 | 产品开发/Listing/PPC | 2026-10-16 |\n| P2 | Amazon Ads AI：Review Requests / Branded Conversations | US | Sponsored Brands/评论/品牌内容 | 准备品牌问答素材和评论工具观察表 | PPC/品牌内容 | 2026-10-17 |\n| P2 | EIA diesel + Drewry WCI 高位回落 | US/EU/UK | 供应链/毛利/ETA | 逐票更新未锁价货件报价和 landed cost 假设 | 供应链/财务 | 2026-10-14 |\n| P2 | UK OPSS Amazon 渠道产品安全 | UK | 合规/产品开发 | 筛查 sensory/toy/needle/squishy 风险词 | 合规/产品开发 | 2026-10-14 |\n\n## 本周政策与平台变化\n\n### 合规\n\n商业责任险主线从“公开线索待确认”进入“账号侧适用性确认”。对中国大陆卖家和 enhanced safety categories，团队应在 2026-10-17 前确认 Seller Central 是否出现保险提醒、是否需要 AIA、新保单提交路径和保单字段缺口。UK OPSS 2026-10-09 的 Amazon 渠道含针玩具安全报告不直接指向现有相册产品，但对礼品、儿童手工、感官玩具和 school memory gift bundle 开发有风险提示。\n\n### Listing\n\n本周没有发现 Amazon 对标题、图片、A+、搜索词、属性或变体结构发布新的强制改写规则。与 Listing 最相关的变化来自 Return and Recovery Insights：团队应把 top return reasons 映射到图片、尺寸、兼容性、材料、包装和 A+ 信息缺口，而不是只用退货率做粗粒度判断。\n\n### 广告\n\nAmazon Ads AI 主线继续扩展到品牌对话和评论获取。Review Requests 预计 2026-11，Branded Conversations 预计 2027-01 在 US 启动，现阶段动作是准备合规素材和观察表，不提前使用非官方催评方式，也不把 AI 工具作为自动调价依据。\n\n### 费用\n\nFBA Partial Refunds 按退货原因配置，是本周最直接影响利润的费用/退货工具变化。正确做法是按原因和 ASIN 做白名单；不建议把所有退货原因一键开启，因为 damaged、wrong item、safety concern 或 not as described 可能带来差评、合规和赔付风险。\n\n### 库存物流\n\nEIA 2026-10-06 数据显示 US on-highway diesel 降至 USD 6.199/gal，Drewry 2026-10-08 WCI 降至 USD 4,351/40ft，两个指标均回落但仍处高位。下周只更新未锁价运输、3PL 和 FBM 应急配送模型；已锁价订单不追溯调整。\n\n### 促销\n\nUS Q4 节奏已从 PBDD 承接切换到 BFCM Deal 提交。Amazon 2026-10-20 截止前，内部应在 2026-10-14 完成候选 ASIN、最低促销价、Deal fee、库存覆盖、PBDD 表现、CVR、ACoS/TACoS、毛利和 Account Health 预审。\n\n## 本周海外市场与供应链变化\n\n美国燃油价格和海运指数短期回落，但 West Coast、California 和跨太平洋航线仍高于常态，不能直接下调售价或放松促销毛利红线。EU Customs Reform 小包 handling fee 仍待具体金额，DE/FR/IT/ES 暂不改价，但需要在 landed cost 模型里保留费用字段。UK 产品安全监管对 Amazon 渠道商品仍保持高频通报，开发新礼品、玩具、儿童手工或解压类产品时需要把 UKCA/GPSR/年龄分级和小零件/尖锐物测试放在立项前置项。\n\n## 对当前业务的量化影响\n\n退货工具的影响可按 ASIN 量化：目标是先筛选近 90 天退货率高于目标 20% 以上的父 ASIN，再用 partial refund 估算每单可挽回成本；若开启后差评率上升或退款金额超过节省的 FBA return processing / liquidation / recovery cost，应立即关闭该原因。BFCM 促销影响以毛利率和库存覆盖为主：候选 ASIN 至少应满足活动期预计销量 1.3 倍可售库存，且最低促销价扣除 Deal fee、广告预算和 FBA fee 后不低于公司毛利底线。物流影响以模型更新为主：EIA diesel 使用 USD 6.199/gal，Drewry WCI 使用 USD 4,351/40ft 作为参考，但每票货仍以货代报价、ETA 和库存覆盖天数为最终判断。商业责任险影响目前无法量化为费用增量，假设影响来自新保单成本、AIA 可选保险价格、保单不合规导致的账号健康风险和 enhanced safety ASIN 销售中断。\n\n## 下周行动清单\n\n| 优先级 | 动作 | 站点 | 对象 | 负责人 | 截止日 | 验收指标 |\n|---|---|---|---|---|---|---|\n| P1 | 建立 FBA Partial Refunds 原因白名单 | US/UK/DE/FR/IT/ES | 已开启或计划开启 partial refund 的 ASIN | 运营/客服/财务 | 2026-10-13 | 100% ASIN 有原因、比例、风险和审批记录 |\n| P1 | 完成 BFCM Deal 候选池预审 | US | PBDD 赢家、高 CVR、高库存覆盖 ASIN | US 运营/PPC/财务 | 2026-10-14 | 候选 ASIN 毛利、库存、Deal Health、Account Health 全部过线 |\n| P1 | 确认商业责任险适用性 | US/多站点 | enhanced safety 类目、账号保险后台、中国大陆卖家新保单路径 | 合规/财务 | 2026-10-17 | insurance applicability 表和后台截图完成 |\n| P2 | 输出高退货 ASIN 整改清单 | 多站点 | 近 90 天高退货父 ASIN | 运营/Listing/质量 | 2026-10-16 | 每个 ASIN 有原因归类、整改动作、负责人和复查日期 |\n| P2 | 验证 3 个新品方向 | US | 相册、scrapbook、school memory、portfolio、puzzle accessory 相关方向 | 产品开发/Listing/PPC | 2026-10-16 | 每个方向有价格带、竞品、关键词、FBA fee、MOQ、毛利和库存风险 |\n| P2 | 更新未锁价物流模型 | US/EU/UK | open shipments、新 3PL 报价、FBM 应急配送 | 供应链/财务 | 2026-10-14 | 每票有 lane quote、ETA、库存覆盖和 landed cost impact |\n\n## 已关闭与继续跟踪事项\n\n- 已关闭：本周未发现新的 Amazon 强制标题、图片、A+、Search Terms 或变体规则，相关论坛/UI 讨论不进入执行清单。\n- 已关闭：重复 PBDD 零售宣传和 unBoxed 参会内容不再重复推送，除非出现 Seller Central 后台规则、费用或广告产品权限变化。\n- 继续跟踪：BFCM Deals，复查日期 2026-10-14，升级条件为 Deal Health 或库存/毛利不过线。\n- 继续跟踪：商业责任险，复查日期 2026-10-24，升级条件为 Seller Central 出现 insurance warning 或 AIA 路径受阻。\n- 继续跟踪：EU Customs Reform 小包 handling fee，复查日期 2026-10-15，升级条件为欧盟公布 fee 金额或货代报价新增费用。\n- 继续跟踪：Amazon Ads Review Requests / Branded Conversations，复查日期 2026-11-03，升级条件为账号出现入口或 Amazon 公布计费/合规规则。\n\n## 来源与可信度统计\n\n本周合并复查来源约 45 个，其中 Amazon 官方/监管/政府/一手来源约 31 个，行业指数和辅助媒体约 14 个。周报纳入 9 条已确认新增或实质更新主线，排除重复报道、无新事实转载、无后台规则变化的讨论、与主营产品线无直接关联的低价值召回，以及未获 USTR/CBP/European Commission/Amazon 确认的关税传闻。\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-10\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-10\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报增量日报｜2026-10-10\u003c/h1>\n\u003ch2>今日判断\u003c/h2>\n\u003cp>今天是中国大陆官方补班日，也是本周最后一个大陆法定工作日，因此本次在日报后追加周度合并报告。今天没有需要立即下架 ASIN 或冻结广告的 P0 规则，但退货与合规侧出现两个需要团队落地的新增动作：FBA Partial Refunds 可按退货原因配置，以及 Return and Recovery Insights 已进入新版 Seller Central。最高优先级是 2026-10-13 前完成 FBA partial refund 原因白名单和退货原因复盘，避免系统默认对不适合的退货原因自动退款。重点站点为 US、UK、DE、FR、IT、ES；最近业务截止日是 2026-10-13 退货动作初审，随后是 2026-10-14 BFCM 候选池与物流成本复查。\u003c/p>\n\u003ch2>优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>影响站点\u003c/th>\n\u003cth>影响模块\u003c/th>\n\u003cth>截止/生效日期\u003c/th>\n\u003cth>今天是否需要动作\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>FBA Partial Refunds 新增按退货原因配置\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES/CA\u003c/td>\n\u003ctd>退货/利润/客服/FBA/财务\u003c/td>\n\u003ctd>2026-10-10 发布；内部初审 2026-10-13\u003c/td>\n\u003ctd>是，先建原因白名单，不要全量放开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Return and Recovery Insights 进入新版 Seller Central\u003c/td>\n\u003ctd>多站点\u003c/td>\n\u003ctd>退货分析/Listing/质量/包装/CVR\u003c/td>\n\u003ctd>2026-10-10 发现；内部复盘 2026-10-16\u003c/td>\n\u003ctd>是，导出高退货原因和高退货率 ASIN\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>UK OPSS 发布 Amazon 渠道含针挤痘玩具安全报告\u003c/td>\n\u003ctd>UK\u003c/td>\n\u003ctd>合规/产品开发/Listing 风险词\u003c/td>\n\u003ctd>2026-10-09 发布并生效\u003c/td>\n\u003ctd>是，仅对 sensory/toy/needle/squishy 等风险词定向筛查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>商业责任险要求需按 Nov 2 节点做账号适用性确认\u003c/td>\n\u003ctd>US/多站点\u003c/td>\n\u003ctd>合规/保险/账号健康/产品安全\u003c/td>\n\u003ctd>2026-11-02 生效；内部确认 2026-10-17\u003c/td>\n\u003ctd>是，确认是否涉及增强安全类目或中国大陆卖家新保单路径\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>BFCM Deal 候选池预审\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>促销/库存/PPC/利润\u003c/td>\n\u003ctd>内部 2026-10-14；Amazon 2026-10-20\u003c/td>\n\u003ctd>是，继续用 PBDD 结果筛选 BFCM 候选 ASIN\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>今日新情报\u003c/h2>\n\u003ch3>FBA Partial Refunds 现在可按退货原因配置\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P1\u003c/li>\n\u003cli>【站点】US/UK/DE/FR/IT/ES/CA\u003c/li>\n\u003cli>【发布日期】2026-10-10\u003c/li>\n\u003cli>【生效日期】已可在 Seller Central 配置\u003c/li>\n\u003cli>【信息状态】正式公告\u003c/li>\n\u003cli>【来源】Amazon Seller Forums / News_Amazon：\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/7643be96-2c16-46aa-b1c5-38e8f5df7249\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/seller-forums/discussions/t/7643be96-2c16-46aa-b1c5-38e8f5df7249\u003c/a>\u003c/li>\n\u003cli>发生了什么：Amazon 表示 FBA Partial Refunds 现在可按退货原因细分设置，卖家可以只对特定原因提供 partial refund。已开启该功能的卖家会默认对所有退货原因应用 partial refund，卖家需要进入设置页调整。\u003c/li>\n\u003cli>我们怎么看：这会直接影响退货成本、利润保护和客户体验。相册、补充页、活页夹、记忆册和拼图配件类目常见退货原因可能包括 damaged、wrong item、quality not as expected、size/fit expectation mismatch；并非所有原因都适合自动给 partial refund，尤其是疑似 FBA 损坏、错发、不可二次销售或高客诉风险原因。\u003c/li>\n\u003cli>建议动作：运营/客服/财务负责人在 2026-10-13 前进入 Seller Central 路径 FBA &gt; FBA inventory &gt; FBA Partial Refunds &gt; Create partial refund，先导出现有设置和近 30 天退货原因。按 ASIN 建立原因白名单：只对可保留商品且不影响合规和体验的原因开启 partial refund；对 damaged、missing parts、wrong item、safety concern、not as described 暂不自动开启。验收方式：每个开启 ASIN 必须记录 return reason、建议 partial refund rate、近 30 天退货率、可挽回 FBA fee/return processing cost、差评风险和负责人审批记录。\u003c/li>\n\u003c/ul>\n\u003ch3>Return and Recovery Insights 已进入新版 Seller Central\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】多站点\u003c/li>\n\u003cli>【发布日期】2026-10-10\u003c/li>\n\u003cli>【生效日期】已在新版 Seller Central 可用\u003c/li>\n\u003cli>【信息状态】正式公告\u003c/li>\n\u003cli>【来源】Amazon Seller Forums / News_Amazon：\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/fd47dbea-fb29-4a0a-9fb1-662275c0d259\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/seller-forums/discussions/t/fd47dbea-fb29-4a0a-9fb1-662275c0d259\u003c/a>\u003c/li>\n\u003cli>发生了什么：Amazon 将 Return and Recovery Insights 放入新版 Seller Central，用于集中查看退货原因、退货频率和可恢复价值，并支持识别带有 Low 或 Frequently Kept 退货频率标识的机会。\u003c/li>\n\u003cli>我们怎么看：这是退货率治理和 Listing 纠偏的直接数据入口。对相册和纸品类产品，退货原因往往能反推出包装防护、尺寸表达、相纸/内页兼容性、颜色预期、礼品场景图片和 A+ 信息缺口；比只看退货率更适合推动 CVR 和利润同步改善。\u003c/li>\n\u003cli>建议动作：运营负责人在 2026-10-16 前从 Return and Recovery Insights 导出近 90 天数据，按父 ASIN 汇总 return rate、top 3 return reasons、recoverable value、Low/Frequently Kept badge、近 30 天 CVR、星级和差评关键词。验收方式：筛选退货率高于类目或本店目标 20% 以上、且 CVR 低于父体均值的 ASIN，形成 Listing/图片/A+/包装四类整改清单；无明确可执行原因的 ASIN 仅观察，不改文案。\u003c/li>\n\u003c/ul>\n\u003ch3>UK OPSS 发布 Amazon 渠道含针挤痘玩具安全报告\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】UK\u003c/li>\n\u003cli>【发布日期】2026-10-09\u003c/li>\n\u003cli>【生效日期】2026-10-09\u003c/li>\n\u003cli>【信息状态】正式监管报告\u003c/li>\n\u003cli>【来源】GOV.UK OPSS：\u003ca href=\"https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-pimple-popping-squishes-containing-needles-sold-via-amazon-2610-0037\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-pimple-popping-squishes-containing-needles-sold-via-amazon-2610-0037\u003c/a>\u003c/li>\n\u003cli>发生了什么：UK OPSS 发布 Product Safety Report，涉及通过 Amazon 销售的 Pimple Popping Squishes containing needles，风险点为产品内含尖锐针状物，监管措施包括 listing removal 和 end-user withdrawal。\u003c/li>\n\u003cli>我们怎么看：对现有相册/补充页/活页夹主线影响有限，但对礼品、儿童手工、感官玩具、解压玩具、school memory gift bundle 或未来产品开发有合规提醒价值。UK 站对 Amazon 渠道产品安全通报持续密集，不能把“非同类召回”理解为无风险。\u003c/li>\n\u003cli>建议动作：合规/产品开发在 2026-10-14 前筛查 UK 在售和开发池关键词：squishy、sensory、pimple、needle、pin、toy、kids、stress relief、fidget、craft kit。验收方式：若无匹配 SKU 或开发项目，记录关闭依据；如有匹配，补查 GPSR/UKCA/玩具安全测试、年龄分级、小零件/尖锐物风险和供应商测试报告，并暂停上新评审直到资料齐全。\u003c/li>\n\u003c/ul>\n\u003ch2>已有事件的重要更新\u003c/h2>\n\u003ch3>商业责任险要求补充账号适用性和中国大陆卖家路径\u003c/h3>\n\u003cul>\n\u003cli>历史事件：amazon-commercial-liability-insurance-enhanced-safety-aia-2026-11-02\u003c/li>\n\u003cli>上次状态：2026-09-17 已记录 Amazon 官方线索，生效日为 2026-11-02，但账号适用范围、增强安全类目和 AIA 路径仍需后台确认。\u003c/li>\n\u003cli>本次新增变化：本次补查到 Amazon 官方域名帮助页/论坛线索仍指向 2026-11-02 节点，重点包括 enhanced safety categories 的商业责任险要求，以及中国大陆卖家新提交保单需通过 Amazon Insurance Accelerator 的路径。来源：\u003ca href=\"https://sellercentral.amazon.com/help/hub/reference/external/GUQ848NB5HZ6M6A4；https://sellercentral.amazon.com.tr/seller-forums/discussions/t/4d4b6fe5-f6c1-4c65-bbe8-584326d76408\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/help/hub/reference/external/GUQ848NB5HZ6M6A4；https://sellercentral.amazon.com.tr/seller-forums/discussions/t/4d4b6fe5-f6c1-4c65-bbe8-584326d76408\u003c/a>\u003c/li>\n\u003cli>相比上次变化：行动从“等待公开口径”调整为“账号侧适用性确认和保险资料预审”。这仍不是 Listing 文案或广告动作，但可能影响账号健康、产品安全类目和未来新增保单提交。\u003c/li>\n\u003cli>变化原因：2026-11-02 生效日进入 30 天内，且索引中的 2026-09-15/2026-09-22 跟进节点已过期，需要把确认责任落到账号后台和保险文件。\u003c/li>\n\u003cli>行动是否需要调整：升级为 P1。合规/财务在 2026-10-17 前进入 Seller Central &gt; Account Health &gt; Manage Your Insurance，逐站确认是否出现商业责任险提醒、增强安全类目适用 ASIN、保单到期日、保险公司、保额、被保险实体、是否要求 AIA。验收方式：输出一张 insurance applicability 表，字段包括 marketplace、legal entity、ASIN/category、是否 enhanced safety、当前保单到期日、是否 AIA、新保单提交路径、缺口和责任人；如后台无提醒，截图留档并在 2026-10-24 复查。\u003c/li>\n\u003c/ul>\n\u003ch2>今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>配置 FBA Partial Refunds 退货原因白名单\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES\u003c/td>\n\u003ctd>运营/客服/财务\u003c/td>\n\u003ctd>2026-10-13\u003c/td>\n\u003ctd>每个开启 ASIN 有 return reason、refund rate、退货率、预计节省、差评风险和审批记录\u003c/td>\n\u003ctd>2026-10-16\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>确认商业责任险 Nov 2 适用性\u003c/td>\n\u003ctd>US/多站点\u003c/td>\n\u003ctd>合规/财务\u003c/td>\n\u003ctd>2026-10-17\u003c/td>\n\u003ctd>输出 marketplace/legal entity/ASIN/category/保单/AIA 缺口表，并保存后台截图\u003c/td>\n\u003ctd>2026-10-24\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>完成 BFCM 候选 ASIN、毛利、库存和 Deal Health 预审\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>US 运营/PPC/财务\u003c/td>\n\u003ctd>2026-10-14\u003c/td>\n\u003ctd>表格覆盖最低促销价、Deal fee、毛利率、库存覆盖、ACoS/TACoS、Deal Health 和 Account Health\u003c/td>\n\u003ctd>2026-10-20\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>导出 Return and Recovery Insights 并形成退货整改清单\u003c/td>\n\u003ctd>多站点\u003c/td>\n\u003ctd>运营/Listing/质量\u003c/td>\n\u003ctd>2026-10-16\u003c/td>\n\u003ctd>近 90 天父 ASIN return rate、top reasons、recoverable value、CVR 和整改动作齐全\u003c/td>\n\u003ctd>2026-10-23\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>筛查 UK 感官/玩具/尖锐物风险词\u003c/td>\n\u003ctd>UK\u003c/td>\n\u003ctd>合规/产品开发\u003c/td>\n\u003ctd>2026-10-14\u003c/td>\n\u003ctd>完成关键词筛查；无匹配则记录关闭，有匹配则补齐测试报告和年龄分级\u003c/td>\n\u003ctd>2026-10-21\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>更新 US/EU 未锁价物流成本模型\u003c/td>\n\u003ctd>US/EU/UK\u003c/td>\n\u003ctd>供应链/财务\u003c/td>\n\u003ctd>2026-10-14\u003c/td>\n\u003ctd>模型包含 EIA diesel、Drewry WCI、货代报价、ETA、库存覆盖天数和 landed cost impact\u003c/td>\n\u003ctd>2026-10-14\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>持续关注\u003c/h2>\n\u003cul>\n\u003cli>事项：BFCM Deals 提交。当前状态：Amazon 2026-10-20 截止，内部 2026-10-14 预审未完成前不得批量提交。下次复查日期：2026-10-14。触发升级条件：Deal Health 异常、Account Health 警告、可售库存低于活动销量 1.3 倍、或最低促销价低于毛利底线。\u003c/li>\n\u003cli>事项：FBA Partial Refunds。当前状态：新功能可按退货原因配置，已开启账号可能默认覆盖所有原因。下次复查日期：2026-10-16。触发升级条件：高退货 ASIN 开启后差评率上升、退款金额超过节省成本、或 customer damaged / wrong item 等原因被误纳入。\u003c/li>\n\u003cli>事项：商业责任险 Nov 2 节点。当前状态：公开线索已足够触发账号侧确认，但最终适用范围以 Seller Central 提醒为准。下次复查日期：2026-10-24。触发升级条件：后台出现 insurance warning、enhanced safety ASIN 被要求补资料、或中国大陆卖家新保单无法按原路径提交。\u003c/li>\n\u003cli>事项：EU Customs Reform 小包 handling fee。当前状态：2026-11-01 前引入，金额仍待 delegated act。下次复查日期：2026-10-15。触发升级条件：欧盟公布 fee 金额、货代报价新增该费用、或 DE/FR/IT/ES 清关字段被退回。\u003c/li>\n\u003cli>事项：Product Bundling 2027-01-11。当前状态：bundle/kit/set/multipack/refill-page 风险清单继续推进。下次复查日期：2026-10-15。触发升级条件：Account Health 出现风险提醒、Seller Central 帮助页新增解释、或 refill pages/set/kit 结构被标记。\u003c/li>\n\u003cli>事项：Amazon Ads Review Requests / Branded Conversations。当前状态：Review Requests 预计 2026-11，Branded Conversations 预计 2027-01 US 启动。下次复查日期：2026-11-03。触发升级条件：账号出现入口、Amazon 公布计费/合规规则、或 API 文档开放。\u003c/li>\n\u003c/ul>\n\u003ch2>情报边界与可信度\u003c/h2>\n\u003cp>本次窗口覆盖 2026-10-09 09:03:23 至 2026-10-10 09:03:05（Asia/Shanghai），并补查长期索引中 BHDR、商业责任险、BFCM、Product Opportunity Explorer、Amazon Ads AI、EU Customs Reform、Product Bundling、EIA、Drewry 和 UK 产品安全事项。复查来源约 31 个，其中官方/监管/一手来源 23 个，非官方或行业辅助来源 8 个；纳入日报的新事件 3 条，已有事件实质更新 1 条，仍待确认事项 6 条。\u003c/p>\n\u003cp>官方/一手来源包括中国政府网/国务院办公厅 2026 节假日安排、Amazon Seller Forums / News_Amazon、Amazon Seller Central Help、GOV.UK OPSS、Amazon Ads、EIA、Drewry、European Commission、USTR/White House、USPS/Postal Explorer 和 CPSC。非官方来源仅用于发现线索和排重，未作为单独执行依据。\u003c/p>\n\u003cp>今天排除了重复的 Prime Big Deal Days 零售宣传、Amazon Accelerate/unBoxed 参会内容、无后台规则变化的 Seller Central UI 讨论、与相册/纸品/礼品/收纳/拼图配件产品线无直接关系的 CPSC/OPSS 召回、AWS 企业客户案例、以及没有 USTR/CBP/European Commission/Amazon 官方确认的新关税传闻。工作日门禁来源为中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（国办发明电〔2025〕7号，\u003ca href=\"https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/2025/issue_12406/202511/content_7048922.html）。文件显示\" target=\"_blank\" rel=\"noopener noreferrer\">https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/2025/issue_12406/202511/content_7048922.html）。文件显示\u003c/a> 2026 年国庆节为 2026-10-01 至 2026-10-07 放假，2026-09-20 和 2026-10-10 上班；因此 2026-10-10 是大陆法定工作日，也是本周最后一个大陆法定工作日。\u003c/p>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报周报｜2026-10-10\u003c/h1>\n\u003ch2>本周管理层摘要\u003c/h2>\n\u003cp>本周合并口径覆盖 2026-10-01 至 2026-10-10，因 2026-10-01 至 2026-10-07 为国庆假期，实际工作日重点集中在 2026-10-09 和 2026-10-10。本周确认的新增和实质更新共 9 条：退货工具 2 条、合规/保险 2 条、促销 1 条、产品开发 1 条、广告 AI 1 条、物流成本 2 条。最高风险不是单一平台处罚，而是 Q4 期间退货成本、BFCM 促销利润、商业责任险账号适用性和高位物流成本叠加。最近截止日为 2026-10-13 FBA Partial Refunds 原因白名单初审，随后是 2026-10-14 BFCM 候选池和物流成本复查。\u003c/p>\n\u003ch2>本周优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事件主线\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>模块\u003c/th>\n\u003cth>下周动作\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>FBA Partial Refunds + Return Insights\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES\u003c/td>\n\u003ctd>退货/利润/Listing/质量\u003c/td>\n\u003ctd>建立原因白名单并输出高退货 ASIN 整改清单\u003c/td>\n\u003ctd>运营/客服/财务/Listing\u003c/td>\n\u003ctd>2026-10-13 / 2026-10-16\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>BFCM Deals 2026-10-20 截止\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>促销/库存/PPC/利润\u003c/td>\n\u003ctd>用 PBDD 结果筛选 BFCM ASIN，完成毛利和库存预审\u003c/td>\n\u003ctd>US 运营/PPC/财务\u003c/td>\n\u003ctd>2026-10-14\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>商业责任险 2026-11-02 节点\u003c/td>\n\u003ctd>US/多站点\u003c/td>\n\u003ctd>合规/保险/账号健康\u003c/td>\n\u003ctd>确认 enhanced safety 类目、中国大陆卖家 AIA 路径和保单缺口\u003c/td>\n\u003ctd>合规/财务\u003c/td>\n\u003ctd>2026-10-17\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Product Opportunity Explorer / 90 天 Launch Plan\u003c/td>\n\u003ctd>US 优先\u003c/td>\n\u003ctd>产品开发/Listing/PPC\u003c/td>\n\u003ctd>用 3 个新品方向做机会验证，不直接替代人工利润评审\u003c/td>\n\u003ctd>产品开发/Listing/PPC\u003c/td>\n\u003ctd>2026-10-16\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Amazon Ads AI：Review Requests / Branded Conversations\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Sponsored Brands/评论/品牌内容\u003c/td>\n\u003ctd>准备品牌问答素材和评论工具观察表\u003c/td>\n\u003ctd>PPC/品牌内容\u003c/td>\n\u003ctd>2026-10-17\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>EIA diesel + Drewry WCI 高位回落\u003c/td>\n\u003ctd>US/EU/UK\u003c/td>\n\u003ctd>供应链/毛利/ETA\u003c/td>\n\u003ctd>逐票更新未锁价货件报价和 landed cost 假设\u003c/td>\n\u003ctd>供应链/财务\u003c/td>\n\u003ctd>2026-10-14\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>UK OPSS Amazon 渠道产品安全\u003c/td>\n\u003ctd>UK\u003c/td>\n\u003ctd>合规/产品开发\u003c/td>\n\u003ctd>筛查 sensory/toy/needle/squishy 风险词\u003c/td>\n\u003ctd>合规/产品开发\u003c/td>\n\u003ctd>2026-10-14\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>本周政策与平台变化\u003c/h2>\n\u003ch3>合规\u003c/h3>\n\u003cp>商业责任险主线从“公开线索待确认”进入“账号侧适用性确认”。对中国大陆卖家和 enhanced safety categories，团队应在 2026-10-17 前确认 Seller Central 是否出现保险提醒、是否需要 AIA、新保单提交路径和保单字段缺口。UK OPSS 2026-10-09 的 Amazon 渠道含针玩具安全报告不直接指向现有相册产品，但对礼品、儿童手工、感官玩具和 school memory gift bundle 开发有风险提示。\u003c/p>\n\u003ch3>Listing\u003c/h3>\n\u003cp>本周没有发现 Amazon 对标题、图片、A+、搜索词、属性或变体结构发布新的强制改写规则。与 Listing 最相关的变化来自 Return and Recovery Insights：团队应把 top return reasons 映射到图片、尺寸、兼容性、材料、包装和 A+ 信息缺口，而不是只用退货率做粗粒度判断。\u003c/p>\n\u003ch3>广告\u003c/h3>\n\u003cp>Amazon Ads AI 主线继续扩展到品牌对话和评论获取。Review Requests 预计 2026-11，Branded Conversations 预计 2027-01 在 US 启动，现阶段动作是准备合规素材和观察表，不提前使用非官方催评方式，也不把 AI 工具作为自动调价依据。\u003c/p>\n\u003ch3>费用\u003c/h3>\n\u003cp>FBA Partial Refunds 按退货原因配置，是本周最直接影响利润的费用/退货工具变化。正确做法是按原因和 ASIN 做白名单；不建议把所有退货原因一键开启，因为 damaged、wrong item、safety concern 或 not as described 可能带来差评、合规和赔付风险。\u003c/p>\n\u003ch3>库存物流\u003c/h3>\n\u003cp>EIA 2026-10-06 数据显示 US on-highway diesel 降至 USD 6.199/gal，Drewry 2026-10-08 WCI 降至 USD 4,351/40ft，两个指标均回落但仍处高位。下周只更新未锁价运输、3PL 和 FBM 应急配送模型；已锁价订单不追溯调整。\u003c/p>\n\u003ch3>促销\u003c/h3>\n\u003cp>US Q4 节奏已从 PBDD 承接切换到 BFCM Deal 提交。Amazon 2026-10-20 截止前，内部应在 2026-10-14 完成候选 ASIN、最低促销价、Deal fee、库存覆盖、PBDD 表现、CVR、ACoS/TACoS、毛利和 Account Health 预审。\u003c/p>\n\u003ch2>本周海外市场与供应链变化\u003c/h2>\n\u003cp>美国燃油价格和海运指数短期回落，但 West Coast、California 和跨太平洋航线仍高于常态，不能直接下调售价或放松促销毛利红线。EU Customs Reform 小包 handling fee 仍待具体金额，DE/FR/IT/ES 暂不改价，但需要在 landed cost 模型里保留费用字段。UK 产品安全监管对 Amazon 渠道商品仍保持高频通报，开发新礼品、玩具、儿童手工或解压类产品时需要把 UKCA/GPSR/年龄分级和小零件/尖锐物测试放在立项前置项。\u003c/p>\n\u003ch2>对当前业务的量化影响\u003c/h2>\n\u003cp>退货工具的影响可按 ASIN 量化：目标是先筛选近 90 天退货率高于目标 20% 以上的父 ASIN，再用 partial refund 估算每单可挽回成本；若开启后差评率上升或退款金额超过节省的 FBA return processing / liquidation / recovery cost，应立即关闭该原因。BFCM 促销影响以毛利率和库存覆盖为主：候选 ASIN 至少应满足活动期预计销量 1.3 倍可售库存，且最低促销价扣除 Deal fee、广告预算和 FBA fee 后不低于公司毛利底线。物流影响以模型更新为主：EIA diesel 使用 USD 6.199/gal，Drewry WCI 使用 USD 4,351/40ft 作为参考，但每票货仍以货代报价、ETA 和库存覆盖天数为最终判断。商业责任险影响目前无法量化为费用增量，假设影响来自新保单成本、AIA 可选保险价格、保单不合规导致的账号健康风险和 enhanced safety ASIN 销售中断。\u003c/p>\n\u003ch2>下周行动清单\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>动作\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>对象\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日\u003c/th>\n\u003cth>验收指标\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>建立 FBA Partial Refunds 原因白名单\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES\u003c/td>\n\u003ctd>已开启或计划开启 partial refund 的 ASIN\u003c/td>\n\u003ctd>运营/客服/财务\u003c/td>\n\u003ctd>2026-10-13\u003c/td>\n\u003ctd>100% ASIN 有原因、比例、风险和审批记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>完成 BFCM Deal 候选池预审\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>PBDD 赢家、高 CVR、高库存覆盖 ASIN\u003c/td>\n\u003ctd>US 运营/PPC/财务\u003c/td>\n\u003ctd>2026-10-14\u003c/td>\n\u003ctd>候选 ASIN 毛利、库存、Deal Health、Account Health 全部过线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>确认商业责任险适用性\u003c/td>\n\u003ctd>US/多站点\u003c/td>\n\u003ctd>enhanced safety 类目、账号保险后台、中国大陆卖家新保单路径\u003c/td>\n\u003ctd>合规/财务\u003c/td>\n\u003ctd>2026-10-17\u003c/td>\n\u003ctd>insurance applicability 表和后台截图完成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>输出高退货 ASIN 整改清单\u003c/td>\n\u003ctd>多站点\u003c/td>\n\u003ctd>近 90 天高退货父 ASIN\u003c/td>\n\u003ctd>运营/Listing/质量\u003c/td>\n\u003ctd>2026-10-16\u003c/td>\n\u003ctd>每个 ASIN 有原因归类、整改动作、负责人和复查日期\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>验证 3 个新品方向\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>相册、scrapbook、school memory、portfolio、puzzle accessory 相关方向\u003c/td>\n\u003ctd>产品开发/Listing/PPC\u003c/td>\n\u003ctd>2026-10-16\u003c/td>\n\u003ctd>每个方向有价格带、竞品、关键词、FBA fee、MOQ、毛利和库存风险\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>更新未锁价物流模型\u003c/td>\n\u003ctd>US/EU/UK\u003c/td>\n\u003ctd>open shipments、新 3PL 报价、FBM 应急配送\u003c/td>\n\u003ctd>供应链/财务\u003c/td>\n\u003ctd>2026-10-14\u003c/td>\n\u003ctd>每票有 lane quote、ETA、库存覆盖和 landed cost impact\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>已关闭与继续跟踪事项\u003c/h2>\n\u003cul>\n\u003cli>已关闭：本周未发现新的 Amazon 强制标题、图片、A+、Search Terms 或变体规则，相关论坛/UI 讨论不进入执行清单。\u003c/li>\n\u003cli>已关闭：重复 PBDD 零售宣传和 unBoxed 参会内容不再重复推送，除非出现 Seller Central 后台规则、费用或广告产品权限变化。\u003c/li>\n\u003cli>继续跟踪：BFCM Deals，复查日期 2026-10-14，升级条件为 Deal Health 或库存/毛利不过线。\u003c/li>\n\u003cli>继续跟踪：商业责任险，复查日期 2026-10-24，升级条件为 Seller Central 出现 insurance warning 或 AIA 路径受阻。\u003c/li>\n\u003cli>继续跟踪：EU Customs Reform 小包 handling fee，复查日期 2026-10-15，升级条件为欧盟公布 fee 金额或货代报价新增费用。\u003c/li>\n\u003cli>继续跟踪：Amazon Ads Review Requests / Branded Conversations，复查日期 2026-11-03，升级条件为账号出现入口或 Amazon 公布计费/合规规则。\u003c/li>\n\u003c/ul>\n\u003ch2>来源与可信度统计\u003c/h2>\n\u003cp>本周合并复查来源约 45 个，其中 Amazon 官方/监管/政府/一手来源约 31 个，行业指数和辅助媒体约 14 个。周报纳入 9 条已确认新增或实质更新主线，排除重复报道、无新事实转载、无后台规则变化的讨论、与主营产品线无直接关联的低价值召回，以及未获 USTR/CBP/European Commission/Amazon 确认的关税传闻。\u003c/p>\n\u003cp>生产链接：\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-10-10\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-10-10", "text": "### FBA Partial Refunds 现在可按退货原因配置\n\n- 【影响等级】P1\n- 【站点】US/UK/DE/FR/IT/ES/CA\n- 【发布日期】2026-10-10\n- 【生效日期】已可在 Seller Central 配置\n- 【信息状态】正式公告\n- 【来源】Amazon Seller Forums / News_Amazon：https://sellercentral.amazon.com/seller-forums/discussions/t/7643be96-2c16-46aa-b1c5-38e8f5df7249\n- 发生了什么：Amazon 表示 FBA Partial Refunds 现在可按退货原因细分设置，卖家可以只对特定原因提供 partial refund。已开启该功能的卖家会默认对所有退货原因应用 partial refund，卖家需要进入设置页调整。\n- 我们怎么看：这会直接影响退货成本、利润保护和客户体验。相册、补充页、活页夹、记忆册和拼图配件类目常见退货原因可能包括 damaged、wrong item、quality not as expected、size/fit expectation mismatch；并非所有原因都适合自动给 partial refund，尤其是疑似 FBA 损坏、错发、不可二次销售或高客诉风险原因。\n- 建议动作：运营/客服/财务负责人在 2026-10-13 前进入 Seller Central 路径 FBA > FBA inventory > FBA Partial Refunds > Create partial refund，先导出现有设置和近 30 天退货原因。按 ASIN 建立原因白名单：只对可保留商品且不影响合规和体验的原因开启 partial refund；对 damaged、missing parts、wrong item、safety concern、not as described 暂不自动开启。验收方式：每个开启 ASIN 必须记录 return reason、建议 partial refund rate、近 30 天退货率、可挽回 FBA fee/return processing cost、差评风险和负责人审批记录。\n\n", "title": "FBA Partial Refunds 现在可按退货原因配置", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-10\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-10\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>FBA Partial Refunds 现在可按退货原因配置\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P1\u003c/li>\n\u003cli>【站点】US/UK/DE/FR/IT/ES/CA\u003c/li>\n\u003cli>【发布日期】2026-10-10\u003c/li>\n\u003cli>【生效日期】已可在 Seller Central 配置\u003c/li>\n\u003cli>【信息状态】正式公告\u003c/li>\n\u003cli>【来源】Amazon Seller Forums / News_Amazon：\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/7643be96-2c16-46aa-b1c5-38e8f5df7249\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/seller-forums GPSR/UKCA/玩具安全测试、年龄分级、小零件/尖锐物风险和供应商测试报告，并暂停上新评审直到资料齐全。\n\n", "title": "UK OPSS 发布 Amazon 渠道含针挤痘玩具安全报告", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-10\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-10\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>UK OPSS 发布 Amazon 渠道含针挤痘玩具安全报告\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】UK\u003c/li>\n\u003cli>【发布日期】2026-10-09\u003c/li>\n\u003cli>【生效日期】2026-10-09\u003c/li>\n\u003cli>【信息状态】正式监管报告\u003c/li>\n\u003cli>【来源】GOV.UK OPSS：\u003ca href=\"https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-pimple-popping-squishes-containing-needles-sold-via-amazon-2610-0037\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-pimple-popping-squishes-containing-needles-sold-via-amazon-2610-0037\u003c/a>\u003c/li>\n\u003cli>发生了什么：UK OPSS 发布 Product Safety Report，涉及通过 Amazon 销售的 Pimple Popping Squishes containing needles，风险点为产品内含尖锐针状物，监管措施包括 listing removal 和 end-user withdrawal。\u003c/li>\n\u003cli>我们怎么看：对现有相册/补充页/活页夹主线影响有限，但对礼品、儿童手工、感官玩具、解压玩具、school memory gift bundle 或未来产品开发有合规提醒价值。UK 站对 Amazon 渠道产品安全通报持续密集，不能把“非同类召回”理解为无风险。\u003c/li>\n\u003cli>建议动作：合规/产品开发在 2026-10-14 前筛查 UK 在售和开发池关键词：squishy、sensory、pimple、needle、pin、toy、kids、stress relief、fidget、craft kit。验收方式：若无匹配 SKU 或开发项目，记录关闭依据；如有匹配，补查 GPSR/UKCA/玩具安全测试、年龄分级、小零件/尖锐物风险和供应商测试报告，并暂停上新评审直到资料齐全。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-10-10\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-10-10", "text": "### 商业责任险要求补充账号适用性和中国大陆卖家路径\n\n- 历史事件：amazon-commercial-liability-insurance-enhanced-safety-aia-2026-11-02\n- 上次状态：2026-09-17 已记录 Amazon 官方线索，生效日为 2026-11-02，但账号适用范围、增强安全类目和 AIA 路径仍需后台确认。\n- 本次新增变化：本次补查到 Amazon 官方域名帮助页/论坛线索仍指向 2026-11-02 节点，重点包括 enhanced safety categories 的商业责任险要求，以及中国大陆卖家新提交保单需通过 Amazon Insurance Accelerator 的路径。来源：https://sellercentral.amazon.com/help/hub/reference/external/GUQ848NB5HZ6M6A4；https://sellercentral.amazon.com.tr/seller-forums/discussions/t/4d4b6fe5-f6c1-4c65-bbe8-584326d76408\n- 相比上次变化：行动从“等待公开口径”调整为“账号侧适用性确认和保险资料预审”。这仍不是 Listing 文案或广告动作，但可能影响账号健康、产品安全类目和未来新增保单提交。\n- 变化原因：2026-11-02 生效日进入 30 天内，且索引中的 2026-09-15/2026-09-22 跟进节点已过期，需要把确认责任落到账号后台和保险文件。\n- 行动是否需要调整：升级为 P1。合规/财务在 2026-10-17 前进入 Seller Central > Account Health > Manage Your Insurance，逐站确认是否出现商业责任险提醒、增强安全类目适用 ASIN、保单到期日、保险公司、保额、被保险实体、是否要求 AIA。验收方式：输出一张 insurance applicability 表，字段包括 marketplace、legal entity、ASIN/category、是否 enhanced safety、当前保单到期日、是否 AIA、新保单提交路径、缺口和责任人；如后台无提醒，截图留档并在 2026-10-24 复查。\n\n", "title": "商业责任险要求补充账号适用性和中国大陆卖家路径", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-10\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-10\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>商业责任险要求补充账号适用性和中国大陆卖家路径\u003c/h3>\n\u003cul>\n\u003cli>历史事件：amazon-commercial-liability-insurance-enhanced-safety-aia-2026-11-02\u003c/li>\n\u003cli>上次状态：2026-09-17 已记录 Amazon 官方线索，生效日为 2026-11-02，但账号适用范围、增强安全类目和 AIA 路径仍需后台确认。\u003c/li>\n\u003cli>本次新增变化：本次补查到 Amazon 官方域名帮助页/论坛线索仍指向 2026-11-02 节点，重点包括 enhanced safety categories 的商业责任险要求，以及中国大陆卖家新提交保单需通过 Amazon Insurance Accelerator 的路径。来源：\u003ca href=\"https://sellercentral.amazon.com/help/hub/reference/external/GUQ848NB5HZ6M6A4；https://sellercentral.amazon.com.tr/seller-forums/discussions/t/4d4b6fe5-f6c1-4c65-bbe8-584326d76408\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/help/hub/reference/external/GUQ848NB5HZ6M6A4；https://sellercentral.amazon.com.tr/seller-forums/discussions/t/4d4b6fe5-f6c1-4c65-bbe8-584326d76408\u003c/a>\u003c/li>\n\u003cli>相比上次变化：行动从“等待公开口径”调整为“账号侧适用性确认和保险资料预审”。这仍不是 Listing 文案或广告动作，但可能影响账号健康、产品安全类目和未来新增保单提交。\u003c/li>\n\u003cli>变化原因：2026-11-02 生效日进入 30 天内，且索引中的 2026-09-15/2026-09-22 跟进节点已过期，需要把确认责任落到账号后台和保险文件。\u003c/li>\n\u003cli>行动是否需要调整：升级为 P1。合规/财务在 2026-10-17 前进入 Seller Central &gt; Account Health &gt; Manage Your Insurance，逐站确认是否出现商业责任险提醒、增强安全类目适用 ASIN、保单到期日、保险公司、保额、被保险实体、是否要求 AIA。验收方式：输出一张 insurance applicability 表，字段包括 marketplace、legal entity、ASIN/category、是否 enhanced safety、当前保单到期日、是否 AIA、新保单提交路径、缺口和责任人；如后台无提醒，截图留档并在 2026-10-24 复查。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-10-10\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}]}, {"date": "2026-10-09", "text": "`# 亚马逊及海外市场情报增量日报｜2026-10-09\n\n## 今日判断\n\n今天没有需要立即停改 Listing 或冻结广告的 P0 级平台规则，但 Q4 节奏已经从 Prime Big Deal Days 承接切换到 Black Friday/Cyber Monday 准备。最高优先级是 US 站 2026-10-20 前提交黑五网一 Deals，并在 2026-10-14 前完成候选 ASIN、毛利、库存和 Deal Health 预审。供应链侧，EIA 柴油价和 Drewry 运价都在国庆周后回落，但绝对水平仍高，不支持直接放松美国入仓和应急配送成本监控。今天不是本周最后一个中国大陆法定工作日，因 2026-10-10 周六为官方补班，周报顺延到 2026-10-10。\n\n## 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n|---|---|---|---|---|---|\n| P1 | Black Friday/Cyber Monday Deals 提交窗口 2026-10-20 关闭 | US | 促销/Deal/Coupon/库存/PPC/Account Health | Amazon 截止 2026-10-20；内部预审 2026-10-14 | 是，今天开始锁定候选 ASIN 和利润底线 |\n| P2 | Product Opportunity Explorer 与新品 90 天 Launch Plan 增强 | US 优先，多站点观察 | 产品开发/新品上市/Listing/PPC/FBA New Selection | 2026-10-09 发布；部分推荐功能未来数月推出 | 是，仅用于新品池验证，不直接替代人工利润评审 |\n| P2 | EIA 柴油价 2026-10-06 更新：US diesel 降至 USD 6.199/gal | US | 入仓/卡车/3PL/FBM 应急配送/毛利模型 | 数据周 2026-10-05；下次 2026-10-14 | 是，更新未锁价运输和应急配送模型 |\n| P2 | Drewry WCI 2026-10-08 降至 USD 4,351/40ft | US/EU/UK | 海运/到货节点/采购报价/库存覆盖 | 2026-10-08 | 是，逐票复核未锁价美线和欧线报价 |\n| P2 | Amazon Ads Branded Conversations 与 Review Requests 补收录 | US | Sponsored Brands/评论获取/AI Shopping/品牌内容 | Review Requests 2026-11；Branded Conversations 2027-01 | 是，准备合规评论与品牌知识素材，不提前放量 |\n\n## 今日新情报\n\n### Product Opportunity Explorer 增强，并新增 Seller Central 新品 90 天 Launch Plan\n\n- 【影响等级】P2\n- 【站点】US 优先，多站点观察\n- 【发布日期】2026-10-09\n- 【生效日期】部分功能已可在 Opportunity Explorer 使用；个性化机会推送和新品 90 天计划为“未来数月/即将可用”\n- 【信息状态】正式公告\n- 【来源】Amazon Seller Forums / News_Amazon：https://sellercentral.amazon.com/seller-forums/discussions/t/8ff992f0-11df-4daa-8b55-2117ad9b0f0e\n- 发生了什么：Amazon 宣布 Product Opportunity Explorer 支持卖家输入自有产品想法和价格点，用真实购买信号与类目头部产品对比；后续会把产品机会直接推送给卖家，并在新品可售后提供前 90 天 Launch Plan，覆盖 Listing quality、fulfillment、advertising、关键词和 FBA New Selection 激励。\n- 我们怎么看：这对 Self Adhesive Photo Album、Scrapbook Album、School Memory Book、Portfolio Binder 和 Puzzle Accessories 的新品开发有价值，尤其适合验证需求、价格带和功能组合。但 Amazon 的“10 单/30 天”和推荐关键词不是利润指标，不能替代毛利、退货率、广告预算、供应链 MOQ 和差异化判断。\n- 建议动作：产品开发负责人于 2026-10-16 前选 3 个新品方向做 Opportunity Explorer 验证，优先选“毕业季/返校季/婚礼礼品/手工相册/补充页”相关方向。表格字段必须包括产品假设、目标价格、竞品 Top 10 均价、预估评分/评论门槛、主关键词、预估 FBA fee、目标毛利率、预计首批 MOQ、30 天广告预算上限、是否可用 FBA New Selection。验证方式：只有目标毛利率达到公司线、Top 10 差异化卖点明确、首批库存周转风险可控的项目，才进入打样或供应商询价。\n\n## 已有事件的重要更新\n\n### Q4 促销主线从 PBDD 承接切换到 Black Friday/Cyber Monday Deals 提交\n\n- 历史事件：amz-q4-peak-holiday-2026-deadlines\n- 上次状态：2026-09-28 已推送 PBDD 主推 ASIN 池节后复查，要求确认 Deal/Coupon/PED、可售库存、reserved units、FC receiving、兜底促销和广告预算覆盖。\n- 本次新增变化：Amazon Seller Forums / News_Amazon 于 2026-10-09 提醒 Black Friday 和 Cyber Monday Deals 提交窗口将在 2026-10-20 关闭，并要求卖家检查 Account Health Rating、Deal Health、Listing active/quality、payment 和 tax settings。来源：https://sellercentral.amazon.com/seller-forums/discussions/t/d7ae5a95-6af4-42ca-9a06-1360007f155c\n- 相比上次变化：行动重点从 PBDD 活动前库存和广告承接，切换为 BFCM Deal 候选池、利润底线、库存覆盖和 Deal Health 预审；PBDD 数据应作为 BFCM ASIN 选择证据，而不是独立重复复盘。\n- 变化原因：PBDD 已在 2026-10-06 至 2026-10-07 结束，Q4 大促节奏进入 10 月中下旬 BFCM 提交和入仓节点。\n- 行动是否需要调整：升级为 P1。US 运营和 PPC 在 2026-10-14 前完成 BFCM 候选 ASIN 表，字段包括 ASIN、父体、过去 14 天 PBDD/常规销售额、Deal/Coupon/PED 可用状态、最低促销价、Deal fee、广告预算、近 30 天 CVR、ACoS/TACoS、毛利率、FBA 可售库存、reserved units、在途到仓日期、退货率和 Account Health 风险。验收标准：2026-10-14 前完成内部审批，2026-10-20 前在 Deals dashboard 提交，不符合毛利或库存底线的 ASIN 不提交。\n\n### EIA 柴油价连续第二周回落，但 US 物流成本仍处高位\n\n- 历史事件：us-eia-diesel-logistics-cost-signal-2026-09-09\n- 上次状态：2026-09-30 已推送 EIA 2026-09-29 release，US on-highway diesel 为 USD 6.382/gal，较上一周下降 USD 0.147/gal；West Coast 和 California 仍显著高于全国均值。\n- 本次新增变化：EIA 2026-10-06 release 显示 2026-10-05 数据周 US on-highway diesel 为 USD 6.199/gal，较 2026-09-28 的 USD 6.382/gal 再降 USD 0.183/gal；West Coast 为 USD 7.229/gal，California 为 USD 8.082/gal，仍明显高于全国均值。来源：https://www.eia.gov/petroleum/gasdiesel/\n- 相比上次变化：从“高位小幅回落”更新为“连续第二周回落”；但 US diesel 仍较去年同期高 USD 2.488/gal，不能据此下调售价或放松燃油附加费复核。\n- 变化原因：EIA 周度燃油价格回落，但区域价差仍会影响美西提柜、卡车、3PL outbound 和 FBM 应急配送报价。\n- 行动是否需要调整：继续 P2。供应链/财务在 2026-10-14 前更新 US 成本模型，只覆盖未锁价运输单、新 3PL 报价和 FBM 应急方案；已锁价海运/卡车单不追溯调整。验证方式：模型需同时记录 national diesel、PADD5、California、carrier fuel surcharge、drayage quote、3PL outbound quote 和 ASIN landed cost impact。\n\n### Drewry WCI 国庆周后回落，美线仍需逐票比价\n\n- 历史事件：drewry-wci-2026-09-03-4465-stable\n- 上次状态：2026-09-28 已推送 Drewry 2026-09-24 WCI 降至 USD 4,468/40ft，Shanghai-Los Angeles 升至 USD 7,838，Shanghai-New York 为 USD 10,373，要求只对未锁价 Q4 货件做航线级报价验证。\n- 本次新增变化：Drewry 2026-10-08 World Container Index 降 2% 至 USD 4,351/40ft；Shanghai-Los Angeles 降 3% 至 USD 7,624，Shanghai-New York 降 2% 至 USD 10,220；Shanghai-Rotterdam 降 2% 至 USD 3,337，Shanghai-Genoa 持平 USD 3,696。来源：https://www.drewry.co.uk/supply-chain-advisors/world-container-index-weekly-update?topics=Supply+Chain+Advisors\n- 相比上次变化：美线从上行/高位分化变为国庆需求放缓后的回落；亚欧线已连续 13 周下跌，承运商可能在 10 月下半月尝试推高 FAK rates。\n- 变化原因：中国黄金周工厂停工导致出口需求短期放缓，部分航线取消班次，同时苏伊士航线回归增加亚欧运力不确定性。\n- 行动是否需要调整：继续 P2。供应链在 2026-10-14 前逐票复核未锁价 US/EU 货件，不用 WCI 单一均值直接改 landed cost。验收标准：每票 open shipment 必须有当前货代报价、目标到仓日期、Lane、预计库存覆盖天数、可接受 ETA 延误天数和是否需要改发/拆单结论。\n\n### Amazon Ads AI 工具主线补充 Branded Conversations 和 Review Requests\n\n- 历史事件：amazon-ads-agent-dva-plus-2026-09-29\n- 上次状态：2026-09-30 已推送 Amazon Ads Agent / DVA+，判断为受控人工审批 PPC 试点，而不是全账号自动调价。\n- 本次新增变化：本次补查 Amazon Ads 2026-09-29 unBoxed 官方公告，确认 Branded Conversations 将于 2027-01 在美国启动，面向使用 Sponsored Brands collections 的 US endemic advertisers；Review Requests 将于 2026-11 启动，用广告形式向 verified buyers 邀请评论。来源：https://advertising.amazon.com/resources/whats-new/unboxed-2026-branded-conversations；https://advertising.amazon.com/en-ca/library/news/branded-conversations-review-requests\n- 相比上次变化：上次关注的是广告工作流和优化建议；本次新增的是 AI Shopping 对话中的品牌内容入口和付费评论请求工具，影响 Sponsored Brands、Review、品牌内容和新品冷启动，而不只是 bid/budget。\n- 变化原因：Amazon Ads 正把 AI 搜索/对话、评论获取和 Sponsored Brands 连接到广告产品，未来可能影响 CTR、CVR、评论积累速度和品牌搜索承接。\n- 行动是否需要调整：继续 P2。PPC/品牌内容负责人在 2026-10-17 前准备 US 站 Brand Conversation 素材底稿，字段包括品牌差异点、产品适用场景、尺寸/页数/兼容性、礼品场景、常见购买顾虑、与竞品差异、不可使用的夸大声明。同时建立 Review Requests 观察表，只跟踪官方开放入口、计费方式、合规限制、每周新增 review/rating、CVR 和 ACoS，不提前使用非官方催评方式。\n\n## 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n|---|---|---|---|---|---|---|\n| P1 | 建立 BFCM 候选 ASIN 表并完成毛利/库存/Deal Health 预审 | US | US 运营/PPC/财务 | 2026-10-14 | 表格覆盖 ASIN、父体、最低促销价、Deal fee、毛利率、库存覆盖、ACoS/TACoS、Deal Health 和 Account Health 风险 | 2026-10-20 |\n| P1 | 复盘 PBDD 主推 ASIN，筛选可延续到 BFCM 的赢家和需关闭的亏损项 | US/UK/DE/FR/IT/ES | 运营/PPC | 2026-10-13 | 每个主推 ASIN 有 PBDD 销售额、CVR、ACoS、TACoS、库存剩余、退货/差评风险和 BFCM 去留结论 | 2026-10-14 |\n| P2 | 用 Product Opportunity Explorer 验证 3 个新品方向 | US | 产品开发 | 2026-10-16 | 每个方向完成价格带、竞品 Top 10、功能差异、关键词、FBA fee、MOQ、目标毛利和首批库存风险评估 | 2026-10-17 |\n| P2 | 更新 US diesel 和 WCI 到未锁价物流成本模型 | US/EU/UK | 供应链/财务 | 2026-10-14 | 模型记录 EIA USD 6.199/gal、PADD5、California、Drewry WCI、US/EU lane quote 和 landed cost impact | 2026-10-14 |\n| P2 | 准备 Branded Conversations / Review Requests 观察与素材底稿 | US | PPC/品牌内容 | 2026-10-17 | 输出品牌问答素材、Review Requests 观察字段和禁止使用的非合规催评动作清单 | 2026-11-03 |\n| P2 | 复查 BHDR 首次通知后账号侧实际值 | US/UK | US 运营/欧洲运营 | 2026-10-10 | 每站记录 BHDR、低于 90% 的失败订单、承运商/配送模板原因和 2026-10-30 前纠偏动作 | 2026-10-15 |\n\n## 持续关注\n\n- 事项：BFCM Deals 提交。当前状态：Amazon 官方提醒 2026-10-20 关闭提交窗口。下次复查日期：2026-10-14。触发升级条件：候选 ASIN Deal Health 异常、Account Health 警告、FBA 可售库存低于预计活动销量 1.3 倍、或最低促销价低于毛利底线。\n- 事项：US/UK BHDR 90% 要求。当前状态：2026-09-30 首次通知节点已过，需确认账号侧是否收到通知或低于 90%。下次复查日期：2026-10-10。触发升级条件：任一站点 BHDR \u003c 90%、失败订单集中在某承运商/配送模板、或 2026-10-30 前无法改善。\n- 事项：Amazon Ads Branded Conversations / Review Requests。当前状态：Review Requests 预计 2026-11，Branded Conversations 预计 2027-01 US 启动。下次复查日期：2026-11-03。触发升级条件：账号出现入口、Amazon 公布计费/合规规则、或 API 文档开放。\n- 事项：US/EU 物流成本。当前状态：EIA 和 Drewry 均回落但绝对价格仍高。下次复查日期：2026-10-14。触发升级条件：EIA diesel 周涨跌超过 USD 0.20/gal、Drewry 美线或欧线单周变动超过 5%、或货代报价与指数方向背离。\n- 事项：EU Customs Reform 小包 handling fee。当前状态：2026-11-01 前引入，金额待 delegated act。下次复查日期：2026-10-15。触发升级条件：欧盟公布 fee 金额、货代报价新增该费用、或 DE/FR/IT/ES 清关资料字段被退回。\n- 事项：Product Bundling 2027-01-11。当前状态：内部 bundle/kit/set/multipack/refill-page 风险清单需继续推进。下次复查日期：2026-10-15。触发升级条件：Account Health 出现风险提醒、Seller Central 帮助页新增解释、或 refill pages / set / kit 结构被标记。\n\n## 情报边界与可信度\n\n本次窗口覆盖 2026-09-30 10:33:56 至 2026-10-09 09:03:23（Asia/Shanghai），并补查长期索引中 PBDD/Q4、BHDR、UK EPR、Amazon Ads AI、Product Bundling、EIA、Drewry、EU Customs Reform、USTR/White House 30-for-30 等持续关注事项。复查来源约 29 个，其中官方/监管/一手来源 20 个，非官方或行业辅助来源 9 个；纳入日报的新事件 1 条，已有事件实质更新 4 条，仍待确认事项 8 条。\n\n官方/一手来源包括中国政府网/国务院办公厅 2026 节假日安排、Amazon Seller Forums / News_Amazon、Amazon Ads 官方页面、EIA、Drewry、USTR、White House、CBP、European Commission、USPS/Postal Explorer、CPSC 和 GOV.UK OPSS。非官方来源仅用于发现线索和排重，未作为单独执行依据。\n\n今天排除了重复的 Prime Big Deal Days 零售宣传、Amazon Accelerate/unBoxed 参会内容、无后台规则变化的 Seller Central UI 评论、与相册/纸品/礼品/收纳/拼图配件产品线无直接关系的 CPSC/OPSS 召回、AWS 企业客户案例、以及没有 USTR/CBP/European Commission/Amazon 官方确认的新关税传闻。工作日门禁来源：中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（国办发明电〔2025〕7号，https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/2025/issue_12406/202511/content_7048922.html）。文件显示 2026 年国庆节为 2026-10-01 至 2026-10-07 放假，2026-09-20 和 2026-10-10 上班；因此 2026-10-09 为大陆法定工作日，但不是本周最后一个大陆法定工作日。\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site`", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-09\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-09\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003cp>`# 亚马逊及海外市场情报增量日报｜2026-10-09\u003c/p>\n\u003ch2>今日判断\u003c/h2>\n\u003cp>今天没有需要立即停改 Listing 或冻结广告的 P0 级平台规则，但 Q4 节奏已经从 Prime Big Deal Days 承接切换到 Black Friday/Cyber Monday 准备。最高优先级是 US 站 2026-10-20 前提交黑五网一 Deals，并在 2026-10-14 前完成候选 ASIN、毛利、库存和 Deal Health 预审。供应链侧，EIA 柴油价和 Drewry 运价都在国庆周后回落，但绝对水平仍高，不支持直接放松美国入仓和应急配送成本监控。今天不是本周最后一个中国大陆法定工作日，因 2026-10-10 周六为官方补班，周报顺延到 2026-10-10。\u003c/p>\n\u003ch2>优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>影响站点\u003c/th>\n\u003cth>影响模块\u003c/th>\n\u003cth>截止/生效日期\u003c/th>\n\u003cth>今天是否需要动作\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>Black Friday/Cyber Monday Deals 提交窗口 2026-10-20 关闭\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>促销/Deal/Coupon/库存/PPC/Account Health\u003c/td>\n\u003ctd>Amazon 截止 2026-10-20；内部预审 2026-10-14\u003c/td>\n\u003ctd>是，今天开始锁定候选 ASIN 和利润底线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Product Opportunity Explorer 与新品 90 天 Launch Plan 增强\u003c/td>\n\u003ctd>US 优先，多站点观察\u003c/td>\n\u003ctd>产品开发/新品上市/Listing/PPC/FBA New Selection\u003c/td>\n\u003ctd>2026-10-09 发布；部分推荐功能未来数月推出\u003c/td>\n\u003ctd>是，仅用于新品池验证，不直接替代人工利润评审\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>EIA 柴油价 2026-10-06 更新：US diesel 降至 USD 6.199/gal\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>入仓/卡车/3PL/FBM 应急配送/毛利模型\u003c/td>\n\u003ctd>数据周 2026-10-05；下次 2026-10-14\u003c/td>\n\u003ctd>是，更新未锁价运输和应急配送模型\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Drewry WCI 2026-10-08 降至 USD 4,351/40ft\u003c/td>\n\u003ctd>US/EU/UK\u003c/td>\n\u003ctd>海运/到货节点/采购报价/库存覆盖\u003c/td>\n\u003ctd>2026-10-08\u003c/td>\n\u003ctd>是，逐票复核未锁价美线和欧线报价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Amazon Ads Branded Conversations 与 Review Requests 补收录\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Sponsored Brands/评论获取/AI Shopping/品牌内容\u003c/td>\n\u003ctd>Review Requests 2026-11；Branded Conversations 2027-01\u003c/td>\n\u003ctd>是，准备合规评论与品牌知识素材，不提前放量\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>今日新情报\u003c/h2>\n\u003ch3>Product Opportunity Explorer 增强，并新增 Seller Central 新品 90 天 Launch Plan\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】US 优先，多站点观察\u003c/li>\n\u003cli>【发布日期】2026-10-09\u003c/li>\n\u003cli>【生效日期】部分功能已可在 Opportunity Explorer 使用；个性化机会推送和新品 90 天计划为“未来数月/即将可用”\u003c/li>\n\u003cli>【信息状态】正式公告\u003c/li>\n\u003cli>【来源】Amazon Seller Forums / News_Amazon：\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/8ff992f0-11df-4daa-8b55-2117ad9b0f0e\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/seller-forums/discussions/t/8ff992f0-11df-4daa-8b55-2117ad9b0f0e\u003c/a>\u003c/li>\n\u003cli>发生了什么：Amazon 宣布 Product Opportunity Explorer 支持卖家输入自有产品想法和价格点，用真实购买信号与类目头部产品对比；后续会把产品机会直接推送给卖家，并在新品可售后提供前 90 天 Launch Plan，覆盖 Listing quality、fulfillment、advertising、关键词和 FBA New Selection 激励。\u003c/li>\n\u003cli>我们怎么看：这对 Self Adhesive Photo Album、Scrapbook Album、School Memory Book、Portfolio Binder 和 Puzzle Accessories 的新品开发有价值，尤其适合验证需求、价格带和功能组合。但 Amazon 的“10 单/30 天”和推荐关键词不是利润指标，不能替代毛利、退货率、广告预算、供应链 MOQ 和差异化判断。\u003c/li>\n\u003cli>建议动作：产品开发负责人于 2026-10-16 前选 3 个新品方向做 Opportunity Explorer 验证，优先选“毕业季/返校季/婚礼礼品/手工相册/补充页”相关方向。表格字段必须包括产品假设、目标价格、竞品 Top 10 均价、预估评分/评论门槛、主关键词、预估 FBA fee、目标毛利率、预计首批 MOQ、30 天广告预算上限、是否可用 FBA New Selection。验证方式：只有目标毛利率达到公司线、Top 10 差异化卖点明确、首批库存周转风险可控的项目，才进入打样或供应商询价。\u003c/li>\n\u003c/ul>\n\u003ch2>已有事件的重要更新\u003c/h2>\n\u003ch3>Q4 促销主线从 PBDD 承接切换到 Black Friday/Cyber Monday Deals 提交\u003c/h3>\n\u003cul>\n\u003cli>历史事件：amz-q4-peak-holiday-2026-deadlines\u003c/li>\n\u003cli>上次状态：2026-09-28 已推送 PBDD 主推 ASIN 池节后复查，要求确认 Deal/Coupon/PED、可售库存、reserved units、FC receiving、兜底促销和广告预算覆盖。\u003c/li>\n\u003cli>本次新增变化：Amazon Seller Forums / News_Amazon 于 2026-10-09 提醒 Black Friday 和 Cyber Monday Deals 提交窗口将在 2026-10-20 关闭，并要求卖家检查 Account Health Rating、Deal Health、Listing active/quality、payment 和 tax settings。来源：\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/d7ae5a95-6af4-42ca-9a06-1360007f155c\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/seller-forums/discussions/t/d7ae5a95-6af4-42ca-9a06-1360007f155c\u003c/a>\u003c/li>\n\u003cli>相比上次变化：行动重点从 PBDD 活动前库存和广告承接，切换为 BFCM Deal 候选池、利润底线、库存覆盖和 Deal Health 预审；PBDD 数据应作为 BFCM ASIN 选择证据，而不是独立重复复盘。\u003c/li>\n\u003cli>变化原因：PBDD 已在 2026-10-06 至 2026-10-07 结束，Q4 大促节奏进入 10 月中下旬 BFCM 提交和入仓节点。\u003c/li>\n\u003cli>行动是否需要调整：升级为 P1。US 运营和 PPC 在 2026-10-14 前完成 BFCM 候选 ASIN 表，字段包括 ASIN、父体、过去 14 天 PBDD/常规销售额、Deal/Coupon/PED 可用状态、最低促销价、Deal fee、广告预算、近 30 天 CVR、ACoS/TACoS、毛利率、FBA 可售库存、reserved units、在途到仓日期、退货率和 Account Health 风险。验收标准：2026-10-14 前完成内部审批，2026-10-20 前在 Deals dashboard 提交，不符合毛利或库存底线的 ASIN 不提交。\u003c/li>\n\u003c/ul>\n\u003ch3>EIA 柴油价连续第二周回落，但 US 物流成本仍处高位\u003c/h3>\n\u003cul>\n\u003cli>历史事件：us-eia-diesel-logistics-cost-signal-2026-09-09\u003c/li>\n\u003cli>上次状态：2026-09-30 已推送 EIA 2026-09-29 release，US on-highway diesel 为 USD 6.382/gal，较上一周下降 USD 0.147/gal；West Coast 和 California 仍显著高于全国均值。\u003c/li>\n\u003cli>本次新增变化：EIA 2026-10-06 release 显示 2026-10-05 数据周 US on-highway diesel 为 USD 6.199/gal，较 2026-09-28 的 USD 6.382/gal 再降 USD 0.183/gal；West Coast 为 USD 7.229/gal，California 为 USD 8.082/gal，仍明显高于全国均值。来源：\u003ca href=\"https://www.eia.gov/petroleum/gasdiesel/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.eia.gov/petroleum/gasdiesel/\u003c/a>\u003c/li>\n\u003cli>相比上次变化：从“高位小幅回落”更新为“连续第二周回落”；但 US diesel 仍较去年同期高 USD 2.488/gal，不能据此下调售价或放松燃油附加费复核。\u003c/li>\n\u003cli>变化原因：EIA 周度燃油价格回落，但区域价差仍会影响美西提柜、卡车、3PL outbound 和 FBM 应急配送报价。\u003c/li>\n\u003cli>行动是否需要调整：继续 P2。供应链/财务在 2026-10-14 前更新 US 成本模型，只覆盖未锁价运输单、新 3PL 报价和 FBM 应急方案；已锁价海运/卡车单不追溯调整。验证方式：模型需同时记录 national diesel、PADD5、California、carrier fuel surcharge、drayage quote、3PL outbound quote 和 ASIN landed cost impact。\u003c/li>\n\u003c/ul>\n\u003ch3>Drewry WCI 国庆周后回落，美线仍需逐票比价\u003c/h3>\n\u003cul>\n\u003cli>历史事件：drewry-wci-2026-09-03-4465-stable\u003c/li>\n\u003cli>上次状态：2026-09-28 已推送 Drewry 2026-09-24 WCI 降至 USD 4,468/40ft，Shanghai-Los Angeles 升至 USD 7,838，Shanghai-New York 为 USD 10,373，要求只对未锁价 Q4 货件做航线级报价验证。\u003c/li>\n\u003cli>本次新增变化：Drewry 2026-10-08 World Container Index 降 2% 至 USD 4,351/40ft；Shanghai-Los Angeles 降 3% 至 USD 7,624，Shanghai-New York 降 2% 至 USD 10,220；Shanghai-Rotterdam 降 2% 至 USD 3,337，Shanghai-Genoa 持平 USD 3,696。来源：\u003ca href=\"https://www.drewry.co.uk/supply-chain-advisors/world-container-index-weekly-update?topics=Supply+Chain+Advisors\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.drewry.co.uk/supply-chain-advisors/world-container-index-weekly-update?topics=Supply+Chain+Advisors\u003c/a>\u003c/li>\n\u003cli>相比上次变化：美线从上行/高位分化变为国庆需求放缓后的回落；亚欧线已连续 13 周下跌，承运商可能在 10 月下半月尝试推高 FAK rates。\u003c/li>\n\u003cli>变化原因：中国黄金周工厂停工导致出口需求短期放缓，部分航线取消班次，同时苏伊士航线回归增加亚欧运力不确定性。\u003c/li>\n\u003cli>行动是否需要调整：继续 P2。供应链在 2026-10-14 前逐票复核未锁价 US/EU 货件，不用 WCI 单一均值直接改 landed cost。验收标准：每票 open shipment 必须有当前货代报价、目标到仓日期、Lane、预计库存覆盖天数、可接受 ETA 延误天数和是否需要改发/拆单结论。\u003c/li>\n\u003c/ul>\n\u003ch3>Amazon Ads AI 工具主线补充 Branded Conversations 和 Review Requests\u003c/h3>\n\u003cul>\n\u003cli>历史事件：amazon-ads-agent-dva-plus-2026-09-29\u003c/li>\n\u003cli>上次状态：2026-09-30 已推送 Amazon Ads Agent / DVA+，判断为受控人工审批 PPC 试点，而不是全账号自动调价。\u003c/li>\n\u003cli>本次新增变化：本次补查 Amazon Ads 2026-09-29 unBoxed 官方公告，确认 Branded Conversations 将于 2027-01 在美国启动，面向使用 Sponsored Brands collections 的 US endemic advertisers；Review Requests 将于 2026-11 启动，用广告形式向 verified buyers 邀请评论。来源：\u003ca href=\"https://advertising.amazon.com/resources/whats-new/unboxed-2026-branded-conversations；https://advertising.amazon.com/en-ca/library/news/branded-conversations-review-requests\" target=\"_blank\" rel=\"noopener noreferrer\">https://advertising.amazon.com/resources/whats-new/unboxed-2026-branded-conversations；https://advertising.amazon.com/en-ca/library/news/branded-conversations-review-requests\u003c/a>\u003c/li>\n\u003cli>相比上次变化：上次关注的是广告工作流和优化建议；本次新增的是 AI Shopping 对话中的品牌内容入口和付费评论请求工具，影响 Sponsored Brands、Review、品牌内容和新品冷启动，而不只是 bid/budget。\u003c/li>\n\u003cli>变化原因：Amazon Ads 正把 AI 搜索/对话、评论获取和 Sponsored Brands 连接到广告产品，未来可能影响 CTR、CVR、评论积累速度和品牌搜索承接。\u003c/li>\n\u003cli>行动是否需要调整：继续 P2。PPC/品牌内容负责人在 2026-10-17 前准备 US 站 Brand Conversation 素材底稿，字段包括品牌差异点、产品适用场景、尺寸/页数/兼容性、礼品场景、常见购买顾虑、与竞品差异、不可使用的夸大声明。同时建立 Review Requests 观察表，只跟踪官方开放入口、计费方式、合规限制、每周新增 review/rating、CVR 和 ACoS，不提前使用非官方催评方式。\u003c/li>\n\u003c/ul>\n\u003ch2>今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>建立 BFCM 候选 ASIN 表并完成毛利/库存/Deal Health 预审\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>US 运营/PPC/财务\u003c/td>\n\u003ctd>2026-10-14\u003c/td>\n\u003ctd>表格覆盖 ASIN、父体、最低促销价、Deal fee、毛利率、库存覆盖、ACoS/TACoS、Deal Health 和 Account Health 风险\u003c/td>\n\u003ctd>2026-10-20\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>复盘 PBDD 主推 ASIN，筛选可延续到 BFCM 的赢家和需关闭的亏损项\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES\u003c/td>\n\u003ctd>运营/PPC\u003c/td>\n\u003ctd>2026-10-13\u003c/td>\n\u003ctd>每个主推 ASIN 有 PBDD 销售额、CVR、ACoS、TACoS、库存剩余、退货/差评风险和 BFCM 去留结论\u003c/td>\n\u003ctd>2026-10-14\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>用 Product Opportunity Explorer 验证 3 个新品方向\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>产品开发\u003c/td>\n\u003ctd>2026-10-16\u003c/td>\n\u003ctd>每个方向完成价格带、竞品 Top 10、功能差异、关键词、FBA fee、MOQ、目标毛利和首批库存风险评估\u003c/td>\n\u003ctd>2026-10-17\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>更新 US diesel 和 WCI 到未锁价物流成本模型\u003c/td>\n\u003ctd>US/EU/UK\u003c/td>\n\u003ctd>供应链/财务\u003c/td>\n\u003ctd>2026-10-14\u003c/td>\n\u003ctd>模型记录 EIA USD 6.199/gal、PADD5、California、Drewry WCI、US/EU lane quote 和 landed cost impact\u003c/td>\n\u003ctd>2026-10-14\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>准备 Branded Conversations / Review Requests 观察与素材底稿\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>PPC/品牌内容\u003c/td>\n\u003ctd>2026-10-17\u003c/td>\n\u003ctd>输出品牌问答素材、Review Requests 观察字段和禁止使用的非合规催评动作清单\u003c/td>\n\u003ctd>2026-11-03\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>复查 BHDR 首次通知后账号侧实际值\u003c/td>\n\u003ctd>US/UK\u003c/td>\n\u003ctd>US 运营/欧洲运营\u003c/td>\n\u003ctd>2026-10-10\u003c/td>\n\u003ctd>每站记录 BHDR、低于 90% 的失败订单、承运商/配送模板原因和 2026-10-30 前纠偏动作\u003c/td>\n\u003ctd>2026-10-15\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>持续关注\u003c/h2>\n\u003cul>\n\u003cli>事项：BFCM Deals 提交。当前状态：Amazon 官方提醒 2026-10-20 关闭提交窗口。下次复查日期：2026-10-14。触发升级条件：候选 ASIN Deal Health 异常、Account Health 警告、FBA 可售库存低于预计活动销量 1.3 倍、或最低促销价低于毛利底线。\u003c/li>\n\u003cli>事项：US/UK BHDR 90% 要求。当前状态：2026-09-30 首次通知节点已过，需确认账号侧是否收到通知或低于 90%。下次复查日期：2026-10-10。触发升级条件：任一站点 BHDR &lt; 90%、失败订单集中在某承运商/配送模板、或 2026-10-30 前无法改善。\u003c/li>\n\u003cli>事项：Amazon Ads Branded Conversations / Review Requests。当前状态：Review Requests 预计 2026-11，Branded Conversations 预计 2027-01 US 启动。下次复查日期：2026-11-03。触发升级条件：账号出现入口、Amazon 公布计费/合规规则、或 API 文档开放。\u003c/li>\n\u003cli>事项：US/EU 物流成本。当前状态：EIA 和 Drewry 均回落但绝对价格仍高。下次复查日期：2026-10-14。触发升级条件：EIA diesel 周涨跌超过 USD 0.20/gal、Drewry 美线或欧线单周变动超过 5%、或货代报价与指数方向背离。\u003c/li>\n\u003cli>事项：EU Customs Reform 小包 handling fee。当前状态：2026-11-01 前引入，金额待 delegated act。下次复查日期：2026-10-15。触发升级条件：欧盟公布 fee 金额、货代报价新增该费用、或 DE/FR/IT/ES 清关资料字段被退回。\u003c/li>\n\u003cli>事项：Product Bundling 2027-01-11。当前状态：内部 bundle/kit/set/multipack/refill-page 风险清单需继续推进。下次复查日期：2026-10-15。触发升级条件：Account Health 出现风险提醒、Seller Central 帮助页新增解释、或 refill pages / set / kit 结构被标记。\u003c/li>\n\u003c/ul>\n\u003ch2>情报边界与可信度\u003c/h2>\n\u003cp>本次窗口覆盖 2026-09-30 10:33:56 至 2026-10-09 09:03:23（Asia/Shanghai），并补查长期索引中 PBDD/Q4、BHDR、UK EPR、Amazon Ads AI、Product Bundling、EIA、Drewry、EU Customs Reform、USTR/White House 30-for-30 等持续关注事项。复查来源约 29 个，其中官方/监管/一手来源 20 个，非官方或行业辅助来源 9 个；纳入日报的新事件 1 条，已有事件实质更新 4 条，仍待确认事项 8 条。\u003c/p>\n\u003cp>官方/一手来源包括中国政府网/国务院办公厅 2026 节假日安排、Amazon Seller Forums / News_Amazon、Amazon Ads 官方页面、EIA、Drewry、USTR、White House、CBP、European Commission、USPS/Postal Explorer、CPSC 和 GOV.UK OPSS。非官方来源仅用于发现线索和排重，未作为单独执行依据。\u003c/p>\n\u003cp>今天排除了重复的 Prime Big Deal Days 零售宣传、Amazon Accelerate/unBoxed 参会内容、无后台规则变化的 Seller Central UI 评论、与相册/纸品/礼品/收纳/拼图配件产品线无直接关系的 CPSC/OPSS 召回、AWS 企业客户案例、以及没有 USTR/CBP/European Commission/Amazon 官方确认的新关税传闻。工作日门禁来源：中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（国办发明电〔2025〕7号，\u003ca href=\"https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/2025/issue_12406/202511/content_7048922.html）。文件显示\" target=\"_blank\" rel=\"noopener noreferrer\">https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/2025/issue_12406/202511/content_7048922.html）。文件显示\u003c/a> 2026 年国庆节为 2026-10-01 至 2026-10-07 放假，2026-09-20 和 2026-10-10 上班；因此 2026-10-09 为大陆法定工作日，但不是本周最后一个大陆法定工作日。\u003c/p>\n\u003cp>生产链接：\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003ccode>\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003c/code>\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-10-09\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-10-09", "text": "### Product Opportunity Explorer 增强，并新增 Seller Central 新品 90 天 Launch Plan\n\n- 【影响等级】P2\n- 【站点】US 优先，多站点观察\n- 【发布日期】2026-10-09\n- 【生效日期】部分功能已可在 Opportunity Explorer 使用；个性化机会推送和新品 90 天计划为“未来数月/即将可用”\n- 【信息状态】正式公告\n- 【来源】Amazon Seller Forums / News_Amazon：https://sellercentral.amazon.com/seller-forums/discussions/t/8ff992f0-11df-4daa-8b55-2117ad9b0f0e\n- 发生了什么：Amazon 宣布 Product Opportunity Explorer 支持卖家输入自有产品想法和价格点，用真实购买信号与类目头部产品对比；后续会把产品机会直接推送给卖家，并在新品可售后提供前 90 天 Launch Plan，覆盖 Listing quality、fulfillment、advertising、关键词和 FBA New Selection 激励。\n- 我们怎么看：这对 Self Adhesive Photo Album、Scrapbook Album、School Memory Book、Portfolio Binder 和 Puzzle Accessories 的新品开发有价值，尤其适合验证需求、价格带和功能组合。但 Amazon 的“10 单/30 天”和推荐关键词不是利润指标，不能替代毛利、退货率、广告预算、供应链 MOQ 和差异化判断。\n- 建议动作：产品开发负责人于 2026-10-16 前选 3 个新品方向做 Opportunity Explorer 验证，优先选“毕业季/返校季/婚礼礼品/手工相册/补充页”相关方向。表格字段必须包括产品假设、目标价格、竞品 Top 10 均价、预估评分/评论门槛、主关键词、预估 FBA fee、目标毛利率、预计首批 MOQ、30 天广告预算上限、是否可用 FBA New Selection。验证方式：只有目标毛利率达到公司线、Top 10 差异化卖点明确、首批库存周转风险可控的项目，才进入打样或供应商询价。\n\n", "title": "Product Opportunity Explorer 增强，并新增 Seller Central 新品 90 天 Launch Plan", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-09\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-09\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>Product Opportunity Explorer 增强，并新增 Seller Central 新品 90 天 Launch Plan\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】US 优先，多站点观察\u003c/li>\n\u003cli>【发布日期】2026-10-09\u003c/li>\n\u003cli>【生效日期】部分功能已可在 Opportunity Explorer 使用；个性化机会推送和新品 90 天计划为“未来数月/即将可用”\u003c/li>\n\u003cli>【信息状态】正式公告\u003c/li>\n\u003cli>【来源】Amazon Seller Forums / News_Amazon：\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/8ff992f0-11df-4daa-8b55-2117ad9b0f0e\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/seller-forums/discussions/t/8ff992f0-11df-4daa-8b55-2117ad9b0f0e\u003c/a>\u003c/li>\n\u003cli>发生了什么：Amazon 宣布 Product Opportunity Explorer 支持卖家输入自有产品想法和价格点，用真实购买信号与类目头部产品对比；后续会把产品机会直接推送给卖家，并在新品可售后提供前 90 天 Launch Plan，覆盖 Listing quality、fulfillment、advertising、关键词和 FBA New Selection 激励。\u003c/li>\n\u003cli>我们怎么看：这对 Self Adhesive Photo Album、Scrapbook Album、School Memory Book、Portfolio Binder 和 Puzzle Accessories 的新品开发有价值，尤其适合验证需求、价格带和功能组合。但 Amazon 的“10 单/30 天”和推荐关键词不是利润指标，不能替代毛利、退货率、广告预算、供应链 MOQ 和差异化判断。\u003c/li>\n\u003cli>建议动作：产品开发负责人于 2026-10-16 前选 3 个新品方向做 Opportunity Explorer 验证，优先选“毕业季/返校季/婚礼礼品/手工相册/补充页”相关方向。表格字段必须包括产品假设、目标价格、竞品 Top 10 均价、预估评分/评论门槛、主关键词、预估 FBA fee、目标毛利率、预计首批 MOQ、30 天广告预算上限、是否可用 FBA New Selection。验证方式：只有目标毛利率达到公司线、Top 10 差异化卖点明确、首批库存周转风险可控的项目，才进入打样或供应商询价。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-10-09\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-10-09", "text": "### Q4 促销主线从 PBDD 承接切换到 Black Friday/Cyber Monday Deals 提交\n\n- 历史事件：amz-q4-peak-holiday-2026-deadlines\n- 上次状态：2026-09-28 已推送 PBDD 主推 ASIN 池节后复查，要求确认 Deal/Coupon/PED、可售库存、reserved units、FC receiving、兜底促销和广告预算覆盖。\n- 本次新增变化：Amazon Seller Forums / News_Amazon 于 2026-10-09 提醒 Black Friday 和 Cyber Monday Deals 提交窗口将在 2026-10-20 关闭，并要求卖家检查 Account Health Rating、Deal Health、Listing active/quality、payment 和 tax settings。来源：https://sellercentral.amazon.com/seller-forums/discussions/t/d7ae5a95-6af4-42ca-9a06-1360007f155c\n- 相比上次变化：行动重点从 PBDD 活动前库存和广告承接，切换为 BFCM Deal 候选池、利润底线、库存覆盖和 Deal Health 预审；PBDD 数据应作为 BFCM ASIN 选择证据，而不是独立重复复盘。\n- 变化原因：PBDD 已在 2026-10-06 至 2026-10-07 结束，Q4 大促节奏进入 10 月中下旬 BFCM 提交和入仓节点。\n- 行动是否需要调整：升级为 P1。US 运营和 PPC 在 2026-10-14 前完成 BFCM 候选 ASIN 表，字段包括 ASIN、父体、过去 14 天 PBDD/常规销售额、Deal/Coupon/PED 可用状态、最低促销价、Deal fee、广告预算、近 30 天 CVR、ACoS/TACoS、毛利率、FBA 可售库存、reserved units、在途到仓日期、退货率和 Account Health 风险。验收标准：2026-10-14 前完成内部审批，2026-10-20 前在 Deals dashboard 提交，不符合毛利或库存底线的 ASIN 不提交。\n\n", "title": "Q4 促销主线从 PBDD 承接切换到 Black Friday/Cyber Monday Deals 提交", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-10-09\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-10-09\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-
