amazon.co.uk/seller-forums/discussions/t/61296686-3581-4d1a-b3c2-dacbef755b22\u003c/a>\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-03\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-03", "text": "### US Q4 入仓主线从 AWD 截止切换到 FBA minimal splits\n\n- 历史事件：amz-q4-peak-holiday-2026-deadlines\n- 上次状态：2026-09-02 已按 P0 提醒 Prime Big Deal Days AWD 到仓截止。\n- 本次新增变化：AWD 到仓日已过去，下一运营节点切换为 2026-09-09 FBA shipments with minimal shipment splits；2026-09-16 为 Amazon-optimized shipment splits 到仓节点。\n- 变化原因：Prime Big Deal Days 前的不同入仓方式截止日逐步到达，逾期会影响 Prime-badge eligibility 和活动期可售库存。\n- 行动是否需要调整：从 P0 降为 P1 持续跟踪。供应链在 2026-09-05 前更新促销 ASIN 入仓表，字段包含 Shipment ID、split option、预计到仓日、FC receiving 状态、可售库存、活动需求量和备选履约方案。\n- 来源：https://sellercentral.amazon.com/seller-forums/discussions/t/3e31fbb7-04e0-4ed4-873e-f74b1052e2ff\n\n", "title": "US Q4 入仓主线从 AWD 截止切换到 FBA minimal splits", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-03\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-03\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>US Q4 入仓主线从 AWD 截止切换到 FBA minimal splits\u003c/h3>\n\u003cul>\n\u003cli>历史事件：amz-q4-peak-holiday-2026-deadlines\u003c/li>\n\u003cli>上次状态：2026-09-02 已按 P0 提醒 Prime Big Deal Days AWD 到仓截止。\u003c/li>\n\u003cli>本次新增变化：AWD 到仓日已过去，下一运营节点切换为 2026-09-09 FBA shipments with minimal shipment splits；2026-09-16 为 Amazon-optimized shipment splits 到仓节点。\u003c/li>\n\u003cli>变化原因：Prime Big Deal Days 前的不同入仓方式截止日逐步到达，逾期会影响 Prime-badge eligibility 和活动期可售库存。\u003c/li>\n\u003cli>行动是否需要调整：从 P0 降为 P1 持续跟踪。供应链在 2026-09-05 前更新促销 ASIN 入仓表，字段包含 Shipment ID、split option、预计到仓日、FC receiving 状态、可售库存、活动需求量和备选履约方案。\u003c/li>\n\u003cli>来源：\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/3e31fbb7-04e0-4ed4-873e-f74b1052e2ff\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/seller-forums/discussions/t/3e31fbb7-04e0-4ed4-873e-f74b1052e2ff\u003c/a>\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-03\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}]}, {"date": "2026-09-01", "text": "# 亚马逊及海外市场情报增量日报｜2026-09-01\n\n面向 Amazon 运营团队｜Asia/Shanghai｜预计阅读 4-5 分钟\n\n## 今日判断\n\n今日没有形成单一重大主线，但 Amazon 官方在 FBM 风险处理、B2B 促销工具、数量变体表达上均有可执行变化。对相册、补充页、学校记忆册和拼图配件业务，最该优先处理的是：确认 US/UK/DE 是否存在 FBM 或 Amazon Business 订单、筛查多件装/套装 Listing 的字段一致性、建立广告 CPC/ROAS 异常审计。FTC 对 Amazon Sponsored Ads 的诉讼属于高关注战略信号，但不是后台规则变更，短期不建议机械停投或大幅降预算。今天不是本周最后一个中国大陆法定工作日，不生成周报。\n\n## 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 业务影响 | 今天怎么做 |\n|---|---|---|---|---|\n| P0 | FBM 风险处理与 AHT/BHDR 执行窗口 | US/UK/DE | Offer 停用、配送绩效、Account Health | 先确认是否有 FBM/SFP/Amazon Business 订单；无则关闭，有则查 SKU 级指标 |\n| P1 | Amazon Business Deals 开放 | US/CA/UK/DE/FR/IT/ES/JP/MX/AU | B2B 流量、价格、利润率 | 只对企业客户需求强、毛利足够的 ASIN 做小范围测试 |\n| P1 | Total Product Quantity 变体主题 | US | Listing 数据质量、CVR、变体结构 | 筛查 refill pages、pack、set、bundle 类商品是否适合标准化件数表达 |\n| P1 | Sponsored Ads 诉讼与广告成本审计 | US 为主 | CPC、ACoS、TACoS、净利润 | 用 30/60/90 天报表定位 CPC 上升但 CVR/ROAS 未改善的投放对象 |\n| P1 | US Product Bundling policy 临近生效 | US | Listing 合规、套装 ASIN 风险 | 2026-09-05 前完成 bundle/multipack 风险清单 |\n\n## 今日新情报\n\n### 1. FBM 风险处理收缩到具体 Offer，但单品停用风险更直接\n\n**覆盖站点**：US（官方确认）  \n**影响等级**：P0/P1，取决于是否有 FBM/SFP 订单  \n**信息状态**：Amazon Seller Forums 官方公告  \n**发布日期**：2026-08-31  \n**生效日期**：2026-08-31\n\n**发生了什么（事实）**  \nAmazon 从 2026-08-31 起调整 US 站 FBM 政策违规处理方式。当某个 Offer 因取消率、迟发率、订单缺陷率或准时送达率使 Account Health 面临风险时，平台会临时停用该 Offer，而不是让其他正常 Listing 和整体账号状态一并受影响。停用前会发送警告邮件，恢复入口位于 Account Health 的 Other Policy Violations。\n\n**我们怎么看（经营解读）**  \n这不是绩效标准放宽，而是风险处理粒度变化：从账号级影响转向更具体的 Offer 级处理。好处是正常商品可能被保护；风险是低订单量 FBM 商品更容易因少量异常订单触发单品停用。对以 FBA 为主的相册类业务，直接影响可能较低，但只要有 US FBM 备用 offer、定制类订单或大件/低价商品自配送，就需要今天核查。\n\n**建议动作**  \n2026-09-01 当天导出 US FBM/SFP SKU 清单，检查近 30 天 cancellation rate、late shipment rate、ODR、OTDR。若存在低销量 FBM offer，把高风险 SKU 改为 FBA 或延长 handling time，并保留承运商异常证据。\n\n**来源**  \n[Amazon US Seller Forums - News_Amazon](https://sellercentral.amazon.com/seller-forums/discussions/t/7d5f264e-d83e-4557-9557-3999722b7e23)\n\n### 2. Amazon Business Deals 开放，适合做 B2B 限时折扣测试\n\n**覆盖站点**：US、CA、UK、DE、FR、IT、ES、JP、MX、AU  \n**影响等级**：P1  \n**信息状态**：Amazon Seller Forums 官方公告  \n**发布日期**：2026-08-31  \n**功能开放日期**：2026-08-31\n\n**发生了什么（事实）**  \nAmazon Business Deals 已开放，可针对企业买家设置 1 小时至 30 天的固定价或百分比折扣。普通 Deal 最低折扣为 10%；Prime Big Deal Days、Black Friday、Cyber Monday 等活动期最低折扣为 15%。符合条件的活动 Deal 在 2026-12-31 前可能获得额外邮件或推送展示。\n\n**我们怎么看（经营解读）**  \n这个工具把长期 Business Price 和短期 B2B 促销分开，有利于测试学校、办公室、活动采购、礼品采购等企业买家需求。但“可能获得额外展示”不是流量保证。对相册和学校记忆册类产品，建议先选择客单价较高、复购/批量购买可能性较强、毛利可承受 10%-15% 折扣的 ASIN 测试。\n\n**建议动作**  \n2026-09-04 前筛选 US/UK/DE/FR/IT/ES 已设置 Business Price 且评分、库存、毛利达标的 10-20 个 ASIN，测算折后贡献利润率。活动前后追踪 B2B 订单数、Business CVR、广告辅助销售额和 TACoS，不只看 Deal 销售额。\n\n**来源**  \n[Amazon UK Seller Forums - Amazon Business Deals](https://sellercentral.amazon.co.uk/seller-forums/discussions/t/de3d4860-4395-4496-b5f0-8249e31a5a11)\n\n### 3. Total Product Quantity 变体主题标准化件数表达\n\n**覆盖站点**：US（官方确认）  \n**影响等级**：P1  \n**信息状态**：Amazon Seller Forums 官方公告  \n**发布日期**：2026-08-29  \n**当前状态**：已开放，现阶段为可选结构\n\n**发生了什么（事实）**  \nAmazon 新增 Total Product Quantity 变体主题，用 “X count” 或 “X count（Y packs of Z）” 统一显示商品总件数，并把 Unit Count 与 Number of Packs 从尺寸、颜色等属性中分离。公告称当前覆盖 193 个 Product Type，主要为 Hardlines 类目，并计划在 2026 年稍后扩展到其他类目。\n\n**我们怎么看（经营解读）**  \n这对 refill pages、多件装、组合页数、pack 数量等商品表达很有价值。它可能减少顾客对“总页数、包装数、单包数量”的理解偏差，从而改善转化和退货风险。但目前没有证据证明采用该主题会直接提升 ranking；执行前要确认 Product Type 是否适用，避免为了合并变体而改变真实包装含义。\n\n**建议动作**  \n2026-09-08 前筛查标题或变体含 `pack`、`count`、`pages`、`refill`、`set`、`bundle` 的 US ASIN。优先处理补充页、多包装相册配件和拼图配件：检查 Unit Count、Number of Packs、标题、图片、A+ 和包装实物是否一致。\n\n**来源**  \n[Amazon US Seller Forums - Total Product Quantity variation theme](https://sellercentral.amazon.com/seller-forums/discussions/t/dcea0ef0-ce36-4503-b579-dfc8a369c8d8)\n\n### 4. FTC 起诉 Amazon Sponsored Ads 拍卖定价，短期先做广告成本审计\n\n**覆盖站点**：US 为主  \n**影响等级**：P1，高关注但非后台规则变更  \n**信息状态**：FTC 官方诉讼公告 + Amazon 官方回应；事实争议需等待法院进展  \n**发布日期**：2026-08-31  \n**生效日期**：诉讼已提交，无 Seller Central 操作要求\n\n**发生了什么（事实）**  \nFTC 与 22 个州在 2026-08-31 起诉 Amazon，指控其 Sponsored Ads 拍卖存在未充分披露的广告价格上调机制。Amazon 同日回应称 FTC 误解广告拍卖机制，并称广告主不会支付超过自身出价。\n\n**我们怎么看（经营解读）**  \n这件事短期不会直接改变 Sponsored Products、Sponsored Brands 或 Sponsored Display 的后台设置，但会提升广告成本审计的重要性。对运营团队来说，关键不是判断诉讼输赢，而是检查 Q4 前是否存在 CPC 上涨、CVR 不变或下降、ROAS 下降、TACoS 上升的投放对象。\n\n**建议动作**  \n2026-09-03 前导出 US 近 30/60/90 天 campaign、ad group、keyword、placement 报表。对 CPC 上升超过 15%、CVR 未提升、ROAS 下降的对象，优先降低 bid 或 placement 加价 10%-20%；自然排名贡献高的核心词保留测试预算。\n\n**来源**  \n[FTC 新闻稿](https://www.ftc.gov/news-events/news/press-releases/2026/08/ftc-states-sue-amazon-over-secret-ad-surcharge-scheme)；[FTC 起诉书 PDF](https://www.ftc.gov/system/files/ftc_gov/pdf/AmazonAds-Complaint.pdf)；[Amazon 官方回应](https://www.aboutamazon.com/company-news/amazon-ftc-sponsored-ads-lawsuit-response)\n\n## 已有事件重要更新\n\n### UK/DE FBM Automated Handling Time 与 BHDR 今日进入执行窗口\n\n**上次状态**：已在 2026-08-31 作为持续关注事项记录。  \n**本次新增变化**：2026-09-01 是 UK/DE 相关 FBM Automated Handling Time 执行窗口日。Business Hour Delivery Rate 90% 要求将在 2026-09-30 生效，2026-10-30 后仍不达标的相关 Business 客户 offer 可能被停用。  \n**行动调整**：如果 UK/DE 全部为 FBA，可后台确认后关闭；如果存在 FBM、SFP 或 Amazon Business 订单，今天必须查 SKU 级 handling time、OTDR、BHDR、Buy Shipping、SSA 与 AHT 设置。  \n**来源**：[Amazon UK Seller Forums](https://sellercentral.amazon.co.uk/seller-forums/discussions/t/20198e40-521c-4a27-b682-3f088fa0a7dc)；[Amazon DE Seller Forums](https://sellercentral.amazon.de/seller-forums/discussions/t/df8547c7-5e56-4ad5-ae84-4b30834c932f)\n\n### US Product Bundling policy 进入 9 月合规排查期\n\n**上次状态**：2026-09-01 首次纳入长期索引。  \n**本次新增变化**：Seller Central 政策页显示 2026-09-30 起 Product Bundling policy 要求扩展到多数类目。  \n**行动调整**：将 bundle、kit、set、multipack 与 variation 分开判断；重点排查自行组合、独立 UPC、跨品牌组合、包装图片与实物不一致的 ASIN。  \n**来源**：[Amazon Changes to program policies](https://sellercentral.amazon.com/help/hub/reference/external/GQHQGBTD7XB7EECN)；[Amazon Product bundling policy](https://sellercentral.amazon.com/help/hub/reference/external/G200442350)\n\n## 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n|---|---|---|---|---|---|---|\n| P0 | 确认 US/UK/DE 是否存在 FBM、SFP、Amazon Business 订单 | US/UK/DE | Operations | 2026-09-01 | 有 SKU 清单、指标截图或导出表；无适用订单则关闭 | 2026-09-02 |\n| P1 | 建立广告 CPC/ROAS 异常审计表 | US | PPC | 2026-09-03 | 近 30/60/90 天 SP/SB/SD 报表完成；输出 Top 20 风险词/广告组 | 2026-09-05 |\n| P1 | 筛选可测试 Amazon Business Deals 的 ASIN | US/UK/DE/FR/IT/ES | Pricing + PPC | 2026-09-04 | 10-20 个 ASIN 完成折扣、毛利、库存和评分校验 | 2026-09-08 |\n| P1 | 排查 bundle/multipack/refill pages ASIN 合规 | US | Listing + Compliance | 2026-09-05 | 完成 ASIN 风险等级、UPC、品牌、包装证据、整改动作 | 2026-09-08 |\n| P2 | 评估 Total Product Quantity 是否适合补充页和多件装 | US | Listing | 2026-09-08 | Product Type 适用性确认；字段与标题/图片/A+ 一致 | 2026-09-12 |\n\n## 持续关注\n\n| 事项 | 下次复查日期 | 当前状态 | 关注点 |\n|---|---|---|---|\n| Pan-EU FBA 荷兰站有效 Offer 要求 | 2026-09-03 | 2 天后生效 | 是否影响 Pan-EU FBA 项目资格和 NL/BE offer 设置 |\n| Second Chance Deal Days | 2026-09-03 | 欧洲活动首日已开始 | 是否分流 Home/Gift/Album 新品流量，CPC 是否异常 |\n| US FBA Sub Same-Day Placement Reservation | 2026-09-03 | 待账号确认 | 是否有相册/手工类 ASIN 被纳入资格，单位出价是否压缩毛利 |\n| DE Prime criteria 更新 | 2026-09-08 | 2026-09-07 生效 | 是否影响 DE FBM/SFP Prime 配送速度承诺 |\n\n## 可信度与边界\n\n- 来源总数：10\n- 官方来源数：9，包括 Amazon Seller Forums、Amazon Seller Central、FTC、Amazon 官方回应、中国政府网/国务院假期安排\n- 非官方来源数：1，仅用于辅助理解广告诉讼报道，不作为执行依据\n- 仍待确认事项：US Product Bundling policy 的账号级通知、Business Deals 在各站点后台实际可见性、Total Product Quantity 对具体 Product Type 的适用范围\n- 判断边界：所有 Listing、广告、促销和履约动作必须结合后台真实数据执行；本日报不替代 Account Health、Category Listing Report、Business Reports 或广告报表。\n\n## 本次格式优化说明\n\n后续日报建议固定使用以下结构：`今日判断`、`优先级快览`、`今日新情报`、`已有事件重要更新`、`今日运营待办`、`持续关注`、`可信度与边界`、`来源`。每条情报统一拆成 `发生了什么（事实）`、`我们怎么看（经营解读）`、`建议动作`、`来源`，避免把事实、推断和执行建议混在一起。\n\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-01\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-01\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报增量日报｜2026-09-01\u003c/h1>\n\u003cp>面向 Amazon 运营团队｜Asia/Shanghai｜预计阅读 4-5 分钟\u003c/p>\n\u003ch2>今日判断\u003c/h2>\n\u003cp>今日没有形成单一重大主线，但 Amazon 官方在 FBM 风险处理、B2B 促销工具、数量变体表达上均有可执行变化。对相册、补充页、学校记忆册和拼图配件业务，最该优先处理的是：确认 US/UK/DE 是否存在 FBM 或 Amazon Business 订单、筛查多件装/套装 Listing 的字段一致性、建立广告 CPC/ROAS 异常审计。FTC 对 Amazon Sponsored Ads 的诉讼属于高关注战略信号，但不是后台规则变更，短期不建议机械停投或大幅降预算。今天不是本周最后一个中国大陆法定工作日，不生成周报。\u003c/p>\n\u003ch2>优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>影响站点\u003c/th>\n\u003cth>业务影响\u003c/th>\n\u003cth>今天怎么做\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P0\u003c/td>\n\u003ctd>FBM 风险处理与 AHT/BHDR 执行窗口\u003c/td>\n\u003ctd>US/UK/DE\u003c/td>\n\u003ctd>Offer 停用、配送绩效、Account Health\u003c/td>\n\u003ctd>先确认是否有 FBM/SFP/Amazon Business 订单；无则关闭，有则查 SKU 级指标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>Amazon Business Deals 开放\u003c/td>\n\u003ctd>US/CA/UK/DE/FR/IT/ES/JP/MX/AU\u003c/td>\n\u003ctd>B2B 流量、价格、利润率\u003c/td>\n\u003ctd>只对企业客户需求强、毛利足够的 ASIN 做小范围测试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>Total Product Quantity 变体主题\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Listing 数据质量、CVR、变体结构\u003c/td>\n\u003ctd>筛查 refill pages、pack、set、bundle 类商品是否适合标准化件数表达\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>Sponsored Ads 诉讼与广告成本审计\u003c/td>\n\u003ctd>US 为主\u003c/td>\n\u003ctd>CPC、ACoS、TACoS、净利润\u003c/td>\n\u003ctd>用 30/60/90 天报表定位 CPC 上升但 CVR/ROAS 未改善的投放对象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>US Product Bundling policy 临近生效\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Listing 合规、套装 ASIN 风险\u003c/td>\n\u003ctd>2026-09-05 前完成 bundle/multipack 风险清单\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>今日新情报\u003c/h2>\n\u003ch3>1. FBM 风险处理收缩到具体 Offer，但单品停用风险更直接\u003c/h3>\n\u003cp>\u003cstrong>覆盖站点\u003c/strong>：US（官方确认） \u003cstrong>影响等级\u003c/strong>：P0/P1，取决于是否有 FBM/SFP 订单 \u003cstrong>信息状态\u003c/strong>：Amazon Seller Forums 官方公告 \u003cstrong>发布日期\u003c/strong>：2026-08-31 \u003cstrong>生效日期\u003c/strong>：2026-08-31\u003c/p>\n\u003cp>\u003cstrong>发生了什么（事实）\u003c/strong> Amazon 从 2026-08-31 起调整 US 站 FBM 政策违规处理方式。当某个 Offer 因取消率、迟发率、订单缺陷率或准时送达率使 Account Health 面临风险时，平台会临时停用该 Offer，而不是让其他正常 Listing 和整体账号状态一并受影响。停用前会发送警告邮件，恢复入口位于 Account Health 的 Other Policy Violations。\u003c/p>\n\u003cp>\u003cstrong>我们怎么看（经营解读）\u003c/strong> 这不是绩效标准放宽，而是风险处理粒度变化：从账号级影响转向更具体的 Offer 级处理。好处是正常商品可能被保护；风险是低订单量 FBM 商品更容易因少量异常订单触发单品停用。对以 FBA 为主的相册类业务，直接影响可能较低，但只要有 US FBM 备用 offer、定制类订单或大件/低价商品自配送，就需要今天核查。\u003c/p>\n\u003cp>\u003cstrong>建议动作\u003c/strong> 2026-09-01 当天导出 US FBM/SFP SKU 清单，检查近 30 天 cancellation rate、late shipment rate、ODR、OTDR。若存在低销量 FBM offer，把高风险 SKU 改为 FBA 或延长 handling time，并保留承运商异常证据。\u003c/p>\n\u003cp>\u003cstrong>来源\u003c/strong> \u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/7d5f264e-d83e-4557-9557-3999722b7e23\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon US Seller Forums - News_Amazon\u003c/a>\u003c/p>\n\u003ch3>2. Amazon Business Deals 开放，适合做 B2B 限时折扣测试\u003c/h3>\n\u003cp>\u003cstrong>覆盖站点\u003c/strong>：US、CA、UK、DE、FR、IT、ES、JP、MX、AU \u003cstrong>影响等级\u003c/strong>：P1 \u003cstrong>信息状态\u003c/strong>：Amazon Seller Forums 官方公告 \u003cstrong>发布日期\u003c/strong>：2026-08-31 \u003cstrong>功能开放日期\u003c/strong>：2026-08-31\u003c/p>\n\u003cp>\u003cstrong>发生了什么（事实）\u003c/strong> Amazon Business Deals 已开放，可针对企业买家设置 1 小时至 30 天的固定价或百分比折扣。普通 Deal 最低折扣为 10%；Prime Big Deal Days、Black Friday、Cyber Monday 等活动期最低折扣为 15%。符合条件的活动 Deal 在 2026-12-31 前可能获得额外邮件或推送展示。\u003c/p>\n\u003cp>\u003cstrong>我们怎么看（经营解读）\u003c/strong> 这个工具把长期 Business Price 和短期 B2B 促销分开，有利于测试学校、办公室、活动采购、礼品采购等企业买家需求。但“可能获得额外展示”不是流量保证。对相册和学校记忆册类产品，建议先选择客单价较高、复购/批量购买可能性较强、毛利可承受 10%-15% 折扣的 ASIN 测试。\u003c/p>\n\u003cp>\u003cstrong>建议动作\u003c/strong> 2026-09-04 前筛选 US/UK/DE/FR/IT/ES 已设置 Business Price 且评分、库存、毛利达标的 10-20 个 ASIN，测算折后贡献利润率。活动前后追踪 B2B 订单数、Business CVR、广告辅助销售额和 TACoS，不只看 Deal 销售额。\u003c/p>\n\u003cp>\u003cstrong>来源\u003c/strong> \u003ca href=\"https://sellercentral.amazon.co.uk/seller-forums/discussions/t/de3d4860-4395-4496-b5f0-8249e31a5a11\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon UK Seller Forums - Amazon Business Deals\u003c/a>\u003c/p>\n\u003ch3>3. Total Product Quantity 变体主题标准化件数表达\u003c/h3>\n\u003cp>\u003cstrong>覆盖站点\u003c/strong>：US（官方确认） \u003cstrong>影响等级\u003c/strong>：P1 \u003cstrong>信息状态\u003c/strong>：Amazon Seller Forums 官方公告 \u003cstrong>发布日期\u003c/strong>：2026-08-29 \u003cstrong>当前状态\u003c/strong>：已开放，现阶段为可选结构\u003c/p>\n\u003cp>\u003cstrong>发生了什么（事实）\u003c/strong> Amazon 新增 Total Product Quantity 变体主题，用 “X count” 或 “X count（Y packs of Z）” 统一显示商品总件数，并把 Unit Count 与 Number of Packs 从尺寸、颜色等属性中分离。公告称当前覆盖 193 个 Product Type，主要为 Hardlines 类目，并计划在 2026 年稍后扩展到其他类目。\u003c/p>\n\u003cp>\u003cstrong>我们怎么看（经营解读）\u003c/strong> 这对 refill pages、多件装、组合页数、pack 数量等商品表达很有价值。它可能减少顾客对“总页数、包装数、单包数量”的理解偏差，从而改善转化和退货风险。但目前没有证据证明采用该主题会直接提升 ranking；执行前要确认 Product Type 是否适用，避免为了合并变体而改变真实包装含义。\u003c/p>\n\u003cp>\u003cstrong>建议动作\u003c/strong> 2026-09-08 前筛查标题或变体含 \u003ccode>pack\u003c/code>、\u003ccode>count\u003c/code>、\u003ccode>pages\u003c/code>、\u003ccode>refill\u003c/code>、\u003ccode>set\u003c/code>、\u003ccode>bundle\u003c/code> 的 US ASIN。优先处理补充页、多包装相册配件和拼图配件：检查 Unit Count、Number of Packs、标题、图片、A+ 和包装实物是否一致。\u003c/p>\n\u003cp>\u003cstrong>来源\u003c/strong> \u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/dcea0ef0-ce36-4503-b579-dfc8a369c8d8\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon US Seller Forums - Total Product Quantity variation theme\u003c/a>\u003c/p>\n\u003ch3>4. FTC 起诉 Amazon Sponsored Ads 拍卖定价，短期先做广告成本审计\u003c/h3>\n\u003cp>\u003cstrong>覆盖站点\u003c/strong>：US 为主 \u003cstrong>影响等级\u003c/strong>：P1，高关注但非后台规则变更 \u003cstrong>信息状态\u003c/strong>：FTC 官方诉讼公告 + Amazon 官方回应；事实争议需等待法院进展 \u003cstrong>发布日期\u003c/strong>：2026-08-31 \u003cstrong>生效日期\u003c/strong>：诉讼已提交，无 Seller Central 操作要求\u003c/p>\n\u003cp>\u003cstrong>发生了什么（事实）\u003c/strong> FTC 与 22 个州在 2026-08-31 起诉 Amazon，指控其 Sponsored Ads 拍卖存在未充分披露的广告价格上调机制。Amazon 同日回应称 FTC 误解广告拍卖机制，并称广告主不会支付超过自身出价。\u003c/p>\n\u003cp>\u003cstrong>我们怎么看（经营解读）\u003c/strong> 这件事短期不会直接改变 Sponsored Products、Sponsored Brands 或 Sponsored Display 的后台设置，但会提升广告成本审计的重要性。对运营团队来说，关键不是判断诉讼输赢，而是检查 Q4 前是否存在 CPC 上涨、CVR 不变或下降、ROAS 下降、TACoS 上升的投放对象。\u003c/p>\n\u003cp>\u003cstrong>建议动作\u003c/strong> 2026-09-03 前导出 US 近 30/60/90 天 campaign、ad group、keyword、placement 报表。对 CPC 上升超过 15%、CVR 未提升、ROAS 下降的对象，优先降低 bid 或 placement 加价 10%-20%；自然排名贡献高的核心词保留测试预算。\u003c/p>\n\u003cp>\u003cstrong>来源\u003c/strong> \u003ca href=\"https://www.ftc.gov/news-events/news/press-releases/2026/08/ftc-states-sue-amazon-over-secret-ad-surcharge-scheme\" target=\"_blank\" rel=\"noopener noreferrer\">FTC 新闻稿\u003c/a>；\u003ca href=\"https://www.ftc.gov/system/files/ftc_gov/pdf/AmazonAds-Complaint.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">FTC 起诉书 PDF\u003c/a>；\u003ca href=\"https://www.aboutamazon.com/company-news/amazon-ftc-sponsored-ads-lawsuit-response\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon 官方回应\u003c/a>\u003c/p>\n\u003ch2>已有事件重要更新\u003c/h2>\n\u003ch3>UK/DE FBM Automated Handling Time 与 BHDR 今日进入执行窗口\u003c/h3>\n\u003cp>\u003cstrong>上次状态\u003c/strong>：已在 2026-08-31 作为持续关注事项记录。 \u003cstrong>本次新增变化\u003c/strong>：2026-09-01 是 UK/DE 相关 FBM Automated Handling Time 执行窗口日。Business Hour Delivery Rate 90% 要求将在 2026-09-30 生效，2026-10-30 后仍不达标的相关 Business 客户 offer 可能被停用。 \u003cstrong>行动调整\u003c/strong>：如果 UK/DE 全部为 FBA，可后台确认后关闭；如果存在 FBM、SFP 或 Amazon Business 订单，今天必须查 SKU 级 handling time、OTDR、BHDR、Buy Shipping、SSA 与 AHT 设置。 \u003cstrong>来源\u003c/strong>：\u003ca href=\"https://sellercentral.amazon.co.uk/seller-forums/discussions/t/20198e40-521c-4a27-b682-3f088fa0a7dc\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon UK Seller Forums\u003c/a>；\u003ca href=\"https://sellercentral.amazon.de/seller-forums/discussions/t/df8547c7-5e56-4ad5-ae84-4b30834c932f\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon DE Seller Forums\u003c/a>\u003c/p>\n\u003ch3>US Product Bundling policy 进入 9 月合规排查期\u003c/h3>\n\u003cp>\u003cstrong>上次状态\u003c/strong>：2026-09-01 首次纳入长期索引。 \u003cstrong>本次新增变化\u003c/strong>：Seller Central 政策页显示 2026-09-30 起 Product Bundling policy 要求扩展到多数类目。 \u003cstrong>行动调整\u003c/strong>：将 bundle、kit、set、multipack 与 variation 分开判断；重点排查自行组合、独立 UPC、跨品牌组合、包装图片与实物不一致的 ASIN。 \u003cstrong>来源\u003c/strong>：\u003ca href=\"https://sellercentral.amazon.com/help/hub/reference/external/GQHQGBTD7XB7EECN\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Changes to program policies\u003c/a>；\u003ca href=\"https://sellercentral.amazon.com/help/hub/reference/external/G200442350\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Product bundling policy\u003c/a>\u003c/p>\n\u003ch2>今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P0\u003c/td>\n\u003ctd>确认 US/UK/DE 是否存在 FBM、SFP、Amazon Business 订单\u003c/td>\n\u003ctd>US/UK/DE\u003c/td>\n\u003ctd>Operations\u003c/td>\n\u003ctd>2026-09-01\u003c/td>\n\u003ctd>有 SKU 清单、指标截图或导出表；无适用订单则关闭\u003c/td>\n\u003ctd>2026-09-02\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>建立广告 CPC/ROAS 异常审计表\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>PPC\u003c/td>\n\u003ctd>2026-09-03\u003c/td>\n\u003ctd>近 30/60/90 天 SP/SB/SD 报表完成；输出 Top 20 风险词/广告组\u003c/td>\n\u003ctd>2026-09-05\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>筛选可测试 Amazon Business Deals 的 ASIN\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES\u003c/td>\n\u003ctd>Pricing + PPC\u003c/td>\n\u003ctd>2026-09-04\u003c/td>\n\u003ctd>10-20 个 ASIN 完成折扣、毛利、库存和评分校验\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>排查 bundle/multipack/refill pages ASIN 合规\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Listing + Compliance\u003c/td>\n\u003ctd>2026-09-05\u003c/td>\n\u003ctd>完成 ASIN 风险等级、UPC、品牌、包装证据、整改动作\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>评估 Total Product Quantity 是否适合补充页和多件装\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Listing\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003ctd>Product Type 适用性确认；字段与标题/图片/A+ 一致\u003c/td>\n\u003ctd>2026-09-12\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>持续关注\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>事项\u003c/th>\n\u003cth>下次复查日期\u003c/th>\n\u003cth>当前状态\u003c/th>\n\u003cth>关注点\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>Pan-EU FBA 荷兰站有效 Offer 要求\u003c/td>\n\u003ctd>2026-09-03\u003c/td>\n\u003ctd>2 天后生效\u003c/td>\n\u003ctd>是否影响 Pan-EU FBA 项目资格和 NL/BE offer 设置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Second Chance Deal Days\u003c/td>\n\u003ctd>2026-09-03\u003c/td>\n\u003ctd>欧洲活动首日已开始\u003c/td>\n\u003ctd>是否分流 Home/Gift/Album 新品流量，CPC 是否异常\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>US FBA Sub Same-Day Placement Reservation\u003c/td>\n\u003ctd>2026-09-03\u003c/td>\n\u003ctd>待账号确认\u003c/td>\n\u003ctd>是否有相册/手工类 ASIN 被纳入资格，单位出价是否压缩毛利\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DE Prime criteria 更新\u003c/td>\n\u003ctd>2026-09-08\u003c/td>\n\u003ctd>2026-09-07 生效\u003c/td>\n\u003ctd>是否影响 DE FBM/SFP Prime 配送速度承诺\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>可信度与边界\u003c/h2>\n\u003cul>\n\u003cli>来源总数：10\u003c/li>\n\u003cli>官方来源数：9，包括 Amazon Seller Forums、Amazon Seller Central、FTC、Amazon 官方回应、中国政府网/国务院假期安排\u003c/li>\n\u003cli>非官方来源数：1，仅用于辅助理解广告诉讼报道，不作为执行依据\u003c/li>\n\u003cli>仍待确认事项：US Product Bundling policy 的账号级通知、Business Deals 在各站点后台实际可见性、Total Product Quantity 对具体 Product Type 的适用范围\u003c/li>\n\u003cli>判断边界：所有 Listing、广告、促销和履约动作必须结合后台真实数据执行；本日报不替代 Account Health、Category Listing Report、Business Reports 或广告报表。\u003c/li>\n\u003c/ul>\n\u003ch2>本次格式优化说明\u003c/h2>\n\u003cp>后续日报建议固定使用以下结构：\u003ccode>今日判断\u003c/code>、\u003ccode>优先级快览\u003c/code>、\u003ccode>今日新情报\u003c/code>、\u003ccode>已有事件重要更新\u003c/code>、\u003ccode>今日运营待办\u003c/code>、\u003ccode>持续关注\u003c/code>、\u003ccode>可信度与边界\u003c/code>、\u003ccode>来源\u003c/code>。每条情报统一拆成 \u003ccode>发生了什么（事实）\u003c/code>、\u003ccode>我们怎么看（经营解读）\u003c/code>、\u003ccode>建议动作\u003c/code>、\u003ccode>来源\u003c/code>，避免把事实、推断和执行建议混在一起。\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-01\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-09-01", "text": "### 1. FBM 风险处理收缩到具体 Offer，但单品停用风险更直接\n\n**覆盖站点**：US（官方确认）  \n**影响等级**：P0/P1，取决于是否有 FBM/SFP 订单  \n**信息状态**：Amazon Seller Forums 官方公告  \n**发布日期**：2026-08-31  \n**生效日期**：2026-08-31\n\n**发生了什么（事实）**  \nAmazon 从 2026-08-31 起调整 US 站 FBM 政策违规处理方式。当某个 Offer 因取消率、迟发率、订单缺陷率或准时送达率使 Account Health 面临风险时，平台会临时停用该 Offer，而不是让其他正常 Listing 和整体账号状态一并受影响。停用前会发送警告邮件，恢复入口位于 Account Health 的 Other Policy Violations。\n\n**我们怎么看（经营解读）**  \n这不是绩效标准放宽，而是风险处理粒度变化：从账号级影响转向更具体的 Offer 级处理。好处是正常商品可能被保护；风险是低订单量 FBM 商品更容易因少量异常订单触发单品停用。对以 FBA 为主的相册类业务，直接影响可能较低，但只要有 US FBM 备用 offer、定制类订单或大件/低价商品自配送，就需要今天核查。\n\n**建议动作**  \n2026-09-01 当天导出 US FBM/SFP SKU 清单，检查近 30 天 cancellation rate、late shipment rate、ODR、OTDR。若存在低销量 FBM offer，把高风险 SKU 改为 FBA 或延长 handling time，并保留承运商异常证据。\n\n**来源**  \n[Amazon US Seller Forums - News_Amazon](https://sellercentral.amazon.com/seller-forums/discussions/t/7d5f264e-d83e-4557-9557-3999722b7e23)\n\n", "title": "1. FBM 风险处理收缩到具体 Offer，但单品停用风险更直接", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-01\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-01\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>1. FBM 风险处理收缩到具体 Offer，但单品停用风险更直接\u003c/h3>\n\u003cp>\u003cstrong>覆盖站点\u003c/strong>：US（官方确认） \u003cstrong>影响等级\u003c/strong>：P0/P1，取决于是否有 FBM/SFP 订单 \u003cstrong>信息状态\u003c/strong>：Amazon Seller Forums 官方公告 \u003cstrong>发布日期\u003c/strong>：2026-08-31 \u003cstrong>生效日期\u003c/strong>：2026-08-31\u003c/p>\n\u003cp>\u003cstrong>发生了什么（事实）\u003c/strong> Amazon 从 2026-08-31 起调整 US 站 FBM 政策违规处理方式。当某个 Offer 因取消率、迟发率、订单缺陷率或准时送达率使 Account Health 面临风险时，平台会临时停用该 Offer，而不是让其他正常 Listing 和整体账号状态一并受影响。停用前会发送警告邮件，恢复入口位于 Account Health 的 Other Policy Violations。\u003c/p>\n\u003cp>\u003cstrong>我们怎么看（经营解读）\u003c/strong> 这不是绩效标准放宽，而是风险处理粒度变化：从账号级影响转向更具体的 Offer 级处理。好处是正常商品可能被保护；风险是低订单量 FBM 商品更容易因少量异常订单触发单品停用。对以 FBA 为主的相册类业务，直接影响可能较低，但只要有 US FBM 备用 offer、定制类订单或大件/低价商品自配送，就需要今天核查。\u003c/p>\n\u003cp>\u003cstrong>建议动作\u003c/strong> 2026-09-01 当天导出 US FBM/SFP SKU 清单，检查近 30 天 cancellation rate、late shipment rate、ODR、OTDR。若存在低销量 FBM offer，把高风险 SKU 改为 FBA 或延长 handling time，并保留承运商异常证据。\u003c/p>\n\u003cp>\u003cstrong>来源\u003c/strong> \u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/7d5f264e-d83e-4557-9557-3999722b7e23\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon US Seller Forums - News_Amazon\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-01\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-01", "text": "### 2. Amazon Business Deals 开放，适合做 B2B 限时折扣测试\n\n**覆盖站点**：US、CA、UK、DE、FR、IT、ES、JP、MX、AU  \n**影响等级**：P1  \n**信息状态**：Amazon Seller Forums 官方公告  \n**发布日期**：2026-08-31  \n**功能开放日期**：2026-08-31\n\n**发生了什么（事实）**  \nAmazon Business Deals 已开放，可针对企业买家设置 1 小时至 30 天的固定价或百分比折扣。普通 Deal 最低折扣为 10%；Prime Big Deal Days、Black Friday、Cyber Monday 等活动期最低折扣为 15%。符合条件的活动 Deal 在 2026-12-31 前可能获得额外邮件或推送展示。\n\n**我们怎么看（经营解读）**  \n这个工具把长期 Business Price 和短期 B2B 促销分开，有利于测试学校、办公室、活动采购、礼品采购等企业买家需求。但“可能获得额外展示”不是流量保证。对相册和学校记忆册类产品，建议先选择客单价较高、复购/批量购买可能性较强、毛利可承受 10%-15% 折扣的 ASIN 测试。\n\n**建议动作**  \n2026-09-04 前筛选 US/UK/DE/FR/IT/ES 已设置 Business Price 且评分、库存、毛利达标的 10-20 个 ASIN，测算折后贡献利润率。活动前后追踪 B2B 订单数、Business CVR、广告辅助销售额和 TACoS，不只看 Deal 销售额。\n\n**来源**  \n[Amazon UK Seller Forums - Amazon Business Deals](https://sellercentral.amazon.co.uk/seller-forums/discussions/t/de3d4860-4395-4496-b5f0-8249e31a5a11)\n\n", "title": "2. Amazon Business Deals 开放，适合做 B2B 限时折扣测试", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n
