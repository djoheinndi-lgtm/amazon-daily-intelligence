al、承运商合同及实际账单验证。\n\n## 复核来源\n\n- [Amazon US BFCM / FBA 截止日公告](https://sellercentral.amazon.com/seller-forums/discussions/t/d7ae5a95-6af4-42ca-9a06-1360007f155c)\n- [Amazon Europe peak-season FBA 公告](https://sellercentral.amazon.co.uk/seller-forums/discussions/t/67ab1bf7-8ea5-4a10-ab19-dc600193715a)\n- [European Commission：EU Customs Reform](https://taxation-customs.ec.europa.eu/customs/eu-customs-reform_en)\n- [Revenue Ireland：Union handling fee](https://www.revenue.ie/en/customs/individuals/union-handling-fee/index.aspx)\n- [Amazon 商业责任险帮助页](https://sellercentral.amazon.com/help/hub/reference/external/GUQ848NB5HZ6M6A4)\n- [Amazon Seller Central 官方公告索引](https://sellercentral.amazon.com/seller-forums/)\n", "sections": []}, {"date": "2026-10-23", "text": "# 亚马逊及海外市场情报增量日报｜2026-10-23\n\n## 1. 今日判断\n\n今天未发现需要全账号立即调整的 Amazon 平台新规；新增一条 US 国际邮政申报事件，相关正式申报要求延至 **2027-01-20**，Entry Type 13 测试同步调整 PGA 数据传输方式。对相册、补充页、手工及拼图配件业务，先确认是否存在从境外经国际邮政寄往 US 的 FBM/补发订单，再由报关方判断适用性，今天不据此改 FBA 头程或广告。新增事项为 P2，不设置新增 P0/P1；既有最高优先级仍是 US 与欧陆 BFCM 库存异常闭环。重点站点 US、UK；最近外部到仓节点为 **2026-10-28**（US optimized split、UK），今天应完成预约与 ETA 证据核验。\n\n检索窗口：2026-10-22 10:08:16 至 2026-10-23 09:05:08（Asia/Shanghai）；补查既有待确认事项。今日为周五，后附本期周度合并报告。\n\n## 2. 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n|---|---|---|---|---|---|\n| P2 | 国际邮政部分正式申报要求延期；ET13 测试调整 | US | FBM直邮、补发、报关 | 2026-10-22 公告；合规节点 2027-01-20 | 有国际邮政订单才核查；内部截止 2026-10-27 |\n\n## 3. 今日新情报\n\n### US 国际邮政：部分申报要求延期，Entry Type 13 测试调整\n\n- 【影响等级】P2\n- 【站点】US\n- 【发布日期】2026-10-22（Federal Register 正式刊登；预公开文件于 2026-10-21 提交）\n- 【生效日期】ET13 测试修改为 2026-10-22；19 CFR 145.12(a)(2)(v)、(vi) 合规日期改为 2027-01-20\n- 【信息状态】正式公告；ET13 为测试项目\n- 【来源】CBP / Federal Register：[延期最终规则 2026-21600](https://public-inspection.federalregister.gov/2026-21600.pdf)；[ET13 测试修改 2026-21570](https://public-inspection.federalregister.gov/2026-21570.pdf)；[2026-10-22 正式公报，第66639、66707页](https://www.govinfo.gov/content/pkg/FR-2026-10-22/pdf/FR-2026-10-22.pdf)。\n- 发生了什么：CBP 将部分国际邮政货物不再适用新邮政非正式申报流程的合规节点，从 2026-10-22 延至 2027-01-20，涵盖指定 PGA、HTS 第98/99章及特定免税申报情形。同日修改不超过 $2,500 国际邮政货物的 ET13 测试，允许传输申报时包含或不包含电子 PGA 数据；具体货物准入和数据义务须由报关方核定。\n- 我们怎么看：这给受影响直邮业务留下系统与报关准备时间，不代表恢复低值免税，也不代表撤销 PGA 义务。若当前全部采用商业货运 FBA 头程及境内配送，直接运营影响有限；无需调整 Listing、图片、A+、属性、竞价或预算。\n- 建议动作：供应链在 2026-10-27 前，从 OMS/ERP 导出近30天 US FBM 与补发订单，筛选 origin_country≠US 且 channel=international_post；字段保留订单号、SKU/ASIN、申报值、HTS、PGA机构、承运商、报关行、entry_type。向服务商取得“延期条款是否适用、ET13是否支持、PGA数据处理、2027-01-20切换方案”书面答复。验收为100%匹配订单有适用性结论；无匹配则记录不适用并关闭内部排查。复查 2026-10-28；若仍按旧日期要求停运或加收费用，先取得条款与报价证据再升级。\n\n## 4. 已有事件的重要更新\n\n本次未确认既有事件出现新的数值、范围、日期或权威确认变化，不重复推送昨日的 BFCM 日期校正、UHF 或柴油值。\n\n## 5. 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n|---|---|---|---|---|---|---|\n| P2 | OMS/ERP筛近30天境外发往US的国际邮政FBM/补发订单；取得ET13、PGA、延期适用性书面答复 | US | 供应链/合规 | 2026-10-27 | 100%匹配订单有结论及证据；无匹配留存筛选结果 | 2026-10-28 |\n\n## 6. 持续关注\n\n- **US optimized split、UK BFCM到仓：** 外部节点均为2026-10-28，未取得账号执行结果；下次复查2026-10-24。若预约或ETA晚于节点，或可售库存不足已批准活动预测，则升级供应链例外并重审预算，不默认货件已完成。\n- **EU UHF：** 官方日期2026-11-01、€2/distinct item；Amazon/服务商合同转嫁方式仍待书面确认。下次复查2026-10-28。仅境外直发EU消费者路线建模；若确认卖家承担，重算该路线毛利与底价。\n- **US邮政ET13：** 新事件，账号适用性未确认；下次复查2026-10-28。若匹配订单存在PGA要求或HTS第98/99章情形且服务商无切换方案，升级合规项目。\n\n## 7. 情报边界与可信度\n\n今日核心事实引用3个官方原始文件URL，涉及2份CBP文件，非官方来源0；新增事件主线1条、既有实质更新0条。待确认3类：本业务邮政路线适用性、UHF合同承担方、BFCM账号内货件执行结果；后两项没有新结论，不计作新增。\n\n补查Amazon US/UK及DE/FR/IT/ES本地语言新闻线索、Amazon Ads发布页、官方BFCM清单、EIA和Revenue。检索不等于完整覆盖登录后台；不能确认的账号通知不作已生效结论。欧盟10月消费者信心仅核实到发布日历，未取得新实值，未引用预测代替实际；排除英国土耳其FTA谈判、农产品通关、Amazon财报电话会、重复旺季提醒及论坛卖家个案。风格参考旧Sites链接本次无法读取，沿用本地已发布的中文报告结构。\n\n# 亚马逊及海外市场情报周报｜2026-10-23\n\n## 1. 本周管理层摘要\n\n本期为补齐式周报：本地可核实最近周报为2026-10-10，覆盖其后至2026-10-23 09:05:08已确认新增与实质更新，不能只合并最近五天。按事件主线去重为 **8条**，其中管理层重点4条：US旺季FBA费用、US BFCM入仓、欧洲BFCM入仓、EU UHF；另有柴油、UK定向安全通报、CSBA问答和US邮政申报。影响US/UK/DE/FR/IT/ES，最高风险为货到但不可售叠加费用上升后，仍按旧毛利底线放量。最近外部节点为2026-10-28 US optimized split与UK到仓；2026-11-01为EU UHF节点。没有账号数据，无法报告实际销量损失或团队任务完成率。\n\n## 2. 本周优先级快览\n\n| 优先级 | 事件主线 | 站点 | 模块 | 下周动作 | 负责人 | 截止日 |\n|---|---|---|---|---|--- 候选；抽至少20笔订单或全部不足20笔订单 | 财务/US运营/PPC | 2026-10-26 | 候选100%有新成本、毛利、盈亏平衡ACoS；亏损项不加预算 |\n| P1 | 路线成本表分离EU本地和境外直邮，确认申报人与合同转嫁 | DE/FR/IT/ES | 非EU发往消费者路线及套装 | 供应链/财务 | 2026-10-28 | 每条路线有承担方、计数法和书面证据；未确认项保留假设，不自动改价 |\n| P2 | OMS筛国际邮政US订单，与服务商核对延期及ET13/PGA数据 | US | FBM/补发 | 供应链/合规 | 2026-10-27 | 100%匹配订单有适用性结论或无匹配证明 |\n| P2 | Manage All Inventory及开发台账筛玩具/绳带/小零件/薄袋/电气结构 | UK | 在售及开发SKU | 合规/产品开发 | 2026-10-27 | 匹配项有测试资料/整改责任人；无匹配有关闭依据 |\n| P2 | Settings中检查CSBA可用性；导出30天FBM费用、退款、ODR与SAFE-T | US/UK | 有FBM订单账号 | 客服/运营/财务 | 2026-10-27 | 有试用yes/no结论；试用需明确样本和退款预算上限 |\n\n建议复用一张“ASIN×站点×活动”的Sheet合并库存、Deal Health、费用和PPC导出，以ASIN+站点为键校验缺失值，自动标记毛利不足和ETA晚于节点的行；运营人工确认后再改预算。\n\n## 7. 已关闭与继续跟踪事项\n\n- **关闭事件窗口：** CSBA 2026-10-15问答窗口已结束，关闭参会提醒；是否试用仍由账号评估，2026-10-27复查。\n- **关闭旧日期口径：** US minimal 2026-10-20、optimized 2026-10-30不再作为本报告执行日期；以2026-10-21/2026-10-28替代。货件任务未取得完成证据，不标记已关闭。\n- **继续跟踪：** BFCM到仓2026-10-24及2026-10-28复查；UHF承担方2026-10-28复查；柴油及合同报价2026-10-28复查；US邮政2026-10-28复查，2027-01-13检查切换准备。\n- **历史存量任务：** 商业责任险账号适用性、Partial Refunds白名单、Return and Recovery Insights均无本期新事实，不计入8条。账号负责人应于2026-10-27补充完成/不适用证据，不能用“无新公告”替代任务完成。\n\n## 8. 来源与可信度统计\n\n本期正文核心来源13个官方URL、非官方0：CBP预公开文件2、正式公报1、Amazon页面4（US清单、欧洲节点、FBA费率、CSBA）、Revenue1、EIA1、UK OPSS4，共13个URL；按独立文件去重，CBP正式公报不另算事件。统计统一为 **13个官方URL、非官方0**。UK OPSS除正文毛毛虫报告外，还包括：[Toddler Ghost Costume，2026-10-13](https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-toddler-ghost-costume-sold-via-amazon-2609-0106)、[OOWOLF LED，2026-10-13](https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-oowolf-led-light-sold-via-amazon-2609-0221)、[Frideko灯，2026-10-13](https://www.gov.uk/product-safety-alerts-reports-recalls/product-safety-report-frideko-home-led-floor-lamp-sold-via-amazon-2610-0006)。部分历史来源承接已发布日报；登录后台通知、FBA尺寸费率和团队执行结果仍需账号证据。8条为事件主线数，不能与URL数或每日条数相加。\n\n本期没有核实出新的强制Listing/广告规则；没有把旧保险、Partial Refunds等存量任务重复算成新增。来源事实、内部建议门槛和假设测算已分别说明。\n", "sections": [{"date": "2026-10-23", "text": "### US 国际邮政：部分申报要求延期，Entry Type 13 测试调整\n\n- 【影响等级】P2\n- 【站点】US\n- 【发布日期】2026-10-22（Federal Register 正式刊登；预公开文件于 2026-10-21 提交）\n- 【生效日期】ET13 测试修改为 2026-10-22；19 CFR 145.12(a)(2)(v)、(vi) 合规日期改为 2027-01-20\n- 【信息状态】正式公告；ET13 为测试项目\n- 【来源】CBP / Federal Register：[延期最终规则 2026-21600](https://public-inspection.federalregister.gov/2026-21600.pdf)；[ET13 测试修改 2026-21570](https://public-inspection.federalregister.gov/2026-21570.pdf)；[2026-10-22 正式公报，第66639、66707页](https://www.govinfo.gov/content/pkg/FR-2026-10-22/pdf/FR-2026-10-22.pdf)。\n- 发生了什么：CBP 将部分国际邮政货物不再适用新邮政非正式申报流程的合规节点，从 2026-10-22 延至 2027-01-20，涵盖指定 PGA、HTS 第98/99章及特定免税申报情形。同日修改不超过 $2,500 国际邮政货物的 ET13 测试，允许传输申报时包含或不包含电子 PGA 数据；具体货物准入和数据义务须由报关方核定。\n- 我们怎么看：这给受影响直邮业务留下系统与报关准备时间，不代表恢复低值免税，也不代表撤销 PGA 义务。若当前全部采用商业货运 FBA 头程及境内配送，直接运营影响有限；无需调整 Listing、图片、A+、属性、竞价或预算。\n- 建议动作：供应链在 2026-10-27 前，从 OMS/ERP 导出近30天 US FBM 与补发订单，筛选 origin_country≠US 且 channel=international_post；字段保留订单号、SKU/ASIN、申报值、HTS、PGA机构、承运商、报关行、entry_type。向服务商取得“延期条款是否适用、ET13是否支持、PGA数据处理、2027-01-20切换方案”书面答复。验收为100%匹配订单有适用性结论；无匹配则记录不适用并关闭内部排查。复查 2026-10-28；若仍按旧日期要求停运或加收费用，先取得条款与报价证据再升级。\n\n", "title": "US 国际邮政：部分申报要求延期，Entry Type 13 测试调整", "kind": "intelligence"}]}, {"date": "2026-10-22", "text": "# 亚马逊及海外市场情报增量日报｜2026-10-22\n\n## 1. 今日判断\n\n今日没有发现新的 Amazon 平台强制规则、广告计费规则或跨境监管规则；但 Q4 入仓节点出现两项必须落地的实质更新。美国 FBA minimal-shipment-splits 到仓截止日的官方口径校正为 **2026-10-21**，今天应按“节点已过”关闭主推 ASIN 的未接收、不可售和 Deal Health 异常。DE/FR/IT/ES 的 Black Friday Week FBA 到仓节点同样已于 **2026-10-21** 到期，英国仍有至 **2026-10-28** 的补救窗口。最高优先级是 US 与欧陆库存例外闭环；最紧急行动是今天从货件、可售库存和 Deal Health 三个口径逐 ASIN 确认 BFCM 可执行性。\n\n## 2. 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n|---|---|---|---|---|---|\n| P0 | US BFCM minimal-split 到仓节点已过，校正截止日期 | US | FBA、库存、促销、利润 | 2026-10-21 已到期；optimized split 2026-10-28 | 是 |\n| P0 | 欧陆 Black Friday Week FBA 到仓节点已过 | DE/FR/IT/ES | FBA、库存、促销 | 2026-10-21 已到期 | 是 |\n| P1 | UK Black Friday Week FBA 到仓窗口 | UK | FBA、库存、促销 | 2026-10-28 | 是，完成补货例外排查 |\n\n## 3. 今日新情报\n\n本次检索未发现符合“首次发现且具运营影响”标准的新事件。\n\n## 4. 已有事件的重要更新\n\n### US Q4 2026 Holiday Readiness｜amz-q4-peak-holiday-2026-deadlines\n\n- **历史事件：** US BFCM Deal 与 FBA 入仓准备节点。\n- **上次状态：** 2026-10-20 已按 minimal-shipment-splits 到仓节点和 Deal 提交节点，要求检查 Received/可售库存、Deal Health 与异常 Case；索引中 minimal-split 日期记为 2026-10-20。\n- **本次新增变化：** Amazon Seller Forums 的官方 BFCM checklist 明确 minimal-shipment-splits 的 FBA 到仓截止日为 **2026-10-21**，Amazon-optimized shipment splits 为 **2026-10-28**。因此将上次索引中的 2026-10-20 口径校正为 2026-10-21；该节点现已到期。\n- **变化原因：** Amazon 官方 Q4 checklist 对 FBA shipment-split 到仓日期作出明确说明；不是新费用或新的 Deal 规则。\n- **行动是否需要调整：** 继续 P0，但把“截止前准备”升级为“到期后异常闭环”。US 运营在 Seller Central > 库存 > 管理货件，筛选 BFCM 主推 ASIN 的 Shipped/Delivered/Receiving/Closed 状态；与 FBA Inventory 的 Available、Reserved、Inbound 对照。对预计送达已过、Received 后仍不可售或覆盖天数低于预测活动销量 1.3 倍的 ASIN，今天开/追踪 Case，并在 Deals Dashboard 验证 Deal Health。来源：[Amazon Seller Forums BFCM 2026 checklist](https://sellercentral.amazon.com/seller-forums/discussions/t/6a6f3b4a-97a8-4f04-b671-4f7a1ae6046b)。\n\n### Europe Q4 2026 peak-season inbound｜amz-eu-q4-peak-holiday-2026-deadlines\n\n- **历史事件：** 欧洲站 Prime Big Deal Days / Black Friday Week 入仓节点与旺季履约费用。\n- **上次状态：** 2026-09-28 仍按节后主推池、促销可执行性、库存和预算承接进行复查，长期索引未记录 Black Friday Week 的到仓节点已到期。\n- **本次新增变化：** Amazon 官方公告显示，DE/FR/IT/ES 的 Black Friday Week Prime-badge 相关 FBA 库存应在 **2026-10-21** 前到达欧洲设施；UK 的相应节点为 **2026-10-28**。欧陆节点今天已进入到期后执行阶段，UK 仍有 6 天补救窗口。\n- **变化原因：** Amazon 旺季履约中心将由接收入库逐步转向处理客户订单，可用入库预约窗口受限；公告未改变促销资格或费用标准。\n- **行动是否需要调整：** 欧陆升级为 P0：欧洲运营在 Seller Central > 库存 > 管理货件及 FBA Inventory 页面，按 DE/FR/IT/ES 主推 ASIN 导出货件状态、Available、Reserved、Inbound 和预计到仓日；对未接收或活动期间预测可售覆盖不足 1.3 倍的 ASIN，今天确定降预算、替代 ASIN 或非促销价格方案。UK 保持 P1：今天锁定 2026-10-28 前可到仓货件，无法达成的 SKU 不新增 Black Friday 预算。验收为每个主推 ASIN 有“可售/异常 Case/替代方案”之一。来源：[Amazon Europe peak season 2026 官方公告](https://sellercentral.amazon.com/seller-forums/discussions/t/d8c34b0b-86ed-4aec-9b0a-8be6eabb8fb0)。\n\n## 5. 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n|---|---|---|---|---|---|---|\n| P0 | 导出 BFCM 主推 ASIN 的 Manage Shipments 状态并与 FBA Inventory Available/Reserved/Inbound、Deals Dashboard Deal Health 对账；异常逐票建/追踪 Case | US | US运营/供应链 | 2026-10-22 | 100% 主推 ASIN 有货件状态、可售数、Case 编号或无异常结论；Deal Health 无未处理红项 | 2026-10-23 |\n| P0 | 导出 DE/FR/IT/ES 主推 ASIN 的货件与可售库存；对未接收或预测覆盖低于活动销量 1.3 倍的 SKU，确定降预算、替代 ASIN 或常规定价方案 | DE/FR/IT/ES | 欧洲运营/PPC/供应链 | 2026-10-22 | 每个主推 ASIN 有可售数、异常状态及一种明确承接方案；所有异常货件有 Case 或 ETA 证据 | 2026-10-23 |\n| P1 | 按 UK 主推 ASIN 倒排 2026-10-28 到仓可行性；仅保留有预约、预计到仓和覆盖天数证据的补货，其余 SKU 从 Black Friday 预算候选池移除 | UK | UK运营/供应链/PPC | 2026-10-23 | UK 补货清单 100% 含 shipment ID、预约/ETA、可售覆盖天数和保留/移除决定 | 2026-10-28 |\n\n## 6. 持续关注\n\n- **事项：** US BFCM Amazon-optimized shipment splits 到仓。**当前状态：** 2026-10-28 节点未到；minimal-split 已截止。**下次复查日期：** 2026-10-23。**触发升级条件：** 主推 ASIN 无已确认 ETA、可售覆盖低于预测活动销量 1.3 倍，或 Case 无预计解决日。\n- **事项：** UK Black Friday Week FBA 到仓。**当前状态：** 2026-10-28 前仍有补救窗口。**下次复查日期：** 2026-10-23。**触发升级条件：** 任一 UK 主推 ASIN 无预约/ETA 或预计无法在 2026-10-28 前到仓，则立即从活动预算与 Deal 候选池移除。\n- **事项：** EU Union Handling Fee。**当前状态：** 2026-11-01 起 €2/个独立商品已确认，Amazon/承运商实际计费主体未确认。**下次复查日期：** 2026-10-28。**触发升级条件：** Amazon、承运商或清关方书面确认卖家承担或新增账单，则立即重算 DE/FR/IT/ES 到岸成本与最低价。\n\n## 7. 情报边界与可信度\n\n- 本次纳入 **2 个 Amazon 官方来源页面**，无非官方来源；确认 2 项已有事件的截止日/执行阶段变化，新增事件 0 项，仍待确认事项 1 项（EU UHF 的实际计费主体）。\n- 排除了 Amazon 新闻中的企业投资、招聘、消费电子和 AWS 内容；排除了 Seller Forums 卖家个案、无新增费用/规则/日期/范围的 BFCM 重复提醒，以及与相册、手工、礼品、文具和拼图配件关联不足的监管信息。\n- BFCM 到仓节点用于判断 Prime badge 与活动库存准备，不保证单票货件必然接收、可售或获得促销资格；必须以账号内货件、库存和 Deal Health 数据为最终证据。\n", "sections": [{"date": "2026-10-22", "text": "### US Q4 2026 Holiday Readiness｜amz-q4-peak-holiday-2026-deadlines\n\n- **历史事件：** US BFCM Deal 与 FBA 入仓准备节点。\n- **上次状态：** 2026-10-20 已按 minimal-shipment-splits 到仓节点和 Deal 提交节点，要求检查 Received/可售库存、Deal Health 与异常 Case；索引中 minimal-split 日期记为 2026-10-20。\n- **本次新增变化：** Amazon Seller Forums 的官方 BFCM checklist 明确 minimal-shipment-splits 的 FBA 到仓截止日为 **2026-10-21**，Amazon-optimized shipment splits 为 **2026-10-28**。因此将上次索引中的 2026-10-20 口径校正为 2026-10-21；该节点现已到期。\n- **变化原因：** Amazon 官方 Q4 checklist 对 FBA shipment-split 到仓日期作出明确说明；不是新费用或新的 Deal 规则。\n- **行动是否需要调整：** 继续 P0，但把“截止前准备”升级为“到期后异常闭环”。US 运
