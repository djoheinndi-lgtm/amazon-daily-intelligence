已扩展到 sponsored ads 并全球可用，US campaign intelligence 将在 2026-10 上线，auto-optimization 将在 2027-01 于 US 上线。最高优先级仍是 Prime Big Deal Days 促销提交截止后的异常关闭，重点站点为 US/UK/DE/FR/IT/ES；最紧急日期是 2026-09-23 当天完成 PBDD 主推 ASIN 促销、库存和广告预算复核。Product Bundling 风险清单仍按 2026-09-25 内部截止推进，但今天没有新增官方事实。\u003c/p>\n\u003ch2>优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>影响站点\u003c/th>\n\u003cth>影响模块\u003c/th>\n\u003cth>截止/生效日期\u003c/th>\n\u003cth>今天是否需要动作\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>Prime Big Deal Days 促销截止后异常关闭\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES\u003c/td>\n\u003ctd>Deals/Coupons/PED/库存/广告预算\u003c/td>\n\u003ctd>2026-09-23 当天复查；PBDD 2026-10-06 至 2026-10-07\u003c/td>\n\u003ctd>是，逐个主推 ASIN 检查促销可执行、库存和广告预算\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Amazon Ads sponsored ads 新 AI 工具进入排期\u003c/td>\n\u003ctd>US 优先/多站点观察\u003c/td>\n\u003ctd>SP/SB/SD/Ads data manager/一方数据/竞价预算\u003c/td>\n\u003ctd>Ads data manager 全球已可用；US intelligence 2026-10；US auto-optimization 2027-01\u003c/td>\n\u003ctd>是，7 天内做小范围账号盘点，不自动放权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Product Bundling 风险清单继续推进\u003c/td>\n\u003ctd>US/多站点观察\u003c/td>\n\u003ctd>Listing/合规/库存清仓\u003c/td>\n\u003ctd>2026-09-25 完成第一版；2027-01-11 新要求生效\u003c/td>\n\u003ctd>是，按昨日口径继续导出和分层\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>今日新情报\u003c/h2>\n\u003ch3>Amazon Ads 发布 sponsored ads 新 AI 工具与一方数据扩展\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】US 优先/多站点观察\u003c/li>\n\u003cli>【发布日期】2026-09-22\u003c/li>\n\u003cli>【生效日期】Ads data manager 扩展至 sponsored ads 已全球可用；US intelligence dashboard 2026-10；US auto-optimization 2027-01\u003c/li>\n\u003cli>【信息状态】正式公告\u003c/li>\n\u003cli>【来源】Amazon Ads：\u003ca href=\"https://advertising.amazon.com/library/expert-advice/sponsored-ads-small-business-tools\" target=\"_blank\" rel=\"noopener noreferrer\">https://advertising.amazon.com/library/expert-advice/sponsored-ads-small-business-tools\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>发生了什么：Amazon Ads 公告称 sponsored ads 将新增 campaign intelligence、auto-optimization，并把 Ads data manager 的一方数据能力扩展到 sponsored ads。campaign intelligence 会在 campaign overview 页面给出 targeting、bidding、budget 相关解释和建议；auto-optimization 可在现有 campaign settings 内自动扩展商品投放、添加相关关键词并暂停低效关键词；Ads data manager 已可用于 sponsored ads，支持用网站活动、邮箱等一方数据结合 Amazon 信号。\u003c/p>\n\u003cp>我们怎么看：这不是强制改广告结构的规则，但会改变 US PPC 日常优化方式，尤其影响手工关键词收割、否定词、商品投放扩展、预算重分配和一方数据再营销。对相册、补充页、School Memory Book、Portfolio Binder 等季节性 SKU，机会在于更快捕捉 wedding、back-to-school、holiday gifting 等词包；风险是自动优化如果未设 ACOS/TACOS、库存覆盖和利润底线，可能放大低毛利或缺货 ASIN 的花费。\u003c/p>\n\u003cp>建议动作：PPC 负责人 2026-09-30 前在 US 账号建立“AI 建议复核”表，不直接开启全账号自动优化。路径按 Amazon Ads console：Campaign manager &gt; Sponsored ads &gt; Campaign overview，先抽取近 30 天 spend Top 20 的 SP/SB campaigns，记录建议类型、预估影响、是否可编辑/跳过、当前 ACOS、TACOS、CVR、库存覆盖天数和毛利率。验证方式：仅选择 3 个有库存覆盖 30 天以上、毛利率高于目标线、ACOS 低于目标 +10% 的 campaign 做人工批准测试；任何自动新增关键词必须在 7 天后核对花费、订单、ACOS 和搜索词相关性。\u003c/p>\n\u003ch2>已有事件的重要更新\u003c/h2>\n\u003ch3>Prime Big Deal Days 促销提交进入截止后异常关闭\u003c/h3>\n\u003cul>\n\u003cli>历史事件：amz-q4-peak-holiday-2026-deadlines / amz-eu-q4-peak-holiday-2026-deadlines\u003c/li>\n\u003cli>上次状态：2026-09-22 已推送为当天复查 Deal/Coupons/Prime Exclusive Discount 提交状态、可售库存、FC receiving 和 reserved units。\u003c/li>\n\u003cli>本次新增变化：2026-09-22 账号内复查日已过，今天的动作从“是否提交”转为“是否可执行、是否有库存不足、预算是否能承接流量、无 deal 资格 ASIN 是否有 Coupon/PED 兜底”。公开零售时间仍为 2026-10-06 至 2026-10-07，具体 deal 状态必须以各站点 Seller Central 后台为准。\u003c/li>\n\u003cli>变化原因：PBDD 从提报窗口后段进入执行准备期，运营风险从错过提报扩展到促销上线失败、库存不足、广告预算不足和主推 ASIN 流量承接不足。\u003c/li>\n\u003cli>行动是否需要调整：继续原动作但升级为当天异常关闭。US/UK/EU 运营今天在 Manage Deals、Coupons、Prime Exclusive Discounts、Manage Inventory、FBA Inventory 和广告 Campaign manager 交叉核对；不可执行或库存不足 ASIN 必须当天决定改 Coupon/PED、降级为常规广告承接、或退出主推池。\u003c/li>\n\u003c/ul>\n\u003ch2>今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>导出 PBDD 主推 ASIN 清单，逐个检查 Manage Deals、Coupons、Prime Exclusive Discounts 状态、可售库存、reserved units、FC receiving 和预计促销量\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES\u003c/td>\n\u003ctd>运营/PPC\u003c/td>\n\u003ctd>2026-09-23\u003c/td>\n\u003ctd>每个 ASIN 有状态、库存覆盖天数、活动链接或截图；异常 ASIN 标明兜底方式\u003c/td>\n\u003ctd>2026-09-24\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>建立 Amazon Ads AI 建议复核表，抽取近 30 天 spend Top 20 campaigns，记录 intelligence/auto-optimization 可见性和建议类型\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>PPC\u003c/td>\n\u003ctd>2026-09-30\u003c/td>\n\u003ctd>表内包含 campaign、ASIN、ACOS、TACOS、CVR、库存覆盖、建议动作、是否人工批准\u003c/td>\n\u003ctd>2026-10-03\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>继续导出疑似 bundle/kit/set/multipack/refill-page ASIN，并标记包装方、LOA、库存和处置路径\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Listing/合规\u003c/td>\n\u003ctd>2026-09-25\u003c/td>\n\u003ctd>输出 ASIN、品牌、包装方、是否有 LOA、库存数量、建议动作五列清单\u003c/td>\n\u003ctd>2026-10-15\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>持续关注\u003c/h2>\n\u003cul>\n\u003cli>事项：Product Bundling 新要求。当前状态：2027-01-11 生效口径已推送，内部清单截止 2026-09-25。下次复查日期：2026-09-25。触发升级条件：Account Health 出现 bundle listing violation、ASIN 被抑制、或供应商无法提供授权重包装文件。\u003c/li>\n\u003cli>事项：Amazon Ads sponsored ads AI 工具。当前状态：Ads data manager 已扩展到 sponsored ads；US intelligence dashboard 和 auto-optimization 仍待排期上线。下次复查日期：2026-10-03。触发升级条件：US 账号出现 campaign intelligence 面板、auto-optimization 开关、或后台给出可一键应用的 bid/keyword/product targeting 建议。\u003c/li>\n\u003cli>事项：EU Customs Reform 小包裹 handling fee。当前状态：欧盟已确认改革进入实施阶段，handling fee 金额仍待 delegated act。下次复查日期：2026-10-15。触发升级条件：欧盟公布 fee 金额、货代报价新增该费用、或 DE/FR/IT/ES 清关资料字段被退回。\u003c/li>\n\u003c/ul>\n\u003ch2>情报边界与可信度\u003c/h2>\n\u003cp>本次窗口覆盖 2026-09-22 09:03:39 至 2026-09-23 09:03:08（Asia/Shanghai）。复查来源约 15 个，其中官方/监管/一手来源 12 个，包括中国政府网/国务院办公厅、Amazon Ads、Amazon Seller Central/Forums、About Amazon、European Commission Taxation and Customs Union、CPSC、GOV.UK OPSS、USTR、CBP、EIA；非官方或行业辅助来源 3 个，仅用于发现线索与排重。纳入日报的新事件 1 条，纳入已有事件重要更新 1 条；仍待确认事项 3 条：PBDD 各账号实际可执行状态、Product Bundling 账号侧风险提醒、Amazon Ads 新工具在 US 账号的可见范围。\u003c/p>\n\u003cp>今天排除了重复的 Prime Big Deal Days 零售预热、Amazon Accelerate 参会类内容、无新增后台动作的 AI shopping 评论、与相册/纸品/礼品/收纳/拼图配件产品线无直接关系的 CPSC/OPSS 召回，以及没有官方确认的新关税传闻。以上信息没有形成新的强制后台动作，避免团队误以为漏看。\u003c/p>\n\u003cp>工作日门禁来源：中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（\u003ca href=\"https://big5.www.gov.cn/gate/big5/www.gov.cn/zhengce/zhengceku/202511/content_7047091.htm）。2026-09-23\" target=\"_blank\" rel=\"noopener noreferrer\">https://big5.www.gov.cn/gate/big5/www.gov.cn/zhengce/zhengceku/202511/content_7047091.htm）。2026-09-23\u003c/a> 为周三，不在中秋节 2026-09-25 至 2026-09-27 假期内，因此按中国大陆法定工作日运行。本周最后一个大陆法定工作日为 2026-09-24，今天不生成周报。\u003c/p>\n\u003cp>生产链接：\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-23\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-09-23", "text": "### Amazon Ads 发布 sponsored ads 新 AI 工具与一方数据扩展\n\n- 【影响等级】P2\n- 【站点】US 优先/多站点观察\n- 【发布日期】2026-09-22\n- 【生效日期】Ads data manager 扩展至 sponsored ads 已全球可用；US intelligence dashboard 2026-10；US auto-optimization 2027-01\n- 【信息状态】正式公告\n- 【来源】Amazon Ads：https://advertising.amazon.com/library/expert-advice/sponsored-ads-small-business-tools\n\n发生了什么：Amazon Ads 公告称 sponsored ads 将新增 campaign intelligence、auto-optimization，并把 Ads data manager 的一方数据能力扩展到 sponsored ads。campaign intelligence 会在 campaign overview 页面给出 targeting、bidding、budget 相关解释和建议；auto-optimization 可在现有 campaign settings 内自动扩展商品投放、添加相关关键词并暂停低效关键词；Ads data manager 已可用于 sponsored ads，支持用网站活动、邮箱等一方数据结合 Amazon 信号。\n\n我们怎么看：这不是强制改广告结构的规则，但会改变 US PPC 日常优化方式，尤其影响手工关键词收割、否定词、商品投放扩展、预算重分配和一方数据再营销。对相册、补充页、School Memory Book、Portfolio Binder 等季节性 SKU，机会在于更快捕捉 wedding、back-to-school、holiday gifting 等词包；风险是自动优化如果未设 ACOS/TACOS、库存覆盖和利润底线，可能放大低毛利或缺货 ASIN 的花费。\n\n建议动作：PPC 负责人 2026-09-30 前在 US 账号建立“AI 建议复核”表，不直接开启全账号自动优化。路径按 Amazon Ads console：Campaign manager > Sponsored ads > Campaign overview，先抽取近 30 天 spend Top 20 的 SP/SB campaigns，记录建议类型、预估影响、是否可编辑/跳过、当前 ACOS、TACOS、CVR、库存覆盖天数和毛利率。验证方式：仅选择 3 个有库存覆盖 30 天以上、毛利率高于目标线、ACOS 低于目标 +10% 的 campaign 做人工批准测试；任何自动新增关键词必须在 7 天后核对花费、订单、ACOS 和搜索词相关性。\n\n", "title": "Amazon Ads 发布 sponsored ads 新 AI 工具与一方数据扩展", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-23\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-23\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { p /p>\n\u003cp>建议动作：PPC 负责人 2026-09-30 前在 US 账号建立“AI 建议复核”表，不直接开启全账号自动优化。路径按 Amazon Ads console：Campaign manager &gt; Sponsored ads &gt; Campaign overview，先抽取近 30 天 spend Top 20 的 SP/SB campaigns，记录建议类型、预估影响、是否可编辑/跳过、当前 ACOS、TACOS、CVR、库存覆盖天数和毛利率。验证方式：仅选择 3 个有库存覆盖 30 天以上、毛利率高于目标线、ACOS 低于目标 +10% 的 campaign 做人工批准测试；任何自动新增关键词必须在 7 天后核对花费、订单、ACOS 和搜索词相关性。\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-23\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-23", "text": "### Prime Big Deal Days 促销提交进入截止后异常关闭\n\n- 历史事件：amz-q4-peak-holiday-2026-deadlines / amz-eu-q4-peak-holiday-2026-deadlines\n- 上次状态：2026-09-22 已推送为当天复查 Deal/Coupons/Prime Exclusive Discount 提交状态、可售库存、FC receiving 和 reserved units。\n- 本次新增变化：2026-09-22 账号内复查日已过，今天的动作从“是否提交”转为“是否可执行、是否有库存不足、预算是否能承接流量、无 deal 资格 ASIN 是否有 Coupon/PED 兜底”。公开零售时间仍为 2026-10-06 至 2026-10-07，具体 deal 状态必须以各站点 Seller Central 后台为准。\n- 变化原因：PBDD 从提报窗口后段进入执行准备期，运营风险从错过提报扩展到促销上线失败、库存不足、广告预算不足和主推 ASIN 流量承接不足。\n- 行动是否需要调整：继续原动作但升级为当天异常关闭。US/UK/EU 运营今天在 Manage Deals、Coupons、Prime Exclusive Discounts、Manage Inventory、FBA Inventory 和广告 Campaign manager 交叉核对；不可执行或库存不足 ASIN 必须当天决定改 Coupon/PED、降级为常规广告承接、或退出主推池。\n\n", "title": "Prime Big Deal Days 促销提交进入截止后异常关闭", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-23\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-23\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch3>Prime Big Deal Days 促销提交进入截止后异常关闭\u003c/h3>\n\u003cul>\n\u003cli>历史事件：amz-q4-peak-holiday-2026-deadlines / amz-eu-q4-peak-holiday-2026-deadlines\u003c/li>\n\u003cli>上次状态：2026-09-22 已推送为当天复查 Deal/Coupons/Prime Exclusive Discount 提交状态、可售库存、FC receiving 和 reserved units。\u003c/li>\n\u003cli>本次新增变化：2026-09-22 账号内复查日已过，今天的动作从“是否提交”转为“是否可执行、是否有库存不足、预算是否能承接流量、无 deal 资格 ASIN 是否有 Coupon/PED 兜底”。公开零售时间仍为 2026-10-06 至 2026-10-07，具体 deal 状态必须以各站点 Seller Central 后台为准。\u003c/li>\n\u003cli>变化原因：PBDD 从提报窗口后段进入执行准备期，运营风险从错过提报扩展到促销上线失败、库存不足、广告预算不足和主推 ASIN 流量承接不足。\u003c/li>\n\u003cli>行动是否需要调整：继续原动作但升级为当天异常关闭。US/UK/EU 运营今天在 Manage Deals、Coupons、Prime Exclusive Discounts、Manage Inventory、FBA Inventory 和广告 Campaign manager 交叉核对；不可执行或库存不足 ASIN 必须当天决定改 Coupon/PED、降级为常规广告承接、或退出主推池。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-23\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}]}, {"date": "2026-09-22", "text": "# 亚马逊及海外市场情报增量日报｜2026-09-22\n\n## 今日判断\n\n今日有两项需要团队更新判断：EU Customs Reform 已在 2026-09-21 进入实施阶段，EU 跨境低货值包裹的数据、责任主体和成本模型要继续前置准备；Amazon Product Bundling 的执行节点查到更明确的 2027-01-11 要求，和此前索引中按 2026-09-30 跟踪的口径不一致，需要今天纠偏。今天没有发现 Amazon US/UK/DE/FR/IT/ES 对 Listing、图片、A+、Search Terms、属性、FBA 费用或 Amazon Ads SP/SB/SD/DSP/AMC 发布新的全量强制规则。最高优先级是 US bundle/kit/set/multipack/refill-page ASIN 风险清单，重点站点为 US 与 EU；最紧急日期是 2026-09-22 Prime Big Deal Days deal submission 账号内复查，以及 2026-09-25 前完成 Product Bundling 风险清单第一版。\n\n## 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n|---|---|---|---|---|---|\n| P1 | Product Bundling 新要求纠偏并重做 bundle 风险清单 | US/多站点观察 | Listing/合规/库存清仓 | 2027-01-11 生效；2026-09-25 完成内部清单 | 是，今天导出疑似 bundle/kit/set/multipack/refill-page ASIN |\n| P1 | Prime Big Deal Days deal submission 与促销库存复查 | US/UK/DE/FR/IT/ES 账号侧 | Deals/Coupons/库存/广告预算 | 2026-09-22 账号内复查 | 是，检查未提交 Best Deal/Lightning Deal 与库存不足 ASIN |\n| P2 | EU Customs Reform 进入实施阶段 | DE/FR/IT/ES/EU | 关务/税费/物流/产品合规 | 2026-09-21 起逐步实施；2028-07-01 电商使用 Data Hub | 是，更新 EU 低货值包裹与平台责任 watchlist |\n\n## 今日新情报\n\n### EU Customs Reform 正式进入实施阶段\n\n- 【影响等级】P2\n- 【站点】DE/FR/IT/ES/EU\n- 【发布日期】2026-09-21\n- 【生效日期】2026-09-21 起逐步实施；EU Customs Data Hub 对电商强制时间为 2028-07-01\n- 【信息状态】正式公告\n- 【来源】European Commission Taxation and Customs Union：https://taxation-customs.ec.europa.eu/customs/eu-customs-reform_en\n\n发生了什么：欧盟公告称 Customs Reform 已进入实施阶段，并确认改革包含 EU Customs Authority、EU Customs Data Hub、低货值电商包裹规则、平台/卖家/承运人责任调整。页面同时重申 2026-07-01 起低货值线上购买商品已适用临时 3 欧元 customs duty，2026-11-01 前后还会引入小包裹 handling fee，电商经营者 2028 年开始接入 Data Hub。\n\n我们怎么看：这不是今天立刻改 Amazon Listing 的事项，但会影响 DE/FR/IT/ES 跨境小包、低价配件、补充页、礼品套装的 landed cost、申报字段和合规责任。对从中国直发 EU 或使用海外仓补货的 SKU，后续更容易因 HS code、原产地、IOSS/VAT、产品合规文件不一致而出现清关延迟或成本偏差。\n\n建议动作：供应链负责人 2026-09-30 前向货代/ERP 确认 EU 订单申报字段是否已覆盖 HS code、原产地、申报价值、IOSS/VAT、产品责任方和平台订单号；财务在 2026-10-08 前把低货值包裹 3 欧元 customs duty 与未来 handling fee 单独放入 EU landed-cost 模型。验证方式：抽取 DE/FR/IT/ES 最近 30 天跨境发货订单 20 单，检查申报字段完整率达到 100%，并在成本模型中新增 EU customs reform 参数。\n\n## 已有事件的重要更新\n\n### Product Bundling 新要求纠偏\n\n- 历史事件：amazon-us-product-bundling-policy-2026-09-30\n- 上次状态：此前索引按 2026-09-30 生效节点跟踪 US Product Bundling 风险清单，重点关注 bundle、kit、set、multipack、refill pages 和变体关系。\n- 本次新增变化：Amazon Seller Forums / News_Amazon 公告显示，新 Product Bundling 要求明确为 2027-01-11 生效；多数以单一 ASIN 销售的 product bundle 必须由原制造商或品牌方包装。非原品牌/制造商包装的组合仍可在授权重新包装、gifting browse nodes、camera product types、Virtual Bundles 等场景下保留，违规 bundle 在 2027-01-11 后可能被停用并进入 Account Health listing violation。\n- 变化原因：Amazon 将 bundle 合规重点从“组合商品是否可售”进一步明确到“是否由原制造商/品牌配置或有授权重包装证据”，以降低真实性与安全风险。\n- 行动是否需要调整：升级并改截止日。不要再只按 2026-09-30 做一次性观察；Listing/合规今天开始重做 bundle 风险清单，2026-09-25 前完成第一版，2026-10-15 前确认是否有授权 letter of authorization、是否应拆成单品/Virtual Bundle/促销组合，2026-12-15 前完成非合规库存清仓或移除计划。来源：https://sellercentral.amazon.com/seller-forums/discussions/t/da850a57-839d-4e38-a96f-298dbc450b69\n\n### Prime Big Deal Days 促销提交与库存节点复查\n\n- 历史事件：amz-q4-peak-holiday-2026-deadlines / amz-eu-q4-peak-holiday-2026-deadlines\n- 上次状态：2026-09-16 US/UK PBDD 入仓节点已过，跟踪重点转为 Deal ASIN 可售库存、FC receiving、reserved units 和促销后台可执行状态。\n- 本次新增变化：账号侧需要在 2026-09-22 当天复查 Best Deal、Lightning Deal、Prime Exclusive Discount 与 Coupon 是否仍有未提交、库存不足或不可执行状态；公开 Seller Central 信息显示 PBDD 时间为 2026-10-06 至 2026-10-07，Deal submission 截止点需要以账号后台为准。\n- 变化原因：促销提交窗口进入最后检查日，风险从“货是否到仓”转为“促销是否可执行、库存是否足够、广告预算是否跟得上”。\n- 行动是否需要调整：继续原动作但压缩到当天完成。运营负责人今天在 Advertising/Deals、Coupons、Manage Inventory、FBA Inventory 四处交叉核对，未提交或库存不足 ASIN 直接升级到运营晨会；无 deal 资格的主力 ASIN 用 Coupon 或 Prime Exclusive Discount 兜底，不再临时大幅改主图或标题。\n\n## 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n|---|---|---|---|---|---|---|\n| P1 | 导出 Manage All Inventory，筛选标题或 SKU 含 bundle、kit、set、multipack、refill、pack、combo、gift set 的 ASIN，并标记是否原厂/品牌包装 | US | Listing/合规 | 2026-09-25 | 输出 ASIN、品牌、包装方、是否有 LOA、库存数量、建议动作五列清单 | 2026-10-15 |\n| P1 | 在 Manage Deals/Coupons/Prime Exclusive Discounts 检查 PBDD 主推 ASIN 提交状态、库存不足提示和活动可执行状态 | US/UK/EU | 运营/PPC | 2026-09-22 | 每个主推 ASIN 有状态截图；库存不足 ASIN 标出可售库存、reserved units、预计促销量 | 2026-09-23 |\n| P2 | 更新 EU landed-cost 模型，新增 3 欧元低货值 duty、未来 handling fee 占位字段和 Data Hub 合规字段检查 | DE/FR/IT/ES | 供应链/财务 | 2026-10-08 | EU 模板新增 customs reform 参数；抽样 20 单申报字段完整率 100% | 2026-10-15 |\n\n## 持续关注\n\n- 事项：Product Bundling 新要求。当前状态：2027-01-11 生效口径已明确，但账号内是否已有风险提醒待确认。下次复查日期：2026-09-25。触发升级条件：Account Health 出现 bundle listing violation、ASIN 被抑制、或供应商无法提供授权重包装文件。\n- 事项：EU Customs Reform 小包裹 handling fee。当前状态：欧盟确认 2026-11-01 前后会引入 small parcels handling fee，但金额需等待 delegated act。下次复查日期：2026-10-15。触发升级条件：欧盟公布 fee 金额、货代报价新增该费用、或 DE/FR/IT/ES 清关资料字段被退回。\n- 事项：商业责任险 2026-11-02 要求。当前状态：本次未见新的 Amazon 官方公开解释；仍需账号后台确认是否适用。下次复查日期：2026-09-25。触发升级条件：Seller Central 出现强制保险通知、AIA 上传入口或 Account Health 截止日。\n\n## 情报边界与可信度\n\n本次窗口覆盖 2026-09-21 09:04:19 至 2026-09-22 09:03:39（Asia/Shanghai）。复查来源约 16 个，其中官方/监管/一手来源 11 个，包括中国政府网/国务院办公厅、Amazon Seller Central/Forums/Seller News、Amazon Ads、About Amazon、European Commission Taxation and Customs Union、CPSC、GOV.UK OPSS、EIA/BLS、Drewry/NRF；非官方或行业辅助来源 5 个，仅用于发现线索与排重。纳入日报的新事件 1 条，纳入已有事件重要更新 2 条；仍待确认事项 3 条：PBDD 账号内提交状态、Product Bundling 账号风险提醒、商业责任险账号适用范围。\n\n今天排除了 Amazon Accelerate 参会提醒、Seller Central UI 反馈、重复 PBDD 零售预热、AHR/FBM 客服积分旧贴、与当前产品线无直接关系的召回信息，以及无新增事实的 AI shopping/广告行业评论。以上信息没有形成新的强制后台动作，避免团队误以为漏看。\n\n工作日门禁来源：中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-22 为周二，不在中秋节 2026-09-25 至 2026-09-27 假期内，因此按中国大陆法定工作日运行。本周最后一个大陆法定工作日为 2026-09-24，今天不生成周报。\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-22\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-22\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报增量日报｜2026-09-22\u003c/h1>\n\u003ch2>今日判断\u003c/h2>\n\u003cp>今日有两项需要团队更新判断：EU Customs Reform 已在 2026-09-21 进入实施阶段，EU 跨境低货值包裹的数据、责任主体和成本模型要继续前置准备；Amazon Product Bundling 的执行节点查到更明确的 2027-01-11 要求，和此前索引中按 2026-09-30 跟踪的口径不一致，需要今天纠偏。今天没有发现 Amazon US/UK/DE/FR/IT/ES 对 Listing、图片、A+、Search Terms、属性、FBA 费用或 Amazon Ads SP/SB/SD/DSP/AMC 发布新的全量强制规则。最高优先级是 US bundle/kit/set/multipack/refill-page ASIN 风险清单，重点站点为 US 与 EU；最紧急日期是 2026-09-22 Prime Big Deal Days deal submission 账号内复查，以及 2026-09-25 前完成 Product Bundling 风险清单第一版。\u003c/p>\n\u003ch2>优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>影响站点\u003c/th>\n\u003cth>影响模块\u003c/th>\n\u003cth>截止/生效日期\u003c/th>\n\u003cth>今天是否需要动作\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>Product Bundling 新要求纠偏并重做 bundle 风险清单\u003c/td>\n\u003ctd>US/多站点观察\u003c/td>\n\u003ctd>Listing/合规/库存清仓\u003c/td>\n\u003ctd>2027-01-11 生效；2026-09-25 完成内部清单\u003c/td>\n\u003ctd>是，今天导出疑似 bundle/kit/set/multipack/refill-page ASIN\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>Prime Big Deal Days deal submission 与促销库存复查\u003c/td>\n\u003ctd>US/UK/DE/FR/IT/ES 账号侧\u003c/td>\n\u003ctd>Deals/Coupons/库存/广告预算\u003c/td>\n\u003ctd>2026-09-22 账号内复查\u003c/td>\n\u003ctd>是，检查未提交 Best Deal/Lightning Deal 与库存不足 ASIN\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>EU Customs Reform 进入实施阶段\u003c/td>\n\u003ctd>DE/FR/IT/ES/EU\u003c/td>\n\u003ctd>关务/税费/物流/产品合规\u003c/td>\n\u003ctd>2026-09-21 起逐步实施；2028-07-01 电商使用 Data Hub\u003c/td>\n\u003ctd>是，更新 EU 低货值包裹与平台责任 watchlist\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>今日新情报\u003c/h2>\n\u003ch3>EU Customs Reform 正式进入实施阶段\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】DE/FR/IT/ES/EU\u003c/li>\n\u003cli>【发布日期】2026-09-21\u003c/li>\n\u003cli>【生效日期】2026-09-21 起逐步实施；EU Customs Data Hub 对电商强制时间为 2028-07-01\u003c/li>\n\u003cli>【信息状态】正式公告\u003c/li>\n\u003cli>【来源】European Commission Taxation and Customs Union：\u003ca href=\"https://taxation-customs.ec.europa.eu/customs/eu-customs-reform_en\" target=\"_blank\" rel=\"noopener noreferrer\">https://taxation-customs.ec.europa.eu/customs/eu-customs-reform_en\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>发生了什么：欧盟公告称 Customs Reform 已进入实施阶段，并确认改革包含 EU Customs Authority、EU Customs Data Hub、低货值电商包裹规则、平台/卖家/承运人责任调整。页面同时重申 2026-07-01 起低货值线上购买商品已适用临时 3 欧元 customs duty，2026-11-01 前后还会引入小包裹 handling fee，电商经营者 2028 年开始接入 Data Hub。\u003c/p>\n\u003cp>我们怎么看：这不是今天立刻改 Amazon Listing 的事项，但会影响 DE/FR/IT/ES 跨境小包、低价配件、补充页、礼品套装的 landed cost、申报字段和合规责任。对从中国直发 EU 或使用海外仓补货的 SKU，后续更容易因 HS code、原产地、IOSS/VAT、产品合规文件不一致而出现清关延迟或成本偏差。\u003c/p>\n\u003cp>建议动作：供应链负责人 2026-09-30 前向货代/ERP 确认 EU 订单申报字段是否已覆盖 HS code、原产地、申报价值、IOSS/VAT、产品责任方和平台订单号；财务在 2026-10-08 前把低货值包裹 3 欧元 customs duty 与未来 handling fee 单独放入 EU landed-cost 模型。验证方式：抽取 DE/FR/IT/ES 最近 30 天跨境发货订单 20 单，检查申报字段完整率达到 100%，并在成本模型中新增 EU customs reform 参数。\u003c/p>\n\u003ch2>已有事件的重要更新\u003c/h2>\n\u003ch3>Product Bundling 新要求纠偏\u003c/h3>\n\u003cul>\n\u003cli>历史事件：amazon-us-product-bundling-policy-2026-09-30\u003c/li>\n\u003cli>上次状态：此前索引按 2026-09-30 生效节点跟踪 US Product Bundling 风险清单，重点关注 bundle、kit、set、multipack、refill pages 和变体关系。\u003c/li>\n\u003cli>本次新增变化：Amazon Seller Forums / News_Amazon 公告显示，新 Product Bundling 要求明确为 2027-01-11 生效；多数以单一 ASIN 销售的 product bundle 必须由原制造商或品牌方包装。非原品牌/制造商包装的组合仍可在授权重新包装、gifting browse nodes、camera product types、Virtual Bundles 等场景下保留，违规 bundle 在 2027-01-11 后可能被停用并进入 Account Health listing violation。\u003c/li>\n\u003cli>变化原因：Amazon 将 bundle 合规重点从“组合商品是否可售”进一步明确到“是否由原制造商/品牌配置或有授权重包装证据”，以降低真实性与安全风险。\u003c/li>\n\u003cli>行动是否需要调整：升级并改截止日。不要再只按 2026-09-30 做一次性观察；Listing/合规今天开始重做 bundle 风险清单，2026-09-25 前完成第一版，2026-10-15 前确认是否有授权 letter of authorization、是否应拆成单品/Virtual Bundle/促销组合，2026-12-15 前完成非合规库存清仓或移除计划。来源：\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/da850a57-839d-4e38-a96f-298dbc450b69\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/seller-forums/discussions/t/da850a57-839d-4e38-a96f-298dbc450b69\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch3>Prime Big Deal Days 促销提交与库存节点复查\u003c/h3>\n\u003cul>\n\u003cli>历史事件：amz-q4-peak-holiday-2026-deadlines / amz-eu-q4-peak-holiday-2026-deadlines\u003c/li>\n\u003cli>上次状态：2026-09-16 US/UK PBDD 入仓节点已过，跟踪重点转为 Deal ASIN 可售库存、FC receiving、reserved units 和促销后台可执行状态。\u003c/li>\n\u003cli>本次新增变化：账号侧需要在 2026-09-22 当天复查 Best Deal、Lightning Deal、Prime Exclusive Discount 与 Coupon 是否仍有未提交、库存不足或不可执行状态；公开 Seller Central 信息显示 PBDD 时间为 2026-10-06 至 2026-10-07，Deal submission 截止点需要以账号后台为准。\u003c/li>\n\u003cli>变化原因：促销提交窗口进入最后检查日，风险从“货是否到仓”转为“促销是否可执行、库存是否足够、广告预算是否跟得上”。\u003c/li>\n\u003cli>行动是否需要调整：继续原动作但压缩到当天完成。运营负责人今天在 Advertising/Deals、Coupons、Manage Inventory、FBA Inventory 四处交叉核对，未提交或库存不足 ASIN 直接升级到运营晨会；无 deal 资格的主力 ASIN 用 Coupon 或 Prime Exclusive Discount 兜底，不再临时大幅改主图或标题。\u003c/li>\n\u003c/ul>\n\u003ch2>今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>导出 Manage All Inventory，筛选标题或 SKU 含 bundle、kit、set、multipack、refill、pack、combo、gift set 的 ASIN，并标记是否原厂/品牌包装\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Listing/合规\u003c/td>\n\u003ctd>2026-09-25\u003c/td>\n\u003ctd>输出 ASIN、品牌、包装方、是否有 LOA、库存数量、建议动作五列清单\u003c/td>\n\u003ctd>2026-10-15\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>在 Manage Deals/Coupons/Prime Exclusive Discounts 检查 PBDD 主推 ASIN 提交状态、库存不足提示和活动可执行状态\u003c/td>\n\u003ctd>US/UK/EU\u003c/td>\n\u003ctd>运营/PPC\u003c/td>\n\u003ctd>2026-09-22\u003c/td>\n\u003ctd>每个主推 ASIN 有状态截图；库存不足 ASIN 标出可售库存、reserved units、预计促销量\u003c/td>\n\u003ctd>2026-09-23\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>更新 EU landed-cost 模型，新增 3 欧元低货值 duty、未来 handling fee 占位字段和 Data Hub 合规字段检查\u003c/td>\n\u003ctd>DE/FR/IT/ES\u003c/td>\n\u003ctd>供应链/财务\u003c/td>\n\u003ctd>2026-10-08\u003c/td>\n\u003ctd>EU 模板新增 customs reform 参数；抽样 20 单申报字段完整率 100%\u003c/td>\n\u003ctd>2026-10-15\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>持续关注\u003c/h2>\n\u003cul>\n\u003cli>事项：Product Bundling 新要求。当前状态：2027-01-11 生效口径已明确，但账号内是否已有风险提醒待确认。下次复查日期：2026-09-25。触发升级条件：Account Health 出现 bundle listing violation、ASIN 被抑制、或供应商无法提供授权重包装文件。\u003c/li>\n\u003cli>事项：EU Customs Reform 小包裹 handling fee。当前状态：欧盟确认 2026-11-01 前后会引入 small parcels handling fee，但金额需等待 delegated act。下次复查日期：2026-10-15。触发升级条件：欧盟公布 fee 金额、货代报价新增该费用、或 DE/FR/IT/ES 清关资料字段被退回。\u003c/li>\n\u003cli>事项：商业责任险 2026-11-02 要求。当前状态：本次未见新的 Amazon 官方公开解释；仍需账号后台确认是否适用。下次复查日期：2026-09-25。触发升级条件：Seller Central 出现强制保险通知、AIA 上传入口或 Account Health 截止日。\u003c/li>\n\u003c/ul>\n\u003ch2>情报边界与可信度\u003c/h2>\n\u003cp>本次窗口覆盖 2026-09-21 09:04:19 至 2026-09-22 09:03:39（Asia/Shanghai）。复查来源约 16 个，其中官方/监管/一手来源 11 个，包括中国政府网/国务院办公厅、Amazon Seller Central/Forums/Seller News、Amazon Ads、About Amazon、European Commission Taxation and Customs Union、CPSC、GOV.UK OPSS、EIA/BLS、Drewry/NRF；非官方或行业辅助来源 5 个，仅用于发现线索与排重。纳入日报的新事件 1 条，纳入已有事件重要更新 2 条；仍待确认事项 3 条：PBDD 账号内提交状态、Product Bundling 账号风险提醒、商业责任险账号适用范围。\u003c/p>\n\u003cp>今天排除了 Amazon Accelerate 参会提醒、Seller Central UI 反馈、重复 PBDD 零售预热、AHR/FBM 客服积分旧贴、与当前产品线无直接关系的召回信息，以及无新增事实的 AI shopping/广告行业评论。以上信息没有形成新的强制后台动作，避免团队误以为漏看。\u003c/p>\n\u003cp>工作日门禁来源：中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（\u003ca href=\"https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-22\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。2026-09-22\u003c/a> 为周二，不在中秋节 2026-09-25 至 2026-09-27 假期内，因此按中国大陆法定工作日运行。本周最后一个大陆法定工作日为 2026-09-24，今天不生成周报。\u003c/p>\n\u003cp>生产链接：\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-22\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-09-22", "text": "### EU Customs Reform 正式进入实施阶段\n\n- 【影响等级】P2\n- 【站点】DE/FR/IT/ES/EU\n- 【发布日期】2026-09-21\n- 【生效日期】2026-09-21 起逐步实施；EU Customs Data Hub 对电商强制时间为 2028-07-01\n- 【信息状态】正式公告\n- 【来源】European Commission Taxation and Customs Union：https://taxation-customs.ec.europa.eu/customs/eu-customs-reform_en\n\n发生了什么：欧盟公告称 Customs Reform 已进入实施阶段，并确认改革包含 EU Customs Authority、EU Customs Data Hub、低货值电商包裹规则、平台/卖家/承运人责任调整。页面同时重申 2026-07-01 起低货值线上购买商品已适用临时 3 欧元 customs duty，2026-11-01 前后还会引入小包裹 handling fee，电商经营者 2028 年开始接入 Data Hub。\n\n我们怎么看：这不是今天立刻改 Amazon Listing 的事项，但会影响 DE/FR/IT/ES 跨境小包、低价配件、补充页、礼品套装的 landed cost、申报字段和合规责任。对从中国直发 EU 或使用海外仓补货的 SKU，后续更容易因 HS code、原产地、IOSS/VAT、产品合规文件不一致而出现清关延迟或成本偏差。\n\n建议动作：供应链负责人 2026-09-30 前向货代/ERP 确认 EU 订单申报字段是否已覆盖 HS code、原产地、申报价值、IOSS/VAT、产品责任方和平台订单号；财务在 2026-10-08 前把低货值包裹 3 欧元 customs duty 与未来 handling fee 单独放入 EU landed-cost 模型。验证方式：抽取 DE/FR/IT/ES 最近 30 天跨境发货订单 20 单，检查申报字段完整率达到 100%，并在成本模型中新增 EU customs reform 参数。\n\n", "title": "EU Customs Reform 正式进入实施阶段", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-22\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-22\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    . 026-11-01 前后还会引入小包裹 handling fee，电商经营者 2028 年开始接入 Data Hub。\u003c/p>\n\u003cp>我们怎么看：这不是今天立刻改 Amazon Listing 的事项，但会影响 DE/FR/IT/ES 跨境小包、低价配件、补充页、礼品套装的 landed cost、申报字段和合规责任。对从中国直发 EU 或使用海外仓补货的 SKU，后续更容易因 HS code、原产地、IOSS/VAT、产品合规文件不一致而出现清关延迟或成本偏差。\u003c/p>\n\u003cp>建议动作：供应链负责人 2026-09-30 前向货代/ERP 确认 EU 订单申报字段是否已覆盖 HS code、原产地、申报价值、IOSS/VAT、产品责任方和平台订单号；财务在 2026-10-08 前把低货值包裹 3 欧元 customs duty 与未来 handling fee 单独放入 EU landed-cost 模型。验证方式：抽取 DE/FR/IT/ES 最近 30 天跨境发货订单 20 单，检查申报字段完整率达到 100%，并在成本模型中新增 EU customs reform 参数。\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-22\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-22", "text": "### Product Bundling 新要求纠偏\n\n- 历史事件：amazon-us-product-bundling-policy-2026-09-30\n- 上次状态：此前索引按 2026-09-30 生效节点跟踪 US Product Bundling 风险清单，重点关注 bundle、kit、set、multipack、refill pages 和变体关系。\n- 本次新增变化：Amazon Seller Forums / News_Amazon 公告显示，新 Product Bundling 要求明确为 2027-01-11 生效；多数以单一 ASIN 销售的 product bundle 必须由原制造商或品牌方包装。非原品牌/制造商包装的组合仍可在授权重新包装、gifting browse nodes、camera product types、Virtual Bundles 等场景下保留，违规 bundle 在 2027-01-11 后可能被停用并进入 Account Health listing violation。\n- 变化原因：Amazon 将 bundle 合规重点从“组合商品是否可售”进一步明确到“是否由原制造商/品牌配置或有授权重包装证据”，以降低真实性与安全风险。\n- 行动是否需要调整：升级并改截止日。不要再只按 2026-09-30 做一次性观察；Listing/合规今天开始重做 bundle 风险清单，2026-09-25 前完成第一版，2026-10-15 前确认是否有授权 letter of authorization、是否应拆成单品/Virtual Bundle/促销组合，2026-12-15 前完成非合规库存清仓或移除计划。来源：https://sellercentral.amazon.com/seller-forums/discussions/t/da850a57-839d-4e38-a96f-298dbc450b69\n\n", "title": "Product Bundling 新要求纠偏", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-22\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-22\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc;  ASIN 销售的 product bundle 必须由原制造商或品牌方包装。非原品牌/制造商包装的组合仍可在授权重新包装、gifting browse nodes、camera product types、Virtual Bundles 等场景下保留，违规 bundle 在 2027-01-11 后可能被停用并进入 Account Health listing violation。\u003c/li>\n\u003cli>变化原因：Amazon 将 bundle 合规重点从“组合商品是否可售”进一步明确到“是否由原制造商/品牌配置或有授权重包装证据”，以降低真实性与安全风险。\u003c/li>\n\u003cli>行动是否需要调整：升级并改截止日。不要再只按 2026-09-30 做一次性观察；Listing/合规今天开始重做 bundle 风险清单，2026-09-25 前完成第一版，2026-10-15 前确认是否有授权 letter of authorization、是否应拆成单品/Virtual Bundle/促销组合，2026-12-15 前完成非合规库存清仓或移除计划。来源：\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/da850a57-839d-4e38-a96f-298dbc450b69\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/seller-forums/discussions/t/da850a57-839d-4e38-a96f-298dbc450b69\u003c/a>\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-22\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"date": "2026-09-22", "text": "### Prime Big Deal Days 促销提交与库存节点复查\n\n- 历史事件：amz-q4-peak-holiday-2026-deadlines / amz-eu-q4-peak-holiday-2026-deadlines\n- 上次状态：2026-09-16 US/UK PBDD 入仓节点已过，跟踪重点转为 Deal ASIN 可售库存、FC receiving、reserved units 和促销后台可执行状态。\n- 本次新增变化：账号侧需要在 2026-09-22 当天复查 Best Deal、Lightning Deal、Prime Exclusive Discount 与 Coupon 是否仍有未提交、库存不足或不可执行状态；公开 Seller Central 信息显示 PBDD 时间为 2026-10-06 至 2026-10-07，Deal submission 截止点需要以账号后台为准。\n- 变化原因：促销提交窗口进入最后检查日，风险从“货是否到仓”转为“促销是否可执行、库存是否足够、广告预算是否跟得上”。\n- 行动是否需要调整：继续原动作但压缩到当天完成。运营负责人今天在 Advertising/Deals、Coupons、Manage Inventory、FBA Inventory 四处交叉核对，未提交或库存不足 ASIN 直接升级到运营晨会；无 deal 资格的主力 ASIN 用 Coupon 或 Prime Exclusive Discount 兜底，不再临时大幅改主图或标题。\n\n", "title": "Prime Big Deal Days 促销提交与库存节点复查", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-22\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-22\u003c/title>\n  \u003csty its 和促销后台可执行状态。\u003c/li>\n\u003cli>本次新增变化：账号侧需要在 2026-09-22 当天复查 Best Deal、Lightning Deal、Prime Exclusive Discount 与 Coupon 是否仍有未提交、库存不足或不可执行状态；公开 Seller Central 信息显示 PBDD 时间为 2026-10-06 至 2026-10-07，Deal submission 截止点需要以账号后台为准。\u003c/li>\n\u003cli>变化原因：促销提交窗口进入最后检查日，风险从“货是否到仓”转为“促销是否可执行、库存是否足够、广告预算是否跟得上”。\u003c/li>\n\u003cli>行动是否需要调整：继续原动作但压缩到当天完成。运营负责人今天在 Advertising/Deals、Coupons、Manage Inventory、FBA Inventory 四处交叉核对，未提交或库存不足 ASIN 直接升级到运营晨会；无 deal 资格的主力 ASIN 用 Coupon 或 Prime Exclusive Discount 兜底，不再临时大幅改主图或标题。\u003c/li>\n\u003c/ul>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-22\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"}]}, {"date": "2026-09-21", "text": "# 亚马逊及海外市场情报增量日报｜2026-09-21\n\n## 今日判断\n\n今日无重大运营变化。本次窗口覆盖 2026-09-20 09:14:58 至 2026-09-21 09:04:19（Asia/Shanghai），未发现 Amazon US/UK/DE/FR/IT/ES 对 Seller Central Listing、图片、A+、Search Terms、属性、变体、FBA 费用、库存限制或 Amazon Ads SP/SB/SD/DSP/AMC 计费、竞价、匹配规则发布新的全量强制变更。今天最高优先级不是改 Listing 或广告结构，而是为 2026-09-22 的三项复查做数据准备：US/UK PBDD 促销 ASIN 库存、US Product Bundling 风险清单、商业责任险账号侧证据。重点站点为 US 和 UK；本周最紧急的公开节点仍是 2026-09-30 US Product Bundling 生效前的风险清单收口。\n\n## 持续关注\n\n- 事项：US/UK Prime Big Deal Days 与 Q4 促销 ASIN 入仓节点后库存复查。当前状态：2026-09-16 入仓节点已过，本次窗口未见 Amazon 新增公开日期或政策变化；风险集中在账号内 available units、reserved units、FC receiving 和 Manage Deals/Coupons 可执行状态。下次复查日期：2026-09-22。触发升级条件：任一 PBDD/Deal ASIN 可售库存低于目标促销量 90%，FC receiving 超过 48 小时未更新，或促销后台显示库存不足/不可执行。\n- 事项：US Product Bundling 2026-09-30 风险清单。当前状态：本次窗口未发现 Amazon 对 bundle、kit、set、multipack、refill pages 或变体关系政策范围发布新的公开变化；仍按 2026-09-30 生效节点执行内部筛查。下次复查日期：2026-09-22。触发升级条件：Seller Central 出现 Account Health 提醒、ASIN 抑制、bundle 政策文本更新或执行范围扩大。\n- 事项：商业责任险 2026-11-02 要求账号侧证据。当前状态：公开官方线索仍存在，但本次窗口未见 Amazon 新增公开解释；是否适用于当前账号仍以 Seller Central 后台通知、Account Health 和 AIA 入口为准。下次复查日期：2026-09-22。触发升级条件：后台出现强制通知、保险资料截止日、AIA 添加入口或 enhanced safety 类目/站点适用范围变化。\n\n## 情报边界与可信度\n\n本次窗口复查来源约 12 个，其中官方/监管/一手来源约 9 个，包括中国政府网/国务院办公厅、Amazon Seller Central/Forums、Amazon Ads、About Amazon、Amazon SP-API Changelog、CPSC、GOV.UK OPSS、EIA/BLS、Drewry/NRF 既有跟踪源；非官方或行业辅助来源约 3 个，仅用于排重和背景判断。纳入日报的新事件 0 条，纳入已有事件重要更新 0 条；仍待确认事项 3 条：PBDD/Deal ASIN 的账号内可售库存缺口、商业责任险对当前账号的实际适用范围、Product Bundling 2026-09-30 是否触发账号级提醒。\n\n排除项：本次窗口内未发现新的 Seller Central 强制 Listing/A+/图片/搜索词/属性/变体/FBA 费用变化；Amazon Ads 未发布 SP/SB/SD/DSP/AMC 全量规则变化；Prime Big Deal Days 零售预热、AI shopping 评论、Seller Central 新界面反馈和无新增事实转载未形成新的全账号运营动作；CPSC/OPSS 在本次窗口内未发现与相册、补充页、school memory book、portfolio binder、puzzle accessories 直接匹配的新增高优先级召回。\n\n工作日门禁来源：中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。该安排显示 2026 年中秋节为 2026-09-25 至 2026-09-27，国庆节调休上班日包含 2026-09-20；2026-09-21 为周一且不在法定节假日内，因此今天按中国大陆法定工作日运行。因本周最后一个大陆法定工作日为 2026-09-24，今天不生成周报。\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-21\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-21\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175 C receiving、reserved units 和 available units，避免 10 月 6-7 日活动前库存缺口拖累广告预热。今天是 2026-09-20（周日），根据国务院办公厅 2026 年节假日调休安排为国庆调休上班日，也是本周最后一个中国大陆法定工作日，因此日报后追加周度合并报告。\n\n## 持续关注\n\n- 事项：US/UK Prime Big Deal Days 与 Q4 促销 ASIN 入仓节点后库存复查。当前状态：2026-09-16 入仓节点已过，本次未见新的 Amazon 官方日期或政策变化；风险集中在账号内可售库存、FC 接收、reserved units 和 Manage Deals/Coupons 可执行状态。下次复查日期：2026-09-22。触发升级条件：任一 PBDD/Deal ASIN 可售库存低于目标促销量 90%，FC receiving 超过 48 小时未更新，或促销后台显示库存不足/不可执行。\n- 事项：US Product Bundling 2026-09-30 风险清单。当前状态：本次未发现 Amazon 对 bundle、kit、set、multipack、refill pages 或变体关系政策范围发布新的公开变化；仍按 2026-09-30 生效节点执行内部筛查。下次复查日期：2026-09-22。触发升级条件：Seller Central 出现 Account Health 提醒、ASIN 抑制、bundle 政策文本更新或执行范围扩大。\n- 事项：商业责任险 2026-11-02 要求账号侧证据。当前状态：公开官方线索仍存在，但本次未见 Amazon 新增公开解释；是否适用于当前账号仍以 Seller Central 后台通知、Account Health 和 AIA 入口为准。下次复查日期：2026-09-22。触发升级条件：后台出现强制通知、保险资料截止日、AIA 添加入口或 enhanced safety 类目/站点适用范围变化。\n\n## 情报边界与可信度\n\n本次窗口复查来源约 13 个，其中官方/监管/一手来源约 9 个，包括中国政府网/国务院办公厅、Amazon Seller Central/Forums、Amazon Ads、About Amazon、CPSC、GOV.UK OPSS、USPS/PRC、EIA/BLS、Drewry/NRF 既有跟踪源；非官方或行业辅助来源约 4 个，仅用于排重和背景判断。纳入日报的新事件 0 条，纳入已有事件重要更新 0 条；仍待确认事项 3 条：PBDD/Deal ASIN 的账号内可售库存缺口、商业责任险对当前账号的实际适用范围、Product Bundling 2026-09-30 是否触发账号级提醒。\n\n排除项：本次窗口内未发现新的 Seller Central 强制 Listing/A+/图片/搜索词/属性/变体/FBA 费用变化；Amazon Ads 未发布 SP/SB/SD/DSP/AMC 全量规则变化；Prime Big Deal Days 零售预热、AI shopping 评论、Seller Central 新界面反馈和 SFP 帮助页片段未形成新的全账号运营动作；CPSC/OPSS 在本次窗口内未发现与相册、补充页、school memory book、portfolio binder、puzzle accessories 直接匹配的新增高优先级召回。\n\n工作日门禁来源：中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。该安排显示 2026-09-20（周日）为国庆节调休上班日，因此今天按中国大陆法定工作日运行，并生成本周合并报告。\n\n# 亚马逊及海外市场情报周报｜2026-09-20\n\n## 1. 本周管理层摘要\n\n本周确认并推送的重大/中等运营价值事件共 6 条，影响 US、UK、DE/FR/IT/ES 和多站点广告/合规模块。最高风险不是新的平台规则，而是 US/UK PBDD 入仓节点已过后，促销 ASIN 仍可能出现 FC 接收延迟、reserved units 占用和可售库存不足。最近截止日是 2026-09-22：需要复查 PBDD/Deal ASIN 库存、Product Bundling 风险清单和商业责任险账号证据。广告侧的 Amazon Ads 与 ChatGPT 集成仍是试点信号，短期不改 SP/SB/SD 结构，但应把 Top ASIN 的场景、属性、适配关系和品牌语义资料补齐。\n\n## 2. 本周优先级快览\n\n| 优先级 | 事件主线 | 站点 | 模块 | 下周动作 | 负责人 | 截止日 |\n|---|---|---|---|---|---|---|\n| P1 | PBDD/Q4 入仓节点后库存复查 | US/UK | FBA / Deals / Inventory | 导出促销 ASIN 的 shipment ID、received units、available units、reserved units、Manage Deals/Coupons 状态，缺口 ASIN 给出取消促销、加急补货或广告降预算方案 | 供应链 + 运营 | 2026-09-22 |\n| P2 | Product Bundling 2026-09-30 风险清单 | US | Listing / 合规 | 筛选 bundle、kit、set、multipack、refill pages 和异常变体关系，补齐品牌、UPC、制造商预包装和父子关系证据 | Listing + 合规 | 2026-09-22 |\n| P2 | 商业责任险 2026-11-02 要求账号证据 | US/多站点 | Compliance / Account Health | 归档 Seller Central 后台是否收到通知、AIA 入口、保险主体、保额、有效期和 enhanced safety ASIN 命中情况 | 合规 + 财务 | 2026-09-22 |\n| P2 | US 旺季物流成本与运价复核 | US/UK/EU | 供应链 / 财务 / 促销毛利 | 用 EIA/BLS、Drewry 和实际货代报价更新未锁价批次 landed cost；仅对毛利率偏差超过 1 个百分点的 ASIN 提交调价/限促建议 | 供应链 + 财务 | 2026-09-25 |\n| P2 | Amazon Ads 与 ChatGPT 集成试点 | US 优先/多站点观察 | DSP / AI Ads / Brand Content | 确认是否收到 DSP/agency 邀请；整理 Top 20 ASIN 的用途、材质、尺寸、适配对象、礼品场景和不适用场景 | PPC + 品牌内容 | 2026-09-25 |\n| P2 | CPSC Amazon 渠道加热毯/加热垫召回 | US | 合规 / 产品开发 | 用 SKU master 和开发清单筛选 heated、warming、electric、USB、battery、blanket、pad、warmer 等风险词；无命中则关闭 | 合规 + 产品 | 2026-09-25 |\n\n## 3. 本周政策与平台变化\n\n### 合规\n\n商业责任险 2026-11-02 要求本周没有新的公开 Amazon 解释，但仍是账号侧待确认事项。建议合规/财务不等待公开报道，直接以 Seller Central 后台通知、Account Health、AIA 入口和保险文件为准完成证据归档。\n\nCPSC 2026-09-17 发布 JKMAX 加热毯/加热垫召回，公开信息显示产品经 Amazon.com 销售，风险为火灾和灼伤。该事件与当前相册、纸制补充页、school memory book、portfolio binder、puzzle accessories 不直接匹配，动作限定为电热/电池/家居礼品开发项目筛查。\n\n### Listing\n\nUS Product Bundling 2026-09-30 仍是 Listing 合规主线。本周未见 Amazon 对 bundle、kit、set、multipack、refill pages 政策范围发布新变化，因此不需要批量改 Listing；需要继续完成风险清单，优先处理补充页、套装、多包装和异常变体关系。\n\n### 广告\n\nAmazon Ads 2026-09-10 官方发布与 OpenAI/ChatGPT 的广告集成试点，本周首次纳入日报。当前没有证据表明这是 Seller Central 广告主可全量自助启用的新广告位，也未改变 SP/SB/SD 的计费、匹配或竞价规则。运营价值在于提前准备 AI 场景下可被理解的品牌和 ASIN 语义资料。\n\n### 费用\n\n本周未发现新的 Amazon FBA 费用、Referral Fee 或 Ads 计费口径强制变化。USPS 2026 旺季临时包裹加价仍待 PRC/Buy Shipping 最终同步确认，暂不作为已生效成本写入所有订单，只进入 FBM/补发/低客单价订单的情景测算。\n\n### 库存物流\n\nUS Amazon-optimized shipment splits 与 UK PBDD 入仓节点在 2026-09-16 到期，状态从“节点前计划”转为“库存异常收口”。下周重点不是继续讨论日期，而是逐个促销 ASIN 验证 FC 接收、reserved units、available units 和后台促销可执行状态。\n\n### 促销\n\nPrime Big Deal Days 零售侧日期已确认为 2026-10-06 至 2026-10-07。本周没有新的促销报名规则变化，但库存、广告预热和毛利底线需要联动：可售库存不足的 ASIN 不应继续放大广告预算或维持深折扣。\n\n## 4. 本周海外市场与供应链变化\n\nBLS 2026-09-11 CPI 显示美国能源成本上行，EIA 2026-09-15 柴油周更继续支持 US 物流成本复核。该信号不等于立即涨价，但对体积型相册、补充页、school memory book 和 portfolio binder 的卡派、尾程、退货补发和低价促销毛利有压缩风险。\n\nDrewry 2026-09-17 WCI 上升 1% 至 4,500 美元/40ft，其中 Shanghai-Los Angeles 上升 5% 至 7,712 美元/40ft，Shanghai-New York 上升 7% 至 10,394 美元/40ft；Shanghai-Genoa 和 Shanghai-Rotterdam 下行。结论是 US 线优先复核，EU 线不能按综合指数统一上调成本，必须按 Rotterdam/Genoa 实际报价验证。\n\n## 5. 对当前业务的量化影响\n\n库存：若任一 PBDD/Deal ASIN 的 available units 低于活动目标销量 90%，或 FC receiving 超过 48 小时无更新，应把该 ASIN 升级为库存异常，动作包括取消/降级促销、降低广告预热预算或改用替代 ASIN 承接流量。\n\n利润率：对未锁价或 ETA 紧贴 Q4 节点的 China-US 批次，若实际报价较模型高出 5% 以上，或单件物流成本导致贡献利润率下降超过 1 个百分点，应重新评估促销折扣和广告预算；低于毛利底线的 ASIN 不建议继续叠加 coupon + 高竞价。\n\n广告效率：Amazon Ads/ChatGPT 试点短期不改变 ACoS/TACoS 目标。假设账号未收到 DSP 试点邀请，PPC 本周只需要建立观察字段，不调整 SP/SB/SD campaign；若收到邀请，必须先设预算上限、转化归因口径和暂停条件。\n\n合规：Product Bundling 距 2026-09-30 只剩 10 天，若 bundle/kit/set/multipack/refill pages ASIN 缺少制造商预包装、UPC/品牌一致性或父子关系证据，应优先补证或拆分风险结构，避免后续 Account Health 或 ASIN 抑制。\n\n## 6. 下周行动清单\n\n| 优先级 | 动作 | 站点 | 对象 | 负责人 | 截止日 | 验收指标 |\n|---|---|---|---|---|---|---|\n| P1 | 导出 PBDD/Deal ASIN 库存与促销可执行表 | US/UK | 参与 PBDD、Coupons、Deals、高销量 ASIN | 供应链 + 运营 | 2026-09-22 | 100% ASIN 有 shipment ID、received units、available units、reserved units、缺口数量、处理动作 |\n| P2 | 完成 Product Bundling 风险清单复查 | US | bundle、kit、set、multipack、refill pages、异常变体关系 | Listing + 合规 | 2026-09-22 | 每个命中 ASIN 有证据状态、建议动作、负责人和是否需改 Listing 结论 |\n| P2 | 归档商业责任险账号侧证据 | US/多站点 | Account Health、AIA、后台通知、保险文件 | 合规 + 财务 | 2026-09-22 | 有“收到/未收到”截图；命中账号有保单主体、保额、有效期、缺口清单 |\n| P2 | 更新 US/EU 未锁价批次 landed cost | US/UK/EU | 未订舱、未锁价、ETA 紧贴 Q4 的 shipment | 供应链 + 财务 | 2026-09-25 | 输出报价、模型值、差异%、毛利率影响和是否需要调促销/价格 |\n| P2 | 建立 AI 广告/ChatGPT 试点准备表 | US/多站点 | Top 20 ASIN、Store、A+、Brand Story、SB 落地页 | PPC + 品牌内容 | 2026-09-25 | 每个 ASIN 有核心场景、尺寸/材质、适配对象、禁用场景和监控字段 |\n| P2 | 关闭或升级 JKMAX 召回相关风险词排查 | US | SKU master、产品开发清单 | 合规 + 产品 | 2026-09-25 | 无命中则记录关闭；有命中则列 ASIN/SKU、供应商、测试报告和补证责任人 |\n\n## 7. 已关闭与继续跟踪事项\n\n- 已关闭/不推送：2026-09-18 至 2026-09-20 窗口内未发现新的 Amazon 全量 Listing、A+、Search Terms、FBA 费用或 Ads 计费规则变化；重复的 PBDD 零售预热、AI shopping 行业评论、Seller Central UI 反馈和无新增事实转载不再进入日报。\n- 继续跟踪：PBDD/Deal ASIN 库存复查，下次 2026-09-22；升级条件为可售库存低于目标促销量 90%、FC receiving 超过 48 小时或促销后台不可执行。\n- 继续跟踪：Product Bundling 2026-09-30，下次 2026-09-22；升级条件为 Account Health 提醒、ASIN 抑制、政策文本或执行范围更新。\n- 继续跟踪：商业责任险 2026-11-02，下次 2026-09-22；升级条件为后台强制通知、AIA 入口或 enhanced safety 适用范围变化。\n- 继续跟踪：Drewry WCI 与黄金周前运力管理，下次 2026-09-25；升级条件为 China-US 报价较模型高出 5% 以上或关键 shipment ETA 推迟超过 3 天。\n\n## 8. 来源与可信度统计\n\n本周合并复核来源约 18 个，其中官方/监管/一手来源约 12 个，包括中国政府网/国务院办公厅、Amazon Seller Central/Forums、About Amazon、Amazon Ads、CPSC、GOV.UK OPSS、EIA、BLS、USPS/PRC、Drewry、NRF；非官方或行业辅助来源约 6 个，仅用于发现重复报道、补充背景和验证是否存在新增运营事实。正式公告/监管/政府数据占主导；仍待确认事项 3 个：商业责任险账号适用范围、USPS 旺季临时包裹加价是否同步到 Amazon Buy Shipping、Product Bundling 是否触发账号级提醒。\n\n主要来源：\n- 中国政府网/国务院办公厅：https://www.gov.cn/zhengce/content/202511/content_7047090.htm\n- Amazon Ads：https://advertising.amazon.com/library/news/amazon-ads-chat-gpt-advertising-integration\n- About Amazon：https://www.aboutamazon.com/news/retail/amazon-prime-big-deals-day-2026-when-october-6-7\n- Amazon Seller Forums US：https://sellercentral.amazon.com/seller-forums/discussions/t/3e31fbb7-04e0-4ed4-873e-f74b1052e2ff\n- Amazon Seller Forums Europe：https://sellercentral-europe.amazon.com/seller-forums/discussions/t/6f722adc-b82b-4faa-b2dd-dd95869dca88\n- U.S. EIA：https://www.eia.gov/petroleum/gasdiesel/\n- U.S. BLS：https://www.bls.gov/news.release/cpi.nr0.htm\n- Drewry：https://www.drewry.co.uk/supply-chain-advisors/supply-chain-expertise/world-container-index-assessed-by-drewry\n- U.S. CPSC：https://www.cpsc.gov/Recalls/2026/JKMAX-Recalls-Heated-Blankets-and-Heating-Pads-Due-to-Fire-and-Burn-Hazards\n- USPS：https://about.usps.com/newsroom/national-releases/2026/0825-usps-announces-temporary-price-change-for-2026-holiday-shipping-season.htm\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-20\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-20\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报增量日报｜2026-09-20\u003c/h1>\n\u003ch2>今日判断\u003c/h2>\n\u003cp>今日无重大运营变化。本次窗口覆盖 2026-09-18 09:02:34 至 2026-09-20 09:14:58（Asia/Shanghai），未发现 Amazon US/UK/DE/FR/IT/ES 对 Seller Central Listing、图片、A+、Search Terms、FBA 费用、库存限制或 Amazon Ads SP/SB/SD/DSP/AMC 计费、竞价、匹配规则发布新的全量强制变更。今天最高优先级不是改 Listing 或广告结构，而是复查 US/UK Prime Big Deal Days 促销 ASIN 在 2026-09-16 入仓节点后的 FC receiving、reserved units 和 available units，避免 10 月 6-7 日活动前库存缺口拖累广告预热。今天是 2026-09-20（周日），根据国务院办公厅 2026 年节假日调休安排为国庆调休上班日，也是本周最后一个中国大陆法定工作日，因此日报后追加周度合并报告。\u003c/p>\n\u003ch2>持续关注\u003c/h2>\n\u003cul>\n\u003cli>事项：US/UK Prime Big Deal Days 与 Q4 促销 ASIN 入仓节点后库存复查。当前状态：2026-09-16 入仓节点已过，本次未见新的 Amazon 官方日期或政策变化；风险集中在账号内可售库存、FC 接收、reserved units 和 Manage Deals/Coupons 可执行状态。下次复查日期：2026-09-22。触发升级条件：任一 PBDD/Deal ASIN 可售库存低于目标促销量 90%，FC receiving 超过 48 小时未更新，或促销后台显示库存不足/不可执行。\u003c/li>\n\u003cli>事项：US Product Bundling 2026-09-30 风险清单。当前状态：本次未发现 Amazon 对 bundle、kit、set、multipack、refill pages 或变体关系政策范围发布新的公开变化；仍按 2026-09-30 生效节点执行内部筛查。下次复查日期：2026-09-22。触发升级条件：Seller Central 出现 Account Health 提醒、ASIN 抑制、bundle 政策文本更新或执行范围扩大。\u003c/li>\n\u003cli>事项：商业责任险 2026-11-02 要求账号侧证据。当前状态：公开官方线索仍存在，但本次未见 Amazon 新增公开解释；是否适用于当前账号仍以 Seller Central 后台通知、Account Health 和 AIA 入口为准。下次复查日期：2026-09-22。触发升级条件：后台出现强制通知、保险资料截止日、AIA 添加入口或 enhanced safety 类目/站点适用范围变化。\u003c/li>\n\u003c/ul>\n\u003ch2>情报边界与可信度\u003c/h2>\n\u003cp>本次窗口复查来源约 13 个，其中官方/监管/一手来源约 9 个，包括中国政府网/国务院办公厅、Amazon Seller Central/Forums、Amazon Ads、About Amazon、CPSC、GOV.UK OPSS、USPS/PRC、EIA/BLS、Drewry/NRF 既有跟踪源；非官方或行业辅助来源约 4 个，仅用于排重和背景判断。纳入日报的新事件 0 条，纳入已有事件重要更新 0 条；仍待确认事项 3 条：PBDD/Deal ASIN 的账号内可售库存缺口、商业责任险对当前账号的实际适用范围、Product Bundling 2026-09-30 是否触发账号级提醒。\u003c/p>\n\u003cp>排除项：本次窗口内未发现新的 Seller Central 强制 Listing/A+/图片/搜索词/属性/变体/FBA 费用变化；Amazon Ads 未发布 SP/SB/SD/DSP/AMC 全量规则变化；Prime Big Deal Days 零售预热、AI shopping 评论、Seller Central 新界面反馈和 SFP 帮助页片段未形成新的全账号运营动作；CPSC/OPSS 在本次窗口内未发现与相册、补充页、school memory book、portfolio binder、puzzle accessories 直接匹配的新增高优先级召回。\u003c/p>\n\u003cp>工作日门禁来源：中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（\u003ca href=\"https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。该安排显示\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.cn/zhengce/content/202511/content_7047090.htm）。该安排显示\u003c/a> 2026-09-20（周日）为国庆节调休上班日，因此今天按中国大陆法定工作日运行，并生成本周合并报告。\u003c/p>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报周报｜2026-09-20\u003c/h1>\n\u003ch2>1. 本周管理层摘要\u003c/h2>\n\u003cp>本周确认并推送的重大/中等运营价值事件共 6 条，影响 US、UK、DE/FR/IT/ES 和多站点广告/合规模块。最高风险不是新的平台规则，而是 US/UK PBDD 入仓节点已过后，促销 ASIN 仍可能出现 FC 接收延迟、reserved units 占用和可售库存不足。最近截止日是 2026-09-22：需要复查 PBDD/Deal ASIN 库存、Product Bundling 风险清单和商业责任险账号证据。广告侧的 Amazon Ads 与 ChatGPT 集成仍是试点信号，短期不改 SP/SB/SD 结构，但应把 Top ASIN 的场景、属性、适配关系和品牌语义资料补齐。\u003c/p>\n\u003ch2>2. 本周优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事件主线\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>模块\u003c/th>\n\u003cth>下周动作\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>PBDD/Q4 入仓节点后库存复查\u003c/td>\n\u003ctd>US/UK\u003c/td>\n\u003ctd>FBA / Deals / Inventory\u003c/td>\n\u003ctd>导出促销 ASIN 的 shipment ID、received units、available units、reserved units、Manage Deals/Coupons 状态，缺口 ASIN 给出取消促销、加急补货或广告降预算方案\u003c/td>\n\u003ctd>供应链 + 运营\u003c/td>\n\u003ctd>2026-09-22\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Product Bundling 2026-09-30 风险清单\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>Listing / 合规\u003c/td>\n\u003ctd>筛选 bundle、kit、set、multipack、refill pages 和异常变体关系，补齐品牌、UPC、制造商预包装和父子关系证据\u003c/td>\n\u003ctd>Listing + 合规\u003c/td>\n\u003ctd>2026-09-22\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>商业责任险 2026-11-02 要求账号证据\u003c/td>\n\u003ctd>US/多站点\u003c/td>\n\u003ctd>Compliance / Account Health\u003c/td>\n\u003ctd>归档 Seller Central 后台是否收到通知、AIA 入口、保险主体、保额、有效期和 enhanced safety ASIN 命中情况\u003c/td>\n\u003ctd>合规 + 财务\u003c/td>\n\u003ctd>2026-09-22\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>US 旺季物流成本与运价复核\u003c/td>\n\u003ctd>US/UK/EU\u003c/td>\n\u003ctd>供应链 / 财务 / 促销毛利\u003c/td>\n\u003ctd>用 EIA/BLS、Drewry 和实际货代报价更新未锁价批次 landed cost；仅对毛利率偏差超过 1 个百分点的 ASIN 提交调价/限促建议\u003c/td>\n\u003ctd>供应链 + 财务\u003c/td>\n\u003ctd>2026-09-25\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Amazon Ads 与 ChatGPT 集成试点\u003c/td>\n\u003ctd>US 优先/多站点观察\u003c/td>\n\u003ctd>DSP / AI Ads / Brand Content\u003c/td>\n\u003ctd>确认是否收到 DSP/agency 邀请；整理 Top 20 ASIN 的用途、材质、尺寸、适配对象、礼品场景和不适用场景\u003c/td>\n\u003ctd>PPC + 品牌内容\u003c/td>\n\u003ctd>2026-09-25\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>CPSC Amazon 渠道加热毯/加热垫召回\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>合规 / 产品开发\u003c/td>\n\u003ctd>用 SKU master 和开发清单筛选 heated、warming、electric、USB、battery、blanket、pad、warmer 等风险词；无命中则关闭\u003c/td>\n\u003ctd>合规 + 产品\u003c/td>\n\u003ctd>2026-09-25\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>3. 本周政策与平台变化\u003c/h2>\n\u003ch3>合规\u003c/h3>\n\u003cp>商业责任险 2026-11-02 要求本周没有新的公开 Amazon 解释，但仍是账号侧待确认事项。建议合规/财务不等待公开报道，直接以 Seller Central 后台通知、Account Health、AIA 入口和保险文件为准完成证据归档。\u003c/p>\n\u003cp>CPSC 2026-09-17 发布 JKMAX 加热毯/加热垫召回，公开信息显示产品经 Amazon.com 销售，风险为火灾和灼伤。该事件与当前相册、纸制补充页、school memory book、portfolio binder、puzzle accessories 不直接匹配，动作限定为电热/电池/家居礼品开发项目筛查。\u003c/p>\n\u003ch3>Listing\u003c/h3>\n\u003cp>US Product Bundling 2026-09-30 仍是 Listing 合规主线。本周未见 Amazon 对 bundle、kit、set、multipack、refill pages 政策范围发布新变化，因此不需要批量改 Listing；需要继续完成风险清单，优先处理补充页、套装、多包装和异常变体关系。\u003c/p>\n\u003ch3>广告\u003c/h3>\n\u003cp>Amazon Ads 2026-09-10 官方发布与 OpenAI/ChatGPT 的广告集成试点，本周首次纳入日报。当前没有证据表明这是 Seller Central 广告主可全量自助启用的新广告位，也未改变 SP/SB/SD 的计费、匹配或竞价规则。运营价值在于提前准备 AI 场景下可被理解的品牌和 ASIN 语义资料。\u003c/p>\n\u003ch3>费用\u003c/h3>\n\u003cp>本周未发现新的 Amazon FBA 费用、Referral Fee 或 Ads 计费口径强制变化。USPS 2026 旺季临时包裹加价仍待 PRC/Buy Shipping 最终同步确认，暂不作为已生效成本写入所有订单，只进入 FBM/补发/低客单价订单的情景测算。\u003c/p>\n\u003ch3>库存物流\u003c/h3>\n\u003cp>US Amazon-optimized shipment splits 与 UK PBDD 入仓节点在 2026-09-16 到期，状态从“节点前计划”转为“库存异常收口”。下周重点不是继续讨论日期，而是逐个促销 ASIN 验证 FC 接收、reserved units、available units 和后台促销可执行状态。\u003c/p>\n\u003ch3>促销\u003c/h3>\n\u003cp>Prime Big Deal Days 零售侧日期已确认为 2026-10-06 至 2026-10-07。本周没有新的促销报名规则变化，但库存、广告预热和毛利底线需要联动：可售库存不足的 ASIN 不应继续放大广告预算或维持深折扣。\u003c/p>\n\u003ch2>4. 本周海外市场与供应链变化\u003c/h2>\n\u003cp>BLS 2026-09-11 CPI 显示美国能源成本上行，EIA 2026-09-15 柴油周更继续支持 US 物流成本复核。该信号不等于立即涨价，但对体积型相册、补充页、school memory book 和 portfolio binder 的卡派、尾程、退货补发和低价促销毛利有压缩风险。\u003c/p>\n\u003cp>Drewry 2026-09-17 WCI 上升 1% 至 4,500 美元/40ft，其中 Shanghai-Los Angeles 上升 5% 至 7,712 美元/40ft，Shanghai-New York 上升 7% 至 10,394 美元/40ft；Shanghai-Genoa 和 Shanghai-Rotterdam 下行。结论是 US 线优先复核，EU 线不能按综合指数统一上调成本，必须按 Rotterdam/Genoa 实际报价验证。\u003c/p>\n\u003ch2>5. 对当前业务的量化影响\u003c/h2>\n\u003cp>库存：若任一 PBDD/Deal ASIN 的 available units 低于活动目标销量 90%，或 FC receiving 超过 48 小时无更新，应把该 ASIN 升级为库存异常，动作包括取消/降级促销、降低广告预热预算或改用替代 ASIN 承接流量。\u003c/p>\n\u003cp>利润率：对未锁价或 ETA 紧贴 Q4 节点的 China-US 批次，若实际报价较模型高出 5% 以上，或单件物流成本导致贡献利润率下降超过 1 个百分点，应重新评估促销折扣和广告预算；低于毛利底线的 ASIN 不建议继续叠加 coupon + 高竞价。\u003c/p>\n\u003cp>广告效率：Amazon Ads/ChatGPT 试点短期不改变 ACoS/TACoS 目标。假设账号未收到 DSP 试点邀请，PPC 本周只需要建立观察字段，不调整 SP/SB/SD campaign；若收到邀请，必须先设预算上限、转化归因口径和暂停条件。\u003c/p>\n\u003cp>合规：Product Bundling 距 2026-09-30 只剩 10 天，若 bundle/kit/set/multipack/refill pages ASIN 缺少制造商预包装、UPC/品牌一致性或父子关系证据，应优先补证或拆分风险结构，避免后续 Account Health 或 ASIN 抑制。\u003c/p>\n\u003ch2>6. 下周行动清单\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>动作\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>对象\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日\u003c/th>\n\u003cth>验收指标\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>导出 PBDD/Deal ASIN 库存与促销可执行表\u003c/td>\n\u003ctd>US/UK\u003c/td>\n\u003ctd>参与 PBDD、Coupons、Deals、高销量 ASIN\u003c/td>\n\u003ctd>供应链 + 运营\u003c/td>\n\u003ctd>2026-09-22\u003c/td>\n\u003ctd>100% ASIN 有 shipment ID、received units、available units、reserved units、缺口数量、处理动作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>完成 Product Bundling 风险清单复查\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>bundle、kit、set、multipack、refill pages、异常变体关系\u003c/td>\n\u003ctd>Listing + 合规\u003c/td>\n\u003ctd>2026-09-22\u003c/td>\n\u003ctd>每个命中 ASIN 有证据状态、建议动作、负责人和是否需改 Listing 结论\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>归档商业责任险账号侧证据\u003c/td>\n\u003ctd>US/多站点\u003c/td>\n\u003ctd>Account Health、AIA、后台通知、保险文件\u003c/td>\n\u003ctd>合规 + 财务\u003c/td>\n\u003ctd>2026-09-22\u003c/td>\n\u003ctd>有“收到/未收到”截图；命中账号有保单主体、保额、有效期、缺口清单\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>更新 US/EU 未锁价批次 landed cost\u003c/td>\n\u003ctd>US/UK/EU\u003c/td>\n\u003ctd>未订舱、未锁价、ETA 紧贴 Q4 的 shipment\u003c/td>\n\u003ctd>供应链 + 财务\u003c/td>\n\u003ctd>2026-09-25\u003c/td>\n\u003ctd>输出报价、模型值、差异%、毛利率影响和是否需要调促销/价格\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>建立 AI 广告/ChatGPT 试点准备表\u003c/td>\n\u003ctd>US/多站点\u003c/td>\n\u003ctd>Top 20 ASIN、Store、A+、Brand Story、SB 落地页\u003c/td>\n\u003ctd>PPC + 品牌内容\u003c/td>\n\u003ctd>2026-09-25\u003c/td>\n\u003ctd>每个 ASIN 有核心场景、尺寸/材质、适配对象、禁用场景和监控字段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>关闭或升级 JKMAX 召回相关风险词排查\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>SKU master、产品开发清单\u003c/td>\n\u003ctd>合规 + 产品\u003c/td>\n\u003ctd>2026-09-25\u003c/td>\n\u003ctd>无命中则记录关闭；有命中则列 ASIN/SKU、供应商、测试报告和补证责任人\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>7. 已关闭与继续跟踪事项\u003c/h2>\n\u003cul>\n\u003cli>已关闭/不推送：2026-09-18 至 2026-09-20 窗口内未发现新的 Amazon 全量 Listing、A+、Search Terms、FBA 费用或 Ads 计费规则变化；重复的 PBDD 零售预热、AI shopping 行业评论、Seller Central UI 反馈和无新增事实转载不再进入日报。\u003c/li>\n\u003cli>继续跟踪：PBDD/Deal ASIN 库存复查，下次 2026-09-22；升级条件为可售库存低于目标促销量 90%、FC receiving 超过 48 小时或促销后台不可执行。\u003c/li>\n\u003cli>继续跟踪：Product Bundling 2026-09-30，下次 2026-09-22；升级条件为 Account Health 提醒、ASIN 抑制、政策文本或执行范围更新。\u003c/li>\n\u003cli>继续跟踪：商业责任险 2026-11-02，下次 2026-09-22；升级条件为后台强制通知、AIA 入口或 enhanced safety 适用范围变化。\u003c/li>\n\u003cli>继续跟踪：Drewry WCI 与黄金周前运力管理，下次 2026-09-25；升级条件为 China-US 报价较模型高出 5% 以上或关键 shipment ETA 推迟超过 3 天。\u003c/li>\n\u003c/ul>\n\u003ch2>8. 来源与可信度统计\u003c/h2>\n\u003cp>本周合并复核来源约 18 个，其中官方/监管/一手来源约 12 个，包括中国政府网/国务院办公厅、Amazon Seller Central/Forums、About Amazon、Amazon Ads、CPSC、GOV.UK OPSS、EIA、BLS、USPS/PRC、Drewry、NRF；非官方或行业辅助来源约 6 个，仅用于发现重复报道、补充背景和验证是否存在新增运营事实。正式公告/监管/政府数据占主导；仍待确认事项 3 个：商业责任险账号适用范围、USPS 旺季临时包裹加价是否同步到 Amazon Buy Shipping、Product Bundling 是否触发账号级提醒。\u003c/p>\n\u003cp>主要来源：\u003c/p>\n\u003cul>\n\u003cli>中国政府网/国务院办公厅：\u003ca href=\"https://www.gov.cn/zhengce/content/202511/content_7047090.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.cn/zhengce/content/202511/content_7047090.htm\u003c/a>\u003c/li>\n\u003cli>Amazon Ads：\u003ca href=\"https://advertising.amazon.com/library/news/amazon-ads-chat-gpt-advertising-integration\" target=\"_blank\" rel=\"noopener noreferrer\">https://advertising.amazon.com/library/news/amazon-ads-chat-gpt-advertising-integration\u003c/a>\u003c/li>\n\u003cli>About Amazon：\u003ca href=\"https://www.aboutamazon.com/news/retail/amazon-prime-big-deals-day-2026-when-october-6-7\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.aboutamazon.com/news/retail/amazon-prime-big-deals-day-2026-when-october-6-7\u003c/a>\u003c/li>\n\u003cli>Amazon Seller Forums US：\u003ca href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/3e31fbb7-04e0-4ed4-873e-f74b1052e2ff\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral.amazon.com/seller-forums/discussions/t/3e31fbb7-04e0-4ed4-873e-f74b1052e2ff\u003c/a>\u003c/li>\n\u003cli>Amazon Seller Forums Europe：\u003ca href=\"https://sellercentral-europe.amazon.com/seller-forums/discussions/t/6f722adc-b82b-4faa-b2dd-dd95869dca88\" target=\"_blank\" rel=\"noopener noreferrer\">https://sellercentral-europe.amazon.com/seller-forums/discussions/t/6f722adc-b82b-4faa-b2dd-dd95869dca88\u003c/a>\u003c/li>\n\u003cli>U.S. EIA：\u003ca href=\"https://www.eia.gov/petroleum/gasdiesel/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.eia.gov/petroleum/gasdiesel/\u003c/a>\u003c/li>\n\u003cli>U.S. BLS：\u003ca href=\"https://www.bls.gov/news.release/cpi.nr0.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.bls.gov/news.release/cpi.nr0.htm\u003c/a>\u003c/li>\n\u003cli>Drewry：\u003ca href=\"https://www.drewry.co.uk/supply-chain-advisors/supply-chain-expertise/world-container-index-assessed-by-drewry\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.drewry.co.uk/supply-chain-advisors/supply-chain-expertise/world-container-index-assessed-by-drewry\u003c/a>\u003c/li>\n\u003cli>U.S. CPSC：\u003ca href=\"https://www.cpsc.gov/Recalls/2026/JKMAX-Recalls-Heated-Blankets-and-Heating-Pads-Due-to-Fire-and-Burn-Hazards\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.cpsc.gov/Recalls/2026/JKMAX-Recalls-Heated-Blankets-and-Heating-Pads-Due-to-Fire-and-Burn-Hazards\u003c/a>\u003c/li>\n\u003cli>USPS：\u003ca href=\"https://about.usps.com/newsroom/national-releases/2026/0825-usps-announces-temporary-price-change-for-2026-holiday-shipping-season.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://about.usps.com/newsroom/national-releases/2026/0825-usps-announces-temporary-price-change-for-2026-holiday-shipping-season.htm\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>生产链接：\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-20\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": []}, {"date": "2026-09-18", "text": "# 亚马逊及海外市场情报增量日报｜2026-09-18\n\n## 今日判断\n\n今日没有发现需要当天修改 Listing、A+、图片、Search Terms、FBA 费用或 Amazon Ads 竞价/计费规则的重大平台变化。本次窗口覆盖 2026-09-17 18:07:06 至 2026-09-18 09:02:34（Asia/Shanghai），最高优先级是把 Drewry 2026-09-17 海运指数更新纳入 US/EU 旺季运费与到货风险模型。新增的 CPSC/Amazon 渠道召回与当前相册、补充页、school memory book、portfolio binder、puzzle accessories 主线不直接匹配，只做 P2 定向排查，不扩大为全量 Listing 调整。今天是中国大陆法定工作日，但 2026-09-20（周日）为国庆调休补班日，因此今天不是本周最后一个大陆法定工作日，不生成周报。当前最紧急截止日仍是 2026-09-20 前完成 PBDD 促销 ASIN 可售库存与 FC 接收异常复查。\n\n## 优先级快览\n\n| 优先级 | 事项 | 影响站点 | 影响模块 | 截止/生效日期 | 今天是否需要动作 |\n|---|---|---|---|---|---|\n| P2 | Drewry WCI 2026-09-17 更新：综合指数升至 4,500 美元/40ft，Transpacific 上行、Asia-Europe 回落 | US/UK/EU | 供应链、 landed cost、Q4 到货风险 | 2026-09-17 | 是；仅更新未锁价/未订舱批次的运费假设 |\n| P2 | CPSC 发布 JKMAX 加热毯/加热垫 Amazon 渠道召回 | US | 合规、产品开发、风险词筛查 | 2026-09-17 | 仅在有电热、取暖、纺织电器或礼品开发项目时动作 |\n| P2 | US/UK PBDD 促销 ASIN 入仓节点后库存复查 | US/UK | 库存、促销、广告预热 | 2026-09-20 | 是；复查可售库存、reserved units、FC receiving |\n\n## 今日新情报\n\n### CPSC 发布 JKMAX 加热毯/加热垫 Amazon 渠道召回\n\n- 【影响等级】P2\n- 【站点】US\n- 【发布日期】2026-09-17\n- 【生效日期】2026-09-17\n- 【信息状态】正式监管召回\n- 【来源】U.S. CPSC：https://www.cpsc.gov/Recalls/2026/JKMAX-Recalls-Heated-Blankets-and-Heating-Pads-Due-to-Fire-and-Burn-Hazards\n- 发生了什么：CPSC 发布 JKMAX Heated Blankets and Heating Pads 召回，风险为火灾和灼伤；公开信息显示产品经 Amazon.com 销售，涉及约 195,000 件。该事件不是 Amazon 平台全量政策变化，也不是相册/纸制品/收纳类直接召回。\n- 我们怎么看：对当前主线产品的直接销售影响低，但对“礼品化、家居化、电热类周边”产品开发有警示意义；如果团队未来扩展取暖、发热、带电池或电源适配器的礼品品类，合规门槛、测试报告和售后风险都会显著高于纸制品。\n- 建议动作：合规负责人在 2026-09-22 前用 SKU master / 产品开发清单筛选关键词 heated、warming、electric、USB、battery、blanket、pad、warmer；如无命中，在复查表记录“无相关 SKU，关闭动作”。如有命中，建立 ASIN/SKU、供应商、测试报告、说明书警示语、UL/ETL/FCC/电池文件、差评/退货原因字段清单，并由产品负责人确认是否暂停上新或补证。\n\n## 已有事件的重要更新\n\n### Drewry World Container Index 旺季物流成本信号｜drewry-wci-2026-09-03-4465-stable\n\n- 历史事件：Drewry WCI 周度海运指数，用于 US/EU/UK 旺季补货、订舱、促销毛利和到货节点压力判断。\n- 上次状态：2026-09-11 已推送 2026-09-10 WCI 为 4,476 美元/40ft，整体连续第二周持稳，Transpacific 小幅上行、Asia-Europe 回落。\n- 本次新增变化：Drewry 2026-09-17 更新显示 WCI 上升 1% 至 4,500 美元/40ft；Shanghai-Los Angeles 上升 5% 至 7,712 美元/40ft，Shanghai-New York 上升 7% 至 10,394 美元/40ft；Shanghai-Genoa 下降 5% 至 4,016 美元/40ft，Shanghai-Rotterdam 下降 9% 至 3,626 美元/40ft。\n- 变化原因：Drewry 将本周综合指数上行主要归因于 Transpacific 运价上涨；同时，黄金周前船公司通过 blank sailings 管理运力，上海等待时间从第 36 周 65 小时上升到第 37 周 78 小时。\n- 行动是否需要调整：继续原动作但提高 US 线优先级。供应链负责人只对未锁价、未订舱或 ETA 紧贴 PBDD/Q4 节点的批次更新运费和 ETA 假设；EU 线不要因为综合指数上行而统一上调成本，必须按 Rotterdam/Genoa 实际报价验证。\n\n## 今日运营待办\n\n| 优先级 | 待办 | 站点 | 负责人 | 截止日期 | 验收标准 | 复查日期 |\n|---|---|---|---|---|---|---|\n| P2 | 导出未到仓/未接收的 US、UK PBDD 促销 ASIN shipment list，核对 received units、available units、reserved units、Manage Deals/Coupons 可执行状态 | US/UK | 供应链 + 运营 | 2026-09-20 | 每个促销 ASIN 有库存状态结论；可售库存低于目标促销量 90% 的 ASIN 单独列异常处理人 | 2026-09-22 |\n| P2 | 更新未锁价 China-US/China-EU 订舱报价，与当前 landed cost 模型比较；仅当单件运费导致毛利率偏差超过 1 个百分点时触发价格/促销复核 | US/UK/EU | 供应链 + 财务 | 2026-09-22 | 输出 shipment ID、目的站点、报价、模型值、差异%、是否需要改促销毛利假设 | 2026-09-25 |\n| P2 | 筛选当前 SKU 与开发清单是否存在 heated、warming、electric、USB、battery、blanket、pad、warmer 风险词 | US | 合规 + 产品 | 2026-09-22 | 有命中则形成证据清单和补证责任人；无命中则记录“无相关 SKU，关闭动作” | 2026-09-25 |\n\n## 持续关注\n\n- 事项：US Product Bundling 2026-09-30 风险清单。当前状态：本次未发现 Amazon 对 bundle/kit/set/multipack/refill pages 政策范围发布新的公开变化；仍按 2026-09-30 生效节点执行内部筛查。下次复查日期：2026-09-22。触发升级条件：Seller Central 出现 Account Health 提醒、ASIN 抑制、bundle 政策文本更新或执行范围扩大。\n- 事项：商业责任险 2026-11-02 要求账号侧证据。当前状态：公开官方线索仍存在，但本次未发现 Amazon 新增公开解释；是否适用于当前账号仍以 Seller Central 后台通知、Account Health 和 AIA 入口为准。下次复查日期：2026-09-22。触发升级条件：后台出现强制通知、保险资料截止日、AIA 添加入口或类目/站点适用范围变化。\n- 事项：Drewry WCI 与黄金周前运力管理。当前状态：2026-09-17 WCI 上升 1%，US Transpacific 运价继续上行，Asia-Europe 运价回落但上海等待时间上升。下次复查日期：2026-09-25。触发升级条件：China-US 报价较模型高出 5% 以上、关键 shipment ETA 推迟超过 3 天，或 PBDD/Q4 促销 ASIN 可售库存低于目标促销量 90%。\n\n## 情报边界与可信度\n\n本次核验来源约 14 个，其中官方/监管/一手来源约 10 个，包括中国政府网/国务院办公厅或国务院新闻办转载、Amazon Seller Central/Forums、Amazon Ads、About Amazon、CPSC、GOV.UK OPSS、USPS/PRC、EIA/BLS、Drewry、NRF 既有跟踪源；非官方或行业辅助来源约 4 个，仅用于排重和背景判断。纳入日报的新事件 1 条，纳入已有事件重要更新 1 条；仍待确认事项 3 条：PBDD/Deal ASIN 的账号内可售库存缺口、商业责任险对当前账号的实际适用范围、Product Bundling 2026-09-30 是否触发账号级提醒。\n\n排除项：本次窗口内未发现 Seller Central 对 Listing、A+、图片、搜索词、属性、变体、FBA 费用或库存限制发布新的全量强制变更；Amazon Ads 未发布 US/UK/DE/FR/IT/ES 范围内 SP/SB/SD/DSP/AMC 计费、竞价、匹配或归因规则的全量强制变化；Amazon Prime Big Deal Days 与 AI shopping 相关文章多为活动预热或旧事实复述，未形成新的后台动作；USPS holiday surcharge、商业责任险、Product Bundling 本次未见新的公开官方口径；GOV.UK OPSS 与 CPSC 其他召回未发现与相册、补充页、school memory book、portfolio binder、puzzle accessories 直接匹配的高优先级动作。\n\n工作日门禁来源：中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（https://www.gov.cn/zhengce/content/202511/content_7047090.htm；国务院新闻办转载页：https://www.scio.gov.cn/）。2026-09-18 为周五，不在 2026 年中秋节 2026-09-25 至 2026-09-27 或国庆节 2026-10-01 至 2026-10-07 等法定节假日范围内；2026-09-20（周日）为国庆节调休上班日，因此本周最后一个大陆法定工作日不是今天。\n\n生产链接：https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\n", "html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-18\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-18\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:22px; }\n    h3 { margin:28px 0 10px; font-size:18px; }\n    h4 { margin:22px 0 8px; }\n    p { margin:10px 0; }\n    ul { margin:8px 0 16px; padding-left:24px; }\n    li { margin:6px 0; }\n    a { color:#175cd3; text-decoration:none; word-break:break-word; }\n    a:hover { text-decoration:underline; }\n    code { padding:2px 6px; border-radius:5px; background:#eef2f6; }\n    .table-wrap { margin:14px 0 24px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }\n    table { width:100%; border-collapse:collapse; min-width:760px; }\n    th { background:var(--soft); text-align:left; font-weight:650; }\n    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }\n    tr:last-child td { border-bottom:0; }\n    footer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }\n    @media (max-width:720px) { main { width:100%; margin:0; padding:28px 18px; border:0; border-radius:0; } .report-title { font-size:25px; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n\u003ch1 class=\"report-title\">亚马逊及海外市场情报增量日报｜2026-09-18\u003c/h1>\n\u003ch2>今日判断\u003c/h2>\n\u003cp>今日没有发现需要当天修改 Listing、A+、图片、Search Terms、FBA 费用或 Amazon Ads 竞价/计费规则的重大平台变化。本次窗口覆盖 2026-09-17 18:07:06 至 2026-09-18 09:02:34（Asia/Shanghai），最高优先级是把 Drewry 2026-09-17 海运指数更新纳入 US/EU 旺季运费与到货风险模型。新增的 CPSC/Amazon 渠道召回与当前相册、补充页、school memory book、portfolio binder、puzzle accessories 主线不直接匹配，只做 P2 定向排查，不扩大为全量 Listing 调整。今天是中国大陆法定工作日，但 2026-09-20（周日）为国庆调休补班日，因此今天不是本周最后一个大陆法定工作日，不生成周报。当前最紧急截止日仍是 2026-09-20 前完成 PBDD 促销 ASIN 可售库存与 FC 接收异常复查。\u003c/p>\n\u003ch2>优先级快览\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>事项\u003c/th>\n\u003cth>影响站点\u003c/th>\n\u003cth>影响模块\u003c/th>\n\u003cth>截止/生效日期\u003c/th>\n\u003cth>今天是否需要动作\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Drewry WCI 2026-09-17 更新：综合指数升至 4,500 美元/40ft，Transpacific 上行、Asia-Europe 回落\u003c/td>\n\u003ctd>US/UK/EU\u003c/td>\n\u003ctd>供应链、 landed cost、Q4 到货风险\u003c/td>\n\u003ctd>2026-09-17\u003c/td>\n\u003ctd>是；仅更新未锁价/未订舱批次的运费假设\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>CPSC 发布 JKMAX 加热毯/加热垫 Amazon 渠道召回\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>合规、产品开发、风险词筛查\u003c/td>\n\u003ctd>2026-09-17\u003c/td>\n\u003ctd>仅在有电热、取暖、纺织电器或礼品开发项目时动作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>US/UK PBDD 促销 ASIN 入仓节点后库存复查\u003c/td>\n\u003ctd>US/UK\u003c/td>\n\u003ctd>库存、促销、广告预热\u003c/td>\n\u003ctd>2026-09-20\u003c/td>\n\u003ctd>是；复查可售库存、reserved units、FC receiving\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>今日新情报\u003c/h2>\n\u003ch3>CPSC 发布 JKMAX 加热毯/加热垫 Amazon 渠道召回\u003c/h3>\n\u003cul>\n\u003cli>【影响等级】P2\u003c/li>\n\u003cli>【站点】US\u003c/li>\n\u003cli>【发布日期】2026-09-17\u003c/li>\n\u003cli>【生效日期】2026-09-17\u003c/li>\n\u003cli>【信息状态】正式监管召回\u003c/li>\n\u003cli>【来源】U.S. CPSC：\u003ca href=\"https://www.cpsc.gov/Recalls/2026/JKMAX-Recalls-Heated-Blankets-and-Heating-Pads-Due-to-Fire-and-Burn-Hazards\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.cpsc.gov/Recalls/2026/JKMAX-Recalls-Heated-Blankets-and-Heating-Pads-Due-to-Fire-and-Burn-Hazards\u003c/a>\u003c/li>\n\u003cli>发生了什么：CPSC 发布 JKMAX Heated Blankets and Heating Pads 召回，风险为火灾和灼伤；公开信息显示产品经 Amazon.com 销售，涉及约 195,000 件。该事件不是 Amazon 平台全量政策变化，也不是相册/纸制品/收纳类直接召回。\u003c/li>\n\u003cli>我们怎么看：对当前主线产品的直接销售影响低，但对“礼品化、家居化、电热类周边”产品开发有警示意义；如果团队未来扩展取暖、发热、带电池或电源适配器的礼品品类，合规门槛、测试报告和售后风险都会显著高于纸制品。\u003c/li>\n\u003cli>建议动作：合规负责人在 2026-09-22 前用 SKU master / 产品开发清单筛选关键词 heated、warming、electric、USB、battery、blanket、pad、warmer；如无命中，在复查表记录“无相关 SKU，关闭动作”。如有命中，建立 ASIN/SKU、供应商、测试报告、说明书警示语、UL/ETL/FCC/电池文件、差评/退货原因字段清单，并由产品负责人确认是否暂停上新或补证。\u003c/li>\n\u003c/ul>\n\u003ch2>已有事件的重要更新\u003c/h2>\n\u003ch3>Drewry World Container Index 旺季物流成本信号｜drewry-wci-2026-09-03-4465-stable\u003c/h3>\n\u003cul>\n\u003cli>历史事件：Drewry WCI 周度海运指数，用于 US/EU/UK 旺季补货、订舱、促销毛利和到货节点压力判断。\u003c/li>\n\u003cli>上次状态：2026-09-11 已推送 2026-09-10 WCI 为 4,476 美元/40ft，整体连续第二周持稳，Transpacific 小幅上行、Asia-Europe 回落。\u003c/li>\n\u003cli>本次新增变化：Drewry 2026-09-17 更新显示 WCI 上升 1% 至 4,500 美元/40ft；Shanghai-Los Angeles 上升 5% 至 7,712 美元/40ft，Shanghai-New York 上升 7% 至 10,394 美元/40ft；Shanghai-Genoa 下降 5% 至 4,016 美元/40ft，Shanghai-Rotterdam 下降 9% 至 3,626 美元/40ft。\u003c/li>\n\u003cli>变化原因：Drewry 将本周综合指数上行主要归因于 Transpacific 运价上涨；同时，黄金周前船公司通过 blank sailings 管理运力，上海等待时间从第 36 周 65 小时上升到第 37 周 78 小时。\u003c/li>\n\u003cli>行动是否需要调整：继续原动作但提高 US 线优先级。供应链负责人只对未锁价、未订舱或 ETA 紧贴 PBDD/Q4 节点的批次更新运费和 ETA 假设；EU 线不要因为综合指数上行而统一上调成本，必须按 Rotterdam/Genoa 实际报价验证。\u003c/li>\n\u003c/ul>\n\u003ch2>今日运营待办\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\n\u003cth>优先级\u003c/th>\n\u003cth>待办\u003c/th>\n\u003cth>站点\u003c/th>\n\u003cth>负责人\u003c/th>\n\u003cth>截止日期\u003c/th>\n\u003cth>验收标准\u003c/th>\n\u003cth>复查日期\u003c/th>\n\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>导出未到仓/未接收的 US、UK PBDD 促销 ASIN shipment list，核对 received units、available units、reserved units、Manage Deals/Coupons 可执行状态\u003c/td>\n\u003ctd>US/UK\u003c/td>\n\u003ctd>供应链 + 运营\u003c/td>\n\u003ctd>2026-09-20\u003c/td>\n\u003ctd>每个促销 ASIN 有库存状态结论；可售库存低于目标促销量 90% 的 ASIN 单独列异常处理人\u003c/td>\n\u003ctd>2026-09-22\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>更新未锁价 China-US/China-EU 订舱报价，与当前 landed cost 模型比较；仅当单件运费导致毛利率偏差超过 1 个百分点时触发价格/促销复核\u003c/td>\n\u003ctd>US/UK/EU\u003c/td>\n\u003ctd>供应链 + 财务\u003c/td>\n\u003ctd>2026-09-22\u003c/td>\n\u003ctd>输出 shipment ID、目的站点、报价、模型值、差异%、是否需要改促销毛利假设\u003c/td>\n\u003ctd>2026-09-25\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>筛选当前 SKU 与开发清单是否存在 heated、warming、electric、USB、battery、blanket、pad、warmer 风险词\u003c/td>\n\u003ctd>US\u003c/td>\n\u003ctd>合规 + 产品\u003c/td>\n\u003ctd>2026-09-22\u003c/td>\n\u003ctd>有命中则形成证据清单和补证责任人；无命中则记录“无相关 SKU，关闭动作”\u003c/td>\n\u003ctd>2026-09-25\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>持续关注\u003c/h2>\n\u003cul>\n\u003cli>事项：US Product Bundling 2026-09-30 风险清单。当前状态：本次未发现 Amazon 对 bundle/kit/set/multipack/refill pages 政策范围发布新的公开变化；仍按 2026-09-30 生效节点执行内部筛查。下次复查日期：2026-09-22。触发升级条件：Seller Central 出现 Account Health 提醒、ASIN 抑制、bundle 政策文本更新或执行范围扩大。\u003c/li>\n\u003cli>事项：商业责任险 2026-11-02 要求账号侧证据。当前状态：公开官方线索仍存在，但本次未发现 Amazon 新增公开解释；是否适用于当前账号仍以 Seller Central 后台通知、Account Health 和 AIA 入口为准。下次复查日期：2026-09-22。触发升级条件：后台出现强制通知、保险资料截止日、AIA 添加入口或类目/站点适用范围变化。\u003c/li>\n\u003cli>事项：Drewry WCI 与黄金周前运力管理。当前状态：2026-09-17 WCI 上升 1%，US Transpacific 运价继续上行，Asia-Europe 运价回落但上海等待时间上升。下次复查日期：2026-09-25。触发升级条件：China-US 报价较模型高出 5% 以上、关键 shipment ETA 推迟超过 3 天，或 PBDD/Q4 促销 ASIN 可售库存低于目标促销量 90%。\u003c/li>\n\u003c/ul>\n\u003ch2>情报边界与可信度\u003c/h2>\n\u003cp>本次核验来源约 14 个，其中官方/监管/一手来源约 10 个，包括中国政府网/国务院办公厅或国务院新闻办转载、Amazon Seller Central/Forums、Amazon Ads、About Amazon、CPSC、GOV.UK OPSS、USPS/PRC、EIA/BLS、Drewry、NRF 既有跟踪源；非官方或行业辅助来源约 4 个，仅用于排重和背景判断。纳入日报的新事件 1 条，纳入已有事件重要更新 1 条；仍待确认事项 3 条：PBDD/Deal ASIN 的账号内可售库存缺口、商业责任险对当前账号的实际适用范围、Product Bundling 2026-09-30 是否触发账号级提醒。\u003c/p>\n\u003cp>排除项：本次窗口内未发现 Seller Central 对 Listing、A+、图片、搜索词、属性、变体、FBA 费用或库存限制发布新的全量强制变更；Amazon Ads 未发布 US/UK/DE/FR/IT/ES 范围内 SP/SB/SD/DSP/AMC 计费、竞价、匹配或归因规则的全量强制变化；Amazon Prime Big Deal Days 与 AI shopping 相关文章多为活动预热或旧事实复述，未形成新的后台动作；USPS holiday surcharge、商业责任险、Product Bundling 本次未见新的公开官方口径；GOV.UK OPSS 与 CPSC 其他召回未发现与相册、补充页、school memory book、portfolio binder、puzzle accessories 直接匹配的高优先级动作。\u003c/p>\n\u003cp>工作日门禁来源：中国政府网/国务院办公厅《国务院办公厅关于2026年部分节假日安排的通知》（\u003ca href=\"https://www.gov.cn/zhengce/content/202511/content_7047090.htm；国务院新闻办转载页：https://www.scio.gov.cn/）。2026-09-18\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.cn/zhengce/content/202511/content_7047090.htm；国务院新闻办转载页：https://www.scio.gov.cn/）。2026-09-18\u003c/a> 为周五，不在 2026 年中秋节 2026-09-25 至 2026-09-27 或国庆节 2026-10-01 至 2026-10-07 等法定节假日范围内；2026-09-20（周日）为国庆节调休上班日，因此本周最后一个大陆法定工作日不是今天。\u003c/p>\n\u003cp>生产链接：\u003ca href=\"https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\" target=\"_blank\" rel=\"noopener noreferrer\">https://amazon-daily-intelligence-report.djoheinndi.chatgpt.site\u003c/a>\u003c/p>\n    \u003cfooter>亚马逊及海外市场情报 · 报告日期 2026-09-18\u003c/footer>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sections": [{"date": "2026-09-18", "text": "### CPSC 发布 JKMAX 加热毯/加热垫 Amazon 渠道召回\n\n- 【影响等级】P2\n- 【站点】US\n- 【发布日期】2026-09-17\n- 【生效日期】2026-09-17\n- 【信息状态】正式监管召回\n- 【来源】U.S. CPSC：https://www.cpsc.gov/Recalls/2026/JKMAX-Recalls-Heated-Blankets-and-Heating-Pads-Due-to-Fire-and-Burn-Hazards\n- 发生了什么：CPSC 发布 JKMAX Heated Blankets and Heating Pads 召回，风险为火灾和灼伤；公开信息显示产品经 Amazon.com 销售，涉及约 195,000 件。该事件不是 Amazon 平台全量政策变化，也不是相册/纸制品/收纳类直接召回。\n- 我们怎么看：对当前主线产品的直接销售影响低，但对“礼品化、家居化、电热类周边”产品开发有警示意义；如果团队未来扩展取暖、发热、带电池或电源适配器的礼品品类，合规门槛、测试报告和售后风险都会显著高于纸制品。\n- 建议动作：合规负责人在 2026-09-22 前用 SKU master / 产品开发清单筛选关键词 heated、warming、electric、USB、battery、blanket、pad、warmer；如无命中，在复查表记录“无相关 SKU，关闭动作”。如有命中，建立 ASIN/SKU、供应商、测试报告、说明书警示语、UL/ETL/FCC/电池文件、差评/退货原因字段清单，并由产品负责人确认是否暂停上新或补证。\n\n", "title": "CPSC 发布 JKMAX 加热毯/加热垫 Amazon 渠道召回", "kind": "intelligence", "detail_html": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"report-date\" content=\"2026-09-18\">\n  \u003ctitle>亚马逊及海外市场情报增量日报｜2026-09-18\u003c/title>\n  \u003cstyle>\n    :root { --ink:#172033; --muted:#667085; --line:#dce2ea; --blue:#155eef; --soft:#f7f9fc; }\n    * { box-sizing:border-box; }\n    body { margin:0; color:var(--ink); background:#eef2f7; font:15px/1.72 system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif; }\n    main { width:min(1180px,calc(100% - 28px)); margin:28px auto; padding:48px 52px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px rgba(16,24,40,.07); }\n    .report-title { margin:0 0 8px; font-size:32px; line-height:1.3; letter-spacing:-.02em; }\n    h2 { margin:38px 0 14px; padding-left:12px; border-left:4px solid var(--blue); font-size:
